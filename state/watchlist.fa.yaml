    تغییر -> 20 / پایه 25؛ دو ردیف با صعود هر دو؛ ثبت وضعیت رکود تورمی. 27 سپتامبر:
    رد طرح پس از تسویه رخ داد. مسیر تخلیه جمعه (برنت -2.1%، بازده 2ساله -3.5 واحد
    پایه، DXY -0.22%، ردیف GC +0.27%) طرحی را معامله کرد که ترامپ شنبه به‌طور علنی
    رد کرد (~18:00Z)؛ بازگشایی یکشنبه در 22:00Z ورودی را دوباره قیمت‌گذاری می‌کند
    - انتظار برنت 106-108، بازگشت بازده 2ساله به سمت 4.90 و پس دادن $12 رشد جمعه طلا
    از مسیر بخش کوتاه‌مدت منحنی می‌رود (تقاضا برای دارایی امن نیست). ادعای جدید 9e1829f8
    (0.6): نخستین تسویه برنت >=+2% در دوشنبه تا سه‌شنبه، ردیف GC را >=0.1% پایین‌تر
    از ردیف قبلی ثبت کند (اگر چنین تسویه‌ای ثبت نشود، نامشخص) - آزمون علامت معکوسِ
    سابقه 15/16 جلسات صعودی نفت؛ عدم تحقق همراه با بازده 30ساله >=5.50 و DXY نزولی،
    برداشت رکود تورمی است (پایه 25)، عدم تحقق همراه با بازده 2ساله صعودی و طلای صعودی،
    یک ردیف با صعود هر دو است (پایه). a270f3f1 (0.55) به سمت نتیجه نامشخص می‌رود (تسویه
    -3% تا سه‌شنبه به پیشنهاد متقابل رسمی آمریکا نیاز دارد). جنبشی 25: شاخه توافق
    طبق موضع علنی از دستور کار خارج است، شاخه فروپاشی (برنت >=110 -> طلای نزولی از
    مسیر بازده 2ساله) شاخه فعال است. ابطال‌کننده‌ها بدون تغییر: عدم تحقق a270f3f1
    همراه با بازده 2ساله بدون تغییر -> 20 / پایه 25؛ دو ردیف با صعود هر دو؛ ثبت وضعیت
    رکود تورمی. گزارش کوتاه 28 سپتامبر: رابطه معکوس در ششمین آخر هفته درگیری نظامی
    حفظ شد - برنت +1.7% (بیشینه +2.6%)، بازده 2ساله +3.7 واحد پایه، طلا -2.1% تا 4230.6
    با عبور نزولی از محدوده حمایتی 4244-4253؛ عبور بازده 30ساله از 5.50 همراه با طلای
    نزولی، نشانه خلاف فرض است (18 علیه / 2 موافق). واگرایی اندازه حرکت علامت‌گذاری
    شد: حرکت طلا ~3 برابر آن چیزی است که ورودی‌های نفت/بازده 2ساله در 23 سپتامبر ایجاد
    کردند - شکست محدوده حمایتی، پایان فصل، غیبت تقاضای چین؛ در هیچ‌یک از دو جهت، تقاضا
    برای دارایی امن نیست. 9e1829f8 امشب فعال است (تسویه برنت >=106.41 -> ردیف >=0.1%
    نزولی؛ ردیف همین حالا 70 واحد زیر 4299.7 یکشنبه است). علامت شاخه توافق بدون تغییر:
    تأیید دریافت یک متن قطری = تخلیه = 4253/4300، یک شکست نزولی ناموفق، نه یک رالی.
    گزارش کوتاه 30 سپتامبر: سه‌شنبه مسیر تخلیه بود، با بازده 2ساله که به‌سختی حرکت
    کرد (-3.3 واحد پایه) و طلا +1.41% در ردیف - دومین تقاضای کامل در مسیر تخلیه (25
    سپتامبر محو شد، 29 سپتامبر حفظ شد)، در برابر DXY +0.19% و بازده 10ساله/30ساله
    صعودی. a270f3f1 طبق متن دقیق نامشخص است (تسویه -2.55%، مرز -3%)، اما از نظر ماهوی
    شواهد علیه آن است؛ 9e1829f8 نامشخص (هیچ تسویه +2% رخ نداد). رابطه معکوس همچنان
    در مسیر صعود نفت برقرار است (دوشنبه +0.9%، طلا -3.3%، مسیر بخش بلندمدت منحنی/تسویه
    اجباری موقعیت‌ها)؛ مسیر نزول نفت اکنون برای طلا تقاضا ایجاد می‌کند. برداشت فعلی:
    نامتقارن، نه معکوس - نفت بالا = طلا پایین از مسیر بازده 2ساله، نفت پایین = طلا
    بالا از مسیر موقعیت‌گیری. دو جلسه؛ فرضیه‌ای با یک آزمون مشخص (تسویه بعدی قرارداد
    دسامبر برنت با افت >=2%: آیا ردیف با کاهش <5 واحد پایه‌ای بازده 2ساله، >=0.5%
    بالا می‌رود؟)، نه یک قاعده. گزارش کوتاه 2 اکتبر: نخستین جلسه صعود نفت / صعود طلا
    در این رژیم - پنج‌شنبه برنت +~4% (102.31)، DXY برابر با 101.996 (بالاترین سطح
    52هفته‌ای)، طلا +0.69% در ردیف همراه با بازده 2ساله -10 واحد پایه: مسیر نفت ->
    بازده 2ساله تحت‌الشعاع کانال رهبری فدرال رزرو قرار گرفت (صبر جفرسون/ویلیامز، انتقال
    زمان‌بندی گلدمن به دسامبر). تقاضا برای دارایی امن نیست - طلا همراه با اوراق خزانه
    بالا رفت. یک جلسه = فرضیه (قاعده 11)؛ مضمون «حمله = افزایش نرخ بهره + اخطار تأمین
    وجه تضمین» برای یک اقدام عملی برقرار است؛ تقویت آرایش نظامی (ناو هواپیمابر 3ام)
    که در برنت قیمت‌گذاری شد، به بازده 2ساله نرسید. BofA همان روز: «نفت بزرگ‌ترین
    دشمن طلاست»، ریسک <4000 - این زنجیره به‌عنوان دیدگاه مؤسسه. گزارش کوتاه 3 اکتبر:
    جمعه زنجیره را در هر دو جهت طی یک جلسه اجرا کرد - بازده 2ساله هنگام انتشار داده
    -9 واحد پایه، طلا +50؛ بازده 2ساله از کف +15 واحد پایه بالا آمد تا با +4 واحد
    پایه بسته شود، هم‌زمان با بازیابی برنت از 98.4 -> 102.25، طلا از سقف -97، در حالی
    که DXY تمام روز نزولی بود. هفت اصابت به بدنه کشتی‌ها در هرمز طی یک هفته + یک ناو
    هواپیمابر سوم + گزارش رویترز درباره عملیات تهاجمی عربستان: برنت بدون تغییر تسویه
    شد، هیچ‌چیز به بازده 2ساله نرسید، هیچ‌چیز به طلا نرسید. سومین جلسه طلا = f(بازده
    پایانی 2ساله) با DXY در بالاترین سطح 52هفته‌ای (30 سپتامبر / 1 اکتبر / 2 اکتبر):
    سه مورد لازم قاعده 11 تکمیل شده‌اند، آزمون علامت اکنون یک برداشت است؛ به‌عنوان
    ادعایی با وزن 0.6 برای دوشنبه تا جمعه 5-9 اکتبر ثبت شد. گزارش کوتاه 5 اکتبر: بازگشایی
    یکشنبه چهارمین الگوی سازگار با زنجیره است: بازده 2ساله -1.5 واحد پایه، طلا +0.2%
    (4169، بیشینه 4191)، برنت -0.8% در واکنش به هشتمین اصابت به بدنه کشتی + ادعاهای
    حوثی‌ها؛ DXY +0.44% تا بالاترین سطح 52هفته‌ای (102.53) بر اثر یورو (OAT-Bund >140
    واحد پایه) و طلا صعودی - مسیر دلار این هفته منشأ خارج از آمریکا دارد و نقش فرعی
    ایفا می‌کند (واگرایی جدید در موضع تحلیلی). 306d7862 / 968df4d5 جلسه اول = ردیف
    دوشنبه در برابر بازده پایانی 2ساله دوشنبه.'
