- theme: middle-east-risk-premium
  why_fa: 'دو وضعیت: کنترل سپاه پاسداران بر عبور و مرور هرمز در برابر محاصره آمریکا،
    همراه با تبادل آشکار آتش از 30-31 اوت، و جبهه دوم دریای سرخ که در 19 سپتامبر به
    ریاض رسید - اکنون رسماً ثبت شده است (ائتلاف به رهبری عربستان، آسوشیتدپرس به نقل
    از گلف نیوز، 20 سپتامبر): یک موشک بالستیک حوثی‌ها هنگام سپیده‌دم به سوی پایتخت،
    رهگیری شد؛ تلاش‌ها برای حمله به زیرساخت‌های غیرنظامی در ینبع، طائف، بیش و فرسان
    «خنثی شد»؛ دود در نزدیکی فرودگاه بین‌المللی ملک خالد (KKIA)، اختلال در پروازها،
    بدون تلفات یا خسارت؛ حمله به حوثی‌ها («تحت حمایت ایران») نسبت داده شده، نه ایران.
    ادعای حوثی‌ها درباره «آتش‌سوزی‌های عظیم» در تأسیسات آرامکو در ینبع: بدون شواهد،
    آرامکو اظهارنظر نکرد (قاعده 12 - به‌معنای تحقق اصابت به ینبع نیست). حوثی‌ها مخا
    و جزایر باب‌المندب را در اختیار دارند؛ نخستین مرگ غیرنظامی در 17 سپتامبر (بقایای
    پهپاد)؛ پهپاد مکه در 16 سپتامبر. آمریکا: «هیچ حمله تهاجمی‌ای انجام نداده» (CNN)
    - صرفاً اطلاعات و هدف‌گیری؛ محمد بن سلمان دو بار از ترامپ درخواست کرد؛ ترامپ:
    «حوثی‌ها با ما تماس گرفتند... اختلافشان با عربستان است». بازیگر جدید: فیدانِ ترکیه
    - آنکارا در چارچوب پیمان ترکیه-عربستان-پاکستان، برای «تأمین» نیازهای نظامی عربستان
    «با هیچ مشکلی روبه‌رو نخواهد شد». واشینگتن، 19 سپتامبر: ترامپ اقامت در کمپ دیوید
    را کوتاه کرد و بدون توضیح به کاخ سفید بازگشت؛ وزارت خارجه هشدار فراگیر سفر به
    خاورمیانه را تمدید کرد («احتمال تشدید سریع اوضاع»)، 11 سفارت؛ «تصمیم بزرگ» ترامپ
    درباره ازسرگیری عملیات عمده علیه تهران (آکسیوس، 17 سپتامبر)، رویداد دوحالتیِ بدون
    زمان‌بندی این هفته است. تهران، 19 سپتامبر (رضایی در گفت‌وگو با الجزیره): هفت شرط
    برای آغاز مذاکرات از طریق قطر منتقل شده، همه آن‌ها افشا نشده‌اند؛ سه خواسته برای
    پایان جنگ - توقف درگیری در همه جبهه‌ها (از جمله یمن-عربستان)، آزادسازی دارایی‌های
    مسدودشده، رفع محاصره دریایی آمریکا؛ در انتظار ترامپ؛ متن ایران-عمان درباره هرمز
    در «یک قدمی» اعلام، کنار گذاشته شده، «ممکن است تأیید منطقه‌ای لازم باشد»؛ برنامه‌ریزی
    نظامی «متمرکز بر دارایی‌های دریایی آمریکا» از خلیج فارس -> دریای عرب؛ آزمایش موشک
    ضدکشتی در نزدیکی یک ناو هواپیمابر آمریکا (تأییدنشده)؛ درباره خروج از NPT تصمیمی
    گرفته نشده است. یک‌طرفه - 645cc78a (تا 22 سپتامبر) همچنان برقرار است. نقوی (پاکستان)
    روز یکشنبه 20 سپتامبر در تهران، بدون پیام شناخته‌شده‌ای از آمریکا. کوپر از سنتکام،
    19 سپتامبر: 1 میلیارد بشکه طی دو ماه با حمایت آمریکا عبور کرده، ایران «صفر بشکه
    صادر کرده»، مسیرهای اصلی از مین پاک‌سازی شده‌اند، حجم عبور در بازه دو هفته‌ای
    به بالاترین سطح شش‌ماهه رسیده است (ناظران: همچنان بسیار پایین‌تر از پیش از جنگ)؛
    سخنگوی ایران: «عملیات روانی». هرمز (gcaptain، 18 سپتامبر): سه هشدار UKMTO از 16
    سپتامبر، 22 مورد از 35 حمله از 6 ژوئیه در مسیر جنوبی، حدود 60 میلیون بشکه آرامکو
    در سپتامبر-اکتبر از طریق انتقال کشتی‌به‌کشتی (STS) در صحار از هرمز عبور می‌کند،
    تعمیر کامل خط لوله شرق-غرب 5-6 هفته. نردبان: زیرساخت خارک/لارک 010cb839 محقق شده
    -> d96debd5 (تا 26 سپتامبر)؛ وضعیت سمت خلیج فارس ffd190c0 محقق شده -> 2df323fa
    (تا 26 سپتامبر)؛ خویشتن‌داری عربستان e0e5cd9c و اسکورت‌ها a0429ae4 یکشنبه 20 سپتامبر
    ساعت 23:59Z بسته می‌شوند (هر دو در مسیر تحقق: انتساب به حوثی‌ها، بدون تلفات؛ کوپر
    در حال تمجید از مأموریت)؛ شناور سعودی 9e629d6e (23 سپتامبر). نشانه‌ها: پاسخ ترامپ
    به شروط قطر؛ هرگونه دستور حمله آمریکا؛ گزارش‌های SPA درباره خسارت؛ انتساب حمله
    از سوی عربستان به عاملی فراتر از حوثی‌ها؛ استقرار نیروهای ترکیه/پاکستان؛ گزارش‌های
    کاخ سفید / شورای همکاری خلیج فارس از نشست‌های مجمع عمومی سازمان ملل در روز سه‌شنبه؛
    نام‌های اعلام‌شده توسط UKMTO؛ مطلبی از آرامکو درباره خط لوله شرق-غرب؛ تاریخی از
    سوی عمان برای صلاله.'
