  why_fa: 'جنگ در قالب افزایش نرخ بهره فدرال رزرو و اخطار تأمین وجه تضمین به طلا می‌رسد،
    نه در قالب تقاضا برای دارایی امن. چهارده جلسه شواهد از 2 تا 21 سپتامبر، با شدیدترین
    نمونه در 21 سپتامبر (اصابت به دو نفتکش، نفت -3.7%، طلا -1.0%، BTC +7.1%). موارد
    مخالف: یک مورد (9 سپتامبر). 22 سپتامبر - مرحله تنش‌زدایی: یک دور مذاکره آمریکا
    و ایران با تأیید هر دو طرف، برنت در 99.25 تسویه شد (-1.1%، پنج جلسه نزولی)، طلای
    نقدی +0.5% / ردیف بدون تغییر، منحنی بازده 1.5-2.3bp صعودی، دلار در اواخر معاملات
    تضعیف شد، سپس طی شب تقویت شد و طلا رشدش را پس داد. بند جریان معاملات درباره محرک
    (قاعده 23): حدود 18:30Z ثبت شد، GC در پایان معاملات Globex از 4390 -> 4396 رفت
    - هدف در هر دو جهت محقق نشد، وزن‌ها حفظ شدند. دریچه: صعود نفت باعث فروش طلا می‌شود
    (از مسیر بازده 2ساله)؛ افت نفت بر اثر دیپلماسی، طلا را بدون تغییر تا نزولی باقی
    می‌گذارد (صرف خود طلا تخلیه می‌شود، بازده 2ساله همراهی نمی‌کند) - تنها مسیر صعود
    طلا، افت بازده 2ساله است که به یکی از اعضای هیئت‌مدیره فدرال رزرو یا تغییری تعیین‌کننده
    در داده‌های آمریکا نیاز دارد، نه یک تیتر خبری. ادعاها: 64c7ba41 در 23 سپتامبر
    نامشخص (دوشنبه/سه‌شنبه تسویه صعودی نفت ثبت نشد)؛ جانشین آن 8e425cab (0.5) در نخستین
    تسویه صعودی نفت برنت از چهارشنبه تا جمعه فعال می‌شود (ردیف <+1% = محقق؛ نبود آن
    = نامشخص)؛ f7a0c23d (0.55): هیچ تسویه برنت >=103 از چهارشنبه تا جمعه ثبت نمی‌شود
    - ادعای تخلیه صرف. موارد تأییدکننده: تسویه صعودی نفت همراه با طلای بدون تغییر/نزولی؛
    حمله آمریکا به ایران که با افت طلا قیمت‌گذاری شود؛ متنی با تأیید هر دو طرف که
    با نفت -5% و طلای نزولی قیمت‌گذاری شود. موارد ابطال: عدم تحقق 8e425cab -> درگیری
    نظامی 35؛ دو ردیف پیاپی با طلای صعودی / بازده 2ساله صعودی؛ طلا +1% در جلسه نزولی
    نفت با بازده 2ساله بدون تغییر؛ رویداد عرضه‌ای که به‌صورت رکود تورمی معامله شود
    (صعود انتهای بلندمدت منحنی، دلار نزولی، طلا صعودی)؛ متنی که با برنت -5%، طلای
    صعودی و بازده 2ساله بدون تغییر قیمت‌گذاری شود -> درگیری نظامی 25. 24 سپتامبر:
    8e425cab محقق شد - نخستین تسویه صعودی نفت (103.08، +3.9%) ردیف طلا را در -1.74%
