    انتظارات؛ بانک مرکزی کانادا نرخ بهره را ثابت نگه داشته است. هنوز هیچ جریان سرمایه‌ای
    از این بابت به‌سوی طلا به‌عنوان دارایی امن شکل نگرفته است. تنها در صورتی از وضعیت
    زنگ خطر ارتقا یابد که شاخص قیمت مصرف‌کننده (CPI) آمریکا یا یکی از سخنرانان فدرال
    رزرو تعرفه‌ها را به‌عنوان عامل محرک معرفی کند؛ نامزد حذف در دوشنبه 21 سپتامبر
    - طی چهار هفته هیچ اثری به طلا نرسیده است.'
