  why_fa: 'پل ارتباطی جنگ با فدرال رزرو: انتقال نفت به شاخص قیمت مصرف‌کننده (CPI)،
    کانال فعال احتمال افزایش نرخ بهره است، و نفت در روزهای فاقد رویداد فدرال رزرو
    تعیین‌کننده قیمت طلاست - در هر دو جهت. قیمت تسویه 15 سپتامبر: WTI برابر 105.83
    / برنت 108.75 (سقف 109.97)؛ از آن زمان 5 تسویه پایین‌تر: برنت در 21 سپتامبر 100.34،
    برنت در 22 سپتامبر 99.25 (نخستین تسویه زیر 100 در دو هفته؛ 98.78 در ساعت 03:30Z
    چهارشنبه)، WTI نوامبر حدود 89-90.5 (قرارداد اکتبر در 22 سپتامبر منقضی شد) - در
    پی راه‌اندازی مجدد خط لوله شرق-غرب عربستان (به‌صورت جزئی، با تغییر مسیر تا 4 میلیون
    بشکه در روز)، ازسرگیری صادرات ینبع، بارگیری حدود 12 میلیون بشکه در یک روز (Gulf
    News)، رفت‌وآمدهای شاتلی در هرمز/جریان‌های فاقد سیگنال AIS، دور مذاکرات آمریکا
    و ایران که هر دو طرف تأییدش کردند، و خبر افزایش ذخایر API در برابر انتظار کاهش.
    بخش دچار تنگنا، فرآورده‌هاست: گازوئیل در سطوح رکوردی، سوخت جت در پی آن (MarketWatch)،
    ترامپ از ممنوعیت صادرات گازوئیل حمایت می‌کند و می‌گوید تصمیم «سریع» گرفته می‌شود
    (تحلیلگران: آسیب می‌زند، کمک نمی‌کند). سطوح fxempire: حمایت برنت 97-97.5 و سپس
    میانگین متحرک 50 دوره‌ای در 92.44، مقاومت 102/105؛ حمایت WTI در 90.47 و سپس 87.7.
    آزمون این موضع: برنت <100 همراه با بازده 2ساله >=4.70 = عدم تقارن تأیید شده، امتیاز
    دیدگاه نزولی ناشی از نرخ‌ها روی 50 می‌ماند - در 22 سپتامبر محقق شد (برنت 99.25،
    حراج اوراق 2ساله 4.787، منحنی رو به بالا)؛ برنت <100 و بازده 2ساله <4.70 = از
    دست رفتن عامل مبنا (امتیاز دیدگاه نزولی ناشی از نرخ‌ها 45) هنوز محقق نشده است.
    انتقال یک‌طرفه در اظهارات ثبت‌شده (اشمید، کشکاری، موسالم، بارکین: «شوک‌های مداوم
    در قیمت‌گذاری تثبیت شده‌اند»، برآورد وارش از PCE حدود 3.6)؛ در خارج نیز همین‌طور:
    ناگل از ECB: «نفت اکنون سنجه کلیدی تورم است، سیاست اندکی محدودکننده منتفی نیست»،
    لین: «شوک انرژی بیشتر طول می‌کشد، تورم تا میانه 2027 بالا می‌ماند»؛ PMI مقدماتی
    استرالیا 50.8 با هزینه نهاده‌ها در بالاترین سطح 3ماهه. زنجیره تأمین: خط شرق-غرب
    تا حدی فعال، ینبع در حال ازسرگیری، ایران صفر (CENTCOM)؛ ممنوعیت صادرات گازوئیل
    روسیه تمدید شد؛ BofA پیش‌بینی برنت برای H2 را افزایش داد (Investing.com، خوانده
    نشده). گزاره‌ها: 4dfbd1d8 (رقم کل سپتامبر >=0.4، 0.65)؛ 62c34dbd (هسته <=0.3،
    0.7)؛ بررسی میانه‌دوره طبق rule-11 در 30 سپتامبر؛ f7a0c23d (هیچ تسویه برنت >=103
    از چهارشنبه تا جمعه، 0.55)؛ 8e425cab در نخستین تسویه صعودی نفت اجرا می‌شود. 24
    سپتامبر: برنت با وجود افزایش 3 میلیون بشکه‌ای ذخایر نفت خام (ذخایر بنزین و فرآورده‌های
    تقطیری کاهش یافت)، راه‌اندازی مجدد خط شرق-غرب و صادرات عراق >3 میلیون بشکه در
    روز، در 103.08 (+3.9%) تسویه شد - صرف ریسک بر اساس اظهارات درباره هرمز بازقیمت‌گذاری
    می‌شود، نه بشکه‌ها؛ 102.10 در ساعت 03:30Z. فرآورده‌ها: کاخ سفید با وجود مخالفت
    کابینه «به ممنوعیت 90روزه صادرات گازوئیل نزدیک‌تر می‌شود» (تکذیب قبلی کاخ سفید؛
    گازوئیل پس از نوسان رفت‌وبرگشتی شدید، اندکی پایین‌تر تسویه شد)؛ سناتورهای هر دو
    حزب خواستار آزادسازی اضطراری نفت گرمایشی هستند؛ قیمت رکوردی گازوئیل در حال انتقال
    به قیمت مواد غذایی است (MarketWatch). ممنوعیت، مؤلفه انرژی شاخص قیمت مصرف‌کننده
    (CPI) آمریکا را اندکی تعدیل می‌کند و هم‌زمان تنگنای جهانی را تشدید می‌کند - گزاره‌های
    سپتامبر (4dfbd1d8 / 62c34dbd) این اثر را در بر می‌گیرند، بررسی میانه‌دوره در 30
    سپتامبر. واردات نفت آسیا همچنان 13% پایین‌تر از پیش از جنگ است (Gulf News). آزمون
    عدم تقارن همچنان برقرار است: برنت <100 همراه با بازده 2ساله >=4.70 در 22 سپتامبر
    تأیید شد؛ بازده 2ساله در صعود نفت هم از آن پیروی نکرد - پیشتاز بود (PMI). 25 سپتامبر:
    برنت در 106.60 تسویه شد (+3.4%، بالاترین قیمت پایانی از 15 سپتامبر؛ +5% در سقف‌ها)،
    WTI در 94.61 (روند نزولی شش‌جلسه‌ای متوقف شد)، در پی حملات موشکی حوثی‌ها به ینبع/طائف؛
    سپس در معاملات شبانه با گزارش توافق مرحله‌ای -1% (105.55 در ساعت 03:31Z). ینبع
    مسیر جایگزین شرق-غرب است: investinglive می‌گوید بارگیری نفتکش‌ها در آنجا «هنوز
    از سر گرفته نشده است»، در برابر گزارش 24 سپتامبر Gulf News مبنی بر «12 میلیون
    بشکه در یک روز» - تعارض، شنبه از طریق gcaptain حل شود. فرآورده‌ها: رایت در حال
    نظرخواهی از پالایشگران درباره محدودیت‌های داوطلبانه صادرات گازوئیل است (گزارش
    ممنوعیت 90روزه را رد می‌کند)؛ اتحادیه اروپا هشدار می‌دهد ممنوعیت به هر دو طرف
    آسیب می‌زند. آرامکو در حال بررسی مسیرهای صادراتی 4ام و 5ام است. بررسی میانه‌دوره
    در 30 سپتامبر (4dfbd1d8 / 62c34dbd). تاریخ PCE اوت تا 26 سپتامبر در خوراک خبری
    نیست (برآورد وارش حدود 3.6% سال‌به‌سال) - شنبه راستی‌آزمایی شود. 26 سپتامبر: برنت
    در 104.32 تسویه شد (-2.1%، -$3 نسبت به سقف‌ها؛ +5.1% هفته‌به‌هفته از 99.25)، WTI
    در 92.44 (-2.3%)، در پی طرح هفت‌روزه عراقچی؛ سررسیدهای کوتاه‌مدت نیز پیروی کردند
    (-3.5 واحد پایه) - به kinetic-transmission-inverted مراجعه شود. تاریخ PCE تأیید
    شد: چهارشنبه 30 سپتامبر ساعت 12:30Z (تقویم actionforex + چشم‌انداز هفته پیش روی
    Wells Fargo) - اجماع برای رقم کل 0.4 ماه‌به‌ماه / 3.7% سال‌به‌سال، هسته 0.3 /
    3.4%؛ بازنگری‌های سالانه BEA در همان انتشار («روند کوتاه‌مدت ملایم‌تر، رقم اوت
    داغ‌تر»)؛ بیدارباش #62 برای زمان انتشار+45 (13:15Z) ثبت شد - به b934960e امتیاز
    می‌دهد (بدون انتقال <55%) و بررسی میانه‌دوره طبق rule-11 را برای 4dfbd1d8 / 62c34dbd
    اجرا می‌کند (میانگین برنت سپتامبر حدود 103-104 در برابر حدود 90 در اوت بوده است:
    گزاره رقم کل >=0.4 در مسیر تحقق است؛ هسته <=0.3 به مسکن/سفر وابسته است). اجماع
    مؤلفه قیمت‌های پرداختی ISM پنجشنبه ساعت 14:00Z برابر 72 (از 71.1). تعارض بارگیری
    ینبع حل نشده است (جست‌وجوی gcaptain: هیچ مطلبی با تاریخ پس از 3 اوت؛ گزارش 24
    سپتامبر Gulf News با عنوان «جهش هفت‌برابری، فاقد سیگنال AIS» تنها گزارش تاریخ‌دار
    باقی می‌ماند). Kpler: جریان نفت خام هرمز این هفته 33.7 میلیون بشکه در برابر 49.2
    میلیون در هفته گذشته - بخش فیزیکی دچار تنگنای بیشتری شد، در حالی که صرف ریسک تخلیه
    شد. 27 سپتامبر: برنت نوامبر 104.32 (تسویه جمعه؛ قرارداد نوامبر چهارشنبه 30 سپتامبر
    منقضی می‌شود - نماد @LCO.1 در CNBC آن روز به دسامبر منتقل می‌شود، بنابراین هر
    گزاره درباره تسویه برنت که بازه آن چهارشنبه را در بر بگیرد، قرارداد را مشخص می‌کند،
    قاعده 17؛ a270f3f1 و 9e1829f8 سه‌شنبه بسته می‌شوند، بدون تأثیر)، WTI نوامبر 92.44
    (-8% هفته‌به‌هفته از حدود 100.30؛ actionforex: میانگین متحرک نمایی 55روزه در 89.14
    و سطح بازگشت 50% در 86.90 سطوحی هستند که شکستنشان نشان می‌دهد صعود ناشی از جنگ
    تمام شده است - به آن‌ها نرسیده). مخالفت ثبت‌شده ترامپ (شنبه)، طرحی را که صرف ریسک
    را تخلیه کرده بود کنار می‌زند؛ انتظار بازقیمت‌گذاری صعودی در آغاز معاملات یکشنبه.
    بخش فیزیکی دچار تنگنای بیشتری شد، در حالی که صرف ریسک کاهش یافت (Kpler: 33.7 میلیون
    در برابر 49.2 میلیون بشکه). تعارض بارگیری ینبع همچنان حل نشده است. تورم انتظاری
    یک سال آینده در نظرسنجی UMich برابر 4.6%. PCE چهارشنبه ساعت 12:30Z (اجماع 0.4/3.7،
    هسته 0.3/3.4): بررسی عمیق #62 بررسی میانه‌دوره طبق rule-11 را برای 4dfbd1d8 /
    62c34dbd اجرا می‌کند (میانگین برنت سپتامبر حدود 103-105 در برابر حدود 90 در اوت:
    گزاره رقم کل >=0.4 در مسیر تحقق است؛ هسته <=0.3 به مسکن/سفر وابسته است). قیمت‌های
    پرداختی ISM پنجشنبه (اجماع 72). گزارش کوتاه 30 سپتامبر: بررسی میانه‌دوره طبق rule-11
    اجرا شد - برنت سپتامبر در تمام ماه در محدوده 100-109 تسویه شد (+10% ماه‌به‌ماه
    طبق مرور؛ WTI سومین رشد ماهانه متوالی را ثبت کرد)، در برابر حدود 90 در اوت: عامل
    سوخت برای شاخص قیمت مصرف‌کننده (CPI) سپتامبر پابرجاست، 4dfbd1d8 (رقم کل >=0.4)
    با سازوکاری فعال باز می‌ماند؛ در اطلاعات تازه، بازقیمت‌گذاری مخابرات یا برآورد
    جاری مسکن مخابره نشده است - 62c34dbd (هسته <=0.3) بر مبانی خود پابرجاست، تأییدنشده.
    شاخص قیمت مصرف‌کننده (CPI) استرالیا به‌دلیل سوخت 4.0% (میانگین پیراسته 0.2)، همان
    انتقال اثر در خارج است؛ RBA برابر 4.60، Westpac نوامبر را پیش‌بینی می‌کند. PCE
    امروز: اجماع 0.4/3.7، هسته 0.3/3.4، بازنگری‌های BEA در همان انتشار. برنت نوامبر
    چهارشنبه منقضی شد - گزاره‌های تسویه، قرارداد دسامبر را مشخص می‌کنند (قاعده 17).
    گزارش کوتاه 2 اکتبر: کانال نزولی نفت برای بخش فرآورده‌ها - آمریکا تهدید به ممنوعیت
    صادرات گازوئیل می‌کند مگر اینکه اروپا حدود 120 میلیون بشکه را «فوراً» آزاد کند؛
    رایت «بسیار مطمئن» است که اروپا آزادسازی می‌کند؛ حاشیه سود گازوئیل اتحادیه اروپا
    با این اظهارات -7%؛ توقف صادرات سوخت چین در پس‌زمینه. نفت خام بی‌تأثیر (برنت دسامبر
    102.31، پنجشنبه +4% در واکنش به موضع‌گیری). میانگین سوخت سپتامبر قطعی شده است
    -> 4dfbd1d8 (رقم کل شاخص قیمت مصرف‌کننده (CPI) سپتامبر >=0.4) بی‌تأثیر؛ آزادسازی
    بر رقم اکتبر اثر می‌گذارد. قیمت‌های پرداختی ISM برابر 77.9 (فولاد، آلومینیوم،
    نفت، تعرفه‌ها) = بخش هزینه نهاده‌ها همچنان در حال افزایش است. گزارش کوتاه 4 اکتبر:
    بررسی میانه‌دوره طبق rule-11 برای دو گزاره شاخص قیمت مصرف‌کننده (CPI)، بر اساس
    برآورد جاری فدرال رزرو کلیولند (استخراج‌های صفحه؛ 2 اکتبر): رقم کل سپتامبر 0.53،
    هسته 0.20، سال‌به‌سال 3.60/2.39؛ اکتبر تا این تاریخ 0.22/0.20. اجماع TE برای انتشار
    14 اکتبر: رقم کل 0.5 (سال‌به‌سال 3.7)، هسته 0.3 (2.5). 4dfbd1d8 (رقم کل >=0.4)
    اجماع و برآورد جاری را همراه خود دارد؛ 62c34dbd (هسته <=0.3) برآورد جاری را همراه
    خود دارد و اجماع در مرز آن است. شاخص قیمت تولیدکننده (PPI) پنجشنبه 15 اکتبر (اجماع
    0.5). آزادسازی 100 میلیون بشکه‌ای G7/IEA (با تمرکز عرضه گازوئیل در 20 روز نخست)
    عاملی برای رقم اکتبر است، نه سپتامبر. 8 اکتبر: برنت دسامبر در ساعت 03:31Z پنجشنبه
    102.32 (+2.1%)، در پی توفان گرمسیری ایزایاس (4 تأسیسات Chevron + 5 تأسیسات Shell
    در بخش آمریکایی خلیج مکزیک تعطیل شده‌اند؛ Mars، Olympus، Ursa، Vito، Appomattox
    تخلیه شده‌اند؛ حجم‌ها اعلام نشده‌اند) و نفتکش قطر؛ چهارشنبه پس از داده EIA برابر
    -3.19 میلیون بشکه در برابر انتظار +1.7، حدود 100.20 تسویه شد (WTI برابر 88.48،
    -0.96) - بازار در همان روز اثر تلفات ریاض و حمله به قطر را پس گرفت. اعضای IEA
    از آزادسازی سریع‌تر ذخایر حمایت می‌کنند (The National)؛ کارگروه اتحادیه اروپا
    درباره طرح G7 تشکیل جلسه می‌دهد؛ حاشیه سود گازوئیل >10%. نظرسنجی SCE فدرال رزرو
    نیویورک: تورم انتظاری بنزین 4.8%. صورت‌جلسه: «هرچه قیمت‌های انرژی مدت بیشتری بالا
    می‌ماند، خطر» سرایت بیشتر می‌شد - نفت اکنون یک عامل صریح در تصمیم‌گیری فدرال رزرو
    است (investinglive: «شوک‌های بیشتر عرضه، دلایل سیاست انقباضی را تقویت می‌کنند،
    به‌جای آنکه نادیده گرفته شوند»). شاخص قیمت مصرف‌کننده (CPI) در 14 اکتبر: اجماع
    رقم کل 0.5، برآورد جاری 0.53.'
