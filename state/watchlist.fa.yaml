  why_fa: 'کف ساختاری تقاضا: ~289t تقاضای رسمی در این چرخه، همراه با ازسرگیری ورود
    سرمایه به ETFها، و تنوع‌بخشی ذخایر با خروج از اوراق خزانه به‌عنوان همتای آن در
    سمت جریان سرمایه (دارایی‌های UST چین در پایین‌ترین سطح از 2008؛ UBS در 9 سپتامبر
    دیدگاه بلندمدت خود را حفظ می‌کند؛ گلدمن در 18 سپتامبر هدف $5,400 را با وجود افزایش
    نرخ بهره حفظ می‌کند). واکنش انتقال محل نگهداری در حال گسترش است (DNB، انتقال 86t
    به لندن و فرانسه؛ ونزوئلا در حال بررسی انتقال $4bn از لندن -> آمریکا). SGE برابر
    با 942/g (20 سپتامبر). در مقابل: روسیه فروشنده‌ای مستمر است؛ یک مؤسسه پژوهشی (investinglive،
    23 سپتامبر) به‌دلیل دلار + فدرال رزرو انقباضی انتظار کاهش بیشتر در Q4 را دارد،
    اما به‌دلیل ژئوپلیتیک و خرید رسمی، یک «کف محکم حوالی $3,800» را پیش‌بینی می‌کند.
    کف در عمل: 4300 در GC (~4265 نقدی) - آزمون‌ها در 14 سپتامبر 4305.9، در 15 سپتامبر
    4304.0، در 16 سپتامبر تیک 4296.7 در 22:19Z، سپس بازگشت به 4424.9 در جمعه 18 سپتامبر؛
    کف 4335.0 در 22 سپتامبر در پی «نابودی یا توافق» ترامپ + بازگشت برنت به 100 حفظ
    شد، سپس ردیف 4402.2 ثبت شد. d571e0f0 در 23 سپتامبر محقق شد - کف‌ها در این رژیم
    9/9، همگی با 0.55 ثبت شده‌اند (شکاف کالیبراسیون، منطق فاصله در قاعده 20)، و تک‌تک
    بازگشت‌ها با عقب‌نشینی نفت از اوج‌هایش یا جلسه‌ای با کاهش بازده‌ها همراه بودند؛
    هنوز هیچ خریدی در افت دقیقاً روی خط در روز صعود نفت دیده نشده است. آزمون دهم فعال
    است: 717f560c (هیچ ردیف GC_CLOSE برابر با <=4300.0 از چهارشنبه 23 تا جمعه 25 سپتامبر
    نباشد، 0.55؛ 73 واحد زیر قیمت نقدی، 0.43x دامنه سه جلسه). تأییدکننده‌ها: داده‌های
    ماهانه WGC حاکی از خرید خالص در طول افت باشند (فید wgc همچنان 503)؛ خرید در افت
    در محدوده 4300-4340 در روز صعود نفت. ابطال‌کننده‌ها: دو ماه متوالی فروش خالص رسمی.
    24 سپتامبر: گلدمن هدف پایان 2026 را به $4,650 کاهش می‌دهد و $5,400 را برای 2027
    حفظ می‌کند (investinglive ICYMI) - سمت فروش رژیم کوتاه‌مدت نرخ‌های بهره را می‌پذیرد.
    آزمون دهم کف فعال است: 717f560c چهارشنبه را پشت سر گذاشت (ردیف 4325.5)؛ کف شبانه
    4309.0 در 02:06Z، با فاصله نه واحد از خط، در جلسه‌ای که بازده 2y بدون تغییر بود
    - خریدی در افت مشهود نیست، بازگشت به 4324 با برنت -1% در پی گزارش نقشه راه همراه
    شد. SGE برابر با 936.61 (21 سپتامبر)؛ چین جمعه تعطیل است + هفته طلایی در هفته
    آینده، بنابراین امکان ارزیابی بازار فیزیکی از دست می‌رود. 25 سپتامبر: آزمون دهم
    کف - ردیف پنج‌شنبه 4309.5 (حفظ شد)، اما کف تیک در 15:35Z برابر با 4282.9 بود،
    در جلسه صعود نفت با بازده 2y بدون تغییر (زیر 4300 بر مبنای تیک، نه ردیف؛ با همین
    قید ثبت شد). بازگشت از کف با گزارش توافق مرحله‌ای در 16:18Z (برنت -3) و طی شب
    با برنت -1% رخ داد - تقاضای خرید در زمان افت نفت، همچنان بدون خرید در افت دقیقاً
    روی خط در روز صعود نفت. نرخ تثبیت PM برای XAU برابر با 4266.4، و AM برابر با 4255.55.
    آخرین جلسه 717f560c جمعه است. چین جمعه (جشن نیمه پاییز) و 1-8 اکتبر (هفته طلایی)
    تعطیل است: SGE تعطیل، امکان ارزیابی بازار فیزیکی برای یک هفته از دست رفته - تقاضای
    خرید ضعیف زیر هر آزمون 4300. 26 سپتامبر: 717f560c محقق شد - کف‌ها در این رژیم
    10/10، همگی در 0.55 (ردیف‌های 4325.5 / 4309.5 / 4321.2؛ کف تیک پنج‌شنبه در 4282.9
    در جلسه صعود نفت از خط عبور کرد، اما ردیف عبور نکرد). این هفته هیچ ادعای فعالی
    درباره کف وجود ندارد (قاعده 20: فاصله 4300 از ردیف، 21 واحد / 0.15x دامنه دو جلسه
    است). نرخ تثبیت PM برای XAU در جمعه 4261.05، و AM برابر با 4290.75. چین از پنج‌شنبه
    در 1-8 اکتبر (هفته طلایی) تعطیل است: SGE تعطیل، تقاضای خرید فیزیکی زیر 4300 برای
    یک هفته ضعیف است. همچنان هیچ خریدی در افت دقیقاً روی خط در روز صعود نفت دیده نشده؛
    بازگشت جمعه بخش حرکت همراه با افت نفت / افت بازده 2y بود. گزارش کوتاه 3 اکتبر:
    موقعیت خالص سفته‌بازی 210.2K (29 سپتامبر)، -7.5K / -3.5% نسبت به هفته قبل - موقعیت‌های
    کاغذی پیش از انتشار داده کاهش یافتند؛ ردیف 4162.3، به‌اندازه 25-28 واحد بالاتر
    از خوشه BB/Fib در (4134-4137)، با استوکاستیک 13؛ SGE تا 8 اکتبر تعطیل است (بدون
    امکان ارزیابی بازار فیزیکی). WGC (پنج‌شنبه): صندوق‌های بازنشستگی در NL/US/UK/AU
    از 2020-21 به‌دلیل گسست همبستگی اوراق قرضه و سهام، 2-5% طلا نگهداری می‌کنند -
    عاملی ساختاری، نه مربوط به جریان معاملات. هیچ ادعایی درباره کف وجود ندارد (در
    فاصله کمتر از یک ATR، هفته طلایی). گزارش کوتاه 5 اکتبر: دویچه (غالی، BNN در 2
    اکتبر؛ یادداشت 30 سپتامبر): خرید بخش رسمی بیش از دو برابر آهنگ 2021-22، مشارکت
    نهادی +70% از 2021؛ موقعیت‌های خالص فروش CTA در بیشترین سطح از اکتبر 2021، موقعیت‌های
    خرید اختیاری -55% نسبت به ژوئن - «بیش‌فروش‌شده و با وزن پایین در سبدها»، «در سورنتو
    بخرید» (کنفرانس LBMA این هفته) اما ممکن است ابتدا موج فروش شدید هفته طلایی رخ
    دهد. اختلاف در سمت فروش: BofA «نفت بزرگ‌ترین دشمن طلاست، ریسک <4000» در برابر
    مورگان استنلی «4000 یک کف قوی است». از خود LBMA در لندن شکایت شده است (محاکمه
    چهارشنبه 7 اکتبر؛ ذخایر GBP1.4m در برابر ~GBP3m هزینه؛ فهرست Good Delivery در
    معرض خطر) - نشانه‌ای ساختاری، بدون اثر قیمتی. تولیدکنندگان آسیایی در داخل کشور
    ذخیره می‌کنند (پالایش در لائوس، مالیات 15% در اندونزی). 50 شرکت معدنی برتر -$264bn
    (mining.com). SGE تا پنج‌شنبه تعطیل است؛ در فاصله کمتر از یک ATR هیچ ادعایی درباره
    کف وجود ندارد. 7 اکتبر: وزارت دارایی روسیه از 7 اکتبر تا 6 نوامبر ~280bn روبل
    طلا + ارز خارجی می‌خرد (5x رقم 56bn سپتامبر؛ قاعده مالی با برنت بالاتر از $59؛
    تفکیک اعلام نشده) - تقاضای خرید رسمی وابسته به نفت که با افت نفت خام کوچک‌تر می‌شود.
    ناگل (بوندس‌بانک/ECB، 5 اکتبر): دلایل ادامه خرید طلا توسط بانک‌های مرکزی «همچنان
    قوی است». دارایی‌های SPDR در طول افت، نزدیک به اوج چندماهه و در حدود ~34 Moz باقی
    مانده است (investinglive، 6 اکتبر) - فشار از سمت نرخ‌های بهره است، نه خروج از
    ETF. فروش سپتامبر ضرابخانه پرث هم‌زمان با افت قیمت‌ها تقریباً دو برابر شد و به
    اوج 7 ماهه رسید. دعوت‌نامه وبینار روندهای تقاضای Q3 از WGC منتشر شد (6 اکتبر).
    SGE پنج‌شنبه 8 اکتبر بازگشایی می‌شود. 8 اکتبر: PBOC در سپتامبر برای 23مین ماه
    متوالی خرید کرد - 77.47 Moz در برابر 76.73 (+0.74 Moz، حدود 23t، بزرگ‌ترین افزایش
    ماهانه این دوره؛ fxempire بر اساس داده‌های SAFE). WGC: خریدهای رسمی در اوت 39t
    (+70% نسبت به ماه قبل، دو برابر سال قبل؛ چین، لهستان و ازبکستان پیشتاز بودند)،
    از ابتدای سال 170t. ETFها: $10bn در سپتامبر، رکورد $31bn در Q3، دارایی‌ها با +67t
    به رکورد 4,256t رسیدند، در حالی که قیمت 8.5% افت کرد - افت ناشی از قراردادهای
    آتی بود (سرمایه تحت مدیریت معادل -84t، اسپردها -156t؛ BMO/WGC)، نه خروج سرمایه‌گذاران؛
    صندوق‌های پذیرفته‌شده در بورس بریتانیا در Q3 مبلغ $7.5bn جذب کردند، همسو با صرف
    سررسید اوراق دولتی بریتانیا (پوشش ریسک مالی دولت در ETFها برقرار است). هند برای
    نخستین بار از افزایش عوارض ماه مه، نسبت به لندن با اضافه‌قیمت معامله می‌شود؛ اضافه‌قیمت‌های
    چین «مطلوب» هستند (BMO)، اضافه‌قیمت شانگهای پیش از هفته طلایی در اوج سه‌ماهه بود؛
    SGE پنج‌شنبه در 01:30Z بازگشایی شد - اضافه‌قیمت در 03:31Z نامشخص بود (هنوز منبعی
    نیست؛ فید SGE_AU_CNY_G از 28 سپتامبر به‌روز نشده است). DNB مقدار 86t را به نزدیکی
    کشور خود منتقل کرد (واکنش انتقال محل نگهداری). کف تقاضا زیر 4100 پابرجاست؛ فروشنده،
    میز معاملات کاغذی است. 20 اکتبر: گلدمن خرید رسمی اوت را 79t برآورد می‌کند (ژوئیه
    44t؛ میانگین پیش از 2022 برابر با 17t در ماه)، چین ~25t در برابر رقم اعلامی ~20t
    از PBOC. کاهش پیش‌بینی‌های CIBC: Q4-26 برابر با $4,500 (از 6,500)، میانگین 2027
    برابر با $5,200، و 2028 برابر با $5,500 - اجماع برای 2027 برابر با $4,620 / برای
    2028 برابر با $4,451 - بهبود نیازمند چرخش سیاست فدرال رزرو یا تغییر بنیادی در
    رشد/تورم است. کف بر خرید رسمی متکی است و به‌کندی عمل می‌کند؛ میز معاملات کاغذی
    قیمت را تعیین می‌کند (موقعیت خالص سفته‌بازی 199.7K، 13 اکتبر). گزارش کوتاه جمعه
    23 اکتبر: طلا زیر 4000 (قرارداد آتی دسامبر 4000.9 در آسیا، نخستین بار از ژوئیه؛
    ~25% پایین‌تر از اوج ژانویه). HSBC (22 اکتبر): طلا پوشش ریسک کوتاه‌مدت سهام نیست
    - دارندگان موقعیت‌های خرید اهرمی هنگام اخطار تأمین وجه تضمین، آن را برای تأمین
    نقدینگی می‌فروشند، «نقد کردن یک بیمه‌نامه»؛ استدلال بلندمدت بر کاهش ارزش پول،
    تنوع‌بخشی ذخایر بانک‌های مرکزی و چندپارگی ژئوپلیتیکی استوار است، همراه با خریداران
    نهادی جدید (بیمه‌گران چینی، مدیران دارایی هندی) و ورود سرمایه به ETFها. کف بر
    خرید رسمی متکی است و به‌کندی عمل می‌کند؛ قیمت پنج‌شنبه را موقعیت‌های مارجینی تعیین
    کردند.'
