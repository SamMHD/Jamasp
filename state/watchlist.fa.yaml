  why_fa: 'کانال سوم (قاعده 6) برای «داده داغ -> افت طلا»: ریسک‌گریزی در سهام/اعتبار
    که تقاضا برای اوراق خزانه را بالا می‌برد و بازده‌ها را در روز انتشار داده تورم
    پایین می‌کشد. 14 اکتبر: Nasdaq با -1.9% (بدترین عملکرد از 23 ژوئیه) تحت تأثیر
    تأمین مالی هوش مصنوعی - اوراق CoreWeave در سطوح بحرانی (~15%)، افزایش فاصله CDS
    شرکت Oracle، MarketWatch: «با متزلزل شدن سهام فناوریِ بیش‌ازحد تبلیغ‌شده بر اثر
    ترس از تورم، معاملات هوش مصنوعی در حال ازهم‌گسیختن است» - و بازده‌های 10y/30y
    در روز انتشار شاخص قیمت مصرف‌کننده (CPI) داغ، پایین‌تر بسته شدند (10y برابر 5.19
    با -2.7، 30y برابر 5.524 با -3.9، پس از سقف چرخه‌ای 5.62). 15 اکتبر، آسیا: Nikkei
    با -3.5%، Kospi حدود -8% (معاملات Kosdaq به‌مدت 20 دقیقه متوقف شد)، BTC زیر 81K؛
    بازده 10y به‌اندازه 21bp پایین‌تر از سقف پس از شاخص قیمت مصرف‌کننده (CPI)، بازده
    2y با -8.5bp، طلا +1.5% نسبت به قیمت تسویه. دو جلسه؛ موضع تحلیلی آن را ورودی هر
    جلسه برای 2y تلقی می‌کند، نه یک مؤلفه پایدار (قاعده 11: سه جلسه با محرک >=1 ATR).
    نشانه یک مؤلفه پایدار: پایین رفتن بازده‌ها همراه با بالا رفتن طلا در روزی بدون
    هیچ ورودی ناشی از تحولات نظامی یا فدرال رزرو، به‌صورت تکرارشونده؛ عوامل نقض: داده
    داغی که موجب فروش اوراق بلندمدت شود (الگوی 11 سپتامبر)، یا روز ریسک‌گریزی که در
    آن طلا برای پاسخ به مارجین‌کال فروخته شود (الگوی 28 سپتامبر). همچنین حاوی داده‌ای
    درباره تقاضای اوراق خزانه است: Bloomberg: «چین دارایی‌های اوراق خزانه آمریکا را
    از مسیر کانادا نگهداری می‌کند» (~$600bn دارایی کانادایی، تأییدنشده) - تقاضا برای
    اوراق، نه تقاضای طلا با هدف تنوع‌بخشی به ذخایر. 16 اکتبر (گزارش کوتاه جمعه): جلسه
    سوم - در جلسه آمریکا، با وجود داغ‌ترین شاخص قیمت تولیدکننده (PPI) ثبت‌شده، اوراق
    خزانه خریداری شد؛ جمع‌بندی بازار این کانال را نام می‌برد («ترس از بحران اعتباری
    در شرکت‌های هوش مصنوعی مانند CoreWeave، در شرایطی که بدهی آن با مشکل مواجه بوده
    است»؛ شایعه فروپاشی یک صندوق هوش مصنوعی به ارزش ~$40bn - Nebius/Bloom/Lumentum/CoreWeave
    - سپس خرید در افت قیمت‌ها شتاب گرفت، S&P با +0.4%؛ موج سقوط کره بازتاب یافت؛ Dell
    با -17% طی دو روز). بازده 2y برابر 4.751 (-5.1)، بازده 10y برابر 5.087 (-10)،
    DXY با -0.5%، قیمت تسویه طلا +1.5%. به‌عنوان یک مؤلفه پایدار در سناریوی پایه ثبت
    شد (پایه 30 -> 35)، با دو ملاحظه: شاخص برگشت، درحالی‌که بازده‌ها پایین ماندند
    (کانال، اعتبار است، نه روند معاملات سهام)، و بخش آسیایی پنجشنبه ورودی‌هایی از
    فدرال رزرو (Daly) و تحولات نظامی (گزارش‌های سپاه پاسداران) داشت - بنابراین سومین
    جلسه خالص نبود. شرط ابطال: روز ریسک‌گریزی که در آن طلا فروخته شود (الگوی 28 سپتامبر)
    یا نگرانی اعتباری همراه با افزایش بازده‌ها -> پایه 30. نفت -> 2y در آن روز مغلوب
    این کانال شد (Brent بدون تغییر، WTI با +2.50 در پی کاهش ذخایر به میزان 8.6M، بازده
    2y با -5). 17 اکتبر (گزارش کوتاه شنبه): از نظر ماهوی، جلسه چهارم - جمعه Nasdaq
    با -2.3% / S&P با -1.1% (شایعه «فروپاشی صندوق هوش مصنوعی» ادامه یافت و گسترش پیدا
    کرد؛ CoreWeave تحت تأثیر بحث مبادله سهام با بدهی؛ SOX با 8 روز افت؛ بدترین هفته
    Nasdaq 100 از آوریل 2025)، بازده 2y با -3.6bp با وجود قیمت‌های وارداتی داغ، DXY
    با -0.27% («همبستگی میان سرمایه‌گذاری هوش مصنوعی و دلار» - در روز افت -2% شاخص
    Nasdaq، ارز NZD پیشتاز بود)، GC در محدوده تسویه +16.6. اما ردیف داده +4.7 بود
    (به‌اندازه 0.3 داخل محدوده نویز 5 امتیازی) و طلای نقدی بدون تغییر بسته شد، زیرا
    نفت در جلسه +4% رشد کرد - جلسه چهارم طبق معیار دقیق تأیید نشد و ورودی نظامی نیز
    وجود داشت. پایه 35 حفظ شود، مؤلفه پابرجاست، اما تقویت نشده است. اوراق 30y به موج
    خرید نپیوستند (بدون تغییر) - خرید ناشی از اعتبار، خرید اوراق کوتاه‌مدت است؛ آزمون
    بخش بلندمدت، حراج 20y در چهارشنبه 21 اکتبر است. شرط ابطال بدون تغییر: روز ریسک‌گریزی
    که در آن طلا فروخته شود، یا افزایش بازده‌ها در پی نگرانی اعتباری -> پایه 30. نفت
    -> 2y برای دومین روز مغلوب این کانال شد (Brent برابر 110، بازده 2y با -3.6). گزارش
    کوتاه دوشنبه 19 اکتبر: روایت بازگشایی - fxempire خرید طلا در آسیا را به «نیازهای
    تأمین مالی هوش مصنوعی و ریسک کشتیرانی که سرمایه‌گذاران را به‌سوی اوراق سوق می‌دهند»
    نسبت می‌دهد؛ investinglive: تنها ~1/3 از پروژه‌های در دست اجرای مراکز داده آمریکا
    قابل اتکاست؛ Microsoft از Nscale خارج می‌شود. معاملات بازار: خرید اوراق با تغییر
    بازده 10y به میزان -1.9 / بازده 30y به میزان -2.6، بازده 2y بدون تغییر (+0.4 در
    4.719)، طلا در ردیف داده +13.4 - جلسه قابل‌شمارش نیست (2y <2bp، قاعده 11)؛ مؤلفه
    در چهار جلسه باقی می‌ماند. جلسه پنجم نیازمند افزایش >=5 ردیف دوشنبه نسبت به 4181.1
    همراه با کاهش >=2 بازده 2y نسبت به 4.715 است (گزارش کوتاه سه‌شنبه آن را ارزیابی
    می‌کند). گزارش کوتاه سه‌شنبه 20 اکتبر: دوشنبه تصویر معکوس این مؤلفه بود - معاملات
    هوش مصنوعی برگشتند (Nasdaq پیشتاز، Amazon با +5%، سهام حافظه/تراشه صعودی؛ CoreWeave
    در پی نگرانی‌های بدهی پایین‌تر؛ UBS: فروش گسترده سهام نئوکلاود رونق را از مسیر
    خارج نمی‌کند)، اوراق خزانه فروخته شدند (2y با +4.6، 10y با +5.5)، طلا -21/-38.
    با سازوکار سازگار است، اما جلسه پنجم نیست (نیازمند کاهش 2y به میزان >=2 + افزایش
