  why_fa: 'پل ارتباطی جنگ با فدرال رزرو: انتقال نفت به شاخص قیمت مصرف‌کننده (CPI)،
    کانال فعالِ احتمال افزایش نرخ بهره است، و نفت در روزهای بدون رویداد فدرال رزرو
    تعیین‌کننده قیمت طلاست - در هر دو جهت. قیمت‌های تسویه 15 سپتامبر: WTI برابر با
    105.83 / برنت 108.75 (سقف 109.97)؛ از آن زمان پنج تسویه پایین‌تر: 21 سپتامبر برنت
    100.34، 22 سپتامبر برنت 99.25 (نخستین تسویه زیر 100 در دو هفته؛ 98.78 در ساعت
    03:30Z چهارشنبه)، WTI نوامبر ~89-90.5 (قرارداد اکتبر در 22 سپتامبر منقضی شد) -
    در پی راه‌اندازی مجدد خط لوله شرق-غرب عربستان (جزئی، با تغییر مسیر تا 4 میلیون
    بشکه در روز)، ازسرگیری صادرات ینبع، بارگیری ~12 میلیون بشکه در یک روز (Gulf News)،
    رفت‌وآمدهای شاتلی هرمز/جریان‌های عبوری با AIS خاموش، دور مذاکرات آمریکا-ایران
    که هر دو طرف تأیید کردند، و رقم اصلی گزارش API مبنی بر افزایش ذخایر در برابر انتظار
    کاهش. بخش دچار کمبود، فرآورده‌هاست: گازوئیل در سطوح رکورد، و سوخت جت در پی آن
    (MarketWatch)، ترامپ از ممنوعیت صادرات گازوئیل حمایت می‌کند و می‌گوید تصمیم «سریع»
    خواهد بود (تحلیلگران: آسیب می‌زند، کمکی نمی‌کند). سطوح fxempire: حمایت برنت 97-97.5
    و سپس میانگین متحرک 50 دوره‌ای در 92.44، مقاومت 102/105؛ حمایت WTI برابر با 90.47
    و سپس 87.7. آزمون این موضع: برنت <100 همراه با بازده 2 ساله >=4.70 = تأیید عدم
    تقارن، سناریوی نزولی ناشی از نرخ‌های بهره در 50 می‌ماند - در 22 سپتامبر ثبت شد
    (برنت 99.25، حراج اوراق 2 ساله 4.787، منحنی صعودی)؛ برنت <100 و بازده 2 ساله <4.70
    = از دست رفتن عامل ورودی (سناریوی نزولی ناشی از نرخ‌های بهره 45) هنوز ثبت نشده
    است. انتقال اثر در اظهارات ثبت‌شده یک‌طرفه است (اشمید، کشکاری، موسالم، بارکین
    «شوک‌های مداوم در قیمت‌گذاری جا افتاده‌اند»، وارش PCE حدود ~3.6)؛ در خارج نیز
    همین‌طور: ناگل از ECB «نفت اکنون شاخص کلیدی تورم است، سیاست اندکی محدودکننده منتفی
    نیست»، لین «شوک انرژی طولانی‌تر می‌شود، تورم تا اواسط 2027 بالا می‌ماند»؛ PMI
    مقدماتی استرالیا 50.8 با هزینه نهاده‌ها در بالاترین سطح 3 ماهه. زنجیره تأمین:
    شرق-غرب به‌صورت جزئی، ینبع در حال ازسرگیری، ایران صفر (CENTCOM)؛ ممنوعیت صادرات
    گازوئیل روسیه تمدید شد؛ BofA پیش‌بینی برنت خود برای نیمه دوم سال را افزایش داد
    (Investing.com، خوانده‌نشده). ادعاها: 4dfbd1d8 (رقم کل سپتامبر >=0.4، 0.65)؛ 62c34dbd
    (هسته <=0.3، 0.7)؛ بررسی نقطه میانی قاعده-11 در 30 سپتامبر؛ f7a0c23d (هیچ تسویه
    برنت >=103 از چهارشنبه تا جمعه، 0.55)؛ 8e425cab با نخستین تسویه صعودی نفت اجرا
    می‌شود. 24 سپتامبر: برنت با وجود افزایش 3 میلیون بشکه‌ای ذخایر نفت خام (ذخایر
    بنزین و فرآورده‌های تقطیری کاهش یافت)، راه‌اندازی مجدد شرق-غرب و صادرات عراق >3
    میلیون بشکه در روز، در 103.08 (+3.9%) تسویه شد - صرف ریسک بر اساس اظهارات درباره
    هرمز بازقیمت‌گذاری می‌شود، نه بشکه‌ها؛ 102.10 در ساعت 03:30Z. فرآورده‌ها: کاخ
    سفید با وجود مخالفت اعضای کابینه «به» ممنوعیت 90 روزه صادرات گازوئیل «نزدیک‌تر
    می‌شود» (تکذیب قبلی کاخ سفید؛ گازوئیل پس از نوسان رفت‌وبرگشتی شدید، اندکی پایین‌تر
    تسویه شد)؛ سناتورهای هر دو حزب خواستار آزادسازی اضطراری ذخایر نفت گرمایشی هستند؛
    قیمت رکوردی گازوئیل در حال انتقال به قیمت مواد غذایی است (MarketWatch). ممنوعیت،
    مؤلفه انرژی شاخص قیمت مصرف‌کننده (CPI) آمریکا را اندکی تعدیل می‌کند و هم‌زمان
    عرضه جهانی را محدودتر می‌سازد - ادعاهای سپتامبر (4dfbd1d8 / 62c34dbd) این اثر
    را در بر دارند، بررسی نقطه میانی در 30 سپتامبر. واردات نفت آسیا همچنان 13% پایین‌تر
    از پیش از جنگ است (Gulf News). آزمون عدم تقارن همچنان برقرار است: برنت <100 همراه
    با بازده 2 ساله >=4.70 در 22 سپتامبر تأیید شد؛ بازده 2 ساله در صعود نفت هم دنباله‌رو
    آن نبود - پیشتاز بود (PMI). 25 سپتامبر: برنت در پی حملات موشکی حوثی‌ها به ینبع/طائف
    در 106.60 تسویه شد (+3.4%، بالاترین قیمت پایانی از 15 سپتامبر؛ +5% در اوج‌ها)،
    WTI برابر با 94.61 (افت شش‌جلسه‌ای متوقف شد)؛ سپس در معاملات شبانه در پی گزارش
    توافق مرحله‌ای -1% (105.55 در ساعت 03:31Z). ینبع مسیر جایگزین شرق-غرب است: investinglive
    می‌گوید بارگیری نفتکش‌ها در آنجا «هنوز از سر گرفته نشده» در برابر گزارش 24 سپتامبر
    Gulf News مبنی بر «12 میلیون بشکه در یک روز» - تعارض، شنبه از طریق gcaptain رفع
    شود. فرآورده‌ها: رایت در حال نظرخواهی از پالایشگران درباره محدودیت‌های داوطلبانه
    صادرات گازوئیل است (گزارش ممنوعیت 90 روزه را رد می‌کند)؛ اتحادیه اروپا هشدار می‌دهد
    ممنوعیت به هر دو طرف آسیب می‌زند. آرامکو در حال بررسی مسیرهای صادراتی 4 و 5 است.
    بررسی نقطه میانی در 30 سپتامبر (4dfbd1d8 / 62c34dbd). تاریخ انتشار PCE اوت در
    جریان خبری تا 26 سپتامبر موجود نیست (برآورد وارش ~3.6% نسبت به سال قبل) - شنبه
    بررسی شود.'
