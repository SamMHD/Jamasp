- theme: kinetic-transmission-inverted
  why_fa: 'جنگ در قالب افزایش نرخ بهره فدرال رزرو و اخطار تأمین وجه تضمین به طلا سرایت
    می‌کند، نه در قالب تقاضا برای دارایی امن. چهارده جلسه معاملاتی شاهد: 2، 6، 7،
    8، 10، 11 سپتامبر، بسته‌شدن بازار نیویورک در 11 سپتامبر، بازگشایی 14 سپتامبر،
    14، 15، 16 سپتامبر، معاملات شبانه 17-18 سپتامبر، بازگشایی 20 سپتامبر (ریاض: نفت
    +0.8%، طلا بدون تغییر)، و 21 سپتامبر - شدیدترین مورد تا اینجا: دو نفتکش در هرمز
    هدف قرار گرفتند، نفت -3.7% (قیمت تسویه برنت 100.34، برای مدتی کوتاه زیر 100؛ WTI
    برابر با -4.9%)، بازده اوراق خزانه 10ساله -4.5 واحد پایه و 30ساله -4.7 واحد پایه،
    و طلا افت کرد: -0.8% (نقدی) / -1.0% (بسته‌شدن Globex)، درحالی‌که BTC به میزان
    7.1% رشد کرد و نزدک در سطحی رکوردی بسته شد. شواهد مخالف: یک مورد (9 سپتامبر).
    این دریچه از یک‌طرفه هم بدتر است: صعود نفت باعث فروش طلا می‌شود (از مسیر بازده
    اوراق 2ساله)؛ افت نفت بر اثر دیپلماسی نیز باعث فروش طلا می‌شود (صرف جنگِ خود طلا
    تخلیه می‌شود و تقاضا برای ریسک به سمت BTC/AI می‌چرخد)، زیرا بازده اوراق 2ساله
    همراه نفت پایین نمی‌آید (فدرال رزرو راه نادیده‌گرفتن این شوک را بسته است). تنها
    مسیر صعود طلا، کاهش بازده اوراق 2ساله است - که به یک مهارکننده نیاز دارد، نه یک
    تیتر خبری. ادعاها: 64c7ba41 (0.5) - در نخستین جلسه دوشنبه/سه‌شنبه که قیمت تسویه
    برنت صعودی باشد آزموده می‌شود: دوشنبه با افت تسویه شد (100.34 در برابر 103.87)،
    بنابراین فقط در صورتی سه‌شنبه آزموده می‌شود که برنت بالاتر از 100.34 تسویه شود
    (در 03:30Z برابر با 101.35)؛ عدم تحقق GC_CLOSE >= +1% (یعنی >=4445.3 بر مبنای
    ردیف 4401.3) = تحقق پیش‌بینی؛ صعودی‌نبودن نفت در هر دو جلسه = نامشخص. تأییدکننده‌ها:
    تسویه صعودی نفت همراه با طلای بدون تغییر/نزولی؛ حمله آمریکا به ایران که بازار
    آن را با افت طلا قیمت‌گذاری کند؛ توافقی که طرف‌ها آن را تأیید کرده باشند و بازار
    آن را با نفت -5% و طلای نزولی قیمت‌گذاری کند. ابطال‌کننده‌ها: عدم تحقق پیش‌بینی
    64c7ba41 -> اقدام نظامی 35؛ دو بسته‌شدن متوالی با طلای صعودی / بازده اوراق 2ساله
    صعودی؛ طلا +1% در جلسه‌ای با نفت نزولی و بازده اوراق 2ساله بدون تغییر؛ رویدادی
    در سمت عرضه که بازار آن را به‌صورت رکود تورمی معامله کند (بازده سررسیدهای بلندمدت
    صعودی، دلار نزولی، طلا صعودی).'
