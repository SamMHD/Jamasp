- theme: kinetic-transmission-inverted
  why_fa: 'جنگ در قالب افزایش نرخ بهره فدرال رزرو و اخطار تأمین وجه تضمین به طلا می‌رسد،
    نه در قالب تقاضا برای دارایی امن. دوازده جلسه معاملاتی با شواهد (2، 6، 7، 8، 10،
    11 سپتامبر، بسته‌شدن بازار نیویورک در 11 سپتامبر، بازگشایی 14 سپتامبر، 14، 15،
    16 سپتامبر، معاملات شبانه 17-18 سپتامبر) در برابر یک جلسه (9 سپتامبر). در 18 سپتامبر
    هیچ عامل نظامی وارد قیمت نشد و در عوض نشانه رژیم دیگر ثبت شد (طلا صعودی همراه
    با بازده‌ها صعودی و نفت نزولی). بازگشایی یکشنبه 20 سپتامبر ساعت 22:00Z سیزدهمین
    آزمون است، با عاملی خفیف‌تر از آنچه موضع روز شنبه فرض می‌کرد - در ریاض یک موشک
    بالستیک رهگیری شد، بدون تلفات یا خسارت، و به حوثی‌ها نسبت داده شد؛ در ینبع حمله
    «خنثی شد» - و عاملی سنگین‌تر از واشنگتن که هنوز در قیمت لحاظ نشده است: بازگشت
    زودهنگام ترامپ به کاخ سفید، هشدار وزارت خارجه درباره تشدید تنش، یک «تصمیم بزرگ»
    درباره ازسرگیری حملات به ایران، در برابر هفت شرط ایران که از طریق قطر مطرح شده
    است. ادعاها: ac946837 (0.6) - نخستین قیمت ثبت‌شده GC پس از بازگشایی در محدوده
    +/-1% از 4424.9 (4380.6-4469.1)، الگوی محدوده‌ای (3/3) نه الگوی شکاف صعودی (0/4)؛
    64c7ba41 (0.5) - در نخستین تسویه صعودی نفت برنت در دوشنبه/سه‌شنبه، هیچ ردیف GC_CLOSE
