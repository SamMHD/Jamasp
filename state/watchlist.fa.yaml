  why_fa: 'بازده‌های واقعی محرک غالب طلا هستند، و این فدرال رزرو همین حالا نرخ بهره
    را افزایش داد: 16 سپتامبر +25bp به 3.75-4.00%، با رأی 12-0، بدون جمله‌ای برای
    راهنمایی؛ نمودار نقطه‌ای حاکی از یک افزایش دیگر در 2026 (میانه 4.1؛ 16 نفر از
    18 نفر انتظار >=1 افزایش دیگر دارند)، 2027 برابر با 4.1، بلندمدت 3.2. وارش: «انقباضی
    نیست»، «تورم بیش از حد بالاست»، برآورد PCE اوت ~3.6% (انتشار آمار رسمی در اواخر
    همین ماه). قیمت‌گذاری: CME برای اکتبر 57.6% پس از FOMC (actionforex، 19 سپتامبر)؛
    قراردادهای آتی احتمال دو از سه برای 4.00-4.25% در پایان 2026 و دست‌کم یک‌چهارم
    واحد درصد دیگر تا اواسط 2027 را نشان می‌دهند (investinglive، 21 سپتامبر)؛ BofA
    همچنان اکتبر + دسامبر را پیش‌بینی می‌کند. مقصد تقریباً تغییری نکرده است (محتمل‌ترین
    بازه دسامبر-27 برابر با 4.50-4.75)؛ بازده 2ساله ~26bp بالاتر از میانگین مسیر مورد
    انتظار قرار دارد - بخش کوتاه‌مدت منحنی از قراردادهای آتی جلو افتاده است. نقاط
    بررسی: بازده 2ساله 4.791-4.800 (پس‌زده‌شدن و سپس <4.600 = بازگشت به‌سوی مسیر؛
    شکست = هدف برآوردی 5.055)؛ DXY برابر با 100.02 / 100.58 / 101.80. طبق اظهارات
    ثبت‌شده، امکان نادیده‌گرفتن این شوک بسته شده است: اشمید، 18 سپتامبر («فقط مسئله
    انرژی نیست»)، کشکاری، 20 سپتامبر (فاکس: «در سراسر اقتصاد بیش از حد بالاست، نه
    فقط انرژی»؛ فدرال رزرو نمی‌تواند با نرخ‌های بهره هرمز را باز کند، اما برای بقیه
    بخش‌ها ابزار دارد) - بنابراین افت نفت دیگر بازده 2ساله را پایین نمی‌کشد (21 سپتامبر:
    برنت -2.1%، بازده 2ساله بدون تغییر، طلا -0.5%). هیچ‌کدام عضو هیئت‌مدیره فدرال
    رزرو نیستند؛ شرط تغییر سناریو (تأیید افزایش اکتبر از سوی یک عضو هیئت‌مدیره ->
    سناریوی نزولی ناشی از نرخ‌های بهره 60؛ درخواست توقف -> سناریوی پایه 30) فعال نشده
    است. سخنرانان از فید ff_calendar تأیید شده‌اند (اثرگذاری کم، پنهان‌شده توسط `jamasp
    calendar`، todo-188): گولزبی دوشنبه 21 سپتامبر 10:30Z؛ ویلیامز 14:05Z، جفرسون
    (نایب‌رئیس) 14:20Z، بارکین 17:00Z سه‌شنبه 22؛ بار چهارشنبه 23 در 14:05Z؛ ویلیامز
    08:10Z، همک 12:50Z، پالسن 14:10Z پنج‌شنبه 24؛ ویلیامز 09:15Z، همک 18:00Z جمعه
    25. بیدارباش‌های #57 (جفرسون) و #58 (بار + PMI مقدماتی آمریکا). ادعاها: 1889819a
    (0.7، تا 22 سپتامبر) - دوشنبه در 03:30Z طلا نزولی / بازده 2ساله بدون تغییر است،
    در مسیر تحقق؛ fc5c5a29 (هیچ بسته‌شدن بازده 2ساله زیر <4.60 تا 25 سپتامبر، 0.55).
    نقاط تصمیم بعدی: بسته‌شدن دوشنبه (نقطه تصمیم)؛ جفرسون سه‌شنبه؛ بار چهارشنبه؛ شاخص
    قیمت مصرف‌کننده (CPI) سپتامبر در اواسط اکتبر؛ FOMC در 28 اکتبر.'
