    ثبت نشود، نامشخص) - آزمون علامت معکوسِ سابقه 15/16 در جلسات صعودی نفت؛ عدم تحقق
    با بازده 30ساله >=5.50 و DXY نزولی، برداشت رکود تورمی است (پایه 25)، عدم تحقق
    با بازده 2ساله صعودی و طلای صعودی، یک ردیف با صعود هر دو است (پایه). a270f3f1
    (0.55) به سمت نتیجه نامشخص می‌رود (تسویه -3% تا سه‌شنبه به پیشنهاد متقابل رسمی
    آمریکا نیاز دارد). درگیری نظامی 25: شاخه توافق طبق موضع علنی از روی میز کنار رفته،
    شاخه شکست مذاکرات (برنت >=110 -> طلای نزولی از مسیر بازده 2ساله) شاخه فعال است.
    موارد ابطال بدون تغییر: عدم تحقق a270f3f1 با بازده 2ساله بدون تغییر -> 20 / پایه
    25؛ دو ردیف با صعود هر دو؛ ثبت الگوی رکود تورمی. گزارش کوتاه 28 سپتامبر: رابطه
    معکوس در ششمین آخر هفته درگیری نظامی پابرجا ماند - برنت +1.7% (اوج +2.6%)، بازده
    2ساله +3.7bp، طلا -2.1% تا 4230.6 با عبور از محدوده حمایتی 4244-4253؛ عبور بازده
    30ساله از 5.50 همراه با طلای نزولی، نشانه خلاف آن است (18 مخالف / 2 موافق). واگرایی
    اندازه حرکت علامت‌گذاری شد: حرکت طلا ~3x میزانی است که ورودی‌های نفت/بازده 2ساله
    در 23 سپتامبر ایجاد کردند - شکست محدوده حمایتی، پایان فصل، تقاضای خرید چین غایب؛
    در هیچ‌یک از دو جهت تقاضا برای دارایی امن نیست. 9e1829f8 امشب فعال است (تسویه
    برنت >=106.41 -> ردیف >=0.1% نزولی؛ ردیف همین حالا 70 واحد زیر 4299.7 یکشنبه است).
    علامت شاخه توافق بدون تغییر: تأیید دریافت متن قطری = تخلیه = 4253/4300، یک شکست
    نزولی ناموفق، نه یک حرکت صعودی. گزارش کوتاه 30 سپتامبر: سه‌شنبه مرحله تخلیه بود،
    با بازده 2ساله‌ای که به‌سختی حرکت کرد (-3.3bp) و طلا +1.41% در ردیف - دومین تقاضای
    خرید کامل در مرحله تخلیه (25 سپتامبر محو شد، 29 سپتامبر حفظ شد)، در برابر DXY
    +0.19% و بازده 10ساله/30ساله صعودی. a270f3f1 طبق نص شرط نامشخص (تسویه -2.55%،
    مرز -3%)، از نظر ماهیت مخالف؛ 9e1829f8 نامشخص (هیچ تسویه +2% ثبت نشد). رابطه معکوس
    همچنان در بخش صعود نفت پابرجاست (دوشنبه +0.9%، طلا -3.3%، بخش انتهای بلندمدت منحنی/تصفیه
    موقعیت‌ها)؛ بخش افت نفت اکنون برای طلا تقاضای خرید ایجاد می‌کند. برداشت فعلی:
    نامتقارن، نه معکوس - صعود نفت = افت طلا از مسیر بازده 2ساله، افت نفت = صعود طلا
    از مسیر موقعیت‌گیری. دو جلسه؛ فرضیه‌ای با آزمونی مشخص (تسویه بعدی قرارداد دسامبر
    برنت با افت >=2%: آیا ردیف با افت <5bp بازده 2ساله، >=0.5% بالا می‌رود؟)، نه یک
    قاعده. گزارش کوتاه 2 اکتبر: نخستین جلسه نفت صعودی / طلای صعودی این رژیم - پنج‌شنبه
    برنت +~4% (102.31)، DXY 101.996 (اوج 52هفته‌ای)، طلا +0.69% در ردیف همراه با بازده
    2ساله -10bp: بخش نفت -> بازده 2ساله تحت‌الشعاع کانال رهبری فدرال رزرو قرار گرفت
    (تأکید جفرسون/ویلیامز بر صبر، انتقال زمان مورد انتظار گلدمن به دسامبر). تقاضا
    برای دارایی امن نیست - طلا همراه با اوراق خزانه بالا رفت. یک جلسه = فرضیه (قاعده
    11)؛ مضمون «حمله = افزایش نرخ بهره + اخطار تأمین وجه تضمین» برای یک اقدام عملی
    پابرجاست؛ تقویت آرایش نظامی (ناو هواپیمابر 3ام) که در برنت قیمت‌گذاری شد، به بازده
    2ساله نرسید. BofA در همان روز: «نفت بزرگ‌ترین دشمن طلاست»، ریسک <4000 - زنجیره
    به‌عنوان دیدگاه مؤسسه. گزارش کوتاه 3 اکتبر: جمعه زنجیره در هر دو جهت درون یک جلسه
    عمل کرد - بازده 2ساله هنگام انتشار داده -9bp، طلا +50؛ بازده 2ساله از کف +15bp
    تا بسته‌شدن با +4bp، هم‌زمان با بازیابی برنت از 98.4 -> 102.25، طلا -97 از اوج،
    در حالی که DXY تمام روز نزولی بود. هفت اصابت به بدنه کشتی‌ها در هرمز طی یک هفته
    + یک ناو هواپیمابر سوم + گزارش رویترز درباره عملیات تهاجمی عربستان: برنت بدون
    تغییر تسویه شد، هیچ‌چیز به بازده 2ساله نرسید، هیچ‌چیز به طلا نرسید. سومین جلسه
    طلا = f(بازده پایانی 2ساله) با DXY در اوج 52هفته‌ای (30 سپتامبر / 1 اکتبر / 2
    اکتبر): سه مورد قاعده 11 تکمیل شده، آزمون علامت اکنون یک برداشت است؛ به‌عنوان
    ادعایی با احتمال 0.6 برای دوشنبه تا جمعه 5-9 اکتبر ثبت شد. گزارش کوتاه 5 اکتبر:
    بازگشایی یکشنبه چهارمین الگوی سازگار با زنجیره است: بازده 2ساله -1.5bp، طلا +0.2%
    (4169، اوج 4191)، برنت -0.8% با خبر هشتمین بدنه کشتی + ادعاهای حوثی‌ها؛ DXY +0.44%
    تا اوج 52هفته‌ای (102.53) به‌واسطه یورو (OAT-Bund >140bp) و طلای صعودی - مؤلفه
    دلار این هفته منشأ خارج از آمریکا دارد و تابع عوامل دیگر است (واگرایی جدید در
    موضع تحلیلی). جلسه اول 306d7862 / 968df4d5 = ردیف دوشنبه در برابر بازده پایانی
    2ساله دوشنبه. 7 اکتبر: زنجیره در تمام جلسات بررسی‌شده پابرجا ماند. دوشنبه: بازده
    2ساله -1.1bp، ردیف 4166.9 (+4.6 = بدون تغییر) - برای هیچ‌یک از دو ادعا شمرده نمی‌شود؛
    بازده 10ساله در 5.311 (>5.30) با طلای بدون تغییر بسته شد، بنابراین شرط پایه 45
    فعال نشد. سه‌شنبه: بازده 2ساله نزولی (4.7975 در جمع‌بندی / 4.791 در CNBC)، ردیف
    4185.0 (+18.1) - علامت مخالف؛ رکوردهای S&P، بازده 30ساله بدون تغییر. معاملات آسیای
    چهارشنبه: برنت +0.9% -> بازده 2ساله +2.5bp -> DXY +0.2 -> طلا -0.5% (4165.7) -
    نمونه‌ای کاملاً مطابق الگو. شمارش 306d7862 پس از دو جلسه: مخالف 1 / هم‌جهت 0 /
    بدون تغییر 1؛ 968df4d5: هیچ جفت جلسه‌ای با صعود هر دو نمی‌تواند از دوشنبه شکل
    بگیرد. واگرایی ادامه‌دار DXY سه‌شنبه برطرف شد (یورو با اقدامات فرانسه درباره کسری
    بودجه بازیابی شد، DXY در 101.83 بسته شد، طلا صعودی) - برداشت مربوط به دلار با
    منشأ خارج از آمریکا به‌عنوان یک نشانگر پابرجاست. نشانگر جدید: بازده 30ساله 5.685
    در آسیا با DXY صعودی و طلای نزولی، الگوی رکود تورمی نیست؛ حراج اوراق 10ساله در
    17:01Z و صورت‌جلسه در 18:00Z آزمون هستند. 8 اکتبر: چهارشنبه زنجیره را در معاملات
    درون‌روزی ثبت کرد و در پایان معاملات شکست. ریزش بازار اوراق قرضه اروپا (بازده
    10ساله 5.34 / بازده 30ساله 5.73 در 12:50Z، DXY 102.4) طلا را به 4094.7 رساند (کف
    دوماهه، پایین‌ترین سطح از 5 اوت)؛ بازده‌ها با گزارش انتشار اوراق کوتاه‌مدت فرانسه
    و ثبت بازده حراج 10ساله به میزان 1.7bp پایین‌تر از بازده پیش از حراج، تغییر جهت
    دادند؛ طلا تا 4141.3 بازیابی شد - اما بازده 2ساله با افت 2.7bp بسته شد (4.764)،
    همراه با افت 43.7 ردیف = نخستین جلسه هم‌جهت از 30 سپتامبر. عامل فروش مشخص: دلار
    (DXY +0.41 تا 102.24، اوج 18ماهه به گزارش رویترز، «خرید بی‌وقفه» - جمع‌بندی) و
    انتهای بلندمدت منحنی (بازده 30ساله در پایان +2bp)، بازده 2ساله صرفاً همراه بود.
    حمله قطر (19:00Z) و تلفات ریاض، برنت را در 19:01Z به میزان -0.14 حرکت دادند -
    اثر بر نفت صفر، اثر بر طلا صفر (قاعده 22، درگیری نظامی تابع عوامل دیگر). معاملات
    آسیای پنج‌شنبه: برنت +2.1% (ایسایاس + قطر) -> بازده 2ساله +1.7bp -> طلا 15 واحد
    صعود تا 4156 (برخلاف زنجیره: تقاضای خرید ناشی از بازگشایی SGE یا پوشش موقعیت‌های
    فروش از کف؛ DXY بدون تغییر). آزمون علامت 306d7862 پس از سه جلسه: مخالف 1 (سه‌شنبه)
    / هم‌جهت 1 (چهارشنبه) / بدون تغییر 1 (دوشنبه) - دومین جلسه هم‌جهت به معنای عدم
    تحقق و پایه 40 -> 35 است.'
