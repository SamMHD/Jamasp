  why_fa: 'پل میان جنگ و فدرال رزرو: انتقال نفت به شاخص قیمت مصرف‌کننده (CPI)، کانال
    فعال احتمال افزایش نرخ بهره است و نفت در روزهای بدون رویداد فدرال رزرو، تعیین‌کننده
    قیمت طلاست - در هر دو جهت. قیمت‌های تسویه 15 سپتامبر: WTI برابر با 105.83 / Brent
    برابر با 108.75 (سقف 109.97)؛ از آن زمان پنج تسویه پایین‌تر: 21 سپتامبر Brent
    برابر با 100.34، 22 سپتامبر BRENT برابر با 99.25 (نخستین تسویه زیر 100 در دو هفته؛
    98.78 در ساعت 03:30Z چهارشنبه)، WTI نوامبر ~89-90.5 (قرارداد اکتبر در 22 سپتامبر
    منقضی شد) - در پی راه‌اندازی مجدد خط لوله شرق-غرب عربستان (جزئی، تغییر مسیر تا
    4 میلیون بشکه در روز)، ازسرگیری صادرات ینبع، بارگیری ~12 میلیون بشکه در یک روز
    (Gulf News)، رفت‌وآمدهای شاتلی هرمز/جریان‌های دارای AIS خاموش، دور مذاکرات آمریکا-ایران
    که هر دو طرف تأیید کرده‌اند، و خبر افزایش موجودی API در برابر انتظار کاهش موجودی.
    تنگنای عرضه در فرآورده‌هاست: گازوئیل در سطوح رکورد، سوخت جت در تعقیب آن (MarketWatch)،
    ترامپ از ممنوعیت صادرات گازوئیل حمایت می‌کند و می‌گوید تصمیم «سریع» گرفته می‌شود
    (تحلیلگران: زیان می‌رساند، نه کمک). سطوح fxempire: حمایت Brent در 97-97.5 و سپس
    میانگین متحرک 50 دوره‌ای در 92.44، مقاومت 102/105؛ حمایت WTI در 90.47 و سپس 87.7.
    آزمون این موضع: Brent <100 همراه با بازده 2 ساله >=4.70 = تأیید عدم تقارن، امتیاز
    دیدگاه نزولی ناشی از نرخ‌های بهره در 50 حفظ می‌شود - در 22 سپتامبر ثبت شد (Brent
    برابر با 99.25، حراج 2 ساله 4.787، منحنی رو به بالا)؛ Brent <100 و بازده 2 ساله
    <4.70 = از دست رفتن عامل ورودی (امتیاز دیدگاه نزولی ناشی از نرخ‌های بهره 45) هنوز
    ثبت نشده است. انتقال اثر، طبق اظهارات ثبت‌شده، یک‌طرفه است (اشمید، کشکاری، موسالم،
    بارکین «شوک‌های پایدارِ جای‌گرفته در قیمت‌گذاری»، برآورد وارش برای PCE برابر با
    ~3.6)؛ در خارج نیز همین‌طور: ناگل از ECB «نفت اکنون یک سنجه کلیدی تورم است، موضع
    اندکی محدودکننده منتفی نیست»، لین «شوک انرژی طولانی‌تر می‌شود، تورم تا میانه 2027
    بالا می‌ماند»؛ PMI مقدماتی استرالیا 50.8 و هزینه نهاده‌ها در بالاترین سطح 3 ماهه.
    زنجیره تأمین: خط شرق-غرب به‌صورت جزئی، ینبع در حال ازسرگیری، ایران صفر (CENTCOM)؛
    ممنوعیت صادرات گازوئیل روسیه تمدید شد؛ BofA پیش‌بینی Brent خود برای نیمه دوم سال
    را افزایش داد (Investing.com، خوانده‌نشده). ادعاها: 4dfbd1d8 (شاخص کل سپتامبر
    >=0.4، 0.65)؛ 62c34dbd (هسته <=0.3، 0.7)؛ بررسی میان‌دوره‌ای طبق قاعده-11 در 30
    سپتامبر؛ f7a0c23d (هیچ تسویه Brent برابر یا بالاتر از 103 از چهارشنبه تا جمعه،
    0.55)؛ 8e425cab با نخستین تسویه صعودی نفت اجرا می‌شود. 24 سپتامبر: Brent با وجود
    افزایش 3 میلیون بشکه‌ای موجودی نفت خام (موجودی بنزین و فرآورده‌های تقطیری کاهش
    یافت)، راه‌اندازی مجدد خط شرق-غرب و صادرات عراق >3 میلیون بشکه در روز، در 103.08
    (+3.9%) تسویه شد - صرف قیمت بر مبنای اظهارات درباره هرمز بازقیمت‌گذاری می‌شود،
    نه بشکه‌ها؛ 102.10 در ساعت 03:30Z. فرآورده‌ها: کاخ سفید با وجود مخالفت کابینه
    «به» ممنوعیت 90 روزه صادرات گازوئیل «نزدیک‌تر می‌شود» (تکذیب قبلی کاخ سفید؛ گازوئیل
    پس از نوسان رفت‌وبرگشتی شدید، اندکی پایین‌تر تسویه شد)؛ سناتورهای هر دو حزب خواستار
    آزادسازی اضطراری نفت گرمایشی هستند؛ قیمت رکوردی گازوئیل در حال انتقال به قیمت
    مواد غذایی است (MarketWatch). ممنوعیت، جزء انرژی شاخص قیمت مصرف‌کننده (CPI) آمریکا
    را اندکی تعدیل می‌کند، در حالی که عرضه جهانی را محدودتر می‌کند - ادعاهای سپتامبر
    (4dfbd1d8 / 62c34dbd) این اثر را در بر دارند، بررسی میان‌دوره‌ای 30 سپتامبر. واردات
    نفت آسیا همچنان 13% پایین‌تر از پیش از جنگ است (Gulf News). آزمون عدم تقارن همچنان
    برقرار است: Brent <100 همراه با بازده 2 ساله >=4.70 در 22 سپتامبر تأیید شد؛ بازده
    2 ساله حرکت صعودی نفت را هم دنبال نکرد - پیشتاز بود (PMI). 25 سپتامبر: Brent در
    106.60 تسویه شد (+3.4%، بالاترین قیمت پایانی از 15 سپتامبر؛ +5% در اوج‌ها)، WTI
    برابر با 94.61 (روند نزولی شش جلسه‌ای متوقف شد)، در پی موشک‌های حوثی‌ها به ینبع/طائف؛
    سپس در معاملات شبانه با گزارش توافق مرحله‌ای -1% (105.55 در ساعت 03:31Z). ینبع
    مسیر جایگزین شرق-غرب است: investinglive می‌گوید بارگیری نفتکش‌ها در آنجا «هنوز
    از سر گرفته نشده است»، در برابر گزارش 24 سپتامبر Gulf News مبنی بر «12 میلیون
    بشکه در یک روز» - تناقض، شنبه از طریق gcaptain حل شود. فرآورده‌ها: رایت در حال
    نظرخواهی از پالایشگران درباره محدودیت‌های داوطلبانه صادرات گازوئیل است (گزارش
    ممنوعیت 90 روزه را رد می‌کند)؛ اتحادیه اروپا هشدار می‌دهد ممنوعیت به هر دو طرف
    آسیب می‌زند. آرامکو در حال بررسی مسیرهای صادراتی 4 و 5 است. بررسی میان‌دوره‌ای
    30 سپتامبر (4dfbd1d8 / 62c34dbd). تاریخ PCE اوت تا 26 سپتامبر در جریان اطلاعات
    نیست (برآورد وارش ~3.6% نسبت به سال قبل) - شنبه راستی‌آزمایی شود. 26 سپتامبر:
    Brent در 104.32 تسویه شد (-2.1%، -$3 از اوج‌ها؛ +5.1% نسبت به هفته قبل از 99.25)،
    WTI برابر با 92.44 (-2.3%)، در پی برنامه هفت‌روزه عراقچی؛ سررسیدهای کوتاه‌مدت
    همراه شدند (-3.5 واحد پایه) - به kinetic-transmission-inverted مراجعه کنید. تاریخ
    PCE تأیید شد: چهارشنبه 30 سپتامبر 12:30Z (تقویم actionforex + چشم‌انداز هفته آینده
    Wells Fargo) - اجماع شاخص کل 0.4 ماه‌به‌ماه / 3.7% سال‌به‌سال، هسته 0.3 / 3.4%؛
    بازنگری‌های سالانه BEA در همان انتشار («روند کوتاه‌مدت ملایم‌تر، رقم اوت داغ‌تر»)؛
    بیدارباش #62 برای زمان انتشار+45 (13:15Z) ثبت شد - ادعای b934960e را ارزیابی می‌کند
    (بدون مخابره <55%) و بررسی میان‌دوره‌ای قاعده-11 را برای 4dfbd1d8 / 62c34dbd اجرا
    می‌کند (میانگین Brent در سپتامبر ~103-104 بوده است، در برابر ~90 در اوت: ادعای
    شاخص کل >=0.4 در مسیر تحقق است؛ هسته <=0.3 به مسکن/سفر وابسته است). ISM پنجشنبه
    14:00Z، اجماع قیمت‌های پرداخت‌شده 72 (از 71.1). تناقض بارگیری ینبع حل‌نشده است
    (جست‌وجوی gcaptain: هیچ مطلبی با تاریخ پس از 3 اوت نیست؛ گزارش 24 سپتامبر Gulf
    News با عنوان «جهش هفت‌برابری، AIS خاموش» تنها خبر تاریخ‌دار باقی می‌ماند). Kpler:
    جریان نفت خام هرمز این هفته 33.7 میلیون بشکه در برابر 49.2 میلیون در هفته گذشته
    - بخش فیزیکی محدودتر شد، در حالی که صرف قیمت تخلیه شد. 27 سپتامبر: Brent نوامبر
    104.32 (تسویه جمعه؛ قرارداد نوامبر چهارشنبه 30 سپتامبر منقضی می‌شود - نماد @LCO.1
    در CNBC آن روز به دسامبر منتقل می‌شود، بنابراین هر ادعای تسویه Brent که چهارشنبه
    را در بر می‌گیرد باید قرارداد را نام ببرد، قاعده 17؛ a270f3f1 و 9e1829f8 سه‌شنبه
    بسته می‌شوند و تحت تأثیر نیستند)، WTI نوامبر 92.44 (-8% نسبت به هفته قبل از ~100.30؛
    actionforex: میانگین متحرک نمایی 55 روزه 89.14 و سطح اصلاحی 50% در 86.90 سطوحی
    هستند که شکستشان می‌گوید صعود ناشی از جنگ پایان یافته است - به آنها نرسیده). رد
    علنی ترامپ (شنبه)، برنامه‌ای را که صرف قیمت را تخلیه کرده بود کنار می‌زند؛ انتظار
    بازقیمت‌گذاری صعودی در بازگشایی یکشنبه می‌رود. بخش فیزیکی محدودتر شد، در حالی
    که صرف قیمت افت کرد (Kpler برابر با 33.7 میلیون در برابر 49.2 میلیون بشکه). تناقض
    بارگیری ینبع همچنان حل‌نشده است. تورم مورد انتظار یک سال آینده UMich برابر با
    4.6%. PCE چهارشنبه 12:30Z (اجماع 0.4/3.7، هسته 0.3/3.4): بررسی عمیق #62، بررسی
    میان‌دوره‌ای قاعده-11 را برای 4dfbd1d8 / 62c34dbd اجرا می‌کند (میانگین Brent سپتامبر
    ~103-105 در برابر ~90 اوت: ادعای شاخص کل >=0.4 در مسیر تحقق است؛ هسته <=0.3 به
    مسکن/سفر وابسته است). قیمت‌های پرداخت‌شده ISM پنجشنبه (اجماع 72). گزارش کوتاه
    30 سپتامبر: بررسی میان‌دوره‌ای قاعده-11 اجرا شد - Brent سپتامبر در تمام ماه در
    محدوده 100-109 تسویه شد (+10% ماه‌به‌ماه طبق مرور؛ سومین رشد ماهانه پیاپی WTI)،
    در برابر ~90 اوت: عامل سوخت برای شاخص قیمت مصرف‌کننده (CPI) سپتامبر پابرجاست،
    4dfbd1d8 (شاخص کل >=0.4) بر پایه سازوکاری فعال باز می‌ماند؛ در اطلاعات تازه، هیچ
    بازقیمت‌گذاری مخابراتی مخابره‌شده یا برآورد آنی مسکن وجود ندارد - 62c34dbd (هسته
    <=0.3) بر مبنای دلایل خود پابرجاست، تأییدنشده. شاخص قیمت مصرف‌کننده (CPI) استرالیا
    4.0% به‌دلیل سوخت (میانگین پیراسته 0.2)، همان انتقال اثر در خارج است؛ RBA برابر
    با 4.60، Westpac نوامبر را پیش‌بینی می‌کند. PCE امروز: اجماع 0.4/3.7، هسته 0.3/3.4،
    بازنگری‌های BEA در همان انتشار. Brent نوامبر چهارشنبه منقضی شد - ادعاهای تسویه،
    قرارداد دسامبر را نام می‌برند (قاعده 17). گزارش کوتاه 2 اکتبر: کانال نزولی نفت
    برای بخش فرآورده‌ها - آمریکا تهدید می‌کند صادرات گازوئیل را ممنوع می‌کند مگر اینکه
    اروپا «فوراً» ~120 میلیون بشکه آزاد کند؛ رایت «بسیار مطمئن» است اروپا آزادسازی
    می‌کند؛ حاشیه سود گازوئیل اتحادیه اروپا در پی این اظهارات -7%؛ توقف صادرات سوخت
    چین در پس‌زمینه. نفت خام بی‌تأثیر (Brent دسامبر 102.31، +4% پنجشنبه در پی موضع‌گیری).
    میانگین سوخت سپتامبر قطعی شده است -> 4dfbd1d8 (شاخص کل قیمت مصرف‌کننده (CPI) سپتامبر
    >=0.4) بی‌تأثیر؛ انتشار آمار اکتبر است که آزادسازی بر آن اثر می‌گذارد. قیمت‌های
    پرداخت‌شده ISM برابر با 77.9 (فولاد، آلومینیوم، نفت، تعرفه‌ها) = بخش هزینه نهاده‌ها
    همچنان صعودی است. گزارش کوتاه 4 اکتبر: بررسی میان‌دوره‌ای قاعده-11 برای دو ادعای
    شاخص قیمت مصرف‌کننده (CPI)، بر اساس برآورد آنی فدرال رزرو کلیولند (گزیده‌های صفحه؛
    2 اکتبر): شاخص کل سپتامبر 0.53، هسته 0.20، سال‌به‌سال 3.60/2.39؛ اکتبر تا این
    تاریخ 0.22/0.20. اجماع TE برای انتشار 14 اکتبر: شاخص کل 0.5 (سال‌به‌سال 3.7)،
    هسته 0.3 (2.5). 4dfbd1d8 (شاخص کل >=0.4) هم اجماع و هم برآورد آنی را همراه خود
    دارد؛ 62c34dbd (هسته <=0.3) برآورد آنی را همراه خود دارد و اجماع در مرز آن است.
    شاخص قیمت تولیدکننده (PPI) پنجشنبه 15 اکتبر (اجماع 0.5). آزادسازی 100 میلیون بشکه‌ای
    G7/IEA (با تمرکز اولیه بر گازوئیل، در 20 روز نخست)، عاملی برای آمار اکتبر است،
    نه سپتامبر. 8 اکتبر: Brent دسامبر 102.32 (+2.1%) در ساعت 03:31Z پنجشنبه در پی
    توفان گرمسیری Isaias (4 تأسیسات Chevron + 5 تأسیسات Shell در خلیج مکزیک آمریکا
    تعطیل؛ Mars، Olympus، Ursa، Vito، Appomattox تخلیه شدند؛ حجم‌ها اعلام نشده) و
    نفتکش قطر؛ چهارشنبه پس از آمار EIA برابر با -3.19 میلیون بشکه در برابر انتظار
    +1.7، در ~100.20 تسویه شد (WTI برابر با 88.48، -0.96) - بازار در همان روز اثر
    تلفات ریاض و حمله قطر را پس گرفت. اعضای IEA از آزادسازی سریع‌تر ذخایر حمایت می‌کنند
    (The National)؛ کارگروه اتحادیه اروپا درباره برنامه G7 جلسه می‌گذارد؛ حاشیه سود
    گازوئیل >10%. نظرسنجی انتظارات مصرف‌کنندگان فدرال رزرو نیویورک: تورم مورد انتظار
    بنزین 4.8%. صورت‌جلسه: «هرچه قیمت انرژی مدت بیشتری بالا بماند، خطر» سرایت «بیشتر
    می‌شود» - نفت اکنون یک عامل ورودی صریح برای فدرال رزرو است (investinglive: «شوک‌های
    بیشتر عرضه، استدلال به نفع انقباض را تقویت می‌کند، به‌جای آنکه از اثرشان چشم‌پوشی
    شود»). شاخص قیمت مصرف‌کننده (CPI) در 14 اکتبر: اجماع شاخص کل 0.5، برآورد آنی 0.53.
    12 اکتبر: Brent دسامبر 102.84 (-1.80%، دامنه روزانه 102.33-105.63)، WTI برابر
    با 89.94 (-2.08%)، در پی «آتش‌بس انرژی» روسیه-اوکراین که ترامپ یکشنبه اعلام کرد
    (کی‌یف از طریق همان پست از آن مطلع شد؛ روسیه چند ساعت بعد نیروگاه CHP-5 خارکیف
    را هدف قرار داد؛ کرملین ساکت)، دو روز پس از توافق گازوئیل روسیه به حجم ~4.8 میلیون
    تن (36 میلیون بشکه) که قانون تحریم‌های ماه گذشته را معکوس می‌کند؛ مخالفت هر دو
    حزب (سناتور: «ممکن است غیرقانونی باشد»). Goldman: صادرات خلیج فارس به 22-23 میلیون
    بشکه در روز بازگشته، فرآورده‌ها در نصف سطح عادی، Dated Brent حدود ~120 در برابر
    قراردادهای آتی ~103 (صرف شکاف قیمت با میانگین $22/بشکه در سپتامبر، دومین رقم بزرگ
    ثبت‌شده)، سناریوی پایه Brent در پایان سال $85؛ JPM هشدار می‌دهد ناوگان نفتکش‌ها
    نزدیک به استفاده کامل است. عامل انتقال اثر اکنون فرآورده‌هاست (گازوئیل/سوخت جت)،
    نه نفت خام: توافق گازوئیل نخستین گشایش سمت عرضه در این بخش است. 4dfbd1d8 (شاخص
    کل >=0.4) و 62c34dbd (هسته <=0.3) چهارشنبه ارزیابی می‌شوند. شاخص قیمت مصرف‌کننده
    (CPI) 14 اکتبر: بنزین +9.1 ماه‌به‌ماه (انرژی +5.2، نفت گرمایشی +15.3، انرژی 20.4%
    سال‌به‌سال) = ~نیمی از شاخص کل 0.6 - 4dfbd1d8 محقق شد. انتقال اثر این ماه به هسته
    رسید (هسته 0.33: مسکن 0.4، کالاهای هسته 0.3، خدمات حمل‌ونقل 0.6، کرایه پرواز 1.2)
    - برداشت «از شوک عرضه چشم‌پوشی کن» حمایت سررسیدهای کوتاه‌مدت را از دست داد (بازده
    2 ساله +13.6 واحد پایه). مرحله بعد: شاخص قیمت تولیدکننده (PPI) پنجشنبه (خدمات
    هسته = ورودی‌های PCE) تعیین می‌کند آیا اثر به سنجه فدرال رزرو منتقل می‌شود؛ درآمد
    واقعی هفتگی -0.5% هزینه‌ای است که تقاضا می‌پردازد. 20 اکتبر: Goldman - صرف جنگ
    در Brent حدود ~$25/بشکه، دسامبر-26 برابر با $90 (از 85)، 2027 برابر با $80، صادرات
    خلیج فارس نزدیک میانگین‌های 2025، مازاد از سه‌ماهه 4؛ ذخایر راهبردی نفت SPR برابر
    با 283 میلیون بشکه، کمترین از اکتبر 1982 (<40% ظرفیت، ~200 میلیون بشکه باید بازگردانده
    شود)؛ رایت: کشتی‌های ناوگان تاریک ممکن است به تجارت قانونی منتقل شوند («ده‌ها
    تا صدها»)؛ Brent اکتبر-2027 برابر با $83 (+13 از سپتامبر)؛ برنامه $8 میلیاردی
    آمریکا برای گازوئیل کشاورزان (مالی). فرآورده‌ها، نه نفت خام، همچنان عامل انتقال
    اثر هستند؛ رقم نهایی انتظارات 5 ساله UMich در جمعه (مقدماتی 3.5%)، آمار انتظارات
    این هفته است. گزارش کوتاه جمعه 23 اکتبر: تسویه Brent در 113.17 (+4.0%، بالاترین
    سطح پنج‌ماهه)، WTI برابر با 99.47 - و بازده 2 ساله -19 واحد پایه: سررسیدهای کوتاه‌مدت
    نفت را شوک رشد تلقی کردند، نه شوک تورم (خبر مخابره‌شده: «خوراک فراوان برای طرفداران
    سیاست انقباضی... شاید رأی‌گیری با اختلاف آرا» در هفته آینده). ترامپ یادداشت DPA
    s303 را امضا کرد (تولید/پالایش نفت برای دفاع ملی ضروری است؛ تأمین مالی، خرید؛
    در ادامه اقدام آوریل؛ جزئیات منابع مالی نامشخص)؛ فروش نفتکش‌های درج‌شده در فهرست
    OFAC مجاز شد. رقم نهایی انتظارات 5 ساله UMich جمعه 14:00Z (مقدماتی 3.5%) و قیمت‌های
    پرداخت‌شده PMI مقدماتی در 13:45Z، آمار انتظارات روز هستند؛ PCE سپتامبر پنجشنبه
    29 در ساعت 12:30Z.'
