    aec5cc8b (نبودِ بسته‌شدن بازده اوراق 30ساله در سطح >=5.40 از جمعه تا سه‌شنبه،
    0.55 - حاشیهٔ 7 واحد پایه). زیر نظر داشته باشید: حراج‌های اوراق 2ساله/5ساله/7ساله
    در این هفته (تأییدنشده، todo-185 - تا 21 سپتامبر هیچ گزارشی در پایگاه داده بازنشر
