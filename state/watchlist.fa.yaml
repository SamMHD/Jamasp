  why_fa: 'کف تقاضای ساختاری: ~289t تقاضای بخش رسمی در این چرخه، همراه با ازسرگیری
    ورود سرمایه به ETFها، و تنوع‌بخشی به ذخایر با خروج از اوراق خزانه به‌عنوان همتای
    آن در سمت جریان سرمایه (دارایی‌های UST چین در پایین‌ترین سطح از 2008؛ UBS در 9
    سپتامبر دیدگاه بلندمدت خود را حفظ می‌کند؛ گلدمن در 18 سپتامبر، با وجود افزایش
    نرخ بهره، هدف $5,400 را حفظ می‌کند). واکنش انتقال محل نگهداری ذخایر در حال گسترش
    است (DNB انتقال 86t به لندن، فرانسه؛ ونزوئلا در حال بررسی انتقال $4bn از لندن
    -> آمریکا). SGE برابر با 942/g (20 سپتامبر). در مقابل: روسیه فروشنده‌ای مستمر
    است؛ یک مؤسسه پژوهشی (investinglive، 23 سپتامبر) به‌دلیل دلار + فدرال رزرو انقباضی،
    انتظار افت بیشتر در Q4 را دارد، اما به‌واسطه ژئوپلیتیک و خرید بخش رسمی، «کفی محکم
    در حدود $3,800» را پیش‌بینی می‌کند. کف در عمل: 4300 برای GC (~4265 نقدی) - آزمون‌ها
    در 14 سپتامبر 4305.9، در 15 سپتامبر 4304.0، در 16 سپتامبر تیک 4296.7 در 22:19Z،
    سپس بازگشت به 4424.9 در جمعه 18 سپتامبر؛ کف 4335.0 در 22 سپتامبر با موضع «نابود
    کردن یا توافق» ترامپ + بازگشت برنت به 100 حفظ شد، سپس ردیف 4402.2. d571e0f0 در
    23 سپتامبر محقق شد - کف‌ها در این رژیم 9/9، همگی با 0.55 ثبت شده‌اند (شکاف کالیبراسیون،
    منطق فاصله در قاعده 20)، و تک‌تک جهش‌های بازگشتی با عقب‌نشینی نفت از سقف‌هایش
    یا جلسه‌ای با کاهش بازده‌ها همراه بودند؛ هنوز هیچ خریدی در افت، دقیقاً روی خط،
    در روزی با افزایش نفت دیده نشده است. آزمون دهم فعال است: 717f560c (نبود ردیف GC_CLOSE
    با مقدار <=4300.0 از چهارشنبه 23 تا جمعه 25 سپتامبر، 0.55؛ 73 واحد پایین‌تر از
    قیمت نقدی، 0.43x دامنه سه جلسه). تأییدکننده‌ها: خرید خالص در گزارش‌های ماهانه
    WGC در طول افت (خوراک داده wgc همچنان 503)؛ خرید در افت در محدوده 4300-4340 در
    روزی با افزایش نفت. عوامل ابطال: دو ماه متوالی فروش خالص بخش رسمی. 24 سپتامبر:
    گلدمن هدف پایان 2026 را به $4,650 کاهش می‌دهد و $5,400 را برای 2027 حفظ می‌کند
    (investinglive ICYMI) - سمت فروش رژیم نرخ بهره در کوتاه‌مدت را می‌پذیرد. آزمون
    دهم کف فعال است: 717f560c چهارشنبه دوام آورد (ردیف 4325.5)؛ کف شبانه 4309.0 در
    02:06Z، با فاصله نه واحد از خط، در جلسه‌ای با بازده اوراق 2 ساله بدون تغییر -
    هیچ خریدی در افت مشهود نیست، بازگشت به 4324 با افت -1% برنت در پی گزارش نقشه راه
    همراه بود. SGE برابر با 936.61 (21 سپتامبر)؛ چین جمعه تعطیل است + هفته طلایی در
    هفته آینده، بنابراین امکان ارزیابی بازار فیزیکی از دست می‌رود. 25 سپتامبر: آزمون
    دهم کف - ردیف پنجشنبه 4309.5 (دوام آورد)، اما کف تیک در 15:35Z برابر با 4282.9
    بود، در جلسه‌ای با افزایش نفت و بازده اوراق 2 ساله بدون تغییر (زیر 4300 بر مبنای
    تیک، نه بر مبنای ردیف؛ با همین تمایز ثبت شد). بازگشت از کف با گزارش توافق مرحله‌ای
    در 16:18Z (برنت -3) و در طول شب با برنت -1% رخ داد - تقاضای خرید هم‌زمان با کاهش
    نفت، همچنان هیچ خریدی در افت دقیقاً روی خط در روزی با افزایش نفت دیده نشده است.
    تثبیت قیمت عصر XAU برابر با 4266.4، صبح 4255.55. آخرین جلسه 717f560c جمعه است.
    چین جمعه (جشن نیمه پاییز) و 1-8 اکتبر (هفته طلایی) تعطیل است: SGE خاموش، امکان
    ارزیابی بازار فیزیکی برای یک هفته از دست می‌رود - تقاضای خرید ضعیف در زیر هر آزمون
    4300. 26 سپتامبر: 717f560c محقق شد - کف‌ها در این رژیم 10/10، همگی با 0.55 (ردیف‌ها
    4325.5 / 4309.5 / 4321.2؛ کف تیک پنجشنبه، 4282.9، در جلسه‌ای با افزایش نفت از
    خط عبور کرد، اما ردیف عبور نکرد). این هفته هیچ ادعای فعالی درباره کف وجود ندارد
    (قاعده 20: فاصله 4300 از ردیف، 21 واحد / 0.15x دامنه دو جلسه است). تثبیت قیمت
    عصر XAU در جمعه 4261.05، صبح 4290.75. چین از پنجشنبه در 1-8 اکتبر (هفته طلایی)
    تعطیل است: SGE خاموش، تقاضای خرید فیزیکی زیر 4300 برای یک هفته ضعیف است. همچنان
    هیچ خریدی در افت دقیقاً روی خط در روزی با افزایش نفت دیده نشده است؛ بازگشت جمعه
    بخش حرکت همراه با کاهش نفت / کاهش بازده اوراق 2 ساله بود. گزارش کوتاه 3 اکتبر:
    خالص موقعیت‌های سفته‌بازی 210.2K (29 سپتامبر)، -7.5K / -3.5% نسبت به هفته قبل
    - موقعیت‌های کاغذی پیش از انتشار داده کاهش یافتند؛ ردیف 4162.3، به‌اندازه 25-28
    واحد بالاتر از خوشه BB/Fib در (4134-4137)، با استوکاستیک 13؛ SGE تا 8 اکتبر خاموش
    است (بدون امکان ارزیابی بازار فیزیکی). WGC (پنجشنبه): صندوق‌های بازنشستگی در NL/US/UK/AU
    از 2020-21، به‌دنبال گسست همبستگی اوراق قرضه و سهام، 2-5% طلا نگهداری می‌کنند
    - ساختاری است، نه ناشی از جریان معاملات. هیچ ادعایی درباره کف وجود ندارد (در فاصله‌ای
    کمتر از یک ATR، هفته طلایی).'
