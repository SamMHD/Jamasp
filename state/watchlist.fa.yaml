  why_fa: 'پل میان جنگ و فدرال رزرو: انتقال نفت به شاخص قیمت مصرف‌کننده (CPI)، کانال
    فعال احتمال افزایش نرخ بهره است، و نفت در روزهای بدون رویداد فدرال رزرو، تعیین‌کننده
    قیمت طلاست - در هر دو جهت. قیمت‌های تسویه 15 سپتامبر: WTI برابر با 105.83 / برنت
    108.75 (سقف 109.97)؛ از آن زمان، پنج قیمت تسویه پایین‌تر: برنت در 21 سپتامبر 100.34،
    در 22 سپتامبر 99.25 (نخستین تسویه زیر 100 در دو هفته؛ 98.78 در ساعت 03:30Z چهارشنبه)،
    WTI نوامبر ~89-90.5 (قرارداد اکتبر در 22 سپتامبر منقضی شد) - در پی راه‌اندازی
    مجدد خط لوله شرق-غرب عربستان (به‌صورت جزئی، با تغییر مسیر تا 4 میلیون بشکه در
    روز)، ازسرگیری صادرات ینبع، بارگیری ~12 میلیون بشکه در یک روز (Gulf News)، رفت‌وآمدهای
    شاتلی هرمز/جریان‌های با AIS خاموش، دور مذاکرات آمریکا-ایران که هر دو طرف تأیید
    کردند، و رقم اصلی گزارش API مبنی بر افزایش ذخایر در برابر انتظار کاهش. بخش دچار
    کمبود، فرآورده‌هاست: گازوئیل در رکوردهای قیمتی، سوخت جت نیز در پی آن (MarketWatch)،
    ترامپ از ممنوعیت صادرات گازوئیل حمایت می‌کند و تصمیم قرار است «سریع» گرفته شود
    (تحلیلگران: زیان‌بار خواهد بود، نه کمک‌کننده). سطوح fxempire: حمایت برنت 97-97.5
    و سپس میانگین متحرک 50 دوره‌ای در 92.44، مقاومت 102/105؛ حمایت WTI در 90.47 و
    سپس 87.7. آزمون این موضع: برنت <100 همراه با بازده اوراق 2ساله >=4.70 = تأیید
    عدم تقارن، امتیاز دیدگاه نزولی ناشی از نرخ‌های بهره در 50 می‌ماند - در 22 سپتامبر
    ثبت شد (برنت 99.25، حراج اوراق 2ساله 4.787، منحنی رو به بالا)؛ برنت <100 و بازده
    اوراق 2ساله <4.70 = از دست رفتن عامل ورودی (امتیاز دیدگاه نزولی ناشی از نرخ‌های
    بهره 45) هنوز ثبت نشده است. انتقال اثر در اظهارات علنی یک‌طرفه است (اشمید، کشکاری،
    موسالم، بارکین: «شوک‌های ماندگار در قیمت‌گذاری نهادینه شده‌اند»، برآورد وارش از
    PCE برابر با ~3.6)؛ در خارج نیز همین‌طور: ناگل از ECB: «نفت اکنون یک سنجه کلیدی
    تورم است، سیاست اندکی محدودکننده منتفی نیست»، لین: «شوک انرژی طولانی‌تر می‌شود،
    تورم تا میانه 2027 بالا می‌ماند»؛ PMI مقدماتی استرالیا 50.8، با هزینه نهاده‌ها
    در بالاترین سطح 3 ماهه. زنجیره تأمین: شرق-غرب به‌صورت جزئی، ینبع در حال ازسرگیری،
    ایران صفر (CENTCOM)؛ ممنوعیت صادرات گازوئیل روسیه تمدید شد؛ BofA پیش‌بینی برنت
    برای نیمه دوم سال را افزایش داد (Investing.com، خوانده نشده). ادعاها: 4dfbd1d8
    (رقم کل سپتامبر >=0.4، 0.65)؛ 62c34dbd (هسته <=0.3، 0.7)؛ بررسی میان‌دوره‌ای طبق
    قاعده 11 در 30 سپتامبر؛ f7a0c23d (هیچ تسویه برنت >=103 از چهارشنبه تا جمعه، 0.55)؛
    8e425cab با نخستین تسویه صعودی نفت اجرا می‌شود. 24 سپتامبر: برنت با وجود افزایش
    3 میلیون بشکه‌ای ذخایر نفت خام (ذخایر بنزین و فرآورده‌های تقطیری کاهش یافت)، راه‌اندازی
    مجدد شرق-غرب و صادرات عراق >3 میلیون بشکه در روز، در 103.08 (+3.9%) تسویه شد -
    صرف ریسک با اظهارات مربوط به هرمز بازقیمت‌گذاری می‌شود، نه با بشکه‌ها؛ 102.10
    در ساعت 03:30Z. فرآورده‌ها: کاخ سفید با وجود مخالفت کابینه، «به ممنوعیت 90 روزه
    صادرات گازوئیل نزدیک‌تر می‌شود» (تکذیب قبلی کاخ سفید؛ گازوئیل پس از نوسان رفت‌وبرگشتی
    شدید، اندکی پایین‌تر تسویه شد)؛ سناتورهای هر دو حزب خواستار آزادسازی اضطراری نفت
    گرمایشی هستند؛ رکورد قیمت گازوئیل در حال انتقال به قیمت مواد غذایی است (MarketWatch).
    ممنوعیت، مؤلفه انرژی شاخص قیمت مصرف‌کننده (CPI) آمریکا را اندکی تعدیل می‌کند،
    در حالی که عرضه جهانی را محدودتر می‌سازد - ادعاهای سپتامبر (4dfbd1d8 / 62c34dbd)
    این اثر را در بر دارند، بررسی میان‌دوره‌ای در 30 سپتامبر. واردات نفت آسیا همچنان
    13% پایین‌تر از پیش از جنگ است (Gulf News). آزمون عدم تقارن همچنان برقرار است:
    برنت <100 همراه با بازده اوراق 2ساله >=4.70 در 22 سپتامبر تأیید شد؛ بازده اوراق
    2ساله در حرکت صعودی نفت نیز دنباله‌رو نبود - پیشتاز بود (PMI). 25 سپتامبر: برنت
    در پی موشک‌های حوثی‌ها به سوی ینبع/طائف، در 106.60 تسویه شد (+3.4%، بالاترین قیمت
    پایانی از 15 سپتامبر؛ +5% در سقف‌ها)، WTI در 94.61 (روند نزولی شش‌جلسه‌ای قطع
    شد)؛ سپس در معاملات شبانه با گزارش توافق مرحله‌ای -1% (105.55 در ساعت 03:31Z).
    ینبع مسیر جایگزین شرق-غرب است: investinglive می‌گوید بارگیری نفتکش‌ها در آنجا
    «هنوز از سر گرفته نشده»، در برابر گزارش 24 سپتامبر Gulf News مبنی بر «12 میلیون
    بشکه در یک روز» - تعارض، شنبه از طریق gcaptain حل شود. فرآورده‌ها: رایت در حال
    نظرخواهی از پالایشگران درباره محدودیت‌های داوطلبانه صادرات گازوئیل است (گزارش
    ممنوعیت 90 روزه را رد می‌کند)؛ اتحادیه اروپا هشدار می‌دهد ممنوعیت به هر دو طرف
    زیان می‌رساند. آرامکو در حال بررسی مسیرهای صادراتی 4 و 5 است. بررسی میان‌دوره‌ای
    در 30 سپتامبر (4dfbd1d8 / 62c34dbd). تاریخ PCE اوت تا 26 سپتامبر در جریان اخبار
    نیست (برآورد وارش ~3.6% سال‌به‌سال) - شنبه تأیید شود. 26 سپتامبر: برنت با طرح
    هفت‌روزه عراقچی در 104.32 تسویه شد (-2.1%، -$3 از سقف‌ها؛ +5.1% هفته‌به‌هفته نسبت
    به 99.25)، WTI در 92.44 (-2.3%)؛ بخش کوتاه‌سررسید منحنی نیز همراه شد (-3.5 واحد
    پایه) - به kinetic-transmission-inverted مراجعه کنید. تاریخ PCE تأیید شد: چهارشنبه
    30 سپتامبر ساعت 12:30Z (تقویم actionforex + چشم‌انداز هفته پیش روی Wells Fargo)
    - اجماع برای رقم کل 0.4 ماه‌به‌ماه / 3.7% سال‌به‌سال، هسته 0.3 / 3.4%؛ بازنگری‌های
    سالانه BEA در همان انتشار («روند کوتاه‌مدت ملایم‌تر، رقم اوت داغ‌تر»)؛ بیدارباش
    #62 برای زمان انتشار+45 ثبت شد (13:15Z) - به b934960e امتیاز می‌دهد (بدون بازنشر
    <55%) و بررسی میان‌دوره‌ای طبق قاعده 11 را برای 4dfbd1d8 / 62c34dbd اجرا می‌کند
    (میانگین برنت سپتامبر ~103-104 در برابر ~90 در اوت بوده است: ادعای رقم کل >=0.4
    در مسیر تحقق است؛ هسته <=0.3 به مسکن/سفر وابسته است). ISM پنجشنبه ساعت 14:00Z،
    اجماع قیمت‌های پرداخت‌شده 72 (از 71.1). تعارض بارگیری ینبع حل‌نشده است (جست‌وجوی
    gcaptain: هیچ موردی با تاریخ پس از 3 اوت؛ گزارش 24 سپتامبر Gulf News با عبارت
    «جهش هفت‌برابری، AIS خاموش» تنها گزارش تاریخ‌دار باقی می‌ماند). Kpler: جریان نفت
    خام هرمز در این هفته 33.7 میلیون بشکه در برابر 49.2 میلیون در هفته گذشته - بخش
    فیزیکی محدودتر شد، در حالی که صرف ریسک تخلیه شد. 27 سپتامبر: برنت نوامبر 104.32
    (تسویه جمعه؛ قرارداد نوامبر چهارشنبه 30 سپتامبر منقضی می‌شود - نماد @LCO.1 در
    CNBC آن روز به دسامبر منتقل می‌شود، بنابراین هر ادعای تسویه برنت که چهارشنبه را
    در بر می‌گیرد، قرارداد را مشخص می‌کند، قاعده 17؛ a270f3f1 و 9e1829f8 سه‌شنبه بسته
    می‌شوند و تحت تأثیر نیستند)، WTI نوامبر 92.44 (-8% هفته‌به‌هفته نسبت به ~100.30؛
    actionforex: میانگین متحرک نمایی 55 روزه 89.14 و سطح اصلاح 50% در 86.90 سطوحی
    هستند که شکستشان نشان می‌دهد افزایش ناشی از جنگ پایان یافته است - به آن‌ها نرسیده).
    رد علنی ترامپ (شنبه)، طرحی را کنار می‌زند که صرف ریسک را تخلیه کرده بود؛ بازقیمت‌گذاری
    صعودی در گشایش یکشنبه انتظار می‌رود. بخش فیزیکی محدودتر شد، در حالی که صرف ریسک
    افت کرد (Kpler، 33.7 میلیون در برابر 49.2 میلیون بشکه). تعارض بارگیری ینبع همچنان
    حل‌نشده است. تورم مورد انتظار یک سال آینده در نظرسنجی UMich برابر با 4.6%. PCE
    چهارشنبه ساعت 12:30Z (اجماع 0.4/3.7، هسته 0.3/3.4): بررسی عمیق #62، بررسی میان‌دوره‌ای
    طبق قاعده 11 را برای 4dfbd1d8 / 62c34dbd اجرا می‌کند (میانگین برنت سپتامبر ~103-105
    در برابر ~90 در اوت: ادعای رقم کل >=0.4 در مسیر تحقق است؛ هسته <=0.3 به مسکن/سفر
    وابسته است). قیمت‌های پرداخت‌شده ISM پنجشنبه (اجماع 72). گزارش کوتاه 30 سپتامبر:
    بررسی میان‌دوره‌ای طبق قاعده 11 اجرا شد - برنت سپتامبر در تمام ماه در محدوده 100-109
    تسویه شد (+10% ماه‌به‌ماه طبق مرور؛ WTI سومین افزایش ماهانه پیاپی را ثبت کرد)،
    در برابر ~90 در اوت: عامل سوخت برای شاخص قیمت مصرف‌کننده (CPI) سپتامبر پابرجاست،
