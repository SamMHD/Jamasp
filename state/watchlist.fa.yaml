  why_fa: 'جنگ از مسیر افزایش نرخ بهره فدرال رزرو و اخطار تأمین وجه تضمین به طلا می‌رسد،
    نه از مسیر تقاضا برای دارایی امن. شواهد 14 جلسه معاملاتی در 2-21 سپتامبر، با شدیدترین
    نمونه در 21 سپتامبر (اصابت به دو نفتکش، نفت -3.7%، طلا -1.0%، BTC +7.1%). در خلاف
    این جهت: یک جلسه (9 سپتامبر). 22 سپتامبر - بخش تنش‌زدایی: یک دور مذاکرات آمریکا
    و ایران با تأیید هر دو طرف، برنت در 99.25 تسویه شد (-1.1%، پنج جلسه نزولی)، طلای
    نقدی +0.5% / ردیف بدون تغییر، منحنی بازده 1.5-2.3bp صعود کرد، دلار در اواخر معاملات
    تضعیف شد، سپس در معاملات شبانه تقویت شد و طلا رشد خود را پس داد. بند جریان معاملات
    درباره محرک (قاعده 23): حدود 18:30Z ثبت شد، GC در پایان معاملات Globex از 4390
    -> 4396 رفت - هدف در هر دو جهت محقق نشد، وزن‌ها حفظ شدند. دریچه: افزایش نفت باعث
    فروش طلا می‌شود (از مسیر بازده اوراق 2 ساله)؛ کاهش نفت بر اثر دیپلماسی، طلا را
    بدون تغییر تا نزولی نگه می‌دارد (صرف ریسک خود طلا تخلیه می‌شود، بازده اوراق 2
    ساله همراهی نمی‌کند) - تنها مسیر صعود طلا، کاهش بازده اوراق 2 ساله است که به یک
    عضو هیئت‌مدیره فدرال رزرو یا تغییر تعیین‌کننده در داده‌های آمریکا نیاز دارد، نه
    یک تیتر خبری. ادعاها: 64c7ba41 در 23 سپتامبر نامشخص (دوشنبه/سه‌شنبه هیچ تسویه
    صعودی نفتی نبود)؛ جانشین آن 8e425cab (0.5) در نخستین تسویه صعودی برنت از چهارشنبه
    تا جمعه فعال می‌شود (ردیف <+1% = تحقق؛ نبود چنین تسویه‌ای = نامشخص)؛ f7a0c23d
    (0.55): از چهارشنبه تا جمعه هیچ تسویه برنتی >=103 نباشد - ادعای تخلیه صرف ریسک.
    تأییدکننده‌ها: تسویه صعودی نفت همراه با طلای بدون تغییر/نزولی؛ حمله آمریکا به
    ایران که با افت طلا قیمت‌گذاری شود؛ متنی با تأیید هر دو طرف که با نفت -5% و افت
    طلا قیمت‌گذاری شود. ابطال‌کننده‌ها: عدم تحقق 8e425cab -> اقدام نظامی 35؛ دو ردیف
    متوالی با صعود طلا / صعود بازده اوراق 2 ساله؛ طلا +1% در یک جلسه نزولی نفت با
    بازده اوراق 2 ساله بدون تغییر؛ رویدادی در سمت عرضه که بازار آن را به‌صورت رکود
    تورمی معامله کند (صعود سررسیدهای بلندمدت، افت دلار، صعود طلا)؛ متنی که با برنت
    -5%، صعود طلا و بازده اوراق 2 ساله بدون تغییر قیمت‌گذاری شود -> اقدام نظامی 25.
    24 سپتامبر: 8e425cab محقق شد - نخستین تسویه صعودی نفت (103.08، +3.9%) ردیف طلا
    را در -1.74% ثبت کرد؛ از 2 سپتامبر، 14 جلسه صعودی نفت با بسته‌شدن طلا بدون تغییر/نزولی،
    یک جلسه در خلاف این جهت. تعدیل طبق قاعده 9: بازقیمت‌گذاری ناشی از PMI/بار نیز
    در همان روز رخ داد. f7a0c23d محقق نشد (سقف تخلیه صرف ریسک در یک جلسه شکسته شد؛
    درس: سطوح نفت مشمول آزمون فاصله قاعده 20 می‌شوند). بخش تخلیه در معاملات شبانه:
    برنت با گزارش نقشه راه -1%، طلا بدون تغییر در 4324، بازده اوراق 2 ساله بدون تغییر
    - دیپلماسی تقاضای خرید ایجاد نمی‌کند. اقدام نظامی 25. ابطال‌کننده‌ها بدون تغییر:
    ثبت وضعیت رکود تورمی (بازده اوراق 30 ساله >=5.45، افت DXY، صعود طلا)؛ دو ردیف
    با صعود هر دو؛ طلا +1% با افت نفت و بازده اوراق 2 ساله بدون تغییر. 25 سپتامبر:
    پانزدهمین جلسه صعودی نفت که با طلای بدون تغییر/نزولی بسته شد (برنت بر اثر حملات
    موشکی به ینبع +3.4% تا 106.60؛ ردیف -0.37%). شکاف: در 16:18Z گزارش توافق مرحله‌ای
    برنت را -3 و GC را +20 جابه‌جا کرد (4292.7 -> 4312.1)، در حالی که بازده اوراق
    2 ساله بدون تغییر بود - نخستین تقاضای خرید طلا همراه با افت نفت در این رژیم -
    که تا 18:00Z محو شد؛ سپس در معاملات شبانه، برنت -1% تقاضایی ایجاد کرد که طلا را
    +24 تا 4328.5 بالا برد. کوچک است، اما زنجیره اکنون در معاملات درون‌روزی هر دو
    جهت را نشان می‌دهد. ادعای جدید a270f3f1 (0.55): نخستین تسویه برنت -3% از جمعه
    تا سه‌شنبه، ردیف GC +1% ثبت نمی‌کند؛ عدم تحقق با بازده اوراق 2 ساله بدون تغییر
    -> اقدام نظامی 20، پایه 25 (بخش تخلیه برای طلا تقاضای خرید ایجاد می‌کند = رژیم
    در حال سست‌شدن است). سایر ابطال‌کننده‌ها بدون تغییر. 26 سپتامبر - دریچه در سررسیدهای
    کوتاه‌مدت دوطرفه است: جمعه برنت بر اثر طرح هفت‌روزه در 104.32 تسویه شد (-2.1%)،
    بازده اوراق 2 ساله با -3.5bp در 4.86 بسته شد، DXY -0.22%، ردیف GC +0.27% (4321.2)،
    طلای نقدی +$8 - نخستین جلسه این رژیم که در آن افت نفت، بازده سررسیدهای کوتاه‌مدت
    را پایین کشید و برای طلا تقاضای خرید ایجاد کرد، بدون هیچ واسطه یا سخنرانی در این
    میان. همان زنجیره (قاعده 22)، با علامت معکوس؛ این تقاضا برای دارایی امن نبود (طلا
    بالا رفت چون بازده اوراق 2 ساله پایین آمد). شمارش: 15 جلسه از 16 جلسه صعودی نفت
    با طلای بدون تغییر/نزولی بسته شدند؛ جلسات نزولی نفت اکنون شامل 3 جلسه بدون تغییر
    تا نزولی (21، 22، 24 سپتامبر) در برابر 1 جلسه صعودی هستند (25 سپتامبر، از مسیر
    بازده اوراق 2 ساله). بازنگری: شاخه توافق اکنون به صعود ملایم طلا منجر می‌شود (+0.5-1%
    در برابر برنت -5-8%)، با سقفی که تخلیه صرف ریسک ایجاد می‌کند - فرض «بدون تغییر
    تا نزولی» پنج‌شنبه کنار گذاشته شد (درس ثبت شد). a270f3f1 (0.55) آزمون است: نخستین
    تسویه برنت -3% تا سه‌شنبه نباید ردیف +1% ثبت کند (جمعه -2.1%، ردیف +0.27% ثبت
    کرد؛ با تعدیل مقیاس، -3% ~ +0.4%). ادعای جدید 95c71900 (هیچ ردیفی >=4402.2 در
    دوشنبه تا سه‌شنبه نباشد، 0.5) سقف هر یک از دو شاخه است. اقدام نظامی 25. ابطال‌کننده‌ها
    بدون تغییر: عدم تحقق a270f3f1 با بازده اوراق 2 ساله بدون تغییر -> 20 / پایه 25؛
    دو ردیف با صعود هر دو؛ ثبت وضعیت رکود تورمی.'
