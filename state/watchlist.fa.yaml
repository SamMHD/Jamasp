  why_fa: 'بازده‌های واقعی محرک غالب طلا هستند، و این فدرال رزرو همین حالا نرخ بهره
    را افزایش داد: 16 سپتامبر +25bp به 3.75-4.00%، با رأی 12-0، بدون جمله‌ای درباره
    راهنمایی آینده؛ نمودار نقطه‌ای یک افزایش دیگر در 2026 را نشان می‌دهد (میانه 4.1؛
    16 نفر از 18 نفر انتظار >=1 افزایش دیگر دارند). وارش: «انقباضی نیست»، برآورد PCE
    اوت ~3.6%. جناح منطقه‌ای همچنان افزایش بیشتری می‌خواهد: موسالم، کالینز، گولزبی
    (21 سپتامبر)؛ کالینز دوباره در 22 سپتامبر («می‌توان بر ثبات قیمت‌ها تمرکز کرد»)؛
    بارکین 22 سپتامبر 17:00Z (CFA بالتیمور): «ریسک‌های تورم بر ریسک‌های اشتغال حداکثری
    می‌چربند»، >60% از دسته‌های PCE بالای >3%، بنگاه‌ها هزینه‌ها را منتقل می‌کنند،
    شاید یک «تذکر» کافی نباشد - اما این چرخه «می‌تواند شبیه تعدیل میان‌چرخه‌ای گرینسپن
    باشد» (همان ~75bp در میانه دهه 1990): انقباضی با یک سقف، و سهام سازندگان مسکن
    با این اظهارات رشد کرد. دو نوبت سخنرانی اعضای هیئت‌مدیره/نیویورک (جفرسون، ویلیامز
    22 سپتامبر) درباره سازوکارهای اجرایی بود - بدون راهنمایی آینده. معاملات بازار:
    حراج اوراق 2ساله ($69bn، 22 سپتامبر) با بازده 4.787 انجام شد، 0.2bp بالاتر از
    بازده پیش از حراج، امتیاز C - بالاترین بازده اوراق 2ساله از 2024 عرضه را بدون
    تنش جذب کرد؛ منحنی با افزایش 1.5-2.3bp بسته شد (CNBC: اوراق 5ساله 4.842، 10ساله
    4.967، 30ساله 5.303)، در جلسه‌ای که برنت -1.1% بود و یک دور مذاکرات آمریکا-ایران
    به تأیید هر دو طرف رسید - سررسیدهای کوتاه همراه نفت پایین نمی‌آیند (چشم‌پوشی از
    شوک، بر اساس اظهارات ثبت‌شده، منتفی است: اشمید، کشکاری، آن سه نفر، بارکین). بازده
    پایانی اوراق 2ساله در 22 سپتامبر قابل بازیابی نیست (US2Y در CNBC خالی است). قیمت‌گذاری:
    اکتبر «کمی بیش از 50%» (investinglive ساعت 13:38Z در 22 سپتامبر، بدون بازنشر بعدی)؛
    BofA همچنان اکتبر + دسامبر را پیش‌بینی می‌کند؛ دویچه بانک: بازارها چرخه جهانی
    افزایش نرخ بهره را کمتر از واقع قیمت‌گذاری می‌کنند. نقاط بررسی: اوراق 2ساله 4.791-4.800
    (شکست = هدف برآوردی 5.055؛ پس‌زده‌شدن و سپس <4.600 = برگشت)؛ DXY برابر با 100.02
    / 100.58 / 101.80. شرط تغییر موضع (تأیید اکتبر توسط یک عضو هیئت‌مدیره -> سناریوی
    نزولی ناشی از نرخ بهره 60؛ درخواست مکث -> سناریوی پایه 30) فعال نشده است. سخنرانان
    (ff_calendar، Low، todo-188): بار چهارشنبه 23 ساعت 14:05Z (wakeup #59، ابتدا بررسی
    محل برگزاری - فهرست هیئت‌مدیره فقط وام‌دهی فرصت دوباره و هوش مصنوعی را نشان می‌دهد)؛
    ویلیامز 08:10Z، بارکین 12:30Z، هامک 12:50Z، پالسن 14:10Z پنجشنبه؛ ویلیامز 09:15Z،
    هامک 18:00Z جمعه. گزاره‌ها: fc5c5a29 (هیچ بازده پایانی اوراق 2ساله <4.60 تا 25
    سپتامبر، 0.55)؛ 4872cd75 (بازنشر احتمال اکتبر >=45% تا جمعه، 0.55)؛ 1a513d72 (هیچ
    بازنشر >=60% تا چهارشنبه 23:59Z، 0.55 - ریسک بار)؛ d8e247ef (هیچ جفت متوالی با
    صعود هر دو تا دوشنبه 28، 0.7 - سه‌شنبه ردیف بدون تغییر بود، نه صعود هر دو). ایستگاه‌های
    بعدی: بار چهارشنبه؛ قیمت‌های پرداختی PMI مقدماتی آمریکا چهارشنبه 13:45Z؛ شاخص
    قیمت مصرف‌کننده (CPI) سپتامبر در میانه اکتبر؛ FOMC در 28 اکتبر. گزارش 24 سپتامبر:
    تغییر موضع چهارشنبه فعال شد (وزن‌ها 15/60/25). PMI ترکیبی مقدماتی 58.4 (هزینه
    نهاده‌ها در بالاترین سطح از اکتبر 2022) + بار («در سناریوی پایه من، احتمالاً تعدیل‌های
    بیشتری در سیاست لازم خواهد بود») -> اکتبر 65% در جمع‌بندی پایانی (74% طی روز،
    «94bp دیگر از اینجا»)؛ اوراق 2ساله در 4.895 بسته شد (+12bp، CNBC)، 10ساله 5.114
    (بالاترین سطح از 2007)، 30ساله 5.402 (اولین بسته‌شدن >=5.40)، DXY برابر با 101.12؛
    ردیف طلا -1.74%. 1a513d72 محقق نشد (بازنشر >=60% از پست PMI در 13:51Z آمد). فعال:
    6e168240 (اوراق 2ساله >=4.80 چهارشنبه محقق شد، بخش پنجشنبه)، 1e91793f (هیچ بازنشر
    <55% پنجشنبه-جمعه، 0.55)، 4872cd75 (>=45%)، fc5c5a29 (هیچ بسته‌شدن <4.60). پنجشنبه:
    SNB ساعت 07:30Z، ویلیامز 08:10Z (محل برگزاری در فهرست فدرال رزرو نیویورک نیست)،
    درخواست‌های بیمه بیکاری 12:30Z اجماع 200K، بارکین 12:30Z، هامک 12:50Z، پالسن 14:10Z؛
    جمعه ویلیامز 09:15Z، اشمید 13:20Z، هامک 18:00Z - همگی رؤسای منطقه‌ای، هیچ عضو
    هیئت‌مدیره‌ای نیست، صرفاً نشانگرهای پایش. شرط بازگشت موضع: یک بازنشر <55% یا درخواست‌های
    بیمه بیکاری >230K همراه با درخواست مکث از سوی ویلیامز -> سناریوی نزولی ناشی از
    نرخ بهره 50. گزارش 25 سپتامبر: وزن‌ها در 15/60/25 حفظ شدند. پنجشنبه جمع حامیان
    افزایش گسترده‌تر شد و بازار از آن جلو زد: اکتبر 77.5% (بازنشر actionforex از قراردادهای
    آتی وجوه فدرال در 09:16Z؛ جمع‌بندی قاره آمریکا هیچ جمله‌ای درباره احتمال نداشت).
    ویلیامز (مجمع سیاست کلان لندن): یک افزایش نرخ بهره دیگر در 2026 «معقول» است، به
    اکتبر متعهد نشد، راهنمایی آینده «تمام شده»، اقتصاد «در برابر افزایش قیمت انرژی
    تاب‌آور» است؛ هامک: ریسک‌ها «به سمت بالا متمایل‌اند»، خطر ایجاد «ذهنیت تورمی»
    از شوک‌های مکرر؛ پالسن (دارای حق رأی): «ممکن است مقداری انقباض بیشترِ ملایم موجه
    باشد». درخواست‌های بیمه بیکاری 197K، فروش خانه‌های نوساز 684K. اوراق 2ساله در
    4.895 (CNBC) / 4.916 (جمع‌بندی) بسته شد، 10ساله 5.163 (بالاترین سطح از 2007)،
    30ساله 5.460 (بالاترین سطح از 2004). 6e168240 محقق شد (هر دو بخش). فعال: 1e91793f
    (>=55%) و 4872cd75 (>=45%) جمعه در مسیری منتهی به تحقق بسته می‌شوند؛ fc5c5a29
    جمعه بسته می‌شود؛ مورد جدید 86f87a36 (هیچ بازده پایانی اوراق 2ساله <4.80 جمعه-سه‌شنبه،
    0.55). سخنرانان جمعه: ویلیامز 09:15Z (دوباره)، اشمید 13:20Z، هامک 18:00Z - هیچ
    عضو هیئت‌مدیره‌ای نیست؛ برنامه فدرال رزرو برای 28-29 سپتامبر هنوز در خوراک داده
    نیست. شرط بازگشت موضع بدون تغییر: یک بازنشر <55% یا درخواست مکث از سوی یک عضو
    هیئت‌مدیره -> سناریوی نزولی ناشی از نرخ بهره 50. NFP در 2 اکتبر: wakeup #61. گزارش
    26 سپتامبر: وزن‌ها در 15/60/25 حفظ شدند (روز سوم). جمعه: اوراق 2ساله با طرح هفت‌روزه
    عراقچی و برنت -2.1% در 4.86 بسته شد (-3.5bp؛ بازگشایی 4.912، کف 4.845) - سررسیدهای
    کوتاه برای نخستین بار در این رژیم همراه نفت پایین آمدند (~1.7bp به‌ازای هر درصد
    تغییر برنت)، بدون بازنشر و بدون سخنران در جلسه؛ جمع‌بندی: «با فروکش‌کردن نگرانی‌های
    تورمی، دلار اندکی ضعیف‌تر شد». اوراق 10ساله 5.165 بدون تغییر (طی روز 5.23، بالاترین
    سطح از 2007)، 30ساله 5.49 (بالاترین سطح از 2004). ویلیامز (جمعه): شوک‌های پایدار
    عرضه مبارزه را دشوارتر می‌کنند؛ بازار کار منشأ تورم نیست؛ تعرفه‌ها به‌تنهایی تورم
    پایدار ایجاد نمی‌کنند. هیچ بازنشر احتمال برای جمعه در هیچ‌جا وجود ندارد (جست‌وجو
    شد) - آخرین رقم 77.5% (پنجشنبه). ارزیابی‌شده: fc5c5a29 محقق شد (هیچ بازده پایانی
    اوراق 2ساله <4.60)، 4872cd75 محقق شد (>=45%)، 1e91793f محقق شد (>=55%). فعال:
    86f87a36 (هیچ بازده پایانی اوراق 2ساله <4.80 جمعه-سه‌شنبه؛ رقم 4.86 جمعه شرط را
    پاس می‌کند)؛ مورد جدید b934960e (هیچ بازنشر روز PCE با مقدار <55% در چهارشنبه
    30 سپتامبر، 0.55) که در deepdive #62 در زمان انتشار+45 ارزیابی می‌شود. هفته آینده
    از طریق خلاصه تقویم actionforex + پیش‌نگر هفته ولز فارگو تأیید شد (BLS/BEA 403):
    PCE چهارشنبه 30 سپتامبر 12:30Z (اجماع 0.4/3.7 کل، 0.3/3.4 هسته؛ بازنگری‌های سالانه
    «روند ملایم‌تر، اوت داغ‌تر»)، ISM پنجشنبه 1 اکتبر 14:00Z (55.0؛ قیمت‌های پرداختی
    72)، NFP جمعه 2 اکتبر 12:30Z (اجماع 100K در برابر 162K، UR برابر با 4.1، AHE برابر
    با 0.3؛ تاریخ wakeup #61 پابرجاست)، RBA سه‌شنبه 04:30Z (4.60)، شاخص قیمت مصرف‌کننده
    (CPI) منطقه یورو جمعه (3.7%). سخنرانان فدرال رزرو دوشنبه-جمعه: هیچ‌کس در هیچ خوراک
    داده‌ای دیده نمی‌شود (todo-001/188؛ فهرست هیئت‌مدیره = عنوان‌های گذشته). شروط
    تغییر موضع: بازنشر <55% یا درخواست مکث از سوی یک عضو هیئت‌مدیره -> سناریوی نزولی
    ناشی از نرخ بهره 50؛ بازنشر PCE با مقدار >=80% همراه با بازده پایانی اوراق 2ساله
    >=4.95 -> 65؛ توافقی با تأیید هر دو طرف همراه با اوراق 2ساله <4.75 -> 50 (صعود
    طلا از مسیر سررسیدهای کوتاه). گزارش 27 سپتامبر: وزن‌ها در 15/60/25 حفظ شدند (روز
    چهارم). اصلاحیه: یک بازنشر جمعه وجود داشت - مطلب توضیحی شنبه CNBC (13:30Z): CME
    FedWatch برای اکتبر 64%، در برابر 77.5% پنجشنبه - افت 13.5 واحد درصدی با طرح عراقچی
    و برنت -2.1%، بدون داده، بدون سخنران. انتظارات تورمی یک‌سال آینده دانشگاه میشیگان
    در سپتامبر 4.6% (از 4.0%، بالاترین سطح از ژوئن). گزارش هفتگی actionforex: «قیمت‌گذاری
    فدرال رزرو تا جمعه از افراط میانه هفته عقب نشست»؛ اوراق 2ساله به محدوده کشیدگی
    رسیده است (RSI روزانه >72؛ سقف 4.912، هدف برآوردی 5.055) و اوراق 10ساله (سقف 5.23،
    هدف برآوردی 5.413) اکنون جهت دلار را تعیین می‌کند؛ مقاومت DXY برابر با 101.80-102.86،
    محدوده عقب‌نشینی 99.7-99.9 در صورت توقف صعود اوراق 10ساله. رد علنی طرح هفت‌روزه
    از سوی ترامپ (شنبه، پس از تسویه جمعه) زنجیره نفت -> اوراق 2ساله را در آستانه مهلت
    رضایی دوباره به سمت بالا هدایت می‌کند. مورد جدید efd9700b (هیچ بازنشر <55% دوشنبه
    28 - سه‌شنبه 29، 0.55؛ سقف قاعده-19 به‌دلیل نامشخص‌بودن برنامه سخنرانان) جانشین
    1e91793f می‌شود؛ b934960e روز PCE را پوشش می‌دهد. سخنرانان فدرال رزرو دوشنبه-جمعه:
    هنوز هیچ‌کس دیده نمی‌شود (از صفحه تقویم هیئت‌مدیره فقط سربرگ آن استخراج می‌شود).
    شروط تغییر موضع بدون تغییر: بازنشر <55% یا درخواست مکث از سوی یک عضو هیئت‌مدیره
    -> سناریوی نزولی ناشی از نرخ بهره 50؛ بازنشر PCE با مقدار >=80% همراه با بازده
    پایانی اوراق 2ساله >=4.95 -> 65. گزارش 28 سپتامبر: بازگشایی زنجیره را به حرکت
    درآورد - اوراق 2ساله 4.90 (+3.7bp)، 10ساله 5.20، 30ساله 5.51 (سقف 5.525)، طلا
    -2.1%؛ احتمال اکتبر 64% پابرجاست (در تغییرات جدید بازنشری نیست، efd9700b دارای
    9 واحد درصد حاشیه است). سخنرانان اکنون از طریق جدول رویدادها قابل مشاهده‌اند (با
    برچسب Low): بومن دوشنبه 12:15Z (محل برگزاری تأیید نشده - نشانگر پایش، قاعده 24؛
    فهرست هیئت‌مدیره سخنرانی‌های نظارتی او در لندن را درج کرده است)، کوک 17:25Z، بارکین
    17:30Z؛ سه‌شنبه بومن/بار/گولزبی/ موسالم/ویلیامز/والر 15:00-19:00Z؛ پنجشنبه والر
    14:00Z همراه با ISM. بسنت یکشنبه: فدرال رزرو باید «ذهنی باز» داشته باشد (بهره‌وری
    هوش مصنوعی) - عامل نقضِ مکث تحمیلی برای 288a87ac (هیچ جفت متوالی با صعود هر دو
    از سه‌شنبه 29 سپتامبر - دوشنبه 5 اکتبر، 0.65). d8e247ef محقق شد (خانواده 3/3).
    گزارش 29 سپتامبر: بازنشر ~70% برای اکتبر و ~60% برای اکتبر+دسامبر (investinglive
    دوشنبه 22:59Z)؛ کوک (اوکلند، دوشنبه) اندکی انقباضی‌تر - هوش مصنوعی + نفت همچنان
    تورم را «در ماه‌های آینده» بالا می‌برند، افزایش‌های بیشتر نرخ بهره وابسته به داده‌هاست،
    بازار کار «در موقعیت مناسبی برای تحمل» نرخ‌های بالاتر قرار دارد؛ بومن چیزی درباره
    سیاست نگفت. بازده پایانی اوراق 2ساله 4.924 (+6.4bp)، 10ساله 5.242، 30ساله 5.562:
    سررسیدهای بلند با محرک عرضه/بازده‌های واقعی هدایت را به دست گرفتند (ضعیف‌ترین
    حراج اوراق 7ساله در یک سال)، بنابراین بازده پایانی اوراق 10ساله >5.25 همراه با
    ثابت‌ماندن اوراق 2ساله، نشانه جدید حرکت صرفاً سررسیدهای بلند است. سه‌شنبه: شش
    سخنران - بومن 15:00Z (عنوان‌های نظارتی منشن هاوس)، بار 16:40Z، گولزبی 17:00Z،
    موسالم 17:30Z، ویلیامز 18:00Z، والر 19:00Z (فهرست هیئت‌مدیره: «چشم‌انداز اقتصادی
    و... اطلاع‌رسانی سیاستی من»، بدون تاریخ - deepdive #63 مشروط در 19:45Z). گزاره‌های
    فعال: efd9700b (هیچ بازنشر <55% تا سه‌شنبه)، 86f87a36 (هیچ بازده پایانی اوراق
    2ساله <4.80 تا سه‌شنبه)، b934960e (جلسه PCE)، 288a87ac (هیچ جفت با صعود هر دو
    تا 5 اکتبر). ایستگاه‌های بعدی: PCE چهارشنبه 12:30Z (#62)، ISM+والر پنجشنبه 14:00Z،
    NFP جمعه 12:30Z (#61). 29 سپتامبر #64 (19:45Z): ویلیامز (دارای حق رأی دائمی) 18:00Z
    - پس از سپتامبر «نیازی به عجله نیست»، اگر اقتصاد مطابق انتظارات پیش برود «احتمالاً
    یک افزایش نرخ بهره دیگر امسال»، تورم امسال 3.5% / در 2028 برابر با 2%؛ بازنشر
