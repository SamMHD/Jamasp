  why_fa: 'ین یکی از ستون‌های تقاضای ناشی از کاهش ارزش پول بود: USDJPY پس از مداخلهٔ
    ناموفق اوت در 159-160 ثابت مانده بود؛ این وضعیت در 3-8 سپتامبر شکست (160.4 ->
    153.3). 18 سپتامبر: بانک مرکزی ژاپن نرخ بهره را به 1.25% افزایش داد (بالاترین
    سطح از 1995)، با رأی 7-2، بدون اعلام زمان‌بندی؛ اوئدا: «مرحلهٔ سیاست‌گذاری تغییر
    کرده است»، افزایش نرخ بهره ادامه خواهد یافت؛ انتظار بازار: یک افزایش نرخ بهره
    در هر فصل، نوبت بعدی دسامبر/حوالی آغاز سال، نرخ نهایی 1.75-2%. جریان معاملات:
    استعلام نرخ ارز از سوی بانک مرکزی ژاپن در 158.05 - سطح مورد دفاع 158 است، نه 160.
    22 سپتامبر: USDJPY در 157.50 (+0.45%، سومین روز صعودی، در حال آزمودن سطح اصلاحی
    61.8% به گزارش investinglive)، با تعطیلی توکیو در سه‌شنبه و چهارشنبه (معاملات
    کم‌حجم در هفتهٔ تعطیلات؛ طبق آمار CFTC، صندوق‌های پوشش ریسک برای نخستین بار از
    ژوئیهٔ 2025 در ین خالص موقعیت خرید دارند). طلا در هیچ‌یک از دو جهت از ین تأثیری
    نگرفت (بررسی عمیق #56: ین تنها از مسیر DXY بر طلا اثر می‌گذارد، و DXY برابر با
    +0.11 است). در کنار FOMC بخوانید: یک شکاف نرخ بهرهٔ رو به گسترش، هر دو سوی آن
    به نفع دلار - معامله بر مبنای نرخ‌های بهرهٔ نسبی، نه کاهش ارزش پول. باز: be4d6b22
    (عدم ثبت نرخ >=160 برای USDJPY تا 24 سپتامبر، 0.55؛ 1.6% از ظرفیت). نشست بعدی
    بانک مرکزی ژاپن 30 اکتبر، دو روز پس از نشست FOMC در 28 اکتبر - دومین پنجرهٔ همگرایی.
    تغییر سناریو: >=160 با عبور از سد وزارت دارایی = بازگشت ستون، پایه 30؛ <152 همراه
    با افت Nikkei+BTC = رژیم نقدینگی.'
