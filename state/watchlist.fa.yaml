  why_fa: 'پل ارتباطی جنگ با فدرال رزرو: انتقال نفت به شاخص قیمت مصرف‌کننده (CPI)،
    کانال فعال احتمال افزایش نرخ بهره است، و نفت در روزهای بدون رویداد فدرال رزرو
    تعیین‌کننده قیمت طلاست — در هر دو جهت. قیمت تسویه 15 سپتامبر: WTI برابر با 105.83
    / Brent برابر با 108.75 (سقف 109.97)؛ از آن زمان پنج تسویه پایین‌تر: 21 سپتامبر
    Brent برابر با 100.34، 22 سپتامبر BRENT برابر با 99.25 (نخستین تسویه زیر 100 در
    دو هفته؛ 98.78 در ساعت 03:30Z چهارشنبه)، WTI نوامبر حدود 89-90.5 (قرارداد اکتبر
    در 22 سپتامبر منقضی شد) — در پی راه‌اندازی مجدد خط لوله شرق-غرب عربستان (به‌صورت
    جزئی، با تغییر مسیر تا 4 میلیون بشکه در روز)، ازسرگیری صادرات ینبع، بارگیری حدود
    12 میلیون بشکه در یک روز (Gulf News)، رفت‌وآمدهای شاتلی در هرمز/جریان‌های دارای
    AIS خاموش، دور مذاکرات آمریکا و ایران که هر دو طرف تأیید کرده‌اند، و خبر API از
    افزایش ذخایر در برابر انتظار کاهش. بخش دچار تنگنای عرضه، فرآورده‌هاست: گازوئیل
    در سطوح رکوردی، سوخت جت نیز در پی آن (MarketWatch)، ترامپ از ممنوعیت صادرات گازوئیل
    حمایت می‌کند و می‌گوید تصمیم «سریع» گرفته خواهد شد (تحلیلگران: زیان‌بار خواهد
    بود، نه کمک‌کننده). سطوح fxempire: حمایت Brent در 97-97.5 و سپس میانگین متحرک
    50 دوره‌ای در 92.44، مقاومت 102/105؛ حمایت WTI در 90.47 و سپس 87.7. آزمون این
    موضع: Brent <100 همراه با بازده 2 ساله >=4.70 = تأیید عدم تقارن، امتیاز دیدگاه
    نزولی ناشی از نرخ‌های بهره در 50 باقی می‌ماند — در 22 سپتامبر ثبت شد (Brent برابر
    با 99.25، حراج اوراق 2 ساله 4.787، منحنی رو به بالا)؛ Brent <100 و بازده 2 ساله
    <4.70 = از دست رفتن عامل ورودی (امتیاز دیدگاه نزولی ناشی از نرخ‌های بهره 45) هنوز
    ثبت نشده است. انتقال اثر، بر اساس اظهارات ثبت‌شده، یک‌طرفه است (اشمید، کشکاری،
    موسالم، بارکین: «شوک‌های ماندگار در قیمت‌گذاری جا افتاده‌اند»، برآورد وارش از
    PCE حدود 3.6)؛ در خارج نیز همین‌طور: ناگل از ECB: «نفت اکنون یک سنجه کلیدی تورم
    است، موضع اندکی محدودکننده منتفی نیست»، لین: «شوک انرژی طولانی‌تر دوام می‌آورد،
    تورم تا میانه 2027 بالا می‌ماند»؛ PMI مقدماتی استرالیا 50.8 با هزینه نهاده‌ها
    در بالاترین سطح 3 ماهه. زنجیره تأمین: فعالیت جزئی شرق-غرب، ازسرگیری فعالیت ینبع،
    ایران صفر (CENTCOM)؛ ممنوعیت صادرات گازوئیل روسیه تمدید شد؛ BofA پیش‌بینی Brent
    خود برای H2 را افزایش داد (Investing.com، خوانده‌نشده). ادعاها: 4dfbd1d8 (تورم
    کل سپتامبر >=0.4، 0.65)؛ 62c34dbd (تورم هسته <=0.3، 0.7)؛ بررسی میان‌دوره‌ای rule-11
    در 30 سپتامبر؛ f7a0c23d (هیچ تسویه Brent در چهارشنبه تا جمعه >=103 نباشد، 0.55)؛
    8e425cab با نخستین تسویه صعودی نفت اجرا می‌شود. 24 سپتامبر: Brent با وجود افزایش
    3 میلیون بشکه‌ای ذخایر نفت خام (ذخایر بنزین و فرآورده‌های تقطیری کاهش یافت)، راه‌اندازی
    مجدد شرق-غرب و صادرات عراق >3 میلیون بشکه در روز، در 103.08 (+3.9%) تسویه شد —
    صرف قیمت بر اساس اظهارات درباره هرمز بازقیمت‌گذاری می‌شود، نه بشکه‌ها؛ 102.10
    در ساعت 03:30Z. فرآورده‌ها: کاخ سفید با وجود مخالفت کابینه «به ممنوعیت 90 روزه
    صادرات گازوئیل نزدیک‌تر می‌شود» (تکذیب قبلی کاخ سفید؛ گازوئیل پس از نوسان رفت‌وبرگشتی
    شدید، اندکی پایین‌تر تسویه شد)؛ سناتورهای هر دو حزب خواستار آزادسازی اضطراری ذخایر
    نفت گرمایشی‌اند؛ رکورد قیمت گازوئیل در حال انتقال به قیمت مواد غذایی است (MarketWatch).
    ممنوعیت، مؤلفه انرژی شاخص قیمت مصرف‌کننده (CPI) آمریکا را اندکی کاهش می‌دهد، در
    حالی که عرضه جهانی را محدودتر می‌کند — ادعاهای سپتامبر (4dfbd1d8 / 62c34dbd) این
    اثر را در بر می‌گیرند، بررسی میان‌دوره‌ای در 30 سپتامبر. واردات نفت آسیا همچنان
    13% کمتر از پیش از جنگ است (Gulf News). آزمون عدم تقارن همچنان برقرار است: Brent
    <100 همراه با بازده 2 ساله >=4.70 در 22 سپتامبر تأیید شد؛ بازده 2 ساله در حرکت
    صعودی نفت نیز دنباله‌رو آن نبود — پیشتاز بود (PMI). 25 سپتامبر: Brent در پی موشک‌های
    حوثی‌ها به سوی ینبع/طائف در 106.60 تسویه شد (+3.4%، بالاترین قیمت پایانی از 15
    سپتامبر؛ +5% در سقف‌ها)، WTI برابر با 94.61 (روند نزولی شش‌جلسه‌ای شکسته شد)؛
    سپس در معاملات شبانه در پی گزارش توافق مرحله‌ای -1% (105.55 در ساعت 03:31Z). ینبع
    مسیر جایگزین شرق-غرب است: investinglive می‌گوید بارگیری نفتکش‌ها در آنجا «هنوز
    از سر گرفته نشده است»، در برابر گزارش 24 سپتامبر Gulf News مبنی بر «12 میلیون
    بشکه در یک روز» — تعارض، شنبه از طریق gcaptain حل شود. فرآورده‌ها: رایت در حال
    نظرخواهی از پالایشگران درباره محدودیت‌های داوطلبانه صادرات گازوئیل است (گزارش
    ممنوعیت 90 روزه را رد می‌کند)؛ اتحادیه اروپا هشدار می‌دهد ممنوعیت به هر دو طرف
    آسیب می‌زند. آرامکو در حال بررسی مسیرهای صادراتی 4 و 5 است. بررسی میان‌دوره‌ای
    30 سپتامبر (4dfbd1d8 / 62c34dbd). تاریخ انتشار PCE اوت تا 26 سپتامبر در خوراک
    خبری نیست (برآورد وارش حدود 3.6% سال‌به‌سال) — شنبه بررسی شود. 26 سپتامبر: Brent
    در پی طرح هفت‌روزه عراقچی در 104.32 تسویه شد (-2.1%، -$3 نسبت به سقف‌ها؛ +5.1%
    هفته‌به‌هفته از 99.25)، WTI برابر با 92.44 (-2.3%)؛ بخش کوتاه‌مدت منحنی نیز همراهی
    کرد (-3.5 واحد پایه) — رجوع شود به kinetic-transmission-inverted. تاریخ PCE تأیید
    شد: چهارشنبه 30 سپتامبر ساعت 12:30Z (تقویم actionforex + چشم‌انداز هفته پیش روی
    Wells Fargo) — اجماع برای تورم کل 0.4 ماه‌به‌ماه / 3.7% سال‌به‌سال، هسته 0.3 /
    3.4%؛ بازنگری‌های سالانه BEA در همان انتشار («روند کوتاه‌مدت ملایم‌تر، رقم اوت
    داغ‌تر»)؛ بیدارباش #62 برای زمان انتشار+45 رزرو شده است (13:15Z) — به b934960e
    امتیاز می‌دهد (بدون بازانتقال <55%) و بررسی میان‌دوره‌ای rule-11 را برای 4dfbd1d8
    / 62c34dbd اجرا می‌کند (میانگین Brent در سپتامبر حدود 103-104 در برابر حدود 90
    در اوت بوده است: ادعای تورم کل >=0.4 در مسیر تحقق است؛ تورم هسته <=0.3 به مسکن/سفر
    وابسته است). ISM پنجشنبه ساعت 14:00Z، اجماع شاخص قیمت‌های پرداختی 72 (از 71.1).
    تعارض بارگیری ینبع حل‌نشده است (جست‌وجوی gcaptain: هیچ مطلبی با تاریخ پس از 3
    اوت؛ گزارش 24 سپتامبر Gulf News با عبارت «جهش هفت‌برابری، AIS خاموش» تنها گزارش
    تاریخ‌دار باقی مانده است). Kpler: جریان نفت خام هرمز این هفته 33.7 میلیون بشکه
    در برابر 49.2 میلیون بشکه هفته گذشته — بخش فیزیکی عرضه محدودتر شد، در حالی که
    صرف قیمت فروکش کرد.'
