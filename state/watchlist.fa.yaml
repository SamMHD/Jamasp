    کف بازده دوساله است — پنج‌شنبه این کف شکست. گزارش کوتاه شنبه 24 اکتبر: نشست بانک
    ژاپن در 29-30 اکتبر در ردیف هفتگی actionforex تأیید شد (تصمیم 06:00Z / نشست خبری
    06:30Z — زمان‌بندی خود بانک ژاپن ثابت نیست؛ در 18 سپتامبر انتشار در 02:30Z بود،
    در برابر ردیف 05:30Z): یادآور #76 برای جمعه 30 اکتبر 07:30Z ثبت شد (زمان دیرتر
    +60، قاعده 16). اجماع بازار: تثبیت در 1.25%، گزارش چشم‌انداز، افزایش به 1.50%
    در دسامبر؛ شاخص قیمت مصرف‌کننده (CPI) توکیو پنج‌شنبه 23:30Z (اجماع هسته 2.6%).
    USDJPY جمعه در 156.81 (-0.07%)؛ ین دارایی امن پنج‌شنبه بود، نه جمعه. این مؤلفه
