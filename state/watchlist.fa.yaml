    برنده می‌شود). 25 سپتامبر: نخستین داده در این مسیر - investinglive/Reuters: بازده
    اوراق 10ساله در 5.2 «در حال آزمودن میزان تحمل بازار سهام است» و با نزدیک بودن
    Nasdaq به رکوردها، بر ارزش‌گذاری‌های هوش مصنوعی فشار می‌آورد. پنجشنبه: S&P -0.02%
    با Meta +4.5% که «افت‌کرده‌ها را پنهان می‌کند» (Arm -7.9%)، Dow -0.31%، Russell
