  why_fa: 'بازخریدهای گسترش‌یافتهٔ اوراق بلندمدت خزانه‌داری (19 اوت) عملاً کنترل منحنی
    بازده هستند و بازار آن‌ها را به‌منزلهٔ کاهش ارزش پول تعبیر کرد - رژیم روندی طلا
    زمانی آغاز شد که بدهی آمریکا از $40tn گذشت. این ابزار در 9-10 سپتامبر در برابر
    چشم همگان شکست خورد (حراج اوراق 30y در 5.308 «ضعیف» بود). 18 سپتامبر: «اوراق قرضه
    دوباره سقوط می‌کنند» - اوراق 10y در 5.00 و 30y در 5.328 - و طلا با دلارِ بدون
    تغییر افزایش یافت: یک جلسهٔ معاملاتی. 21 سپتامبر: بخش بلندمدت منحنی با افت -3.7%
    نفت صعود کرد (30y در 5.280) و طلا افت کرد. 22 سپتامبر: حراج اوراق 2y ($69bn) در
    4.787 با فاصلهٔ 0.2bp بالاتر از بازده پیش از حراج، با نمرهٔ C، انجام شد - هیچ
    تنشی در بخش کوتاه‌مدت وجود نداشت؛ منحنی با افزایش 1.5-2.3bp بسته شد (5y در 4.842،
    10y در 4.967، 30y در 5.303؛ جمع‌بندی investinglive تغییر 10y را -6bp ثبت کرده
    بود - اختلاف در مبنای محاسبه، قیمت پایانی CNBC مبناست)، در حالی که طلای نقدی $22
    افزایش یافت و ردیف بدون تغییر بود - بخش بلندمدت در هیچ‌یک از دو جهت پیشروِ طلا
    نیست. aec5cc8b در 23 سپتامبر محقق شد (هیچ بازده پایانی 30y در جمعه تا سه‌شنبه
    >=5.40 نبود؛ سقف 5.311 بود). پرلی (فدرال رزرو نیویورک): خرید اسناد خزانه «متوقف
    شده، تمام نشده است». زیر نظر بگیرید: حراج‌های 5y/7y در چهارشنبه/پنجشنبه (تأییدنشده،
    todo-185 - هیچ گزارش بازنشرشده‌ای در پایگاه داده نیست)، هرگونه اظهارنظر بسنت دربارهٔ
    انتشار اوراق (حضورهای او در 21-22 سپتامبر صرفاً دربارهٔ ایران/چین/گازوئیل بود)،
    و اینکه آیا 30y در هیچ جلسه‌ای همراه با طلا حرکت می‌کند. 24 سپتامبر: بازده 30y
    در 5.402 بسته شد (CNBC) - نخستین بسته‌شدن بالاتر از 5.40 - همراه با 10y در 5.114
    (سقف از 2007) و 2y در 4.895: حرکتی در واکنش به PMI که ابتدا افزایش بازده همراه
    با تخت‌شدن منحنی و سپس جابه‌جایی موازی آن بود، با افت طلا و صعود دلار. بخش بلندمدت
    از سطح عبور کرد و طلا آن را کاهش ارزش پول تعبیر نکرد (aec5cc8b پیش‌تر در پایان
    معاملات سه‌شنبه محقق شده بود). حراج‌های 5y/7y همچنان تأییدنشده‌اند (هیچ گزارش
    بازنشرشده‌ای در پایگاه داده نیست، todo-185). زیر نظر بگیرید: بسته‌شدن بازده 30y
    در >=5.45 همراه با افت DXY و صعود طلا تنها ثبت بازاری است که سناریوی پایه را تغییر
    می‌دهد. 25 سپتامبر: ابزار دوباره شکست خورد - خزانه‌داری دومین بازخرید خود در دو
    هفته را انجام داد و حراج 7y ($44bn) در 5.085% با فاصلهٔ 0.7bp بالاتر از بازده
    پیش از حراج انجام شد؛ بازده 30y در 5.460 بسته شد (+5.9bp، بالاترین سطح در 22 سال؛
    تصویر لحظه‌ای در جمع‌بندی 5.478)، 10y در 5.163 (سقف از ژوئیهٔ 2007)، نرخ وام‌های
    مسکن 7%. رویترز به نقل از investinglive: «بازخریدها و مداخله در بازار ین نتوانسته‌اند
    بازده‌ها را مهار کنند»؛ استراتژیست‌ها عمدهٔ افزایش از مارس را به انتظارات افزایش
    نرخ بهره از سوی فدرال رزرو و باقی را به رشد و نفت نسبت دادند؛ «6% برای 10y در
    حال تبدیل‌شدن به آستانهٔ درد بعدی است». در سطح جهانی: استقراض بی‌سابقهٔ آلمان
    به میزان ~EUR525bn، اوراق دولتی آلمان در سقف 17 ساله، اوراق دولتی 10y ژاپن در
    سقف از 1996. طلا نزولی همراه با DXY صعودی - به‌منزلهٔ کاهش ارزش پول تعبیر نشد.
    تنها عامل تغییر سناریوی پایه: 30y در >=5.50 همراه با افت DXY و صعود طلا. 26 سپتامبر:
    بازده 30y در 5.49 بسته شد (+2.8bp، بالاترین سطح از 2004؛ طی روز 5.532)، 10y در
    5.165 (طی روز 5.23، سقف از 2007)، فاصلهٔ 2s30s برابر با 63bp (+12bp در دو جلسه
    با افت بازده 2y) - افزایش بازده همراه با پرشیب‌شدن منحنی در روزی که دلار 0.22%
    افت کرد و طلا 0.27% افزایش یافت: بخش بلندمدت به دلایل خاص خودش فروخته می‌شود (عرضه،
    بازنگری‌ها، «6% مطرح است» به‌عنوان مطلب ضروریِ investinglive) و طلا همچنان آن
    را کاهش ارزش پول تعبیر نمی‌کند، حتی با کناررفتن مانع دلار. جزئیات حراج‌های 5y/7y
    همچنان تأییدنشده است (todo-185). پایان فصل چهارشنبه است. تنها عامل تغییر سناریوی
    پایه: بسته‌شدن بازده 30y در >=5.50 همراه با افت DXY و صعود طلا. 27 سپتامبر: مطلب
    توضیحی CNBC (تیری ویزمن از مک‌کواری): بازده 10y در 5.23 «بیشتر به انتشار اوراق
    قرضه مربوط است تا موضوع تورم» - تأمین مالی کسری بودجه به‌علاوهٔ بدهی برای مخارج
    سرمایه‌ای هوش مصنوعی (ونگارد: $132bn اوراق منتشرشده توسط Alphabet/Amazon/Meta/Microsoft/Oracle
    تا پایان ژوئیه در برابر حدود ~$35bn در سال طی 2020-24؛ $300-570bn انتشار اوراق
    مرتبط با هوش مصنوعی در سال جاری)، «فدرال رزروی نداریم که با شدت سیاست انقباضی
    اجرا کند»، «این بازده‌ها می‌توانند بالاتر بروند». بخش بلندمدت روایتی از عرضهٔ
    اوراق با دیرش بالاست که بازار آن را به نفع دلار قیمت‌گذاری می‌کند - نشانهٔ مخالف
    طلا (17 مخالف / 2 موافق) پابرجاست. actionforex: بازده 10y (سقف کانال 5.23، برآورد
    5.413) اکنون عامل کلیدی دلار است؛ توقف صعود، DXY را به 99.7-99.9 بازمی‌گرداند.
    جمعه: 30y در 5.49 همراه با افت DXY و صعود 0.3% طلا - یک bp و یک واحد اندازه کمتر
    از آستانهٔ فعال‌شدن base-25. جزئیات 5y/7y همچنان تأییدنشده است (todo-185). پایان
    فصل چهارشنبه است. تنها عامل تغییر سناریوی پایه: بسته‌شدن بازده 30y در >=5.50 همراه
    با افت DXY و صعود طلا.'
