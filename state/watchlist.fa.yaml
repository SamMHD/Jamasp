    کار نیست - S&P +0.5% و Nasdaq در رکورد، به اتکای امیدها درباره ایران و «عقب‌نشینی
    از اوج‌های +5.20% بازده اوراق 10ساله»؛ کاهش اندازه ناخالص موقعیت‌ها (فروش Meta
