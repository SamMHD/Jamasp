  why_fa: 'بازده‌های واقعی محرک غالب طلا هستند، و این فدرال رزرو همین حالا نرخ بهره
    را افزایش داد: 16 سپتامبر +25 واحد پایه به 3.75-4.00%، با رأی 12-0، بدون جمله‌ای
    درباره راهنمایی آتی؛ نمودار نقطه‌ای از یک افزایش دیگر در 2026 حکایت دارد (میانه
    4.1؛ 16 نفر از 18 نفر >=1 افزایش دیگر را پیش‌بینی می‌کنند). وارش: «انقباضی نیست»،
    برآورد PCE اوت ~3.6%. جناح منطقه‌ای همچنان خواهان افزایش بیشتر است: موسالم، کالینز،
    گولزبی (21 سپتامبر)؛ کالینز دوباره در 22 سپتامبر («می‌توان بر ثبات قیمت‌ها تمرکز
    کرد»)؛ بارکین 22 سپتامبر 17:00Z (CFA بالتیمور): «ریسک‌های تورم از ریسک‌های حداکثر
    اشتغال بیشتر است»، >60% از دسته‌های PCE بالاتر از >3%، شرکت‌ها هزینه‌ها را منتقل
    می‌کنند، شاید یک «گوشزد» کافی نباشد - اما این چرخه «می‌تواند شبیه تعدیل میان‌چرخه‌ای
    گرینسپن باشد» (همان ~75 واحد پایه در میانه دهه 1990): انقباضی با یک سقف، و سهام
    شرکت‌های خانه‌سازی در واکنش به آن رشد کرد. دو نوبت مربوط به عضو هیئت‌مدیره/نیویورک
    (جفرسون، ویلیامز 22 سپتامبر) درباره سازوکارهای عملیاتی بودند - بدون راهنمایی آتی.
    معاملات بازار: حراج اوراق 2 ساله ($69 میلیارد، 22 سپتامبر) در 4.787 تسویه شد،
    با فاصله 0.2 واحد پایه بالاتر از بازده پیش از حراج، درجه C - بالاترین بازده اوراق
    2 ساله از 2024، عرضه را بدون تنش جذب کرد؛ منحنی بازده در پایان 1.5-2.3 واحد پایه
    بالاتر بسته شد (CNBC: اوراق 5 ساله 4.842، 10 ساله 4.967، 30 ساله 5.303)، در جلسه‌ای
    با برنت -1.1% و یک دور مذاکرات آمریکا-ایران با تأیید هر دو طرف - بخش کوتاه‌مدت
    منحنی همراه نفت پایین نمی‌رود (نادیده‌گرفتن شوک، بر اساس اظهارات ثبت‌شده، منتفی
    شد: اشمید، کشکاری، آن سه نفر، بارکین). قیمت پایانی اوراق 2 ساله در 22 سپتامبر
    قابل بازیابی نیست (US2Y در CNBC خالی است). قیمت‌گذاری: اکتبر «کمی بیش از 50%»
    (investinglive در 13:38Z روز 22 سپتامبر، بدون بازنشر بعدی)؛ BofA همچنان اکتبر
    + دسامبر را پیش‌بینی می‌کند؛ دویچه بانک: بازارها چرخه جهانی افزایش نرخ بهره را
    کمتر از واقع قیمت‌گذاری می‌کنند. نقاط بررسی: اوراق 2 ساله 4.791-4.800 (شکست =
    هدف برآوردی 5.055؛ پس‌زده‌شدن و سپس <4.600 = برگشت روند)؛ DXY برابر با 100.02
    / 100.58 / 101.80. شرط تغییر سناریو (تأیید اکتبر از سوی یک عضو هیئت‌مدیره -> سناریوی
    نزولی ناشی از نرخ بهره 60؛ درخواست توقف -> سناریوی پایه 30) فعال نشده است. سخنرانان
    (ff_calendar، کم، todo-188): بار چهارشنبه 23 در 14:05Z (بیدارباش #59، ابتدا بررسی
    محل برگزاری - نمایه هیئت‌مدیره فقط وام‌دهی فرصت دوباره و هوش مصنوعی را نشان می‌دهد)؛
    ویلیامز 08:10Z، بارکین 12:30Z، هاماک 12:50Z، پاولسون 14:10Z پنجشنبه؛ ویلیامز 09:15Z،
    هاماک 18:00Z جمعه. گزاره‌ها: fc5c5a29 (هیچ بسته‌شدن اوراق 2 ساله در <4.60 تا 25
    سپتامبر، 0.55)؛ 4872cd75 (بازنشر احتمال اکتبر >=45% تا جمعه، 0.55)؛ 1a513d72 (هیچ
    بازنشر >=60% تا چهارشنبه 23:59Z، 0.55 - ریسک بار)؛ d8e247ef (هیچ جفت متوالی با
    افزایش هر دو تا دوشنبه 28، 0.7 - ردیف سه‌شنبه بدون تغییر بود، نه با افزایش هر
    دو). نقاط تصمیم بعدی: بار چهارشنبه؛ مؤلفه قیمت‌های پرداختی PMI مقدماتی آمریکا
    چهارشنبه 13:45Z؛ شاخص قیمت مصرف‌کننده (CPI) سپتامبر در میانه اکتبر؛ FOMC در 28
    اکتبر. گزارش کوتاه 24 سپتامبر: تغییر سناریو چهارشنبه فعال شد (وزن‌ها 15/60/25).
    PMI ترکیبی مقدماتی 58.4 (هزینه نهاده‌ها در بالاترین سطح از اکتبر 2022) + بار («در
    سناریوی پایه من، احتمالاً تعدیل‌های بیشتری در سیاست لازم خواهد بود») -> احتمال
    اکتبر 65% در گزارش پایانی (74% در طول روز، «94 واحد پایه دیگر از اینجا»)؛ اوراق
    2 ساله در 4.895 بسته شد (+12 واحد پایه، CNBC)، 10 ساله 5.114 (بالاترین سطح از
    2007)، 30 ساله 5.402 (نخستین بسته‌شدن در >=5.40)، DXY برابر با 101.12؛ ردیف طلا
    -1.74%. 1a513d72 ناموفق (بازنشر >=60% از پست PMI در 13:51Z آمد). فعال: 6e168240
    (اوراق 2 ساله >=4.80 چهارشنبه محقق شد، بخش پنجشنبه)، 1e91793f (هیچ بازنشر <55%
    پنجشنبه-جمعه، 0.55)، 4872cd75 (>=45%)، fc5c5a29 (هیچ بسته‌شدن در <4.60). پنجشنبه:
    SNB در 07:30Z، ویلیامز 08:10Z (محل برگزاری در نمایه فدرال رزرو نیویورک نیست)،
    درخواست‌های بیمه بیکاری 12:30Z با اجماع 200K، بارکین 12:30Z، هاماک 12:50Z، پاولسون
    14:10Z؛ جمعه ویلیامز 09:15Z، اشمید 13:20Z، هاماک 18:00Z - همگی رؤسای منطقه‌ای،
    بدون عضو هیئت‌مدیره، صرفاً نشانه‌های پایش. شرط بازگشت سناریو: یک بازنشر <55% یا
    درخواست‌های بیمه بیکاری >230K همراه با درخواست توقف از سوی ویلیامز -> سناریوی
    نزولی ناشی از نرخ بهره 50. گزارش کوتاه 25 سپتامبر: وزن‌ها در 15/60/25 حفظ شدند.
    پنجشنبه بر شمار صداهای هم‌نظر افزود و بازار جلوتر از آن‌ها حرکت کرد: اکتبر 77.5%
    (بازنشر actionforex از قراردادهای آتی وجوه فدرال در 09:16Z؛ گزارش پایانی قاره
    آمریکا هیچ جمله‌ای درباره احتمال نداشت). ویلیامز (مجمع سیاست‌گذاری کلان لندن):
    یک افزایش نرخ بهره دیگر در 2026 «معقول» است، به اکتبر متعهد نشد، راهنمایی آتی
    «تمام شده»، اقتصاد «در برابر افزایش قیمت انرژی تاب‌آور» است؛ هاماک: ریسک‌ها «به
    سمت بالا متمایل‌اند»، خطر شکل‌گیری «ذهنیت تورمی» بر اثر شوک‌های مکرر؛ پاولسون
    (دارای حق رأی): «مقداری انقباض بیشتر و ملایم ممکن است موجه باشد». درخواست‌های
    بیمه بیکاری 197K، فروش خانه‌های نوساز 684K. اوراق 2 ساله در 4.895 (CNBC) / 4.916
    (گزارش پایانی) بسته شد، 10 ساله 5.163 (بالاترین سطح از 2007)، 30 ساله 5.460 (بالاترین
    سطح از 2004). 6e168240 محقق شد (هر دو بخش). فعال: 1e91793f (>=55%) و 4872cd75
    (>=45%) جمعه پایان می‌یابند و در مسیر تحقق هستند؛ fc5c5a29 جمعه پایان می‌یابد؛
    گزاره جدید 86f87a36 (هیچ بسته‌شدن اوراق 2 ساله در <4.80 جمعه-سه‌شنبه، 0.55). سخنرانان
    جمعه: ویلیامز 09:15Z (دوباره)، اشمید 13:20Z، هاماک 18:00Z - بدون عضو هیئت‌مدیره؛
    برنامه 28-29 سپتامبر فدرال رزرو هنوز در خوراک نیست. شرط بازگشت سناریو بدون تغییر:
    یک بازنشر <55% یا درخواست توقف از سوی یک عضو هیئت‌مدیره -> سناریوی نزولی ناشی
    از نرخ بهره 50. NFP در 2 اکتبر: بیدارباش #61. گزارش کوتاه 26 سپتامبر: وزن‌ها در
    15/60/25 حفظ شدند (روز سوم). جمعه: اوراق 2 ساله با طرح هفت‌روزه عراقچی و برنت
    -2.1% در 4.86 بسته شد (-3.5 واحد پایه؛ بازگشایی 4.912، کف 4.845) - بخش کوتاه‌مدت
    منحنی برای نخستین بار در این رژیم همراه نفت پایین رفت (~1.7 واحد پایه به ازای
    هر درصد تغییر برنت)، بدون بازنشر و بدون سخنران در جلسه؛ گزارش پایانی: «دلار با
    فروکش‌کردن نگرانی‌های تورمی اندکی ضعیف‌تر بود». اوراق 10 ساله 5.165 بدون تغییر
    (درون‌روزی 5.23، بالاترین سطح از 2007)، 30 ساله 5.49 (بالاترین سطح از 2004). ویلیامز
    (جمعه): شوک‌های مداوم عرضه مبارزه را دشوارتر می‌کنند؛ بازار کار منبع تورم نیست؛
    تعرفه‌ها به‌تنهایی تورم پایدار ایجاد نمی‌کنند. هیچ بازنشر احتمالی در جمعه در هیچ‌جا
    یافت نشد (جست‌وجو شد) - آخرین رقم 77.5% (پنجشنبه). ارزیابی‌شده: fc5c5a29 محقق
    شد (هیچ بسته‌شدن اوراق 2 ساله در <4.60)، 4872cd75 محقق شد (>=45%)، 1e91793f محقق
    شد (>=55%). فعال: 86f87a36 (هیچ بسته‌شدن اوراق 2 ساله در <4.80 جمعه-سه‌شنبه؛ جمعه
    4.86 شرط را پاس می‌کند)؛ گزاره جدید b934960e (هیچ بازنشر <55% در روز PCE، چهارشنبه
    30 سپتامبر، 0.55) که با بررسی عمیق #62 در زمان انتشار+45 ارزیابی می‌شود. هفته
    آینده از طریق خلاصه تقویم actionforex + پیش‌نگر هفته ولز فارگو تأیید شد (BLS/BEA
    با خطای 403): PCE چهارشنبه 30 سپتامبر 12:30Z (اجماع 0.4/3.7 کل، 0.3/3.4 هسته؛
    بازنگری‌های سالانه «روند ملایم‌تر، اوت داغ‌تر»)، ISM پنجشنبه 1 اکتبر 14:00Z (55.0؛
    قیمت‌های پرداختی 72)، NFP جمعه 2 اکتبر 12:30Z (اجماع 100K در برابر 162K، UR برابر
    با 4.1، AHE برابر با 0.3؛ تاریخ بیدارباش #61 برقرار است)، RBA سه‌شنبه 04:30Z (4.60)،
    شاخص قیمت مصرف‌کننده (CPI) منطقه یورو جمعه (3.7%). سخنرانان فدرال رزرو دوشنبه-جمعه:
    هیچ‌کس در هیچ خوراکی قابل مشاهده نیست (todo-001/188؛ نمایه هیئت‌مدیره = عناوین
    گذشته). شروط تغییر سناریو: بازنشر <55% یا درخواست توقف از سوی یک عضو هیئت‌مدیره
    -> سناریوی نزولی ناشی از نرخ بهره 50؛ بازنشر PCE در >=80% همراه با بسته‌شدن اوراق
    2 ساله در >=4.95 -> 65؛ توافقی با تأیید هر دو طرف همراه با اوراق 2 ساله <4.75
    -> 50 (صعود طلا از مسیر بخش کوتاه‌مدت منحنی). گزارش کوتاه 27 سپتامبر: وزن‌ها در
    15/60/25 حفظ شدند (روز چهارم). اصلاحیه: یک بازنشر جمعه وجود داشت - مطلب توضیحی
    شنبه CNBC (13:30Z): CME FedWatch برای اکتبر 64%، در برابر 77.5% پنجشنبه - افت
    13.5 واحد درصدی بر اثر طرح عراقچی و برنت -2.1%، بدون داده، بدون سخنران. انتظارات
    تورمی یک‌سال‌آینده دانشگاه میشیگان در سپتامبر 4.6% (از 4.0%، بالاترین سطح از ژوئن).
    گزارش هفتگی actionforex: «قیمت‌گذاری فدرال رزرو تا جمعه از سطح افراطی میانه هفته
    عقب نشست»؛ اوراق 2 ساله بیش‌ازحد کشیده شده است (RSI روزانه >72؛ سقف 4.912، هدف
    برآوردی 5.055) و اکنون اوراق 10 ساله (سقف 5.23، هدف برآوردی 5.413) مسیر دلار را
    تعیین می‌کند؛ مقاومت DXY در 101.80-102.86، محدوده عقب‌نشینی 99.7-99.9 در صورت
    توقف اوراق 10 ساله. رد علنی طرح هفت‌روزه از سوی ترامپ (شنبه، پس از تسویه جمعه)
    در آستانه ضرب‌الاجل رضایی، زنجیره نفت -> اوراق 2 ساله را دوباره رو به بالا قرار
    می‌دهد. گزاره جدید efd9700b (هیچ بازنشر <55% دوشنبه 28 - سه‌شنبه 29، 0.55؛ سقف
    قاعده 19 به‌دلیل نامشخص‌بودن برنامه سخنرانان) جایگزین 1e91793f می‌شود؛ b934960e
    روز PCE را پوشش می‌دهد. سخنرانان فدرال رزرو دوشنبه-جمعه: هنوز هیچ‌کس قابل مشاهده
    نیست (از صفحه تقویم هیئت‌مدیره فقط سربرگ آن استخراج می‌شود). شروط تغییر سناریو
    بدون تغییر: بازنشر <55% یا درخواست توقف از سوی یک عضو هیئت‌مدیره -> سناریوی نزولی
    ناشی از نرخ بهره 50؛ بازنشر PCE در >=80% همراه با بسته‌شدن اوراق 2 ساله در >=4.95
    -> 65. گزارش کوتاه 28 سپتامبر: بازگشایی زنجیره را به حرکت درآورد - اوراق 2 ساله
    4.90 (+3.7 واحد پایه)، 10 ساله 5.20، 30 ساله 5.51 (سقف 5.525)، طلا -2.1%؛ احتمال
    اکتبر 64% پابرجاست (هیچ بازنشری در تغییرات جدید نیست، efd9700b به‌اندازه 9 واحد
    درصد حاشیه دارد). سخنرانان اکنون از طریق جدول رویدادها قابل مشاهده‌اند (با برچسب
    کم): بومن دوشنبه 12:15Z (محل برگزاری تأیید نشده - نشانه پایش، قاعده 24؛ نمایه
    هیئت‌مدیره سخنرانی‌های نظارتی او در لندن را فهرست می‌کند)، کوک 17:25Z، بارکین
    17:30Z؛ سه‌شنبه بومن/بار/گولزبی/ موسالم/ویلیامز/والر 15:00-19:00Z؛ پنجشنبه والر
    14:00Z همراه با ISM. بسنت یکشنبه: فدرال رزرو باید «ذهنی باز» داشته باشد (بهره‌وری
    هوش مصنوعی) - عامل ابطال ناشی از توقف تحمیلی برای 288a87ac (هیچ جفت متوالی با
    افزایش هر دو از سه‌شنبه 29 سپتامبر - دوشنبه 5 اکتبر، 0.65). d8e247ef محقق شد (خانواده
    3/3). گزارش کوتاه 29 سپتامبر: بازنشر ~70% برای اکتبر و ~60% برای اکتبر+دسامبر
    (investinglive دوشنبه 22:59Z)؛ کوک (اوکلند، دوشنبه) اندکی انقباضی‌تر - هوش مصنوعی
    + نفت همچنان تورم را «در ماه‌های پیش رو» بالا می‌برند، افزایش‌های بیشتر نرخ بهره
    وابسته به داده‌هاست، بازار کار «در موقعیت مناسبی برای تحمل» نرخ‌های بالاتر قرار
    دارد؛ بومن درباره سیاست چیزی نگفت. بسته‌شدن اوراق 2 ساله در 4.924 (+6.4 واحد پایه)،
    10 ساله 5.242، 30 ساله 5.562: بخش بلندمدت منحنی با محرک عرضه/بازده‌های واقعی هدایت
    را به دست گرفت (ضعیف‌ترین حراج اوراق 7 ساله طی یک سال)، بنابراین بسته‌شدن اوراق
    10 ساله در >5.25 همراه با ثابت‌ماندن اوراق 2 ساله، نشانه جدید حرکت صرفاً بخش بلندمدت
    است. سه‌شنبه: شش سخنران - بومن 15:00Z (عناوین نظارتی منشن هاوس)، بار 16:40Z، گولزبی
    17:00Z، موسالم 17:30Z، ویلیامز 18:00Z، والر 19:00Z (نمایه هیئت‌مدیره: «چشم‌انداز
    اقتصادی و... ارتباطات سیاستی من»، بدون تاریخ - بررسی عمیق مشروط #63 در 19:45Z).
    گزاره‌های فعال: efd9700b (هیچ بازنشر <55% تا سه‌شنبه)، 86f87a36 (هیچ بسته‌شدن
    اوراق 2 ساله در <4.80 تا سه‌شنبه)، b934960e (جلسه PCE)، 288a87ac (هیچ جفت با افزایش
    هر دو تا 5 اکتبر). نقاط تصمیم بعدی: PCE چهارشنبه 12:30Z (#62)، ISM+والر پنجشنبه
    14:00Z، NFP جمعه 12:30Z (#61). 29 سپتامبر #64 (19:45Z): ویلیامز (دارای حق رأی
