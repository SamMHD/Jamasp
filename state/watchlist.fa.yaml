  why_fa: 'جنگ از مسیر افزایش نرخ بهره فدرال رزرو و اخطار تأمین وجه تضمین به طلا می‌رسد،
    نه از مسیر تقاضا برای دارایی امن. چهارده جلسه شواهد از 2 تا 21 سپتامبر، با شدیدترین
    نمونه در 21 سپتامبر (دو نفتکش هدف قرار گرفتند، نفت -3.7%، طلا -1.0%، BTC +7.1%).
    در خلاف این الگو: یک جلسه (9 سپتامبر). 22 سپتامبر - بخش تنش‌زدایی: یک دور مذاکره
    آمریکا و ایران با تأیید هر دو طرف، برنت در 99.25 تسویه شد (-1.1%، پنج جلسه نزولی)،
    طلای نقدی +0.5% / ردیف بدون تغییر، منحنی بازده 1.5-2.3bp بالا رفت، دلار در اواخر
    جلسه تضعیف شد و سپس در معاملات شبانه تقویت شد و طلا رشدش را پس داد. بند جریان
    معاملات درباره محرک (قاعده 23): حدود ~18:30Z ثبت شد، GC در پایان معاملات Globex
    از 4390 -> 4396 رفت - هدف در هر دو جهت محقق نشد، وزن‌ها حفظ شدند. دریچه: افزایش
    نفت باعث فروش طلا می‌شود (از مسیر اوراق 2ساله)؛ کاهش نفت بر اثر دیپلماسی، طلا
    را بدون تغییر تا نزولی نگه می‌دارد (صرف خود طلا تخلیه می‌شود، اوراق 2ساله همراهی
    نمی‌کند) - تنها مسیر صعود طلا، کاهش بازده اوراق 2ساله است که به یک عضو هیئت‌مدیره
    فدرال رزرو یا یک تغییر تعیین‌کننده در داده‌های آمریکا نیاز دارد، نه یک تیتر خبری.
    ادعاها: 64c7ba41 در 23 سپتامبر نامشخص (دوشنبه/سه‌شنبه هیچ تسویه صعودی نفتی ثبت
    نشد)؛ جانشین آن، 8e425cab (0.5)، با نخستین تسویه صعودی برنت در چهارشنبه تا جمعه
    فعال می‌شود (ردیف <+1% = محقق‌شده؛ نبود چنین تسویه‌ای = نامشخص)؛ f7a0c23d (0.55):
    هیچ تسویه برنت >=103 در چهارشنبه تا جمعه ثبت نشود - ادعای تخلیه صرف. موارد تأییدکننده:
    تسویه صعودی نفت با طلای بدون تغییر/نزولی؛ حمله آمریکا به ایران که در قیمت‌گذاری
    به افت طلا منجر شود؛ متنی با تأیید هر دو طرف که در قیمت‌گذاری نفت را -5% پایین
    بیاورد و طلا نیز نزولی باشد. موارد ابطال: عدم تحقق 8e425cab -> اقدام نظامی 35؛
    دو ردیف متوالی با افزایش هم‌زمان طلا / بازده اوراق 2ساله؛ طلا +1% در جلسه‌ای با
    کاهش نفت و بازده بدون تغییر اوراق 2ساله؛ رویداد عرضه‌ای که به‌صورت رکود تورمی
    معامله شود (افزایش بازده سررسیدهای بلند، کاهش دلار، افزایش طلا)؛ متنی که در قیمت‌گذاری
    برنت را -5% پایین بیاورد و طلا صعودی و بازده اوراق 2ساله بدون تغییر باشد -> اقدام
    نظامی 25. 24 سپتامبر: 8e425cab محقق شد - نخستین تسویه صعودی نفت (103.08، +3.9%)
    ردیف طلا را -1.74% ثبت کرد؛ چهارده جلسه صعودی نفت از 2 سپتامبر که طلا در آن‌ها
    بدون تغییر/نزولی بسته شد، و یک جلسه خلاف آن. تعدیل طبق قاعده 9: تجدید قیمت‌گذاری
    ناشی از PMI/بار نیز در همان روز رخ داد. f7a0c23d محقق نشد (سقف تخلیه صرف در یک
    جلسه شکسته شد؛ درس: سطوح نفت باید آزمون فاصله قاعده 20 را بگذرانند). بخش تخلیه
    در معاملات شبانه: برنت با گزارش نقشه راه -1%، طلا بدون تغییر در 4324، بازده اوراق
    2ساله بدون تغییر - دیپلماسی تقاضای خرید ایجاد نمی‌کند. اقدام نظامی 25. موارد ابطال
    بدون تغییر: ثبت الگوی رکود تورمی (بازده اوراق 30ساله >=5.45، DXY نزولی، طلا صعودی)؛
    دو ردیف با افزایش هر دو؛ طلا +1% با نفت نزولی و بازده بدون تغییر اوراق 2ساله.
    25 سپتامبر: پانزدهمین جلسه صعودی نفت که طلا بدون تغییر/نزولی بسته شد (برنت بر
    اثر حملات موشکی به ینبع +3.4% تا 106.60؛ ردیف -0.37%). شکاف: در 16:18Z گزارش توافق
    مرحله‌ای، برنت را -3 و GC را +20 جابه‌جا کرد (4292.7 -> 4312.1)، در حالی که بازده
    اوراق 2ساله بدون تغییر بود - نخستین تقاضای خرید در شرایط کاهش نفت در این رژیم
    - که تا 18:00Z محو شد؛ سپس در معاملات شبانه، برنت -1% تقاضایی ایجاد کرد که طلا
    را +24 تا 4328.5 بالا برد. کوچک است، اما زنجیره اکنون در معاملات درون‌روزی هر
    دو جهت را نشان می‌دهد. ادعای جدید a270f3f1 (0.55): نخستین تسویه -3% برنت در جمعه
    تا سه‌شنبه، ردیف +1% برای GC ثبت نمی‌کند؛ عدم تحقق با بازده بدون تغییر اوراق 2ساله
    -> اقدام نظامی 20، پایه 25 (بخش تخلیه برای طلا تقاضا ایجاد می‌کند = رژیم در حال
    سست‌شدن است). سایر موارد ابطال بدون تغییر. 26 سپتامبر - دریچه در بخش کوتاه‌مدت
    منحنی دوطرفه است: جمعه برنت بر اثر طرح هفت‌روزه در 104.32 تسویه شد (-2.1%)، بازده
    اوراق 2ساله با -3.5bp در 4.86 بسته شد، DXY -0.22%، ردیف GC +0.27% (4321.2)، طلای
    نقدی +$8 - نخستین جلسه این رژیم که در آن کاهش نفت، بازده بخش کوتاه‌مدت منحنی را
    پایین کشید و برای طلا تقاضا ایجاد کرد، بدون هیچ حلقه واسط یا سخنرانی. همان زنجیره
    (قاعده 22)، با علامت معکوس؛ تقاضا برای دارایی امن نیست (طلا بالا رفت چون بازده
    اوراق 2ساله پایین آمد). شمارش: در 15 جلسه از 16 جلسه صعودی نفت، طلا بدون تغییر/نزولی
    بسته شد؛ جلسات نزولی نفت اکنون شامل 3 جلسه بدون تغییر تا نزولی (21، 22، 24 سپتامبر)
    در برابر 1 جلسه صعودی (25 سپتامبر، از مسیر اوراق 2ساله) است. بازنگری: شاخه توافق
    اکنون به صعود ملایم طلا منجر می‌شود (+0.5-1% در برابر برنت -5-8%)، با سقفی ناشی
    از تخلیه صرف - تعبیر «بدون تغییر تا نزولی» پنجشنبه کنار گذاشته شد (درس ثبت شد).
    a270f3f1 (0.55) آزمون است: نخستین تسویه -3% برنت تا سه‌شنبه نباید ردیف +1% ثبت
    کند (جمعه -2.1%، ردیف +0.27% ثبت کرد؛ با مقیاس‌بندی، -3% ~ +0.4%). ادعای جدید
    95c71900 (هیچ ردیف >=4402.2 در دوشنبه تا سه‌شنبه، 0.5) سقف هر دو شاخه است. اقدام
    نظامی 25. موارد ابطال بدون تغییر: عدم تحقق a270f3f1 با بازده بدون تغییر اوراق
    2ساله -> 20 / پایه 25؛ دو ردیف با افزایش هر دو؛ ثبت الگوی رکود تورمی. 27 سپتامبر:
    رد طرح پس از تسویه از راه رسید. بخش تخلیه جمعه (برنت -2.1%، بازده اوراق 2ساله
    -3.5bp، DXY -0.22%، ردیف GC +0.27%) طرحی را معامله کرد که ترامپ شنبه به‌طور علنی
    رد کرد (~18:00Z)؛ بازگشایی یکشنبه در 22:00Z این ورودی را دوباره قیمت‌گذاری می‌کند
    - انتظار می‌رود برنت 106-108 باشد، بازده اوراق 2ساله به سمت 4.90 برگردد و طلا
    از مسیر بخش کوتاه‌مدت منحنی، رشد $12 جمعه را پس بدهد (تقاضا برای دارایی امن نیست).
    ادعای جدید 9e1829f8 (0.6): نخستین تسویه برنت >=+2% در دوشنبه تا سه‌شنبه، ردیف
    GC را >=0.1% پایین‌تر از ردیف قبلی ثبت می‌کند (اگر چنین تسویه‌ای ثبت نشود، نامشخص)
    - آزمون علامت معکوس سابقه 15/16 جلسات صعودی نفت؛ عدم تحقق با بازده اوراق 30ساله
    >=5.50 و DXY نزولی، قرائت رکود تورمی است (پایه 25)، عدم تحقق با بازده صعودی اوراق
    2ساله و طلای صعودی، یک ردیف با افزایش هر دو است (پایه). a270f3f1 (0.55) به سمت
    نتیجه نامشخص می‌رود (تسویه -3% تا سه‌شنبه به پیشنهاد متقابل رسمی آمریکا نیاز دارد).
    اقدام نظامی 25: شاخه توافق بنا بر اظهارات علنی از روی میز کنار رفته است، شاخه
    شکست مذاکرات (برنت >=110 -> طلا نزولی از مسیر اوراق 2ساله) شاخه فعال است. موارد
    ابطال بدون تغییر: عدم تحقق a270f3f1 با بازده بدون تغییر اوراق 2ساله -> 20 / پایه
    25؛ دو ردیف با افزایش هر دو؛ ثبت الگوی رکود تورمی. گزارش کوتاه 28 سپتامبر: رابطه
    معکوس در ششمین آخرهفته همراه با اقدام نظامی حفظ شد - برنت +1.7% (اوج +2.6%)، بازده
    اوراق 2ساله +3.7bp، طلا -2.1% تا 4230.6 با عبور از محدوده حمایتی 4244-4253؛ عبور
    بازده اوراق 30ساله از 5.50 همراه با طلای نزولی، نشانه خلاف است (18 مورد مخالف
    / 2 مورد موافق). واگرایی اندازه حرکت علامت‌گذاری شد: حرکت طلا ~3x مقداری است که
    ورودی‌های نفت/اوراق 2ساله در 23 سپتامبر ایجاد کردند - شکست محدوده حمایتی، پایان
    فصل، تقاضای خرید چین نامشهود؛ در هیچ‌یک از دو جهت تقاضا برای دارایی امن نیست.
    9e1829f8 امشب فعال است (تسویه برنت >=106.41 -> ردیف >=0.1% نزولی؛ ردیف هم‌اکنون
    70 واحد پایین‌تر از 4299.7 یکشنبه است). علامت شاخه توافق بدون تغییر: تأیید دریافت
    یک متن قطری = تخلیه = 4253/4300، یک شکست نزولی ناموفق، نه یک رالی. گزارش کوتاه
    30 سپتامبر: سه‌شنبه بخش تخلیه بود، با حرکت اندک بازده اوراق 2ساله (-3.3bp) و طلا
    +1.41% در ردیف - دومین تقاضای خرید کامل در بخش تخلیه (25 سپتامبر محو شد، 29 سپتامبر
    حفظ شد)، در برابر DXY +0.19% و افزایش بازده اوراق 10ساله/30ساله. a270f3f1 طبق
    متن دقیق نامشخص است (تسویه -2.55%، حد -3%)، اما ماهیت شواهد مخالف است؛ 9e1829f8
    نامشخص (هیچ تسویه +2% ثبت نشد). رابطه معکوس همچنان در بخش صعودی نفت برقرار است
    (دوشنبه +0.9%، طلا -3.3%، بخش سررسیدهای بلند/نقدکردن موقعیت‌ها)؛ بخش نزولی نفت
    اکنون برای طلا تقاضا ایجاد می‌کند. برداشت فعلی: نامتقارن، نه معکوس - نفت بالا
    = طلا پایین از مسیر اوراق 2ساله، نفت پایین = طلا بالا از مسیر موقعیت‌گیری. دو
    جلسه؛ فرضیه‌ای با آزمونی مشخص (تسویه بعدی قرارداد دسامبر برنت با کاهش >=2%: آیا
    ردیف >=0.5% بالا می‌رود در حالی که افت بازده اوراق 2ساله <5bp است؟)، نه یک قاعده.
    گزارش کوتاه 2 اکتبر: نخستین جلسه نفت صعودی / طلای صعودی در این رژیم - پنجشنبه
    برنت +~4% (102.31)، DXY 101.996 (بالاترین سطح 52 هفته‌ای)، طلا +0.69% در ردیف
    همراه با بازده اوراق 2ساله -10bp: کانال رهبری فدرال رزرو بر حلقه نفت -> اوراق
    2ساله غلبه کرد (صبر جفرسون/ویلیامز، انتقال زمان‌بندی گلدمن به دسامبر). تقاضا برای
    دارایی امن نیست - طلا همراه با اوراق خزانه بالا رفت. یک جلسه = فرضیه (قاعده 11)؛
    گزاره «حمله = افزایش نرخ بهره + اخطار تأمین وجه تضمین» این مضمون برای یک اقدام
    واقعی برقرار است؛ تقویت آرایش نیروها (ناو هواپیمابر 3ام) که در برنت قیمت‌گذاری
    شد، به اوراق 2ساله نرسید. BofA همان روز: «نفت بزرگ‌ترین دشمن طلاست»، ریسک <4000
    - این زنجیره به‌عنوان دیدگاه مؤسسه. گزارش کوتاه 3 اکتبر: جمعه زنجیره را در هر
    دو جهت در یک جلسه به جریان انداخت - بازده اوراق 2ساله هنگام انتشار داده -9bp،
    طلا +50؛ با بازیابی برنت از 98.4 -> 102.25، بازده اوراق 2ساله از کف +15bp بالا
    آمد تا با +4bp بسته شود، طلا از اوج -97 افت کرد در حالی که DXY تمام روز نزولی
    بود. هفت اصابت به بدنه کشتی‌ها در هرمز طی یک هفته + یک ناو هواپیمابر سوم + گزارش
    رویترز درباره عملیات تهاجمی عربستان: برنت بدون تغییر تسویه شد، هیچ‌چیز به اوراق
    2ساله نرسید، هیچ‌چیز به طلا نرسید. سومین جلسه طلا = f(بازده پایانی اوراق 2ساله)
    با DXY در بالاترین سطح 52 هفته‌ای (30 سپتامبر / 1 اکتبر / 2 اکتبر): سه مورد قاعده
    11 تکمیل شده‌اند، آزمون علامت یک قرائت است؛ به‌عنوان ادعایی با وزن 0.6 برای دوشنبه
    تا جمعه 5-9 اکتبر ثبت شد.'
