  why_fa: 'بازده‌های واقعی محرک اصلی طلا هستند و این فدرال رزرو همین حالا نرخ بهره
    را افزایش داد: 16 سپتامبر، +25 واحد پایه به 3.75-4.00%، با رأی 12-0، بدون جمله‌ای
    درباره راهنمایی آتی؛ نمودار نقطه‌ای حاکی از یک افزایش دیگر در 2026 است (میانه
    4.1؛ 16 نفر از 18 نفر انتظار >=1 افزایش دیگر دارند). وارش: «محدودکننده نیست»،
    برآورد PCE اوت ~3.6%. اردوگاه منطقه‌ای همچنان خواهان افزایش بیشتر است: موسالم،
    کالینز، گولزبی (21 سپتامبر)؛ کالینز دوباره در 22 سپتامبر («می‌توانیم بر ثبات قیمت‌ها
    تمرکز کنیم»)؛ بارکین، 22 سپتامبر ساعت 17:00Z (CFA بالتیمور): «ریسک‌های تورم بر
    ریسک‌های اشتغال حداکثری می‌چربند»، >60% از دسته‌های PCE بالاتر از >3% هستند، شرکت‌ها
    هزینه‌ها را منتقل می‌کنند، یک بار «تذکر دادن» شاید کافی نباشد - اما این چرخه «می‌تواند
    شبیه تعدیل میان‌چرخه‌ای گرینسپن باشد» (همان ~75 واحد پایه در میانه دهه 1990):
    انقباضی با یک سقف، و سهام شرکت‌های خانه‌سازی در واکنش به آن رشد کرد. دو نوبت سخنرانی
    اعضای هیئت‌مدیره/نیویورک (جفرسون، ویلیامز، 22 سپتامبر) درباره سازوکارهای عملیاتی
    بودند - بدون راهنمایی آتی. تابلوی بازار: حراج اوراق 2 ساله ($69 میلیارد، 22 سپتامبر)
    با بازده 4.787، فاصله 0.2 واحد پایه بالاتر از بازده پیش از حراج، و امتیاز C انجام
    شد - بالاترین بازده اوراق 2 ساله از 2024، عرضه را بدون تنش جذب کرد؛ منحنی با افزایش
    1.5-2.3 واحد پایه بسته شد (CNBC: اوراق 5 ساله 4.842، 10 ساله 4.967، 30 ساله 5.303)،
    در جلسه‌ای با برنت -1.1% و یک دور مذاکرات آمریکا-ایران که هر دو طرف تأییدش کردند
    - بخش کوتاه‌مدت منحنی همراه با نفت پایین نمی‌آید (طبق اظهارات ثبت‌شده، نادیده
    گرفتن اثر شوک منتفی است: اشمید، کشکاری، آن سه نفر، بارکین). بازده پایانی اوراق
    2 ساله در 22 سپتامبر قابل بازیابی نیست (US2Y در CNBC خالی است). قیمت‌گذاری: اکتبر
    «کمی بیش از 50%» (investinglive، ساعت 13:38Z در 22 سپتامبر، بدون بازنشر بعدی)؛
    BofA همچنان اکتبر + دسامبر را پیش‌بینی می‌کند؛ دویچه بانک: بازارها چرخه جهانی
    افزایش نرخ بهره را کمتر از حد واقعی قیمت‌گذاری کرده‌اند. نقاط بررسی: اوراق 2 ساله
    4.791-4.800 (شکست = هدف برآوردی 5.055؛ پس‌زده‌شدن و سپس <4.600 = برگشت)؛ DXY برابر
    با 100.02 / 100.58 / 101.80. آستانه تغییر سناریو (حمایت یک عضو هیئت‌مدیره از اکتبر
    -> سناریوی نزولی ناشی از نرخ بهره 60؛ درخواست وقفه -> سناریوی پایه 30) فعال نشده
    است. سخنرانان (ff_calendar، کم، todo-188): بار، چهارشنبه 23 ساعت 14:05Z (یادآور
    #59، ابتدا محل رویداد بررسی شود - فهرست هیئت‌مدیره فقط وام‌دهی فرصت دوباره و هوش
    مصنوعی را نشان می‌دهد)؛ پنجشنبه ویلیامز 08:10Z، بارکین 12:30Z، هامک 12:50Z، پالسن
    14:10Z؛ جمعه ویلیامز 09:15Z، هامک 18:00Z. گزاره‌ها: fc5c5a29 (هیچ بازده پایانی
    اوراق 2 ساله <4.60 تا 25 سپتامبر، 0.55)؛ 4872cd75 (بازنشر احتمال اکتبر >=45% تا
    جمعه، 0.55)؛ 1a513d72 (هیچ بازنشری با >=60% تا چهارشنبه 23:59Z، 0.55 - ریسک بار)؛
    d8e247ef (نبود دو ردیف متوالی که در هر دو، هر دو شاخص صعودی باشند تا دوشنبه 28،
    0.7 - ردیف سه‌شنبه بدون تغییر بود، نه با صعود هر دو). نقاط تصمیم بعدی: بار در
    چهارشنبه؛ مؤلفه قیمت‌های پرداختی PMI مقدماتی آمریکا، چهارشنبه 13:45Z؛ شاخص قیمت
    مصرف‌کننده (CPI) سپتامبر در میانه اکتبر؛ FOMC در 28 اکتبر. گزارش کوتاه 24 سپتامبر:
    تغییر سناریو چهارشنبه فعال شد (وزن‌ها 15/60/25). PMI ترکیبی مقدماتی 58.4 (هزینه
    نهاده‌ها در بالاترین سطح از اکتبر 2022) + بار («در سناریوی پایه من، احتمالاً تعدیل‌های
    بیشتر سیاستی لازم خواهد بود») -> احتمال اکتبر در جمع‌بندی پایانی 65% (در طول روز
    74%، «94 واحد پایه دیگر از اینجا به بعد»)؛ اوراق 2 ساله در 4.895 بسته شد (+12
    واحد پایه، CNBC)، 10 ساله 5.114 (بالاترین سطح از 2007)، 30 ساله 5.402 (نخستین
    بسته‌شدن در >=5.40)، DXY برابر با 101.12؛ ردیف طلا -1.74%. گزاره 1a513d72 محقق
    نشد (بازنشر >=60% از مطلب PMI در 13:51Z آمد). فعال: 6e168240 (اوراق 2 ساله >=4.80
    در چهارشنبه محقق شد، بخش پنجشنبه باقی است)، 1e91793f (هیچ بازنشری با <55% در پنجشنبه-جمعه،
    0.55)، 4872cd75 (>=45%)، fc5c5a29 (هیچ بسته‌شدنی در <4.60). پنجشنبه: SNB ساعت
    07:30Z، ویلیامز 08:10Z (محل رویداد در فهرست فدرال رزرو نیویورک نیست)، درخواست‌های
    بیمه بیکاری 12:30Z با اجماع 200K، بارکین 12:30Z، هامک 12:50Z، پالسن 14:10Z؛ جمعه
    ویلیامز 09:15Z، اشمید 13:20Z، هامک 18:00Z - همگی رؤسای منطقه‌ای، بدون عضو هیئت‌مدیره،
    فقط نشانه‌هایی برای پایش. بازگشت سناریو: یک بازنشر <55% یا درخواست‌های بیمه بیکاری
    >230K همراه با درخواست وقفه از سوی ویلیامز -> سناریوی نزولی ناشی از نرخ بهره 50.
    گزارش کوتاه 25 سپتامبر: وزن‌ها در 15/60/25 حفظ شدند. پنجشنبه بر شمار هم‌صدایان
    افزود و بازار جلوتر از آن‌ها حرکت کرد: اکتبر 77.5% (بازنشر actionforex از قراردادهای
    آتی وجوه فدرال در 09:16Z؛ جمع‌بندی قاره آمریکا هیچ جمله‌ای درباره احتمال‌ها نداشت).
    ویلیامز (مجمع سیاست کلان لندن): یک افزایش دیگر نرخ بهره در 2026 «معقول» است، به
    اکتبر متعهد نشد، راهنمایی آتی «تمام شده»، اقتصاد «در برابر افزایش قیمت انرژی تاب‌آور»
    است؛ هامک: ریسک‌ها «به سمت بالا متمایل‌اند»، خطر شکل‌گیری «ذهنیت تورمی» بر اثر
    شوک‌های مکرر؛ پالسن (دارای حق رأی): «ممکن است مقداری انقباض بیشتر و محدود موجه
    باشد». درخواست‌های بیمه بیکاری 197K، فروش خانه‌های نوساز 684K. اوراق 2 ساله در
    4.895 (CNBC) / 4.916 (جمع‌بندی) بسته شد، 10 ساله 5.163 (بالاترین سطح از 2007)،
    30 ساله 5.460 (بالاترین سطح از 2004). گزاره 6e168240 محقق شد (هر دو بخش). فعال:
    1e91793f (>=55%) و 4872cd75 (>=45%) جمعه در مسیر تحقق به پایان می‌رسند؛ fc5c5a29
    جمعه پایان می‌یابد؛ گزاره جدید 86f87a36 (هیچ بازده پایانی اوراق 2 ساله <4.80 در
    جمعه-سه‌شنبه، 0.55). سخنرانان جمعه: ویلیامز 09:15Z (دوباره)، اشمید 13:20Z، هامک
    18:00Z - بدون عضو هیئت‌مدیره؛ برنامه فدرال رزرو برای 28-29 سپتامبر هنوز در خوراک
    خبری نیست. بازگشت سناریو بدون تغییر: یک بازنشر <55% یا درخواست وقفه از سوی یک
    عضو هیئت‌مدیره -> سناریوی نزولی ناشی از نرخ بهره 50. NFP در 2 اکتبر: یادآور #61.
    گزارش کوتاه 26 سپتامبر: وزن‌ها در 15/60/25 حفظ شدند (روز سوم). جمعه: اوراق 2 ساله
    در 4.86 بسته شد (-3.5 واحد پایه؛ بازگشایی 4.912، کف 4.845)، در واکنش به طرح هفت‌روزه
    عراقچی و برنت -2.1% - بخش کوتاه‌مدت منحنی برای نخستین بار در این رژیم همراه با
    نفت پایین آمد (~1.7 واحد پایه به‌ازای هر درصد تغییر برنت)، بدون بازنشر و بدون
    سخنرانی در جلسه؛ جمع‌بندی: «با کاهش نگرانی‌های تورمی، دلار اندکی ضعیف‌تر شد».
    اوراق 10 ساله 5.165، بدون تغییر (در طول روز 5.23، بالاترین سطح از 2007)، 30 ساله
    5.49 (بالاترین سطح از 2004). ویلیامز (جمعه): شوک‌های مداوم عرضه مبارزه را دشوارتر
    می‌کنند؛ بازار کار منشأ تورم نیست؛ تعرفه‌ها به‌تنهایی تورم پایدار ایجاد نمی‌کنند.
    هیچ بازنشری از احتمال‌ها در جمعه در هیچ‌جا وجود نداشت (جست‌وجو شد) - آخرین رقم
    77.5% (پنجشنبه). ارزیابی‌شده: fc5c5a29 محقق شد (هیچ بازده پایانی اوراق 2 ساله
    <4.60)، 4872cd75 محقق شد (>=45%)، 1e91793f محقق شد (>=55%). فعال: 86f87a36 (هیچ
    بازده پایانی اوراق 2 ساله <4.80 در جمعه-سه‌شنبه؛ رقم 4.86 جمعه شرط را برآورده
    می‌کند)؛ گزاره جدید b934960e (هیچ بازنشری با <55% در روز PCE، چهارشنبه 30 سپتامبر،
    0.55) که با بررسی عمیق #62 در زمان انتشار+45 ارزیابی می‌شود. هفته آینده از طریق
    خلاصه تقویم actionforex + چشم‌انداز هفته آینده ولز فارگو تأیید شد (BLS/BEA 403):
    PCE چهارشنبه 30 سپتامبر 12:30Z (اجماع 0.4/3.7 برای کل، 0.3/3.4 برای هسته؛ بازنگری‌های
    سالانه «روند ملایم‌تر، اوت داغ‌تر»)، ISM پنجشنبه 1 اکتبر 14:00Z (55.0؛ قیمت‌های
    پرداختی 72)، NFP جمعه 2 اکتبر 12:30Z (اجماع 100K در برابر 162K، UR برابر با 4.1،
    AHE برابر با 0.3؛ تاریخ یادآور #61 پابرجاست)، RBA سه‌شنبه 04:30Z (4.60)، شاخص
    قیمت مصرف‌کننده (CPI) منطقه یورو جمعه (3.7%). سخنرانان فدرال رزرو از دوشنبه تا
    جمعه: هیچ‌کدام در هیچ خوراک خبری دیده نمی‌شوند (todo-001/188؛ فهرست هیئت‌مدیره
    = عنوان‌های گذشته). آستانه‌های تغییر سناریو: بازنشر <55% یا درخواست وقفه از سوی
    یک عضو هیئت‌مدیره -> سناریوی نزولی ناشی از نرخ بهره 50؛ بازنشر PCE با >=80% همراه
    با بازده پایانی اوراق 2 ساله >=4.95 -> 65؛ توافقی که هر دو طرف تأییدش کنند همراه
    با اوراق 2 ساله <4.75 -> 50 (صعود طلا از مسیر بخش کوتاه‌مدت منحنی).'
