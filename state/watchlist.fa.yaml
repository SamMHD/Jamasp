- theme: boj-yen-pillar
  why_fa: 'ین یکی از ستون‌های تقاضای ناشی از کاهش ارزش پول بود: USDJPY پس از مداخله
    ناموفق اوت در 159-160 ثابت مانده بود؛ این وضعیت در 3-8 سپتامبر شکست (160.4 ->
    153.3). 18 سپتامبر: بانک مرکزی ژاپن نرخ بهره را به 1.25% افزایش داد (بالاترین
    سطح از 1995)، با رأی 7-2، بدون اعلام زمان‌بندی؛ اوئدا: «مرحله سیاست‌گذاری تغییر
    کرده است»، افزایش نرخ بهره ادامه خواهد یافت؛ انتظار بازار: یک افزایش نرخ بهره
    در هر فصل، نوبت بعدی دسامبر/حوالی آغاز سال، نرخ نهایی 1.75-2%. جریان بازار: استعلام
