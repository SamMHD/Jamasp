  why_fa: 'جنگ در قالب افزایش نرخ بهره فدرال رزرو و اخطار تأمین وجه تضمین به طلا می‌رسد،
    نه در قالب تقاضا برای دارایی امن. شواهد چهارده جلسه معاملاتی از 2 تا 21 سپتامبر،
    با بارزترین نمونه در 21 سپتامبر (دو نفتکش هدف قرار گرفتند، نفت -3.7%، طلا -1.0%،
    BTC +7.1%). موارد مخالف: یک مورد (9 سپتامبر). 22 سپتامبر - مرحله تنش‌زدایی: یک
    دور مذاکرات آمریکا و ایران با تأیید هر دو طرف، برنت در 99.25 تسویه شد (-1.1%،
    پنج جلسه نزولی)، طلای نقدی +0.5% / ردیف بدون تغییر، منحنی بازده 1.5-2.3 واحد پایه
    صعودی، دلار اواخر جلسه تضعیف شد، سپس طی شب تقویت شد و طلا رشد خود را پس داد. بند
    مربوط به جریان معاملات در زمان محرک (قاعده 23): حدود 18:30Z ثبت شد، GC در پایان
    معاملات Globex از 4390 -> 4396 رفت - هدف در هر دو جهت محقق نشد، وزن‌ها حفظ شدند.
    دریچه: افزایش نفت باعث فروش طلا می‌شود (از مسیر بازده 2ساله)؛ کاهش نفت بر اثر
    دیپلماسی، طلا را بدون تغییر تا نزولی نگه می‌دارد (صرفِ خود طلا تخلیه می‌شود، بازده
    2ساله همراهی نمی‌کند) - تنها مسیر صعود طلا کاهش بازده 2ساله است که به یک عضو هیئت‌مدیره
    فدرال رزرو یا یک تغییر تعیین‌کننده در داده‌های آمریکا نیاز دارد، نه یک تیتر خبری.
    ادعاها: 64c7ba41 در 23 سپتامبر نامشخص (دوشنبه/سه‌شنبه هیچ تسویه‌ای با افزایش نفت
    رخ نداد)؛ جانشین آن، 8e425cab (0.5)، در نخستین تسویه صعودی برنت از چهارشنبه تا
    جمعه آزموده می‌شود (ردیف <+1% = تحقق؛ نبود چنین تسویه‌ای = نامشخص)؛ f7a0c23d (0.55):
    از چهارشنبه تا جمعه هیچ تسویه برنتی >=103 رخ نمی‌دهد - ادعای تخلیه صرف. تأییدکننده‌ها:
    یک تسویه صعودی نفت با طلای بدون تغییر/نزولی؛ حمله آمریکا به ایران که بازار آن
    را با کاهش طلا قیمت‌گذاری کند؛ متنی با تأیید هر دو طرف که بازار آن را با نفت -5%
    و طلای نزولی قیمت‌گذاری کند. ابطال‌کننده‌ها: عدم تحقق 8e425cab -> جنبشی 35؛ دو
    ردیف متوالی با طلای صعودی / بازده 2ساله صعودی؛ طلا +1% در جلسه‌ای با نفت نزولی
    و بازده 2ساله بدون تغییر؛ رویدادی در عرضه که بازار آن را به‌صورت رکود تورمی معامله
    کند (انتهای بلندمدت منحنی صعودی، دلار نزولی، طلا صعودی)؛ متنی که بازار آن را با
    برنت -5%، طلای صعودی و بازده 2ساله بدون تغییر قیمت‌گذاری کند -> جنبشی 25. 24 سپتامبر:
    8e425cab محقق شد - نخستین تسویه صعودی نفت (103.08، +3.9%) ردیف طلا را در -1.74%
    ثبت کرد؛ از 2 سپتامبر، چهارده جلسه با نفت صعودی و بسته‌شدن طلا بدون تغییر/نزولی،
    در برابر یک مورد مخالف. تعدیل طبق قاعده 9: بازقیمت‌گذاری ناشی از PMI/بار نیز در
    همان روز رخ داد. f7a0c23d محقق نشد (سقف تخلیه صرف در یک جلسه شکست؛ درس: سطوح نفت
    باید آزمون فاصله قاعده 20 را بگذرانند). طی شب، مرحله تخلیه: برنت با گزارش نقشه
    راه -1%، طلا بدون تغییر در 4324، بازده 2ساله بدون تغییر - دیپلماسی تقاضای خرید
    نیست. جنبشی 25. ابطال‌کننده‌ها بدون تغییر: ثبت رکود تورمی (بازده 30ساله >=5.45،
    DXY نزولی، طلا صعودی)؛ دو ردیف با صعود هر دو؛ طلا +1% با نفت نزولی و بازده 2ساله
    بدون تغییر. 25 سپتامبر: پانزدهمین جلسه با نفت صعودی و بسته‌شدن طلا بدون تغییر/نزولی
    (برنت بر اثر حملات موشکی به ینبع +3.4% تا 106.60؛ ردیف -0.37%). شکاف: در 16:18Z،
    گزارش توافق مرحله‌ای برنت را -3 و GC را +20 جابه‌جا کرد (4292.7 -> 4312.1)، در
    حالی که بازده 2ساله بدون تغییر بود - نخستین تقاضای خرید در شرایط نفت نزولی در
    این رژیم - که تا 18:00Z محو شد؛ سپس طی شب، برنت -1% باعث رشد +24 طلا تا 4328.5
    شد. کوچک است، اما زنجیره اکنون در معاملات روزانه هر دو جهت را نشان می‌دهد. ادعای
    جدید a270f3f1 (0.55): نخستین تسویه -3% برنت از جمعه تا سه‌شنبه، ردیف +1% برای
    GC ثبت نمی‌کند؛ عدم تحقق با بازده 2ساله بدون تغییر -> جنبشی 20، پایه 25 (مرحله
    تخلیه برای طلا تقاضای خرید ایجاد می‌کند = رژیم در حال سست‌شدن است). سایر ابطال‌کننده‌ها
    بدون تغییر. 26 سپتامبر - دریچه در بخش کوتاه‌مدت منحنی دوطرفه است: جمعه، برنت با
    طرح هفت‌روزه در 104.32 تسویه شد (-2.1%)، بازده 2ساله با -3.5 واحد پایه در 4.86
    بسته شد، DXY -0.22%، ردیف GC +0.27% (4321.2)، طلای نقدی +$8 - نخستین جلسه این
    رژیم که در آن کاهش نفت بخش کوتاه‌مدت منحنی را پایین کشید و برای طلا تقاضای خرید
    ایجاد کرد، بدون هیچ عامل واسط یا سخنرانی در این میان. همان زنجیره (قاعده 22)،
    با علامت معکوس؛ تقاضا برای دارایی امن نیست (طلا بالا رفت چون بازده 2ساله پایین
    آمد). شمارش: 15 مورد از 16 جلسه با نفت صعودی، با طلای بدون تغییر/نزولی بسته شدند؛
    جلسات با نفت نزولی اکنون شامل 3 مورد بدون تغییر تا نزولی (21، 22، 24 سپتامبر)
    در برابر 1 مورد صعودی هستند (25 سپتامبر، از مسیر بازده 2ساله). بازنگری: شاخه توافق
    اکنون با صعود ملایم طلا همراه است (+0.5-1% در برابر برنت -5-8%)، با سقفی ناشی
    از تخلیه - تعبیر «بدون تغییر تا نزولی» پنج‌شنبه کنار گذاشته شد (درس ثبت شد). a270f3f1
    (0.55) آزمون است: نخستین تسویه -3% برنت تا سه‌شنبه نباید ردیف +1% ثبت کند (جمعه
    -2.1%، ردیف +0.27% ثبت کرد؛ با مقیاس‌بندی، -3% ~ +0.4%). ادعای جدید 95c71900 (هیچ
    ردیفی >=4402.2 در دوشنبه تا سه‌شنبه، 0.5) سقف هر دو شاخه است. جنبشی 25. ابطال‌کننده‌ها
    بدون تغییر: عدم تحقق a270f3f1 با بازده 2ساله بدون تغییر -> 20 / پایه 25؛ دو ردیف
    با صعود هر دو؛ ثبت رکود تورمی. 27 سپتامبر: رد طرح پس از تسویه رخ داد. مرحله تخلیه
    جمعه (برنت -2.1%، بازده 2ساله -3.5 واحد پایه، DXY -0.22%، ردیف GC +0.27%) طرحی
    را معامله کرد که ترامپ روز شنبه رسماً رد کرد (حدود 18:00Z)؛ بازگشایی یکشنبه در
    22:00Z ورودی را بازقیمت‌گذاری می‌کند - انتظار برنت 106-108، بازگشت بازده 2ساله
    به‌سوی 4.90، پس‌دادن رشد $12 جمعه توسط طلا از مسیر بخش کوتاه‌مدت منحنی (تقاضا
    برای دارایی امن نیست). ادعای جدید 9e1829f8 (0.6): نخستین تسویه برنت >=+2% در دوشنبه
    تا سه‌شنبه، ردیف GC را >=0.1% پایین‌تر از ردیف قبلی ثبت می‌کند (اگر چنین تسویه‌ای
    ثبت نشود، نامشخص) - آزمون علامت معکوسِ سابقه 15/16 نفت صعودی؛ عدم تحقق با بازده
    30ساله >=5.50 و DXY نزولی، برداشت رکود تورمی را به همراه دارد (پایه 25)، عدم تحقق
    با بازده 2ساله صعودی و طلای صعودی، یک ردیف با صعود هر دو است (پایه). a270f3f1
    (0.55) به‌سوی وضعیت نامشخص می‌رود (تسویه -3% تا سه‌شنبه به پیشنهاد متقابل رسمی
    آمریکا نیاز دارد). جنبشی 25: شاخه توافق رسماً از دستور کار خارج شده، شاخه شکست
    مذاکرات (برنت >=110 -> طلای نزولی از مسیر بازده 2ساله) شاخه فعال است. ابطال‌کننده‌ها
    بدون تغییر: عدم تحقق a270f3f1 با بازده 2ساله بدون تغییر -> 20 / پایه 25؛ دو ردیف
    با صعود هر دو؛ ثبت رکود تورمی. گزارش کوتاه 28 سپتامبر: رابطه معکوس در ششمین آخر
    هفته درگیری نظامی حفظ شد - برنت +1.7% (اوج +2.6%)، بازده 2ساله +3.7 واحد پایه،
    طلا -2.1% تا 4230.6 با عبور از محدوده حمایتی 4244-4253؛ عبور بازده 30ساله از 5.50
    همراه با طلای نزولی، نشانه خلاف آن است (18 مورد مخالف / 2 مورد موافق). واگرایی
    در اندازه حرکت علامت‌گذاری شد: حرکت طلا ~3x چیزی است که ورودی‌های نفت/بازده 2ساله
    در 23 سپتامبر ایجاد کردند - شکست محدوده حمایتی، پایان فصل، غیبت تقاضای خرید چین؛
    در هیچ‌یک از دو جهت تقاضا برای دارایی امن نیست. 9e1829f8 امشب فعال است (تسویه
    برنت >=106.41 -> ردیف >=0.1% نزولی؛ ردیف هم‌اکنون 70 واحد پایین‌تر از 4299.7 یکشنبه
    است). علامت شاخه توافق بدون تغییر: تأیید دریافت یک متن قطری = تخلیه = 4253/4300،
    یک شکست نزولی ناموفق، نه یک جهش صعودی. گزارش کوتاه 30 سپتامبر: سه‌شنبه مرحله تخلیه
    بود، با بازده 2ساله که به‌سختی حرکت کرد (-3.3 واحد پایه) و طلا که در ردیف +1.41%
    شد - دومین تقاضای خرید کامل در مرحله تخلیه (25 سپتامبر محو شد، 29 سپتامبر حفظ
    شد)، در برابر DXY +0.19% و صعود بازده 10ساله/30ساله. a270f3f1 طبق لفظ شروط نامشخص
    است (تسویه -2.55%، آستانه -3%)، اما ماهیت نتیجه مخالف آن است؛ 9e1829f8 نامشخص
    (هیچ تسویه +2% رخ نداد). رابطه معکوس همچنان در مرحله نفت صعودی برقرار است (دوشنبه
    +0.9%، طلا -3.3%، مرحله انتهای بلندمدت منحنی/تصفیه موقعیت‌ها)؛ مرحله نفت نزولی
    اکنون برای طلا تقاضای خرید ایجاد می‌کند. برداشت فعلی: نامتقارن، نه معکوس - نفت
    صعودی = طلای نزولی از مسیر بازده 2ساله، نفت نزولی = طلای صعودی از مسیر موقعیت‌گیری.
    دو جلسه؛ فرضیه‌ای با آزمونی مشخص (تسویه بعدی برنت دسامبر با افت >=2%: آیا ردیف
    >=0.5% رشد می‌کند، در حالی که افت بازده 2ساله <5 واحد پایه است؟)، نه یک قاعده.'
