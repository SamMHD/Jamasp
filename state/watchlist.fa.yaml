  why_fa: 'کانال کاهش ارزش پول - بهترین توضیح برای طلای بالای $4,000 در برابر بازده
    واقعی مثبت (DFII10 2.62، 21 سپتامبر). 16 سپتامبر: افزایش نرخ بهره با وجود فشار
    سیاسی اجرا شد، 12-0 - خط ابطال خودِ این مضمون ثبت شد (30ساله -1.3bp در کنار 2ساله
    +12bp، طلا -1.9%، دلار با عبور از 100). 18 سپتامبر: نشانه فقط یک بار ثبت شد (طلا
    +0.96% در کنار 2ساله +6.6bp، 10ساله 5.00، BTC +6%). 21 سپتامبر - ضدنشانه: طلا
    -1.0% (Globex) در کنار 2ساله +0.75bp، 10ساله -4.5bp، 30ساله -4.7bp، DXY +0.1،
    BTC +7.1% و رکورد نزدک - جریان سرمایه به سمت BTC و سهام هوش مصنوعی رفت، نه طلا.
    22 سپتامبر: شکلِ نشانه در بازار نقدی (+22 تا 4364 در کنار افزایش +1.5-2.3bp منحنی
    بازده، 30ساله 5.303)، اما ردیفی بدون تغییر (4402.2 در برابر 4401.3)، تضعیف دلار
    در اواخر معاملات و BTC در 86.5K (+14% در هفته) در کنار رکورد نزدک؛ طلا در معاملات
    شبانه، همگام و تیک‌به‌تیک با حرکت DXY از 100.54 -> 100.69، آن $22 را پس داد. برداشت:
    حرکت ناشی از دلار، نه تقاضای خرید ناشی از کاهش ارزش پول. نشانه‌ها: 2 موافق / 15
    مخالف. 1889819a محقق شد (جانشین d8e247ef، 0.7، تا دوشنبه 28 - سه‌شنبه بر مبنای
    ردیف، هر دو صعودی نبودند). وزن پایه به‌عنوان وزن باقیمانده روی 20 می‌ماند؛ اگر
    d8e247ef هم بی‌نقص پیش برود، 15. تأییدها (پایه 30): دو ردیف متوالی با صعود هر
    دو، همراه با صعود 30ساله؛ بسته‌شدن 30ساله در >=5.40 همراه با صعود طلا (aec5cc8b
    محقق شد - این وضعیت ثبت نشد)؛ طلا +1% در جلسه‌ای با افت نفت و ثبات 2ساله. اقدام
    ترامپ علیه وارش که به‌صورت صعود طلا/صعود 2ساله قیمت‌گذاری شود، تأیید دیگر است
    (قاعده 7 زمان‌بندی را محدود می‌کند). 24 سپتامبر - دوباره ضدنشانه، این بار در انتهای
    بلندمدت منحنی: 30ساله در 5.402 بسته شد (نخستین >=5.40)، در کنار طلا -1.7%، DXY
    +0.5 و BTC -2.6% - شکست سطح در انتهای بلندمدت که این مضمون به آن نیاز داشت، به‌عنوان
    اثر فدرال رزرو معامله شد، نه کاهش ارزش پول؛ جریان سرمایه به سمت دلار رفت. نشانه‌ها:
    2 موافق / 16 مخالف. پایه 15. d8e247ef فعال است (ردیف چهارشنبه نزولی، هیچ جفتی
    پیش از پنج‌شنبه-جمعه شکل نمی‌گیرد). 25 سپتامبر - ضدنشانه، 17 مخالف / 2 موافق:
    پس از دومین بازخرید خزانه‌داری طی دو هفته و ثبت اختلاف بازده نامطلوب در حراج 7ساله،
    30ساله در 5.460 (بالاترین سطح از 2004) و 10ساله در 5.163 (بالاترین سطح از 2007)
    بسته شدند - و طلا با DXY +0.2 و BTC بدون تغییر، 0.3% افت کرد. شکست سطح در انتهای
    بلندمدت جهانی است (اوراق دولتی آلمان در بالاترین سطح 17 ساله، اوراق دولتی 10ساله
    ژاپن در بالاترین سطح از 1996) و به نفع دلار قیمت‌گذاری شده است. CNBC: «بازده‌های
    جهش‌یافته مشکلی کاملاً تازه برای وارش ایجاد می‌کنند». پایه 15. d8e247ef فعال است
    (ردیف پنج‌شنبه نزولی؛ تشکیل یک جفت به جمعه+دوشنبه نیاز دارد). تأیید بدون تغییر:
    30ساله >=5.50 همراه با صعود طلا و افت DXY. 26 سپتامبر - شکل نشانه، با یک واحد
    پایه کسری: 30ساله در 5.49 بسته شد (+2.8bp، بالاترین سطح از 2004؛ 5.532 در طول
    روز)، فاصله بازده 2ساله و 30ساله 63bp (+12bp طی دو جلسه)، DFII10 2.85 - همراه
    با افت 0.22% در DXY و صعود 0.27% طلا: از نظر جهت حرکت، تأیید رکود تورمی با پایه
    25، اما 5.49 < 5.50 و طلا +0.3% به هیچ میزان قابل‌اعتنایی «صعود طلا» نیست. تأیید
    نیست؛ یک علامت است. ضدنشانه: 17 مخالف / 2 موافق (جمعه هیچ‌کدام نبود - صعود طلا
    همراه با افت 2ساله در حیطه معاملات نرخ بهره است). تحقق d8e247ef قطعی شد (جمعه
    هر دو صعودی نبودند، هیچ جفتی نمی‌تواند دوشنبه تکمیل شود؛ سه‌شنبه ارزیابی می‌شود).
    پایه 15. تأیید: بسته‌شدن 30ساله در >=5.50 همراه با صعود طلا و افت DXY -> پایه
    25. 8 اکتبر: صورت‌جلسه نشان می‌دهد افزایش نرخ بهره در سپتامبر به اتفاق آرا بوده
    و بیشتر اعضا افزایش دیگری را در پیش‌بینی خود لحاظ کرده‌اند - تفسیر مبتنی بر فشار
    همچنان اعتبار از دست می‌دهد؛ نشانه کاهش ارزش پول چهارشنبه ثبت نشد (30ساله صعود
    2bp، DXY صعود 0.41، طلا افت 43.7). پپراستون (وستون به نقل از رویترز): طلا تنها
    زمانی از بازده‌ها جدا می‌شود که انتهای بلندمدت منحنی بر مبنای ریسک حاکمیتی/مالی
    دولت بازقیمت‌گذاری شود - همان آزمونی که این موضع از طریق الگوی 968df4d5 اجرا می‌کند.'
