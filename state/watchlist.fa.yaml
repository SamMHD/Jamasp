  why_fa: 'کانال کاهش ارزش پول - بهترین توضیح برای طلای بالای $4,000 در برابر بازده
    واقعی مثبت (DFII10 2.61). 16 سپتامبر: افزایش نرخ بهره با وجود فشار سیاسی اجرا
    شد، 12-0 - مثبت برای اعتبار؛ خط ابطال خودِ این روایت ثبت شد (30y برابر با -1.3bp
    در کنار 2y برابر با +12bp، طلا -1.9%، دلار عبورکرده از 100). 18 سپتامبر: نشانه
    یک‌بار ثبت شد - طلا +0.96% در کنار 2y برابر با +6.6bp، 10y برابر با 5.00، 30y
    برابر با +3bp، DXY بدون تغییر، BTC برابر با +6%. اصلاحیه 19 سپتامبر: در سطح هفته،
    منحنی فاقد این مشخصه است (actionforex: ‏2y برابر با +12.6، ‏10y برابر با +3.1،
    ‏30y برابر با -2.9 - «این الگوی شوک به اعتبار مالی دولت نیست»)؛ MarketWatch: «وال‌استریت
    اکنون آن را باور دارد». 21 سپتامبر: نشانه در بازگشایی تکرار نشد - طلا -0.5% در
    کنار 2y بدون تغییر و 30y بدون تغییر (5.328)؛ توضیح روز جمعه میز معاملات نرخ بهره
    (طلا بر مبنای مقصدِ بدون تغییر معامله می‌شود) همچنان معتبر است. نشانه: 2 موافق
    / 13 مخالف. مقدار پایه طبق معیار ورود، 20 باقی می‌ماند. تأییدکننده‌ها (مقدار پایه
    30): صعود هر دو در دوشنبه (1889819a محقق نشد) همراه با صعود 30y؛ بسته‌شدن 30y
    در سطح >=5.40 همراه با صعود طلا (aec5cc8b محقق نشد)؛ طلا +1% در جلسه‌ای با افت
    نفت و 2y بدون تغییر (زنجیره از سمت طلا گسسته شده است). ابطال‌کننده‌ها: افت طلا
    در دوشنبه هم‌زمان با صعود 2y (در مسیر تحقق)؛ تحقق 1889819a با 30y زیر 5.40. اقدام
    ترامپ در قبال وارش که با صعود طلا/صعود 2y در قیمت‌ها منعکس شود، تأییدکننده دیگر
    است (قاعده 7 زمان‌بندی را محدود می‌کند).'
