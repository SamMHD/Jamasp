  why_fa: 'تنها مسیر صعود طلا در رژیم 15/60/25: رویدادی در نقدینگی که بخش کوتاه‌مدت
    منحنی بازده را پایین بکشد (سهام -2% همراه با افت هم‌زمان Nikkei و BTC، اوراق 2ساله
    -15bp، USDJPY <156) - طلا از مسیر بازده 2ساله بالا می‌رود، نه از مسیر تقاضا برای
    دارایی امن. از 22 سپتامبر به‌عنوان کانال سوم نام‌گذاری شده؛ در 24 سپتامبر سطرهای
    مستقلی به آن اختصاص یافت، چون چهارشنبه نخستین ترک‌ها نمایان شد: S&P -0.75%، Russell
    -1.8%، Nasdaq نزولی با بازده 10ساله در 5.11%؛ MarketWatch: محدودترین گستردگی مشارکت
    بازار از زمان اوج حباب دات‌کام؛ جمع‌بندی investinglive: استفاده از تعبیر «شکستن
    سد» درباره اوراق قرضه؛ BTC در 84.3K (-2.6% پس از +14% طی هفته، ورود سرمایه به
    ETF حدود ~$1bn/day - همان جریان سرمایه‌ای که در 21-22 سپتامبر از طلا پیشی گرفت)؛
    USDJPY در 157.93 در برابر سطح 158 بانک مرکزی ژاپن برای استعلام نرخ و سطح 160 وزارت
    دارایی؛ برآورد اولیه PMI ژاپن در پایین‌ترین سطح چهار ماه؛ بیکاری استرالیا 4.6%
    (بالاترین سطح از 2021). تأیید می‌کند (سناریوی نزولیِ ناشی از نرخ‌ها 50، پایه 20):
    ثبت هم‌زمان مجموعه محرک‌های بالا در یک جلسه معاملاتی همراه با صعود طلا. باطل می‌کند
    (فرضیه کنار گذاشته می‌شود): دو هفته رکوردزنی سهام با بازده 2ساله >=4.85 و طلای
    بدون تغییر؛ یا ترک ظاهر شود و طلا همراه با همه‌چیز سقوط کند (رژیم مارجین‌کال -
    برداشت kinetic-transmission-inverted برنده می‌شود). 25 سپتامبر: نخستین داده در
    این مسیر - investinglive/Reuters: بازده 10ساله در 5.2 «در حال آزمودن میزان تحمل
    بازار سهام است» و با Nasdaq نزدیک رکوردها، ارزش‌گذاری‌های هوش مصنوعی را تحت فشار
    می‌گذارد. پنجشنبه: S&P -0.02% با Meta +4.5% که «بازندگان را پنهان می‌کرد» (Arm
    -7.9%)، Dow -0.31%، Russell -0.11%، اروپا با افت 0.2-0.9%؛ Nikkei جمعه با اتکا
    به سهام تراشه‌سازان +1.2%؛ BTC بدون تغییر در 84.3K (بازگشت اواخر معاملات سهام
    را دنبال نکرد). علامت رکود Oxford Economics در حال چشمک‌زدن است، در حالی که مخارج
    همچنان پابرجاست. مجموعه محرک‌ها ثبت نشده است (نیازمند سهام -2% همراه با افت Nikkei
    و BTC، بازده 2ساله -15bp، USDJPY <156 است). پایان فصل در چهارشنبه 30 سپتامبر،
    نقطه تنش خودِ تقویم است. 26 سپتامبر: ترکی رخ نداد - S&P +0.5% و Nasdaq در رکورد،
    با امیدها درباره ایران و «عقب‌نشینی بازده اوراق 10ساله از اوج‌های +5.20%»؛ کاهش
    ناخالص موقعیت‌ها (Meta و Intel فروخته شدند؛ سهام عقب‌مانده خریداری شدند) به‌جای
    تغییر دیدگاه؛ BTC برای سومین روز بدون تغییر در 84.0K (صعود سهام را دنبال نکرد
    - جریان سرمایه‌ای که در 21-22 سپتامبر BTC را از طلا جلو انداخت، متوقف شده است)؛
    USDJPY در 157.19 با مداخله کلامی؛ UMich در 48.1. مجموعه محرک‌ها ثبت نشده است.
    پایان فصل در چهارشنبه 30 سپتامبر با PCE + بازنگری‌ها در 12:30Z، موعد موردنظر است؛
    بازده 30ساله در 5.49-5.53 منشأ فشار است. شمارش معکوس ابطال: دو هفته رکوردزنی سهام
    با بازده 2ساله >=4.85 و طلای بدون تغییر = کنار گذاشتن فرضیه (هفته اول از دو هفته
    سپری شده، اما بازده 2ساله همین حالا در 4.86 بسته شد). 29 سپتامبر: نزدیک‌ترین وضعیت
    ثبت‌شده به مجموعه محرک‌ها تا اینجا، اما همچنان با آن منطبق نیست - دوشنبه 28 سپتامبر،
    بازده 10ساله در 5.242 بسته شد (بالاترین سطح از ژوئن 2007، سطح درون‌روزی 5.27)
    و بازده 30ساله در 5.562 (بالاترین سطح از 2004)، در پی ضعیف‌ترین نسبت تقاضا به
    عرضه در حراج اوراق 7ساله طی یک سال، و با نقش‌آفرینی بازده‌های واقعی، نه نرخ‌های
    تورم سربه‌سر (Aberdeen)؛ GVZ با +10.7% به 24.8 رسید، نقره از الگوی پرچم نزولی
    خود رو به پایین شکست و به 61.4 رسید، طلا در پی این آشفتگی -3.3% تا 4156 افت کرد
    (-$164 در بازار نقدی)، S&P -0.8%، Nikkei سه‌شنبه تحت تأثیر نفت و بازده‌ها نزولی
    بود - اما BTC فقط -0.75%، بازده 2ساله با افزایش 6.4bp در (4.924) و USDJPY در 157.3:
    نیمه مربوط به سقوط اوراق قرضه، بدون نیمه مربوط به سهام/BTC/بخش کوتاه‌مدت منحنی.
    برداشت: بخش بلندمدت منحنی اکنون تعیین‌کننده قیمت طلاست (عرضه + بازده‌های واقعی)،
    اوراق 2ساله صرفاً همراه است. شمارش معکوس ابطال از نو آغاز شد: فرضیه تا پایان فصل
    در چهارشنبه پابرجا می‌ماند (PCE + بازنگری‌ها در 12:30Z، سررسید قرارداد نوامبر
    Brent، تعطیلی بازار چین از پنجشنبه). مجموعه محرک‌ها بدون تغییر: سهام -2% همراه
    با افت هم‌زمان Nikkei و BTC، بازده 2ساله -15bp، USDJPY <156 -> سناریوی نزولیِ
    ناشی از نرخ‌ها 50، پایه 20.'
