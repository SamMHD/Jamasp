    هیئت ایرانی مجمع عمومی سازمان ملل شنبه آمریکا را ترک کردند؛ عراقچی در محافل خصوصی
    در برابر تخفیف تحریم‌ها پیشنهاد دسترسی بازرسان را می‌دهد (بلومبرگ). ادعای حوثی‌ها
    درباره آرامکو ریاض (سریع: موشک‌ها+پهپادها، «آتش‌سوزی‌ها»؛ پاسخ به حملات به صنعا)
