    به‌سوی ینبع؛ هیچ گزارش خسارتی از SPA وجود ندارد. محاصره (دسته شناورها): آمریکا
    در حال توقیف حدود $600m نفت خام ایران از سه نفتکش است؛ سنتکام مسیر 122 شناور را
    تغییر داده است؛ سازمان بین‌المللی دریانوردی: 85 حادثه / 24 مرگ دریانورد تا 24
    سپتامبر؛ فهرست شناورهای متخلف PGSA شامل 81 شناور؛ کپلر: خروج 33.7m بشکه نفت خام
    از هرمز در این هفته در برابر 49.2m در کل هفته گذشته؛ تردد LNG قطر در بالاترین
