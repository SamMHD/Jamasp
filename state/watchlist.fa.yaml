  why_fa: 'دو وضعیت: کنترل سپاه پاسداران بر عبور و مرور هرمز در برابر محاصره آمریکا،
    همراه با تبادل آشکار حملات نظامی از 30-31 اوت، و جبهه دوم دریای سرخ که در 19 سپتامبر
    به ریاض رسید (موشک حوثی‌ها، رهگیری شد). 22 سپتامبر - مسیر مذاکرات باز شد: هیئت
    عراقچی و ویتکاف/ کوشنر یک دور مذاکره با میانجی‌گری را در سازمان ملل به پایان رساندند
    (قطر و پاکستان در رفت‌وآمد میان طرفین)؛ ترامپ: حدود 3 ساعت، «سازنده»، دوری دیگر
    «به‌زودی»، اما توافق «درست بعد از انتخابات» و گزینه جایگزین «نابود کردن»؛ ویتکاف
    (X): غیرمستقیم، یک دور تکمیل شد، میانجی‌گری ادامه دارد؛ تلویزیون دولتی ایران:
    تهران درخواست ویتکاف را پذیرفت، «شروط سخت‌گیرانه» منتقل شد؛ نیویورک تایمز (2 مقام
    ایرانی): عراقچی با ویتکاف+کوشنر دیدار کرد؛ کانال 12 اسرائیل: در بیشتر اختلافات
    توافقی حاصل نشده است؛ منبع العربیه: «بن‌بست شکسته شد». شروط ایران (تسنیم): پایان
    جنگ در همه جبهه‌ها، جدول زمانی خروج از جنوب لبنان، وجوه مسدودشده، رفع محاصره و
    تحریم‌های جدید، معافیت نفتی - همان تفاهم‌نامه قدیمی. فارس: آمریکا «هیچ خط قرمزی
    باقی نگذاشته است»، آماده همه سناریوها. پیش‌تر در سه‌شنبه، گزارش کیودو درباره «بازگشایی
    هرمز در 7 روز» توسط فارس تکذیب شد. 645cc78a ناموفق (نخستین شکست این خانواده؛ درس
    مربوط به قید قالب ثبت شد). هرمز: آخرین اصابت‌ها دوشنبه 21 سپتامبر (LR Stephanie،
    جزیره من؛ یک کشتی حامل گاز مایع) - هیچ‌کدام مرتبط با عربستان نبودند؛ در 22-23
    سپتامبر کشتی جدیدی هدف قرار نگرفت (جست‌وجو شد)؛ شمار عبورهای هرمز در AIS «دو»
    (Investing.com، 22 سپتامبر) در برابر بارگیری حدود 12 میلیون بشکه در یک روز در
    عربستان و راه‌اندازی مجدد خط لوله شرق-غرب (به‌صورت جزئی) - جریان‌ها به خارج از
    پوشش AIS و مسیرهای دورزننده تنگه منتقل شدند. پادشاه عربستان در مجمع عمومی سازمان
    ملل «هدف قرار دادن مکه» توسط حوثی‌ها را محکوم کرد (همان پهپاد قبلی، رویداد جدیدی
    نیست)؛ فرانسه در حال بررسی قطعنامه شورای امنیت سازمان ملل درباره هرمز است؛ اتحادیه
    اروپا به‌دنبال تجهیزات و نیرو برای دریای سرخ است؛ بریتانیا به عربستان پیشنهاد
    سوخت‌رسانی می‌دهد. تا 23 سپتامبر ساعت 03:30Z هیچ گزارشی از گفت‌وگوی ترامپ و شورای
    همکاری خلیج فارس در پایگاه داده نبود (جست‌وجو شد، موجود نیست). نردبان: زیرساخت
    خارگ/لارک d96debd5 (تا 26 سپتامبر)؛ وضعیت سمت خلیج فارس 2df323fa (تا 26 سپتامبر)؛
    خویشتن‌داری عربستان 33defb45 (تا 27 سپتامبر)؛ اسکورت‌ها d4f5ffd6 (تا 27 سپتامبر)؛
    کشتی سعودی 9e629d6e (چهارشنبه 23:59Z بسته می‌شود، در مسیر تحقق)؛ 0d52e7da (نبود
    دیدار ترامپ-پزشکیان یا دور دوم مستقیم با تأیید هر دو طرف از چهارشنبه تا یکشنبه،
    0.65) - به‌محض تأیید دور دوم از سوی هر دو طرف، در مسیر عدم تحقق قرار می‌گیرد.
    نشانه‌ها: اعلام میزبانی قطر/پاکستان همراه با مکان+تاریخ (-> فعال‌سازی بررسی عمیق)؛
    دیدار ترامپ-پزشکیان با تأیید هر دو طرف؛ هرگونه دستور حمله آمریکا؛ گزارش‌های خسارت
    خبرگزاری رسمی عربستان (SPA)؛ متوقف شدن یک کشتی تحت اسکورت همراه با تلفات (پله
    بعدی نردبان). 24 سپتامبر: چهارشنبه - دور دومی برگزار نشد؛ مقام ارشد (رویترز):
    اگر آمریکا فشار را کاهش دهد و محاصره بنادر را بردارد، هرمز می‌تواند ظرف یک هفته
    بازگشایی شود، «اختلافات بسیار»؛ رضایی: تا تحقق شروط بسته می‌ماند؛ برنت در 103.08
    (+3.9%) تسویه شد. در طول شب: نقشه راه ایران (گلف نیوز، منابع منطقه‌ای، تأییدنشده
    از سوی هر دو دولت) - آتش‌بس تا 60 روز در سراسر منطقه، بازگشایی مرحله‌ای هرمز،
    توقف حملات به همسایگان عرب، جدول زمانی برای مذاکرات گسترده‌تر؛ روبیو «پذیرا»،
    گزینه‌های نظامی حفظ شدند. تسنیم (مرتبط با سپاه): تماس عراقچی-ویتکاف از سوی نهادهای
    سیاست‌گذار «مجاز نشده بود»؛ وزارت امور خارجه: با میانجی‌گری قطر، شروط منتقل شد
    - اکنون حدود اختیار طرف ایرانی شرط عبور است. Cape Dao (23 سپتامبر): فله‌بر تحت
    مدیریت امارات و بدون اسکورت، یک دریانورد هندی کشته شد، هیچ انتسابی به آمریکا صورت
    نگرفته است (dd31b40f تا جمعه فعال است). 9e629d6e محقق شد (خانواده 10/10؛ جانشینی
    برای کشتی سعودی نوشته نشد - بارگیری ینبع بدون پاسخ دریایی از سر گرفته شد، این
    دسته طبق سوابق همچنان پابرجاست). مورد جدید ed8c08b5 (نبود اعلام علنی و قابل استناد
    آتش‌بس از سوی آمریکا از پنجشنبه تا یکشنبه، 0.7). محاصره: مسیر 115 کشتی مرتبط با
    ایران تغییر داده شد (گلف نیوز). فرمانده ارشد سپاه در درگیری‌های جنوب شرقی ایران
    کشته شد (داخلی، نه به‌دست آمریکا). 25 سپتامبر: شمارش معکوس. رضایی (دبیر شورای
    عالی امنیت ملی، به‌نقل از گاردین/پرس تی‌وی، گلف نیوز 00:36Z): واشنگتن «چهار یا
    پنج روز» فرصت دارد شروط ایران را «به‌طور کامل و یک‌جا» اجرا کند - تا زمانی که
    آمریکا اقدام نکند، نه هرمز بازگشایی می‌شود و نه مذاکره‌ای صورت می‌گیرد؛ «حرف کافی
    است. اکنون باید عمل کنیم»؛ درباره «گام بعدی» پس از پایان مهلت تصمیم‌گیری می‌شود
    (تقریباً دوشنبه 28 تا سه‌شنبه 29). مجلس طرح استیضاح عراقچی را به‌دلیل تماس‌های
    نیویورک ثبت کرد (خضریان، ثابتی) - تندروها می‌گویند مأموریت، انتقال شروط از طریق
    میانجی‌ها بود، نه مذاکرات مستقیم؛ یک مقام ارشد به رویترز گفته بود هیئت «اختیار
    کامل» داشت. رویترز (منابع، پنجشنبه 16:18Z): مذاکره‌کنندگان در حال بررسی توافقی
    مرحله‌ای هستند (بازگشایی هرمز، رفع محاصره، دارایی‌های مسدودشده)؛ یک مقام ایرانی:
    احتمال «بسیار پایین»؛ یک مقام اروپایی: فهرست ایران «بسیار طولانی» است. پزشکیان
    (NBC): خواستار احیای تفاهم‌نامه ژوئن پیش از انتخابات میان‌دوره‌ای است، پذیرای
    بازرسی‌های هسته‌ای است، توطئه علیه ترامپ را رد می‌کند. روبیو: پیشرفت بزرگی نیست.
    ترامپ: ایران تا انتخابات میان‌دوره‌ای وقت‌کشی می‌کند. جبهه حوثی‌ها: شش موشک بالستیک
    به‌سوی طائف و ینبع رهگیری شد (ائتلاف/المالکی)؛ حوثی‌ها مدعی اصابت به آرامکو-ینبع
    و ریاض هستند - هیچ گزارش خسارتی از SPA وجود ندارد (صرفاً ادعای طرف متخاصم، قاعده
    12)؛ مکرون نیرو، رادار و پدافند هوایی به ینبع می‌فرستد؛ بریتانیا با ایران مقابله
    می‌کند؛ 150+ نفر در نبردهای یمن بر سر ارتفاعات باب‌المندب کشته شدند؛ صفوی: ممکن
    است جبهه‌ای در دریای سرخ/باب‌المندب گشوده شود. بحرین پیشگام درخواست بازگشایی کامل
    هرمز بدون عوارض است (2df323fa در جهت مخالف). عبورهای هرمز در چهارشنبه 10 مورد
    (میانگین 10 روزه حدود 17، موارد فاقد سیگنال AIS لحاظ نشده‌اند). حمله به Cape Dao
    همچنان به کسی منتسب نشده است (dd31b40f جمعه بسته می‌شود). نردبان بدون تغییر؛ مورد
    جدید 9083e952 (نبود ترتیباتی با تأیید هر دو طرف از جمعه تا سه‌شنبه، 0.7). نشانه‌ها:
    پاسخ علنی و قابل استناد آمریکا به مهلت تعیین‌شده؛ «گام بعدی» شورای عالی امنیت
    ملی؛ گزارش خسارت SPA در ینبع؛ اعلام میزبانی همراه با مکان+تاریخ.'
