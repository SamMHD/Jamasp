  why_fa: 'بازخریدهای گسترش‌یافته اوراق بلندمدت خزانه‌داری (19 اوت) عملاً کنترل منحنی
    بازده هستند و بازار آن‌ها را به‌منزله کاهش ارزش پول تفسیر کرد - رژیم روند طلا
    زمانی آغاز شد که بدهی آمریکا از $40tn گذشت. این ابزار در 9-10 سپتامبر آشکارا شکست
    خورد (حراج اوراق 30 ساله در 5.308 «ضعیف» بود). 18 سپتامبر: «اوراق قرضه دوباره
    سقوط می‌کنند» - 10 ساله 5.00، 30 ساله 5.328 - و طلا با وجود ثبات دلار افزایش یافت:
    یک جلسه معاملاتی. 21 سپتامبر: بخش بلندمدت منحنی با افت -3.7% نفت صعود کرد (30
    ساله 5.280) و طلا افت کرد. 22 سپتامبر: حراج اوراق 2 ساله ($69bn) در 4.787 با فاصله
    نامطلوب 0.2bp نسبت به بازده پیش از حراج، رتبه C، انجام شد - بدون تنش در بخش کوتاه‌مدت؛
    منحنی در پایان معاملات 1.5-2.3bp بالاتر بسته شد (5 ساله 4.842، 10 ساله 4.967،
    30 ساله 5.303؛ گزارش جمع‌بندی investinglive برای 10 ساله -6bp ثبت کرده بود - اختلاف
    در مبنای محاسبه، مبنا قیمت پایانی CNBC است)، درحالی‌که طلای نقدی $22 افزایش یافت
    و ردیف بدون تغییر بود - بخش بلندمدت در هیچ‌یک از دو جهت پیشرو طلا نیست. aec5cc8b
    در 23 سپتامبر محقق شد (هیچ بازده پایانی اوراق 30 ساله در جمعه تا سه‌شنبه >=5.40
    نبود؛ سقف 5.311). پرلی (فدرال رزرو نیویورک): خرید اسناد کوتاه‌مدت خزانه «متوقف
    شده، تمام نشده است». زیر نظر داشته باشید: حراج‌های 5 ساله/7 ساله چهارشنبه/پنج‌شنبه
    (تأییدنشده، todo-185 - هیچ گزارش انتقال‌یافته‌ای در پایگاه داده نیست)، هر اظهارنظر
    بسنت درباره انتشار اوراق (حضورهای او در 21-22 سپتامبر فقط درباره ایران/چین/گازوئیل
    بود)، و اینکه آیا اوراق 30 ساله در هیچ جلسه‌ای هم‌جهت با طلا حرکت می‌کند یا نه.
    24 سپتامبر: اوراق 30 ساله در 5.402 بسته شد (CNBC) - نخستین بسته‌شدن بالای 5.40
    - با 10 ساله در 5.114 (سقف از 2007) و 2 ساله در 4.895: حرکتی در واکنش به PMI که
    ابتدا با افزایش بازده‌ها منحنی را مسطح‌تر کرد و سپس به حرکت موازی تبدیل شد، با
    افت طلا و صعود دلار. بخش بلندمدت سطح را شکست و طلا آن را به‌منزله کاهش ارزش پول
    تفسیر نکرد (aec5cc8b پیش‌تر با بسته‌شدن سه‌شنبه محقق شده بود). حراج‌های 5 ساله/7
    ساله همچنان تأییدنشده‌اند (هیچ گزارش انتقال‌یافته‌ای در پایگاه داده نیست، todo-185).
    زیر نظر داشته باشید: بسته‌شدن اوراق 30 ساله در >=5.45 همراه با افت DXY و صعود
    طلا تنها ثبت معاملاتی است که مبنا را تغییر می‌دهد. 25 سپتامبر: ابزار دوباره شکست
    خورد - خزانه‌داری دومین بازخرید خود طی دو هفته را انجام داد و حراج 7 ساله ($44bn)
    در 5.085% با فاصله نامطلوب 0.7bp نسبت به بازده پیش از حراج پایان یافت؛ 30 ساله
    در 5.460 بسته شد (+5.9bp، بالاترین در 22 سال؛ مقدار لحظه‌ای در گزارش جمع‌بندی
    5.478)، 10 ساله 5.163 (سقف از ژوئیه 2007)، نرخ وام‌های مسکن 7%. رویترز به نقل
    از investinglive: «بازخریدها و مداخله در ین نتوانسته‌اند بازده‌ها را مهار کنند»؛
    استراتژیست‌ها بیشتر افزایش از مارس را به انتظارات افزایش نرخ بهره فدرال رزرو و
    باقی را به رشد و نفت نسبت دادند؛ «6% برای اوراق 10 ساله در حال تبدیل‌شدن به آستانه
    بعدی درد است». در سطح جهانی: استقراض بی‌سابقه آلمان به میزان ~EUR525bn، اوراق
    دولتی آلمان در سقف 17 ساله، اوراق دولتی 10 ساله ژاپن در سقف از 1996. طلا نزولی
    همراه با DXY صعودی - به‌منزله کاهش ارزش پول تفسیر نشد. تنها عامل تغییر مبنا: 30
    ساله >=5.50 همراه با افت DXY و صعود طلا. 26 سپتامبر: 30 ساله در 5.49 بسته شد (+2.8bp،
    بالاترین از 2004؛ درون‌روزی 5.532)، 10 ساله 5.165 (درون‌روزی 5.23، سقف از 2007)،
    فاصله 2s30s برابر با 63bp بود (+12bp طی دو جلسه هم‌زمان با افت بازده 2 ساله) -
    شیب‌دارترشدن منحنی با افزایش بازده‌ها در روزی که دلار 0.22% افت کرد و طلا 0.27%
    افزایش یافت: اوراق بخش بلندمدت به دلایل خاص خود فروخته می‌شوند (عرضه، بازنگری‌ها،
    «6% در محدوده احتمالات است» به‌عنوان مطلب ضروری investinglive) و طلا همچنان، حتی
    با کناررفتن مانع دلار، آن را به‌منزله کاهش ارزش پول تفسیر نمی‌کند. جزئیات حراج‌های
    5 ساله/7 ساله همچنان تأییدنشده است (todo-185). پایان فصل چهارشنبه است. تنها عامل
    تغییر مبنا: بسته‌شدن 30 ساله در >=5.50 همراه با افت DXY و صعود طلا. 27 سپتامبر:
    گزارش توضیحی CNBC (تیری ویزمن از مک‌کواری): 10 ساله در 5.23 «بیشتر به انتشار اوراق
    قرضه مربوط است تا روایت تورم» - تأمین مالی کسری بودجه به‌اضافه بدهی برای مخارج
    سرمایه‌ای هوش مصنوعی (ونگارد: $132bn انتشار اوراق توسط Alphabet/Amazon/Meta/Microsoft/Oracle
    تا پایان ژوئیه در برابر ~$35bn در سال طی 2020-24؛ $300-570bn انتشار اوراق مرتبط
    با هوش مصنوعی در سال جاری)، «فدرال رزروی نداریم که به‌شدت سیاست انقباضی اعمال
    کند»، «این بازده‌ها می‌توانند بالاتر بروند». بخش بلندمدت داستان عرضه اوراق با
    دیرش بالاست که بازار آن را به نفع دلار قیمت‌گذاری می‌کند - نشانه مخالف طلا (17
    علیه / 2 به نفع) پابرجاست. actionforex: 10 ساله (سقف کانال 5.23، هدف برآوردی 5.413)
    اکنون کلید دلار است؛ توقف صعود، DXY را به 99.7-99.9 بازمی‌گرداند. جمعه: 30 ساله
    5.49 همراه با افت DXY و صعود 0.3% طلا - یک واحد پایه و یک پله در اندازه حرکت کمتر
    از حد فعال‌سازی base-25. جزئیات 5 ساله/7 ساله همچنان تأییدنشده است (todo-185).
    پایان فصل چهارشنبه است. تنها عامل تغییر مبنا: بسته‌شدن 30 ساله در >=5.50 همراه
    با افت DXY و صعود طلا. 1 اکتبر: ترامپ چهارشنبه 20:00Z (Truth Social): پاول باید
    به‌دلیل بازسازی ساختمان مرکزی از هیئت‌مدیره استعفا دهد (>=$2.5bn طبق گزارش بازرس
    کل؛ پیش‌بینی خود او $3.5-4bn)، از بلانش، دادستان کل، خواسته شد بررسی کند و «تعیین
    کند چه اقدامی باید انجام شود»، و در صورت ماندن او تهدید به طرح دعوی از سوی دولت
    شد. موضعی صرفاً علیه عضو هیئت‌مدیره (بدون تعرض به وارش) و داده‌های معاملات DXY
    صعودی به میزان 0.08%، اوراق 30 ساله +3.7bp و طلای نزولی را ثبت کردند - نشانه مخالف،
    نه سلطه مالی (18 علیه / 2 به نفع). شرط نقض 288a87ac همچنان «اقدامی علیه وارش که
    به‌منزله سلطه مالی قیمت‌گذاری شود» باقی می‌ماند؛ ثبت دادخواست یا حکم برکناری علیه
    یک عضو شاغل هیئت‌مدیره نشانه بعدی است (در پایش بعدی آرایش 30 ساله/DXY/طلا را بخوانید).
    مقدار فیلد 30 ساله چهارشنبه 5.639، سقف آسیا 5.653؛ MarketWatch: «سپتامبری بی‌رحمانه
    برای اوراق قرضه از اکتبری حتی تیره‌تر خبر می‌دهد»؛ فروش عظیم اوراق بدهی پارامونت
    به‌عنوان نشانه فشار ناشی از اوراق شرکتی. خلاصه 3 اکتبر: 288a87ac محقق شد (نتیجه
    قطعی جمعه: ردیف نزولی / 2 ساله صعودی؛ 18 علیه / 2 به نفع در کل دوره). برای مورد
    جانشین، 0.7 برای دوشنبه تا جمعه 5-9 اکتبر ثبت شد (هیچ جفت جلسه متوالی با صعود
    هر دو وجود نداشته باشد؛ نقاط تعیین‌کننده: حراج 10 ساله چهارشنبه 17:01Z، حراج 30
    ساله پنج‌شنبه 17:01Z، صورت‌جلسه چهارشنبه 18:00Z). 30 ساله در 5.623 بسته شد (سقف
    5.647)، در برابر مرز رکود تورمی 5.65؛ DFII10 برابر با 2.88 (-5bp). اگر قرار باشد
    جلسه‌ای با صعود 30 ساله / افت DXY / صعود طلا ثبت شود، حراج‌ها محل ثبت آن خواهند
    بود. خلاصه 5 اکتبر: آغاز معاملات یکشنبه، 30 ساله 5.61 (-2bp)، 10 ساله 5.26، DXY
    صعودی تا سقف 52 هفته‌ای، طلا صعودی - آرایش سلطه مالی نیست (DXY صعودی، بخش بلندمدت
    نزولی). داستان تنش بدهی حاکمیتی این هفته فرانسه است (OAT-Bund >140bp، بالاتر از
    ایتالیا؛ رجوع کنید به euro-sovereign-stress)، نه خزانه‌داری آمریکا. جلسه اول 968df4d5
    (نبود جفت جلسات با صعود هر دو در دوشنبه تا جمعه) دوشنبه است؛ نقاط تعیین‌کننده:
    حراج 10 ساله چهارشنبه 17:01Z، صورت‌جلسه چهارشنبه 18:00Z، حراج 30 ساله پنج‌شنبه
    17:01Z. DFII10 برابر با 2.88.'
