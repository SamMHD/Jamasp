  why_fa: 'دو وضعیت: کنترل سپاه پاسداران بر عبور و مرور هرمز در برابر محاصره آمریکا،
    همراه با تبادل آشکار آتش از 30-31 اوت، و جبهه دوم دریای سرخ که در 19 سپتامبر به
    ریاض رسید (موشک حوثی‌ها، رهگیری شد). 22 سپتامبر - مسیر مذاکرات گشوده شد: هیئت
    عراقچی و ویتکاف/ کوشنر یک دور مذاکره با میانجی‌گری در سازمان ملل را به پایان رساندند
    (رفت‌وآمد میانجی‌گرانه قطر و پاکستان)؛ ترامپ: حدود 3 ساعت، «سازنده»، دوری دیگر
    «به‌زودی»، اما توافق «درست پس از انتخابات» و «نابود کردن» به‌عنوان گزینه جایگزین؛
    ویتکاف (X): غیرمستقیم، یک دور به پایان رسیده، میانجی‌گری ادامه دارد؛ تلویزیون
    دولتی ایران: تهران درخواست ویتکاف را پذیرفت، «شروط سخت‌گیرانه» منتقل شد؛ نیویورک
    تایمز (2 مقام ایرانی): عراقچی با ویتکاف+کوشنر دیدار کرد؛ شبکه 12 اسرائیل: بر سر
    بیشتر اختلافات توافقی حاصل نشده؛ منبع العربیه: «بن‌بست شکسته شد». شروط ایران (تسنیم):
    پایان جنگ در همه جبهه‌ها، جدول زمانی خروج از جنوب لبنان، وجوه مسدودشده، رفع محاصره
    و تحریم‌های جدید، معافیت نفتی - همان تفاهم‌نامه قدیمی. فارس: آمریکا «هیچ خط قرمزی
    باقی نگذاشته است»، آمادگی برای همه سناریوها. پیش‌تر در سه‌شنبه، گزارش کیودو درباره
    «بازگشایی هرمز ظرف 7 روز» از سوی فارس تکذیب شد. 645cc78a ناموفق (نخستین شکست این
    خانواده؛ درس مربوط به قید قالب ثبت شد). هرمز: آخرین اصابت‌ها دوشنبه 21 سپتامبر
    (LR Stephanie، جزیره من؛ یک کشتی حامل LPG) - هیچ‌کدام مرتبط با عربستان نبودند؛
    در 22-23 سپتامبر هیچ شناور جدیدی نبود (جست‌وجو شد)؛ شمار عبورهای هرمز بر اساس
    AIS برابر با «دو» (Investing.com، 22 سپتامبر)، در برابر بارگیری حدود 12m بشکه
    عربستان در یک روز و راه‌اندازی مجدد خط لوله شرق-غرب (به‌صورت جزئی) - جریان‌ها
    به خارج از پوشش AIS و مسیرهای دورزننده تنگه منتقل شدند. پادشاه عربستان در مجمع
    عمومی سازمان ملل «هدف قرار دادن مکه» از سوی حوثی‌ها را محکوم کرد (همان پهپاد قبلی،
    رویداد جدیدی نیست)؛ فرانسه در حال بررسی قطعنامه شورای امنیت درباره هرمز است؛ اتحادیه
    اروپا به‌دنبال تجهیزات و نیرو برای دریای سرخ است؛ بریتانیا پیشنهاد سوخت‌رسانی
    به عربستان می‌دهد. تا 23 سپتامبر ساعت 03:30Z هیچ گزارشی از گفت‌وگوی ترامپ با شورای
    همکاری خلیج فارس در پایگاه داده نبود (جست‌وجو شد، موجود نیست). نردبان: زیرساخت
    خارگ/لارک d96debd5 (تا 26 سپتامبر)؛ وضعیت سمت خلیج فارس 2df323fa (تا 26 سپتامبر)؛
    خویشتن‌داری عربستان 33defb45 (تا 27 سپتامبر)؛ اسکورت‌ها d4f5ffd6 (تا 27 سپتامبر)؛
    شناور عربستانی 9e629d6e (چهارشنبه ساعت 23:59Z بسته می‌شود، در مسیر تحقق)؛ 0d52e7da
    (نبود دیدار ترامپ-پزشکیان یا دور دوم مذاکرات مستقیم در چهارشنبه تا یکشنبه که هر
    دو طرف آن را تأیید کرده باشند، 0.65) - به‌محض آنکه هر دو طرف دور دوم را تأیید
    کنند، در مسیر عدم تحقق قرار می‌گیرد. نشانه‌ها: اعلام میزبانی قطر/پاکستان همراه
    با مکان+تاریخ (-> فعال‌سازی بررسی عمیق)؛ دیدار ترامپ-پزشکیان با تأیید هر دو طرف؛
    هرگونه دستور حمله آمریکا؛ گزارش‌های خسارت خبرگزاری رسمی عربستان (SPA)؛ متوقف شدن
    یک شناور تحت اسکورت همراه با تلفات (پله بعدی نردبان). 24 سپتامبر: چهارشنبه - دور
    دومی برگزار نشد؛ مقام ارشد (رویترز): اگر آمریکا فشار را کاهش دهد و محاصره بنادر
    را بردارد، هرمز می‌تواند ظرف یک هفته بازگشایی شود، «اختلافات زیاد»؛ رضایی: تا
    برآورده شدن شروط بسته می‌ماند؛ برنت در 103.08 (+3.9%) تسویه شد. در طول شب: نقشه
    راه ایران (گلف نیوز، منابع منطقه‌ای، بدون تأیید هیچ‌یک از دو دولت) - آتش‌بس تا
    60 روز در سراسر منطقه، بازگشایی مرحله‌ای هرمز، توقف حملات به همسایگان عرب، جدول
    زمانی مذاکرات گسترده‌تر؛ روبیو «پذیرا» است، گزینه‌های نظامی حفظ شده‌اند. تسنیم
    (مرتبط با سپاه پاسداران): تماس عراقچی-ویتکاف از سوی نهادهای سیاست‌گذار «مجاز اعلام
    نشده بود»؛ وزارت امور خارجه: با میانجی‌گری قطر، شروط منتقل شد - اکنون مجوز طرف
    ایرانی شرط عبور است. Cape Dao (23 سپتامبر): فله‌بر بدون اسکورت تحت مدیریت امارات،
    یک دریانورد هندی کشته شد، انتسابی به آمریکا وجود ندارد (dd31b40f تا جمعه فعال
    است). 9e629d6e محقق شد (خانواده 10/10؛ جانشینی برای شناور عربستانی نوشته نشد -
    بارگیری ینبع بدون پاسخ دریایی از سر گرفته شد، این دسته بر اساس سوابق موجود پابرجاست).
    مورد جدید ed8c08b5 (نبود اعلام رسمی آتش‌بس از سوی آمریکا از پنج‌شنبه تا یکشنبه،
    0.7). محاصره: مسیر 115 کشتی مرتبط با ایران تغییر داده شد (گلف نیوز). فرمانده ارشد
    سپاه پاسداران در درگیری‌های جنوب‌شرق ایران کشته شد (داخلی، نه آمریکا). 25 سپتامبر:
    شمارش معکوس. رضایی (دبیر شورای عالی امنیت ملی، به نقل از گاردین/پرس تی‌وی، گلف
    نیوز 00:36Z): واشنگتن «چهار یا پنج روز» فرصت دارد شروط ایران را «کامل و یکجا»
    اجرا کند - تا زمانی که آمریکا اقدام نکند، نه هرمز بازگشایی می‌شود و نه مذاکره‌ای
    انجام خواهد شد؛ «حرف کافی است. اکنون باید عمل کنیم»؛ درباره «گام بعدی» پس از پایان
    مهلت تصمیم گرفته می‌شود (تقریباً دوشنبه 28 تا سه‌شنبه 29). مجلس طرح استیضاح عراقچی
    را ثبت کرد (خضریان، ثابتی) بر سر تماس‌های نیویورک - تندروها می‌گویند مجوز، انتقال
    شروط از طریق میانجی‌ها بوده، نه مذاکرات مستقیم؛ یک مقام ارشد به رویترز گفته بود
    هیئت «اختیار کامل» داشته است. رویترز (منابع، پنج‌شنبه 16:18Z): مذاکره‌کنندگان
    در حال بررسی توافقی مرحله‌ای هستند (بازگشایی هرمز، رفع محاصره، دارایی‌های مسدودشده)؛
    یک مقام ایرانی: احتمال «بسیار پایین»؛ یک مقام اروپایی: فهرست ایران «بسیار طولانی»
    است. پزشکیان (NBC): خواهان احیای تفاهم‌نامه ژوئن پیش از انتخابات میان‌دوره‌ای
    است، با بازرسی‌های هسته‌ای موافق است، توطئه علیه ترامپ را رد می‌کند. روبیو: پیشرفت
    بزرگی نیست. ترامپ: ایران تا انتخابات میان‌دوره‌ای وقت‌کشی می‌کند. جبهه حوثی‌ها:
    شش موشک بالستیک به‌سوی طائف و ینبع رهگیری شدند (ائتلاف/المالکی)؛ حوثی‌ها مدعی
    اصابت به آرامکو-ینبع و ریاض شدند - هیچ گزارش خسارتی از SPA وجود ندارد (صرفاً ادعای
    طرف متخاصم، قاعده 12)؛ مکرون نیرو، رادار و پدافند هوایی به ینبع می‌فرستد؛ بریتانیا
    با ایران مقابله می‌کند؛ 150+ کشته در نبردهای یمن بر سر ارتفاعات باب‌المندب؛ صفوی:
    ممکن است جبهه‌ای در دریای سرخ/باب‌المندب گشوده شود. بحرین در صدر درخواست برای
    بازگشایی کامل هرمز بدون عوارض قرار دارد (2df323fa در جهت مخالف). عبورهای هرمز
    در چهارشنبه 10 مورد (میانگین 10 روزه حدود 17، موارد با AIS خاموش مستثنا هستند).
    Cape Dao همچنان بدون انتساب است (dd31b40f جمعه بسته می‌شود). نردبان بدون تغییر؛
    مورد جدید 9083e952 (نبود ترتیبات مورد تأیید هر دو طرف از جمعه تا سه‌شنبه، 0.7).
    نشانه‌ها: پاسخ رسمی آمریکا به مهلت؛ «گام بعدی» شورای عالی امنیت ملی؛ گزارش خسارت
    SPA در ینبع؛ اعلام میزبانی همراه با مکان+تاریخ. 26 سپتامبر: پیشنهاد. عراقچی (سازمان
    ملل، جمعه): یک «طرح مشخص هفت‌روزه» از طریق قطر منتقل شده است - بازگشایی ظرف هفت
    روز پس از برآورده شدن شروط (رفع محاصره + تحریم کشتیرانی، معافیت از تحریم‌های نفتی،
    آتش‌بس در سراسر منطقه از جمله لبنان، >=$12bn دارایی مسدودشده)؛ «اکنون انتخاب با
    ایالات متحده است». گلف نیوز: «ظرف چند ساعت گزارش‌ها حاکی از آن بود» که ترامپ آن
    را رد کرده است - هیچ منبعی نام برده نشده، هیچ موضع رسمی آمریکا وجود ندارد (ماریتایم
    اگزکیوتیو/ رویترز: کاخ سفید بلافاصله پاسخی نداد؛ آسوشیتدپرس: مقام‌های عربستان
    «بدبین» هستند). دومین مقام ارشد ایرانی (رویترز): حتی در صورت پذیرش، انعطافی در
    موضوع هسته‌ای وجود نخواهد داشت. فارس: گزارش اکسیوس درباره «آماده‌سازی دور جدید»
    و گزارش الجزیره درباره «اعزام کارشناسان به نیویورک» نادرست است، «خبرسازی» برای
    جابه‌جایی قیمت نفت. پزشکیان (CBS): بازرسان آژانس بین‌المللی انرژی اتمی می‌توانند
    بازگردند. دریای سرخ: شنبه - دو پهپاد حوثی‌ها به‌سوی ریاض + یک موشک بالستیک به‌سوی
