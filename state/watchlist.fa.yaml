  why_fa: 'جنگ به‌شکل افزایش نرخ بهره فدرال رزرو و اخطار تأمین وجه تضمین به طلا می‌رسد،
    نه به‌شکل تقاضا برای دارایی امن. چهارده جلسه معاملاتی شواهد از 2 تا 21 سپتامبر،
    با شدیدترین مورد در 21 سپتامبر (اصابت به دو نفتکش، نفت -3.7%، طلا -1.0%، BTC +7.1%).
    در خلاف این جهت: یک مورد (9 سپتامبر). 22 سپتامبر - مرحله تنش‌زدایی: یک دور مذاکرات
    آمریکا و ایران که هر دو طرف آن را تأیید کردند، برنت در 99.25 تسویه شد (-1.1%،
    پنج جلسه نزولی)، طلای نقدی +0.5% / ردیف بدون تغییر، منحنی بازده 1.5-2.3 واحد پایه
    بالا رفت، دلار در اواخر معاملات تضعیف شد و سپس طی شب تقویت شد و طلا رشدش را پس
    داد. بند جریان معاملات درباره محرک (قاعده 23): حدود 18:30Z ثبت شد، GC در پایان
    معاملات Globex از 4390 -> 4396 رفت - هدف در هر دو جهت محقق نشد، وزن‌ها حفظ شدند.
    دریچه: صعود نفت باعث فروش طلا می‌شود (از مسیر بازده اوراق 2 ساله)؛ افت نفت بر
    اثر دیپلماسی، طلا را بدون تغییر تا نزولی باقی می‌گذارد (صرف خود طلا تخلیه می‌شود،
    بازده اوراق 2 ساله همراهی نمی‌کند) - تنها مسیر صعود طلا، افت بازده اوراق 2 ساله
    است که به یک عضو هیئت‌مدیره فدرال رزرو یا داده‌ای از آمریکا که روند را بشکند نیاز
    دارد، نه یک تیتر خبری. ادعاها: 64c7ba41 در 23 سپتامبر نامشخص (هیچ تسویه صعودی
    نفتی در دوشنبه/ سه‌شنبه نبود)؛ جانشین آن، 8e425cab (0.5)، با نخستین تسویه صعودی
    برنت از چهارشنبه تا جمعه فعال می‌شود (ردیف <+1% = محقق؛ نبود مورد = نامشخص)؛ f7a0c23d
    (0.55): هیچ تسویه برنت >=103 از چهارشنبه تا جمعه رخ نمی‌دهد - ادعای تخلیه صرف.
    تأییدکننده‌ها: یک تسویه صعودی نفت با طلای بدون تغییر/نزولی؛ حمله آمریکا به ایران
    که بازار با افت طلا قیمت‌گذاری کند؛ متنی با تأیید هر دو طرف که بازار با نفت -5%
    و طلای نزولی قیمت‌گذاری کند. ابطال‌کننده‌ها: عدم تحقق 8e425cab -> سناریوی درگیری
    نظامی 35؛ دو ردیف پیاپی صعود طلا / صعود بازده اوراق 2 ساله؛ طلا +1% در جلسه‌ای
    با نفت نزولی و بازده اوراق 2 ساله بدون تغییر؛ رویدادی در عرضه که به‌صورت رکود
    تورمی معامله شود (صعود بازده سررسیدهای بلند، دلار نزولی، طلا صعودی)؛ متنی که بازار
    با برنت -5%، طلای صعودی و بازده اوراق 2 ساله بدون تغییر قیمت‌گذاری کند -> سناریوی
    درگیری نظامی 25. 24 سپتامبر: 8e425cab محقق شد - نخستین تسویه صعودی نفت (103.08،
    +3.9%) ردیف طلا را در -1.74% ثبت کرد؛ چهارده جلسه صعود نفت از 2 سپتامبر که طلا
    در پایان آن‌ها بدون تغییر/نزولی بسته شد، با یک مورد خلاف جهت. تعدیل طبق قاعده
    9: بازقیمت‌گذاری ناشی از PMI/بار نیز در همان روز رخ داد. f7a0c23d محقق نشد (سقف
    تخلیه صرف در یک جلسه شکست؛ درس: سطوح نفت مشمول آزمون فاصله قاعده 20 می‌شوند).
    مرحله تخلیه طی شب: برنت بر اثر گزارش نقشه راه -1%، طلا بدون تغییر در 4324، بازده
    اوراق 2 ساله بدون تغییر - دیپلماسی تقاضای خرید ایجاد نمی‌کند. سناریوی درگیری نظامی
    25. ابطال‌کننده‌ها بدون تغییر: ثبت وضعیت رکود تورمی (بازده اوراق 30 ساله >=5.45،
    DXY نزولی، طلا صعودی)؛ دو ردیف صعود هم‌زمان هر دو؛ طلا +1% با نفت نزولی و بازده
    اوراق 2 ساله بدون تغییر. 25 سپتامبر: پانزدهمین جلسه صعود نفت که طلا در پایان آن
    بدون تغییر/نزولی بسته شد (برنت با خبر موشک‌ها در ینبع +3.4% تا 106.60؛ ردیف -0.37%).
    شکاف: در 16:18Z گزارش توافق مرحله‌ای، برنت را -3 و GC را +20 جابه‌جا کرد (4292.7
    -> 4312.1)، در حالی که بازده اوراق 2 ساله بدون تغییر بود - نخستین تقاضای خرید
    در زمان افت نفت در این رژیم - که تا 18:00Z فروکش کرد؛ سپس طی شب، برنت -1% باعث
    خرید طلا و رشد +24 آن تا 4328.5 شد. کوچک است، اما زنجیره اکنون در معاملات درون‌روزی
    هر دو جهت را نشان می‌دهد. ادعای جدید a270f3f1 (0.55): نخستین تسویه برنت -3% از
    جمعه تا سه‌شنبه، ردیف GC +1% ثبت نمی‌کند؛ عدم تحقق با بازده اوراق 2 ساله بدون
    تغییر -> سناریوی درگیری نظامی 20، سناریوی پایه 25 (مرحله تخلیه باعث خرید طلا می‌شود
    = رژیم در حال سست شدن است). سایر ابطال‌کننده‌ها بدون تغییر. 26 سپتامبر - دریچه
    در بخش کوتاه‌مدت منحنی دوطرفه است: جمعه برنت بر اثر طرح هفت‌روزه در 104.32 تسویه
    شد (-2.1%)، بازده اوراق 2 ساله با -3.5 واحد پایه در 4.86 بسته شد، DXY -0.22%،
    ردیف GC +0.27% (4321.2)، طلای نقدی +$8 - نخستین جلسه این رژیم که در آن افت نفت
    بخش کوتاه‌مدت منحنی را پایین کشید و باعث خرید طلا شد، بدون هیچ عامل واسط یا سخنرانی.
    همان زنجیره (قاعده 22)، با علامت معکوس؛ تقاضا برای دارایی امن نیست (طلا صعود کرد
    چون بازده اوراق 2 ساله افت کرد). شمارش: 15 جلسه از 16 جلسه صعود نفت با طلای بدون
    تغییر/نزولی بسته شد؛ جلسات افت نفت اکنون 3 مورد بدون تغییر تا نزولی (21، 22، 24
    سپتامبر) در برابر 1 مورد صعودی (25 سپتامبر، از مسیر بازده اوراق 2 ساله) هستند.
    بازنگری: شاخه توافق اکنون برای طلا اندکی صعودی است (+0.5-1% در برابر برنت -5-8%)،
    با سقفی ناشی از تخلیه صرف - فرض «بدون تغییر تا نزولی» پنجشنبه کنار گذاشته شد (درس
    ثبت شد). a270f3f1 (0.55) آزمون است: نخستین تسویه برنت -3% تا سه‌شنبه نباید ردیف
    +1% ثبت کند (جمعه -2.1%، ردیف +0.27% ثبت کرد؛ با مقیاس‌بندی، -3% ~ +0.4%). ادعای
    جدید 95c71900 (هیچ ردیف >=4402.2 در دوشنبه تا سه‌شنبه، 0.5) سقف هر یک از دو شاخه
    است. سناریوی درگیری نظامی 25. ابطال‌کننده‌ها بدون تغییر: عدم تحقق a270f3f1 با
    بازده اوراق 2 ساله بدون تغییر -> 20 / سناریوی پایه 25؛ دو ردیف صعود هم‌زمان هر
    دو؛ ثبت وضعیت رکود تورمی. 27 سپتامبر: رد طرح پس از تسویه رخ داد. مرحله تخلیه جمعه
    (برنت -2.1%، بازده اوراق 2 ساله -3.5 واحد پایه، DXY -0.22%، ردیف GC +0.27%) طرحی
    را معامله کرد که ترامپ روز شنبه به‌طور علنی رد کرد (~18:00Z)؛ بازگشایی یکشنبه
    در 22:00Z این ورودی را بازقیمت‌گذاری می‌کند - انتظار برنت 106-108، بازگشت بازده
    اوراق 2 ساله به‌سمت 4.90، و پس دادن رشد $12 جمعه طلا از مسیر بخش کوتاه‌مدت منحنی
    (تقاضا برای دارایی امن نیست). ادعای جدید 9e1829f8 (0.6): نخستین تسویه برنت >=+2%
    در دوشنبه تا سه‌شنبه، ردیف GC را >=0.1% پایین‌تر از ردیف قبلی ثبت می‌کند (اگر
    هیچ موردی ثبت نشود، نامشخص) - آزمون علامت معکوس سابقه 15/16 صعود نفت؛ عدم تحقق
    با بازده اوراق 30 ساله >=5.50 و DXY نزولی، قرائت رکود تورمی است (سناریوی پایه
    25)، عدم تحقق با صعود بازده اوراق 2 ساله و صعود طلا، یک ردیف صعود هم‌زمان هر دو
    است (سناریوی پایه). a270f3f1 (0.55) به‌سمت نتیجه نامشخص می‌رود (تسویه -3% تا سه‌شنبه
    به یک پیشنهاد متقابل رسمی آمریکا نیاز دارد). سناریوی درگیری نظامی 25: شاخه توافق
    طبق موضع علنی از روی میز کنار رفته است، شاخه شکست مذاکرات (برنت >=110 -> طلا نزولی
    از مسیر بازده اوراق 2 ساله) شاخه فعال است. ابطال‌کننده‌ها بدون تغییر: عدم تحقق
    a270f3f1 با بازده اوراق 2 ساله بدون تغییر -> 20 / سناریوی پایه 25؛ دو ردیف صعود
    هم‌زمان هر دو؛ ثبت وضعیت رکود تورمی.'
