    چین در پس‌زمینه. نفت خام بی‌تأثیر (Brent دسامبر 102.31، +4% پنجشنبه در پی موضع‌گیری).
    میانگین سوخت سپتامبر قطعی شده است -> 4dfbd1d8 (شاخص کل قیمت مصرف‌کننده (CPI) سپتامبر
    >=0.4) بی‌تأثیر؛ انتشار آمار اکتبر است که آزادسازی بر آن اثر می‌گذارد. قیمت‌های
    پرداخت‌شده ISM برابر با 77.9 (فولاد، آلومینیوم، نفت، تعرفه‌ها) = بخش هزینه نهاده‌ها
    همچنان صعودی است. گزارش کوتاه 4 اکتبر: بررسی میان‌دوره‌ای قاعده-11 برای دو ادعای
    شاخص قیمت مصرف‌کننده (CPI)، بر اساس برآورد آنی فدرال رزرو کلیولند (گزیده‌های صفحه؛
    2 اکتبر): شاخص کل سپتامبر 0.53، هسته 0.20، سال‌به‌سال 3.60/2.39؛ اکتبر تا این
