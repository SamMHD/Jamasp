    «غافلگیری‌ها»؛ پاک‌نژاد، وزیر نفت ایران، استعفا داد (بورد سرپرست، بدون اعلام دلیل)؛
    B-1ها پس از طرحی مرتبط با سپاه از فرفورد به بخش اصلی خاک آمریکا بازگشتند (پنتاگون:
    «آماده می‌مانند»)؛ OPEC+ سطح را حفظ کرد (7 عضو اصلی ~25 mb/d، حدود ~5 mb/d کمتر
    از فوریه؛ بازبینی ظرفیت تا اواسط نوامبر؛ نشست بعدی 1 نوامبر)؛ قیمت فروش رسمی نوامبر
    آرامکو برای آسیا -$3 (بیشترین تخفیف از 2020)؛ صادرات خاورمیانه در 4/7 روز > پیش
    از جنگ (Kpler). برنت دسامبر در بازگشایی 101.4 (-0.8%) - بشکه‌ها بر موشک‌ها غلبه
    کردند. نظامی 25 حفظ شد.'
