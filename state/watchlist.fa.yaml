    برابر با 1.1213 (-0.17%)؛ DXY برابر با -0.17 همراه با کاهش بازده 2ساله — جلسه‌ای
    برای بخش دلار محسوب نمی‌شود (شمارش 0). ECB در 29 اکتبر به تقویم اضافه شد (زمان
    دقیق تأیید نشده است).'
