    در نزدیکی هرمز؛ جورج واشنگتن می‌ماند، بوش رفت؛ سه ناو هواپیمابر «وقتی روزولت برسد»
    (آخرین بار پیش از 2026: 2003)؛ آتشبارهای پاتریوت به تأسیسات انرژی قطر/عربستان
