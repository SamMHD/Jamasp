  why_fa: 'کف ناشی از تقاضای ساختاری: ~289t تقاضای بخش رسمی در این چرخه، همراه با
    ازسرگیری ورود سرمایه به ETF، و تنوع‌بخشی ذخایر با خروج از اوراق خزانه به‌عنوان
    همتای آن در سمت جریان سرمایه (دارایی‌های اوراق خزانه آمریکا در اختیار چین در پایین‌ترین
    سطح از 2008؛ UBS در 9 سپتامبر دیدگاه بلندمدت خود را حفظ می‌کند؛ گلدمن در 18 سپتامبر
    هدف $5,400 را با وجود افزایش نرخ بهره حفظ می‌کند). واکنش انتقال محل نگهداری ذخایر
    در حال گسترش است (DNB مقدار 86t به لندن و فرانسه؛ ونزوئلا در حال بررسی انتقال
    $4bn از لندن -> آمریکا). SGE برابر با 942/g (20 سپتامبر). در مقابل: روسیه فروشنده‌ای
    مستمر است؛ یک مؤسسه پژوهشی (investinglive، 23 سپتامبر) به‌دلیل دلار + فدرال رزرو
    انقباضی، انتظار افت بیشتر در Q4 را دارد، اما به‌واسطه عوامل ژئوپلیتیکی و خرید
    بخش رسمی، «کفی محکم در حوالی $3,800» پیش‌بینی می‌کند. کف در عمل: 4300 در GC (~4265
    نقدی) - آزمون‌ها در 14 سپتامبر 4305.9، در 15 سپتامبر 4304.0، در 16 سپتامبر تیک
    4296.7 در 22:19Z، سپس بازگشت به 4424.9 در جمعه 18 سپتامبر؛ کف 4335.0 در 22 سپتامبر
    با وجود سخنان ترامپ مبنی بر «نابودی یا توافق» + بازگشت برنت به 100 حفظ شد، سپس
    ردیف 4402.2. d571e0f0 در 23 سپتامبر محقق شد - کف‌ها در این رژیم 9/9، همگی با احتمال
    ثبت‌شده 0.55 (شکاف کالیبراسیون، منطق فاصله در قاعده 20)، و تک‌تک جهش‌های بازگشتی
    با پایین‌آمدن نفت از اوج‌هایش یا جلسه‌ای با کاهش بازده‌ها همراه بودند؛ هنوز هیچ
    خرید در افتی دقیقاً روی این خط در روزی با افزایش نفت دیده نشده است. آزمون دهم
    فعال است: 717f560c (هیچ ردیف GC_CLOSE با مقدار <=4300.0 از چهارشنبه 23 تا جمعه
    25 سپتامبر ثبت نشود، 0.55؛ 73 واحد زیر قیمت نقدی، 0.43x دامنه سه جلسه). عوامل
    تأییدکننده: آمار ماهانه WGC حاکی از خرید خالص در طول افت باشد (خوراک داده wgc
    همچنان 503)؛ خرید در افت در محدوده 4300-4340 در روزی با افزایش نفت. عامل ابطال:
    دو ماه متوالی فروش خالص بخش رسمی. 24 سپتامبر: گلدمن هدف پایان 2026 را به $4,650
    کاهش می‌دهد و $5,400 را برای 2027 حفظ می‌کند (investinglive ICYMI) - نهادهای سمت
    فروش رژیم کوتاه‌مدت نرخ‌های بهره را می‌پذیرند. آزمون دهم کف فعال است: 717f560c
    چهارشنبه را پشت سر گذاشت (ردیف 4325.5)؛ کف شبانه 4309.0 در 02:06Z، نه واحد بالاتر
    از خط، در جلسه‌ای که بازده اوراق 2 ساله ثابت بود - هیچ خرید در افتی مشهود نیست؛
    جهش بازگشتی به 4324 هم‌زمان با برنت -1% در پی گزارش نقشه راه رخ داد. SGE برابر
    با 936.61 (21 سپتامبر)؛ چین جمعه تعطیل است + هفته طلایی هفته آینده است، بنابراین
    امکان رصد بازار فیزیکی از دست می‌رود. 25 سپتامبر: آزمون دهم کف - ردیف پنجشنبه
    4309.5 (حفظ شد)، اما کف تیک در 15:35Z برابر با 4282.9 بود، در جلسه‌ای با افزایش
    نفت و ثبات بازده اوراق 2 ساله (زیر 4300 بر مبنای تیک، نه بر مبنای ردیف؛ به همین
    صورت ثبت شد). جهش بازگشتی از کف در پی گزارش توافق مرحله‌ای در 16:18Z (برنت -3)
    و طی شب با برنت -1% رخ داد - تقاضای خرید هنگام کاهش نفت؛ همچنان هیچ خرید در افتی
    دقیقاً روی خط در روزی با افزایش نفت دیده نشده است. نرخ تثبیت بعدازظهر XAU برابر
    با 4266.4، صبح 4255.55. آخرین جلسه 717f560c جمعه است. چین جمعه (جشن نیمه پاییز)
    و 1-8 اکتبر (هفته طلایی) تعطیل است: SGE تعطیل، امکان رصد بازار فیزیکی برای یک
    هفته از دست می‌رود - تقاضای خریدی کم‌عمق در زیر هر آزمون 4300.'
