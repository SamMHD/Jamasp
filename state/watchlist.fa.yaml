  why_fa: 'تنها مسیر صعود طلا در رژیم 15/60/25: یک رویداد نقدینگی که بخش کوتاه‌مدت
    منحنی بازده را پایین بکشد (سهام -2% همراه با افت هم‌زمان Nikkei و BTC، بازده اوراق
