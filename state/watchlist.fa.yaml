  why_fa: 'کف ساختاری تقاضا: ~289t تقاضای بخش رسمی در این چرخه، همراه با ازسرگیری
    ورود سرمایه به ETFها، و تنوع‌بخشی ذخایر با خروج از اوراق خزانه به‌عنوان همتای
    آن در سمت جریان سرمایه (دارایی‌های UST چین در پایین‌ترین سطح از 2008؛ UBS در 9
    سپتامبر دیدگاه بلندمدت خود را حفظ می‌کند؛ گلدمن در 18 سپتامبر، با وجود افزایش
    نرخ بهره، هدف $5,400 را حفظ می‌کند). واکنش انتقال محل نگهداری ذخایر در حال گسترش
    است (DNB، انتقال 86t به لندن و فرانسه؛ ونزوئلا در حال بررسی انتقال $4bn از لندن
    -> آمریکا). SGE برابر با 942/g (20 سپتامبر). در مقابل: روسیه فروشنده‌ای مستمر
    است؛ یک مؤسسه پژوهشی (investinglive، 23 سپتامبر) به‌دلیل دلار + فدرال رزرو انقباضی،
    انتظار افت بیشتر در Q4 را دارد، اما به‌واسطه ژئوپلیتیک و خرید بخش رسمی، «کفی محکم
    در حدود $3,800» می‌بیند. کف در عمل: 4300 برای GC (~4265 نقدی) - آزمون‌ها در 14
    سپتامبر 4305.9، در 15 سپتامبر 4304.0، در 16 سپتامبر تیک 4296.7 در 22:19Z، سپس
    بازگشت تا 4424.9 در جمعه 18 سپتامبر؛ کف 4335.0 در 22 سپتامبر در برابر «نابودی
    یا توافق» ترامپ + بازگشت برنت به 100 حفظ شد، سپس ردیف 4402.2. d571e0f0 در 23 سپتامبر
    محقق شد - کف‌ها در این رژیم 9/9، همگی با 0.55 ثبت شده‌اند (شکاف کالیبراسیون، منطق
    فاصله در قاعده 20)، و تک‌تک بازگشت‌ها با پایین آمدن نفت از اوج‌هایش یا جلسه‌ای
    با کاهش بازده‌ها همراه بودند؛ هنوز هیچ خریدی در افت قیمت دقیقاً روی این خط در
    روزی با افزایش نفت رخ نداده است. آزمون دهم فعال است: 717f560c (هیچ ردیف GC_CLOSE
    با مقدار <=4300.0 از چهارشنبه 23 تا جمعه 25 سپتامبر وجود نداشته باشد، 0.55؛ 73
    پوینت زیر قیمت نقدی، 0.43x دامنه 3 جلسه). تأییدکننده‌ها: گزارش‌های ماهانه WGC
    حاکی از خرید خالص در طول افت باشند (فید wgc همچنان 503)؛ خرید در افت قیمت در محدوده
    4300-4340 در روزی با افزایش نفت. باطل‌کننده‌ها: 2 ماه متوالی فروش خالص بخش رسمی.
    24 سپتامبر: گلدمن هدف پایان 2026 را به $4,650 کاهش می‌دهد و $5,400 را برای 2027
    حفظ می‌کند (investinglive ICYMI) - مؤسسات سمت فروش رژیم کوتاه‌مدت نرخ‌های بهره
    را می‌پذیرند. آزمون دهم کف فعال است: 717f560c چهارشنبه دوام آورد (ردیف 4325.5)؛
    کف شبانه 4309.0 در 02:06Z، 9 پوینت فاصله از خط، در جلسه‌ای با بازده 2 ساله بدون
    تغییر - خریدی در افت قیمت دیده نمی‌شود؛ بازگشت به 4324 با برنت -1% در پی گزارش
    نقشه راه همراه شد. SGE برابر با 936.61 (21 سپتامبر)؛ چین جمعه تعطیل است + هفته
    طلایی هفته آینده، بنابراین امکان رصد بازار فیزیکی قطع می‌شود. 25 سپتامبر: آزمون
    دهم کف - ردیف پنجشنبه 4309.5 (دوام آورد)، اما کف تیک در 15:35Z برابر با 4282.9
    بود، در جلسه‌ای با افزایش نفت و بازده 2 ساله بدون تغییر (بر مبنای تیک زیر 4300،
    نه بر مبنای ردیف؛ با همین تمایز ثبت شده است). بازگشت از کف با گزارش توافق مرحله‌ای
    در 16:18Z (برنت -3) و طی شب با برنت -1% رخ داد - تقاضای خرید همراه با کاهش نفت،
    همچنان هیچ خریدی در افت قیمت دقیقاً روی خط در روزی با افزایش نفت رخ نداده است.
    نرخ تثبیت عصر XAU برابر با 4266.4، صبح 4255.55. آخرین جلسه 717f560c جمعه است.
    چین جمعه (جشن نیمه پاییز) و 1-8 اکتبر (هفته طلایی) تعطیل است: SGE خاموش، امکان
    رصد بازار فیزیکی برای یک هفته از بین می‌رود - تقاضای خرید کم‌عمق زیر هر آزمون
    4300. 26 سپتامبر: 717f560c محقق شد - کف‌ها در این رژیم 10/10، همگی در 0.55 (ردیف‌های
    4325.5 / 4309.5 / 4321.2؛ کف تیک پنجشنبه در 4282.9 طی جلسه‌ای با افزایش نفت از
    خط عبور کرد، اما ردیف عبور نکرد). این هفته هیچ ادعای فعالی درباره کف وجود ندارد
    (قاعده 20: سطح 4300 از ردیف 21 پوینت / 0.15x دامنه 2 جلسه فاصله دارد). نرخ تثبیت
    عصر XAU در جمعه 4261.05، صبح 4290.75. چین از پنجشنبه در 1-8 اکتبر (هفته طلایی)
    تعطیل است: SGE خاموش، تقاضای خرید فیزیکی زیر 4300 برای یک هفته کم‌عمق است. همچنان
    هیچ خریدی در افت قیمت دقیقاً روی خط در روزی با افزایش نفت رخ نداده است؛ بازگشت
    جمعه بخشی از حرکت کاهش نفت / کاهش بازده 2 ساله بود. گزارش کوتاه 3 اکتبر: خالص
    موقعیت‌های سفته‌بازی 210.2K (29 سپتامبر)، -7.5K / -3.5% نسبت به هفته قبل - موقعیت‌های
    کاغذی پیش از انتشار داده کاهش یافتند؛ ردیف 4162.3، به‌اندازه 25-28 پوینت بالاتر
    از خوشه BB/Fib در (4134-4137)، با استوکاستیک 13؛ SGE تا 8 اکتبر خاموش است (امکان
    رصد بازار فیزیکی وجود ندارد). WGC (پنجشنبه): صندوق‌های بازنشستگی در NL/US/UK/AU
    از 2020-21 در پی گسست همبستگی اوراق قرضه و سهام، 2-5% طلا نگهداری می‌کنند - ساختاری
    است، نه ناشی از معاملات جاری بازار. هیچ ادعایی درباره کف وجود ندارد (در فاصله
    کمتر از 1 ATR، هفته طلایی). گزارش کوتاه 5 اکتبر: دویچه (غالی، BNN، 2 اکتبر؛ یادداشت
    30 سپتامبر): خرید بخش رسمی بیش از 2 برابر آهنگ 2021-22، مشارکت نهادی +70% از 2021؛
    موقعیت‌های خالص فروش CTA در بزرگ‌ترین سطح از اکتبر 2021، موقعیت‌های خرید مبتنی
    بر صلاحدید -55% از ژوئن - «بیش‌فروش‌شده و با مالکیت کمتر از حد»، «در سورنتو بخرید»
    (کنفرانس LBMA این هفته)، اما ابتدا احتمال ریزش تند در هفته طلایی وجود دارد. اختلاف
    در سمت فروش: BofA «نفت بزرگ‌ترین دشمن طلاست، ریسک <4000» در مقابل مورگان استنلی
    «4000 کفی قوی است». از خود LBMA در لندن شکایت شده است (محاکمه چهارشنبه 7 اکتبر؛
    ذخایر GBP1.4m در برابر هزینه‌های ~GBP3m؛ فهرست Good Delivery در معرض خطر) - نشانه‌ای
    ساختاری، بدون اثر قیمتی. تولیدکنندگان آسیایی در داخل انبار می‌کنند (پالایش در
    لائوس، مالیات 15% اندونزی). 50 شرکت معدنی برتر -$264bn (mining.com). SGE تا پنجشنبه
    تعطیل؛ در فاصله کمتر از 1 ATR هیچ ادعایی درباره کف وجود ندارد. 7 اکتبر: وزارت
    دارایی روسیه از 7 اکتبر تا 6 نوامبر ~280bn روبل طلا + ارز خارجی می‌خرد (5x رقم
    56bn سپتامبر؛ قاعده مالی با برنت بالاتر از $59؛ تفکیک اعلام نشده) - تقاضای خرید
    رسمی وابسته به نفت که با افت نفت خام کوچک‌تر می‌شود. ناگل (بوندس‌بانک/ECB، 5 اکتبر):
    دلایل ادامه خرید طلا توسط بانک‌های مرکزی «همچنان قوی است». موجودی SPDR در طول
    افت، در حدود ~34 Moz و نزدیک به اوج چندماهه است (investinglive، 6 اکتبر) - فشار
    از سمت نرخ‌های بهره است، نه خروج از ETF. فروش سپتامبر ضرابخانه پرث هم‌زمان با
    افت قیمت‌ها تقریباً 2 برابر شد و به اوج 7 ماهه رسید. دعوت‌نامه وبینار روندهای
    تقاضای Q3 سازمان WGC منتشر شد (6 اکتبر). SGE پنجشنبه 8 اکتبر بازگشایی می‌شود.
    8 اکتبر: PBOC در سپتامبر برای 23مین ماه متوالی خرید کرد - 77.47 Moz در برابر 76.73
    (+0.74 Moz، حدود 23t، بزرگ‌ترین افزایش ماهانه این دوره؛ fxempire بر اساس داده‌های
    SAFE). WGC: خریدهای بخش رسمی در اوت 39t (+70% نسبت به ماه قبل، 2 برابر سال قبل؛
    چین، لهستان و ازبکستان پیشتاز بودند)، از ابتدای سال 170t. ETFها: $10bn در سپتامبر،
    رکورد $31bn در Q3، موجودی با +67t به رکورد 4,256t رسید، در حالی که قیمت 8.5% افت
    کرد - افت ناشی از قراردادهای آتی بود (معادل -84t در موقعیت‌های پول مدیریت‌شده،
    -156t در اسپردها؛ BMO/WGC)، نه خروج سرمایه‌گذاران؛ صندوق‌های پذیرفته‌شده در بورس
    بریتانیا در Q3 معادل $7.5bn، هم‌راستا با صرف سررسید اوراق دولتی بریتانیا (پوشش
    ریسک مالی دولت در ETFها برقرار است). هند برای نخستین بار از زمان افزایش عوارض
    در مه، با صرف نسبت به لندن معامله می‌شود؛ صرف‌های چین «مناسب» است (BMO)، صرف شانگهای
    پیش از هفته طلایی در اوج 3 ماهه بود؛ SGE پنجشنبه در 01:30Z بازگشایی شد - صرف در
    03:31Z هنوز رصد نشده بود (هنوز منبعی وجود ندارد؛ فید SGE_AU_CNY_G از 28 سپتامبر
    به‌روز نشده است). DNB مقدار 86t را به نزدیک‌ترِ کشور خود منتقل کرد (واکنش انتقال
    محل نگهداری ذخایر). کف تقاضا زیر 4100 پابرجاست؛ فروشنده، میز معاملات کاغذی است.'
