- theme: us-fiscal-dominance
  why_fa: 'بازخریدهای گسترش‌یافتهٔ اوراق بلندمدت خزانه‌داری (19 اوت) عملاً کنترل منحنی
    بازده هستند و بازار آن‌ها را به‌منزلهٔ تضعیف ارزش پول تعبیر کرد - رژیم روند طلا
    زمانی آغاز شد که بدهی آمریکا از $40tn گذشت. این ابزار در 9-10 سپتامبر در برابر
    دید همگان شکست خورد (حراج اوراق 30ساله در 5.308 «ضعیف» بود). FOMC: منحنی مسطح‌تر،
    دلار صعودی - این الگوی موردنظر نیست. 17 سپتامبر: بازده اوراق 10ساله -9bp، طلا
    صعودی (بسته‌شدن موقعیت‌ها). 18 سپتامبر: «اوراق قرضه دوباره سقوط می‌کنند» - بازده
    اوراق 10ساله 5.00، 30ساله 5.328 (بالاترین سطح 5.344)، 2ساله 4.756 - و طلا با وجود
    ثبات دلار و رشد +6% در BTC افزایش یافت. بررسی در سطح هفته (actionforex، 19 سپتامبر):
    طی هفتهٔ FOMC، بازده اوراق 30ساله 2.9bp کاهش یافت، درحالی‌که بازده اوراق 2ساله
    12.6 افزایش یافت - مسطح‌شدن نزولی منحنی به رهبری بازقیمت‌گذاری سیاست پولی، که
    صراحتاً «الگوی شوک به اعتبار مالی دولت یا ریسک دیرش نیست». بنابراین، این الگو
    مشاهده‌ای مربوط به یک جلسهٔ معاملاتی (جمعه) در دل هفته‌ای با مسطح‌شدن منحنی است؛
    این سناریو مستلزم آن است که سررسیدهای بلندمدت پیشرو باشند، نه دنباله‌رو. 52db03df
    محقق شد (بدون افزایش اندازهٔ موقعیت تا 18 سپتامبر). باز: aec5cc8b (عدم ثبت بازده
    پایانی اوراق 30ساله >=5.40 از جمعه تا سه‌شنبه، 0.55 - حاشیهٔ 7bp). زیر نظر داشته
    باشید: حراج‌های اوراق 2ساله/5ساله/7ساله در این هفته (تأییدنشده، todo-185)، TLT،
    هرگونه اظهارنظر بسنت، و اینکه آیا بازده اوراق 30ساله در روز دوشنبه هم‌جهت با طلا
    حرکت می‌کند.'
