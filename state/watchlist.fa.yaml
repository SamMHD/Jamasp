    مخابراتیِ بازنشرشده یا برآورد آنی مسکن وجود ندارد - 62c34dbd (هسته <=0.3) بر مبانی
    خود پابرجاست، تأییدنشده. شاخص قیمت مصرف‌کننده (CPI) استرالیا 4.0% بر اثر سوخت
    (میانگین پیراسته 0.2)، همان انتقال اثر در خارج است؛ RBA برابر با 4.60، Westpac
    نوامبر را پیش‌بینی می‌کند. PCE امروز: اجماع 0.4/3.7، هسته 0.3/3.4، بازنگری‌های
    BEA در همان انتشار. برنت نوامبر چهارشنبه منقضی شد - ادعاهای تسویه، قرارداد دسامبر
    را مشخص می‌کنند (قاعده 17). گزارش کوتاه 2 اکتبر: کانال نزولی نفت برای بخش فرآورده‌ها
    - آمریکا تهدید به ممنوعیت صادرات گازوئیل می‌کند، مگر اینکه اروپا «فوراً» ~120
    میلیون بشکه آزاد کند؛ رایت «بسیار مطمئن» است که اروپا آزادسازی می‌کند؛ حاشیه سود
    گازوئیل اتحادیه اروپا با این اظهارات -7%؛ توقف صادرات سوخت چین در پس‌زمینه. نفت
    خام بی‌تأثیر ماند (برنت دسامبر 102.31، پنجشنبه +4% بر اثر موضع‌گیری). میانگین
    سوخت سپتامبر تثبیت شده -> 4dfbd1d8 (رقم کل شاخص قیمت مصرف‌کننده (CPI) سپتامبر
    >=0.4) بی‌تأثیر؛ رقم اکتبر است که آزادسازی بر آن اثر می‌گذارد. قیمت‌های پرداخت‌شده
    ISM برابر با 77.9 (فولاد، آلومینیوم، نفت، تعرفه‌ها) = بخش هزینه نهاده‌ها همچنان
    صعودی است. گزارش کوتاه 4 اکتبر: بررسی میان‌دوره‌ای طبق قاعده 11 برای دو ادعای
    شاخص قیمت مصرف‌کننده (CPI)، بر اساس برآورد آنی فدرال رزرو کلیولند (متن‌های استخراج‌شده
    از صفحه؛ 2 اکتبر): رقم کل سپتامبر 0.53، هسته 0.20، سال‌به‌سال 3.60/2.39؛ اکتبر
    تا اینجا 0.22/0.20. اجماع TE برای انتشار 14 اکتبر: رقم کل 0.5 (سال‌به‌سال 3.7)،
    هسته 0.3 (2.5). 4dfbd1d8 (رقم کل >=0.4) اجماع و برآورد آنی را در حمایت از خود
