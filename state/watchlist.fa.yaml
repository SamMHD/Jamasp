    این خانواده، در نخستین آخر هفته‌ای که ورودی نظامی آن در بازه فاقد پوشش قرار گرفت.
    گزارش کوتاه 30 سپتامبر: 9083e952 محقق شد - مهلت رضایی بدون اقدام و بدون متن سپری
    شد. اکسیوس به‌نقل از investinglive (سه‌شنبه 22:40Z): میانجی‌گری قطر با «پیشرفت
    اندک»، مصالحه دوصفحه‌ای (رفع محاصره در برابر موضوع هسته‌ای)، الثوادی با عراقچی
    (نیویورک) و سپس کوشنر/ونس (واشنگتن) دیدار کرد، ترامپ «هیچ پیشنهادی نداد»، ایران:
    امتیازدهی فقط پس از بازگشت آمریکا به تفاهم‌نامه ژوئن، مقامات آمریکایی: نبرد عمده
    ممکن است پس از انتخابات میان‌دوره‌ای (3 نوامبر) از سر گرفته شود، قطر سرخورده،
    دور جدیدی در کار نیست. برنت بر اثر عرضه در 102.59 (-2.55%) تسویه شد - عرضه ذخایر
    راهبردی نفت تا 40M بشکه (عرضه ژوئن حدود 500K جذب کرد)، بارگیری‌های ینبع از سر
    گرفته شد، کپلر: حدود 16 mb/d صادرات خاورمیانه (بالاترین سطح دوران جنگ)، گلدمن:
    صادرات خلیج فارس در سطح میانگین 2025، عربستان بالاتر، صادرات دریایی ایران صفر؛
    برنت همچنان +10% نسبت به ماه قبل؛ OPEC+ یکشنبه جلسه برگزار می‌کند؛ سررسید نوامبر
    چهارشنبه منقضی می‌شود (دسامبر قرارداد سررسید نزدیک است). احیای جریان فیزیکی عرضه،
    موضع تهران و همراه با آن شاخه توافق را تضعیف می‌کند. فعال: 603c3c19 (تا یکشنبه)،
    483bea33، d9142975؛ a0c82077 چهارشنبه 23:59Z بسته می‌شود و در مسیر تحقق است (Al
    Funtas = رده کشتی)؛ جانشین 440d34a8 (نبود اقدام در رده‌ای جدید از پنجشنبه 1 تا
    چهارشنبه 7 اکتبر، 0.7).'
