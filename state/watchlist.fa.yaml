  why_fa: 'پل میان جنگ و فدرال رزرو: انتقال نفت به شاخص قیمت مصرف‌کننده (CPI)، کانال
    فعال احتمال افزایش نرخ بهره است و نفت در روزهای بدون رویداد فدرال رزرو، تعیین‌کننده
    قیمت طلاست - در هر دو جهت. قیمت‌های تسویه 15 سپتامبر: WTI برابر با 105.83 / Brent
    برابر با 108.75 (سقف 109.97)؛ از آن زمان پنج تسویه پایین‌تر: 21 سپتامبر Brent
    برابر با 100.34، 22 سپتامبر BRENT برابر با 99.25 (نخستین تسویه زیر 100 در دو هفته؛
    98.78 در ساعت 03:30Z چهارشنبه)، WTI نوامبر ~89-90.5 (قرارداد اکتبر در 22 سپتامبر
    منقضی شد) - در پی راه‌اندازی مجدد خط لوله شرق-غرب عربستان (جزئی، تغییر مسیر تا
    4 میلیون بشکه در روز)، ازسرگیری صادرات ینبع، بارگیری ~12 میلیون بشکه در یک روز
    (Gulf News)، رفت‌وآمدهای شاتلی هرمز/جریان‌های دارای AIS خاموش، دور مذاکرات آمریکا-ایران
    که هر دو طرف تأیید کرده‌اند، و خبر افزایش موجودی API در برابر انتظار کاهش موجودی.
    تنگنای عرضه در فرآورده‌هاست: گازوئیل در سطوح رکورد، سوخت جت در تعقیب آن (MarketWatch)،
    ترامپ از ممنوعیت صادرات گازوئیل حمایت می‌کند و می‌گوید تصمیم «سریع» گرفته می‌شود
    (تحلیلگران: زیان می‌رساند، نه کمک). سطوح fxempire: حمایت Brent در 97-97.5 و سپس
    میانگین متحرک 50 دوره‌ای در 92.44، مقاومت 102/105؛ حمایت WTI در 90.47 و سپس 87.7.
    آزمون این موضع: Brent <100 همراه با بازده 2 ساله >=4.70 = تأیید عدم تقارن، امتیاز
    دیدگاه نزولی ناشی از نرخ‌های بهره در 50 حفظ می‌شود - در 22 سپتامبر ثبت شد (Brent
    برابر با 99.25، حراج 2 ساله 4.787، منحنی رو به بالا)؛ Brent <100 و بازده 2 ساله
    <4.70 = از دست رفتن عامل ورودی (امتیاز دیدگاه نزولی ناشی از نرخ‌های بهره 45) هنوز
    ثبت نشده است. انتقال اثر، طبق اظهارات ثبت‌شده، یک‌طرفه است (اشمید، کشکاری، موسالم،
    بارکین «شوک‌های پایدارِ جای‌گرفته در قیمت‌گذاری»، برآورد وارش برای PCE برابر با
    ~3.6)؛ در خارج نیز همین‌طور: ناگل از ECB «نفت اکنون یک سنجه کلیدی تورم است، موضع
    اندکی محدودکننده منتفی نیست»، لین «شوک انرژی طولانی‌تر می‌شود، تورم تا میانه 2027
    بالا می‌ماند»؛ PMI مقدماتی استرالیا 50.8 و هزینه نهاده‌ها در بالاترین سطح 3 ماهه.
    زنجیره تأمین: خط شرق-غرب به‌صورت جزئی، ینبع در حال ازسرگیری، ایران صفر (CENTCOM)؛
    ممنوعیت صادرات گازوئیل روسیه تمدید شد؛ BofA پیش‌بینی Brent خود برای نیمه دوم سال
    را افزایش داد (Investing.com، خوانده‌نشده). ادعاها: 4dfbd1d8 (شاخص کل سپتامبر
    >=0.4، 0.65)؛ 62c34dbd (هسته <=0.3، 0.7)؛ بررسی میان‌دوره‌ای طبق قاعده-11 در 30
    سپتامبر؛ f7a0c23d (هیچ تسویه Brent برابر یا بالاتر از 103 از چهارشنبه تا جمعه،
    0.55)؛ 8e425cab با نخستین تسویه صعودی نفت اجرا می‌شود. 24 سپتامبر: Brent با وجود
    افزایش 3 میلیون بشکه‌ای موجودی نفت خام (موجودی بنزین و فرآورده‌های تقطیری کاهش
    یافت)، راه‌اندازی مجدد خط شرق-غرب و صادرات عراق >3 میلیون بشکه در روز، در 103.08
    (+3.9%) تسویه شد - صرف قیمت بر مبنای اظهارات درباره هرمز بازقیمت‌گذاری می‌شود،
    نه بشکه‌ها؛ 102.10 در ساعت 03:30Z. فرآورده‌ها: کاخ سفید با وجود مخالفت کابینه
    «به» ممنوعیت 90 روزه صادرات گازوئیل «نزدیک‌تر می‌شود» (تکذیب قبلی کاخ سفید؛ گازوئیل
    پس از نوسان رفت‌وبرگشتی شدید، اندکی پایین‌تر تسویه شد)؛ سناتورهای هر دو حزب خواستار
    آزادسازی اضطراری نفت گرمایشی هستند؛ قیمت رکوردی گازوئیل در حال انتقال به قیمت
    مواد غذایی است (MarketWatch). ممنوعیت، جزء انرژی شاخص قیمت مصرف‌کننده (CPI) آمریکا
    را اندکی تعدیل می‌کند، در حالی که عرضه جهانی را محدودتر می‌کند - ادعاهای سپتامبر
    (4dfbd1d8 / 62c34dbd) این اثر را در بر دارند، بررسی میان‌دوره‌ای 30 سپتامبر. واردات
    نفت آسیا همچنان 13% پایین‌تر از پیش از جنگ است (Gulf News). آزمون عدم تقارن همچنان
    برقرار است: Brent <100 همراه با بازده 2 ساله >=4.70 در 22 سپتامبر تأیید شد؛ بازده
    2 ساله حرکت صعودی نفت را هم دنبال نکرد - پیشتاز بود (PMI). 25 سپتامبر: Brent در
    106.60 تسویه شد (+3.4%، بالاترین قیمت پایانی از 15 سپتامبر؛ +5% در اوج‌ها)، WTI
    برابر با 94.61 (روند نزولی شش جلسه‌ای متوقف شد)، در پی موشک‌های حوثی‌ها به ینبع/طائف؛
    سپس در معاملات شبانه با گزارش توافق مرحله‌ای -1% (105.55 در ساعت 03:31Z). ینبع
    مسیر جایگزین شرق-غرب است: investinglive می‌گوید بارگیری نفتکش‌ها در آنجا «هنوز
    از سر گرفته نشده است»، در برابر گزارش 24 سپتامبر Gulf News مبنی بر «12 میلیون
    بشکه در یک روز» - تناقض، شنبه از طریق gcaptain حل شود. فرآورده‌ها: رایت در حال
    نظرخواهی از پالایشگران درباره محدودیت‌های داوطلبانه صادرات گازوئیل است (گزارش
    ممنوعیت 90 روزه را رد می‌کند)؛ اتحادیه اروپا هشدار می‌دهد ممنوعیت به هر دو طرف
    آسیب می‌زند. آرامکو در حال بررسی مسیرهای صادراتی 4 و 5 است. بررسی میان‌دوره‌ای
    30 سپتامبر (4dfbd1d8 / 62c34dbd). تاریخ PCE اوت تا 26 سپتامبر در جریان اطلاعات
    نیست (برآورد وارش ~3.6% نسبت به سال قبل) - شنبه راستی‌آزمایی شود. 26 سپتامبر:
    Brent در 104.32 تسویه شد (-2.1%، -$3 از اوج‌ها؛ +5.1% نسبت به هفته قبل از 99.25)،
    WTI برابر با 92.44 (-2.3%)، در پی برنامه هفت‌روزه عراقچی؛ سررسیدهای کوتاه‌مدت
    همراه شدند (-3.5 واحد پایه) - به kinetic-transmission-inverted مراجعه کنید. تاریخ
    PCE تأیید شد: چهارشنبه 30 سپتامبر 12:30Z (تقویم actionforex + چشم‌انداز هفته آینده
    Wells Fargo) - اجماع شاخص کل 0.4 ماه‌به‌ماه / 3.7% سال‌به‌سال، هسته 0.3 / 3.4%؛
    بازنگری‌های سالانه BEA در همان انتشار («روند کوتاه‌مدت ملایم‌تر، رقم اوت داغ‌تر»)؛
    بیدارباش #62 برای زمان انتشار+45 (13:15Z) ثبت شد - ادعای b934960e را ارزیابی می‌کند
    (بدون مخابره <55%) و بررسی میان‌دوره‌ای قاعده-11 را برای 4dfbd1d8 / 62c34dbd اجرا
    می‌کند (میانگین Brent در سپتامبر ~103-104 بوده است، در برابر ~90 در اوت: ادعای
    شاخص کل >=0.4 در مسیر تحقق است؛ هسته <=0.3 به مسکن/سفر وابسته است). ISM پنجشنبه
    14:00Z، اجماع قیمت‌های پرداخت‌شده 72 (از 71.1). تناقض بارگیری ینبع حل‌نشده است
    (جست‌وجوی gcaptain: هیچ مطلبی با تاریخ پس از 3 اوت نیست؛ گزارش 24 سپتامبر Gulf
    News با عنوان «جهش هفت‌برابری، AIS خاموش» تنها خبر تاریخ‌دار باقی می‌ماند). Kpler:
    جریان نفت خام هرمز این هفته 33.7 میلیون بشکه در برابر 49.2 میلیون در هفته گذشته
