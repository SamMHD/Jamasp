    دو طرف از جمعه تا سه‌شنبه، 0.7). نشانه‌ها: پاسخ علنی و قابل استناد آمریکا به مهلت؛
    «گام بعدی» شورای عالی امنیت ملی؛ گزارش خسارت SPA در ینبع؛ اعلام میزبان با محل+تاریخ.
    26 سپتامبر: پیشنهاد. عراقچی (سازمان ملل، جمعه): یک «طرح مشخص هفت‌روزه» از طریق
    قطر منتقل شد - بازگشایی ظرف هفت روز پس از تحقق شروط (رفع محاصره + تحریم کشتیرانی،
    معافیت از تحریم‌های نفتی، آتش‌بس در سراسر منطقه از جمله لبنان، >=$12bn دارایی
    مسدودشده)؛ «اکنون انتخاب با ایالات متحده است». گلف نیوز: «ظرف چند ساعت، گزارش‌ها
    حاکی از آن بود» که ترامپ آن را رد کرده است - هیچ منبعی نام برده نشده، هیچ موضع
    علنی و قابل استنادی از آمریکا وجود ندارد (ماریتایم اگزکیوتیو/ رویترز: کاخ سفید
    پاسخ فوری نداد؛ AP: مقام‌های سعودی «بدبین» هستند). دومین مقام ارشد ایرانی (رویترز):
    حتی در صورت پذیرش، هیچ انعطافی در موضوع هسته‌ای وجود نخواهد داشت. فارس: گزارش
