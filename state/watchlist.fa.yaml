- theme: us-fiscal-dominance
  why_fa: 'بازخریدهای گسترش‌یافتهٔ اوراق بلندمدت خزانه‌داری (19 اوت) عملاً کنترل منحنی
    بازده هستند و بازار آن‌ها را به‌منزلهٔ کاهش ارزش پول تعبیر کرد - رژیم روند طلا
    زمانی آغاز شد که بدهی آمریکا از $40tn گذشت. این ابزار در 9-10 سپتامبر آشکارا شکست
    خورد (حراج اوراق 30ساله در 5.308 «ضعیف» بود). هفتهٔ FOMC: منحنی مسطح‌تر، دلار
    صعودی - این الگوی مورد انتظار نیست. 18 سپتامبر: «اوراق قرضه دوباره سقوط می‌کنند»
    - 10ساله 5.00، 30ساله 5.328 - و طلا با وجود ثبات دلار صعود کرد: یک جلسهٔ معاملاتی.
    21 سپتامبر: بخش بلندمدت منحنی صعود کرد (بازده 10ساله با افت 4.5 واحد پایه به 4.951،
    بازده 30ساله با افت 4.7 واحد پایه به 5.280 رسید؛ 5ساله -2.5) در پی افت -3.7% نفت،
    در حالی که بازده 2ساله 0.75 واحد پایه افزایش یافت - مسطح‌شدن منحنی با کاهش بازده‌ها
    از سمت بخش بلندمدت - و طلا افت کرد: بخش بلندمدت در هیچ‌یک از دو جهت پیشرو طلا
    نیست؛ صندوق USD 5bn بازسازی خلیج فارس که WSJ گزارش کرده، از نظر مالی ناچیز است.
    52db03df محقق شد (بدون افزایش حجم تا 18 سپتامبر). باز: aec5cc8b (بدون بسته‌شدن
    بازده 30ساله در سطح >=5.40 از جمعه تا سه‌شنبه، 0.55) - با یک جلسهٔ معاملاتی باقی‌مانده،
    12 واحد پایه فاصله وجود دارد، در مسیر تحقق. زیر نظر داشته باشید: حراج‌های اوراق
    2ساله/5ساله/7ساله در این هفته (تأییدنشده، todo-185 - تا 22 سپتامبر هیچ گزارش بازنشرشده‌ای
    در پایگاه داده نیست)، هرگونه اظهارنظر بسنت دربارهٔ انتشار اوراق (حضور او در CNBC
    در 21 سپتامبر صرفاً دربارهٔ ایران/چین بود)، اینکه آیا بازده 30ساله در هیچ جلسهٔ
    معاملاتی هم‌جهت با طلا حرکت می‌کند یا نه.'
