  why_fa: 'دو وضعیت: کنترل سپاه پاسداران بر عبور از هرمز در برابر محاصره آمریکا، همراه
    با تبادل آشکار آتش از 30-31 اوت، و جبهه دوم دریای سرخ که در 19 سپتامبر به ریاض
    رسید (موشک حوثی‌ها، رهگیری شد). 22 سپتامبر - مسیر مذاکرات باز شد: هیئت عراقچی
    و ویتکاف/ کوشنر یک دور مذاکره با میانجیگری در سازمان ملل را به پایان رساندند (رفت‌وآمد
    قطر و پاکستان)؛ ترامپ: ~3 ساعت، «سازنده»، دور دیگری «به‌زودی»، اما توافق «درست
    پس از انتخابات» و «نابود کردن» به‌عنوان گزینه جایگزین؛ ویتکاف (X): غیرمستقیم،
    یک دور تکمیل شد، میانجیگری ادامه دارد؛ تلویزیون دولتی ایران: تهران درخواست ویتکاف
    را پذیرفت، «شرایط سخت‌گیرانه» منتقل شد؛ NYT (2 مقام ایرانی): عراقچی با ویتکاف+کوشنر
    دیدار کرد؛ شبکه 12 اسرائیل: درباره بیشتر اختلاف‌ها توافقی حاصل نشد؛ منبع العربیه:
    «بن‌بست شکسته شد». شرایط ایران (تسنیم): پایان جنگ در همه جبهه‌ها، جدول زمانی خروج
    از جنوب لبنان، وجوه مسدودشده، رفع محاصره و تحریم‌های جدید، معافیت نفتی - همان
    تفاهم‌نامه قدیمی. فارس: آمریکا «هیچ خط قرمزی باقی نگذاشته»، آماده همه سناریوها
    هستیم. پیش‌تر در سه‌شنبه، گزارش کیودو درباره «بازگشایی هرمز ظرف 7 روز» توسط فارس
    تکذیب شد. 645cc78a ناموفق (نخستین شکست برای این خانواده؛ درس مربوط به قید قالب
    ثبت شد). هرمز: آخرین اصابت‌ها دوشنبه 21 سپتامبر (LR Stephanie، جزیره من؛ یک کشتی
    حامل LPG) - هیچ‌کدام مرتبط با عربستان نبودند؛ هیچ شناور جدیدی در 22-23 سپتامبر
    نبود (جست‌وجو شد)؛ شمار عبورهای هرمز بر پایه AIS «دو» (Investing.com، 22 سپتامبر)
    در برابر بارگیری ~12m بشکه توسط عربستان در یک روز و راه‌اندازی دوباره خط شرق-غرب
    (جزئی) - جریان‌ها به خارج از AIS و مسیرهای دورزننده تنگه منتقل شدند. پادشاه عربستان
    در مجمع عمومی سازمان ملل «هدف قرار دادن مکه» توسط حوثی‌ها را محکوم کرد (همان پهپاد
    قبلی، رویداد جدیدی نبود)؛ فرانسه قطعنامه شورای امنیت درباره هرمز را بررسی می‌کند؛
    اتحادیه اروپا به‌دنبال تجهیزات و نیرو برای دریای سرخ است؛ بریتانیا پیشنهاد سوخت‌رسانی
    به عربستان می‌دهد. تا 23 سپتامبر 03:30Z هیچ گزارشی از گفت‌وگوی ترامپ و شورای همکاری
    خلیج فارس در پایگاه داده نبود (جست‌وجو شد، موجود نبود). نردبان: زیرساخت خارک/لارک
    d96debd5 (تا 26 سپتامبر)؛ ترتیبات سمت خلیج فارس 2df323fa (تا 26 سپتامبر)؛ خویشتن‌داری
    عربستان 33defb45 (تا 27 سپتامبر)؛ اسکورت‌ها d4f5ffd6 (تا 27 سپتامبر)؛ شناور سعودی
    9e629d6e (چهارشنبه 23:59Z بسته می‌شود، در مسیر تحقق)؛ 0d52e7da (هیچ دیدار ترامپ-پزشکیان
    یا دور دوم مستقیم از چهارشنبه تا یکشنبه با تأیید هر دو طرف، 0.65) - به‌محض اذعان
    هر دو طرف به دور دوم، در مسیر عدم تحقق قرار می‌گیرد. نشانه‌ها: اظهارنظر میزبان
    قطری/پاکستانی با مکان+تاریخ (-> فعال‌سازی بررسی عمیق)؛ دیدار ترامپ-پزشکیان با
    تأیید هر دو طرف؛ هرگونه دستور حمله آمریکا؛ گزارش‌های خسارت SPA؛ متوقف شدن یک شناور
    اسکورت‌شده همراه با تلفات (پله بعدی نردبان). 24 سپتامبر: چهارشنبه - دور دومی نبود؛
    مقام ارشد (رویترز): اگر آمریکا فشار را کاهش دهد و محاصره بنادر را بردارد، هرمز
    ممکن است ظرف یک هفته بازگشایی شود، «اختلاف‌های بسیار»؛ رضایی: تا برآورده شدن شرایط
    بسته می‌ماند؛ برنت در 103.08 (+3.9%) تسویه شد. شبانه: نقشه راه ایران (گلف نیوز،
    منابع منطقه‌ای، تأییدنشده از سوی هر دو دولت) - آتش‌بس تا 60 روز در سراسر منطقه،
    بازگشایی مرحله‌ای هرمز، توقف حملات به همسایگان عرب، جدول زمانی مذاکرات گسترده‌تر؛
    روبیو «پذیرا»، گزینه‌های نظامی حفظ می‌شوند. تسنیم (مرتبط با سپاه): تماس عراقچی-ویتکاف
    از سوی نهادهای سیاست‌گذار «مجاز نشده بود»؛ وزارت خارجه: با میانجیگری قطر، شرایط
    منتقل شد - اختیار طرف ایرانی اکنون شرط عبور است. Cape Dao (23 سپتامبر): فله‌بر
    بدون اسکورت با مدیریت اماراتی، یک دریانورد هندی کشته شد، به آمریکا نسبت داده نشده
    است (dd31b40f تا جمعه فعال). 9e629d6e محقق شد (خانواده 10/10؛ جانشینی برای شناور
    سعودی نوشته نشد - بارگیری ینبع بدون پاسخ دریایی از سر گرفته شد، این رده بر اساس
    اطلاعات ثبت‌شده پابرجاست). مورد جدید ed8c08b5 (هیچ اعلام علنی آتش‌بس از سوی آمریکا
    از پنج‌شنبه تا یکشنبه، 0.7). محاصره: 115 کشتی مرتبط با ایران تغییر مسیر داده شدند
    (گلف نیوز). فرمانده ارشد سپاه در درگیری‌های جنوب شرق ایران کشته شد (داخلی، نه
    آمریکا). 25 سپتامبر: شمارش معکوس. رضایی (دبیر شورای عالی امنیت ملی، به نقل از
    گاردین/پرس تی‌وی، گلف نیوز 00:36Z): واشنگتن «چهار یا پنج روز» فرصت دارد شرایط
    ایران را «کامل و یک‌باره» اجرا کند - تا آمریکا اقدام نکند، نه بازگشایی هرمز و
    نه مذاکره؛ «حرف کافی است. حالا باید عمل کنیم»؛ «گام بعدی» پس از مهلت تعیین می‌شود
    (حدود دوشنبه 28-سه‌شنبه 29). مجلس طرح استیضاح عراقچی را ثبت کرد (خضریان، ثابتی)
    بر سر تماس‌های نیویورک - تندروها می‌گویند اختیار او انتقال شرایط از طریق میانجی‌ها
    بود، نه مذاکره مستقیم؛ یک مقام ارشد به رویترز گفته بود هیئت «اختیار کامل» داشت.
    رویترز (منابع، پنج‌شنبه 16:18Z): مذاکره‌کنندگان در حال بررسی توافقی مرحله‌ای هستند
    (هرمز بازگشایی شود، محاصره برداشته شود، دارایی‌های مسدودشده)؛ یک مقام ایرانی:
    احتمال «بسیار پایین»؛ یک مقام اروپایی: فهرست ایران «بسیار طولانی» است. پزشکیان
    (NBC): می‌خواهد تفاهم‌نامه ژوئن پیش از انتخابات میان‌دوره‌ای احیا شود، پذیرای
    بازرسی‌های هسته‌ای است، توطئه علیه ترامپ را رد می‌کند. روبیو: پیشرفت بزرگی نیست.
    ترامپ: ایران تا انتخابات میان‌دوره‌ای وقت‌کشی می‌کند. جبهه حوثی‌ها: شش موشک بالستیک
    به‌سوی طائف و ینبع رهگیری شد (ائتلاف/المالکی)؛ حوثی‌ها مدعی اصابت به آرامکو-ینبع
    و ریاض شدند - هیچ گزارش خسارتی از SPA نیست (فقط ادعای طرف متخاصم، قاعده 12)؛ مکرون
    نیرو، رادار و پدافند هوایی به ینبع می‌فرستد؛ بریتانیا در برابر ایران موضع می‌گیرد؛
    150+ کشته در نبرد یمن بر سر ارتفاعات باب‌المندب؛ صفوی: جبهه‌ای در دریای سرخ/باب‌المندب
    ممکن است گشوده شود. بحرین پیشگام درخواست بازگشایی کامل هرمز بدون عوارض است (2df323fa
    در جهت مخالف). عبورهای هرمز چهارشنبه 10 مورد (میانگین 10 روزه ~17، موارد با AIS
    خاموش لحاظ نشده). Cape Dao همچنان بدون انتساب (dd31b40f جمعه بسته می‌شود). نردبان
    بدون تغییر؛ مورد جدید 9083e952 (هیچ ترتیباتی با تأیید هر دو طرف از جمعه تا سه‌شنبه،
    0.7). نشانه‌ها: پاسخ علنی آمریکا به مهلت؛ «گام بعدی» شورای عالی امنیت ملی؛ گزارش
    خسارت SPA در ینبع؛ اظهارنظر میزبان با مکان+تاریخ. 26 سپتامبر: پیشنهاد. عراقچی
    (سازمان ملل، جمعه): «طرح مشخص هفت‌روزه» از طریق قطر منتقل شده است - بازگشایی ظرف
    هفت روز پس از برآورده شدن شرایط (رفع محاصره + ممنوعیت کشتیرانی، معافیت تحریم‌های
    نفتی، آتش‌بس سراسری منطقه از جمله لبنان، >=$12bn دارایی مسدودشده)؛ «انتخاب اکنون
    با ایالات متحده است». گلف نیوز: «ظرف چند ساعت گزارش‌ها نشان دادند» ترامپ آن را
    رد کرده - هیچ منبعی نام برده نشده، هیچ موضع علنی آمریکا وجود ندارد (Maritime Executive/
    رویترز: کاخ سفید بلافاصله پاسخ نداد؛ AP: مقام‌های سعودی «بدبین» هستند). دومین
    مقام ارشد ایرانی (رویترز): حتی در صورت پذیرش، انعطاف هسته‌ای وجود نخواهد داشت.
    فارس: گزارش اکسیوس درباره «آماده‌سازی دور جدید» و الجزیره درباره «کارشناسان به
    نیویورک» دروغ است، «خبرسازی» برای جابه‌جا کردن نفت. پزشکیان (CBS): بازرسان آژانس
    بین‌المللی انرژی اتمی می‌توانند بازگردند. دریای سرخ: شنبه - دو پهپاد حوثی به‌سوی
    ریاض + یک موشک بالستیک به‌سوی خمیس مشیط رهگیری شد (ائتلاف)؛ دفتر سیاسی حوثی‌ها:
    «تمرینی در مقیاس کوچک برای تشدیدی تمام‌عیار»؛ رؤسای ستاد عربستان-پاکستان-ترکیه
    در چارچوب توافق دفاع مشترک مکه (خالد بن سلمان + منیر)؛ بسیج عمومی دولت یمن؛ فرانسه
    به ینبع؛ هیچ گزارش خسارتی از SPA نیست. محاصره (رده شناور): آمریکا در حال توقیف
    ~$600m نفت خام ایران از سه نفتکش؛ سنتکام 122 شناور را تغییر مسیر داده؛ IMO تا
    24 سپتامبر 85 حادثه / 24 مرگ دریانورد؛ فهرست غیرمنطبق PGSA شامل 81 شناور؛ کپلر:
    33.7m بشکه نفت خام این هفته از هرمز خارج شده، در برابر 49.2m در کل هفته گذشته؛
    تردد LNG قطر در بالاترین حد دو ماهه. ارزیابی‌شده: dd31b40f محقق شد (Cape Dao بدون
    انتساب؛ جست‌وجو شد). نردبان: d96debd5 / 2df323fa شنبه 23:59Z بسته می‌شوند (در
    مسیر تحقق - بدون حمله زیرساختی؛ بحرین پیشگام درخواست بازگشایی بدون عوارض بود)؛
    33defb45 / d4f5ffd6 / 0d52e7da / ed8c08b5 یکشنبه بسته می‌شوند (در مسیر تحقق؛ فارس
    دور جدید را تکذیب می‌کند)؛ 9083e952 (هیچ ترتیباتی با تأیید هر دو طرف، تا سه‌شنبه)؛
    مورد جدید a0c82077 (هیچ اقدام ایرانی از رده‌ای جدید از شنبه تا چهارشنبه 30 سپتامبر
    23:59Z، 0.65: قلمرو/زیرساخت شورای همکاری خلیج فارس با انتساب تأییدشده به ایران،
    مین‌گذاری هرمز، شناور با پرچم آمریکا/اسکورت‌شده؛ آتش حوثی‌ها، شناورهای غیرآمریکایی
    بدون اسکورت، جریمه‌های PGSA، توقیف‌های آمریکا به حساب نمی‌آیند). نشانه‌ها: پاسخ
    علنی آمریکا؛ «گام بعدی» شورای عالی امنیت ملی؛ اظهارنظر میزبان با مکان+تاریخ (->
    بررسی عمیق +60)؛ گزارش خسارت SPA در ینبع. 27 سپتامبر: به‌طور علنی. ترامپ (شنبه،
    هنگام خروج از کاخ سفید؛ CNN / بلومبرگ به نقل از gcaptain): «پیشنهادشان را رد می‌کنم»
    / «پیشنهادی دادند اما ردش کردم - می‌خواهند توافقی کنند که در آن تنگه را فوراً
    باز کنند چون خیلی بد دارند می‌بازند ... من هم توافق کردن را دوست دارم»، عجله‌ای
    ندارد؛ منبع بلومبرگ: پیمان در دست بررسی به شکل تفاهم‌نامه ژوئن بود (بازگشایی هرمز
    <-> رفع محاصره). WSJ: ترامپ انتظار دارد کارزار بمباران را پس از انتخابات میان‌دوره‌ای
    از سر بگیرد (از تأیید خودداری کرد). عراقچی (وبلاگ زنده گلف نیوز): تهران رد پیشنهاد
    را «ملاحظه کرد»، منتظر پاسخ رسمی از طریق میانجی‌هاست و پس از آن تصمیم می‌گیرد
    - تنها روزنه باقی‌مانده برای شاخه توافق. محمدی، جانشین نیروی دریایی سپاه (فارس):
    ناوهای جنگی آمریکا «از جمله در اقیانوس هند» در جنگ جدید هدف هستند - اظهارنظر،
