  why_fa: 'بازخریدهای گسترش‌یافتهٔ اوراق بلندمدت خزانه‌داری (19 اوت) عملاً کنترل منحنی
    بازده هستند و بازار آن‌ها را به‌منزلهٔ کاهش ارزش پول تعبیر کرد - رژیم روندی طلا
    زمانی آغاز شد که بدهی آمریکا از $40tn گذشت. این ابزار در 9-10 سپتامبر آشکارا شکست
    خورد (حراج اوراق 30ساله در 5.308 «ضعیف» بود). 18 سپتامبر: «اوراق دوباره سقوط می‌کنند»
    - 10ساله 5.00، 30ساله 5.328 - و طلا با دلار بدون تغییر، افزایش یافت: یک جلسهٔ
    معاملاتی. 21 سپتامبر: بخش بلندمدت منحنی با نفت -3.7% صعود کرد (30ساله 5.280) و
    طلا افت کرد. 22 سپتامبر: حراج اوراق 2ساله ($69bn) با بازده 4.787 و 0.2 واحد پایه
    بالاتر از بازده پیش از حراج، با نمرهٔ C، انجام شد - هیچ تنشی در بخش کوتاه‌مدت
    نبود؛ منحنی در پایان معاملات 1.5-2.3 واحد پایه بالاتر بسته شد (5ساله 4.842، 10ساله
    4.967، 30ساله 5.303؛ جمع‌بندی investinglive برای 10ساله -6 واحد پایه گزارش کرده
    بود - اختلاف در مبنای محاسبه، قیمت پایانی CNBC مبناست)، درحالی‌که طلای نقدی $22
    افزایش یافت و ردیف بدون تغییر بود - بخش بلندمدت در هیچ‌یک از دو جهت پیشروِ طلا
    نیست. aec5cc8b در 23 سپتامبر محقق شد (هیچ بازده پایانی 30ساله‌ای در جمعه تا سه‌شنبه
    >=5.40 نبود؛ بالاترین مقدار 5.311). پرلی (فدرال رزرو نیویورک): خرید اسناد خزانه
    «متوقف شده، تمام نشده است». زیر نظر بگیرید: حراج‌های 5ساله/7ساله در چهارشنبه/پنج‌شنبه
    (تأییدنشده، todo-185 - هیچ گزارش بازنشرشده‌ای در پایگاه داده نیست)، هرگونه اظهارنظر
    بسنت دربارهٔ انتشار اوراق (حضورهای او در 21-22 سپتامبر فقط دربارهٔ ایران/چین/گازوئیل
    بود)، و اینکه آیا 30ساله در هیچ جلسه‌ای هم‌جهت با طلا حرکت می‌کند. 24 سپتامبر:
    بازده 30ساله در 5.402 بسته شد (CNBC) - نخستین بسته‌شدن بالاتر از 5.40 - همراه
    با 10ساله در 5.114 (بالاترین سطح از 2007) و 2ساله در 4.895: حرکتی در واکنش به
    PMI که ابتدا افزایش بازده با مسطح‌تر شدن منحنی و سپس افزایش موازی بازده‌ها بود،
    با طلا نزولی و دلار صعودی. بخش بلندمدت از آستانه عبور کرد و طلا آن را کاهش ارزش
    پول تعبیر نکرد (aec5cc8b پیش‌تر در پایان معاملات سه‌شنبه محقق شده بود). حراج‌های
    5ساله/7ساله همچنان تأییدنشده‌اند (هیچ گزارش بازنشرشده‌ای در پایگاه داده نیست،
    todo-185). زیر نظر بگیرید: بسته‌شدن 30ساله در >=5.45 همراه با DXY نزولی و طلا
    صعودی تنها ثبت قیمتی است که سناریوی پایه را تغییر می‌دهد. 25 سپتامبر: ابزار دوباره
    شکست خورد - خزانه‌داری دومین بازخرید خود را در دو هفته انجام داد و حراج 7ساله
    ($44bn) در 5.085%، به میزان 0.7 واحد پایه بالاتر از بازده پیش از حراج، انجام شد؛
    30ساله در 5.460 بسته شد (+5.9 واحد پایه، بالاترین سطح در 22 سال؛ مقدار لحظه‌ای
    در جمع‌بندی 5.478)، 10ساله 5.163 (بالاترین سطح از ژوئیهٔ 2007)، نرخ وام‌های مسکن
    7%. رویترز به نقل از investinglive: «بازخریدها و مداخله در ین نتوانسته‌اند بازده‌ها
    را مهار کنند»؛ استراتژیست‌ها بیشتر افزایش از ماه مارس را به انتظارات افزایش نرخ
    بهرهٔ فدرال رزرو و باقی را به رشد و نفت نسبت می‌دهند؛ «6% برای 10ساله در حال تبدیل
    شدن به آستانهٔ درد بعدی است». در سطح جهانی: استقراض بی‌سابقهٔ آلمان در حدود EUR525bn،
    اوراق دولتی آلمان در بالاترین سطح 17ساله، اوراق دولتی 10سالهٔ ژاپن در بالاترین
    سطح از 1996. طلا نزولی همراه با DXY صعودی - به‌منزلهٔ کاهش ارزش پول تعبیر نشد.
    تنها عامل تغییر سناریوی پایه: 30ساله >=5.50 همراه با DXY نزولی و طلا صعودی. 26
    سپتامبر: 30ساله در 5.49 بسته شد (+2.8 واحد پایه، بالاترین سطح از 2004؛ طی روز
    5.532)، 10ساله 5.165 (طی روز 5.23، بالاترین سطح از 2007)، فاصلهٔ بازده 2ساله و
    30ساله 63 واحد پایه (+12 واحد پایه طی دو جلسه با افت بازده 2ساله) - افزایش بازده
    همراه با پرشیب‌تر شدن منحنی در روزی که دلار 0.22% افت کرد و طلا 0.27% افزایش یافت:
    بخش بلندمدت به دلایل خاص خود فروخته می‌شود (عرضه، بازنگری‌ها، «6% مطرح است» به‌عنوان
    مطلب ضروری investinglive) و طلا همچنان آن را کاهش ارزش پول تعبیر نمی‌کند، حتی
    با کنار رفتن مانع دلار. جزئیات حراج 5ساله/7ساله همچنان تأییدنشده است (todo-185).
    پایان فصل چهارشنبه است. تنها عامل تغییر سناریوی پایه: بسته‌شدن 30ساله در >=5.50
    همراه با DXY نزولی و طلا صعودی.'
