  why_fa: 'بازده‌های واقعی محرک غالب طلا هستند، و این فدرال رزرو همین حالا نرخ بهره
    را افزایش داد: 16 سپتامبر +25bp به 3.75-4.00%، با رأی 12-0، بدون جمله‌ای درباره
    راهنمایی سیاستی؛ نمودار نقطه‌ای حاکی از یک افزایش دیگر در 2026 است (میانه 4.1؛
    16 نفر از 18 نفر انتظار >=1 افزایش دیگر دارند). وارش: «محدودکننده نیست»، برآورد
    PCE اوت ~3.6%. جناح منطقه‌ای همچنان خواستار افزایش بیشتر است: موسالم، کالینز،
    گولزبی (21 سپتامبر)؛ کالینز دوباره در 22 سپتامبر («می‌توان بر ثبات قیمت‌ها تمرکز
    کرد»)؛ بارکین در 22 سپتامبر 17:00Z (CFA بالتیمور): «ریسک‌های تورم بر ریسک‌های
    اشتغال حداکثری می‌چربند»، >60% از دسته‌های PCE بالاتر از >3% هستند، بنگاه‌ها هزینه‌ها
    را منتقل می‌کنند، یک بار «تشر زدن» شاید کافی نباشد - اما این چرخه «می‌تواند شبیه
    تعدیل میان‌چرخه‌ای گرینسپن باشد» (همان ~75bp در اواسط دهه 1990): انقباضی با یک
    سقف، و سهام شرکت‌های خانه‌سازی در واکنش به آن جهش کرد. دو نوبت سخنرانی اعضای هیئت‌عامل/نیویورک
    (جفرسون، ویلیامز، 22 سپتامبر) درباره سازوکارهای عملیاتی بود - بدون راهنمایی سیاستی.
    تابلوی بازار: حراج اوراق 2 ساله ($69bn، 22 سپتامبر) با بازده 4.787، دنباله 0.2bp،
    و نمره C انجام شد - بالاترین بازده اوراق 2 ساله از 2024، عرضه را بدون تنش جذب
    کرد؛ منحنی با افزایش 1.5-2.3bp بسته شد (CNBC: اوراق 5 ساله 4.842، 10 ساله 4.967،
    30 ساله 5.303)، در جلسه‌ای با برنت -1.1% و دور مذاکرات آمریکا-ایران که هر دو طرف
    آن را تأیید کردند - بخش کوتاه‌مدت منحنی، نفت را در مسیر نزولی دنبال نمی‌کند (نادیده‌گرفتن
    اثر شوک، طبق اظهارات ثبت‌شده منتفی است: اشمید، کشکاری، آن سه نفر، بارکین). بازده
    پایانی اوراق 2 ساله در 22 سپتامبر قابل بازیابی نیست (US2Y در CNBC خالی است). قیمت‌گذاری:
    اکتبر «کمی بیش از 50%» (investinglive، 13:38Z در 22 سپتامبر، بدون بازنشر بعدی)؛
    BofA همچنان اکتبر + دسامبر را پیش‌بینی می‌کند؛ دویچه بانک: بازارها چرخه جهانی
    افزایش نرخ بهره را کمتر از حد واقعی قیمت‌گذاری می‌کنند. نقاط بررسی: اوراق 2 ساله
    4.791-4.800 (شکست = هدف پیش‌بینی‌شده 5.055؛ پس‌زده‌شدن و سپس <4.600 = برگشت روند)؛
    DXY برابر با 100.02 / 100.58 / 101.80. شرط تغییر سناریو (تأیید اکتبر از سوی یکی
    از اعضای هیئت‌عامل -> سناریوی نزولی ناشی از نرخ بهره 60؛ درخواست مکث -> سناریوی
    پایه 30) فعال نشده است. سخنرانان (ff_calendar، کم‌اهمیت، todo-188): بار چهارشنبه
    23، 14:05Z (یادآوری #59، ابتدا محل برگزاری بررسی شود - نمایه هیئت‌عامل فقط وام‌دهی
    فرصت دوباره و هوش مصنوعی را نشان می‌دهد)؛ پنج‌شنبه ویلیامز 08:10Z، بارکین 12:30Z،
    هامک 12:50Z، پالسن 14:10Z؛ جمعه ویلیامز 09:15Z، هامک 18:00Z. گزاره‌ها: fc5c5a29
    (هیچ بازده پایانی اوراق 2 ساله <4.60 تا 25 سپتامبر، 0.55)؛ 4872cd75 (بازنشر احتمال
    اکتبر >=45% تا جمعه، 0.55)؛ 1a513d72 (هیچ بازنشر >=60% تا چهارشنبه 23:59Z، 0.55
    - ریسک بار)؛ d8e247ef (هیچ جفت متوالی که در هر دو، هر دو شاخص صعودی باشند تا دوشنبه
    28، 0.7 - سه‌شنبه ردیف بدون تغییر بود، نه هر دو صعودی). نقاط تعیین‌کننده بعدی:
    بار چهارشنبه؛ قیمت‌های پرداختی PMI مقدماتی آمریکا چهارشنبه 13:45Z؛ شاخص قیمت مصرف‌کننده
    (CPI) سپتامبر در اواسط اکتبر؛ FOMC در 28 اکتبر. گزارش کوتاه 24 سپتامبر: تغییر
    سناریو چهارشنبه فعال شد (وزن‌ها 15/60/25). PMI ترکیبی مقدماتی 58.4 (هزینه نهاده‌ها
    در بالاترین سطح از اکتبر 2022) + بار («در سناریوی پایه من، احتمالاً تعدیل‌های
    بیشتری در سیاست لازم خواهد بود») -> اکتبر 65% در جمع‌بندی پایانی (74% در طول روز،
    «94bp دیگر از اینجا به بعد»)؛ اوراق 2 ساله در 4.895 بسته شد (+12bp، CNBC)، 10
    ساله 5.114 (بالاترین سطح از 2007)، 30 ساله 5.402 (نخستین بسته‌شدن >=5.40)، DXY
    برابر با 101.12؛ ردیف طلا -1.74%. گزاره 1a513d72 محقق نشد (بازنشر >=60% از مطلب
    PMI در 13:51Z آمد). فعال: 6e168240 (اوراق 2 ساله >=4.80 چهارشنبه محقق شد، بخش
    پنج‌شنبه)، 1e91793f (هیچ بازنشر <55% پنج‌شنبه-جمعه، 0.55)، 4872cd75 (>=45%)، fc5c5a29
    (هیچ بسته‌شدن <4.60). پنج‌شنبه: SNB در 07:30Z، ویلیامز 08:10Z (محل برگزاری در
    نمایه فدرال رزرو نیویورک نیست)، درخواست‌های مقرری بیکاری 12:30Z با اجماع 200K،
    بارکین 12:30Z، هامک 12:50Z، پالسن 14:10Z؛ جمعه ویلیامز 09:15Z، اشمید 13:20Z، هامک
    18:00Z - همگی رؤسای منطقه‌ای، هیچ عضو هیئت‌عاملی نیست، صرفاً نشانه‌هایی برای پایش.
    شرط بازگشت سناریو: بازنشر <55% یا درخواست‌های مقرری بیکاری >230K همراه با درخواست
    مکث از سوی ویلیامز -> سناریوی نزولی ناشی از نرخ بهره 50. گزارش کوتاه 25 سپتامبر:
    وزن‌ها در 15/60/25 ثابت ماندند. پنج‌شنبه بر شمار صداهای همسو افزود و بازار از
    آن‌ها جلو زد: اکتبر 77.5% (بازنشر actionforex از قراردادهای آتی وجوه فدرال در
    09:16Z؛ جمع‌بندی قاره آمریکا هیچ جمله‌ای درباره احتمال نداشت). ویلیامز (مجمع سیاست
    کلان لندن): یک افزایش دیگر نرخ بهره در 2026 «معقول» است، به اکتبر متعهد نشد، راهنمایی
    آینده‌نگر «تمام شده»، اقتصاد «در برابر افزایش قیمت انرژی تاب‌آور» است؛ هامک: ریسک‌ها
    «به سمت بالا متمایل‌اند»، خطر شکل‌گیری «ذهنیت تورمی» از شوک‌های مکرر؛ پالسن (دارای
    حق رأی): «ممکن است مقداری انقباض بیشتر و ملایم موجه باشد». درخواست‌های مقرری بیکاری
    197K، فروش خانه‌های نوساز 684K. اوراق 2 ساله در 4.895 (CNBC) / 4.916 (جمع‌بندی)
    بسته شد، 10 ساله 5.163 (بالاترین سطح از 2007)، 30 ساله 5.460 (بالاترین سطح از
    2004). گزاره 6e168240 محقق شد (هر دو بخش). فعال: 1e91793f (>=55%) و 4872cd75 (>=45%)
    جمعه در مسیر تحقق بسته می‌شوند؛ fc5c5a29 جمعه بسته می‌شود؛ گزاره جدید 86f87a36
    (هیچ بازده پایانی اوراق 2 ساله <4.80 جمعه-سه‌شنبه، 0.55). سخنرانان جمعه: ویلیامز
    09:15Z (دوباره)، اشمید 13:20Z، هامک 18:00Z - هیچ عضو هیئت‌عاملی نیست؛ برنامه فدرال
    رزرو برای 28-29 سپتامبر هنوز در خوراک خبری نیست. شرط بازگشت سناریو بدون تغییر:
    بازنشر <55% یا درخواست مکث از سوی یکی از اعضای هیئت‌عامل -> سناریوی نزولی ناشی
    از نرخ بهره 50. NFP در 2 اکتبر: یادآوری #61. گزارش کوتاه 26 سپتامبر: وزن‌ها در
    15/60/25 ثابت ماندند (روز سوم). جمعه: اوراق 2 ساله در 4.86 بسته شد (-3.5bp؛ آغاز
    4.912، کف 4.845)، تحت تأثیر طرح هفت‌روزه عراقچی و برنت -2.1% - بخش کوتاه‌مدت منحنی
    برای نخستین بار در این رژیم، نفت را در مسیر نزولی دنبال کرد (~1.7bp به‌ازای هر
    درصد تغییر برنت)، بدون بازنشر و بدون سخنران در جلسه؛ جمع‌بندی: «با کاهش نگرانی‌های
    تورمی، دلار اندکی ضعیف‌تر شد». اوراق 10 ساله 5.165 بدون تغییر (در طول روز 5.23،
    بالاترین سطح از 2007)، 30 ساله 5.49 (بالاترین سطح از 2004). ویلیامز (جمعه): شوک‌های
    مداوم عرضه مبارزه را دشوارتر می‌کنند؛ بازار کار منشأ تورم نیست؛ تعرفه‌ها به‌تنهایی
    تورم پایدار ایجاد نمی‌کنند. هیچ بازنشر احتمال مربوط به جمعه در هیچ‌جا نیست (جست‌وجو
    شد) - آخرین رقم 77.5% (پنج‌شنبه). ارزیابی‌شده: fc5c5a29 محقق شد (هیچ بازده پایانی
    اوراق 2 ساله <4.60)، 4872cd75 محقق شد (>=45%)، 1e91793f محقق شد (>=55%). فعال:
    86f87a36 (هیچ بازده پایانی اوراق 2 ساله <4.80 جمعه-سه‌شنبه؛ رقم جمعه 4.86 شرط
    را برآورده می‌کند)؛ گزاره جدید b934960e (هیچ بازنشر <55% در روز PCE، چهارشنبه
    30 سپتامبر، 0.55) که با بررسی عمیق #62 در زمان انتشار+45 ارزیابی می‌شود. هفته
    آینده از طریق خلاصه تقویم actionforex + چشم‌انداز هفته آینده ولز فارگو تأیید شد
    (BLS/BEA 403): PCE چهارشنبه 30 سپتامبر 12:30Z (اجماع 0.4/3.7 کل، 0.3/3.4 هسته؛
    بازنگری‌های سالانه «روند ملایم‌تر، اوت داغ‌تر»)، ISM پنج‌شنبه 1 اکتبر 14:00Z (55.0؛
    قیمت‌های پرداختی 72)، NFP جمعه 2 اکتبر 12:30Z (اجماع 100K در برابر 162K، UR برابر
    با 4.1، AHE برابر با 0.3؛ تاریخ یادآوری #61 پابرجاست)، RBA سه‌شنبه 04:30Z (4.60)،
    شاخص قیمت مصرف‌کننده (CPI) منطقه یورو جمعه (3.7%). سخنرانان فدرال رزرو دوشنبه-جمعه:
    هیچ‌کدام در هیچ خوراک خبری قابل مشاهده نیستند (todo-001/188؛ نمایه هیئت‌عامل =
    عنوان‌های گذشته). شروط تغییر سناریو: بازنشر <55% یا درخواست مکث از سوی یکی از
    اعضای هیئت‌عامل -> سناریوی نزولی ناشی از نرخ بهره 50؛ بازنشر PCE برابر با >=80%
    همراه با بازده پایانی اوراق 2 ساله >=4.95 -> 65؛ توافقی با تأیید هر دو طرف همراه
    با اوراق 2 ساله <4.75 -> 50 (طلا از مسیر بخش کوتاه‌مدت منحنی صعود می‌کند). گزارش
    کوتاه 27 سپتامبر: وزن‌ها در 15/60/25 ثابت ماندند (روز چهارم). اصلاح: بازنشر جمعه
    وجود داشت - مطلب توضیحی شنبه CNBC (13:30Z): CME FedWatch برای اکتبر 64%، در برابر
    77.5% پنج‌شنبه - کاهش 13.5 واحد درصدی بر اثر طرح عراقچی و برنت -2.1%، بدون داده،
    بدون سخنران. انتظارات تورمی یک‌سال آینده دانشگاه میشیگان در سپتامبر 4.6% (از 4.0%،
    بالاترین سطح از ژوئن). گزارش هفتگی actionforex: «قیمت‌گذاری فدرال رزرو تا جمعه
    از نقطه افراطی اواسط هفته عقب نشست»؛ اوراق 2 ساله بیش از حد امتداد یافته است (RSI
    روزانه >72؛ سقف 4.912، هدف پیش‌بینی‌شده 5.055) و اوراق 10 ساله (سقف 5.23، هدف
    پیش‌بینی‌شده 5.413) اکنون جهت دلار را تعیین می‌کند؛ مقاومت DXY در 101.80-102.86،
    محدوده عقب‌نشینی 99.7-99.9 اگر حرکت اوراق 10 ساله متوقف شود. رد صریح و ثبت‌شده
    طرح هفت‌روزه از سوی ترامپ (شنبه، پس از تسویه جمعه) جهت زنجیره نفت -> اوراق 2 ساله
    را در آستانه ضرب‌الاجل رضایی دوباره رو به بالا می‌برد. گزاره جدید efd9700b (هیچ
    بازنشر <55% دوشنبه 28 - سه‌شنبه 29، 0.55؛ سقف قاعده-19 چون برنامه سخنرانان نامعلوم
    است) جانشین 1e91793f می‌شود؛ b934960e روز PCE را پوشش می‌دهد. سخنرانان فدرال رزرو
    دوشنبه-جمعه: هنوز هیچ‌کدام قابل مشاهده نیستند (استخراج از صفحه تقویم هیئت‌عامل
    فقط سربرگ آن را برمی‌گرداند). شروط تغییر سناریو بدون تغییر: بازنشر <55% یا درخواست
    مکث از سوی یکی از اعضای هیئت‌عامل -> سناریوی نزولی ناشی از نرخ بهره 50؛ بازنشر
    PCE برابر با >=80% همراه با بازده پایانی اوراق 2 ساله >=4.95 -> 65. گزارش کوتاه
    28 سپتامبر: آغاز بازار زنجیره را به حرکت درآورد - اوراق 2 ساله 4.90 (+3.7bp)،
    10 ساله 5.20، 30 ساله 5.51 (سقف 5.525)، طلا -2.1%؛ احتمال اکتبر 64% پابرجاست (هیچ
    بازنشری در تغییرات جدید نیست، efd9700b به‌اندازه 9 واحد درصد حاشیه دارد). سخنرانان
    اکنون از طریق جدول رویدادها قابل مشاهده‌اند (با برچسب کم‌اهمیت): بومن دوشنبه 12:15Z
    (محل برگزاری تأیید نشده - نشانه‌ای برای پایش، قاعده 24؛ نمایه هیئت‌عامل سخنرانی‌های
    نظارتی او در لندن را فهرست می‌کند)، کوک 17:25Z، بارکین 17:30Z؛ سه‌شنبه بومن/بار/گولزبی/
    موسالم/ویلیامز/والر 15:00-19:00Z؛ پنج‌شنبه والر 14:00Z همراه با ISM. بسنت یکشنبه:
    فدرال رزرو باید «ذهنی باز» داشته باشد (بهره‌وری هوش مصنوعی) - عامل ابطالِ مکث
    تحمیلی برای 288a87ac (هیچ جفت متوالی که در هر دو، هر دو شاخص صعودی باشند، سه‌شنبه
    29 سپتامبر - دوشنبه 5 اکتبر، 0.65). گزاره d8e247ef محقق شد (3/3 در این خانواده).
    گزارش کوتاه 29 سپتامبر: بازنشر ~70% برای اکتبر و ~60% برای اکتبر+دسامبر (investinglive
    دوشنبه 22:59Z)؛ کوک (اوکلند، دوشنبه) اندکی انقباضی‌تر بود - هوش مصنوعی + نفت همچنان
    تورم را «در ماه‌های آینده» بالا می‌برند، افزایش‌های بیشتر نرخ بهره وابسته به داده‌هاست،
    بازار کار برای «تحمل» نرخ‌های بالاتر «در موقعیت مناسبی» قرار دارد؛ بومن چیزی درباره
    سیاست نگفت. بازده پایانی اوراق 2 ساله 4.924 (+6.4bp)، 10 ساله 5.242، 30 ساله 5.562:
    بخش بلندمدت منحنی به‌واسطه عرضه/بازده‌های واقعی هدایت را به دست گرفت (ضعیف‌ترین
    حراج اوراق 7 ساله در یک سال)، بنابراین بازده پایانی اوراق 10 ساله >5.25 همراه
    با ثبات اوراق 2 ساله، نشانه جدیدی است که فقط به بخش بلندمدت منحنی مربوط می‌شود.
    سه‌شنبه: شش سخنران - بومن 15:00Z (عنوان‌های نظارتی منشن هاوس)، بار 16:40Z، گولزبی
    17:00Z، موسالم 17:30Z، ویلیامز 18:00Z، والر 19:00Z (نمایه هیئت‌عامل: «چشم‌انداز
    اقتصادی و... اطلاع‌رسانی سیاستی من»، بدون تاریخ - بررسی عمیق مشروط #63 در 19:45Z).
    گزاره‌های فعال: efd9700b (هیچ بازنشر <55% تا سه‌شنبه)، 86f87a36 (هیچ بازده پایانی
    اوراق 2 ساله <4.80 تا سه‌شنبه)، b934960e (جلسه PCE)، 288a87ac (هیچ جفتی که در
    هر دو، هر دو شاخص صعودی باشند تا 5 اکتبر). نقاط تعیین‌کننده بعدی: PCE چهارشنبه
    12:30Z (#62)، ISM+والر پنج‌شنبه 14:00Z، NFP جمعه 12:30Z (#61).'
