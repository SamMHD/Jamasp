  why_fa: 'پل ارتباطی جنگ با فدرال رزرو: انتقال نفت به شاخص قیمت مصرف‌کننده (CPI)،
    کانال فعال احتمال افزایش نرخ بهره است و نفت در روزهای بدون رویداد فدرال رزرو،
    تعیین‌کننده قیمت طلاست - در هر دو جهت. قیمت‌های تسویه 15 سپتامبر: WTI برابر با
    105.83 / برنت برابر با 108.75 (سقف 109.97)؛ از آن زمان پنج تسویه پایین‌تر: 21
    سپتامبر برنت 100.34، 22 سپتامبر برنت 99.25 (نخستین تسویه زیر 100 در دو هفته؛ 98.78
    در ساعت 03:30Z چهارشنبه)، WTI نوامبر حدود 89-90.5 (قرارداد اکتبر در 22 سپتامبر
    منقضی شد) - در پی راه‌اندازی مجدد خط لوله شرق-غرب عربستان (به‌صورت جزئی، با تغییر
    مسیر تا 4 میلیون بشکه در روز)، ازسرگیری صادرات ینبع، بارگیری حدود 12 میلیون بشکه
    در یک روز (Gulf News)، رفت‌وآمدهای شاتلی در هرمز/جریان‌های نفتی با AIS خاموش،
    دور مذاکرات آمریکا و ایران که هر دو طرف آن را تأیید کردند، و خبر API از افزایش
    ذخایر در برابر انتظار کاهش. بخش دچار تنگنا، فرآورده‌هاست: گازوئیل در سطوح رکوردی
    است و سوخت جت نیز در پی آن حرکت می‌کند (MarketWatch)، ترامپ از ممنوعیت صادرات
    گازوئیل حمایت می‌کند و می‌گوید تصمیم «سریع» گرفته می‌شود (تحلیلگران: زیان می‌رساند،
    نه کمک). سطوح fxempire: حمایت برنت 97-97.5 و سپس میانگین متحرک 50 دوره‌ای در 92.44،
    مقاومت 102/105؛ حمایت WTI در 90.47 و سپس 87.7. آزمون این موضع: برنت <100 همراه
    با بازده اوراق 2 ساله >=4.70 = تأیید عدم تقارن، امتیاز دیدگاه نزولی ناشی از نرخ‌های
    بهره در 50 باقی می‌ماند - در 22 سپتامبر ثبت شد (برنت 99.25، حراج اوراق 2 ساله
    4.787، منحنی رو به بالا)؛ برنت <100 و بازده اوراق 2 ساله <4.70 = از دست رفتن عامل
    ورودی (امتیاز دیدگاه نزولی ناشی از نرخ‌های بهره 45) ثبت نشده است. انتقال یک‌طرفه
    در اظهارات علنی ثبت شده است (اشمید، کشکاری، موسالم، بارکین: «شوک‌های ماندگار در
    قیمت‌گذاری جا افتاده‌اند»، برآورد وارش از PCE حدود 3.6)؛ در خارج نیز همین‌طور:
    ناگل از بانک مرکزی اروپا: «نفت اکنون یک سنجه کلیدی تورم است، موضع اندکی محدودکننده
    منتفی نیست»، لین: «شوک انرژی طولانی‌تر می‌شود، تورم تا اواسط 2027 بالا می‌ماند»؛
    شاخص مقدماتی PMI استرالیا 50.8، با هزینه نهاده‌ها در بالاترین سطح 3 ماهه. زنجیره
    تأمین: شرق-غرب به‌صورت جزئی فعال، ینبع در حال ازسرگیری، ایران صفر (CENTCOM)؛ ممنوعیت
    صادرات گازوئیل روسیه تمدید شد؛ BofA پیش‌بینی برنت خود برای نیمه دوم سال را افزایش
    داد (Investing.com، خوانده نشده). ادعاها: 4dfbd1d8 (رقم کل سپتامبر >=0.4، 0.65)؛
    62c34dbd (هسته <=0.3، 0.7)؛ بررسی میان‌دوره‌ای قاعده-11 در 30 سپتامبر؛ f7a0c23d
    (هیچ تسویه برنتی >=103 از چهارشنبه تا جمعه، 0.55)؛ 8e425cab با نخستین تسویه صعودی
    نفت اجرا می‌شود. 24 سپتامبر: برنت در 103.08 (+3.9%) تسویه شد، با وجود افزایش 3
    میلیون بشکه‌ای ذخایر نفت خام (ذخایر بنزین و فرآورده‌های تقطیری کاهش یافت)، راه‌اندازی
    مجدد شرق-غرب و صادرات عراق >3 میلیون بشکه در روز - صرف ریسک با اظهارات درباره
    هرمز بازقیمت‌گذاری می‌شود، نه با بشکه‌ها؛ 102.10 در ساعت 03:30Z. فرآورده‌ها: کاخ
    سفید با وجود مخالفت کابینه به ممنوعیت 90 روزه صادرات گازوئیل «نزدیک‌تر می‌شود»
    (تکذیب قبلی کاخ سفید؛ گازوئیل پس از نوسان رفت‌وبرگشتی شدید اندکی پایین‌تر تسویه
    شد)؛ سناتورهای هر دو حزب خواستار آزادسازی اضطراری ذخایر نفت گرمایشی هستند؛ قیمت
    رکوردی گازوئیل در حال انتقال به قیمت مواد غذایی است (MarketWatch). ممنوعیت، مؤلفه
    انرژی شاخص قیمت مصرف‌کننده (CPI) آمریکا را اندکی تعدیل می‌کند و هم‌زمان عرضه جهانی
    را محدودتر می‌سازد - ادعاهای سپتامبر (4dfbd1d8 / 62c34dbd) این اثر را در بر می‌گیرند،
    بررسی میان‌دوره‌ای در 30 سپتامبر. واردات نفت آسیا همچنان 13% پایین‌تر از پیش از
    جنگ است (Gulf News). آزمون عدم تقارن همچنان برقرار است: برنت <100 همراه با بازده
    اوراق 2 ساله >=4.70 در 22 سپتامبر تأیید شد؛ بازده اوراق 2 ساله در حرکت صعودی نفت
    نیز از آن پیروی نکرد - پیشرو بود (PMI). 25 سپتامبر: برنت در 106.60 تسویه شد (+3.4%،
    بالاترین قیمت پایانی از 15 سپتامبر؛ +5% در سقف‌ها)، WTI در 94.61 (روند نزولی شش‌جلسه‌ای
    متوقف شد)، در پی حملات موشکی حوثی‌ها به ینبع/طائف؛ سپس در معاملات شبانه، در پی
    گزارش توافق مرحله‌ای، -1% (105.55 در ساعت 03:31Z). ینبع مسیر جایگزین شرق-غرب است:
    investinglive می‌گوید بارگیری نفتکش‌ها در آنجا «هنوز از سر گرفته نشده است»، در
    مقابل گزارش 24 سپتامبر Gulf News مبنی بر «12 میلیون بشکه در یک روز» - تعارض، شنبه
    از طریق gcaptain رفع شود. فرآورده‌ها: رایت در حال نظرخواهی از پالایشگران درباره
    محدودیت‌های داوطلبانه صادرات گازوئیل است (گزارش ممنوعیت 90 روزه را رد می‌کند)؛
    اتحادیه اروپا هشدار می‌دهد که ممنوعیت به هر دو طرف آسیب می‌زند. آرامکو در حال
    بررسی مسیرهای صادراتی 4 و 5 است. بررسی میان‌دوره‌ای در 30 سپتامبر (4dfbd1d8 /
    62c34dbd). تاریخ انتشار PCE اوت تا 26 سپتامبر در خوراک خبری نیست (برآورد وارش
    حدود 3.6% سال‌به‌سال) - شنبه بررسی شود. 26 سپتامبر: برنت در 104.32 تسویه شد (-2.1%،
    -$3 نسبت به سقف‌ها؛ +5.1% هفته‌به‌هفته از 99.25)، WTI در 92.44 (-2.3%)، در پی
    طرح هفت‌روزه عراقچی؛ بخش کوتاه‌مدت منحنی نیز همراه شد (-3.5 واحد پایه) - رجوع
    شود به kinetic-transmission-inverted. تاریخ PCE تأیید شد: چهارشنبه 30 سپتامبر
    ساعت 12:30Z (تقویم actionforex + چشم‌انداز هفته پیش روی Wells Fargo) - اجماع برای
    رقم کل 0.4 ماه‌به‌ماه / 3.7% سال‌به‌سال، هسته 0.3 / 3.4%؛ بازنگری‌های سالانه BEA
    در همان انتشار («روند کوتاه‌مدت ملایم‌تر، رقم اوت داغ‌تر»)؛ بیدارباش #62 برای
    زمان انتشار+45 (13:15Z) ثبت شده است - به b934960e امتیاز می‌دهد (بدون انتقال <55%)
    و بررسی میان‌دوره‌ای قاعده-11 را برای 4dfbd1d8 / 62c34dbd اجرا می‌کند (میانگین
    برنت سپتامبر حدود 103-104 در برابر حدود 90 در اوت بوده است: ادعای رقم کل >=0.4
    در مسیر تحقق است؛ هسته <=0.3 به مسکن/سفر وابسته است). اجماع شاخص قیمت‌های پرداختی
    ISM پنجشنبه ساعت 14:00Z برابر با 72 (از 71.1). تعارض درباره بارگیری ینبع حل‌نشده
    است (جست‌وجوی gcaptain: هیچ مطلبی با تاریخ پس از 3 اوت نیست؛ گزارش 24 سپتامبر
    Gulf News با عبارت «جهش هفت‌برابری، AIS خاموش» تنها گزارش تاریخ‌دار باقی می‌ماند).
    Kpler: جریان نفت خام هرمز این هفته 33.7 میلیون بشکه در برابر 49.2 میلیون در هفته
    گذشته - بخش فیزیکی عرضه محدودتر شد، در حالی که صرف ریسک فروکش کرد. 27 سپتامبر:
    برنت نوامبر 104.32 (تسویه جمعه؛ قرارداد نوامبر چهارشنبه 30 سپتامبر منقضی می‌شود
    - نماد @LCO.1 در CNBC همان روز به دسامبر منتقل می‌شود، بنابراین هر ادعایی درباره
    تسویه برنت که چهارشنبه را در بر بگیرد، قرارداد را مشخص می‌کند، قاعده 17؛ a270f3f1
    و 9e1829f8 سه‌شنبه بسته می‌شوند، بدون تأثیر)، WTI نوامبر 92.44 (-8% هفته‌به‌هفته
    از حدود 100.30؛ actionforex: میانگین متحرک نمایی 55 روزه در 89.14 و سطح اصلاح
    50% در 86.90 سطوحی هستند که شکست آن‌ها نشان می‌دهد صعود ناشی از جنگ پایان یافته
    است - به آن‌ها نرسیده است). رد علنی ترامپ (شنبه)، طرحی را کنار می‌زند که صرف ریسک
    را کاهش داده بود؛ انتظار بازقیمت‌گذاری صعودی در بازگشایی یکشنبه وجود دارد. بخش
    فیزیکی عرضه محدودتر شد، در حالی که صرف ریسک کاهش یافت (Kpler: 33.7 میلیون در برابر
    49.2 میلیون بشکه). تعارض درباره بارگیری ینبع همچنان حل‌نشده است. تورم مورد انتظار
    یک سال آینده در نظرسنجی دانشگاه میشیگان 4.6%. PCE چهارشنبه ساعت 12:30Z (اجماع
    0.4/3.7، هسته 0.3/3.4): بررسی عمیق #62، بررسی میان‌دوره‌ای قاعده-11 را برای 4dfbd1d8
    / 62c34dbd اجرا می‌کند (میانگین برنت سپتامبر حدود 103-105 در برابر حدود 90 در
    اوت: ادعای رقم کل >=0.4 در مسیر تحقق است؛ هسته <=0.3 به مسکن/سفر وابسته است).
    شاخص قیمت‌های پرداختی ISM پنجشنبه (اجماع 72).'
