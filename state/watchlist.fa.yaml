    آزمون فاصله قاعده 20 می‌شوند). مرحله تخلیه طی شب: برنت با گزارش نقشه راه -1%،
    طلا بدون تغییر در 4324، بازده 2ساله بدون تغییر - دیپلماسی تقاضای خرید ایجاد نمی‌کند.
    درگیری نظامی 25. موارد ابطال بدون تغییر: ثبت الگوی رکود تورمی (بازده 30ساله >=5.45،
    DXY نزولی، طلا صعودی)؛ دو ردیف با صعود هر دو؛ طلا +1% با نفت نزولی و بازده 2ساله
    بدون تغییر. 25 سپتامبر: پانزدهمین جلسه صعودی نفت که با طلای بدون تغییر/نزولی بسته
    شد (برنت با خبر موشک‌ها در ینبع +3.4% تا 106.60؛ ردیف -0.37%). شکاف: در 16:18Z
    گزارش توافق مرحله‌ای، برنت را -3 و GC را +20 برد (4292.7 -> 4312.1)، در حالی که
    بازده 2ساله بدون تغییر بود - نخستین تقاضای خرید در واکنش به افت نفت در این رژیم
    - که تا 18:00Z محو شد؛ سپس طی شب، برنت -1% طلا را با تقاضای خرید +24 تا 4328.5
    بالا برد. کوچک است، اما زنجیره اکنون در معاملات درون‌روزی هر دو جهت را نشان می‌دهد.
    ادعای جدید a270f3f1 (0.55): نخستین تسویه -3% برنت از جمعه تا سه‌شنبه، ردیف +1%
    برای GC ثبت نمی‌کند؛ عدم تحقق با بازده 2ساله بدون تغییر -> درگیری نظامی 20، پایه
    25 (مرحله تخلیه برای طلا تقاضای خرید ایجاد می‌کند = رژیم در حال سست‌شدن است).
    سایر موارد ابطال بدون تغییر. 26 سپتامبر - دریچه در انتهای کوتاه‌مدت منحنی دوطرفه
    است: جمعه برنت با طرح هفت‌روزه در 104.32 تسویه شد (-2.1%)، بازده 2ساله با -3.5bp
    در 4.86 بسته شد، DXY -0.22%، ردیف GC +0.27% (4321.2)، طلای نقدی +$8 - نخستین جلسه
    این رژیم که در آن افت نفت، انتهای کوتاه‌مدت منحنی را پایین کشید و برای طلا تقاضای
    خرید ایجاد کرد، بدون واسطه انتقال و بدون دخالت هیچ سخنرانی. همان زنجیره (قاعده
    22)، با علامت معکوس؛ تقاضا برای دارایی امن نیست (طلا بالا رفت چون بازده 2ساله
    افت کرد). شمارش: 15 جلسه از 16 جلسه صعودی نفت با طلای بدون تغییر/نزولی بسته شدند؛
    جلسات نزولی نفت اکنون 3 مورد بدون تغییر تا نزولی (21، 22، 24 سپتامبر) در برابر
    1 مورد صعودی (25 سپتامبر، از مسیر بازده 2ساله) دارند. بازنگری: شاخه توافق اکنون
    برای طلا صعودی ملایم است (+0.5-1% در برابر برنت -5-8%)، با سقفی ناشی از تخلیه
    - تعبیر «بدون تغییر تا نزولی» پنج‌شنبه کنار گذاشته شد (درس ثبت شد). a270f3f1 (0.55)
    آزمون است: نخستین تسویه -3% برنت تا سه‌شنبه نباید ردیف +1% ثبت کند (جمعه -2.1%،
    ردیف +0.27% ثبت کرد؛ با مقیاس‌بندی، -3% ~ +0.4%). ادعای جدید 95c71900 (هیچ ردیف
    >=4402.2 در دوشنبه تا سه‌شنبه، 0.5) سقف هر یک از دو شاخه است. درگیری نظامی 25.
    موارد ابطال بدون تغییر: عدم تحقق a270f3f1 با بازده 2ساله بدون تغییر -> 20 / پایه
    25؛ دو ردیف با صعود هر دو؛ ثبت الگوی رکود تورمی. 27 سپتامبر: رد طرح پس از تسویه
    اعلام شد. مرحله تخلیه جمعه (برنت -2.1%، بازده 2ساله -3.5bp، DXY -0.22%، ردیف GC
    +0.27%) طرحی را معامله کرد که ترامپ شنبه به‌طور علنی رد کرد (~18:00Z)؛ بازگشایی
