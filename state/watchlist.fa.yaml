  why_fa: 'جنگ در قالب افزایش نرخ بهره فدرال رزرو و اخطار تأمین وجه تضمین به طلا می‌رسد،
    نه در قالب تقاضا برای دارایی امن. چهارده جلسه شواهد از 2 تا 21 سپتامبر، با شدیدترین
    نمونه در 21 سپتامبر (اصابت به دو نفتکش، نفت -3.7%، طلا -1.0%، BTC +7.1%). در خلاف
    این جهت: یک جلسه (9 سپتامبر). 22 سپتامبر - مسیر تنش‌زدایی: یک دور مذاکرات آمریکا
    و ایران با تأیید هر دو طرف، برنت در 99.25 تسویه شد (-1.1%، پنج جلسه نزولی)، طلای
    نقدی +0.5% / ردیف بدون تغییر، منحنی بازده 1.5-2.3 واحد پایه بالا رفت، دلار در
    اواخر جلسه تضعیف شد، سپس طی شب تقویت شد و طلا رشد خود را پس داد. بند معاملات درباره
    محرک (قاعده 23): حدود 18:30Z ثبت شد، GC در پایان معاملات Globex از 4390 -> 4396
    رفت - هدف در هر دو جهت محقق نشد، وزن‌ها حفظ شدند. دریچه: افزایش نفت باعث فروش
    طلا می‌شود (از مسیر بازده 2ساله)؛ کاهش نفت بر اثر دیپلماسی، طلا را بدون تغییر
    تا نزولی باقی می‌گذارد (صرف خود طلا تخلیه می‌شود، بازده 2ساله همراهی نمی‌کند)
    - تنها مسیر صعود طلا، کاهش بازده 2ساله است که به یک مقام فدرال رزرو یا تغییری
    تعیین‌کننده در داده‌های آمریکا نیاز دارد، نه یک تیتر خبری. ادعاها: 64c7ba41 در
    23 سپتامبر نامشخص (هیچ تسویه صعودی نفت در دوشنبه/سه‌شنبه رخ نداد)؛ جانشین آن،
    8e425cab (0.5)، با نخستین تسویه صعودی برنت از چهارشنبه تا جمعه فعال می‌شود (ردیف
    <+1% = تحقق؛ نبود چنین تسویه‌ای = نامشخص)؛ f7a0c23d (0.55): هیچ تسویه برنت >=103
    از چهارشنبه تا جمعه رخ ندهد - ادعای تخلیه صرف. تأییدکننده‌ها: یک تسویه صعودی نفت
    همراه با طلای بدون تغییر/نزولی؛ یک حمله آمریکا به ایران که با افت طلا قیمت‌گذاری
    شود؛ متنی با تأیید هر دو طرف که با نفت -5% و طلای نزولی قیمت‌گذاری شود. ابطال‌کننده‌ها:
    عدم تحقق 8e425cab -> جنبشی 35؛ دو ردیف متوالی با صعود طلا / صعود بازده 2ساله؛
    طلا +1% در یک جلسه نزولی نفت با بازده 2ساله بدون تغییر؛ یک رویداد عرضه که به‌صورت
    رکود تورمی معامله شود (بخش بلندمدت منحنی صعودی، دلار نزولی، طلا صعودی)؛ متنی که
    با برنت -5%، طلای صعودی و بازده 2ساله بدون تغییر قیمت‌گذاری شود -> جنبشی 25. 24
    سپتامبر: 8e425cab محقق شد - نخستین تسویه صعودی نفت (103.08، +3.9%) ردیف طلا را
    در -1.74% ثبت کرد؛ از 2 سپتامبر، چهارده جلسه صعودی نفت با طلای بدون تغییر/نزولی
    بسته شده‌اند، یک جلسه در خلاف این جهت. تعدیل طبق قاعده 9: تجدید قیمت‌گذاری ناشی
    از PMI/بار نیز در همان روز رخ داد. f7a0c23d محقق نشد (سقف تخلیه صرف در یک جلسه
    شکسته شد؛ درس: سطوح نفت مشمول آزمون فاصله قاعده 20 می‌شوند). طی شب، مسیر تخلیه:
    برنت -1% در پی گزارش نقشه راه، طلا بدون تغییر در 4324، بازده 2ساله بدون تغییر
    - دیپلماسی تقاضا ایجاد نمی‌کند. جنبشی 25. ابطال‌کننده‌ها بدون تغییر: ثبت وضعیت
    رکود تورمی (بازده 30ساله >=5.45، DXY نزولی، طلا صعودی)؛ دو ردیف با صعود هر دو؛
    طلا +1% هنگام افت نفت با بازده 2ساله بدون تغییر. 25 سپتامبر: پانزدهمین جلسه صعودی
    نفت که با طلای بدون تغییر/نزولی بسته شد (برنت +3.4% تا 106.60 در پی حملات موشکی
    به ینبع؛ ردیف -0.37%). شکاف: در 16:18Z گزارش توافق مرحله‌ای، برنت را -3 و GC را
    +20 جابه‌جا کرد (4292.7 -> 4312.1)، در حالی که بازده 2ساله بدون تغییر بود - نخستین
    تقاضای ناشی از افت نفت در این رژیم - که تا 18:00Z محو شد؛ سپس طی شب، برنت -1%
    طلا را +24 تا 4328.5 بالا برد. کوچک است، اما زنجیره اکنون در طول روز هر دو جهت
    را نشان می‌دهد. ادعای جدید a270f3f1 (0.55): نخستین تسویه برنت -3% از جمعه تا سه‌شنبه،
    ردیف GC برابر با +1% ثبت نکند؛ عدم تحقق همراه با بازده 2ساله بدون تغییر -> جنبشی
    20، پایه 25 (مسیر تخلیه برای طلا تقاضا ایجاد می‌کند = رژیم در حال سست شدن است).
    سایر ابطال‌کننده‌ها بدون تغییر. 26 سپتامبر - دریچه در بخش کوتاه‌مدت منحنی دوطرفه
    است: جمعه برنت با طرح هفت‌روزه در 104.32 تسویه شد (-2.1%)، بازده 2ساله با -3.5
    واحد پایه در 4.86 بسته شد، DXY -0.22%، ردیف GC +0.27% (4321.2)، طلای نقدی +$8
    - نخستین جلسه این رژیم که در آن افت نفت، بخش کوتاه‌مدت منحنی را پایین کشید و برای
    طلا تقاضا ایجاد کرد، بدون هیچ واسطه انتقال یا سخنرانی. همان زنجیره (قاعده 22)،
    با علامت معکوس؛ تقاضا برای دارایی امن نیست (طلا بالا رفت چون بازده 2ساله پایین
    آمد). شمارش: 15 جلسه از 16 جلسه صعودی نفت با طلای بدون تغییر/نزولی بسته شدند؛
    جلسات نزولی نفت اکنون شامل 3 جلسه با طلای بدون تغییر تا نزولی (21، 22، 24 سپتامبر)
    در برابر 1 جلسه صعودی است (25 سپتامبر، از مسیر بازده 2ساله). بازنگری: شاخه توافق
    اکنون با صعود ملایم طلا همراه است (+0.5-1% در برابر برنت -5-8%) که تخلیه صرف آن
    را محدود می‌کند - فرض «بدون تغییر تا نزولی» پنج‌شنبه کنار گذاشته شد (درس ثبت شد).
    a270f3f1 (0.55) آزمون است: نخستین تسویه برنت -3% تا سه‌شنبه نباید ردیف +1% ثبت
