    دهه قرار دارد؛ actionforex: «شکست محدوده USD/JPY نزدیک است». توکیو دوشنبه 12 اکتبر
    تعطیل است. ورودی زنجیره نیست. 15 اکتبر: کوئدا از بانک ژاپن (هیئت‌مدیره): بانک
    «نباید درباره افزایش نرخ بهره بیش‌ازحد محتاط باشد»، نرخ خنثی «به‌طور قابل‌توجهی
