    Sun (کشتی باری با پرچم پاناما) را با مهمات دقیق‌زن در دریای عمان از کار انداخت
    - رده محاصره، شکل تشدیدشده؛ پوتین در تماس جمعه شرایط ایران را به ترامپ منتقل کرد
    (پسکوف) - کانال مسکو در کنار دوحه، بدون متن. برنت معامله نشد. نشانه‌ها: موقعیت/نام
    شناور شنبه از UKMTO؛ نام بردن ریاض از ایران (ادعای B)؛ حملات آمریکا به حوثی‌ها
    (رده بدون تغییر، واکنش برنت خوانده شود)؛ اصابت به یک گره نفتی ساحل شرقی عربستان.
    12 اکتبر (گزارش دوشنبه): هر پنج مورد یکشنبه محقق شدند (3fe07b8f خویشتن‌داری عربستان
    5/5، faa3ff57 اسکورت‌ها 5/5، fed72d60 ترتیبات 4/4، 4ab9cef6 غرب خلیج فارس 1/1،
    3db62da8 بازه بازگشایی 6/7). واقعیت‌های آخر هفته (استخراج‌شده): تلفات شنبه فرودگاه
    ملک خالد 13 / 300+ زخمی از جمله یک شهروند آمریکا؛ ترمینال 4 یکشنبه دوباره هدف
    قرار گرفت؛ اصابت به محوطه پروازی فرودگاه ملک فهد دمام توسط GACA تأیید شد (شنبه
    ~17:30Z)؛ حوثی‌ها مدعی دو سایت آرامکو شدند - آرامکو ساکت، تأییدنشده (قاعده 12،
    بدون تغییر وضعیت)؛ وزیر خارجه عربستان یکشنبه با عراقچی درباره کاهش تنش گفت‌وگو
    کرد (SPA) - نخستین تماس علنی از زمان تشدید، مؤید 17921803؛ ترامپ «در حال بررسی
    پیوستن» به حملات سعودی علیه حوثی‌ها. هرمز: شناورهای خروجی تأییدشده توسط UKMTO
    شنبه 19:20Z (آتش‌سوزی) و یکشنبه 12:00Z (سمت چپ شناور)، هر دو بی‌نام، هر دو در
    تنگه؛ Petro Dolphin (نفتکش فرآورده با مالکیت اماراتی 4,000 dwt، پرچم جعلی نیکاراگوئه،
    AIS خاموش از مه) نزدیک صحار هدف پهپاد قرار گرفت، 2 مفقود / 9 نجات‌یافته - نخستین
    اصابت نزدیک ساحلی بی‌طرف و دور از تنگه (MarEx)؛ شناور نجات‌یافته گارد ملی امارات
    در شنبه ~16:35Z (22 خدمه) همچنان بی‌نام و فاقد موقعیت مشخص؛ ادعاهای «مین» سپاه
    x2 تأییدنشده. سنتکام شنبه: Ocean Molica/Arika Sun با حمله جنگنده از کار افتاد
    (4مین از 14 ژوئیه)، 135 کشتی بازگردانده شدند، 10 نفتکش سایه منهدم شدند. رضایی
    (شورای عالی امنیت ملی) یکشنبه: پاسخ آمریکا «ناکافی»، آمریکا «برخی شرایط را پذیرفته»،
    ایران «دیگر پاسخ نمی‌دهد». گلدمن: صادرات خلیج فارس با احتساب جریان‌های AIS خاموش
    به 22-23 mb/d بازگشته (میانگین 2025؛ نفت خام عربستان ~12 mb/d، ایران صفر)، فرآورده‌ها
    در نصف، برنت تاریخ‌دار ~120 = صرف ریسک، نه بشکه‌ها؛ JPM 89%. نفت هیچ‌یک از رویدادهای
    نظامی آخر هفته را قیمت‌گذاری نکرد: برنت 102.84 (-1.8%) بر اثر «آتش‌بس انرژی» روسیه-اوکراین
    ترامپ (ظرف چند ساعت مورد اختلاف - نیروگاه CHP-5 خارکیف هدف قرار گرفت؛ کرملین ساکت)
    و توافق 4.8mt دیزل روسیه. جانشین‌ها: bffc2a77 (ترتیبات، 0.7)، bb801f68 (غرب خلیج
    فارس، 0.6)، ef8476cc (اسکورت‌ها، 0.7)؛ جانشین خویشتن‌داری عربستان در بند «پاسخ
    اعلام‌شده علیه ایران» در 17921803 ادغام شده است. 13 اکتبر (گزارش سه‌شنبه): شش
    شناور در 11 اکتبر هدف قرار گرفتند (UKMTO 164-26 تا 169-26؛ gcaptain/MarEx دوشنبه
    18:41-19:27Z، چهار مورد با تأخیر زمانی): پنج مورد در عبور از تنگه (4 نفتکش خروجی
    + 1 کشتی کانتینری ورودی، «پرتابه‌های ناشناس») + 1 نفتکش در لنگرگاه صحار (پهپاد)
    - همه شرق 54E، رده بدون تغییر، شدت ~6x نرخ جاری ~1/روز؛ JMIC: تهدید شدید، «در
    حال گسترش به لنگرگاه‌ها و داخل خلیج فارس»؛ NCAGS حدود ~29 عبور/روز در برابر 138
    تاریخی. مهر «3مین ابرنفتکش به مین خورد» = ادعای سپاه، تأییدنشده. وزیر انرژی عربستان:
    «پاسخ جدی» به حملات حوثی‌ها (متوجه یمن؛ یک سطر خلاصه investinglive می‌گوید «به
    تأسیسات نفت و گاز» - هیچ تأییدی از آرامکو/SPA/GACA درباره اصابت به گره نفتی وجود
    ندارد، ادعاهای آخر هفته حوثی‌ها درباره آرامکو تأییدنشده می‌مانند، قاعده 12)؛ تبدیل
    خط گاز در 7-8 هفته 1.2 mb/d به ظرفیت شرق-غرب اضافه می‌کند (بارگیری ینبع ~4.5 mb/d
    - بندر محدودکننده است)؛ مذاکرات سعودی برای رسمی‌کردن بارگیری‌های غیرهرمز در قراردادهای
    2027 (بلومبرگ)؛ ریاض از حمایت غرب سرخورده، فرانسه تجهیزات دفاعی به ینبع می‌فرستد،
    ترامپ درباره پیوستن به حملات علیه حوثی‌ها «ممکن است» (یمن، نه ایران)؛ IMF رشد
    2026 خلیج فارس را به‌دلیل بسته بودن هرمز کاهش می‌دهد؛ اقتصاد عربستان امسال -3.6%
    (بیانیه بودجه به نقل از بلومبرگ). وزارت خارجه ایران: پیام‌ها از طریق واسطه‌ها
    ادامه دارد، پاسخ پس از بررسی؛ «آمریکا برخی از هفت شرط را از طریق قطر پذیرفت -
    ناکافی». نفت: برنت دسامبر دوشنبه در 106.65 تسویه شد (افت آسیایی آتش‌بس تا 102.84
    کاملاً برگشت)، زنده 105.32 (-1.25%) بر اثر گفته نواک درباره 3-3.5mt دیزل تا پایان
    سال؛ زلنسکی: روسیه پس از اعلام آتش‌بس حمله کرد. 15 اکتبر: جبران عقب‌ماندگی نفت
    (investinglive، چهارشنبه 21:17Z): برنت در ~106 (+0.4%) تسویه شد، WTI ~95 (بالاترین
    حد 3 هفته‌ای)؛ گزارش ماهانه بازار نفت IEA - صادرات نفت خام خلیج فارس در سپتامبر
    +4.4 mb/d و به ~75% پیش از جنگ رسید (بدون ایران >81%، به رهبری عربستان)، صادرات
    ایران تحت محاصره صفر، تقاضای 2026 برابر -2.6 mb/d، عرضه -6 mb/d؛ «صرف ریسک مربوط
    به تهدید زیرساخت و کشتیرانی است، نه بشکه‌ها». شبانه: رویترز - یک مقام آمریکایی
    می‌گوید واشنگتن کاهش تحریم‌های نفتکش‌های ناوگان سایه را بررسی می‌کند تا نرخ‌های
    رکوردی حمل را پیش از انتخابات میان‌دوره‌ای 3 نوامبر پایین بیاورد - برنت 104-105.8
    (-1%). حوثی‌ها به یک ساختمان اداری آرامکو در ظهران حمله کردند (وزارت انرژی تأیید
    کرد، 13 اکتبر) و سخنگوی یمنی هشدار می‌دهد حملات به فرودگاه‌ها و تأسیسات نفتی «ادامه
    خواهد یافت» - قصد اعلام‌شده برای رده عرضه (ادعای جدید: هیچ اصابت به گره عرضه با
    تأیید سعودی تا یکشنبه 18 اکتبر، 0.65؛ عدم تحقق = شاخص درگیری نظامی 35). 17 اکتبر
    (گزارش شنبه): نفت جمعه +4% بدون عامل محرک (WTI 101.84، برنت 109.86، برای نخستین
    بار از مه به 110 رسید) - زنجیره انتقال: نگرانی از حمله آمریکا در آخر هفته پس از
    گزارش‌های MOAB، ترامپ «مخالفتی نشان نداد»؛ نفت آخر هفته را قیمت‌گذاری کرد، طلا
    نکرد (طلای نقدی بدون تغییر). گزارش هفتگی UKMTO (gcaptain): 12 حمله تا 14 اکتبر
    (10 هرمز / 1 خلیج فارس / 1 دریای عمان)، بیشتر شناورهای هدف‌گرفته‌شده گزارش نمی‌دهند،
    55/74 حمله پرتابه‌ای از 6 ژوئیه در مسیر جنوبی، عبورها 254/هفته (-70%)، 42 مورد
    روی AIS در برابر کوپر «~400 در 7 روز»؛ MT ST 3 در 16 اکتبر هدف قرار گرفت (خدمه
    سالم). حاتمی: تا رعایت حقوق بسته است؛ «طرح‌های عملیاتی جدید»؛ لاوروف هفته آینده
    به تهران. 91d78370 محقق شد (رده آمریکا، 8/8)، bb801f68 محقق شد (غرب 54E، 2/2).
    عربستان: >=18 کشته (بلومبرگ)، فرودگاه ملک خالد تا 17 اکتبر بسته، رهگیری‌ها جمعه؛
    بدون تأیید گره عرضه، بدون انتساب؛ فهرست «زیرساخت» ائتلاف همچنان 403/استخراج‌نشده.
    شاخص درگیری نظامی 30 حفظ شود؛ جانشین پیش‌بینی منفی حمله برای دوشنبه-جمعه ثبت شد؛
    بازه بازگشایی 4055-4310 با تصریح شرط حمله‌ای که آن را می‌شکند. یکشنبه 18 اکتبر
    (گزارش): خوانش آخر هفته انجام شد (قاعده 25). سپاه مدعی شد دومین نفتکش ~2M بشکه‌ای
    با AIS خاموش در یک «مسیر غیرمجاز» به مین برخورد کرده (دومین شناور از حرکت افتاده)؛
    نیروی دریایی ایران: یک نفتکش در حال سوختن و بی‌حرکت در دریای عمان، «تنگه باز نیست»
    - رویترز: بدون تأیید مستقل، UKMTO ساکت -> محرک مین فعال نشده؛ aa7d1d8f (هیچ مین
    تأییدشده از یکشنبه تا جمعه، 0.65). شناورهای جبیل: بدون نام/پرچم/انتساب، بدون شناور
    سوم در غرب 54E -> 55f22cae (شرط‌بندی مکانی، 0.5). ترامپ (گردهمایی کنتاکی): جنگ
    «خیلی سریع تمام می‌شود»؛ عراقچی (سازمان همکاری اسلامی بغداد): طرح هفت‌روزه از
    طریق قطر «نزد واشنگتن» است - لفاظی، بدون متن، bffc2a77 در مسیر تحقق. SPA یکشنبه:
    پهپادها بر فراز منطقه شرقی/ریاض + 2 موشک بالستیک به‌سوی خمیس مشیط سرنگون شدند؛
    هشدار تلفنی ریاض؛ هشدار فرودگاهی سفارت آمریکا؛ توصیه وزارت خارجه بریتانیا به پرهیز
    از همه سفرهای غیرضروری؛ سیسی خواهان اختیار پارلمان برای اقدام دفاعی به نفع عربستان
    «در صورت درخواست»؛ مخبر به سعودی‌ها می‌تازد - بدون انتساب، بدون گره عرضه (17921803،
    0d2cc4fd در مسیر تحقق). شاخص درگیری نظامی 35 حفظ شود؛ خوانش بازگشایی ابتدا نفت
    را می‌سنجد (برنت <~107 = کاهش عرضه؛ >=109 = ادعاهای مین باور شده‌اند = زنجیره).
    گزارش دوشنبه 19 اکتبر: آخر هفته لفاظی آورد، نه اقدام - ردیف بازگشایی 4194.5 (بازه
    محقق شد، 7/8)، برنت با معافیت روسیه -1.7% تا ~108 (بین خوانش کاهش عرضه <107 و
    زنجیره >=109؛ موربان +3% تا 113.4 - صرف ریسک به گرید خلیج فارس منتقل می‌شود).
    ادعاهای مین سپاه همان دو مورد، هر دو شنبه 17 اکتبر، تأییدنشده (aa7d1d8f در مسیر
    تحقق)؛ UKMTO یکشنبه: یدک‌کش در شمال شرق خورفکان هدف قرار گرفت (شرق 54E)، تیراندازی
    قایق کوچک به نفتکش LNG نزدیک المکلا. 17921803 / bffc2a77 / ef8476cc / 0d2cc4fd
    همگی محقق شدند؛ جانشین‌ها برای دوشنبه 19 تا یکشنبه 25 ثبت شدند. رشته جدید: محبی،
    سخنگوی سپاه، «زمین سوخته» در صورت حمله به زیرساخت انرژی ایران؛ ترامپ از نتانیاهو
    برای انتخابات 27 اکتبر حمایت می‌کند («مأموریت را کامل کنید»). حمله به سایت‌های
    انرژی ایران با تأیید ارتش اسرائیل/اسرائیل = شاخص درگیری نظامی 40 با این بند (ابتدا
    برنت، سپس علامت اوراق 2 ساله)؛ سابقه مربوط به این رده استخراج نشده - هنوز ادعایی
    نیست. شورای دفاع ملی مصر مأموریت دفاعی نیروها به عربستان را تصویب کرد (بکری، نماینده
    مجلس؛ ریاست‌جمهوری مبهم‌تر). گزارش سه‌شنبه 20 اکتبر: اطلاعات ثبت‌شده بدون تغییر،
    ادعاها و اعلام‌ها افزایش یافته. نیروی دریایی ایران مدعی حمله آمریکا به پایگاه
    دریایی کنارک است («دو پرتابه سبک»، دو زخمی) - سنتکام/وزارت دفاع ساکت (df0e8755
    در مسیر تحقق)؛ حوثی‌ها مدعی شش حمله در 48h از جمله آرامکوی ینبع + میدان شیبه هستند
    - «عربستان تأیید نکرد» (fxempire)؛ ریاض FII را به 2027 و دو رویداد نوامبر را به
    تعویق انداخت، وزارتخانه‌ها دورکار، فرودگاه ملک خالد «تا اطلاع ثانوی» بسته (5c2c638f
    / 799938fb در مسیر تحقق، فشار رو به افزایش). حمله بالستیک حوثی‌ها 53 نفر را در
    اردوگاه دولت یمن کشت (شبوه). کاتس 18 اکتبر (از طریق نامه ایران به سازمان ملل):
    در هر جنگ جدید «همه تأسیسات انرژی» هدف قرار می‌گیرند، «عصر حجر»؛ ایران به ماده
    51 استناد می‌کند؛ FT: مقام‌ها آشکارا موافق بمب هستند (>50%)، حکم جدید رهبر ممکن
    است. تماس ترامپ-نتانیاهو (پیروزی «عظیم» 27 اکتبر). کانال‌ها: لاوروف دوشنبه (بدون
    متن)، منیر سه‌شنبه (میانجیگری در دستور کار)، «پیشنهادهای جدید» قطری (فقط منابع)؛
    ترامپ: روسیه/چین «خیلی کم» = «بسیار مثبت». نفت: GS صرف جنگ $25، دسامبر $90؛ ذخایر
    راهبردی نفت 283mb (کمترین از 1982)؛ برنت پس از نوسان 106.8-110.7، با کاهش در 109.55
    تسویه شد. شاخص درگیری نظامی 35 حفظ شود؛ رده حمله انرژی اکنون محرک اعلام‌شده هر
    دو طرف است (قاعده 21) - خط تغییر به 40 پابرجاست، بدون ادعا. گزارش چهارشنبه 21
    اکتبر: کانال از سوی تهران و دوحه با قالبی مشخص علناً تأیید شده است - عراقچی (الاخباریه):
    مذاکرات غیرمستقیم از طریق پاکستان و قطر، ابتکار هفت‌روزه تنگه را در روز ششم باز
    می‌کند، واشنگتن «با شرایط موافقت کرد اما مفاد بیشتری می‌خواست»؛ الانصاری: «مشارکت
    هر دو طرف». «پیشنهاد سازش» العربی که فقط به منابع متکی بود (بهره نگهداری‌شده نزد
    قطر، بازدید محرمانه آژانس بین‌المللی انرژی اتمی، «تأیید آمریکا»، حمل‌شده توسط
    منیر) WTI را به 95.25 و اوراق 10 ساله را به 5.073 رساند، پیش از آنکه «توافق نزدیک
    نیست» ظرف دو ساعت آن را برگرداند. موانع خود تهران: رضایی - هیچ اورانیومی خارج
    نمی‌شود، هیچ مذاکره‌ای پیش از اقدامات اعتمادساز؛ پزشکیان - رفع تهدیدها و تحریم‌ها
    پیش از مذاکرات. بدون تأیید آمریکا. پیش‌بینی منفی تأیید مشترک برای چهارشنبه 21-یکشنبه
    25 ثبت شد (0.7). شدت هرمز افزایش یافته (بلومبرگ: >=23 حادثه / >=5 موتورخانه در
    دو هفته، موشک‌ها بیش از پهپادها)؛ JMIC، 18 اکتبر: 153 حادثه از 1 مارس، 254 عبور
    (-70%) در برابر سنتکام ~400 / رایت 80%؛ ادعاهای مین «فاقد مستندات». برنت در 108.79
    (-0.76) تسویه شد؛ زنده 110.45 بر اثر کاهش ذخایر گزارش‌شده توسط API.'
