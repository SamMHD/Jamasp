- theme: warsh-credibility
  why_fa: 'کانال کاهش ارزش پول - بهترین توضیح برای طلای بالای $4,000 در برابر بازده
    واقعی مثبت (DFII10 2.68). 16 سپتامبر: افزایش نرخ بهره با وجود فشار سیاسی، با رأی
    12-0 اجرا شد - مثبت برای اعتبار؛ خط ابطال خود این مضمون محقق شد (30y برابر با
    -1.3bp در کنار 2y برابر با +12bp، طلا -1.9%، دلار با عبور از 100). 18 سپتامبر:
    نشانه یک بار ظاهر شد - طلا +0.96% در کنار 2y برابر با +6.6bp، 10y برابر با 5.00،
    30y برابر با +3bp، DXY بدون تغییر، BTC برابر با +6%. اصلاحیه 19 سپتامبر: در سطح
    هفته، منحنی این الگو را نشان نمی‌دهد (actionforex: ‏2y برابر با +12.6، ‏10y برابر
    با +3.1، ‏30y برابر با -2.9). 21 سپتامبر - نشانه مخالف: طلا -0.8% (نقدی) / -1.0%
    (قیمت پایانی Globex) در کنار 2y برابر با +0.75bp، ‏10y برابر با -4.5bp، ‏30y برابر
    با -4.7bp، ‏DXY برابر با +0.1 و BTC با +7.1% تا بالاترین سطح هشت‌ماهه، در کنار
    رکورد Nasdaq (Meta برابر با +12%، ‏AMD برابر با $1tn) - جریان سرمایه ناشی از کاهش
    ارزش پول/کمیابی به سمت BTC و سهام هوش مصنوعی رفت، نه طلا، در جلسه‌ای که دو نفتکش
    در هرمز هدف قرار گرفتند و نفت -3.7% بود. شرط دوشنبه برآورده نشد (طلا نزولی، 2y
    صعودی): خطوط ابطال مشخص‌شده این مضمون محقق شده‌اند و 1889819a روز سه‌شنبه در مسیر
    تحقق بسته می‌شود. نشانه‌ها: 2 موافق / 14 مخالف. مقدار پایه به‌عنوان وزن باقی‌مانده
    روی 20 می‌ماند؛ اگر جانشین 1889819a (ثبت‌شده در 22 سپتامبر، تا دوشنبه 28 سپتامبر)
    نیز بدون نقض پیش برود، به 15 می‌رسد. تأییدها (مقدار پایه 30): دو جلسه متوالی با
    صعود هر دو، همراه با صعود 30y؛ بسته‌شدن 30y در >=5.40 همراه با صعود طلا (aec5cc8b
    محقق نشد)؛ طلا +1% در جلسه‌ای با افت نفت و 2y بدون تغییر (زنجیره از سمت طلا شکسته
    شود). اقدام ترامپ در قبال وارش که با صعود طلا/صعود 2y قیمت‌گذاری شود، تأیید دیگر
    است (قاعده 7 برای زمان‌بندی سقف تعیین می‌کند).'
