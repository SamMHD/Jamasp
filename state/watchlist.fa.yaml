  why_fa: 'دو وضعیت: کنترل سپاه پاسداران بر عبور و مرور هرمز در برابر محاصره آمریکا،
    همراه با تبادل آشکار آتش از 30-31 اوت، و جبهه دوم دریای سرخ که در 19 سپتامبر به
    ریاض رسید (موشک حوثی‌ها، رهگیری‌شده). 22 سپتامبر - مسیر مذاکرات باز شد: هیئت عراقچی
    و ویتکاف/ کوشنر یک دور مذاکره با میانجی‌گری را در سازمان ملل به پایان رساندند
    (قطر و پاکستان در رفت‌وآمد میان طرفین)؛ ترامپ: حدود 3 ساعت، «سازنده»، دور دیگری
    «به‌زودی»، اما توافق «درست پس از انتخابات» و «نابود کردن» به‌عنوان گزینه جایگزین؛
    ویتکاف (X): غیرمستقیم، یک دور تکمیل شد، میانجی‌گری ادامه دارد؛ تلویزیون دولتی
    ایران: تهران درخواست ویتکاف را پذیرفت، «شرایط سخت‌گیرانه» منتقل شد؛ NYT (2 مقام
    ایرانی): عراقچی با ویتکاف+کوشنر دیدار کرد؛ شبکه 12 اسرائیل: بر سر بیشتر اختلافات
    توافقی حاصل نشد؛ منبع العربیه: «بن‌بست شکسته شد». شرایط ایران (تسنیم): پایان جنگ
    در تمام جبهه‌ها، جدول زمانی خروج از جنوب لبنان، وجوه مسدودشده، رفع محاصره و تحریم‌های
    جدید، معافیت نفتی - همان تفاهم‌نامه قدیمی. فارس: آمریکا «هیچ خط قرمزی باقی نگذاشته
    است»، آماده همه سناریوها هستیم. پیش‌تر در سه‌شنبه، گزارش کیودو درباره «بازگشایی
    هرمز ظرف 7 روز» توسط فارس تکذیب شد. 645cc78a ناموفق (نخستین شکست این خانواده؛
    درس مربوط به قید قالب ثبت شد). هرمز: آخرین اصابت‌ها دوشنبه 21 سپتامبر (LR Stephanie،
    جزیره من؛ یک کشتی حامل LPG) - هیچ‌کدام مرتبط با عربستان نبودند؛ در 22-23 سپتامبر
    کشتی جدیدی نبود (جست‌وجو شد)؛ شمار عبورهای هرمز در AIS «دو» (Investing.com، 22
    سپتامبر) در برابر بارگیری حدود 12m بشکه‌ای عربستان در یک روز و راه‌اندازی مجدد
    خط لوله شرق-غرب (به‌صورت جزئی) - جریان‌ها به خارج از پوشش AIS و مسیرهای دورزننده
    تنگه منتقل شدند. پادشاه عربستان در مجمع عمومی سازمان ملل «هدف گرفتن مکه» توسط
    حوثی‌ها را محکوم کرد (همان پهپاد قبلی، رویداد جدیدی نیست)؛ فرانسه در حال بررسی
    قطعنامه شورای امنیت درباره هرمز است؛ اتحادیه اروپا به دنبال تجهیزات و نیرو برای
    دریای سرخ است؛ بریتانیا به عربستان پیشنهاد سوخت‌رسانی می‌دهد. تا 23 سپتامبر 03:30Z
    هیچ گزارش رسمی از گفت‌وگوی ترامپ و شورای همکاری خلیج فارس در پایگاه داده نبود
    (جست‌وجو شد، موجود نیست). نردبان: زیرساخت خارگ/لارک d96debd5 (تا 26 سپتامبر)؛
    رژیم مورد نظر کشورهای حاشیه خلیج فارس 2df323fa (تا 26 سپتامبر)؛ خویشتن‌داری عربستان
    33defb45 (تا 27 سپتامبر)؛ اسکورت‌ها d4f5ffd6 (تا 27 سپتامبر)؛ کشتی سعودی 9e629d6e
    (چهارشنبه 23:59Z بسته می‌شود، در مسیر تحقق)؛ 0d52e7da (نبود دیدار ترامپ-پزشکیان
    با تأیید مشترک یا دور دوم مستقیم از چهارشنبه تا یکشنبه، 0.65) - به‌محض آنکه دور
    دوم توسط هر دو طرف تأیید شود، در مسیر عدم تحقق قرار می‌گیرد. نشانه‌ها: اعلامی
    از میزبان قطری/پاکستانی همراه با مکان+تاریخ (-> فعال‌سازی بررسی عمیق)؛ دیدار ترامپ-پزشکیان
    با تأیید مشترک؛ هرگونه دستور حمله آمریکا؛ گزارش‌های SPA درباره خسارت؛ متوقف شدن
    یک کشتی تحت اسکورت همراه با تلفات (پله بعدی نردبان). 24 سپتامبر: چهارشنبه - دور
    دومی برگزار نشد؛ مقام ارشد (رویترز): اگر آمریکا فشار را کاهش دهد و محاصره بنادر
    را بردارد، هرمز می‌تواند ظرف یک هفته بازگشایی شود، «اختلافات فراوان»؛ رضایی: تا
    تحقق شرایط بسته می‌ماند؛ برنت در 103.08 (+3.9%) تسویه شد. طی شب: نقشه راه ایران
    (گلف نیوز، منابع منطقه‌ای، تأییدنشده توسط هر دو دولت) - آتش‌بس تا 60 روز در سراسر
    منطقه، بازگشایی مرحله‌ای هرمز، توقف حملات به همسایگان عرب، جدول زمانی مذاکرات
    گسترده‌تر؛ روبیو «پذیراست»، گزینه‌های نظامی حفظ می‌شوند. تسنیم (مرتبط با سپاه):
    تماس عراقچی-ویتکاف از سوی نهادهای سیاست‌گذار «مجاز نبوده است»؛ وزارت خارجه: با
    میانجی‌گری قطر، شرایط منتقل شد - اکنون اختیار طرف ایرانی عامل تعیین‌کننده است.
    Cape Dao (23 سپتامبر): کشتی فله‌بر با مدیریت اماراتی و بدون اسکورت، یک دریانورد
    هندی کشته شد، بدون انتساب به آمریکا (dd31b40f تا جمعه فعال است). 9e629d6e محقق
    شد (خانواده 10/10؛ جانشینی برای کشتی سعودی نوشته نشد - بارگیری ینبع بدون پاسخ
