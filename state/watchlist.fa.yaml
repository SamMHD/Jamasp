  why_fa: 'ین یکی از ستون‌های تقاضای ناشی از کاهش ارزش پول بود: USDJPY پس از مداخله
    ناموفق اوت در 159-160 ثابت مانده بود؛ این وضعیت در 3-8 سپتامبر شکست (160.4 ->
    153.3). 18 سپتامبر: بانک ژاپن نرخ بهره را به 1.25% افزایش داد (بالاترین سطح از
    1995)، با رأی 7-2، بدون زمان‌بندی؛ اوئدا: «مرحله سیاست‌گذاری تغییر کرده است»؛
    اجماع بازار: یک افزایش نرخ بهره در هر فصل، نرخ نهایی 1.75-2%. جریان بازار: استعلام
    نرخ بانک ژاپن در 158.05 - خط دفاعی 158 است، نه 160. 23 سپتامبر: USDJPY در 157.62
    (سقف بازه 157.94)، توکیو سه‌شنبه/چهارشنبه تعطیل است (معاملات کم‌حجم هفته تعطیلات؛
    طبق داده‌های CFTC، صندوق‌های پوشش ریسک برای نخستین بار از ژوئیه 2025 خالص موقعیت
    خرید ین دارند). طلا مستقیماً هیچ اثری از ین نمی‌گیرد (بررسی عمیق #56: اثر ین فقط
    از مسیر DXY به طلا می‌رسد؛ DXY در 100.65، با +0.26% در 22-23 سپتامبر، کل حرکت
    شبانه طلا را توضیح می‌داد). در کنار FOMC بخوانید: یک شکاف نرخ بهره در حال گسترش،
    هر دو سمت به نفع دلار - معامله بر مبنای نرخ‌های نسبی، نه کاهش ارزش پول؛ هیچ بانک
    مرکزی دیگری در این شرایط به سمت تسهیل نمی‌رود (ناگل/لین از ECB در 22 سپتامبر،
    اجماع برای SNB در پنج‌شنبه تثبیت نرخ است). باز: be4d6b22 (عدم ثبت USDJPY در >=160
    تا پنج‌شنبه 24 سپتامبر 23:59Z، 0.55؛ 1.5% حاشیه). نشست بعدی بانک ژاپن 30 اکتبر،
    دو روز پس از FOMC در 28 اکتبر است. تغییر سناریو: >=160 با عبور از سد وزارت دارایی
    = بازگشت ستون، مبنا 30؛ <152 همراه با افت Nikkei+BTC = رژیم نقدینگی. 24 سپتامبر:
    USDJPY در 157.93 (سقف چهارشنبه 158.36 - عبور درون‌روزی از خط استعلام نرخ 158،
    هیچ اقدامی از وزارت دارایی گزارش نشد)؛ PMI مقدماتی ژاپن در پایین‌ترین سطح چهارماهه
    با فشار قیمتی «شدید»؛ actionforex: رشد افت می‌کند، در حالی که ین ضعیف تورم را
    بالا نگه می‌دارد. be4d6b22 پنج‌شنبه 23:59Z با ~2 ین حاشیه بسته می‌شود. DXY در
    101.08 - ین محرک حرکت دلار نیست؛ ستون همچنان فروریخته است. 25 سپتامبر: be4d6b22
    محقق شد - بیشینه بازه 158.949 (پنج‌شنبه 15:16Z)، هیچ نرخ 160 ثبت نشد. کاتایاما:
    ترامپ نگرانی‌های مربوط به ین ضعیف را با تاکایچی مطرح کرد، USD/JPY به زیر 158.50
    کاهش یافت (158.43 در 03:16Z). گلدمن با توجه به سیاست انقباضی بانک ژاپن، مسیر پیش‌بینی‌شده
    USD/JPY را به 150 در یک سال کاهش می‌دهد؛ دایوا: افزایش بعدی نرخ بهره بانک ژاپن
    در دسامبر؛ بازده JGB ده‌ساله در بالاترین سطح از 1996. ستون همچنان فروریخته است:
    دلار معامله‌ای مبتنی بر بازده‌های آمریکا است و اثر سمت ین فقط از مسیر DXY (101.26)
    به طلا می‌رسد. هیچ ادعای جایگزینی وجود ندارد - آزمون 158/160 در حالی که DXY به‌دلیل
    بازده‌ها افزایش می‌یابد، هیچ اطلاعاتی برای طلا ندارد. 26 سپتامبر: مداخله کلامی
    - USDJPY با -150 پیپ به 157.19 رسید (جمعه)، در واکنش به هشدارهای کلامی مقام‌ها
