  why_fa: 'کف ساختاری تقاضا: ~289t تقاضای رسمی در این چرخه، همراه با ازسرگیری ورود
    سرمایه به ETFها، و تنوع‌بخشی به ذخایر با خروج از اوراق خزانه به‌عنوان همتای آن
    در سمت جریان‌ها (دارایی‌های UST چین در پایین‌ترین سطح از 2008؛ ذخایر چین در اوت
    دوباره افزایش یافت؛ UBS در 9 سپتامبر بر پیش‌بینی بلندمدت خود پابرجاست؛ گلدمن در
    18 سپتامبر هدف $5,400 را با وجود افزایش نرخ بهره حفظ می‌کند). واکنش انتقال محل
    نگهداری در حال گسترش است (انتقال 86t توسط DNB به لندن، و پیش‌تر فرانسه)؛ 18 سپتامبر:
    ونزوئلا و یک جناح مخالف در حال بررسی توافقی برای انتقال $4bn طلا از لندن به آمریکا
    هستند (منابع) - این جریان جابه‌جایی محل نگهداری است، نه تقاضا. در سوی مقابل: روسیه
    فروشنده‌ای مستمر است. کف: 4300 در GC (~4255 نقدی) - آزمون‌ها در 14 سپتامبر 4305.9،
    در 15 سپتامبر 4304.0، در 16 سپتامبر تیک 22:19Z در 4296.7، سپس بازگشت به 4424.9
    تا جمعه 18 سپتامبر. کف‌ها در این رژیم 8/8 بار حفظ شده‌اند (63bf960c هشتمین مورد،
    کف جمعه 4378) - اما هر جهش با عقب‌نشینی نفت از سقف‌هایش یا جلسه‌ای با کاهش بازده‌ها
    همراه بود؛ جهش جمعه نخستین مورد در جلسه‌ای با افزایش بازده‌ها بود، اما همچنان
    خرید در افت، دقیقاً روی خط و در روز افزایش نفت، نبود. آزمون نهم: d571e0f0 (هیچ
    ردیف GC_CLOSE با مقدار <=4326.5 در دوشنبه/سه‌شنبه وجود ندارد، 0.55) طی بازگشایی
    ریاض. تأییدکننده‌ها: گزارش‌های ماهانه WGC حاکی از خرید خالص در طول افت؛ خرید در
    افت در محدوده 4300-4326 در روز افزایش نفت. ابطال‌کننده‌ها: دو ماه متوالی فروش
    خالص بخش رسمی.'
