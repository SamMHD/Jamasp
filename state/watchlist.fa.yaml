    4300. 26 سپتامبر: 717f560c محقق شد - کف‌ها در این رژیم 10/10، همگی در 0.55 (ردیف‌های
    4325.5 / 4309.5 / 4321.2؛ کف تیک پنجشنبه 4282.9 در جلسه‌ای با افزایش نفت از خط
