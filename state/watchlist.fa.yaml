  why_fa: 'تنها مسیر صعود طلا در رژیم 15/60/25: یک رویداد نقدینگی که بخش کوتاه‌مدت
    منحنی بازده را پایین بکشد (سهام -2% همراه با افت هم‌زمان Nikkei و BTC، اوراق 2ساله
    -15bp، USDJPY <156) - طلا از مسیر اوراق 2ساله بالا می‌رود، نه از مسیر تقاضا برای
    دارایی امن. از 22 سپتامبر به‌عنوان کانال سوم نام‌گذاری شده؛ در 24 سپتامبر سطرهای
    جداگانه‌ای به آن اختصاص یافت، چون چهارشنبه نخستین ترک‌ها نمایان شد: S&P -0.75%،
    Russell -1.8%، افت Nasdaq در شرایط بازده 5.11% اوراق 10ساله؛ MarketWatch: محدودترین
    گستره مشارکت سهام از زمان اوج دات‌کام؛ جمع‌بندی investinglive: استفاده از تعبیر
    «شکستن سد» درباره اوراق قرضه؛ BTC 84.3K (-2.6% پس از +14% در طول هفته، ورود سرمایه
    به ETF حدود $1bn در روز - همان جریان سرمایه‌ای که در 21-22 سپتامبر از طلا پیشی
    گرفت)؛ USDJPY 157.93 در برابر سطح 158 بانک مرکزی ژاپن برای استعلام نرخ و سطح 160
    وزارت دارایی ژاپن؛ برآورد اولیه PMI ژاپن در پایین‌ترین سطح چهارماهه؛ بیکاری استرالیا
    4.6% (بالاترین میزان از 2021). تأیید می‌کند (سناریوی نزولی نرخ بهره 50، پایه 20):
    تحقق هم‌زمان مجموعه محرک‌های بالا در یک جلسه معاملاتی، همراه با صعود طلا. باطل
    می‌کند (سناریو کنار گذاشته می‌شود): دو هفته رکوردزنی سهام با بازده اوراق 2ساله
    >=4.85 و طلای بدون تغییر؛ یا ترک ظاهر شود و طلا همراه با همه‌چیز سقوط کند (رژیم
    فراخوان وجه تضمین - برداشت kinetic-transmission-inverted غالب می‌شود). 25 سپتامبر:
    نخستین داده در این مسیر - investinglive/Reuters: بازده اوراق 10ساله در 5.2 «در
    حال آزمودن میزان تحمل بازار سهام است» و در حالی که Nasdaq نزدیک رکوردهاست، بر
    ارزش‌گذاری‌های هوش مصنوعی فشار می‌آورد. پنج‌شنبه: S&P -0.02% با Meta +4.5% که
    «سهام زیان‌ده را پنهان می‌کند» (Arm -7.9%)، Dow -0.31%، Russell -0.11%، اروپا
    با افت 0.2-0.9%؛ Nikkei در جمعه به‌واسطه سهام تراشه‌سازان +1.2%؛ BTC بدون تغییر
    در 84.3K (بازگشت صعودی اواخر معاملات سهام را دنبال نکرد). سیگنال رکود Oxford Economics
    چشمک می‌زند، در حالی که مخارج همچنان پابرجاست. مجموعه محرک‌ها محقق نشده است (به
