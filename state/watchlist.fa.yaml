  why_fa: 'بازخریدهای گسترش‌یافتهٔ اوراق بلندمدت خزانه‌داری (19 اوت) عملاً کنترل منحنی
    بازده هستند و بازار آن‌ها را به‌منزلهٔ کاهش ارزش پول تفسیر کرد - رژیم روندی طلا
    زمانی آغاز شد که بدهی آمریکا از $40tn گذشت. این ابزار در 9-10 سپتامبر در برابر
    دیدگان عموم شکست خورد (حراج اوراق 30ساله با بازده 5.308 «ضعیف» بود). 18 سپتامبر:
    «اوراق قرضه دوباره سقوط می‌کنند» - بازده 10ساله 5.00، 30ساله 5.328 - و طلا با
    دلارِ بدون تغییر افزایش یافت: یک جلسهٔ معاملاتی. 21 سپتامبر: بخش بلندمدت منحنی
    با افت -3.7% نفت صعود کرد (بازده 30ساله 5.280) و طلا افت کرد. 22 سپتامبر: حراج
    اوراق 2ساله ($69bn) با بازده 4.787 و دنبالهٔ 0.2 واحد پایه، رتبهٔ C، انجام شد
    - هیچ تنشی در بخش کوتاه‌مدت نبود؛ منحنی با افزایش 1.5-2.3 واحد پایه بسته شد (5ساله
    4.842، 10ساله 4.967، 30ساله 5.303؛ جمع‌بندی investinglive برای 10ساله -6 واحد
    پایه گزارش کرده بود - اختلاف در مبنای مقایسه؛ مبنا، نرخ پایانی CNBC است)، درحالی‌که
    طلای نقدی $22 افزایش یافت و ردیف بدون تغییر بود - بخش بلندمدت در هیچ‌یک از دو
    جهت پیشتاز طلا نیست. aec5cc8b در 23 سپتامبر محقق شد (از جمعه تا سه‌شنبه هیچ نرخ
    پایانی 30ساله‌ای >=5.40 نبود؛ سقف 5.311). پرلی (فدرال رزرو نیویورک): خرید اسناد
    خزانه «متوقف شده، تمام نشده است». زیر نظر بگیرید: حراج‌های 5ساله/7ساله در چهارشنبه/پنج‌شنبه
    (تأییدنشده، todo-185 - هیچ گزارش انتقال‌یافته‌ای در پایگاه داده نیست)، هرگونه
    اظهارنظر بسنت دربارهٔ انتشار اوراق (حضورهای او در 21-22 سپتامبر فقط دربارهٔ ایران/چین/گازوئیل
    بود)، و اینکه آیا بازده 30ساله در هیچ جلسه‌ای هم‌جهت با طلا حرکت می‌کند. 24 سپتامبر:
    بازده 30ساله در 5.402 بسته شد (CNBC) - نخستین بسته‌شدن بالاتر از 5.40 - همراه
    با بازده 10سالهٔ 5.114 (سقف از 2007) و 2سالهٔ 4.895: حرکتی در واکنش به PMI که
    ابتدا با افزایش بازده‌ها و کاهش شیب منحنی و سپس با جابه‌جایی موازی آن همراه بود،
    درحالی‌که طلا نزولی و دلار صعودی بود. بخش بلندمدت از آستانه عبور کرد و طلا آن
    را به‌منزلهٔ کاهش ارزش پول تفسیر نکرد (aec5cc8b پیش‌تر در پایان معاملات سه‌شنبه
    محقق شده بود). حراج‌های 5ساله/7ساله همچنان تأییدنشده‌اند (هیچ گزارش انتقال‌یافته‌ای
    در پایگاه داده نیست، todo-185). زیر نظر بگیرید: بسته‌شدن بازده 30ساله در >=5.45
    همراه با DXY نزولی و طلای صعودی، تنها ثبت معاملاتی است که سناریوی پایه را تغییر
    می‌دهد. 25 سپتامبر: این ابزار دوباره شکست خورد - خزانه‌داری دومین بازخرید خود
    در دو هفته را انجام داد و حراج 7ساله ($44bn) با دنبالهٔ 0.7 واحد پایه در 5.085%
    انجام شد؛ بازده 30ساله در 5.460 بسته شد (+5.9 واحد پایه، بالاترین سطح در 22 سال؛
    تصویر لحظه‌ای جمع‌بندی 5.478)، بازده 10ساله 5.163 (سقف از ژوئیهٔ 2007)، نرخ وام
    مسکن 7%. رویترز به نقل از investinglive: «بازخریدها و مداخله در بازار ین نتوانسته‌اند
    بازده‌ها را مهار کنند»؛ استراتژیست‌ها بیشترِ افزایش از مارس را به انتظارات افزایش
    نرخ بهرهٔ فدرال رزرو و مابقی را به رشد و نفت نسبت دادند؛ «6% برای بازده 10ساله
    در حال تبدیل‌شدن به آستانهٔ درد بعدی است». در سطح جهانی: استقراض بی‌سابقهٔ آلمان
    به میزان ~EUR525bn، بازده اوراق دولتی آلمان در سقف 17ساله، بازده اوراق دولتی 10سالهٔ
    ژاپن در سقف از 1996. طلا نزولی همراه با DXY صعودی - به‌منزلهٔ کاهش ارزش پول تفسیر
    نشد. تنها عامل تغییر سناریوی پایه: بازده 30ساله >=5.50 همراه با DXY نزولی و طلای
    صعودی. 26 سپتامبر: بازده 30ساله در 5.49 بسته شد (+2.8 واحد پایه، بالاترین سطح
    از 2004؛ طی روز 5.532)، بازده 10ساله 5.165 (طی روز 5.23، سقف از 2007)، فاصلهٔ
    بازده 2ساله تا 30ساله 63 واحد پایه (+12 واحد پایه در دو جلسه، هم‌زمان با افت بازده
    2ساله) - افزایش شیب منحنی همراه با افزایش بازده‌ها در روزی که دلار 0.22% افت کرد
    و طلا 0.27% افزایش یافت: اوراق بخش بلندمدت به دلایل خاص خود فروخته می‌شوند (عرضه،
    بازنگری‌ها، «6% مطرح است» به‌عنوان مطلب ضروری investinglive) و طلا، حتی با کناررفتن
    مانع دلار، همچنان آن را به‌منزلهٔ کاهش ارزش پول تفسیر نمی‌کند. جزئیات حراج 5ساله/7ساله
    همچنان تأییدنشده است (todo-185). پایان فصل چهارشنبه است. تنها عامل تغییر سناریوی
    پایه: بسته‌شدن بازده 30ساله در >=5.50 همراه با DXY نزولی و طلای صعودی. 27 سپتامبر:
    گزارش توضیحی CNBC (تیری ویزمن از مک‌کواری): بازده 10ساله در 5.23 «بیشتر به انتشار
    اوراق قرضه مربوط است تا داستان تورم» - تأمین مالی کسری بودجه به‌علاوهٔ بدهی برای
    مخارج سرمایه‌ای هوش مصنوعی (ونگارد: $132bn اوراق منتشرشده توسط Alphabet/Amazon/Meta/Microsoft/Oracle
    تا پایان ژوئیه، در برابر حدود ~$35bn در سال طی 2020-24؛ $300-570bn انتشار اوراق
    مرتبط با هوش مصنوعی در سال جاری)، «فدرال رزروی نداریم که به‌شدت در حال انقباض
    پولی باشد»، «این بازده‌ها می‌توانند بالاتر بروند». مسئلهٔ بخش بلندمدت، عرضهٔ اوراق
    با دیرش بالاست که بازار آن را به نفع دلار قیمت‌گذاری می‌کند - نشانهٔ مخالفِ طلا
    همچنان برقرار است (17 علیه / 2 موافق). actionforex: بازده 10ساله (سقف کانال 5.23،
    برآورد هدف 5.413) اکنون عامل کلیدی دلار است؛ توقف صعود، DXY را به 99.7-99.9 بازمی‌گرداند.
    جمعه: بازده 30ساله 5.49 همراه با DXY نزولی و رشد 0.3% طلا - یک واحد پایه و یک
    پله از نظر اندازهٔ حرکت کمتر از محرک base-25. جزئیات 5ساله/7ساله همچنان تأییدنشده
    است (todo-185). پایان فصل چهارشنبه است. تنها عامل تغییر سناریوی پایه: بسته‌شدن
    بازده 30ساله در >=5.50 همراه با DXY نزولی و طلای صعودی. 1 اکتبر: ترامپ چهارشنبه
    ساعت 20:00Z (Truth Social): پاول باید به‌دلیل بازسازی ساختمان مرکزی از هیئت‌مدیره
    استعفا دهد (>=$2.5bn طبق گزارش بازرس کل؛ پیش‌بینی خود او $3.5-4bn)، از بلانش،
    دادستان کل، خواسته شد بررسی کند و «تعیین کند چه اقدامی باید انجام شود»، و تهدید
    شد که در صورت ماندن او، دولت اقامهٔ دعوا خواهد کرد. موضعی که فقط یک عضو هیئت‌مدیره
    را هدف می‌گیرد (وارش دست‌نخورده) و معاملات، رشد 0.08% در DXY، افزایش +3.7 واحد
    پایه در بازده 30ساله و افت طلا را ثبت کردند - نشانهٔ مخالف، نه سلطهٔ مالی (18
    علیه / 2 موافق). شرط ابطال 288a87ac همچنان «اقدامی علیه وارش که به‌عنوان سلطهٔ
