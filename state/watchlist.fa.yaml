  why_fa: 'کف ساختاری تقاضا: ~289t تقاضای رسمی در این چرخه، همراه با ازسرگیری ورود
    سرمایه به ETF، و تنوع‌بخشی به ذخایر با خروج از اوراق خزانه به‌عنوان همتای آن در
    سمت جریان‌ها (دارایی‌های چین از اوراق خزانه آمریکا در پایین‌ترین سطح از 2008؛
    UBS در 9 سپتامبر پیش‌بینی بلندمدت خود را حفظ می‌کند؛ Goldman در 18 سپتامبر هدف
    $5,400 را با وجود افزایش نرخ بهره حفظ می‌کند). واکنش انتقال محل نگهداری در حال
    گسترش است (DNB، انتقال 86t به لندن و فرانسه؛ ونزوئلا در حال بررسی انتقال $4bn
    از لندن -> آمریکا). SGE برابر با 942/g (20 سپتامبر). در مقابل: روسیه فروشنده‌ای
    مستمر است؛ یک مؤسسه پژوهشی (investinglive، 23 سپتامبر) انتظار دارد به‌دلیل دلار
    + فدرال رزرو انقباضی، افت بیشتری در Q4 رخ دهد، اما ژئوپلیتیک و خرید رسمی یک «کف
    محکم در حدود $3,800» ایجاد کنند. کف در عمل: 4300 برای GC (~4265 نقدی) - آزمون‌ها
    در 14 سپتامبر 4305.9، در 15 سپتامبر 4304.0، در 16 سپتامبر تیک 4296.7 در 22:19Z،
    سپس بازگشت به 4424.9 در جمعه 18 سپتامبر؛ کف 4335.0 در 22 سپتامبر در واکنش به «نابودی
    یا توافق» ترامپ + بازگشت Brent به 100 حفظ شد، سپس ردیف 4402.2. d571e0f0 در 23
    سپتامبر محقق شد - کف‌ها در این رژیم 9/9، همگی با 0.55 ثبت شده‌اند (شکاف کالیبراسیون،
    منطق فاصله در قاعده 20)، و تک‌تک جهش‌ها با عقب‌نشینی نفت از اوج‌هایش یا جلسه‌ای
    با کاهش بازده‌ها همراه بوده‌اند؛ هنوز هیچ خریدی در افت قیمت دقیقاً روی خط، در
    روزی با افزایش نفت، دیده نشده است. آزمون دهم فعال است: 717f560c (هیچ ردیف GC_CLOSE
    با مقدار <=4300.0 از چهارشنبه 23 تا جمعه 25 سپتامبر نباشد، 0.55؛ 73 واحد زیر قیمت
    نقدی، 0.43x دامنه سه جلسه). تأییدکننده‌ها: خرید خالص در داده‌های ماهانه WGC در
    طول افت قیمت (خوراک داده wgc همچنان 503)؛ خرید در افت قیمت در محدوده 4300-4340
    در روزی با افزایش نفت. ابطال‌کننده‌ها: دو ماه متوالی فروش خالص رسمی. 24 سپتامبر:
    Goldman هدف پایان 2026 را به $4,650 کاهش می‌دهد و $5,400 را برای 2027 حفظ می‌کند
    (investinglive ICYMI) - سمت فروش رژیم نرخ‌های بهره در کوتاه‌مدت را می‌پذیرد. آزمون
    دهم کف فعال است: 717f560c از چهارشنبه جان سالم به در برد (ردیف 4325.5)؛ کف شبانه
    4309.0 در 02:06Z، نه واحد با خط فاصله داشت، در جلسه‌ای که بازده 2y ثابت بود -
    خریدی در افت قیمت دیده نمی‌شود، جهش به 4324 با Brent برابر با -1% در پی گزارش
    نقشه راه همراه شد. SGE برابر با 936.61 (21 سپتامبر)؛ چین جمعه تعطیل است + هفته
    طلایی در هفته آینده، بنابراین امکان رصد بازار فیزیکی از بین می‌رود. 25 سپتامبر:
    آزمون دهم کف - ردیف پنجشنبه 4309.5 (حفظ شد)، اما کف تیک 4282.9 در 15:35Z در جلسه‌ای
    با افزایش نفت و بازده ثابت 2y بود (در سطح تیک زیر 4300، نه بر مبنای ردیف؛ با همین
    تمایز ثبت شد). جهش از کف در پی گزارش توافق مرحله‌ای در 16:18Z (Brent برابر با
    -3) و طی شب با Brent برابر با -1% رخ داد - سفارش‌های خرید همراه با کاهش نفت، و
    همچنان هیچ خریدی در افت قیمت دقیقاً روی خط در روزی با افزایش نفت دیده نشده است.
    نرخ تثبیت PM برای XAU برابر با 4266.4، و AM برابر با 4255.55. آخرین جلسه 717f560c
    جمعه است. چین جمعه (جشن نیمه پاییز) و 1-8 اکتبر (هفته طلایی) تعطیل است: SGE خاموش،
    امکان رصد بازار فیزیکی برای یک هفته از بین رفته است - حمایت خرید کم‌رمق زیر هر
    آزمون 4300. 26 سپتامبر: 717f560c محقق شد - کف‌ها در این رژیم 10/10، همگی در 0.55
    (ردیف‌های 4325.5 / 4309.5 / 4321.2؛ کف تیک پنجشنبه در 4282.9 در جلسه‌ای با افزایش
    نفت از خط عبور کرد، اما ردیف عبور نکرد). این هفته هیچ ادعای فعالی درباره کف وجود
    ندارد (قاعده 20: سطح 4300 با ردیف 21 واحد / 0.15x دامنه دو جلسه فاصله دارد). نرخ
    تثبیت PM برای XAU در جمعه 4261.05، و AM برابر با 4290.75. چین از پنجشنبه، 1-8
    اکتبر (هفته طلایی)، تعطیل است: SGE خاموش، حمایت خرید فیزیکی زیر 4300 برای یک هفته
    کم‌رمق است. همچنان هیچ خریدی در افت قیمت دقیقاً روی خط در روزی با افزایش نفت دیده
    نشده است؛ جهش جمعه بخش حرکت همراه با کاهش نفت / کاهش بازده 2y بود.'
