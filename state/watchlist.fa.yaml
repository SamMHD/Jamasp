    هسته 0.3 (2.5). 4dfbd1d8 (شاخص کل >=0.4) هم اجماع و هم برآورد آنی را همراه خود
    دارد؛ 62c34dbd (هسته <=0.3) برآورد آنی را همراه خود دارد و اجماع در مرز آن است.
    شاخص قیمت تولیدکننده (PPI) پنجشنبه 15 اکتبر (اجماع 0.5). آزادسازی 100 میلیون بشکه‌ای
    G7/IEA (با تمرکز اولیه بر گازوئیل، در 20 روز نخست)، عاملی برای آمار اکتبر است،
    نه سپتامبر. 8 اکتبر: Brent دسامبر 102.32 (+2.1%) در ساعت 03:31Z پنجشنبه در پی
    توفان گرمسیری Isaias (4 تأسیسات Chevron + 5 تأسیسات Shell در خلیج مکزیک آمریکا
    تعطیل؛ Mars، Olympus، Ursa، Vito، Appomattox تخلیه شدند؛ حجم‌ها اعلام نشده) و
    نفتکش قطر؛ چهارشنبه پس از آمار EIA برابر با -3.19 میلیون بشکه در برابر انتظار
    +1.7، در ~100.20 تسویه شد (WTI برابر با 88.48، -0.96) - بازار در همان روز اثر
    تلفات ریاض و حمله قطر را پس گرفت. اعضای IEA از آزادسازی سریع‌تر ذخایر حمایت می‌کنند
    (The National)؛ کارگروه اتحادیه اروپا درباره برنامه G7 جلسه می‌گذارد؛ حاشیه سود
    گازوئیل >10%. نظرسنجی انتظارات مصرف‌کنندگان فدرال رزرو نیویورک: تورم مورد انتظار
    بنزین 4.8%. صورت‌جلسه: «هرچه قیمت انرژی مدت بیشتری بالا بماند، خطر» سرایت «بیشتر
    می‌شود» - نفت اکنون یک عامل ورودی صریح برای فدرال رزرو است (investinglive: «شوک‌های
    بیشتر عرضه، استدلال به نفع انقباض را تقویت می‌کند، به‌جای آنکه از اثرشان چشم‌پوشی
    شود»). شاخص قیمت مصرف‌کننده (CPI) در 14 اکتبر: اجماع شاخص کل 0.5، برآورد آنی 0.53.
    12 اکتبر: Brent دسامبر 102.84 (-1.80%، دامنه روزانه 102.33-105.63)، WTI برابر
    با 89.94 (-2.08%)، در پی «آتش‌بس انرژی» روسیه-اوکراین که ترامپ یکشنبه اعلام کرد
    (کی‌یف از طریق همان پست از آن مطلع شد؛ روسیه چند ساعت بعد نیروگاه CHP-5 خارکیف
    را هدف قرار داد؛ کرملین ساکت)، دو روز پس از توافق گازوئیل روسیه به حجم ~4.8 میلیون
    تن (36 میلیون بشکه) که قانون تحریم‌های ماه گذشته را معکوس می‌کند؛ مخالفت هر دو
    حزب (سناتور: «ممکن است غیرقانونی باشد»). Goldman: صادرات خلیج فارس به 22-23 میلیون
    بشکه در روز بازگشته، فرآورده‌ها در نصف سطح عادی، Dated Brent حدود ~120 در برابر
    قراردادهای آتی ~103 (صرف شکاف قیمت با میانگین $22/بشکه در سپتامبر، دومین رقم بزرگ
    ثبت‌شده)، سناریوی پایه Brent در پایان سال $85؛ JPM هشدار می‌دهد ناوگان نفتکش‌ها
    نزدیک به استفاده کامل است. عامل انتقال اثر اکنون فرآورده‌هاست (گازوئیل/سوخت جت)،
    نه نفت خام: توافق گازوئیل نخستین گشایش سمت عرضه در این بخش است. 4dfbd1d8 (شاخص
    کل >=0.4) و 62c34dbd (هسته <=0.3) چهارشنبه ارزیابی می‌شوند. شاخص قیمت مصرف‌کننده
    (CPI) 14 اکتبر: بنزین +9.1 ماه‌به‌ماه (انرژی +5.2، نفت گرمایشی +15.3، انرژی 20.4%
    سال‌به‌سال) = ~نیمی از شاخص کل 0.6 - 4dfbd1d8 محقق شد. انتقال اثر این ماه به هسته
    رسید (هسته 0.33: مسکن 0.4، کالاهای هسته 0.3، خدمات حمل‌ونقل 0.6، کرایه پرواز 1.2)
    - برداشت «از شوک عرضه چشم‌پوشی کن» حمایت سررسیدهای کوتاه‌مدت را از دست داد (بازده
    2 ساله +13.6 واحد پایه). مرحله بعد: شاخص قیمت تولیدکننده (PPI) پنجشنبه (خدمات
    هسته = ورودی‌های PCE) تعیین می‌کند آیا اثر به سنجه فدرال رزرو منتقل می‌شود؛ درآمد
    واقعی هفتگی -0.5% هزینه‌ای است که تقاضا می‌پردازد. 20 اکتبر: Goldman - صرف جنگ
    در Brent حدود ~$25/بشکه، دسامبر-26 برابر با $90 (از 85)، 2027 برابر با $80، صادرات
    خلیج فارس نزدیک میانگین‌های 2025، مازاد از سه‌ماهه 4؛ ذخایر راهبردی نفت SPR برابر
    با 283 میلیون بشکه، کمترین از اکتبر 1982 (<40% ظرفیت، ~200 میلیون بشکه باید بازگردانده
    شود)؛ رایت: کشتی‌های ناوگان تاریک ممکن است به تجارت قانونی منتقل شوند («ده‌ها
    تا صدها»)؛ Brent اکتبر-2027 برابر با $83 (+13 از سپتامبر)؛ برنامه $8 میلیاردی
    آمریکا برای گازوئیل کشاورزان (مالی). فرآورده‌ها، نه نفت خام، همچنان عامل انتقال
    اثر هستند؛ رقم نهایی انتظارات 5 ساله UMich در جمعه (مقدماتی 3.5%)، آمار انتظارات
    این هفته است. گزارش کوتاه جمعه 23 اکتبر: تسویه Brent در 113.17 (+4.0%، بالاترین
    سطح پنج‌ماهه)، WTI برابر با 99.47 - و بازده 2 ساله -19 واحد پایه: سررسیدهای کوتاه‌مدت
    نفت را شوک رشد تلقی کردند، نه شوک تورم (خبر مخابره‌شده: «خوراک فراوان برای طرفداران
    سیاست انقباضی... شاید رأی‌گیری با اختلاف آرا» در هفته آینده). ترامپ یادداشت DPA
    s303 را امضا کرد (تولید/پالایش نفت برای دفاع ملی ضروری است؛ تأمین مالی، خرید؛
    در ادامه اقدام آوریل؛ جزئیات منابع مالی نامشخص)؛ فروش نفتکش‌های درج‌شده در فهرست
    OFAC مجاز شد. رقم نهایی انتظارات 5 ساله UMich جمعه 14:00Z (مقدماتی 3.5%) و قیمت‌های
    پرداخت‌شده PMI مقدماتی در 13:45Z، آمار انتظارات روز هستند؛ PCE سپتامبر پنجشنبه
    29 در ساعت 12:30Z.'
