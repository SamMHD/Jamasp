- theme: central-bank-gold-buying
  why_fa: 'کف ساختاری تقاضا: ~289t تقاضای بخش رسمی در این چرخه، همراه با ازسرگیری
    ورود سرمایه به ETFها در کنار آن، و تنوع‌بخشی به ذخایر با خروج از اوراق خزانه به‌عنوان
    همتای آن در سمت جریان سرمایه (دارایی‌های اوراق خزانه آمریکا (UST) در اختیار چین
    در پایین‌ترین سطح از 2008؛ ذخایر چین در اوت دوباره افزایش یافت؛ UBS در 9 سپتامبر
    بر پیش‌بینی بلندمدت خود پابرجاست؛ گلدمن در 18 سپتامبر هدف $5,400 را با وجود افزایش
    نرخ بهره حفظ می‌کند؛ مطالب 21 سپتامبر دربارهٔ ''HALO''/''معامله بر مبنای کمیابی''
    روایت‌اند، نه جریان سرمایه). واکنش انتقال محل نگهداری در حال گسترش است (انتقال
    86t توسط DNB به لندن، و پیش‌تر فرانسه؛ 18 سپتامبر، ونزوئلا در حال بررسی انتقال
    $4bn از لندن -> آمریکا است - نگهداری، نه تقاضا). 21 سپتامبر: PBOC نرخ مرجع یوان
    را در قوی‌ترین سطح آن از فوریهٔ 2023 تعیین کرد - در حاشیه، قیمت طلا به CNY ارزان‌تر
    می‌شود (SGE برابر با 938.59/g، در 17 سپتامبر). در مقابل: روسیه فروشنده‌ای مستمر
    است. کف: 4300 در GC (~4255 نقدی) - آزمون‌ها در 14 سپتامبر 4305.9، در 15 سپتامبر
    4304.0، در 16 سپتامبر تیک 22:19Z برابر با 4296.7، سپس بازگشت به 4424.9 در جمعه
    18 سپتامبر. کف‌ها در این رژیم 8/8 دوام آورده‌اند، اما هر جهش با عقب‌نشینی نفت
    از اوج‌هایش یا جلسه‌ای با کاهش بازده‌ها همراه بوده است؛ هنوز خرید در افت درست
    روی این خط در روزی با صعود نفت رخ نداده است. 21 سپتامبر: کف دوشنبه 4361.3 (14:05Z)،
    بسته‌شدن Globex حدود ~4381، تثبیت قیمت بعدازظهر 4324.25 (-0.55%) - خط آزموده نشد؛
    میانگین متحرک 50روزه (50DMA) برابر با 4339.8 است، 42 واحد پایین‌تر از قیمت نقدی.
    آزمون نهم در جریان است: d571e0f0 (عدم ثبت GC_CLOSE <=4326.5 در دوشنبه/سه‌شنبه،
    0.55) - ردیف دوشنبه 4401.3، سه‌شنبه باقی مانده است. تأییدکننده‌ها: گزارش‌های ماهانهٔ
    WGC حاکی از خالص خرید در طول افت باشند (خوراک دادهٔ wgc همچنان 503)؛ خرید در افت
    در محدودهٔ 4300-4340 در روزی با صعود نفت. ابطال‌کننده‌ها: دو ماه متوالی خالص فروش
    بخش رسمی.'
