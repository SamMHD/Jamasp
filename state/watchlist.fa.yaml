  why_fa: 'بازخریدهای گسترش‌یافتهٔ اوراق بلندمدت خزانه‌داری (19 اوت) عملاً کنترل منحنی
    بازده هستند و بازار آن‌ها را به‌منزلهٔ کاهش ارزش پول تفسیر کرد - فاز روندی طلا
    زمانی آغاز شد که بدهی آمریکا از $40tn گذشت. این ابزار در 9-10 سپتامبر آشکارا شکست
    خورد (حراج اوراق 30 ساله در 5.308 «ضعیف» بود). 18 سپتامبر: «اوراق دوباره سقوط
    می‌کنند» - 10 ساله 5.00، 30 ساله 5.328 - و طلا با دلار بدون تغییر افزایش یافت:
    یک جلسه. 21 سپتامبر: بخش بلندمدت منحنی با نفت -3.7% صعود کرد (30 ساله 5.280) و
    طلا افت کرد. 22 سپتامبر: حراج اوراق 2 ساله ($69bn) در 4.787 با دنبالهٔ 0.2 واحد
    پایه تسویه شد، نمرهٔ C - بدون تنش در بخش کوتاه‌مدت؛ منحنی با افزایش 1.5-2.3 واحد
    پایه بسته شد (5 ساله 4.842، 10 ساله 4.967، 30 ساله 5.303؛ جمع‌بندی investinglive
    برای 10 ساله -6 واحد پایه ثبت کرده بود - اختلاف در مبنا، قیمت بسته‌شدن CNBC مبناست)
    درحالی‌که طلای نقدی $22 افزایش یافت و ردیف بدون تغییر بود - بخش بلندمدت در هیچ‌یک
    از دو جهت هدایت‌کنندهٔ طلا نیست. aec5cc8b در 23 سپتامبر محقق شد (هیچ بسته‌شدن
    اوراق 30 ساله در >=5.40 از جمعه تا سه‌شنبه رخ نداد؛ سقف 5.311). پرلی (فدرال رزرو
    نیویورک): خرید اسناد کوتاه‌مدت «متوقف شده، تمام نشده است». زیر نظر: حراج‌های 5
    ساله/7 ساله در چهارشنبه/پنج‌شنبه (تأییدنشده، todo-185 - هیچ گزارشی در پایگاه داده
    نیست)، هر اظهارنظر بسنت دربارهٔ انتشار اوراق (حضورهای او در 21-22 سپتامبر فقط
    دربارهٔ ایران/چین/گازوئیل بود)، اینکه آیا اوراق 30 ساله در هیچ جلسه‌ای هم‌جهت
