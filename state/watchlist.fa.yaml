    را در بر می‌گیرد باید قرارداد را نام ببرد، قاعده 17؛ a270f3f1 و 9e1829f8 سه‌شنبه
    بسته می‌شوند و تحت تأثیر نیستند)، WTI نوامبر 92.44 (-8% نسبت به هفته قبل از ~100.30؛
    actionforex: میانگین متحرک نمایی 55 روزه 89.14 و سطح اصلاحی 50% در 86.90 سطوحی
    هستند که شکستشان می‌گوید صعود ناشی از جنگ پایان یافته است - به آنها نرسیده). رد
    علنی ترامپ (شنبه)، برنامه‌ای را که صرف قیمت را تخلیه کرده بود کنار می‌زند؛ انتظار
    بازقیمت‌گذاری صعودی در بازگشایی یکشنبه می‌رود. بخش فیزیکی محدودتر شد، در حالی
    که صرف قیمت افت کرد (Kpler برابر با 33.7 میلیون در برابر 49.2 میلیون بشکه). تناقض
    بارگیری ینبع همچنان حل‌نشده است. تورم مورد انتظار یک سال آینده UMich برابر با
    4.6%. PCE چهارشنبه 12:30Z (اجماع 0.4/3.7، هسته 0.3/3.4): بررسی عمیق #62، بررسی
    میان‌دوره‌ای قاعده-11 را برای 4dfbd1d8 / 62c34dbd اجرا می‌کند (میانگین Brent سپتامبر
    ~103-105 در برابر ~90 اوت: ادعای شاخص کل >=0.4 در مسیر تحقق است؛ هسته <=0.3 به
    مسکن/سفر وابسته است). قیمت‌های پرداخت‌شده ISM پنجشنبه (اجماع 72). گزارش کوتاه
    30 سپتامبر: بررسی میان‌دوره‌ای قاعده-11 اجرا شد - Brent سپتامبر در تمام ماه در
    محدوده 100-109 تسویه شد (+10% ماه‌به‌ماه طبق مرور؛ سومین رشد ماهانه پیاپی WTI)،
    در برابر ~90 اوت: عامل سوخت برای شاخص قیمت مصرف‌کننده (CPI) سپتامبر پابرجاست،
    4dfbd1d8 (شاخص کل >=0.4) بر پایه سازوکاری فعال باز می‌ماند؛ در اطلاعات تازه، هیچ
    بازقیمت‌گذاری مخابراتی مخابره‌شده یا برآورد آنی مسکن وجود ندارد - 62c34dbd (هسته
    <=0.3) بر مبنای دلایل خود پابرجاست، تأییدنشده. شاخص قیمت مصرف‌کننده (CPI) استرالیا
    4.0% به‌دلیل سوخت (میانگین پیراسته 0.2)، همان انتقال اثر در خارج است؛ RBA برابر
    با 4.60، Westpac نوامبر را پیش‌بینی می‌کند. PCE امروز: اجماع 0.4/3.7، هسته 0.3/3.4،
    بازنگری‌های BEA در همان انتشار. Brent نوامبر چهارشنبه منقضی شد - ادعاهای تسویه،
    قرارداد دسامبر را نام می‌برند (قاعده 17). گزارش کوتاه 2 اکتبر: کانال نزولی نفت
    برای بخش فرآورده‌ها - آمریکا تهدید می‌کند صادرات گازوئیل را ممنوع می‌کند مگر اینکه
    اروپا «فوراً» ~120 میلیون بشکه آزاد کند؛ رایت «بسیار مطمئن» است اروپا آزادسازی
