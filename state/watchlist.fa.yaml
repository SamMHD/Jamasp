  why_fa: 'ین یکی از ستون‌های تقاضای ناشی از افت ارزش پول بود: USDJPY پس از مداخله
    ناموفق اوت در 159-160 تثبیت شده بود؛ این وضعیت در 3-8 سپتامبر شکست (160.4 -> 153.3).
    18 سپتامبر: بانک ژاپن نرخ بهره را به 1.25% افزایش داد (بالاترین سطح از 1995)،
    با رأی 7-2، بدون تعیین زمان‌بندی؛ اوئدا: «مرحله سیاست‌گذاری تغییر کرده است»؛ انتظار
