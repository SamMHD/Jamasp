- theme: kinetic-transmission-inverted
  why_fa: 'جنگ در قالب افزایش نرخ بهره فدرال رزرو و اخطار تأمین وجه تضمین به طلا می‌رسد،
    نه در قالب تقاضا برای دارایی امن. اکنون سیزده جلسه شواهد داریم: 2، 6، 7، 8، 10،
    11 سپتامبر، بسته‌شدن بازار نیویورک در 11 سپتامبر، بازگشایی 14 سپتامبر، 14، 15،
    16 سپتامبر، معاملات شبانه 17-18 سپتامبر، و بازگشایی 20 سپتامبر ساعت 22:00Z - ریاض
    (یک موشک رهگیری‌شده) باعث شد برنت با +0.8% و طلا دقیقاً بدون تغییر باز شود (نخستین
    قیمت ثبت‌شده 4424.9 = قیمت بسته‌شدن جمعه؛ ac946837 محقق شد، پنجمین آخر هفته با
    اقدام نظامی بدون شکاف قیمتی، خانواده باند 4/4). در مقابل: یک مورد (9 سپتامبر).
    مشاهده جدید، عدم تقارن است: وقتی نفت سپس با صادرات عربستان سعودی >4 میلیون بشکه
    در روز و گفته قطر مبنی بر اینکه «آمریکا توافق می‌خواهد»، تغییر جهت داد و -2.1%
    افت کرد، طلا نیز همراه آن -0.5% افت کرد، در حالی که بازده اوراق خزانه 2ساله در
    4.757 ماند - مسیر نفت نزولی -> بازده اوراق خزانه 2ساله نزولی -> طلای صعودی در
    بازده اوراق خزانه 2ساله مسدود است، زیرا فدرال رزرو راه نادیده‌گرفتن اثر تورمی
    را بست (اشمید، کشکاری). دریچه یک‌طرفه: افزایش نفت باعث فروش طلا می‌شود، کاهش نفت
    هیچ خریدی به همراه ندارد. ادعاها: 64c7ba41 (0.5) - در نخستین تسویه صعودی برنت
    در دوشنبه/سه‌شنبه، هیچ GC_CLOSE >= +1% رخ نمی‌دهد (دوشنبه در 03:30Z نفت صعودی
    نیست؛ سه‌شنبه اگر با افزایش تسویه شود؛ اگر هیچ‌کدام نباشد، نامشخص). تأیید می‌کند:
    تسویه صعودی نفت همراه با طلای بدون تغییر/نزولی؛ حمله آمریکا به ایران که با افت
    طلا قیمت‌گذاری شود؛ توافقی با تأیید طرف‌های مقابل که با نفت -5% و طلای بدون تغییر
    قیمت‌گذاری شود. ابطال می‌کند: محقق‌نشدن 64c7ba41 -> اقدام نظامی 35؛ دو بسته‌شدن
    متوالی با طلای صعودی / بازده اوراق خزانه 2ساله صعودی (محقق‌نشدن 1889819a)؛ طلای
    +1% در جلسه‌ای با نفت نزولی و بازده اوراق خزانه 2ساله بدون تغییر؛ رویدادی در عرضه
    که به‌صورت رکود تورمی معامله شود (بازده سررسیدهای بلندمدت صعودی، دلار نزولی، طلا
    صعودی).'
