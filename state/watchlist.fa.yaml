  why_fa: 'دو وضعیت: کنترل سپاه پاسداران بر عبور و مرور هرمز در برابر محاصره آمریکا،
    همراه با تبادل آشکار حملات نظامی از 30-31 اوت، و جبهه دوم دریای سرخ که در 19 سپتامبر
    به ریاض رسید (موشک حوثی‌ها، رهگیری‌شده). 22 سپتامبر - مسیر گفت‌وگوها باز شد: هیئت
    عراقچی و ویتکاف/کوشنر یک دور مذاکره با میانجی‌گری در سازمان ملل را به پایان رساندند
    (رفت‌وآمد میانجی‌گرانه قطر و پاکستان)؛ ترامپ: ~3 ساعت، «سازنده»، دور دیگری «به‌زودی»،
    اما توافق «درست پس از انتخابات» و «نابود کردن» به‌عنوان گزینه جایگزین؛ ویتکاف
    (X): غیرمستقیم، یک دور به پایان رسید، میانجی‌گری ادامه دارد؛ تلویزیون دولتی ایران:
    تهران درخواست ویتکاف را پذیرفت، «شروط سخت‌گیرانه» منتقل شد؛ NYT (2 مقام ایرانی):
    عراقچی با ویتکاف+کوشنر دیدار کرد؛ شبکه 12 اسرائیل: درباره بیشتر اختلاف‌ها توافقی
    حاصل نشده؛ منبع العربیه: «بن‌بست شکسته شد». شروط ایران (تسنیم): پایان جنگ در همه
    جبهه‌ها، جدول زمانی خروج از جنوب لبنان، وجوه مسدودشده، رفع محاصره و تحریم‌های
    جدید، معافیت نفتی - همان تفاهم‌نامه قدیمی. فارس: آمریکا «هیچ خط قرمزی باقی نگذاشته»،
    آماده همه سناریوها هستیم. اوایل سه‌شنبه، گزارش کیودو درباره «بازگشایی هرمز ظرف
    7 روز» از سوی فارس تکذیب شد. 645cc78a ناموفق (نخستین شکست این خانواده؛ درس مربوط
    به قید قالب ثبت شد). هرمز: آخرین اصابت‌ها دوشنبه 21 سپتامبر (LR Stephanie، جزیره
    من؛ یک کشتی حمل LPG) - هیچ‌کدام مرتبط با عربستان نبودند؛ در 22-23 سپتامبر کشتی
    جدیدی هدف قرار نگرفت (جست‌وجو شد)؛ شمار عبورهای هرمز در AIS «دو» (Investing.com،
    22 سپتامبر)، در برابر بارگیری ~12m بشکه‌ای عربستان در یک روز و راه‌اندازی مجدد
    خط لوله شرق-غرب (به‌صورت جزئی) - جریان‌ها به خارج از AIS و مسیرهای دورزننده تنگه
    منتقل شدند. پادشاه عربستان در مجمع عمومی سازمان ملل «هدف قرار دادن مکه» توسط حوثی‌ها
    را محکوم کرد (پهپاد قبلی، رویداد جدیدی نیست)؛ فرانسه در حال بررسی قطعنامه شورای
    امنیت سازمان ملل درباره هرمز است؛ اتحادیه اروپا به‌دنبال تجهیزات و نیرو برای دریای
    سرخ است؛ بریتانیا پیشنهاد سوخت‌رسانی به عربستان می‌دهد. تا 23 سپتامبر 03:30Z هیچ
    گزارشی از گفت‌وگوی ترامپ با شورای همکاری خلیج فارس در پایگاه داده نبود (جست‌وجو
    شد، موجود نیست). نردبان: زیرساخت خارگ/لارک d96debd5 (تا 26 سپتامبر)؛ نظام پیشنهادی
    در سمت خلیج فارس 2df323fa (تا 26 سپتامبر)؛ خویشتن‌داری عربستان 33defb45 (تا 27
    سپتامبر)؛ اسکورت‌ها d4f5ffd6 (تا 27 سپتامبر)؛ کشتی سعودی 9e629d6e (چهارشنبه 23:59Z
    بسته می‌شود، در مسیر تحقق)؛ 0d52e7da (عدم برگزاری دیدار ترامپ-پزشکیان با تأیید
    هر دو طرف یا دور دوم مستقیم از چهارشنبه تا یکشنبه، 0.65) - به‌محض تأیید دور دوم
    از سوی هر دو طرف، در مسیر عدم تحقق قرار می‌گیرد. نشانه‌ها: اعلامی از میزبان قطری/پاکستانی
    با محل+تاریخ (-> فعال‌سازی بررسی عمیق)؛ دیدار ترامپ-پزشکیان با تأیید هر دو طرف؛
    هرگونه دستور حمله آمریکا؛ گزارش‌های خسارت SPA؛ متوقف شدن یک کشتی تحت اسکورت همراه
    با تلفات (پله بعدی نردبان). 24 سپتامبر: چهارشنبه - دور دومی برگزار نشد؛ مقام ارشد
    (رویترز): اگر آمریکا فشار را کاهش دهد و محاصره بنادر را بردارد، هرمز ممکن است
    ظرف یک هفته بازگشایی شود، «اختلاف‌های بسیار»؛ رضایی: تا تحقق شروط بسته می‌ماند؛
    برنت در 103.08 (+3.9%) تسویه شد. طی شب: نقشه راه ایران (گلف نیوز، منابع منطقه‌ای،
    تأییدنشده از سوی هر دو دولت) - آتش‌بس تا 60 روز در سراسر منطقه، بازگشایی مرحله‌ای
    هرمز، توقف حملات به همسایگان عرب، جدول زمانی گفت‌وگوهای گسترده‌تر؛ روبیو «پذیرا»
    است، گزینه‌های نظامی حفظ شده‌اند. تسنیم (مرتبط با سپاه): تماس عراقچی-ویتکاف از
    سوی نهادهای سیاست‌گذار «مجاز نشده بود»؛ وزارت خارجه: با میانجی‌گری قطر، شروط منتقل
    شد - اکنون حدود اختیار طرف ایرانی شرط عبور است. Cape Dao (23 سپتامبر): کشتی فله‌بر
    بدون اسکورت با مدیریت اماراتی، یک دریانورد هندی کشته شد، انتسابی به آمریکا وجود
    ندارد (dd31b40f تا جمعه فعال است). 9e629d6e محقق شد (خانواده 10/10؛ جانشینی برای
    کشتی سعودی نوشته نشد - بارگیری ینبع بدون پاسخ دریایی از سر گرفته شد، این دسته
    بر اساس سوابق همچنان برقرار است). مورد جدید ed8c08b5 (عدم اعلام علنی آتش‌بس از
    سوی آمریکا از پنجشنبه تا یکشنبه، 0.7). محاصره: مسیر 115 کشتی مرتبط با ایران تغییر
    داده شد (گلف نیوز). فرمانده ارشد سپاه در درگیری‌های جنوب‌شرق ایران کشته شد (داخلی،
    نه آمریکا). 25 سپتامبر: شمارش معکوس. رضایی (دبیر شورای عالی امنیت ملی، به نقل
    از گاردین/پرس تی‌وی، گلف نیوز 00:36Z): واشنگتن «چهار یا پنج روز» فرصت دارد شروط
    ایران را «به‌طور کامل و یک‌جا» اجرا کند - تا زمانی که آمریکا اقدام نکند، نه بازگشایی
    هرمز در کار است و نه مذاکره؛ «حرف کافی است. اکنون باید عمل کنیم»؛ «گام بعدی» پس
    از پایان مهلت تعیین می‌شود (حدود دوشنبه 28 تا سه‌شنبه 29). مجلس طرح استیضاح عراقچی
    را بر سر تماس‌های نیویورک ثبت کرد (خضریان، ثابتی) - تندروها می‌گویند مأموریت،
    انتقال شروط از طریق میانجی‌ها بود، نه گفت‌وگوی مستقیم؛ یک مقام ارشد به رویترز
    گفته بود هیئت «اختیار کامل» داشته است. رویترز (منابع، پنجشنبه 16:18Z): مذاکره‌کنندگان
    در حال بررسی توافقی مرحله‌ای هستند (بازگشایی هرمز، رفع محاصره، دارایی‌های مسدودشده)؛
    یک مقام ایرانی: احتمال «بسیار پایین»؛ یک مقام اروپایی: فهرست ایران «بسیار طولانی»
    است. پزشکیان (NBC): خواهان احیای تفاهم‌نامه ژوئن پیش از انتخابات میان‌دوره‌ای
    است، از بازرسی‌های هسته‌ای استقبال می‌کند، طرح‌ریزی علیه ترامپ را رد می‌کند. روبیو:
    پیشرفت عمده‌ای نیست. ترامپ: ایران تا انتخابات میان‌دوره‌ای وقت‌کشی می‌کند. جبهه
    حوثی‌ها: شش موشک بالستیک به‌سوی طائف و ینبع رهگیری شد (ائتلاف/المالکی)؛ حوثی‌ها
    مدعی اصابت به آرامکو-ینبع و ریاض شدند - هیچ گزارش خسارتی از SPA وجود ندارد (صرفاً
    ادعای طرف متخاصم، قاعده 12)؛ مکرون نیرو، رادار و پدافند هوایی به ینبع می‌فرستد؛
    بریتانیا با ایران مقابله می‌کند؛ 150+ کشته در نبردهای یمن بر سر ارتفاعات باب‌المندب؛
    صفوی: ممکن است جبهه دریای سرخ/باب‌المندب باز شود. بحرین پیشگام درخواست بازگشایی
    کامل هرمز بدون عوارض است (در جهت مخالف 2df323fa). عبورهای هرمز چهارشنبه 10 مورد
    (میانگین 10 روزه ~17، بدون احتساب کشتی‌های با AIS خاموش). Cape Dao همچنان بدون
    انتساب است (dd31b40f جمعه بسته می‌شود). نردبان بدون تغییر؛ مورد جدید 9083e952
    (عدم ترتیبات مورد تأیید هر دو طرف از جمعه تا سه‌شنبه، 0.7). نشانه‌ها: پاسخ علنی
    آمریکا به ضرب‌الاجل؛ «گام بعدی» شورای عالی امنیت ملی؛ گزارش خسارت SPA در ینبع؛
    اعلام میزبان با محل+تاریخ. 26 سپتامبر: پیشنهاد. عراقچی (سازمان ملل، جمعه): «طرح
    مشخص هفت‌روزه» از طریق قطر منتقل شد - بازگشایی ظرف هفت روز پس از تحقق شروط (رفع
    محاصره + تحریم کشتیرانی، معافیت از تحریم‌های نفتی، آتش‌بس سراسری منطقه شامل لبنان،
    >=$12bn دارایی مسدودشده)؛ «اکنون انتخاب با ایالات متحده است». گلف نیوز: «ظرف چند
    ساعت گزارش‌ها نشان دادند» ترامپ آن را رد کرده است - هیچ منبعی نام برده نشده، هیچ
    موضع علنی از آمریکا وجود ندارد (Maritime Executive/رویترز: کاخ سفید بلافاصله پاسخی
    نداد؛ AP: مقام‌های سعودی «تردید دارند»). دومین مقام ارشد ایرانی (رویترز): حتی
    در صورت پذیرش، انعطاف‌پذیری هسته‌ای وجود نخواهد داشت. فارس: گزارش اکسیوس درباره
    «آماده‌سازی دور جدید» و الجزیره درباره «اعزام کارشناسان به نیویورک» نادرست است،
    «خبرسازی» برای جابه‌جا کردن قیمت نفت. پزشکیان (CBS): بازرسان آژانس بین‌المللی
    انرژی اتمی می‌توانند بازگردند. دریای سرخ: شنبه - دو پهپاد حوثی‌ها به‌سوی ریاض
    + یک موشک بالستیک به‌سوی خمیس مشیط رهگیری شد (ائتلاف)؛ دفتر سیاسی حوثی‌ها: «تمرینی
    در مقیاس کوچک برای تشدید تمام‌عیار»؛ رؤسای ستاد عربستان-پاکستان-ترکیه در چارچوب
    توافق دفاع مشترک مکه (خالد بن سلمان + منیر)؛ بسیج عمومی دولت یمن؛ اعزام فرانسه
    به ینبع؛ هیچ گزارش خسارتی از SPA وجود ندارد. محاصره (دسته کشتی‌ها): آمریکا در
    حال توقیف ~$600m نفت خام ایران از سه نفتکش است؛ سنتکام مسیر 122 شناور را تغییر
    داده؛ IMO تا 24 سپتامبر 85 حادثه / 24 مرگ دریانورد ثبت کرده؛ فهرست شناورهای غیرمنطبق
    PGSA شامل 81 کشتی؛ Kpler: خروج 33.7m بشکه نفت خام از هرمز در این هفته در برابر
    49.2m در کل هفته گذشته؛ تردد LNG قطر در بالاترین سطح دو ماهه. ارزیابی‌شده: dd31b40f
    محقق شد (Cape Dao بدون انتساب؛ جست‌وجو شد). نردبان: d96debd5 / 2df323fa شنبه 23:59Z
    بسته می‌شوند (در مسیر تحقق - بدون حمله به زیرساخت؛ بحرین پیشگام درخواست بازگشایی
    بدون عوارض شد)؛ 33defb45 / d4f5ffd6 / 0d52e7da / ed8c08b5 یکشنبه بسته می‌شوند
    (در مسیر تحقق؛ فارس دور جدید را تکذیب می‌کند)؛ 9083e952 (عدم ترتیبات مورد تأیید
    هر دو طرف، تا سه‌شنبه)؛ مورد جدید a0c82077 (عدم اقدام ایران در دسته‌ای جدید از
    شنبه تا چهارشنبه 30 سپتامبر 23:59Z، 0.65: قلمرو/زیرساخت شورای همکاری خلیج فارس
    با انتساب تأییدشده به ایران، مین‌گذاری هرمز، کشتی با پرچم آمریکا/تحت اسکورت؛ آتش
    حوثی‌ها، کشتی‌های غیرآمریکایی بدون اسکورت، جریمه‌های PGSA، توقیف‌های آمریکا در
    ارزیابی محاسبه نمی‌شوند). نشانه‌ها: پاسخ علنی آمریکا؛ «گام بعدی» شورای عالی امنیت
    ملی؛ اعلام میزبان با محل+تاریخ (-> بررسی عمیق +60)؛ گزارش خسارت SPA در ینبع. 27
    سپتامبر: ثبت علنی. ترامپ (شنبه، هنگام خروج از کاخ سفید؛ CNN / بلومبرگ به نقل از
    gcaptain): «پیشنهادشان را رد می‌کنم» / «پیشنهادی دادند اما آن را رد کردم - می‌خواهند
    توافقی کنند که در آن تنگه را فوراً باز کنند، چون دارند خیلی بد می‌بازند ... من
    هم دوست دارم توافق کنم»، عجله‌ای ندارد؛ منبع بلومبرگ: توافق در دست بررسی شبیه
    تفاهم‌نامه ژوئن بود (بازگشایی هرمز <-> رفع محاصره). WSJ: ترامپ انتظار دارد کارزار
    بمباران را پس از انتخابات میان‌دوره‌ای از سر بگیرد (او از تأیید خودداری کرد).
    عراقچی (وبلاگ زنده گلف نیوز): تهران رد پیشنهاد را «مورد توجه قرار داده»، منتظر
    پاسخ رسمی از طریق میانجی‌هاست و پس از آن تصمیم می‌گیرد - تنها روزنه باقی‌مانده
    برای شاخه توافق. محمدی، جانشین نیروی دریایی سپاه (فارس): ناوهای جنگی آمریکا «از
    جمله در اقیانوس هند» در جنگی جدید هدف هستند - یک اظهارنظر، نه اقدام (برای a0c82077
    محاسبه نمی‌شود). ردیابی پرواز (غیررسمی): 5 فروند KC-135، 2 فروند KC-46، 1 فروند
    MQ-4C بر فراز مسیرهای منتهی به منطقه. مجمع عمومی سازمان ملل، شنبه: فیصل بن فرحان،
    وزیر خارجه عربستان - جهان «در حفاظت از کشتیرانی خلیج فارس ناکام است»؛ البوسعیدی،
    وزیر خارجه عمان - خویشتن‌داری، مسقط آماده میانجی‌گری درباره کشتیرانی است. حوثی‌ها،
    شنبه: دو پهپاد به‌سوی ریاض + یک موشک بالستیک به‌سوی خمیس مشیط رهگیری شد، هشدارها
    در ابها/جازان (دسته نیابتی). بسنت، «عملیات طرد اقتصادی» (X، شنبه): امارات همه
    شرکت‌های هواپیمایی ایران را زمین‌گیر کرد، بانک مرکزی امارات تراکنش‌های شعب بانک
    ملی را مسدود کرد (چهارشنبه)، بانک‌های بزرگ اماراتی و ترکیه‌ای روابط با ایران را
    قطع کردند، ترکیه/عمان فعالیت ماهان ایر را متوقف کردند، 50+ کشور مشارکت دارند («روز
    آغاز یورش اقتصادی»، WSJ). ارزیابی‌شده: d96debd5 محقق شد (بدون حمله به زیرساخت
