    (رفت‌وآمد دیپلماتیک قطر و پاکستان)؛ ترامپ: حدود 3 ساعت، «سازنده»، دور دیگری «به‌زودی»،
    اما توافق «درست پس از انتخابات» و «نابود کردن» به‌عنوان گزینه جایگزین؛ ویتکاف
    (X): غیرمستقیم، یک دور تکمیل شده، میانجی‌گری ادامه دارد؛ تلویزیون دولتی ایران:
    تهران درخواست ویتکاف را پذیرفت، «شرایط سخت‌گیرانه» منتقل شد؛ نیویورک تایمز (2
    مقام ایرانی): عراقچی با ویتکاف+کوشنر دیدار کرد؛ کانال 12 اسرائیل: بر سر بیشتر
    اختلافات توافقی حاصل نشده؛ منبع العربیه: «بن‌بست شکسته شد». شرایط ایران (تسنیم):
    پایان جنگ در همه جبهه‌ها، جدول زمانی خروج از جنوب لبنان، وجوه مسدودشده، رفع محاصره
    و تحریم‌های جدید، معافیت نفتی - همان تفاهم‌نامه قدیمی. فارس: آمریکا «هیچ خط قرمزی
    باقی نگذاشته است»، آمادگی برای همه سناریوها. پیش‌تر در سه‌شنبه، گزارش کیودو درباره
    «بازگشایی هرمز ظرف 7 روز» از سوی فارس تکذیب شد. 645cc78a محقق نشد (اولین شکست
    این خانواده؛ درس مربوط به قید قالب ثبت شد). هرمز: آخرین حملات دوشنبه 21 سپتامبر
