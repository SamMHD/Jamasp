  why_fa: 'بازده‌های واقعی محرک غالب طلا هستند، و این فدرال رزرو همین حالا نرخ بهره
    را افزایش داد: 16 سپتامبر +25bp به 3.75-4.00%، با رأی 12-0، بدون جمله‌ای درباره
    راهنمایی آتی؛ نمودار نقطه‌ای حاکی از یک افزایش دیگر در 2026 است (میانه 4.1؛ 16
    نفر از 18 نفر >=1 افزایش دیگر را پیش‌بینی می‌کنند). وارش: «انقباضی نیست»، برآورد
    PCE اوت ~3.6%. جناح منطقه‌ای همچنان خواهان افزایش بیشتر است: موسالم، کالینز، گولزبی
    (21 سپتامبر)؛ کالینز دوباره در 22 سپتامبر («می‌توان بر ثبات قیمت‌ها تمرکز کرد»)؛
    بارکین در 22 سپتامبر ساعت 17:00Z (CFA بالتیمور): «ریسک‌های تورم بر ریسک‌های اشتغال
    حداکثری می‌چربند»، >60% از دسته‌های PCE بالای >3%، شرکت‌ها هزینه‌ها را منتقل می‌کنند،
    یک «تذکر» شاید کافی نباشد - اما این چرخه «می‌تواند شبیه تعدیل میان‌چرخه‌ای گرینسپن
    باشد» (همان ~75bp در میانه دهه 1990): انقباضی با یک سقف، و سهام شرکت‌های خانه‌سازی
    در واکنش به آن رشد کرد. دو نوبت سخنرانی عضو هیئت‌مدیره/نیویورک (جفرسون، ویلیامز
    در 22 سپتامبر) درباره سازوکارهای عملیاتی بود - بدون راهنمایی آتی. وضعیت بازار:
    حراج اوراق 2ساله ($69bn، در 22 سپتامبر) با بازده 4.787، با فاصله 0.2bp بالاتر
    از بازده پیش از حراج، درجه C انجام شد - بالاترین بازده اوراق 2ساله از 2024، عرضه
    را بدون تنش جذب کرد؛ منحنی در پایان جلسه 1.5-2.3bp بالاتر بسته شد (CNBC: اوراق
    5ساله 4.842، اوراق 10ساله 4.967، اوراق 30ساله 5.303)، در جلسه‌ای که برنت -1.1%
    بود و یک دور گفت‌وگوی آمریکا و ایران به تأیید هر دو طرف رسید - بخش کوتاه‌مدت منحنی
    همراه نفت پایین نمی‌آید (نادیده‌گرفتن این اثر بر اساس اظهارات ثبت‌شده منتفی شد:
    اشمید، کشکاری، آن سه نفر، بارکین). بازده پایانی اوراق 2ساله در 22 سپتامبر قابل
    بازیابی نبود (US2Y در CNBC خالی است). قیمت‌گذاری: اکتبر «اندکی بیش از 50%» (investinglive
    در 13:38Z روز 22 سپتامبر، بدون بازنشر بعدی)؛ BofA همچنان اکتبر + دسامبر را پیش‌بینی
    می‌کند؛ دویچه بانک: بازارها چرخه جهانی افزایش نرخ بهره را کمتر از واقع قیمت‌گذاری
    می‌کنند. نقاط بررسی: اوراق 2ساله 4.791-4.800 (شکست = هدف برآوردی 5.055؛ پس‌زده‌شدن
    و سپس <4.600 = برگشت)؛ DXY برابر با 100.02 / 100.58 / 101.80. شرط تغییر سناریو
    (تأیید اکتبر از سوی یک عضو هیئت‌مدیره -> سناریوی نزولی ناشی از نرخ بهره 60؛ درخواست
    توقف -> سناریوی پایه 30) فعال نشده است. سخنرانان (ff_calendar، کم، todo-188):
    بار چهارشنبه 23 ساعت 14:05Z (بیدارباش #59، ابتدا محل سخنرانی بررسی شود - نمایه
    هیئت‌مدیره فقط وام‌دهی با فرصت دوباره و هوش مصنوعی را نشان می‌دهد)؛ پنج‌شنبه ویلیامز
    08:10Z، بارکین 12:30Z، هامک 12:50Z، پالسن 14:10Z؛ جمعه ویلیامز 09:15Z، هامک 18:00Z.
    گزاره‌ها: fc5c5a29 (هیچ بازده پایانی اوراق 2ساله <4.60 تا 25 سپتامبر نباشد، 0.55)؛
    4872cd75 (گزارش بازنشرشده احتمال اکتبر >=45% تا جمعه، 0.55)؛ 1a513d72 (هیچ گزارش
    بازنشرشده‌ای >=60% تا چهارشنبه 23:59Z نباشد، 0.55 - ریسک بار)؛ d8e247ef (هیچ جفت
    متوالی با افزایش هر دو تا دوشنبه 28 نباشد، 0.7 - سه‌شنبه ردیف بدون تغییر بود،
    نه افزایشی در هر دو). ایستگاه‌های بعدی: بار چهارشنبه؛ مؤلفه قیمت‌های پرداختی PMI
    مقدماتی آمریکا چهارشنبه 13:45Z؛ شاخص قیمت مصرف‌کننده (CPI) سپتامبر در اواسط اکتبر؛
    FOMC در 28 اکتبر. گزارش کوتاه 24 سپتامبر: تغییر سناریو چهارشنبه فعال شد (وزن‌ها
    15/60/25). PMI ترکیبی مقدماتی 58.4 (هزینه نهاده‌ها در بالاترین سطح از اکتبر 2022)
    + بار («در سناریوی پایه من، احتمالاً تعدیل‌های بیشتری در سیاست‌گذاری لازم خواهد
    بود») -> احتمال اکتبر در جمع‌بندی پایانی 65% (در طول روز 74%، «94bp دیگر از اینجا»)؛
    اوراق 2ساله در 4.895 بسته شد (+12bp، CNBC)، اوراق 10ساله 5.114 (بالاترین سطح از
    2007)، اوراق 30ساله 5.402 (نخستین بسته‌شدن >=5.40)، DXY برابر با 101.12؛ ردیف
    طلا -1.74%. گزاره 1a513d72 محقق نشد (گزارش بازنشرشده >=60% از پست PMI در 13:51Z
    آمد). فعال: 6e168240 (اوراق 2ساله >=4.80 در چهارشنبه محقق شد، بخش پنج‌شنبه)، 1e91793f
    (هیچ گزارش بازنشرشده‌ای <55% در پنج‌شنبه تا جمعه نباشد، 0.55)، 4872cd75 (>=45%)،
    fc5c5a29 (هیچ بسته‌شدنی <4.60 نباشد). پنج‌شنبه: SNB در 07:30Z، ویلیامز 08:10Z
    (محل سخنرانی در نمایه فدرال رزرو نیویورک نیست)، درخواست‌های بیمه بیکاری 12:30Z
    با اجماع 200K، بارکین 12:30Z، هامک 12:50Z، پالسن 14:10Z؛ جمعه ویلیامز 09:15Z،
    اشمید 13:20Z، هامک 18:00Z - همگی رؤسای منطقه‌ای، بدون عضو هیئت‌مدیره، صرفاً نشانه‌هایی
    برای پایش. بازگشت سناریو: یک گزارش بازنشرشده <55% یا درخواست‌های بیمه بیکاری >230K
    همراه با درخواست توقف از سوی ویلیامز -> سناریوی نزولی ناشی از نرخ بهره 50. گزارش
    کوتاه 25 سپتامبر: وزن‌ها در 15/60/25 حفظ شدند. پنج‌شنبه شمار صداهای همسو بیشتر
    شد و بازار از آن‌ها جلو زد: اکتبر 77.5% (بازنشر actionforex از قراردادهای آتی
    وجوه فدرال در 09:16Z؛ جمع‌بندی قاره آمریکا هیچ جمله‌ای درباره احتمال نداشت). ویلیامز
    (مجمع سیاست‌گذاری کلان لندن): یک افزایش نرخ بهره دیگر در 2026 «معقول» است، به
    اکتبر متعهد نشد، راهنمایی آتی «تمام شده»، اقتصاد «در برابر افزایش قیمت انرژی تاب‌آور»
    است؛ هامک: ریسک‌ها «به سمت بالا متمایل‌اند»، خطر شکل‌گیری «ذهنیت تورمی» بر اثر
    شوک‌های مکرر؛ پالسن (دارای حق رأی): «ممکن است مقداری انقباض بیشتر و ملایم موجه
    باشد». درخواست‌های بیمه بیکاری 197K، فروش خانه‌های نوساز 684K. اوراق 2ساله در
    4.895 (CNBC) / 4.916 (جمع‌بندی) بسته شد، اوراق 10ساله 5.163 (بالاترین سطح از 2007)،
    اوراق 30ساله 5.460 (بالاترین سطح از 2004). گزاره 6e168240 محقق شد (هر دو بخش).
    فعال: 1e91793f (>=55%) و 4872cd75 (>=45%) روز جمعه در مسیر تحقق بسته می‌شوند؛
    fc5c5a29 جمعه بسته می‌شود؛ گزاره جدید 86f87a36 (هیچ بازده پایانی اوراق 2ساله <4.80
    از جمعه تا سه‌شنبه نباشد، 0.55). سخنرانان جمعه: ویلیامز 09:15Z (دوباره)، اشمید
    13:20Z، هامک 18:00Z - بدون عضو هیئت‌مدیره؛ برنامه فدرال رزرو برای 28-29 سپتامبر
    هنوز در فید نیست. شرط بازگشت سناریو بدون تغییر: یک گزارش بازنشرشده <55% یا درخواست
    توقف از سوی یک عضو هیئت‌مدیره -> سناریوی نزولی ناشی از نرخ بهره 50. NFP در 2 اکتبر:
    بیدارباش #61. گزارش کوتاه 26 سپتامبر: وزن‌ها در 15/60/25 حفظ شدند (روز سوم). جمعه:
    اوراق 2ساله در 4.86 بسته شد (-3.5bp؛ بازگشایی 4.912، کف 4.845)، در واکنش به طرح
    هفت‌روزه عراقچی و برنت -2.1% - بخش کوتاه‌مدت منحنی برای نخستین بار در این رژیم
    همراه نفت پایین آمد (~1.7bp به‌ازای هر درصد تغییر برنت)، بدون گزارش بازنشرشده
    و بدون سخنران در جلسه؛ جمع‌بندی: «دلار با کاهش نگرانی‌های تورمی اندکی ضعیف‌تر
    شد». اوراق 10ساله 5.165 بدون تغییر (در طول روز 5.23، بالاترین سطح از 2007)، اوراق
    30ساله 5.49 (بالاترین سطح از 2004). ویلیامز (جمعه): شوک‌های پایدار عرضه مبارزه
    را دشوارتر می‌کنند؛ بازار کار منشأ تورم نیست؛ تعرفه‌ها به‌تنهایی تورم پایدار ایجاد
    نمی‌کنند. هیچ گزارش بازنشرشده‌ای از احتمال روز جمعه در هیچ‌جا وجود نداشت (جست‌وجو
    شد) - آخرین رقم 77.5% (پنج‌شنبه). ارزیابی‌شده: fc5c5a29 محقق شد (هیچ بازده پایانی
    اوراق 2ساله <4.60 نبود)، 4872cd75 محقق شد (>=45%)، 1e91793f محقق شد (>=55%). فعال:
    86f87a36 (هیچ بازده پایانی اوراق 2ساله <4.80 از جمعه تا سه‌شنبه نباشد؛ 4.86 جمعه
    شرط را برآورده می‌کند)؛ گزاره جدید b934960e (هیچ گزارش بازنشرشده‌ای <55% در روز
    PCE، چهارشنبه 30 سپتامبر، نباشد، 0.55)، که در بررسی عمیق #62 در زمان انتشار+45
    ارزیابی می‌شود. هفته آینده از طریق خلاصه تقویم actionforex + چشم‌انداز هفته پیش
    روی ولز فارگو تأیید شد (BLS/BEA خطای 403): PCE چهارشنبه 30 سپتامبر 12:30Z (اجماع
    0.4/3.7 برای کل، 0.3/3.4 برای هسته؛ بازنگری‌های سالانه «روند ملایم‌تر، اوت داغ‌تر»)،
    ISM پنج‌شنبه 1 اکتبر 14:00Z (55.0؛ قیمت‌های پرداختی 72)، NFP جمعه 2 اکتبر 12:30Z
    (اجماع 100K در برابر 162K، UR برابر با 4.1، AHE برابر با 0.3؛ تاریخ بیدارباش #61
    پابرجاست)، RBA سه‌شنبه 04:30Z (4.60)، شاخص قیمت مصرف‌کننده (CPI) منطقه یورو جمعه
    (3.7%). سخنرانان فدرال رزرو از دوشنبه تا جمعه: در هیچ فیدی هیچ‌کس دیده نمی‌شود
    (todo-001/188؛ نمایه هیئت‌مدیره = عناوین گذشته). شروط تغییر سناریو: گزارش بازنشرشده
    <55% یا درخواست توقف از سوی یک عضو هیئت‌مدیره -> سناریوی نزولی ناشی از نرخ بهره
    50؛ گزارش بازنشرشده PCE برابر با >=80% همراه با بازده پایانی اوراق 2ساله >=4.95
    -> 65؛ توافقی با تأیید هر دو طرف همراه با اوراق 2ساله <4.75 -> 50 (صعود طلا از
    مسیر بخش کوتاه‌مدت منحنی). گزارش کوتاه 27 سپتامبر: وزن‌ها در 15/60/25 حفظ شدند
    (روز چهارم). اصلاح: یک گزارش بازنشرشده مربوط به جمعه وجود داشت - مطلب توضیحی شنبه
    CNBC (13:30Z): CME FedWatch برای اکتبر 64%، در برابر 77.5% پنج‌شنبه - کاهش 13.5
    واحد درصدی در واکنش به طرح عراقچی و برنت -2.1%، بدون داده، بدون سخنران. انتظارات
    تورمی یک‌سال آینده دانشگاه میشیگان در سپتامبر 4.6% (از 4.0%، بالاترین سطح از ژوئن).
    گزارش هفتگی actionforex: «قیمت‌گذاری فدرال رزرو تا جمعه از سطح افراطی میانه هفته
    عقب نشست»؛ اوراق 2ساله بیش‌ازحد بالا رفته است (RSI روزانه >72؛ سقف 4.912، هدف
    برآوردی 5.055) و اکنون اوراق 10ساله (سقف 5.23، هدف برآوردی 5.413) جهت دلار را
    تعیین می‌کند؛ مقاومت DXY در 101.80-102.86، محدوده عقب‌نشینی 99.7-99.9 در صورت
    توقف حرکت اوراق 10ساله. رد علنی و ثبت‌شده طرح هفت‌روزه از سوی ترامپ (شنبه، پس
    از تسویه جمعه) جهت زنجیره نفت -> اوراق 2ساله را با نزدیک‌شدن به موعد رضایی دوباره
    رو به بالا می‌برد. گزاره جدید efd9700b (هیچ گزارش بازنشرشده‌ای <55% از دوشنبه
    28 تا سه‌شنبه 29 نباشد، 0.55؛ سقف قاعده-19 چون برنامه سخنرانان نامشخص است) جایگزین
    1e91793f می‌شود؛ b934960e روز PCE را پوشش می‌دهد. سخنرانان فدرال رزرو از دوشنبه
    تا جمعه: همچنان هیچ‌کس دیده نمی‌شود (از صفحه تقویم هیئت‌مدیره فقط سربرگ آن استخراج
    می‌شود). شروط تغییر سناریو بدون تغییر: گزارش بازنشرشده <55% یا درخواست توقف از
    سوی یک عضو هیئت‌مدیره -> سناریوی نزولی ناشی از نرخ بهره 50؛ گزارش بازنشرشده PCE
    برابر با >=80% همراه با بازده پایانی اوراق 2ساله >=4.95 -> 65.'
