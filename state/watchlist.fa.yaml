    ورود سرمایه به ETFها، و تنوع‌بخشی به ذخایر با خروج از اوراق خزانه به‌عنوان همتای
    آن در سمت جریان‌ها (دارایی‌های UST چین در پایین‌ترین سطح از 2008؛ UBS در 9 سپتامبر
    پیش‌بینی بلندمدت خود را حفظ می‌کند؛ Goldman در 18 سپتامبر هدف $5,400 را در طول
    افزایش نرخ بهره حفظ می‌کند). واکنش انتقال محل نگهداری ذخایر در حال گسترش است (DNB
    انتقال 86t به لندن، فرانسه؛ ونزوئلا در حال بررسی انتقال $4bn از لندن -> آمریکا).
    SGE برابر با 942/g (20 سپتامبر). شواهد مخالف: روسیه فروشنده‌ای مستمر است؛ یک مؤسسه
    پژوهشی (investinglive در 23 سپتامبر) به‌دلیل دلار + فدرال رزرو انقباضی انتظار
    افت بیشتر در Q4 را دارد، اما به‌واسطه تحولات ژئوپلیتیک و خرید بخش رسمی، «کفی محکم
    در حوالی $3,800» پیش‌بینی می‌کند. کف در عمل: 4300 برای GC (~4265 نقدی) - آزمون‌ها
    در 14 سپتامبر 4305.9، در 15 سپتامبر 4304.0، در 16 سپتامبر تیک 4296.7 در 22:19Z،
    سپس بازگشت به 4424.9 در جمعه 18 سپتامبر؛ کف 4335.0 در 22 سپتامبر با اظهارنظر «نابود
    کردن یا توافق» ترامپ + بازگشت برنت به 100 حفظ شد، سپس ردیف 4402.2. d571e0f0 در
    23 سپتامبر محقق شد - کف‌ها در این رژیم 9/9، همگی با 0.55 ثبت شده‌اند (شکاف کالیبراسیون،
    منطق فاصله در قاعده 20)، و تک‌تک جهش‌ها با عقب‌نشینی نفت از سقف‌هایش یا یک جلسه
    معاملاتی با کاهش بازده‌ها همراه بودند؛ هنوز هیچ خریدی در افت قیمت دقیقاً روی خط،
    در روزی با افزایش نفت رخ نداده است. آزمون دهم فعال است: 717f560c (هیچ ردیف GC_CLOSE
    با مقدار <=4300.0 از چهارشنبه 23 تا جمعه 25 سپتامبر، 0.55؛ 73 واحد پایین‌تر از
    نقدی، 0.43x دامنه سه جلسه معاملاتی). تأییدکننده‌ها: داده‌های ماهانه WGC نشان‌دهنده
