    1.75-2%. USDJPY در 156.83 (-0.82%) — ین دارایی امن پنج‌شنبه بود، درحالی‌که طلا
    فروخته شد. احتمال افزایش نرخ بهره بانک کانادا در 28 اکتبر ~80% (شاخص قیمت تولیدکننده
    (PPI) کانادا +2.0% نسبت به ماه قبل)؛ MUFG: تثبیت نرخ ECB در اکتبر، افزایش‌ها در
