    می‌کنند - ساختاری است، نه ناشی از معاملات جاری. هیچ ادعایی درباره کف وجود ندارد
    (در فاصله کمتر از یک ATR، هفته طلایی). گزارش کوتاه 5 اکتبر: دویچه (غالی، BNN،
    2 اکتبر؛ یادداشت 30 سپتامبر): خرید بخش رسمی بیش از دو برابر آهنگ 2021-22، مشارکت
    نهادی +70% از 2021؛ خالص موقعیت‌های فروش CTA در بالاترین سطح از اکتبر 2021، موقعیت‌های
    خرید اختیاری -55% نسبت به ژوئن - «بیش‌فروش‌شده و با سهم مالکیت پایین»، «در سورنتو
    بخرید» (کنفرانس LBMA در این هفته)، اما ممکن است ابتدا موج فروش شدیدی در هفته طلایی
    رخ دهد. اختلاف در سمت فروش: BofA «نفت بزرگ‌ترین دشمن طلاست، ریسک <4000» در مقابل
    مورگان استنلی «4000 کفی قوی است». علیه خود LBMA در لندن اقامه دعوی شده است (محاکمه
    چهارشنبه 7 اکتبر؛ ذخایر GBP1.4m در برابر هزینه‌های ~GBP3m؛ فهرست Good Delivery
    در معرض خطر) - نشانه‌ای ساختاری، بدون اثر قیمتی. تولیدکنندگان آسیایی در داخل کشور
    ذخیره می‌کنند (پالایش در لائوس، مالیات 15% در اندونزی). 50 شرکت معدنی برتر -$264bn
    (mining.com). SGE تا پنجشنبه تعطیل است؛ در فاصله کمتر از یک ATR هیچ ادعایی درباره
    کف وجود ندارد. 7 اکتبر: وزارت دارایی روسیه از 7 اکتبر تا 6 نوامبر ~280bn روبل
    طلا + ارز می‌خرد (5x رقم 56bn سپتامبر؛ قاعده مالی با برنت بالای $59؛ تفکیک اعلام
    نشده) - تقاضای خرید رسمی وابسته به نفت که با افت نفت خام کوچک می‌شود. ناگل (بوندس‌بانک/ECB،
    5 اکتبر): دلایل ادامه خرید طلا توسط بانک‌های مرکزی «همچنان قوی است». دارایی‌های
    SPDR در طول افت، در حدود ~34 Moz و نزدیک به اوج‌های چندماهه قرار دارد (investinglive،
    6 اکتبر) - فشار از سمت نرخ‌های بهره است، نه خروج از ETF. فروش سپتامبر ضرابخانه
    پرت با افت قیمت‌ها تقریباً دو برابر شد و به بالاترین سطح 7ماهه رسید. دعوت‌نامه
    وبینار روندهای تقاضای Q3 از WGC منتشر شد (6 اکتبر). SGE پنجشنبه 8 اکتبر بازگشایی
    می‌شود. 8 اکتبر: PBOC در سپتامبر برای 23مین ماه متوالی خرید کرد - 77.47 Moz در
    برابر 76.73 (+0.74 Moz، حدود 23t، بزرگ‌ترین افزایش ماهانه این دوره؛ fxempire بر
    اساس داده‌های SAFE). WGC: خریدهای رسمی در اوت 39t (+70% نسبت به ماه قبل، دو برابر
    یک سال پیش؛ چین، لهستان و ازبکستان پیشتاز بودند)، از ابتدای سال 170t. ETFها: $10bn
    در سپتامبر، رکورد $31bn در Q3، دارایی‌ها با +67t به رکورد 4,256t رسیدند، در حالی
    که قیمت 8.5% افت کرد - افت ناشی از قراردادهای آتی بود (معادل -84t در پول تحت مدیریت،
    -156t در موقعیت‌های اسپرد؛ BMO/WGC)، نه خروج سرمایه‌گذاران؛ صندوق‌های پذیرفته‌شده
    در بورس بریتانیا در Q3 برابر با $7.5bn، همسو با صرف سررسید اوراق دولتی بریتانیا
    (پوشش ریسک مالی دولت در ETFها زنده است). هند برای نخستین بار از افزایش عوارض در
    ماه مه، با اضافه‌بها نسبت به لندن معامله می‌شود؛ اضافه‌بهای چین «سالم» است (BMO)،
    اضافه‌بهای شانگهای پیش از هفته طلایی در بالاترین سطح سه‌ماهه بود؛ SGE پنجشنبه
    در 01:30Z بازگشایی شد - اضافه‌بها در 03:31Z هنوز خوانده نشده است (هنوز منبعی وجود
    ندارد؛ خوراک SGE_AU_CNY_G از 28 سپتامبر به‌روز نشده است). DNB مقدار 86t را به
    نزدیکی کشور خود منتقل کرد (واکنش انتقال محل نگهداری ذخایر). کف تقاضا زیر 4100
    پابرجاست؛ فروشنده میز معاملات کاغذی است. 20 اکتبر: گلدمن خرید رسمی در اوت را 79t
    برآورد می‌کند (ژوئیه 44t؛ میانگین پیش از 2022 برابر با 17t در ماه)، چین ~25t در
    برابر رقم ~20t منتشرشده توسط PBOC. کاهش برآوردهای CIBC: برای Q4-26 برابر با $4,500
    (از 6,500)، میانگین 2027 برابر با $5,200، برای 2028 برابر با $5,500 - اجماع برای
    2027 برابر با $4,620 / برای 2028 برابر با $4,451 - احیا به چرخش سیاست فدرال رزرو
    یا گسست در رشد/تورم نیاز دارد. کف متکی به بخش رسمی و کند است؛ میز معاملات کاغذی
    قیمت را تعیین می‌کند (خالص موقعیت‌های سفته‌بازانه 199.7K، 13 اکتبر). گزارش کوتاه
    جمعه 23 اکتبر: طلا زیر 4000 (قرارداد آتی دسامبر در آسیا 4000.9، نخستین بار از
    ژوئیه؛ ~25% پایین‌تر از اوج ژانویه). HSBC (22 اکتبر): طلا پوشش ریسک کوتاه‌مدت
    سهام نیست - دارندگان موقعیت‌های خرید اهرمی هنگام اخطار تأمین وجه تضمین، آن را
    برای تأمین نقدینگی می‌فروشند، «نقد کردن یک بیمه‌نامه»؛ استدلال بلندمدت بر کاهش
    ارزش پول، تنوع‌بخشی ذخایر بانک‌های مرکزی و چندپارگی ژئوپلیتیکی استوار است، همراه
    با خریداران نهادی جدید (بیمه‌گران چینی، مدیران دارایی هندی) و ورود سرمایه به ETFها.
    کف متکی به بخش رسمی و کند است؛ قیمت پنجشنبه را سبد معاملات اعتباری تعیین کرد.
    گزارش کوتاه شنبه 24 اکتبر: گلدمن (به نقل از mining.com، 23 اکتبر): بانک‌های مرکزی
    ~79t در اوت (ژوئیه 44t؛ میانگین پیش از 2022 برابر با 17t)، چین ~25t در برابر ~20t
    گزارش‌شده توسط PBoC؛ افزایش دارایی PBoC در سپتامبر بزرگ‌ترین افزایش در ~3 سال،
    23مین ماه؛ داده‌های اکتبر حدود 7 نوامبر. خالص موقعیت‌های سفته‌بازانه 191.8K (20
    اکتبر، -4% نسبت به هفته قبل، پیش از نقد کردن موقعیت‌ها). کف افق بلندمدت دارد:
    افت -2.2% پنجشنبه و -1.2% جمعه با هیچ تقاضای خرید رسمی قابل مشاهده‌ای در طول روز
    مواجه نشد.'
