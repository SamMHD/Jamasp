  why_fa: 'بازخریدهای گسترش‌یافتهٔ اوراق بلندمدت خزانه‌داری (19 اوت) عملاً کنترل منحنی
    بازده هستند و بازار آن‌ها را به‌منزلهٔ تضعیف ارزش پول تعبیر کرد - رژیم روند طلا
    زمانی آغاز شد که بدهی آمریکا از $40tn گذشت. این ابزار در 9-10 سپتامبر آشکارا شکست
    خورد (حراج اوراق 30 ساله در 5.308 «ضعیف» بود). 18 سپتامبر: «اوراق دوباره سقوط
    می‌کنند» - اوراق 10 ساله 5.00، اوراق 30 ساله 5.328 - و طلا با وجود ثبات دلار افزایش
    یافت: یک جلسهٔ معاملاتی. 21 سپتامبر: بخش بلندمدت بازار اوراق با افت -3.7% نفت
    صعود کرد (اوراق 30 ساله 5.280) و طلا افت کرد. 22 سپتامبر: حراج اوراق 2 ساله ($69bn)
    با بازده 4.787 و فاصلهٔ 0.2bp بالاتر از بازده پیش از حراج، با نمرهٔ C، تسویه شد
    - هیچ تنشی در بخش کوتاه‌مدت نبود؛ منحنی با افزایش 1.5-2.3bp بسته شد (اوراق 5 ساله
    4.842، اوراق 10 ساله 4.967، اوراق 30 ساله 5.303؛ جمع‌بندی investinglive برای اوراق
    10 ساله -6bp گزارش کرده بود - اختلاف در مبنا؛ قیمت پایانی CNBC مبناست)، در حالی
    که طلای نقدی $22 افزایش یافت و ردیف بدون تغییر بود - بخش بلندمدت در هیچ‌یک از
    دو جهت پیشرو طلا نیست. aec5cc8b در 23 سپتامبر محقق شد (هیچ بسته‌شدن اوراق 30 ساله
    در سطح >=5.40 از جمعه تا سه‌شنبه رخ نداد؛ سقف 5.311). پرلی (فدرال رزرو نیویورک):
    خرید اسناد خزانه «متوقف شده، پایان نیافته است». زیر نظر بگیرید: حراج‌های اوراق
    5 ساله/7 ساله در چهارشنبه/پنج‌شنبه (تأییدنشده، todo-185 - هیچ گزارش منتقل‌شده‌ای
    در پایگاه داده نیست)، هرگونه اظهارنظر بسنت دربارهٔ انتشار اوراق (حضورهای او در
    21-22 سپتامبر فقط دربارهٔ ایران/چین/گازوئیل بود)، و اینکه آیا اوراق 30 ساله در
    هیچ جلسه‌ای هم‌جهت با طلا حرکت می‌کند یا نه. 24 سپتامبر: اوراق 30 ساله در 5.402
    بسته شد (CNBC) - نخستین بسته‌شدن بالاتر از 5.40 - همراه با اوراق 10 ساله در 5.114
    (بالاترین سطح از 2007) و اوراق 2 ساله در 4.895: حرکتی در واکنش به PMI که ابتدا
    افزایش بازده همراه با تخت‌شدن منحنی و سپس جابه‌جایی موازی منحنی بود، با افت طلا
    و افزایش دلار. بخش بلندمدت سطح را شکست و طلا آن را به‌منزلهٔ تضعیف ارزش پول تعبیر
    نکرد (aec5cc8b از قبل با بسته‌شدن سه‌شنبه محقق شده بود). حراج‌های اوراق 5 ساله/7
    ساله همچنان تأییدنشده‌اند (هیچ گزارش منتقل‌شده‌ای در پایگاه داده نیست، todo-185).
    زیر نظر بگیرید: بسته‌شدن اوراق 30 ساله در سطح >=5.45 همراه با افت DXY و افزایش
    طلا تنها ثبت بازاری است که سناریوی پایه را تغییر می‌دهد. 25 سپتامبر: ابزار دوباره
    شکست خورد - خزانه‌داری دومین بازخرید خود را در دو هفته اجرا کرد و اوراق 7 ساله
    ($44bn) با بازده 5.085% و فاصلهٔ 0.7bp بالاتر از بازده پیش از حراج فروخته شد؛
    اوراق 30 ساله در 5.460 بسته شد (+5.9bp، بالاترین سطح در 22 سال؛ تصویر لحظه‌ای
    جمع‌بندی 5.478)، اوراق 10 ساله 5.163 (بالاترین سطح از ژوئیهٔ 2007)، نرخ وام‌های
    مسکن 7%. رویترز به نقل از investinglive: «بازخریدها و مداخله در بازار ین نتوانسته‌اند
    بازده‌ها را مهار کنند»؛ استراتژیست‌ها بیشتر افزایش از ماه مارس را به انتظارات
    افزایش نرخ بهرهٔ فدرال رزرو و مابقی را به رشد و نفت نسبت دادند؛ «6% برای اوراق
    10 ساله در حال تبدیل‌شدن به آستانهٔ درد بعدی است». در سطح جهانی: استقراض رکوردی
    آلمان در حدود EUR525bn، اوراق دولتی آلمان در بالاترین سطح 17 ساله، اوراق دولتی
    10 سالهٔ ژاپن در بالاترین سطح از 1996. طلا نزولی و DXY صعودی - به‌منزلهٔ تضعیف
    ارزش پول تعبیر نشد. تنها عامل تغییردهندهٔ سناریوی پایه: اوراق 30 ساله >=5.50 همراه
    با افت DXY و افزایش طلا. 26 سپتامبر: اوراق 30 ساله در 5.49 بسته شد (+2.8bp، بالاترین
    سطح از 2004؛ طی روز 5.532)، اوراق 10 ساله 5.165 (طی روز 5.23، بالاترین سطح از
    2007)، فاصلهٔ بازده 2s30s برابر با 63bp (+12bp در دو جلسه، هم‌زمان با افت بازده
    اوراق 2 ساله) - افزایش بازده همراه با پرشیب‌شدن منحنی در روزی که دلار 0.22% افت
    کرد و طلا 0.27% افزایش یافت: بخش بلندمدت به دلایل خاص خودش فروخته می‌شود (عرضه،
    بازنگری‌ها، «6% مطرح است» به‌عنوان مطلب ضروری investinglive) و طلا همچنان، حتی
    با کناررفتن مانع دلار، آن را به‌منزلهٔ تضعیف ارزش پول تعبیر نمی‌کند. جزئیات حراج
    اوراق 5 ساله/7 ساله همچنان تأییدنشده است (todo-185). پایان فصل چهارشنبه است. تنها
    عامل تغییردهندهٔ سناریوی پایه: بسته‌شدن اوراق 30 ساله در سطح >=5.50 همراه با افت
    DXY و افزایش طلا. 27 سپتامبر: مطلب توضیحی CNBC (تیری ویزمن از مک‌کواری): قرارگرفتن
    اوراق 10 ساله در 5.23 «بیشتر به انتشار اوراق مربوط است تا داستان تورم» - تأمین
    مالی کسری بودجه به‌علاوهٔ بدهی برای مخارج سرمایه‌ای هوش مصنوعی (ونگارد: انتشار
    $132bn توسط Alphabet/Amazon/Meta/Microsoft/Oracle تا پایان ژوئیه در برابر حدود
    $35bn در سال طی 2020-24؛ انتشار $300-570bn مرتبط با هوش مصنوعی در سال جاری)، «فدرال
    رزروی نداریم که به‌شدت سیاست انقباضی اعمال کند»، «این بازده‌ها می‌توانند بالاتر
    بروند». بخش بلندمدت داستان عرضهٔ اوراق با دیرش بالاست که بازار آن را به نفع دلار
    قیمت‌گذاری می‌کند - نشانهٔ مخالف طلا (17 مخالف / 2 موافق) پابرجاست. actionforex:
    اوراق 10 ساله (سقف کانال 5.23، سطح هدف برآوردی 5.413) اکنون عامل کلیدی دلار است؛
    توقف حرکت، DXY را به 99.7-99.9 بازمی‌گرداند. جمعه: اوراق 30 ساله 5.49 همراه با
    افت DXY و افزایش 0.3% طلا - یک واحد پایه و یک پله از نظر اندازه تا آستانهٔ فعال‌شدن
    base-25 فاصله داشت. جزئیات اوراق 5 ساله/7 ساله همچنان تأییدنشده است (todo-185).
    پایان فصل چهارشنبه است. تنها عامل تغییردهندهٔ سناریوی پایه: بسته‌شدن اوراق 30
    ساله در سطح >=5.50 همراه با افت DXY و افزایش طلا. 1 اکتبر: ترامپ، چهارشنبه 20:00Z
    (Truth Social): پاول باید به‌دلیل بازسازی ساختمان مرکزی از هیئت‌مدیره استعفا دهد
    (>=$2.5bn طبق گزارش بازرس کل؛ پیش‌بینی خود او $3.5-4bn)، از بلانش، دادستان کل،
    خواسته شد موضوع را بررسی کند و «تعیین کند چه اقدامی باید انجام شود»، و تهدید شد
    که اگر او بماند دولت علیه او اقامهٔ دعوی می‌کند. موضعی صرفاً علیه یک عضو هیئت‌مدیره
    (بدون تعرض به وارش) و بازار افزایش 0.08% در DXY، افزایش +3.7bp در اوراق 30 ساله
    و افت طلا را ثبت کرد - نشانهٔ مخالف، نه سلطهٔ مالی (18 مخالف / 2 موافق). شرط ابطال
    288a87ac همچنان «اقدامی علیه وارش که به‌صورت سلطهٔ مالی قیمت‌گذاری شود» است؛ ثبت
    دادخواست یا صدور حکم برکناری علیه یک عضو شاغل هیئت‌مدیره، نشانهٔ بعدی است (در
    بررسی بعدی، آرایش اوراق 30 ساله/DXY/طلا را بخوانید). مقدار فیلد اوراق 30 ساله
    چهارشنبه 5.639، سقف معاملات آسیا 5.653؛ MarketWatch: «سپتامبری بی‌رحمانه برای
    اوراق، از اکتبری حتی تیره‌تر خبر می‌دهد»؛ فروش عظیم اوراق بدهی پارامونت به‌عنوان
    نشانهٔ فشار ناشی از شرکت‌ها. گزارش کوتاه 3 اکتبر: 288a87ac محقق شد (نتیجهٔ قطعی
    جمعه: ردیف نزولی / اوراق 2 ساله صعودی؛ در کل دوره 18 مخالف / 2 موافق). برای جانشین
    آن مقدار 0.7 برای دوشنبه تا جمعه، 5-9 اکتبر، ثبت شد (بدون جفت جلسات متوالی که
    در هر دو، هر دو صعودی باشند؛ نقاط ارزیابی: حراج اوراق 10 ساله چهارشنبه 17:01Z،
    حراج اوراق 30 ساله پنج‌شنبه 17:01Z، صورت‌جلسه چهارشنبه 18:00Z). اوراق 30 ساله
    در 5.623 بسته شد (سقف 5.647)، در مقایسه با مرز رکود تورمی 5.65؛ DFII10 برابر با
    2.88 (-5bp). اگر قرار باشد جلسه‌ای با افزایش بازده اوراق 30 ساله / افت DXY / افزایش
    طلا رخ دهد، حراج‌ها محل ثبت آن خواهند بود. گزارش کوتاه 5 اکتبر: گشایش یکشنبه،
    اوراق 30 ساله 5.61 (-2bp)، اوراق 10 ساله 5.26، DXY صعودی تا بالاترین سطح 52 هفته‌ای،
    طلا صعودی - این آرایش مالی نیست (DXY صعودی، بخش بلندمدت نزولی). داستان تنش بدهی
    دولتی این هفته فرانسه است (OAT-Bund >140bp، بالاتر از ایتالیا؛ رجوع کنید به euro-sovereign-stress)،
    نه خزانه‌داری. نخستین جلسهٔ 968df4d5 (بدون جفت جلساتی با صعود هر دو از دوشنبه
    تا جمعه) دوشنبه است؛ نقاط ارزیابی: حراج اوراق 10 ساله چهارشنبه 17:01Z، صورت‌جلسه
    چهارشنبه 18:00Z، حراج اوراق 30 ساله پنج‌شنبه 17:01Z. DFII10 برابر با 2.88. 7 اکتبر:
    حراج اوراق 3 ساله سه‌شنبه 4.932، با فاصلهٔ 0.2bp پایین‌تر از بازده پیش از حراج،
    C+ (خریداران مستقیم 31.7% قوی، خریداران غیرمستقیم 57.6% ضعیف). اوراق 30 ساله:
    دوشنبه 5.6645 (+3.5)، سه‌شنبه 5.66، معاملات آسیای چهارشنبه 5.685 (+4.4bp، عبور
    از مرز 5.65) همراه با افزایش DXY و افت طلا - حرکتی ناشی از صرف سررسید/نفت، نه
    آرایش مالی. کسری تجاری $105.6bn (بیشترین میزان از زمان تعرفه‌ها). گلدمن: پنج محرک
    فروش گسترده در بازار نرخ بهره، «ممکن است بیش‌ازحد بوده باشد»؛ دو بدبین کهنه‌کار
    بازار اوراق نسبت به بخش بلندمدت در بازده >5% خوش‌بین شده‌اند. ادعای جدید دربارهٔ
    حراج اوراق 10 ساله (بدون فاصلهٔ بالاتر از بازده پیش از حراج به میزان >=1.0bp،
    مقدار 0.65) شرط ابطال را قابل ارزیابی می‌کند؛ حراج اوراق 30 ساله پنج‌شنبه 17:01Z
    دومین نقطهٔ ارزیابی است. DFII10 برابر با 2.95. 8 اکتبر: حراج اوراق 10 ساله موفق
    شد - $39bn با بازده 5.300% در برابر بازده معاملات پیش از انتشار (WI) برابر با
    5.317% (فاصلهٔ 1.7bp پایین‌تر از بازده پیش از حراج؛ 18fe8bf5 محقق شد)؛ بازده اوراق
    30 ساله از 5.73 (بالاترین سطح 24 ساله) به قیمت پایانی 5.661 کاهش یافت (+2.0bp
    در روز)، اوراق 10 ساله 5.277 (+0.6)، اوراق 2 ساله 4.764 (-2.7): افزایش بازده همراه
    با پرشیب‌شدن منحنی، با افزایش DXY و افت طلا = تحولات میز معاملات نرخ بهره، نه
    تضعیف ارزش پول (968df4d5: تا چهارشنبه هیچ جفت جلساتی با صعود هر دو ثبت نشده است).
    علت اعلام‌شدهٔ این برگشت، گزارشی بود مبنی بر اینکه فرانسه در حال بررسی انتشار
    بیشتر اوراق کوتاه‌مدت است («اقدامی کلاسیک از سوی کشورهایی که با فشار مالی مواجه‌اند»
    - جمع‌بندی) - فشار مالی اروپایی است. صورت‌جلسه: کارشناسان در افزایش بازده به «عدم
    قطعیت مرتبط با برنامهٔ بازخرید خزانه‌داری» اشاره می‌کنند (CNBC: بازخریدها «تأثیر
    اندکی داشتند»)؛ چند نفر خواستار برنامه‌های اضطراری برای اختلال در بازار اوراق
    خزانه بودند. WGC/BMO: خرید ETF در بریتانیا/اتحادیهٔ اروپا از صرف‌های سررسید پیروی
    می‌کند - پوشش ریسک مالی در ETFهاست، نه در COMEX. حراج اوراق 30 ساله پنج‌شنبه 17:01Z
    (قبلی 5.308%) دومین نشانهٔ هفته است - ادعای جدید (0.6، بدون فاصلهٔ بالاتر از بازده
    پیش از حراج به میزان >=1bp)؛ معاملات آسیای پنج‌شنبه، اوراق 30 ساله 5.698 (+3.7)
    همراه با ثبات DXY و افزایش طلا - قیمت‌های پایانی پنج‌شنبه آرایش را تعیین می‌کنند.'
