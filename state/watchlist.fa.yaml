- theme: middle-east-risk-premium
  why_fa: 'دو وضعیت: کنترل سپاه پاسداران انقلاب اسلامی بر تردد از هرمز در برابر محاصره
    آمریکا، همراه با تبادل آشکار آتش از 30-31 اوت، و جبهه دوم دریای سرخ که در 19 سپتامبر
    به ریاض رسید (یک موشک بالستیک حوثی به‌سوی پایتخت، رهگیری‌شده؛ انتساب به حوثی‌ها،
    نه ایران). هرمز 21 سپتامبر (UKMTO به نقل از gcaptain/Maritime Executive): دو نفتکش
    دیگر هدف قرار گرفتند - نفتکش حامل نفت خام ورودی LR Stephanie (72,825 تن ظرفیت
    وزن مرده، جزیره من)، دو مصدوم با جراحات جزئی، در حال ادامه مسیر با نیروی محرکه
    خود؛ یک کشتی حامل LPG خروجی مورد اصابت آوار قرار گرفت، خدمه سالم هستند؛ UKMTO
    هیچ‌یک را به طرفی منتسب نمی‌کند («پرتابه‌های ناشناس»)؛ دست‌کم پنج حادثه برای نفتکش‌ها
    از 16 سپتامبر؛ سطح تهدید JMIC شدید، 116 حادثه از 1 مارس؛ Kpler: تعداد 17 عبور
    در آخر هفته در برابر 37 عبور در هفته قبل و ~125 عبور در روز پیش از جنگ (عبورهای
    با AIS خاموش شمارش نشده‌اند)؛ CENTCOM: تعداد 1 میلیارد بشکه اسکورت‌شده، کمک به
    بیش از 2,000 کشتی، تغییر مسیر 110 شناور. ایران مدعی سرنگونی یک MQ-1 دیگر است (مهر،
    تأییدنشده، قاعده 12)؛ سیاری: «هرمز قطعاً در دست ایران است». واشنگتن 21 سپتامبر:
    ترامپ «ممکن است» در مجمع عمومی سازمان ملل با پزشکیان دیدار کند (یک‌طرفه؛ به گزارش
    مهر، پزشکیان سه‌شنبه عازم می‌شود)؛ رئیس‌جمهور یمن هیچ تعهدی برای حمایت نظامی آمریکا
    دریافت نکرد؛ WSJ: صندوقی به ارزش USD 5 میلیارد برای بازسازی زیرساخت‌های انرژی
    خلیج فارس و کاهش وابستگی به هرمز، در حال مذاکره با عربستان سعودی/امارات (محور
    اصلی ترامپ-GCC)؛ بسنت: همه خطوط هوایی ایران از 23 سپتامبر از طریق تحریم‌های ثانویه
    در سراسر جهان زمین‌گیر می‌شوند، ترکیه در حال تبعیت است، چین پیش از نشست پنج‌شنبه
    با شی درباره تبعیت «بسیار فعالانه درگیر» است، «نمی‌تواند پیش‌بینی کند» جنگ چه
    زمانی پایان می‌یابد - فشار و مسیرهای گفت‌وگو هم‌زمان در حال تشدید هستند. متحدان:
    مکرون برای کمک به تأمین امنیت تأسیسات انرژی عربستان پیشنهاد می‌دهد؛ بریتانیا برای
    مقابله با حوثی‌ها سوخت‌رسانی هوایی پیشنهاد می‌دهد؛ اتحادیه اروپا به‌دنبال امکانات
    عملیاتی برای دریای سرخ است (کالاس). هفت شرط ایران از طریق قطر (رضایی، 19 سپتامبر)
    در سوابق علنی بی‌پاسخ مانده است. نردبان: زیرساخت خارگ/لارک d96debd5 (تا 26 سپتامبر)؛
    وضعیت سمت خلیج فارس 2df323fa (تا 26 سپتامبر)؛ خویشتن‌داری عربستان 33defb45 (تا
    27 سپتامبر)؛ اسکورت‌ها d4f5ffd6 (تا 27 سپتامبر؛ CENTCOM در حال گسترش آن‌هاست)؛
    شناور سعودی 9e629d6e (23 سپتامبر؛ اصابت‌های دوشنبه در هرمز هستند، نه دریای سرخ،
    و ارتباطی با عربستان ندارند)؛ 645cc78a (هیچ گفت‌وگویی با تأیید دوطرفه وجود ندارد،
    سه‌شنبه 23:59Z بسته می‌شود، در مسیر تحقق) -> مورد جانشین در 22 سپتامبر ثبت شد
    (چهارشنبه-یکشنبه، 0.65). نشانه‌ها: گزارش رسمی ترامپ-GCC در سه‌شنبه؛ دیداری با
    پزشکیان که دو طرف آن را تأیید کنند؛ هرگونه دستور حمله آمریکا؛ گزارش‌های SPA درباره
    خسارت؛ انتساب از سوی عربستان به طرفی فراتر از حوثی‌ها؛ نام‌های اعلامی UKMTO؛ متوقف
    شدن یک شناور تحت اسکورت همراه با تلفات (پله بعدی نردبان).'
