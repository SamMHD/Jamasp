  why_fa: 'بازده‌های واقعی عامل غالب اثرگذار بر طلا هستند، و این فدرال رزرو همین حالا
    نرخ بهره را افزایش داد: 16 سپتامبر +25 واحد پایه به 3.75-4.00%، با رأی 12-0، بدون
    جمله‌ای درباره راهنمایی آینده؛ نمودار نقطه‌ای حاکی از یک افزایش دیگر در 2026 (میانه
    4.1؛ 16 نفر از 18 نفر انتظار >=1 افزایش دیگر دارند)، برای 2027 برابر با 4.1، و
    در بلندمدت 3.2. وارش: «انقباضی نیست»، «تورم بیش از حد بالاست»، برآورد PCE اوت
    ~3.6% (انتشار رقم رسمی در اواخر همین ماه). 21 سپتامبر - سه رئیس منطقه‌ای خواستار
    افزایش بیشتر شدند: موسالم (سیاست «تسهیل‌کننده» است، نرخ‌ها «احتمالاً باید بیشتر
    افزایش یابند»، افزایش زودتر و کوچک‌تر به‌جای دیرتر و بزرگ‌تر)؛ کالینز (یک افزایش
    نرخ بهره دیگر در 2026، ثابت نگه‌داشتن در 2027)؛ گولزبی (شوک‌های پایدار عرضه و
    تقاضای ناشی از مخارج سرمایه‌ای هوش مصنوعی ممکن است نرخ‌های بالاتری را ایجاب کنند،
    «حتی اگر کندی رشد به اشتغال آسیب بزند»). بازده 2 ساله با +0.75 واحد پایه در 4.7505
    بسته شد، درحالی‌که بازده 10 ساله 4.5 و 30 ساله 4.7 واحد پایه افت کرد - بخش کوتاه‌مدت
    منحنی بازده میخکوب شده و حرکت نمی‌کند، و در جلسه‌ای با افت -3.7% نفت نیز پایین
    نیامد. قیمت‌گذاری: اکتبر ~55% (جمع‌بندی investinglive در 21 سپتامبر)؛ قراردادهای
    آتی احتمال دو از سه را برای 4.00-4.25% در پایان 2026 نشان می‌دهند؛ BofA همچنان
    اکتبر + دسامبر را پیش‌بینی می‌کند؛ دویچه بانک (21 سپتامبر): بازارها چرخه جهانی
    افزایش نرخ بهره را کمتر از حد لازم در قیمت‌ها لحاظ می‌کنند. سطوح بررسی: بازده
    2 ساله 4.791-4.800 (شکست = هدف برآوردی 5.055؛ پس‌زده‌شدن و سپس <4.600 = تغییر
    جهت)؛ DXY برابر با 100.02 / 100.58 / 101.80. طبق اظهارات ثبت‌شده، راه چشم‌پوشی
    از این اثرات بسته شده است (اشمید 18 سپتامبر، کشکاری 20 سپتامبر، آن سه نفر 21 سپتامبر)
    - افت نفت دیگر بازده 2 ساله را پایین نمی‌کشد. هیچ‌یک از پنج سخنران تا اینجا عضو
    هیئت‌مدیره فدرال رزرو نیست؛ شرط تغییر سناریو (تأیید افزایش اکتبر از سوی یک عضو
    هیئت‌مدیره -> سناریوی نزولی ناشی از نرخ‌ها 60؛ درخواست توقف -> سناریوی پایه 30)
    فعال نشده است. سخنرانان از خوراک ff_calendar تأیید شده‌اند (اثرگذاری کم، پنهان‌شده
    توسط `jamasp calendar`، todo-188): ویلیامز 14:05Z، جفرسون (نایب‌رئیس) 14:20Z،
    بارکین 17:00Z سه‌شنبه 22؛ بار چهارشنبه 23 ساعت 14:05Z؛ ویلیامز 08:10Z، همک 12:50Z،
    پالسون 14:10Z پنج‌شنبه 24؛ ویلیامز 09:15Z، همک 18:00Z جمعه 25. بیدارباش‌های #57
    (جفرسون) و #58 (بار + برآورد اولیه PMI آمریکا). ادعاها: 1889819a (0.7، سه‌شنبه
    23:59Z بسته می‌شود، در مسیر تحقق - بدون جفتی که هر دو صعودی باشند)؛ fc5c5a29 (بدون
    بسته‌شدن بازده 2 ساله در <4.60 تا 25 سپتامبر، 0.55)؛ جدید در 22 سپتامبر: زنجیره
    انتقال احتمال افزایش نرخ بهره در اکتبر تا جمعه در >=45% باقی می‌ماند (0.55) و
    جانشین 1889819a (بدون جفت متوالی که هر دو صعودی باشند تا دوشنبه 28 سپتامبر، 0.7).
    نقاط تعیین‌کننده بعدی: جفرسون سه‌شنبه؛ بار چهارشنبه؛ شاخص قیمت مصرف‌کننده (CPI)
    سپتامبر در اواسط اکتبر؛ FOMC در 28 اکتبر.'
