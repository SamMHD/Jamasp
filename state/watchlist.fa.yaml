  why_fa: 'پل ارتباطی جنگ با فدرال رزرو: انتقال نفت به شاخص قیمت مصرف‌کننده (CPI)،
    کانال فعال احتمال افزایش نرخ بهره است، و نفت در روزهای بدون رویداد فدرال رزرو
    قیمت طلا را تعیین می‌کند - در هر دو جهت. قیمت‌های تسویه 15 سپتامبر: WTI برابر
    با 105.83 / برنت 108.75 (سقف 109.97)؛ از آن زمان پنج تسویه پایین‌تر: 21 سپتامبر
    برنت 100.34، 22 سپتامبر برنت 99.25 (نخستین تسویه زیر 100 در دو هفته؛ 98.78 در
    ساعت 03:30Z چهارشنبه)، WTI نوامبر ~89-90.5 (قرارداد اکتبر در 22 سپتامبر منقضی
    شد) - در پی راه‌اندازی مجدد خط لوله شرق-غرب عربستان (جزئی، با تغییر مسیر تا 4
    میلیون بشکه در روز)، ازسرگیری صادرات ینبع، بارگیری ~12 میلیون بشکه در یک روز (Gulf
    News)، رفت‌وآمدهای شاتلی هرمز/جریان‌های نفتی با AIS خاموش، دور مذاکرات آمریکا-ایران
    که هر دو طرف تأیید کرده‌اند، و رقم اصلی گزارش API مبنی بر افزایش موجودی در برابر
    کاهش مورد انتظار. بخش دچار تنگنا، فرآورده‌ها هستند: گازوئیل در سطوح رکوردی، سوخت
    جت در پی آن (MarketWatch)، ترامپ از ممنوعیت صادرات گازوئیل حمایت می‌کند و می‌گوید
    تصمیم «سریع» گرفته می‌شود (تحلیلگران: زیان‌بار خواهد بود، نه کمک‌کننده). سطوح
    fxempire: حمایت برنت 97-97.5 و سپس میانگین متحرک 50 دوره‌ای در 92.44، مقاومت 102/105؛
    حمایت WTI در 90.47 و سپس 87.7. آزمون این موضع: برنت <100 با بازده 2ساله >=4.70
    = تأیید عدم تقارن، امتیاز دیدگاه نزولی ناشی از نرخ‌ها در 50 می‌ماند - در 22 سپتامبر
    ثبت شد (برنت 99.25، حراج اوراق 2ساله 4.787، منحنی رو به بالا)؛ برنت <100 و بازده
    2ساله <4.70 = از دست رفتن عامل ورودی (امتیاز دیدگاه نزولی ناشی از نرخ‌ها 45) هنوز
    ثبت نشده است. انتقال اثر در اظهارات رسمی یک‌طرفه است (اشمید، کشکاری، موسالم، بارکین:
    «شوک‌های پایدار در قیمت‌گذاری جا افتاده‌اند»، وارش: PCE حدود ~3.6)؛ در خارج نیز
    همین‌طور: ناگل از ECB: «نفت اکنون سنجه کلیدی تورم است، موضع اندکی محدودکننده منتفی
    نیست»، لین: «شوک انرژی طولانی‌تر دوام می‌آورد، تورم تا اواسط 2027 بالا می‌ماند»؛
    PMI مقدماتی استرالیا 50.8 با هزینه نهاده‌ها در بالاترین سطح 3 ماهه. زنجیره تأمین:
    فعالیت جزئی شرق-غرب، ازسرگیری فعالیت ینبع، ایران صفر (CENTCOM)؛ ممنوعیت صادرات
    گازوئیل روسیه تمدید شد؛ BofA پیش‌بینی برنت خود برای نیمه دوم سال را بالا برد (Investing.com،
    خوانده‌نشده). ادعاها: 4dfbd1d8 (رقم کل سپتامبر >=0.4، 0.65)؛ 62c34dbd (هسته <=0.3،
    0.7)؛ بررسی نقطه میانی طبق قاعده-11 در 30 سپتامبر؛ f7a0c23d (هیچ تسویه برنت >=103
    از چهارشنبه تا جمعه، 0.55)؛ 8e425cab با نخستین تسویه صعودی نفت اجرا می‌شود. 24
    سپتامبر: برنت با وجود افزایش 3 میلیون بشکه‌ای موجودی نفت خام (موجودی بنزین و فرآورده‌های
    تقطیری کاهش یافت)، راه‌اندازی مجدد شرق-غرب و صادرات عراق >3 میلیون بشکه در روز،
    در 103.08 (+3.9%) تسویه شد - صرف ریسک بر اساس اظهارات درباره هرمز بازقیمت‌گذاری
    می‌شود، نه بشکه‌ها؛ 102.10 در ساعت 03:30Z. فرآورده‌ها: کاخ سفید با وجود مخالفت
    اعضای کابینه، به ممنوعیت 90 روزه صادرات گازوئیل «نزدیک‌تر می‌شود» (تکذیب قبلی
    کاخ سفید؛ گازوئیل پس از نوسان رفت‌وبرگشتی، اندکی پایین‌تر تسویه شد)؛ سناتورهای
    هر دو حزب خواستار آزادسازی اضطراری ذخایر نفت گرمایشی هستند؛ رکورد قیمت گازوئیل
    در حال انتقال به قیمت مواد غذایی است (MarketWatch). ممنوعیت، مؤلفه انرژی شاخص
    قیمت مصرف‌کننده (CPI) آمریکا را اندکی تعدیل می‌کند و هم‌زمان تنگنای جهانی را تشدید
    می‌کند - ادعاهای سپتامبر (4dfbd1d8 / 62c34dbd) این اثر را در بر می‌گیرند، بررسی
    نقطه میانی در 30 سپتامبر. واردات نفت آسیا همچنان 13% پایین‌تر از پیش از جنگ است
    (Gulf News). آزمون عدم تقارن همچنان برقرار است: برنت <100 با بازده 2ساله >=4.70
    در 22 سپتامبر تأیید شد؛ بازده 2ساله در صعود نفت هم از آن پیروی نکرد - پیشتاز بود
    (PMI). 25 سپتامبر: برنت در پی موشک‌های حوثی‌ها به ینبع/طائف، در 106.60 تسویه شد
    (+3.4%، بالاترین قیمت پایانی از 15 سپتامبر؛ +5% در سقف‌ها)، WTI در 94.61 (روند
    نزولی شش جلسه‌ای قطع شد)؛ سپس در معاملات شبانه با گزارش توافق مرحله‌ای -1% افت
    کرد (105.55 در ساعت 03:31Z). ینبع مسیر جایگزین شرق-غرب است: investinglive می‌گوید
    بارگیری نفتکش‌ها در آنجا «هنوز از سر گرفته نشده است»، در برابر گزارش Gulf News
    در 24 سپتامبر مبنی بر «12 میلیون بشکه در یک روز» - تعارض، شنبه از طریق gcaptain
    رفع شود. فرآورده‌ها: رایت نظر پالایشگران را درباره محدودیت‌های داوطلبانه صادرات
    گازوئیل جویا می‌شود (گزارش ممنوعیت 90 روزه را رد می‌کند)؛ اتحادیه اروپا هشدار
    می‌دهد ممنوعیت به هر دو طرف آسیب می‌زند. آرامکو در حال بررسی مسیرهای صادراتی 4ام
    و 5ام است. بررسی نقطه میانی در 30 سپتامبر (4dfbd1d8 / 62c34dbd). تاریخ PCE اوت
    تا 26 سپتامبر در خوراک خبری نیست (برآورد وارش ~3.6% سال‌به‌سال) - شنبه راستی‌آزمایی
    شود. 26 سپتامبر: برنت در پی طرح هفت‌روزه عراقچی در 104.32 تسویه شد (-2.1%، -$3
    از سقف‌ها؛ +5.1% هفته‌به‌هفته نسبت به 99.25)، WTI در 92.44 (-2.3%)؛ سررسیدهای
    کوتاه‌مدت نیز همراه شدند (-3.5 واحد پایه) - به kinetic-transmission-inverted مراجعه
    شود. تاریخ PCE تأیید شد: چهارشنبه 30 سپتامبر ساعت 12:30Z (تقویم actionforex +
    چشم‌انداز هفته پیش روی Wells Fargo) - اجماع برای رقم کل 0.4 ماه‌به‌ماه / 3.7%
    سال‌به‌سال، هسته 0.3 / 3.4%؛ بازنگری‌های سالانه BEA در همان انتشار («روند کوتاه‌مدت
    ملایم‌تر، رقم اوت داغ‌تر»)؛ بیدارباش #62 برای 45 دقیقه پس از انتشار (13:15Z) ثبت
    شد - این بیدارباش b934960e را امتیازدهی می‌کند (بدون بازنشر <55%) و بررسی نقطه
    میانی طبق قاعده-11 را برای 4dfbd1d8 / 62c34dbd اجرا می‌کند (میانگین برنت سپتامبر
    ~103-104 در برابر ~90 در اوت بوده است: ادعای رقم کل >=0.4 در مسیر تحقق است؛ هسته
    <=0.3 به مسکن/سفر وابسته است). اجماع قیمت‌های پرداختی ISM پنجشنبه ساعت 14:00Z
    برابر با 72 است (از 71.1). تعارض درباره بارگیری ینبع حل‌نشده است (جست‌وجوی gcaptain:
    هیچ مطلبی با تاریخ پس از 3 اوت نیست؛ گزارش 24 سپتامبر Gulf News، «جهش هفت‌برابری،
    AIS خاموش»، همچنان تنها گزارش تاریخ‌دار است). Kpler: جریان نفت خام هرمز این هفته
    33.7 میلیون بشکه در برابر 49.2 میلیون در هفته گذشته - بخش فیزیکی دچار تنگنای بیشتری
    شد، در حالی که صرف ریسک تخلیه شد. 27 سپتامبر: برنت نوامبر 104.32 (تسویه جمعه؛
    قرارداد نوامبر چهارشنبه 30 سپتامبر منقضی می‌شود - نماد @LCO.1 در CNBC آن روز به
    دسامبر منتقل می‌شود، بنابراین هر ادعای تسویه برنت که چهارشنبه را در بر بگیرد،
    قرارداد را مشخص می‌کند، قاعده 17؛ a270f3f1 و 9e1829f8 سه‌شنبه بسته می‌شوند و تأثیری
    نمی‌پذیرند)، WTI نوامبر 92.44 (-8% هفته‌به‌هفته نسبت به ~100.30؛ actionforex:
    میانگین متحرک نمایی 55 روزه در 89.14 و سطح بازگشت 50% در 86.90، سطوحی هستند که
    شکسته‌شدنشان نشان می‌دهد صعود ناشی از جنگ پایان یافته است - به آن‌ها نرسیده است).
    رد رسمی ترامپ (شنبه)، طرحی را که صرف ریسک را تخلیه کرده بود از میان برمی‌دارد؛
    انتظار بازقیمت‌گذاری صعودی در بازگشایی یکشنبه می‌رود. بخش فیزیکی دچار تنگنای بیشتری
    شد، در حالی که صرف ریسک کاهش یافت (Kpler: 33.7 میلیون در برابر 49.2 میلیون بشکه).
    تعارض درباره بارگیری ینبع همچنان حل‌نشده است. انتظارات تورم یک سال آینده UMich
    برابر با 4.6%. PCE چهارشنبه ساعت 12:30Z (اجماع 0.4/3.7، هسته 0.3/3.4): بررسی عمیق
    #62 بررسی نقطه میانی طبق قاعده-11 را برای 4dfbd1d8 / 62c34dbd اجرا می‌کند (میانگین
    برنت سپتامبر ~103-105 در برابر ~90 در اوت: ادعای رقم کل >=0.4 در مسیر تحقق است؛
    هسته <=0.3 به مسکن/سفر وابسته است). قیمت‌های پرداختی ISM پنجشنبه (اجماع 72). گزارش
    کوتاه 30 سپتامبر: بررسی نقطه میانی طبق قاعده-11 اجرا شد - برنت سپتامبر در سراسر
    ماه در محدوده 100-109 تسویه شد (+10% ماه‌به‌ماه طبق مرور؛ WTI سومین رشد ماهانه
    متوالی را ثبت کرد)، در برابر ~90 در اوت: عامل سوخت در شاخص قیمت مصرف‌کننده (CPI)
    سپتامبر همچنان برقرار است، 4dfbd1d8 (رقم کل >=0.4) بر پایه سازوکاری فعال باز می‌ماند؛
    در تغییرات جدید هیچ بازقیمت‌گذاری مخابراتی بازنشرشده یا برآورد آنی مسکن وجود ندارد
    - 62c34dbd (هسته <=0.3) بر مبانی خود برقرار می‌ماند، راستی‌آزمایی‌نشده. شاخص قیمت
    مصرف‌کننده (CPI) استرالیا در 4.0% بر اثر سوخت (میانگین پیراسته 0.2)، همان انتقال
    اثر در خارج است؛ RBA در 4.60، Westpac نوامبر را پیش‌بینی می‌کند. PCE امروز: اجماع
    0.4/3.7، هسته 0.3/3.4، بازنگری‌های BEA در همان انتشار. برنت نوامبر چهارشنبه منقضی
    شد - ادعاهای تسویه، قرارداد دسامبر را مشخص می‌کنند (قاعده 17). گزارش کوتاه 2 اکتبر:
    کانال نزولی نفت برای بخش فرآورده‌ها - آمریکا تهدید به ممنوعیت صادرات گازوئیل می‌کند
    مگر آنکه اروپا ~120 میلیون بشکه را «فوراً» آزاد کند؛ رایت «بسیار مطمئن» است که
    اروپا آزادسازی می‌کند؛ حاشیه سود گازوئیل اتحادیه اروپا بر اثر این اظهارات -7%؛
    توقف صادرات سوخت چین در پس‌زمینه. نفت خام بی‌تأثیر ماند (برنت دسامبر 102.31، پنجشنبه
    +4% در پی موضع‌گیری). میانگین سوخت سپتامبر قطعی شده است -> 4dfbd1d8 (رقم کل شاخص
    قیمت مصرف‌کننده (CPI) سپتامبر >=0.4) بی‌تأثیر می‌ماند؛ رقمی که آزادسازی بر آن
    اثر می‌گذارد، رقم اکتبر است. قیمت‌های پرداختی ISM برابر با 77.9 (فولاد، آلومینیوم،
    نفت، تعرفه‌ها) = بخش هزینه نهاده‌ها همچنان رو به افزایش است.'
