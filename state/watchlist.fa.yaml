    تقاضا برای دارایی امن. از 22 سپتامبر به‌عنوان کانال سوم نام‌گذاری شده؛ در 24 سپتامبر
    سطرهای مستقلی به آن اختصاص یافت، زیرا چهارشنبه نخستین ترک‌ها ظاهر شدند: S&P -0.75%،
    Russell -1.8%، افت Nasdaq با بازده 5.11% اوراق 10ساله؛ MarketWatch: محدودترین
    گستره مشارکت سهام از زمان اوج دات‌کام؛ جمع‌بندی investinglive: استفاده از تعبیر
    «شکستن سد» درباره اوراق؛ BTC در 84.3K (-2.6% پس از +14% طی هفته، ورود سرمایه به
    ETFها حدود ~$1bn/day - همان جریانی که در 21-22 سپتامبر بر طلا غلبه کرد)؛ USDJPY
    در 157.93 در برابر سطح استعلام نرخ 158 بانک مرکزی ژاپن و سطح 160 وزارت دارایی؛
    برآورد اولیه PMI ژاپن در پایین‌ترین سطح چهارماهه؛ بیکاری استرالیا 4.6% (بالاترین
    میزان از 2021). تأیید می‌کند (bearish-rates 50، base 20): ثبت هم‌زمان مجموعه محرک‌های
    بالا در یک جلسه معاملاتی همراه با صعود طلا. باطل می‌کند (کنار گذاشتن فرضیه): دو
    هفته رکوردزنی سهام با بازده اوراق 2ساله >=4.85 و طلای بدون تغییر؛ یا ترک ظاهر
