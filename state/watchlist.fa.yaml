  why_fa: 'کانال کاهش ارزش پول - بهترین توضیح برای طلای بالای $4,000 در برابر بازده
    واقعی مثبت (DFII10 2.62، 21 سپتامبر). 16 سپتامبر: افزایش نرخ بهره با وجود فشار
    سیاسی انجام شد، 12-0 - شرط ابطال خود این سناریو محقق شد (30y -1.3bp در کنار 2y
    +12bp، طلا -1.9%، دلار با عبور از 100). 18 سپتامبر: نشانه یک بار ثبت شد (طلا +0.96%
    در کنار 2y +6.6bp، 10y 5.00، BTC +6%). 21 سپتامبر - نشانه مخالف: طلا -1.0% (Globex)
    در کنار 2y +0.75bp، 10y -4.5bp، 30y -4.7bp، DXY +0.1، BTC +7.1% و رکورد نزدک -
    جریان سرمایه به BTC و سهام هوش مصنوعی رفت، نه طلا. 22 سپتامبر: شکلِ نشانه در بازار
    نقدی (+22 تا 4364 در کنار منحنی بازده +1.5-2.3bp، 30y 5.303) اما یک ردیف بدون
    تغییر (4402.2 در برابر 4401.3)، تضعیف دلار در اواخر معاملات و BTC در 86.5K (+14%
    در هفته) در کنار رکورد نزدک؛ طی معاملات شبانه، طلا هم‌گام با حرکت DXY از 100.54
    -> 100.69، آن $22 را تیک‌به‌تیک پس داد. برداشت: حرکتی ناشی از دلار، نه تقاضای
    خرید ناشی از کاهش ارزش پول. نشانه‌ها 2 موافق / 15 مخالف. 1889819a محقق شد (جانشین
    d8e247ef، 0.7، تا دوشنبه 28 - سه‌شنبه بر مبنای ردیف، هر دو صعودی نبودند). مقدار
    پایه به‌عنوان وزن باقیمانده در 20 می‌ماند؛ اگر d8e247ef نیز بی‌نقص پیش برود، 15.
    تأییدها (پایه 30): دو ردیف متوالی با صعود هر دو، همراه با صعود 30y؛ بسته‌شدن 30y
    در >=5.40 همراه با صعود طلا (aec5cc8b محقق شد - این وضعیت ثبت نشد)؛ طلا +1% در
    جلسه‌ای با نزول نفت و ثبات 2y. اقدام ترامپ علیه وارش که با صعود طلا/صعود 2y قیمت‌گذاری
    شود، تأیید دیگر است (قاعده 7 زمان‌بندی را محدود می‌کند). 24 سپتامبر - دوباره نشانه
    مخالف، در انتهای بلندمدت منحنی: 30y در 5.402 بسته شد (نخستین >=5.40)، همراه با
    طلا -1.7%، DXY +0.5 و BTC -2.6% - شکستی در انتهای بلندمدت منحنی که این سناریو
    به آن نیاز داشت، به‌عنوان حرکتی ناشی از فدرال رزرو معامله شد، نه کاهش ارزش پول؛
    جریان سرمایه به دلار رفت. نشانه‌ها 2 موافق / 16 مخالف. پایه 15. d8e247ef فعال
    است (ردیف چهارشنبه نزولی بود، هیچ جفتی پیش از پنج‌شنبه-جمعه شکل نمی‌گیرد). 25
    سپتامبر - نشانه مخالف، 17 مخالف / 2 موافق: 30y در 5.460 بسته شد (بالاترین سطح
    از 2004)، 10y در 5.163 (بالاترین سطح از 2007)، پس از دومین بازخرید خزانه‌داری
    طی دو هفته و بالاتر بودن بازده حراج 7y از بازده پیش از حراج - و طلا 0.3% افت کرد،
    در کنار DXY +0.2 و BTC بدون تغییر. شکست در انتهای بلندمدت منحنی جهانی است (اوراق
    دولتی آلمان در بالاترین سطح 17 ساله، JGB 10y در بالاترین سطح از 1996) و به نفع
    دلار قیمت‌گذاری شده است. CNBC: «جهش بازده‌ها مشکلی کاملاً تازه برای وارش ایجاد
    می‌کند». پایه 15. d8e247ef فعال است (ردیف پنج‌شنبه نزولی؛ یک جفت به جمعه+دوشنبه
    نیاز دارد). تأیید بدون تغییر: 30y >=5.50 همراه با صعود طلا و نزول DXY. 26 سپتامبر
    - شکل نشانه، با یک واحد پایه کسری: 30y در 5.49 بسته شد (+2.8bp، بالاترین سطح از
    2004؛ 5.532 در طول روز)، 2s30s برابر با 63bp (+12bp طی دو جلسه)، DFII10 2.85 -
    همراه با نزول 0.22% در DXY و صعود 0.27% در طلا: از نظر جهت حرکت، تأیید رکود تورمی
    با پایه 25، اما 5.49 < 5.50 و طلا +0.3% به هیچ میزان معناداری «صعود طلا» محسوب
    نمی‌شود. تأیید نیست؛ یک علامت است. نشانه مخالف 17 مخالف / 2 موافق (جمعه هیچ‌کدام
    نبود - صعود طلا همراه با نزول 2y در حیطه میز معاملات نرخ بهره است). تحقق d8e247ef
    قطعی شد (جمعه هر دو صعودی نبودند، هیچ جفتی نمی‌تواند دوشنبه تکمیل شود؛ سه‌شنبه
    ارزیابی می‌شود). پایه 15. تأیید: بسته‌شدن 30y در >=5.50 همراه با صعود طلا و نزول
    DXY -> پایه 25.'
