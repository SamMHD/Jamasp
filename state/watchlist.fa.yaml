  why_fa: 'بازخریدهای گسترش‌یافتهٔ اوراق بلندمدت خزانه‌داری (19 اوت) عملاً کنترل منحنی
    بازده هستند و بازار آن‌ها را به‌منزلهٔ کاهش ارزش پول تفسیر کرد - فاز روندی طلا
    زمانی آغاز شد که بدهی آمریکا از $40tn گذشت. این ابزار در 9-10 سپتامبر آشکارا شکست
    خورد (حراج اوراق 30 ساله در 5.308 «ضعیف» بود). 18 سپتامبر: «اوراق دوباره سقوط
    می‌کنند» - 10 ساله 5.00، 30 ساله 5.328 - و طلا با دلار بدون تغییر افزایش یافت:
    یک جلسه. 21 سپتامبر: بخش بلندمدت منحنی با نفت -3.7% صعود کرد (30 ساله 5.280) و
    طلا افت کرد. 22 سپتامبر: حراج اوراق 2 ساله ($69bn) در 4.787 با دنبالهٔ 0.2 واحد
    پایه تسویه شد، نمرهٔ C - بدون تنش در بخش کوتاه‌مدت؛ منحنی با افزایش 1.5-2.3 واحد
    پایه بسته شد (5 ساله 4.842، 10 ساله 4.967، 30 ساله 5.303؛ جمع‌بندی investinglive
    برای 10 ساله -6 واحد پایه ثبت کرده بود - اختلاف در مبنا، قیمت بسته‌شدن CNBC مبناست)
    درحالی‌که طلای نقدی $22 افزایش یافت و ردیف بدون تغییر بود - بخش بلندمدت در هیچ‌یک
    از دو جهت هدایت‌کنندهٔ طلا نیست. aec5cc8b در 23 سپتامبر محقق شد (هیچ بسته‌شدن
    اوراق 30 ساله در >=5.40 از جمعه تا سه‌شنبه رخ نداد؛ سقف 5.311). پرلی (فدرال رزرو
    نیویورک): خرید اسناد کوتاه‌مدت «متوقف شده، تمام نشده است». زیر نظر: حراج‌های 5
    ساله/7 ساله در چهارشنبه/پنج‌شنبه (تأییدنشده، todo-185 - هیچ گزارشی در پایگاه داده
    نیست)، هر اظهارنظر بسنت دربارهٔ انتشار اوراق (حضورهای او در 21-22 سپتامبر فقط
    دربارهٔ ایران/چین/گازوئیل بود)، اینکه آیا اوراق 30 ساله در هیچ جلسه‌ای هم‌جهت
    با طلا حرکت می‌کند یا نه. 24 سپتامبر: اوراق 30 ساله در 5.402 بسته شد (CNBC) -
    نخستین بسته‌شدن بالاتر از 5.40 - همراه با 10 ساله در 5.114 (سقف از 2007) و 2 ساله
    در 4.895: حرکتی با افزایش بازده که ابتدا منحنی را مسطح کرد و سپس بر اثر PMI به
    حرکتی موازی تبدیل شد، با طلا نزولی و دلار صعودی. بخش بلندمدت سطح را شکست و طلا
    آن را به‌منزلهٔ کاهش ارزش پول تفسیر نکرد (aec5cc8b پیش‌تر با بسته‌شدن سه‌شنبه
    محقق شده بود). حراج‌های 5 ساله/7 ساله همچنان تأییدنشده‌اند (هیچ گزارشی در پایگاه
    داده نیست، todo-185). زیر نظر: بسته‌شدن اوراق 30 ساله در >=5.45 با DXY نزولی و
    طلا صعودی تنها ثبت بازاری است که سناریوی پایه را تغییر می‌دهد. 25 سپتامبر: این
    ابزار دوباره شکست خورد - خزانه‌داری دومین بازخرید خود در دو هفته را اجرا کرد و
    حراج 7 ساله ($44bn) با دنبالهٔ 0.7 واحد پایه در 5.085% انجام شد؛ اوراق 30 ساله
    در 5.460 بسته شد (+5.9 واحد پایه، بالاترین سطح در 22 سال؛ تصویر لحظه‌ای جمع‌بندی
    5.478)، 10 ساله 5.163 (سقف از ژوئیهٔ 2007)، وام‌های مسکن 7%. رویترز به نقل از
    investinglive: «بازخریدها و مداخله در ین نتوانسته‌اند بازده‌ها را مهار کنند»؛
    استراتژیست‌ها بخش عمدهٔ افزایش از مارس را به انتظارات افزایش نرخ بهرهٔ فدرال رزرو
    و باقی را به رشد و نفت نسبت دادند؛ «6% برای اوراق 10 ساله در حال تبدیل‌شدن به
    آستانهٔ درد بعدی است». جهانی: استقراض رکوردی آلمان در حدود EUR525bn، اوراق دولتی
    آلمان در سقف 17 ساله، اوراق دولتی 10 سالهٔ ژاپن در سقف از 1996. طلا نزولی همراه
    با DXY صعودی - به‌منزلهٔ کاهش ارزش پول تفسیر نشد. تنها عامل تغییر سناریوی پایه:
    30 ساله >=5.50 با DXY نزولی و طلا صعودی. 26 سپتامبر: اوراق 30 ساله در 5.49 بسته
    شد (+2.8 واحد پایه، بالاترین سطح از 2004؛ درون‌روزی 5.532)، 10 ساله 5.165 (درون‌روزی
    5.23، سقف از 2007)، فاصلهٔ 2s30s برابر 63 واحد پایه (+12 واحد پایه طی دو جلسه
    با افت بازده 2 ساله) - افزایش شیب منحنی همراه با افزایش بازده در روزی که دلار
    0.22% افت کرد و طلا 0.27% بالا رفت: بخش بلندمدت به دلایل خاص خودش فروخته می‌شود
    (عرضه، بازنگری‌ها، «6% مطرح است» به‌عنوان مطلب ضروری investinglive) و طلا همچنان
    آن را به‌منزلهٔ کاهش ارزش پول تفسیر نمی‌کند، حتی با کناررفتن مانع دلار. جزئیات
    حراج‌های 5 ساله/7 ساله همچنان تأییدنشده است (todo-185). پایان فصل چهارشنبه است.
    تنها عامل تغییر سناریوی پایه: بسته‌شدن اوراق 30 ساله در >=5.50 با DXY نزولی و
    طلا صعودی. 27 سپتامبر: گزارش توضیحی CNBC (تیری ویزمن از مک‌کواری): اوراق 10 ساله
    در 5.23 «بیشتر به انتشار اوراق مربوط است تا داستان تورم» - تأمین مالی کسری بودجه
    به‌علاوهٔ بدهیِ مخارج سرمایه‌ای هوش مصنوعی (ونگارد: $132bn انتشار توسط Alphabet/Amazon/Meta/Microsoft/Oracle
    تا پایان ژوئیه در برابر حدود $35bn در سال طی 2020-24؛ $300-570bn انتشار مرتبط
    با هوش مصنوعی در سال جاری)، «فدرال رزروی نداریم که به‌شدت سیاست انقباضی اعمال
    کند»، «این بازده‌ها می‌توانند بالاتر بروند». بخش بلندمدت داستان عرضهٔ دیرش است
    که بازار آن را به نفع دلار قیمت‌گذاری می‌کند - نشانهٔ مخالف طلا (17 مخالف / 2
    موافق) پابرجاست. actionforex: اوراق 10 ساله (سقف کانال 5.23، هدف برآوردی 5.413)
    اکنون کلید دلار است؛ توقف حرکت، DXY را به 99.7-99.9 بازمی‌گرداند. جمعه: 30 ساله
    5.49 با DXY نزولی و طلا صعودی به میزان 0.3% - یک واحد پایه و یک اندازه کمتر از
    محرک base-25. جزئیات 5 ساله/7 ساله همچنان تأییدنشده است (todo-185). پایان فصل
    چهارشنبه است. تنها عامل تغییر سناریوی پایه: بسته‌شدن اوراق 30 ساله در >=5.50 با
    DXY نزولی و طلا صعودی. 1 اکتبر: ترامپ چهارشنبه 20:00Z (Truth Social): پاول باید
    به‌دلیل بازسازی ساختمان مرکزی از هیئت‌مدیره استعفا دهد (طبق گزارش بازرس کل >=$2.5bn؛
    پیش‌بینی خود او $3.5-4bn)، از بلانش، دادستان کل، خواسته شد بررسی کند و «تعیین
    کند چه اقدامی انجام شود»، و تهدید شد در صورت ماندن او دولت اقامهٔ دعوا خواهد کرد.
    موضعی صرفاً علیه یک عضو هیئت‌مدیره (وارش دست‌نخورده) و بازار DXY صعودی به میزان
    0.08%، اوراق 30 ساله +3.7 واحد پایه، طلا نزولی را ثبت کرد - نشانهٔ مخالف، نه سلطهٔ
    مالی (18 مخالف / 2 موافق). شرط نقض 288a87ac همچنان «اقدامی علیه وارش که به‌منزلهٔ
    سلطهٔ مالی قیمت‌گذاری شود» است؛ طرح رسمی دعوا یا حکم برکناری علیه یک عضوِ در حال
    خدمت هیئت‌مدیره نشانگر بعدی است (در پایش بعدی، الگوی 30 ساله/DXY/طلا را بخوانید).
