    مصرف‌کننده (CPI) سپتامبر ژاپن — هسته 2.1% (نخستین بار بالاتر از 2% از دسامبر؛
    در برابر 1.7% قبلی)، کل 2.1%، هسته-هسته 2.4% در برابر انتظار 2.3% (در برابر 1.9%
    قبلی). اجماع بازار: بانک ژاپن در 30 اکتبر نرخ را در 1.25% ثابت نگه می‌دارد و چشم‌انداز
