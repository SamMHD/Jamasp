  why_fa: 'بازده‌های واقعی عامل غالب اثرگذار بر طلا هستند، و این فدرال رزرو همین حالا
    نرخ بهره را افزایش داد: 16 سپتامبر +25bp به 3.75-4.00%، با رأی 12-0، بدون جمله‌ای
    درباره راهنمایی آتی؛ نمودار نقطه‌ای یک افزایش دیگر در 2026 را نشان می‌دهد (میانه
    4.1؛ 16 نفر از 18 نفر انتظار >=1 افزایش دیگر دارند). وارش: «محدودکننده نیست»،
    برآورد PCE اوت ~3.6%. طیف رؤسای منطقه‌ای همچنان خواستار افزایش بیشتر است: موسالم،
    کالینز، گولزبی (21 سپتامبر)؛ کالینز دوباره در 22 سپتامبر («می‌توانیم بر ثبات قیمت‌ها
    تمرکز کنیم»)؛ بارکین 22 سپتامبر 17:00Z (CFA بالتیمور): «ریسک‌های تورم از ریسک‌های
    اشتغال حداکثری بیشتر است»، >60% از دسته‌های PCE بالاتر از >3%، بنگاه‌ها هزینه‌ها
    را منتقل می‌کنند، شاید یک «تذکر» کافی نباشد - اما این چرخه «می‌تواند شبیه تعدیل
    میان‌چرخه‌ای گرینسپن باشد» (همان ~75bp اواسط دهه 1990): انقباضی با یک سقف، و سهام
    خانه‌سازان در واکنش به آن صعود کرد. دو نوبت سخنرانی اعضای هیئت‌عامل/نیویورک (جفرسون،
    ویلیامز، 22 سپتامبر) درباره سازوکارهای عملیاتی بود - بدون راهنمایی آتی. معاملات
    بازار: حراج اوراق 2 ساله ($69bn، 22 سپتامبر) در 4.787 نهایی شد، با فاصله 0.2bp
    بالاتر از بازده پیش از حراج، نمره C - بالاترین بازده اوراق 2 ساله از 2024، عرضه
    را بدون تنش جذب کرد؛ منحنی بازده در پایان 1.5-2.3bp بالاتر بسته شد (CNBC: اوراق
    5 ساله 4.842، 10 ساله 4.967، 30 ساله 5.303)، در جلسه‌ای با برنت -1.1% و یک دور
    مذاکرات آمریکا-ایران با تأیید هر دو طرف - سررسیدهای کوتاه همراه نفت پایین نمی‌آیند
    (نادیده‌گرفتن اثر شوک بر اساس اظهارات ثبت‌شده منتفی شده است: اشمید، کشکاری، آن
    سه نفر، بارکین). نرخ پایانی اوراق 2 ساله در 22 سپتامبر قابل بازیابی نیست (US2Y
    در CNBC خالی است). قیمت‌گذاری: اکتبر «کمی بیش از 50%» (investinglive، 13:38Z،
    22 سپتامبر، بدون گزارش بعدی)؛ BofA همچنان اکتبر + دسامبر را حفظ کرده؛ دویچه بانک:
    بازارها چرخه جهانی افزایش نرخ بهره را کمتر از واقع قیمت‌گذاری می‌کنند. نقاط بررسی:
    اوراق 2 ساله 4.791-4.800 (شکست = هدف برآوردی 5.055؛ پس‌زدن و سپس <4.600 = برگشت)؛
    DXY برابر با 100.02 / 100.58 / 101.80. شرط تغییر سناریو (تأیید اکتبر از سوی یک
    عضو هیئت‌عامل -> سناریوی نزولی ناشی از نرخ بهره 60؛ درخواست توقف -> سناریوی پایه
    30) فعال نشده است. سخنرانان (ff_calendar، Low، todo-188): بار چهارشنبه 23 ساعت
    14:05Z (یادآور #59، ابتدا بررسی محل رویداد - فهرست هیئت‌عامل فقط وام‌دهی فرصت
    دوباره و هوش مصنوعی را نشان می‌دهد)؛ ویلیامز 08:10Z، بارکین 12:30Z، همک 12:50Z،
    پالسن 14:10Z پنجشنبه؛ ویلیامز 09:15Z، همک 18:00Z جمعه. گزاره‌ها: fc5c5a29 (هیچ
    نرخ پایانی اوراق 2 ساله <4.60 تا 25 سپتامبر نباشد، 0.55)؛ 4872cd75 (گزارش احتمال
    اکتبر >=45% تا جمعه، 0.55)؛ 1a513d72 (هیچ گزارش >=60% تا چهارشنبه 23:59Z نباشد،
    0.55 - ریسک بار)؛ d8e247ef (هیچ جفت متوالی با صعود هر دو تا دوشنبه 28 نباشد، 0.7
    - سه‌شنبه ردیف بدون تغییر بود، نه صعود هر دو). ایستگاه‌های بعدی: بار چهارشنبه؛
    قیمت‌های پرداختی PMI مقدماتی آمریکا چهارشنبه 13:45Z؛ شاخص قیمت مصرف‌کننده (CPI)
    سپتامبر در اواسط اکتبر؛ FOMC در 28 اکتبر. گزارش کوتاه 24 سپتامبر: تغییر سناریو
    چهارشنبه فعال شد (وزن‌ها 15/60/25). PMI ترکیبی مقدماتی 58.4 (هزینه نهاده‌ها در
    بالاترین سطح از اکتبر 2022) + بار («در سناریوی پایه من، احتمالاً تعدیلات بیشتری
    در سیاست لازم خواهد بود») -> اکتبر 65% در جمع‌بندی پایانی (74% در طول روز، «94bp
    دیگر از اینجا»)؛ اوراق 2 ساله در 4.895 بسته شد (+12bp، CNBC)، 10 ساله 5.114 (بالاترین
    سطح از 2007)، 30 ساله 5.402 (نخستین بسته‌شدن >=5.40)، DXY برابر با 101.12؛ ردیف
    طلا -1.74%. 1a513d72 محقق نشد (گزارش >=60% از پست PMI در 13:51Z آمد). فعال: 6e168240
    (اوراق 2 ساله >=4.80 چهارشنبه محقق شد، بخش پنجشنبه)، 1e91793f (هیچ گزارش <55%
    پنجشنبه-جمعه نباشد، 0.55)، 4872cd75 (>=45%)، fc5c5a29 (هیچ نرخ پایانی <4.60 نباشد).
    پنجشنبه: SNB در 07:30Z، ویلیامز 08:10Z (محل رویداد در فهرست فدرال رزرو نیویورک
    نیست)، درخواست‌های بیمه بیکاری 12:30Z با اجماع 200K، بارکین 12:30Z، همک 12:50Z،
    پالسن 14:10Z؛ جمعه ویلیامز 09:15Z، اشمید 13:20Z، همک 18:00Z - همگی رؤسای منطقه‌ای،
    بدون عضو هیئت‌عامل، فقط نشانگرهای پایش. بازگشت سناریو: گزارش <55% یا درخواست‌های
    بیمه بیکاری >230K همراه با درخواست توقف از سوی ویلیامز -> سناریوی نزولی ناشی از
    نرخ بهره 50. گزارش کوتاه 25 سپتامبر: وزن‌ها در 15/60/25 حفظ شدند. پنجشنبه بر شمار
    صداهای همسو افزود و بازار از آن‌ها جلو زد: اکتبر 77.5% (گزارش actionforex از قراردادهای
    آتی وجوه فدرال در 09:16Z؛ جمع‌بندی قاره آمریکا هیچ جمله‌ای درباره احتمال نداشت).
    ویلیامز (مجمع سیاست‌گذاری کلان لندن): یک افزایش دیگر در 2026 «معقول» است، به اکتبر
    متعهد نشد، راهنمایی آتی «تمام شده»، اقتصاد «در برابر افزایش قیمت انرژی تاب‌آور»
    است؛ همک: ریسک‌ها «به سمت بالا متمایل‌اند»، خطر شکل‌گیری «ذهنیت تورمی» بر اثر
    شوک‌های مکرر؛ پالسن (دارای حق رأی): «ممکن است اندکی انقباض بیشتر موجه باشد». درخواست‌های
    بیمه بیکاری 197K، فروش خانه‌های نوساز 684K. اوراق 2 ساله در 4.895 (CNBC) / 4.916
    (جمع‌بندی) بسته شد، 10 ساله 5.163 (بالاترین سطح از 2007)، 30 ساله 5.460 (بالاترین
    سطح از 2004). 6e168240 محقق شد (هر دو بخش). فعال: 1e91793f (>=55%) و 4872cd75
    (>=45%) جمعه در مسیر تحقق بسته می‌شوند؛ fc5c5a29 جمعه بسته می‌شود؛ گزاره جدید
    86f87a36 (هیچ نرخ پایانی اوراق 2 ساله <4.80 از جمعه تا سه‌شنبه نباشد، 0.55). سخنرانان
    جمعه: ویلیامز 09:15Z (دوباره)، اشمید 13:20Z، همک 18:00Z - بدون عضو هیئت‌عامل؛
    برنامه فدرال رزرو برای 28-29 سپتامبر هنوز در خوراک داده نیست. بازگشت سناریو بدون
    تغییر: گزارش <55% یا درخواست توقف از سوی یک عضو هیئت‌عامل -> سناریوی نزولی ناشی
    از نرخ بهره 50. NFP در 2 اکتبر: یادآور #61. گزارش کوتاه 26 سپتامبر: وزن‌ها در
    15/60/25 حفظ شدند (روز سوم). جمعه: اوراق 2 ساله در 4.86 بسته شد (-3.5bp؛ آغاز
    4.912، کف 4.845) در واکنش به طرح هفت‌روزه عراقچی و برنت -2.1% - سررسیدهای کوتاه
    برای نخستین بار در این رژیم همراه نفت پایین آمدند (~1.7bp به‌ازای هر درصد برنت)،
    بدون گزارش احتمال و بدون سخنران در جلسه؛ جمع‌بندی: «دلار با کاهش نگرانی‌های تورمی
    اندکی ضعیف‌تر شد». اوراق 10 ساله 5.165 بدون تغییر (در طول روز 5.23، بالاترین سطح
    از 2007)، 30 ساله 5.49 (بالاترین سطح از 2004). ویلیامز (جمعه): شوک‌های مداوم عرضه
    مبارزه را سخت‌تر می‌کنند؛ بازار کار منبع تورم نیست؛ تعرفه‌ها به‌تنهایی تورم پایدار
    ایجاد نمی‌کنند. هیچ گزارش احتمال جمعه در هیچ‌جا نبود (جست‌وجو شد) - آخرین رقم
    77.5% (پنجشنبه). ارزیابی‌شده: fc5c5a29 محقق شد (هیچ نرخ پایانی اوراق 2 ساله <4.60
    نبود)، 4872cd75 محقق شد (>=45%)، 1e91793f محقق شد (>=55%). فعال: 86f87a36 (هیچ
    نرخ پایانی اوراق 2 ساله <4.80 از جمعه تا سه‌شنبه نباشد؛ رقم جمعه 4.86 شرط را برآورده
    می‌کند)؛ گزاره جدید b934960e (هیچ گزارش احتمال <55% در روز PCE، چهارشنبه 30 سپتامبر،
    نباشد، 0.55) که با بررسی عمیق #62 در زمان انتشار+45 ارزیابی می‌شود. هفته آینده
    از طریق خلاصه تقویم actionforex + چشم‌انداز هفته آینده ولز فارگو تأیید شد (BLS/BEA
    403): PCE چهارشنبه 30 سپتامبر 12:30Z (اجماع 0.4/3.7 کل، 0.3/3.4 هسته؛ بازنگری‌های
    سالانه «روند ملایم‌تر، اوت داغ‌تر»)، ISM پنجشنبه 1 اکتبر 14:00Z (55.0؛ قیمت‌های
    پرداختی 72)، NFP جمعه 2 اکتبر 12:30Z (اجماع 100K در برابر 162K، UR برابر با 4.1،
    AHE برابر با 0.3؛ تاریخ یادآور #61 برقرار است)، RBA سه‌شنبه 04:30Z (4.60)، شاخص
    قیمت مصرف‌کننده (CPI) منطقه یورو جمعه (3.7%). سخنرانان فدرال رزرو دوشنبه-جمعه:
    هیچ‌کس در هیچ خوراک داده‌ای دیده نمی‌شود (todo-001/188؛ فهرست هیئت‌عامل = عناوین
    گذشته). شروط تغییر سناریو: گزارش <55% یا درخواست توقف از سوی یک عضو هیئت‌عامل
    -> سناریوی نزولی ناشی از نرخ بهره 50؛ گزارش PCE برابر با >=80% همراه با نرخ پایانی
    اوراق 2 ساله >=4.95 -> 65؛ توافقی با تأیید هر دو طرف همراه با اوراق 2 ساله <4.75
    -> 50 (صعود طلا از مسیر سررسیدهای کوتاه). گزارش کوتاه 27 سپتامبر: وزن‌ها در 15/60/25
    حفظ شدند (روز چهارم). اصلاح: یک گزارش جمعه وجود داشت - مطلب توضیحی شنبه CNBC (13:30Z):
    CME FedWatch برای اکتبر 64%، در برابر 77.5% پنجشنبه - افت 13.5 واحد درصدی در واکنش
    به طرح عراقچی و برنت -2.1%، بدون داده، بدون سخنران. انتظارات تورمی یک‌سال‌آینده
    سپتامبر UMich برابر با 4.6% (از 4.0%، بالاترین سطح از ژوئن). گزارش هفتگی actionforex:
    «قیمت‌گذاری فدرال رزرو تا جمعه از اوج افراطی اواسط هفته عقب نشست»؛ اوراق 2 ساله
    بیش‌ازحد کشیده شده است (RSI روزانه >72؛ سقف 4.912، هدف برآوردی 5.055) و اکنون
    اوراق 10 ساله (سقف 5.23، هدف برآوردی 5.413) جهت دلار را تعیین می‌کند؛ مقاومت DXY
    در 101.80-102.86، محدوده عقب‌نشینی 99.7-99.9 اگر اوراق 10 ساله متوقف شود. رد علنی
    طرح هفت‌روزه توسط ترامپ (شنبه، پس از تسویه جمعه) زنجیره نفت -> اوراق 2 ساله را
    در آستانه مهلت رضایی دوباره رو به بالا می‌چرخاند. گزاره جدید efd9700b (هیچ گزارش
    <55% از دوشنبه 28 تا سه‌شنبه 29 نباشد، 0.55؛ سقف قاعده-19 چون برنامه سخنرانان
    نامعلوم است) جایگزین 1e91793f می‌شود؛ b934960e روز PCE را پوشش می‌دهد. سخنرانان
    فدرال رزرو دوشنبه-جمعه: هنوز هیچ‌کس دیده نمی‌شود (از صفحه تقویم هیئت‌عامل فقط
    سربرگ آن استخراج می‌شود). شروط تغییر سناریو بدون تغییر: گزارش <55% یا درخواست
    توقف از سوی یک عضو هیئت‌عامل -> سناریوی نزولی ناشی از نرخ بهره 50؛ گزارش PCE برابر
    با >=80% همراه با نرخ پایانی اوراق 2 ساله >=4.95 -> 65. گزارش کوتاه 28 سپتامبر:
    آغاز بازار زنجیره را به حرکت درآورد - اوراق 2 ساله 4.90 (+3.7bp)، 10 ساله 5.20،
    30 ساله 5.51 (سقف 5.525)، طلا -2.1%؛ اکتبر 64% برقرار است (هیچ گزارش تازه‌ای در
    تغییرات نیست، efd9700b حاشیه 9 واحد درصدی دارد). سخنرانان اکنون از طریق جدول رویدادها
    دیده می‌شوند (با برچسب Low): بومن دوشنبه 12:15Z (محل رویداد تأیید نشده - نشانگر
    پایش، قاعده 24؛ فهرست هیئت‌عامل سخنرانی‌های نظارتی او در لندن را ذکر می‌کند)،
    کوک 17:25Z، بارکین 17:30Z؛ سه‌شنبه بومن/بار/گولزبی/ موسالم/ویلیامز/والر 15:00-19:00Z؛
    پنجشنبه والر 14:00Z همراه با ISM. بسنت یکشنبه: فدرال رزرو باید «ذهنی باز» داشته
    باشد (بهره‌وری هوش مصنوعی) - عامل نقض ناشی از توقف تحمیلی برای 288a87ac (هیچ جفت
    متوالی با صعود هر دو از سه‌شنبه 29 سپتامبر تا دوشنبه 5 اکتبر نباشد، 0.65). d8e247ef
    محقق شد (خانواده 3/3). گزارش کوتاه 29 سپتامبر: گزارش احتمال ~70% برای اکتبر و
    ~60% برای اکتبر+دسامبر (investinglive دوشنبه 22:59Z)؛ کوک (اوکلند، دوشنبه) اندکی
    انقباضی‌تر - هوش مصنوعی + نفت همچنان تورم را «در ماه‌های پیش رو» بالا می‌برند،
    افزایش‌های بیشتر وابسته به داده‌ها، بازار کار «در موقعیت مناسبی برای تحمل» نرخ‌های
    بالاتر؛ بومن درباره سیاست چیزی نگفت. نرخ پایانی اوراق 2 ساله 4.924 (+6.4bp)، 10
    ساله 5.242، 30 ساله 5.562: سررسیدهای بلند تحت تأثیر عرضه/بازده‌های واقعی سکان
    را به دست گرفتند (ضعیف‌ترین حراج اوراق 7 ساله در یک سال)، بنابراین نرخ پایانی
    اوراق 10 ساله >5.25 همراه با اوراق 2 ساله بدون تغییر، نشانه جدید حرکت صرفاً سررسیدهای
    بلند است. سه‌شنبه: شش سخنران - بومن 15:00Z (عناوین نظارتی منشن هاوس)، بار 16:40Z،
    گولزبی 17:00Z، موسالم 17:30Z، ویلیامز 18:00Z، والر 19:00Z (فهرست هیئت‌عامل: «چشم‌انداز
    اقتصادی و... ارتباطات سیاستی من»، بدون تاریخ - بررسی عمیق مشروط #63 در 19:45Z).
    گزاره‌های فعال: efd9700b (هیچ گزارش <55% تا سه‌شنبه نباشد)، 86f87a36 (هیچ نرخ
    پایانی اوراق 2 ساله <4.80 تا سه‌شنبه نباشد)، b934960e (جلسه PCE)، 288a87ac (هیچ
    جفت با صعود هر دو تا 5 اکتبر نباشد). ایستگاه‌های بعدی: PCE چهارشنبه 12:30Z (#62)،
    ISM+والر پنجشنبه 14:00Z، NFP جمعه 12:30Z (#61). 29 سپتامبر #64 (19:45Z): ویلیامز
    (دارای حق رأی دائمی) 18:00Z - پس از سپتامبر «نیازی به عجله نیست»، اگر اقتصاد مطابق
    انتظارات پیش برود «یک افزایش دیگر در سال جاری محتمل است»، تورم 3.5% در سال جاری
    / 2% در 2028؛ گزارش investinglive: اکتبر 54% از 64%، اوراق 2 ساله -2.5bp به 4.90.
