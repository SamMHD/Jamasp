    4 اکتبر)؛ EUR/USD از 1.1380 -> کف 1.1165 (actionforex: سطوح 1.1150 / 1.1080 در
    پایین، 1.1275 / 1.1320 در بالا)؛ MUFG در موقعیت فروش EUR/JPY. همین عامل DXY را
