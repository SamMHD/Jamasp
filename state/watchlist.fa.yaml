    در حال بررسی «عضویت وابسته» در اتحادیه اروپا؛ 16 سپتامبر: ترامپ اتحادیه اروپا
    را بر سر این طرح «خصمانه» تهدید می‌کند؛ 18 سپتامبر: فون در لاین می‌گوید کانادا
    می‌تواند نخستین «عضو وابسته» اتحادیه اروپا شود - خبری درباره تغییر هم‌راستایی،
