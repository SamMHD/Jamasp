  why_fa: 'بازده‌های واقعی محرک غالب طلا هستند و این فدرال رزرو همین حالا نرخ را افزایش
    داد: 16 سپتامبر +25bp به 3.75-4.00%، با رأی 12-0، بدون جمله‌ای درباره مسیر آینده؛
    نمودار نقطه‌ای یک افزایش دیگر در 2026 را نشان می‌دهد (میانه 4.1؛ 16 نفر از 18
    نفر >=1 افزایش دیگر را پیش‌بینی می‌کنند). وارش: «محدودکننده نیست»، برآورد PCE
    اوت ~3.6%. اردوگاه منطقه‌ای همچنان افزایش بیشتری می‌خواهد: موسالم، کالینز، گولزبی
    (21 سپتامبر)؛ کالینز دوباره در 22 سپتامبر («می‌توان بر ثبات قیمت‌ها تمرکز کرد»)؛
    بارکین 22 سپتامبر 17:00Z (CFA بالتیمور): «ریسک‌های تورم از ریسک‌های اشتغال حداکثری
    بیشتر است»، >60% از دسته‌های PCE بالای >3% هستند، شرکت‌ها هزینه‌ها را منتقل می‌کنند،
    یک «تذکر» شاید کافی نباشد - اما این چرخه «می‌تواند شبیه تعدیل میان‌چرخه‌ای گرینسپن
    باشد» (همان ~75bp اواسط دهه 1990): انقباضی با سقف، و سهام شرکت‌های خانه‌سازی با
    این سخنان رشد کرد. دو نوبت اعضای هیئت‌مدیره/نیویورک (جفرسون، ویلیامز 22 سپتامبر)
    درباره سازوکارهای اجرایی بود - بدون راهنمایی. تابلوی بازار: حراج اوراق 2ساله ($69bn،
    22 سپتامبر) در 4.787، با فاصله 0.2bp بالاتر از نرخ پیش از حراج، نمره C انجام شد
    - بالاترین بازده 2ساله از 2024 عرضه را بدون تنش جذب کرد؛ منحنی با افزایش 1.5-2.3bp
    بسته شد (CNBC: 5ساله 4.842، 10ساله 4.967، 30ساله 5.303)، در جلسه‌ای با برنت -1.1%
    و یک دور گفت‌وگوی آمریکا-ایران که هر دو طرف تأیید کردند - بخش کوتاه‌مدت منحنی
    همراه نفت پایین نمی‌رود (چشم‌پوشی از شوک، طبق اظهارات ثبت‌شده، منتفی شد: اشمید،
    کشکاری، آن سه نفر، بارکین). نرخ پایانی 2ساله در 22 سپتامبر قابل بازیابی نیست (US2Y
    در CNBC خالی است). قیمت‌گذاری: اکتبر «کمی بیش از 50%» (investinglive در 13:38Z
    روز 22 سپتامبر، بدون گزارش بعدی)؛ BofA اکتبر + دسامبر را حفظ می‌کند؛ دویچه بانک:
    بازارها چرخه جهانی افزایش نرخ بهره را کمتر از واقع قیمت‌گذاری می‌کنند. نقاط کنترل:
    2ساله 4.791-4.800 (شکست = هدف برآوردی 5.055؛ پس‌زده‌شدن و سپس <4.600 = برگشت)؛
    DXY برابر 100.02 / 100.58 / 101.80. شرط تغییر (تأیید اکتبر توسط عضو هیئت‌مدیره
    -> سناریوی نزولی ناشی از نرخ‌ها 60؛ درخواست مکث -> پایه 30) فعال نشده است. سخنرانان
    (ff_calendar، کم، todo-188): بار چهارشنبه 23، 14:05Z (بیدارباش #59، ابتدا بررسی
    محل - فهرست هیئت‌مدیره فقط وام‌دهی فرصت دوباره و هوش مصنوعی را نشان می‌دهد)؛ ویلیامز
    08:10Z، بارکین 12:30Z، هاماک 12:50Z، پاولسون 14:10Z پنج‌شنبه؛ ویلیامز 09:15Z،
    هاماک 18:00Z جمعه. ادعاها: fc5c5a29 (نبود نرخ پایانی 2ساله <4.60 تا 25 سپتامبر،
    0.55)؛ 4872cd75 (گزارش احتمال اکتبر >=45% تا جمعه، 0.55)؛ 1a513d72 (نبود گزارش
    >=60% تا چهارشنبه 23:59Z، 0.55 - ریسک بار)؛ d8e247ef (نبود دو جلسه متوالی با رشد
    هر دو تا دوشنبه 28، 0.7 - سه‌شنبه ردیف بدون تغییر بود، نه رشد هر دو). ایستگاه‌های
    بعدی: بار چهارشنبه؛ قیمت‌های پرداختی PMI مقدماتی آمریکا چهارشنبه 13:45Z؛ شاخص
    قیمت مصرف‌کننده (CPI) سپتامبر در اواسط اکتبر؛ FOMC در 28 اکتبر. گزارش 24 سپتامبر:
    تغییر چهارشنبه فعال شد (وزن‌ها 15/60/25). PMI ترکیبی مقدماتی 58.4 (هزینه نهاده‌ها
    در بالاترین سطح از اکتبر 2022) + بار («در سناریوی پایه من، احتمالاً تعدیلات بیشتری
    در سیاست لازم خواهد بود») -> اکتبر 65% در جمع‌بندی (74% طی روز، «94bp دیگر از
    اینجا»)؛ 2ساله در 4.895 بسته شد (+12bp، CNBC)، 10ساله 5.114 (سقف از 2007)، 30ساله
    5.402 (نخستین بسته‌شدن >=5.40)، DXY برابر 101.12؛ ردیف طلا -1.74%. ادعای 1a513d72
    ناموفق (گزارش >=60% از پست PMI در 13:51Z آمد). فعال: 6e168240 (2ساله >=4.80 چهارشنبه
    موفق، بخش پنج‌شنبه)، 1e91793f (نبود گزارش <55% پنج‌شنبه-جمعه، 0.55)، 4872cd75
    (>=45%)، fc5c5a29 (نبود بسته‌شدن <4.60). پنج‌شنبه: SNB در 07:30Z، ویلیامز 08:10Z
    (محل در فهرست فدرال رزرو نیویورک نیست)، درخواست‌های بیمه بیکاری 12:30Z اجماع 200K،
    بارکین 12:30Z، هاماک 12:50Z، پاولسون 14:10Z؛ جمعه ویلیامز 09:15Z، اشمید 13:20Z،
    هاماک 18:00Z - همگی رؤسای منطقه‌ای، بدون عضو هیئت‌مدیره، فقط نشانگر بررسی. بازگشت
    تغییر: گزارش <55% یا درخواست‌های بیمه بیکاری >230K همراه با درخواست مکث از ویلیامز
    -> سناریوی نزولی ناشی از نرخ‌ها 50. گزارش 25 سپتامبر: وزن‌ها در 15/60/25 حفظ شد.
    پنج‌شنبه بر شمار صداهای همسو افزود و بازار جلوتر از آن‌ها رفت: اکتبر 77.5% (گزارش
    actionforex از قراردادهای آتی وجوه فدرال در 09:16Z؛ جمع‌بندی قاره آمریکا هیچ جمله‌ای
    درباره احتمال نداشت). ویلیامز (مجمع سیاست کلان لندن): یک افزایش دیگر در 2026 «معقول»
    است، به اکتبر متعهد نمی‌شود، راهنمایی آینده‌نگر «تمام شده»، اقتصاد «در برابر افزایش
    قیمت انرژی تاب‌آور» است؛ هاماک: ریسک‌ها «به سمت بالا متمایل‌اند»، خطر «ذهنیت تورمی»
    ناشی از شوک‌های مکرر؛ پاولسون (دارای حق رأی): «ممکن است مقداری انقباض بیشتر و
    ملایم موجه باشد». درخواست‌های بیمه بیکاری 197K، فروش خانه‌های نوساز 684K. 2ساله
    در 4.895 (CNBC) / 4.916 (جمع‌بندی) بسته شد، 10ساله 5.163 (سقف از 2007)، 30ساله
    5.460 (سقف از 2004). ادعای 6e168240 موفق (هر دو بخش). فعال: 1e91793f (>=55%) و
    4872cd75 (>=45%) جمعه در مسیر موفقیت بسته می‌شوند؛ fc5c5a29 جمعه بسته می‌شود؛
    ادعای جدید 86f87a36 (نبود نرخ پایانی 2ساله <4.80 جمعه-سه‌شنبه، 0.55). سخنرانان
    جمعه: ویلیامز 09:15Z (دوباره)، اشمید 13:20Z، هاماک 18:00Z - بدون عضو هیئت‌مدیره؛
    برنامه فدرال رزرو برای 28-29 سپتامبر هنوز در خوراک داده نیست. بازگشت تغییر بدون
    تغییر: گزارش <55% یا درخواست مکث از عضو هیئت‌مدیره -> سناریوی نزولی ناشی از نرخ‌ها
    50. NFP در 2 اکتبر: بیدارباش #61. گزارش 26 سپتامبر: وزن‌ها در 15/60/25 حفظ شد
    (روز سوم). جمعه: 2ساله در 4.86 بسته شد (-3.5bp؛ بازگشایی 4.912، کف 4.845) در واکنش
    به برنامه هفت‌روزه عراقچی و برنت -2.1% - بخش کوتاه‌مدت منحنی برای نخستین بار در
    این رژیم همراه نفت پایین رفت (~1.7bp به‌ازای هر درصد برنت)، بدون گزارش احتمال
    و بدون سخنران در جلسه؛ جمع‌بندی: «دلار با کاهش نگرانی‌های تورمی اندکی ضعیف‌تر
    بود». 10ساله 5.165 بدون تغییر (طی روز 5.23، سقف از 2007)، 30ساله 5.49 (سقف از
    2004). ویلیامز (جمعه): شوک‌های مداوم عرضه مبارزه را دشوارتر می‌کنند؛ بازار کار
    منشأ تورم نیست؛ تعرفه‌ها به‌تنهایی تورم پایدار ایجاد نمی‌کنند. هیچ گزارش احتمال
    جمعه در هیچ‌جا نبود (جست‌وجو شد) - آخرین رقم 77.5% (پنج‌شنبه). ارزیابی‌شده: fc5c5a29
    موفق (نبود نرخ پایانی 2ساله <4.60)، 4872cd75 موفق (>=45%)، 1e91793f موفق (>=55%).
    فعال: 86f87a36 (نبود نرخ پایانی 2ساله <4.80 جمعه-سه‌شنبه؛ جمعه 4.86 شرط را برآورده
    می‌کند)؛ ادعای جدید b934960e (نبود گزارش روز PCE زیر <55% چهارشنبه 30 سپتامبر،
    0.55) که در بررسی عمیق #62 در زمان انتشار+45 ارزیابی می‌شود. هفته آینده از طریق
    خلاصه تقویم actionforex + پیش‌نگاه هفتگی ولز فارگو تأیید شد (BLS/BEA خطای 403):
    PCE چهارشنبه 30 سپتامبر 12:30Z (اجماع 0.4/3.7 کل، 0.3/3.4 هسته؛ بازنگری‌های سالانه
    «روند ملایم‌تر، اوت داغ‌تر»)، ISM پنج‌شنبه 1 اکتبر 14:00Z (55.0؛ قیمت‌های پرداختی
    72)، NFP جمعه 2 اکتبر 12:30Z (اجماع 100K در برابر 162K، UR برابر 4.1، AHE برابر
    0.3؛ تاریخ بیدارباش #61 پابرجاست)، RBA سه‌شنبه 04:30Z (4.60)، شاخص قیمت مصرف‌کننده
    (CPI) منطقه یورو جمعه (3.7%). سخنرانان فدرال رزرو دوشنبه-جمعه: هیچ‌کس در هیچ خوراکی
    دیده نمی‌شود (todo-001/188؛ فهرست هیئت‌مدیره = عناوین گذشته). شروط تغییر: گزارش
    <55% یا درخواست مکث از عضو هیئت‌مدیره -> سناریوی نزولی ناشی از نرخ‌ها 50؛ گزارش
    PCE برابر >=80% همراه نرخ پایانی 2ساله >=4.95 -> 65؛ توافقی با تأیید هر دو طرف
    همراه 2ساله <4.75 -> 50 (طلا از مسیر بخش کوتاه‌مدت منحنی بالا می‌رود). گزارش 27
    سپتامبر: وزن‌ها در 15/60/25 حفظ شد (روز چهارم). اصلاح: گزارش جمعه وجود داشت -
    توضیح شنبه CNBC (13:30Z): CME FedWatch برای اکتبر 64%، در برابر 77.5% پنج‌شنبه
    - کاهش 13.5 واحد درصدی در واکنش به برنامه عراقچی و برنت -2.1%، بدون داده، بدون
    سخنران. انتظارات تورمی یک‌سال‌آینده سپتامبر UMich برابر 4.6% (از 4.0%، بالاترین
    از ژوئن). گزارش هفتگی actionforex: «قیمت‌گذاری فدرال رزرو تا جمعه از اوج افراطی
    میان‌هفته عقب نشست»؛ 2ساله بیش از حد کشیده شده (RSI روزانه >72؛ سقف 4.912، هدف
    برآوردی 5.055) و 10ساله (سقف 5.23، هدف برآوردی 5.413) اکنون تکلیف دلار را تعیین
    می‌کند؛ مقاومت DXY برابر 101.80-102.86، محدوده عقب‌نشینی 99.7-99.9 اگر 10ساله
    متوقف شود. رد علنی برنامه هفت‌روزه توسط ترامپ (شنبه، پس از تسویه جمعه) زنجیره
    نفت -> 2ساله را در آستانه مهلت رضایی دوباره به بالا هدایت می‌کند. ادعای جدید efd9700b
    (نبود گزارش <55% دوشنبه 28 - سه‌شنبه 29، 0.55؛ سقف قاعده-19 چون برنامه سخنرانان
    نامعلوم است) جانشین 1e91793f می‌شود؛ b934960e روز PCE را پوشش می‌دهد. سخنرانان
    فدرال رزرو دوشنبه-جمعه: همچنان هیچ‌کس دیده نمی‌شود (از صفحه تقویم هیئت‌مدیره فقط
    سربرگ استخراج می‌شود). شروط تغییر بدون تغییر: گزارش <55% یا درخواست مکث از عضو
    هیئت‌مدیره -> سناریوی نزولی ناشی از نرخ‌ها 50؛ گزارش PCE برابر >=80% همراه نرخ
    پایانی 2ساله >=4.95 -> 65. گزارش 28 سپتامبر: بازگشایی زنجیره را به حرکت درآورد
    - 2ساله 4.90 (+3.7bp)، 10ساله 5.20، 30ساله 5.51 (سقف 5.525)، طلا -2.1%؛ اکتبر
    64% پابرجاست (گزارشی در تغییرات جدید نیست، efd9700b به‌اندازه 9 واحد درصد حاشیه
    دارد). سخنرانان اکنون از طریق جدول رویدادها دیده می‌شوند (با برچسب کم): بومن دوشنبه
    12:15Z (محل تأییدنشده - نشانگر بررسی، قاعده 24؛ فهرست هیئت‌مدیره سخنرانی‌های نظارتی
    لندن او را فهرست کرده)، کوک 17:25Z، بارکین 17:30Z؛ سه‌شنبه بومن/بار/گولزبی/ موسالم/ویلیامز/والر
    15:00-19:00Z؛ پنج‌شنبه والر 14:00Z هم‌زمان با ISM. بسنت یکشنبه: فدرال رزرو باید
    «ذهنی باز» داشته باشد (بهره‌وری هوش مصنوعی) - عامل نقض ناشی از مکث تحمیلی برای
    288a87ac (نبود دو جلسه متوالی با رشد هر دو، سه‌شنبه 29 سپتامبر - دوشنبه 5 اکتبر،
    0.65). ادعای d8e247ef موفق (خانواده 3/3). گزارش 29 سپتامبر: گزارش ~70% برای اکتبر
    و ~60% برای اکتبر+دسامبر (investinglive دوشنبه 22:59Z)؛ کوک (اوکلند، دوشنبه) اندکی
    انقباضی - هوش مصنوعی + نفت «در ماه‌های آینده» همچنان تورم را بالا می‌برند، افزایش‌های
    بیشتر وابسته به داده، بازار کار برای «کنار آمدن با» نرخ‌های بالاتر «در موقعیت
    خوبی» است؛ بومن چیزی درباره سیاست نگفت. نرخ پایانی 2ساله 4.924 (+6.4bp)، 10ساله
    5.242، 30ساله 5.562: بخش بلندمدت منحنی با عرضه/بازده‌های واقعی هدایت را به دست
    گرفت (ضعیف‌ترین حراج 7ساله در یک سال)، بنابراین نرخ پایانی 10ساله >5.25 با 2ساله
    بدون تغییر، نشانه جدیدِ مختص بخش بلندمدت است. سه‌شنبه: شش سخنران - بومن 15:00Z
    (عناوین نظارتی منشن هاوس)، بار 16:40Z، گولزبی 17:00Z، موسالم 17:30Z، ویلیامز 18:00Z،
    والر 19:00Z (فهرست هیئت‌مدیره: «چشم‌انداز اقتصادی و... ارتباطات سیاستی من»، بدون
    تاریخ - بررسی عمیق مشروط #63 در 19:45Z). ادعاهای فعال: efd9700b (نبود گزارش <55%
    تا سه‌شنبه)، 86f87a36 (نبود نرخ پایانی 2ساله <4.80 تا سه‌شنبه)، b934960e (جلسه
    PCE)، 288a87ac (نبود جفت جلسات با رشد هر دو تا 5 اکتبر). ایستگاه‌های بعدی: PCE
    چهارشنبه 12:30Z (#62)، ISM+والر پنج‌شنبه 14:00Z، NFP جمعه 12:30Z (#61). 29 سپتامبر
    #64 (19:45Z): ویلیامز (عضو دائمی دارای حق رأی) 18:00Z - پس از سپتامبر «نیازی به
    عجله نیست»، اگر اقتصاد مطابق انتظارات باشد «احتمالاً یک افزایش دیگر امسال»، تورم
    3.5% امسال / 2% در 2028؛ گزارش investinglive: اکتبر 54% از 64%، 2ساله -2.5bp به
    4.90. ادعای efd9700b با آن گزارش ناموفق شد؛ بررسی 19:00Z وزن‌ها را از 15/60/25
    -> 25/50/25 برد (شرط تابلوی بازار در حال تحقق، +25 واحد در 19:35Z؛ #65 در 23:30Z
    آن را بر مبنای ردیف نهایی می‌کند). والر 19:00Z: متن هیئت‌مدیره تازه خطای 404 می‌دهد،
    بدون گزارش تا 19:50Z - نوبت غیرسیاستی (قاعده 24)؛ مصاحبه چشم‌انداز Reuters NEXT
    به‌عنوان پنج‌شنبه 14:00Z خوانده می‌شود (برچسب متوسط) - #66 در 14:45Z کنار ISM
    (محرک احتمال متعلق به ISM است). 15:45 EDT: 2ساله 4.891، 10ساله 5.255، 30ساله 5.591
