  why_fa: 'جنگ در قالب افزایش نرخ بهره فدرال رزرو و اخطار تأمین وجه تضمین به طلا می‌رسد،
    نه در قالب تقاضا برای دارایی امن. شواهد چهارده جلسه از 2 تا 21 سپتامبر، شدیدترین
    مورد در 21 سپتامبر (اصابت به دو نفتکش، نفت -3.7%، طلا -1.0%، BTC +7.1%). موارد
    مخالف: یک مورد (9 سپتامبر). 22 سپتامبر - بخش تنش‌زدایی: یک دور مذاکره آمریکا و
    ایران که هر دو طرف تأیید کردند، برنت در 99.25 تسویه شد (-1.1%، پنج جلسه نزولی)،
    طلای نقدی +0.5% / ردیف بدون تغییر، منحنی بازده 1.5-2.3bp بالا، دلار اواخر جلسه
    تضعیف شد و سپس طی شب تقویت شد و طلا رشدش را پس داد. بند رفتار بازار درباره محرک
    (قاعده 23): حدود ~18:30Z ثبت شد، GC در بسته‌شدن Globex از 4390 -> 4396 رفت - هدف
    در هر دو جهت محقق نشد، وزن‌ها حفظ شدند. دریچه: صعود نفت باعث فروش طلا می‌شود (از
    مسیر بازده 2ساله)؛ نزول نفت بر اثر دیپلماسی، طلا را بدون تغییر تا نزولی باقی می‌گذارد
    (صرف خود طلا تخلیه می‌شود، بازده 2ساله همراهی نمی‌کند) - تنها مسیر صعود طلا، نزول
    بازده 2ساله است که به یک عضو هیئت حکام یا تغییری تعیین‌کننده در داده‌های آمریکا
    نیاز دارد، نه یک تیتر خبری. ادعاها: 64c7ba41 نامشخص در 23 سپتامبر (دوشنبه/سه‌شنبه
    تسویه صعودی نفت نداشتیم)؛ جانشین آن 8e425cab (0.5) در نخستین تسویه صعودی برنت
    از چهارشنبه تا جمعه فعال می‌شود (ردیف <+1% = محقق؛ نبود مورد = نامشخص)؛ f7a0c23d
    (0.55): از چهارشنبه تا جمعه هیچ تسویه برنت >=103 نباشد - ادعای تخلیه صرف. تأییدکننده‌ها:
    تسویه صعودی نفت همراه با طلای بدون تغییر/نزولی؛ حمله آمریکا به ایران که در قیمت‌گذاری
    به نزول طلا بینجامد؛ متنی با تأیید دو طرف که نفت را -5% و طلا را نزولی قیمت‌گذاری
    کند. ابطال‌کننده‌ها: عدم تحقق 8e425cab -> عامل نظامی 35؛ دو ردیف متوالی با طلای
    صعودی / بازده 2ساله صعودی؛ طلا +1% در جلسه نزولی نفت با بازده 2ساله بدون تغییر؛
    رویدادی در عرضه که به‌صورت رکود تورمی معامله شود (بخش بلندمدت منحنی صعودی، دلار
    نزولی، طلا صعودی)؛ متنی که برنت را -5% قیمت‌گذاری کند، با طلای صعودی و بازده 2ساله
    بدون تغییر -> عامل نظامی 25. 24 سپتامبر: 8e425cab محقق شد - نخستین تسویه صعودی
    نفت (103.08، +3.9%) ردیف طلا را -1.74% ثبت کرد؛ چهارده جلسه صعودی نفت از 2 سپتامبر
    که طلا در پایان آن‌ها بدون تغییر/نزولی بود، یک مورد مخالف. تخفیف قاعده 9: بازقیمت‌گذاری
    ناشی از PMI/بار نیز در همان روز رخ داد. f7a0c23d محقق نشد (سقف تخلیه صرف در یک
    جلسه شکست؛ درس: سطوح نفت باید آزمون فاصله قاعده 20 را بگذرانند). بخش تخلیه طی
    شب: برنت با گزارش نقشه راه -1%، طلا بدون تغییر در 4324، بازده 2ساله بدون تغییر
    - دیپلماسی تقاضا ایجاد نمی‌کند. عامل نظامی 25. ابطال‌کننده‌ها بدون تغییر: ثبت
    الگوی رکود تورمی (بازده 30ساله >=5.45، DXY نزولی، طلا صعودی)؛ دو ردیف با صعود
    هر دو؛ طلا +1% در نزول نفت با بازده 2ساله بدون تغییر. 25 سپتامبر: پانزدهمین جلسه
    صعودی نفت که طلا در پایان آن بدون تغییر/نزولی بود (برنت در پی موشک‌ها در ینبع
    +3.4% تا 106.60؛ ردیف -0.37%). شکاف: در 16:18Z گزارش توافق مرحله‌ای برنت را -3
    و GC را +20 برد (4292.7 -> 4312.1)، با بازده 2ساله بدون تغییر - نخستین تقاضا در
    زمان نزول نفت در این رژیم - تا 18:00Z محو شد؛ سپس طی شب، برنت -1% طلا را +24 تا
    4328.5 بالا برد. کوچک است، اما زنجیره اکنون در طول روز هر دو جهت را نشان می‌دهد.
    ادعای جدید a270f3f1 (0.55): نخستین تسویه -3% برنت از جمعه تا سه‌شنبه، ردیف +1%
    برای GC ثبت نمی‌کند؛ عدم تحقق با بازده 2ساله بدون تغییر -> عامل نظامی 20، پایه
    25 (بخش تخلیه برای طلا تقاضا ایجاد می‌کند = رژیم در حال سست‌شدن است). سایر ابطال‌کننده‌ها
    بدون تغییر. 26 سپتامبر - دریچه در بخش کوتاه‌مدت منحنی دوطرفه است: جمعه برنت بر
    مبنای طرح هفت‌روزه در 104.32 تسویه شد (-2.1%)، بازده 2ساله در پایان -3.5bp در
    4.86، DXY -0.22%، ردیف GC +0.27% (4321.2)، نقدی +$8 - نخستین جلسه این رژیم که
    نزول نفت بخش کوتاه‌مدت منحنی را پایین کشید و برای طلا تقاضا ایجاد کرد، بدون واسطه
    و بدون هیچ سخنرانی. همان زنجیره (قاعده 22)، با علامت معکوس؛ تقاضا برای دارایی
    امن نیست (طلا بالا رفت چون بازده 2ساله پایین آمد). شمارش: 15 مورد از 16 جلسه صعودی
    نفت با طلای بدون تغییر/نزولی بسته شدند؛ جلسات نزولی نفت اکنون 3 مورد بدون تغییر
    تا نزولی (21، 22، 24 سپتامبر) در برابر 1 مورد صعودی (25 سپتامبر، از مسیر بازده
    2ساله) دارند. بازنگری: شاخه توافق اکنون طلای اندکی صعودی است (+0.5-1% با برنت
    -5-8%)، با سقفی که تخلیه صرف ایجاد می‌کند - «بدون تغییر تا نزولی» پنجشنبه کنار
    گذاشته شد (درس ثبت شد). a270f3f1 (0.55) آزمون است: نخستین تسویه -3% برنت تا سه‌شنبه
    نباید ردیف +1% ثبت کند (جمعه -2.1%، +0.27% ثبت کرد؛ با مقیاس‌بندی، -3% ~ +0.4%).
    ادعای جدید 95c71900 (هیچ ردیف >=4402.2 در دوشنبه تا سه‌شنبه، 0.5) سقف هر دو شاخه
    است. عامل نظامی 25. ابطال‌کننده‌ها بدون تغییر: عدم تحقق a270f3f1 با بازده 2ساله
    بدون تغییر -> 20 / پایه 25؛ دو ردیف با صعود هر دو؛ ثبت الگوی رکود تورمی. 27 سپتامبر:
    رد طرح پس از تسویه رخ داد. بخش تخلیه جمعه (برنت -2.1%، بازده 2ساله -3.5bp، DXY
    -0.22%، ردیف GC +0.27%) طرحی را معامله کرد که ترامپ شنبه به‌صورت علنی رد کرد (~18:00Z)؛
    بازگشایی یکشنبه 22:00Z ورودی را بازقیمت‌گذاری می‌کند - انتظار برنت 106-108، بازده
    2ساله دوباره به‌سوی 4.90، طلا از مسیر بخش کوتاه‌مدت منحنی $12 جمعه را پس می‌دهد
    (تقاضا برای دارایی امن نیست). ادعای جدید 9e1829f8 (0.6): نخستین تسویه برنت >=+2%
    در دوشنبه تا سه‌شنبه، ردیف GC را >=0.1% پایین‌تر از ردیف قبلی ثبت می‌کند (اگر
    موردی ثبت نشود، نامشخص) - آزمون علامت معکوس سابقه 15/16 صعود نفت؛ عدم تحقق با
    بازده 30ساله >=5.50 و DXY نزولی، برداشت رکود تورمی است (پایه 25)، عدم تحقق با
    بازده 2ساله صعودی و طلای صعودی، یک ردیف با صعود هر دو است (پایه). a270f3f1 (0.55)
    به‌سمت مسیر نامشخص می‌رود (تسویه -3% تا سه‌شنبه به پیشنهاد متقابل رسمی آمریکا
    نیاز دارد). عامل نظامی 25: طبق اظهارات علنی، شاخه توافق از روی میز کنار رفته است،
    شاخه شکست مذاکرات (برنت >=110 -> طلای نزولی از مسیر بازده 2ساله) شاخه فعال است.
    ابطال‌کننده‌ها بدون تغییر: عدم تحقق a270f3f1 با بازده 2ساله بدون تغییر -> 20 /
    پایه 25؛ دو ردیف با صعود هر دو؛ ثبت الگوی رکود تورمی. گزارش کوتاه 28 سپتامبر:
    رابطه معکوس در ششمین آخر هفته نظامی حفظ شد - برنت +1.7% (بیشینه +2.6%)، بازده
    2ساله +3.7bp، طلا -2.1% تا 4230.6 و عبور نزولی از محدوده حمایتی 4244-4253؛ عبور
    بازده 30ساله از 5.50 با طلای نزولی، نشانه مخالف است (18 مخالف / 2 موافق). واگرایی
    اندازه حرکت علامت‌گذاری شد: حرکت طلا ~3x چیزی است که ورودی‌های نفت/بازده 2ساله
    در 23 سپتامبر ایجاد کردند - شکست محدوده حمایتی، پایان فصل، تقاضای چین نامشهود؛
    در هیچ‌یک از دو جهت تقاضا برای دارایی امن نیست. 9e1829f8 امشب فعال است (تسویه
    برنت >=106.41 -> ردیف >=0.1% نزولی؛ ردیف همین حالا 70 واحد پایین‌تر از 4299.7
    یکشنبه است). علامت شاخه توافق بدون تغییر: تأیید دریافت متن قطری = تخلیه = 4253/4300،
    یک شکست نزولی ناموفق، نه یک رالی. گزارش کوتاه 30 سپتامبر: سه‌شنبه بخش تخلیه بود،
    با بازده 2ساله که به‌سختی حرکت کرد (-3.3bp) و طلا +1.41% در ردیف - دومین تقاضای
    کامل در بخش تخلیه (25 سپتامبر محو شد، 29 سپتامبر حفظ شد)، در برابر DXY +0.19%
    و بازده 10ساله/30ساله صعودی. a270f3f1 طبق متن نامشخص (تسویه -2.55%، آستانه -3%)،
    از نظر ماهوی مخالف؛ 9e1829f8 نامشخص (هیچ تسویه +2% نبود). رابطه معکوس در بخش صعود
    نفت همچنان برقرار است (دوشنبه +0.9%، طلا -3.3%، بخش بلندمدت منحنی/تسویه اجباری
    موقعیت‌ها)؛ بخش نزول نفت اکنون برای طلا تقاضا ایجاد می‌کند. برداشت کاری: نامتقارن،
    نه معکوس - نفت بالا = طلا پایین از مسیر بازده 2ساله، نفت پایین = طلا بالا از مسیر
    موقعیت‌گیری. دو جلسه؛ فرضیه‌ای با آزمونی مشخص (تسویه بعدی برنت دسامبر با افت >=2%:
    آیا ردیف >=0.5% بالا می‌رود، در حالی که بازده 2ساله <5bp پایین آمده است؟)، نه
    یک قاعده. گزارش کوتاه 2 اکتبر: نخستین جلسه نفت صعودی / طلای صعودی در این رژیم
    - پنجشنبه برنت +~4% (102.31)، DXY 101.996 (بالاترین سطح 52 هفته)، طلا +0.69% در
    ردیف همراه با بازده 2ساله -10bp: بخش نفت -> بازده 2ساله تحت‌الشعاع کانال رهبری
    فدرال رزرو قرار گرفت (صبر جفرسون/ویلیامز، انتقال زمان‌بندی گلدمن به دسامبر). تقاضا
    برای دارایی امن نیست - طلا همراه اوراق خزانه بالا رفت. یک جلسه = فرضیه (قاعده
    11)؛ مضمون «حمله = افزایش نرخ بهره + اخطار تأمین وجه تضمین» برای یک اقدام پابرجاست؛
    تقویت آرایش نیروها (ناو هواپیمابر 3ام) که در برنت قیمت‌گذاری شد، به بازده 2ساله
    نرسید. BofA همان روز: «نفت بزرگ‌ترین دشمن طلاست»، ریسک <4000 - زنجیره به‌عنوان
    دیدگاه مؤسسه. گزارش کوتاه 3 اکتبر: جمعه زنجیره را در هر دو جهت در یک جلسه اجرا
    کرد - بازده 2ساله هنگام انتشار داده -9bp، طلا +50؛ بازده 2ساله از کف +15bp تا
    بسته‌شدن در +4bp، هم‌زمان با بازیابی برنت 98.4 -> 102.25، طلا -97 از سقف، با DXY
    نزولی در تمام روز. هفت اصابت به بدنه کشتی‌ها در هرمز طی یک هفته + یک ناو هواپیمابر
    سوم + گزارش رویترز درباره عملیات تهاجمی عربستان: برنت بدون تغییر تسویه شد، چیزی
    به بازده 2ساله نرسید، چیزی به طلا نرسید. سومین جلسه طلا = f(بسته‌شدن بازده 2ساله)
    با DXY در بالاترین سطح 52 هفته (30 سپتامبر / 1 اکتبر / 2 اکتبر): سه مورد قاعده
    11 تکمیل شد، آزمون علامت اکنون یک برداشت است؛ به‌صورت ادعای 0.6 برای دوشنبه تا
    جمعه 5-9 اکتبر ثبت شد. گزارش کوتاه 5 اکتبر: بازگشایی یکشنبه چهارمین الگوی سازگار
    با زنجیره است: بازده 2ساله -1.5bp، طلا +0.2% (4169، بیشینه 4191)، برنت -0.8% در
    پی هشتمین بدنه کشتی + ادعاهای حوثی‌ها؛ DXY +0.44% تا بالاترین سطح 52 هفته (102.53)
    به‌دلیل یورو (OAT-Bund >140bp) و طلای صعودی - بخش دلار این هفته منشأ خارج از آمریکا
    دارد و در مرتبه دوم است (واگرایی جدید در موضع). جلسه اول 306d7862 / 968df4d5 =
    ردیف دوشنبه در برابر بسته‌شدن بازده 2ساله دوشنبه. 7 اکتبر: زنجیره در تمام جلسات
    بررسی‌شده حفظ شد. دوشنبه: بازده 2ساله -1.1bp، ردیف 4166.9 (+4.6 = بدون تغییر)
    - برای هیچ‌یک از دو ادعا شمرده نمی‌شود؛ بازده 10ساله در 5.311 بسته شد (>5.30)
    با طلای بدون تغییر، پس آستانه پایه 45 فعال نشد. سه‌شنبه: بازده 2ساله نزولی (4.7975
    در جمع‌بندی / 4.791 در CNBC)، ردیف 4185.0 (+18.1) - علامت مخالف؛ رکوردهای S&P،
    بازده 30ساله بدون تغییر. آسیای چهارشنبه: برنت +0.9% -> بازده 2ساله +2.5bp -> DXY
    +0.2 -> طلا -0.5% (4165.7) - مطابق الگوی درسی. شمارش 306d7862 پس از دو جلسه: مخالف
    1 / هم‌جهت 0 / بدون تغییر 1؛ 968df4d5: تشکیل جفت با صعود هر دو از دوشنبه ممکن
    نیست. واگرایی ادامه‌یافته DXY سه‌شنبه رفع شد (یورو با اقدامات فرانسه در مورد کسری
    بودجه بازیابی شد، DXY در 101.83 بسته شد، طلا بالا رفت) - برداشت دلار با منشأ خارج
    از آمریکا به‌عنوان یک نشانه پابرجاست. نشانه جدید: بازده 30ساله 5.685 در آسیا با
    DXY صعودی و طلای نزولی، الگوی رکود تورمی نیست؛ حراج 10ساله در 17:01Z و صورت‌جلسه
    در 18:00Z آزمون هستند. 8 اکتبر: چهارشنبه زنجیره را طی روز ثبت کرد و هنگام بسته‌شدن
    شکست. سقوط اوراق اروپا (بازده 10ساله 5.34 / بازده 30ساله 5.73 در 12:50Z، DXY 102.4)
    طلا را به 4094.7 برد (کف دوماهه، پایین‌ترین سطح از 5 اوت)؛ بازده‌ها با گزارش انتشار
    اوراق کوتاه‌مدت فرانسه و تسویه حراج 10ساله 1.7bp پایین‌تر از بازده پیش از حراج،
    تغییر جهت دادند؛ طلا تا 4141.3 بازیابی شد - اما بازده 2ساله در پایان 2.7bp نزولی
    بسته شد (4.764)، همراه با ردیف نزولی 43.7 = نخستین جلسه هم‌علامت از 30 سپتامبر.
    عامل فروش مشخص: دلار (DXY +0.41 تا 102.24، بالاترین سطح 18ماهه طبق رویترز، «خرید
    بی‌وقفه» - جمع‌بندی) و بخش بلندمدت منحنی (بازده 30ساله +2bp در پایان)، بازده 2ساله
    صرفاً همراه بود. حمله قطر (19:00Z) و تلفات ریاض، برنت را در 19:01Z به‌اندازه -0.14
    جابه‌جا کردند - بخش نفت صفر، بخش طلا صفر (قاعده 22، عامل نظامی در مرتبه دوم).
    آسیای پنجشنبه: برنت +2.1% (ایسایاس + قطر) -> بازده 2ساله +1.7bp -> طلا 15 صعود
    تا 4156 (مخالف زنجیره: تقاضای بازگشایی SGE یا پوشش موقعیت‌های فروش از کف؛ DXY
    بدون تغییر). آزمون علامت 306d7862 پس از سه جلسه: مخالف 1 (سه‌شنبه) / هم‌جهت 1
    (چهارشنبه) / بدون تغییر 1 (دوشنبه) - دومین جلسه هم‌علامت به‌معنای عدم تحقق و پایه
    40 -> 35 است. 9 اکتبر (جلسه چهارم): تسویه برنت +4% / بازده 2ساله -0.8bp (بدون
    تغییر) / DXY -0.10 / ردیف +27.7 (4169.0). بخش نفت به بازده 2ساله نرسید: ایسایاس
    یک شوک عرضه آمریکاست و تعهد ترامپ در همان جلسه صرف خلیج فارس را تخلیه کرد؛ طلا
    از بخش بلندمدت منحنی (بازده 10ساله -4.4، بازده 30ساله -5.4 پس از تسویه حراج 30ساله
    0.1bp بالاتر از بازده پیش از حراج) و دلار پیروی کرد. آسیای جمعه: برنت -1%، طلا
    +43 تا 4200 با بازده 2ساله +0.1 / بازده 10ساله -0.2 / DXY -0.10 - حرکت $43 بدون
    ورودی نرخ‌ها = موقعیت‌گیری (موقعیت‌های فروش CTA، سرمایه تحت مدیریت -84t) یا تقاضای
    شانگهای (صرف خوانده نشده). آزمون علامت 306d7862 پس از چهار جلسه: مخالف 1 (سه‌شنبه)
    / هم‌جهت 1 (چهارشنبه) / بدون تغییر 2 (دوشنبه، پنجشنبه) - جمعه تعیین می‌کند (مخالف
    = تحقق؛ هم‌جهت یا بدون تغییر = عدم تحقق و پایه 35، «طلا = f(بازده 2ساله)» به فرضیه
    تنزل می‌یابد و بخش بلندمدت منحنی + دلار نامزدها هستند). شرط لفظی علامت صرف یک‌بار
    برآورده شد (ردیف صعودی >=5، بازده 2ساله نزولی نیست)، ماهیت مخالف است (آرامش در
    بخش بلندمدت منحنی) - 45 به دومین جلسه از این نوع نیاز دارد. ادعاهای سطحی از سر
    گرفته شدند (سقف 4375 تا ردیف سه‌شنبه، 0.6). 12 اکتبر: ردیف بازگشایی یکشنبه 4231.6
    (+15.3، +0.36%) درون دامنه (3db62da8 محقق شد، خانواده 6/7)، با برنت -1.8% / DXY
    -0.05 / بدون بازده 2ساله آمریکا (تعطیلی)، پس از پرتحرک‌ترین آخر هفته نظامی از
    بهار: علامت با زنجیره سازگار است (نفت پایین -> طلا بالا) اما شریک بازده 2ساله
    ندارد و درون نویز قرار دارد (0.18 ATR) - طبق قاعده 25 موقعیت‌گیری است. واگرایی
    جمعه (+47.3 با تمام ورودی‌ها در جهت مخالف) حل‌نشده است؛ بسته‌شدن بازده 2ساله سه‌شنبه
    در برابر 4.791 نخستین آزمون است. MACD -58.23 در برابر خط سیگنال -58.17 - تقاطع
    صعودی یک جلسه صعودی فاصله دارد؛ ردیف روی 20DMA (~4232) قرار دارد؛ بیشینه Globex
    در 4242.3 بالاتر از آن است، ردیف نیست. 13 اکتبر (گزارش کوتاه سه‌شنبه): دوشنبه
    زنجیره را در بخش دلار و بدون بازده 2ساله اجرا کرد - تسویه برنت 106.65 (صعودی)،
    DXY +0.43 تا بالاترین سطح 52 هفته 102.589 (EURUSD در کف 2026 برابر 1.1155، USDJPY
    بالاتر از 200DMA خود در 158.54)، XAU -0.59%، ردیف دوشنبه 4186.4 = -29.9 نسبت به
    ردیف جمعه (نیمی از +47.3 جمعه برگشت). آسیای سه‌شنبه آن را در جهت دیگر اجرا کرد:
    Kospi -6% (فروش گسترده سهام تراشه + ترس‌های نفتی)، بازده 2ساله -1.9 / بازده 10ساله
    -4.6 / بازده 30ساله -4.0، DXY -0.17، برنت -1.25%، GC +0.26% - آرامش ناشی از نرخ‌ها،
    نه دارایی امن. ادعای آزمون قاعده 11 برای جلسه سه‌شنبه نوشته شد (علامت‌های مخالف،
    آستانه‌های بازده 2ساله >=2bp / ردیف >=5، 0.55)؛ 1e9e6e4a (بازده 2ساله > 4.791)
    در 4.772 در جهت مخالف پیش می‌رود. روز شش بدنه کشتی (11 اکتبر) از مسیر نفت/دلار
    به‌صورت ردیف -0.7% به طلا رسید - قاعده 22 برقرار است: 0/n تقاضا برای دارایی امن.
    سه‌شنبه 13 اکتبر (برداشت گزارش کوتاه چهارشنبه): دو بدنه کشتی دیگر طبق UKMTO در
    تنگه (کشتی کانتینری + نفتکش، پرتابه‌های ناشناخته، شرق 54E)؛ ارتش آمریکا: دوشنبه
    19 mb با اسکورت عبور کرد. مقام وزارت انرژی عربستان تأیید می‌کند که سه‌شنبه عصر
    یک ساختمان اداری آرامکو در ظهران هدف قرار گرفت (آتش‌سوزی محدود، بدون تلفات) -
    نخستین اصابت حوثی‌ها به اموال آرامکو با تأیید میزبان؛ هنوز به رده عرضه (میدان/پالایشگاه/پایانه/خط
    شرق-غرب) نرسیده و محرک عامل نظامی 35 در موضع اکنون آن را مشخص می‌کند. پاسخ طلا:
    ردیف -6.7 با برنت ~بدون تغییر - 0/n تقاضا برای دارایی امن در قاعده 22 پابرجاست.
    آزمون زنجیره سه‌شنبه 97715583 بنا بر ساختار نامشخص (بازده 2ساله +0.2-0.6bp). پنجشنبه
    15 اکتبر (گزارش کوتاه): جلسه آسیا نخستین جلسه با الگوی دارایی امن در این رژیم
    است - بازده 2ساله 8.5bp نزولی، طلا 1.5% صعودی نسبت به تسویه، برنت 1% نزولی، ین
    0.4% صعودی، DXY -0.6% - بر مبنای گزارش‌های تأییدنشده تخلیه پایگاه سپاه پاسداران
    (investinglive در 00:40Z؛ تا جمع‌بندی آسیای 03:22Z هیچ بیانیه‌ای از تهران یا واشنگتن
    نبود؛ 23a83bcb فعال است)، در کنار رالی اوراق خزانه با محرک‌های خاص خود (دیلی،
    فروش گسترده اعتبار مرتبط با هوش مصنوعی: Nikkei -3.5%، Kospi ~-8%). قاعده 11: 1/3،
    یک فرضیه - و محرک نرخ‌ها همراه طلا حرکت کرد، پس این جلسه «تقاضا برای دارایی امن»
    را از «زنجیره» تفکیک نمی‌کند. همچنین: CENTCOM یک لنج مرتبط با ایران را که به هدف‌گرفتن
    کشتی‌های نیروی دریایی متهم بود نابود کرد (gcaptain/MarEx - رده دفاعی در دریا،
    نه ابطال‌کننده 91d78370)؛ یک مقام ایرانی می‌گوید «تاکتیک‌های جدید» علیه کشتیرانی
    حدود ~10 روز پیش آغاز شد «تا قیمت نفت بالا بماند»؛ نیروی دریایی سپاه پاسداران
    ادعا می‌کند یک کشتی کانتینری پس از برخورد با مین در جنوب هرمز غرق شد (ادعای طرف
    متخاصم، تأییدنشده - قاعده 12؛ بررسی با تأخیر زمانی در گزارش کوتاه شنبه مسئول رسیدگی
    به آن است)؛ قالیباف (مهر): آمریکا پیش از پذیرش ایران «باید مجازات شود» - کانال
    منجمد است (bffc2a77 در مسیر تحقق). طلا هیچ‌یک را نادیده نگرفت: علامت زنجیره و
    علامت دارایی امن هم‌زمان شدند. 20 اکتبر: الگوی دوشنبه = زنجیره طبق متن (بازده
    2ساله +4.6، تسویه -21، ردیف -38)، با نفت خالص نزولی در تسویه (109.55 در برابر
    109.86) پس از برگشت درون‌روزی +3.9 بر مبنای دو ادعای تأییدنشده - محرک بازده 2ساله،
    دیرش جهانی + ریسک‌پذیری بود، نه نفت. در روز دو ادعا، تقاضایی برای دارایی امن نبود:
    طلا جلسه را به‌صورت نفت -> بازده 2ساله -> طلا قیمت‌گذاری کرد (قاعده 22) و با علامت
    بازده 2ساله بسته شد (10/11 از جلسات >=2bp از 28 سپتامبر). درس ثبت شد: برچسب یک
    شاخه، فرضیه است؛ محرک را از تسویه خالص نفت و منحنی بخوانید. گزارش کوتاه چهارشنبه
    21 اکتبر: سه‌شنبه رابطه معکوس را به شکلی دیگر تأیید کرد - نفت در تسویه نزولی،
    DXY -0.28، بازده 30ساله -4.8 و طلا همچنان در تسویه -17.5 با بازده 2ساله +2.6:
    صرف فقط از مسیر بازده 2ساله به طلا می‌رسد، و بازده 2ساله علامتش را از بانک‌های
    مرکزی خارجی گرفت. ریسک دنباله‌ای اسرائیل اکنون یک واقعیت در آرایش نیروهاست (هگست-نتانیاهو
    در عوودا در دوشنبه، «کاری که باید تمام شود»، کاتس «همه تأسیسات انرژی») در برابر
    تعهدات انتخاباتی علنی هر دو رهبر (27 اکتبر / 3 نوامبر)؛ سابقه رده استخراج شد (حملات
    مشترک در فوریه، از آن زمان غیرفعال؛ آخرین حملات آمریکا 1 سپتامبر). ادعای منفی
    درباره اقدام اسرائیل پیش از انتخابات برای چهارشنبه 21 تا دوشنبه 26 با 0.65 ثبت
    شد (رده‌ای که به آن رسیده‌ایم اما غیرفعال است، بدون کف). نخستین برداشت از ثبت
    هر حمله همچنان علامت بازده 2ساله است، ابتدا برنت. گزارش کوتاه پنجشنبه 22 اکتبر:
    چهارشنبه زنجیره را پس از تسویه فعال کرد - طلا در 17:30Z با +7.4 تسویه شد (4150.0)،
    در حالی که اوراق در طول منحنی همچنان خریدار داشتند (بازده 10ساله 5.104 در 17:00Z)،
    سپس تیتر دستور خروج در ~18:00Z: بازده 10ساله تا 18:20Z به‌اندازه +4bp، بازده 2ساله
    4.768 -> 4.827 (15:00 ET)، GC -24 تا 4133 در 19:06Z، ردیف -12.7 (4128.5). قاعده
    17 طبق متن: صعود هر دو در تسویه (f(بازده 2ساله) 11/13)؛ از نظر سازوکار، زنجیره
    با زمان‌بندی پس از تسویه (درس ثبت شد). طی شب رابطه معکوس به شکل سومی ثبت شد: تشدید
    تنش (خروج‌ها، شیبه، دمام، طرح‌های NYT، سیریک) برای اوراق خزانه (بازده 2ساله -4.1
    تا 4.782، بازده 10ساله -6، بازده 30ساله -5.8) و ین (157.68) تقاضا ایجاد کرد، با
    برنت +1.6% و DXY -0.25 - تمام ورودی‌ها برای طلا مثبت - و طلا 27 افت کرد تا 4123
    (کف روز 4116.2، زیر حمایت مثلث 4129؛ GVZ 21.4؛ BTC -1.8%). تقاضا برای دارایی امن
    به اوراق و ین رفت، نه طلا: موقعیت‌گیری قاعده 3 / الگوی 12-16 اکتبر. نخستین برداشت
    از ثبت هر حمله همچنان علامت بازده 2ساله است، ابتدا برنت. گزارش کوتاه جمعه 23 اکتبر:
    چهارمین رابطه معکوس در هشت جلسه و نخستین مورد با حرکت 19bp نرخ‌ها در پشت آن -
    پنجشنبه: بازده 2ساله -18.8، بازده 10ساله -19.3، DXY -0.17، احتمال‌های دسامبر 94
    -> 78%، ین +0.8% (دارایی امن)، و طلا -89.6 در تسویه (4060.4)، -104.4 در ردیف (4024.1)،
    4000.9 در آسیا بدون محرک، همراه با نقره -5.9%، مس -2.7%، BTC -3.3%. طلا در جریان
    کاهش مجموع موقعیت‌ها به‌صورت یک دارایی ریسکی اهرمی معامله شد (Nasdaq -2.6%، SOX
    -6.7% در پی ثبت درخواست افزایش سرمایه سهامی متا). قاعده 3 تعیین‌کننده قیمت را
    مشخص می‌کند: پرتفوی مارجین. پیوند نفت -> بازده 2ساله همان روز شکست (برنت +4%،
    بازده 2ساله -19). در این رفتار بازار، نخستین برداشت از ثبت هر حمله، اخطار تأمین
    وجه تضمین است، نه دارایی امن؛ ابتدا برنت، سپس علامت بازده 2ساله، سپس رفتار بازار
    سهام. گزارش کوتاه شنبه 24 اکتبر: پنجمین برداشت از رده رابطه معکوس در نه جلسه،
    این یکی متعارف - صرف حمله آخر هفته به‌صورت افزایش نرخ بهره به طلا رسید (نفت +3%
    -> بازده 2ساله +5 -> طلا -1.2%)، سهام بدون تغییر؛ برداشت اخطار تأمین وجه تضمین
    همچنان نخستین برداشت از ثبت هر حمله است. بازه کور شنبه تا یکشنبه، با اشاره‌های
    تصمیم‌گیر اصلی؛ گزارش کوتاه یکشنبه ابتدا نفت و سپس علامت آسیایی بازده 2ساله را
    می‌خواند (قاعده 25). دامنه بازگشایی 3850-4150 نوشته شد (0.65).'
