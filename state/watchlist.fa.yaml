    نه از مسیر تقاضا برای دارایی امن. از 22 سپتامبر به‌عنوان کانال سوم نام‌گذاری شده؛
    در 24 سپتامبر خطوط جداگانه‌ای به آن اختصاص داده شد، چون چهارشنبه نخستین ترک‌ها
    ثبت شدند: S&P -0.75%، Russell -1.8%، افت Nasdaq در شرایط بازده 5.11% اوراق 10ساله؛
    MarketWatch: محدودترین گستره مشارکت در بازار از زمان اوج دات‌کام؛ جمع‌بندی investinglive:
    استفاده از تعبیر «شکستن سد» درباره اوراق قرضه؛ BTC در 84.3K (-2.6% پس از +14%
    در طول هفته، ورود سرمایه به ETF حدود $1bn در روز - همان جریانی که در 21-22 سپتامبر
    از طلا پیش افتاد)؛ USDJPY در 157.93 در برابر سطح 158 بانک ژاپن برای استعلام نرخ
    و سطح 160 وزارت دارایی؛ برآورد اولیه PMI ژاپن در پایین‌ترین سطح چهار ماه اخیر؛
    بیکاری استرالیا 4.6% (بالاترین میزان از 2021). تأیید می‌کند (bearish-rates 50،
    سناریوی پایه 20): ثبت هم‌زمان مجموعه محرک‌های بالا در یک جلسه معاملاتی همراه با
    صعود طلا. باطل می‌کند (خروج مضمون از بررسی): دو هفته رکوردزنی سهام با بازده اوراق
    2ساله >=4.85 و طلای بدون تغییر؛ یا نشانه ترک ظاهر شود و طلا همراه با همه‌چیز سقوط
    کند (رژیم فراخوان وجه تضمین - برداشت kinetic-transmission-inverted برنده می‌شود).
    25 سپتامبر: نخستین داده در این مسیر - investinglive/Reuters: بازده اوراق 10ساله
    در 5.2 «در حال آزمودن میزان تحمل بازار سهام است» و در حالی که Nasdaq نزدیک رکوردهاست،
    بر ارزش‌گذاری‌های هوش مصنوعی فشار می‌آورد. پنج‌شنبه: S&P -0.02% با Meta +4.5%
    که «بازندگان را پنهان می‌کند» (Arm -7.9%)، Dow -0.31%، Russell -0.11%، افت 0.2-0.9%
    اروپا؛ Nikkei روز جمعه با اتکا به سهام تراشه‌ها +1.2%؛ BTC بدون تغییر در 84.3K
    (بازگشت صعودی اواخر معاملات سهام را دنبال نکرد). سیگنال رکود Oxford Economics
    در حال هشدار دادن است، در حالی که مخارج همچنان پابرجاست. مجموعه محرک‌ها ثبت نشده
    است (نیازمند سهام -2% همراه با افت Nikkei و BTC، بازده اوراق 2ساله -15 واحد پایه،
    USDJPY <156 است). پایان فصل در چهارشنبه 30 سپتامبر، نقطه تنش خودِ تقویم است.'
