    بهره نسبی، نه افت ارزش پول؛ هیچ بانک مرکزی دیگری در این وضعیت به سمت تسهیل سیاست
    پولی نمی‌رود (ناگل/لین از ECB در 22 سپتامبر، اجماع برای SNB در پنج‌شنبه حفظ نرخ
    است). باز: be4d6b22 (عدم ثبت USDJPY در >=160 تا پنج‌شنبه 24 سپتامبر 23:59Z، 0.55؛
    1.5% حاشیه). نشست بعدی بانک ژاپن 30 اکتبر، دو روز پس از FOMC در 28 اکتبر. تغییر
    سناریو: >=160 با عبور از سد وزارت دارایی = بازگشت ستون، پایه 30؛ <152 همراه با
    افت Nikkei+BTC = رژیم نقدینگی. 24 سپتامبر: USDJPY در 157.93 (بالاترین سطح چهارشنبه
    158.36 - عبور روزانه از سطح 158 استعلام نرخ، هیچ اقدامی از سوی وزارت دارایی گزارش
