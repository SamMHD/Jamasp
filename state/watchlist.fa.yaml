    چشمک می‌زند، در حالی که مخارج همچنان پابرجاست. مجموعه محرک‌ها ثبت نشده است (نیازمند
    سهام -2% همراه با افت Nikkei و BTC، بازده اوراق 2ساله -15bp، USDJPY <156 است).
