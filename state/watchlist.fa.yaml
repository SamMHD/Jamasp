- theme: warsh-credibility
  why_fa: 'کانال کاهش ارزش پول - بهترین توضیح برای طلای بالای $4,000 در برابر بازده
    واقعی مثبت (DFII10 2.61). 16 سپتامبر: افزایش نرخ بهره با وجود فشار سیاسی انجام
    شد، با رأی 12-0 - مثبت برای اعتبار؛ خط ابطال خود این مضمون محقق شد (30y برابر
    با -1.3bp همراه با 2y برابر با +12bp، طلا -1.9%، دلار عبورکرده از 100). 17 سپتامبر:
    بازده‌ها پایین و طلا بالا (بازشدن موقعیت‌ها). 18 سپتامبر: نشانه فقط یک بار ظاهر
    شد - طلا +0.96% همراه با 2y برابر با +6.6bp، 10y برابر با 5.00، 30y برابر با +3bp،
    DXY بدون تغییر، BTC برابر با +6%. اصلاحیه 20 سپتامبر: در سطح هفته، منحنی این نشانه
    را ندارد - actionforex: طی هفته FOMC، ‏2y برابر با +12.6bp، ‏10y برابر با +3.1،
    ‏30y برابر با -2.9؛ صراحتاً «نه الگوی شوک به اعتبار مالی دولت یا ریسک دیرش»، بلکه
    بازقیمت‌گذاری متمرکز سیاست پولی؛ MarketWatch در 19 سپتامبر: «فدرال رزروِ وارش
    نشان می‌دهد که جدی است... وال‌استریت اکنون این را باور دارد» - مثبت برای اعتبار،
    یعنی برخلاف این مضمون. نشانه روز جمعه توضیحی از منظر میز معاملات نرخ بهره دارد
    که نیازی به کاهش ارزش پول ندارد (طلا بر مبنای مقصد بدون تغییر معامله می‌شود، نه
    جهش بیش‌ازحد 2y). نشانه‌ها: 2 موافق / 12 مخالف. وزن پایه طبق شرط ورود تا دوشنبه
    روی 20 می‌ماند. تأییدها (پایه 30): دوشنبه هر دو صعودی (1889819a محقق نشود)، همراه
    با صعود 30y در همان روز - بدون سررسیدهای بلندمدت، این برداشتِ مقصد است که سناریوی
    نزولیِ ناشی از نرخ بهره را جابه‌جا می‌کند، نه سناریوی پایه را؛ بسته‌شدن 30y در
    >=5.40 همراه با صعود طلا (aec5cc8b محقق نشود). ابطال‌ها: دوشنبه افت طلا هم‌زمان
    با صعود 2y؛ محقق‌شدن 1889819a با 30y زیر 5.40. اقدام ترامپ علیه وارش که به‌صورت
    صعود طلا/صعود 2y قیمت‌گذاری شود، تأیید دیگر است (قاعده 7 زمان‌بندی را محدود می‌کند)؛
    جنجال «1% یا کمتر» در قیمت‌گذاری بی‌اثر تلقی شده است.'
