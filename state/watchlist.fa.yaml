    دوباره سقوط می‌کنند» - اوراق 10ساله 5.00، 30ساله 5.328 - و طلا با وجود ثبات دلار
    صعود کرد: مشاهده‌ای مربوط به یک جلسهٔ معاملاتی در دل هفته‌ای با مسطح‌شدن منحنی.
