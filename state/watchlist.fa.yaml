    از یورو باشد، اطلاعات کمتری در خود دارد — طلا هنگام ثبت سقف جدید DXY در بازگشایی
    یکشنبه +0.2% افزایش یافت؛ (b) طلا برحسب EUR نزدیک سقف‌های خود قرار دارد — تقاضای
    اروپایی برای دارایی امن که جریان معاملات کاغذی تا بازگشت میزهای معاملاتی SGE/لندن
    نشان نخواهد داد (پنجشنبه 8 اکتبر، هفته کنفرانس LBMA)؛ (c) حرکت بی‌نظم OAT، کانال
    «بانک مرکزی دیگر» (قاعده 6) برای ECB است — گزارش مذاکرات پنجشنبه 11:30Z. نشانگرها:
    OAT-Bund برابر با 150 / 160bp؛ EUR/USD برابر با 1.1150 / 1.1080؛ DXY برابر با
    103؛ تداوم حرکت CAC. معیار موضع‌گیری: فاصله بازده >=160bp همراه با DXY >=103 و
    کاهش طلا -> بخش دلار به زنجیره بازگشته است؛ افزایش طلا با وجود آن -> برداشت مبتنی
    بر منشأ خارج از آمریکا پابرجاست. به‌خودی‌خود ورودی وزن‌دهی نیست؛ از طریق آزمون
    علامت DXY/بازده 2ساله وارد می‌شود. اگر فاصله بازده به‌مدت یک هفته زیر <120bp بسته
    شود، این فرضیه باطل می‌شود. 7 اکتبر: دوشنبه CAC به‌تنهایی در اروپا -0.8%، EUR/USD
    برابر با 1.1217 (-0.3%)، DXY برابر با 102.1-102.5؛ سه‌شنبه دولت فرانسه اقداماتی
    در زمینه کسری بودجه انجام داد، فاصله بازده OAT-Bund کاهش یافت و EUR بازگشت صعودی
    داشت (investinglive، 11:19Z)، DXY در 101.83 بسته شد و طلا افزایش یافت — برداشت
    دلار با منشأ خارج از آمریکا در هر دو جهت معتبر ماند. سطح فاصله بازده به‌صورت عددی
    گزارش نشد؛ <120bp به‌مدت یک هفته این مضمون را باطل می‌کند. 8 اکتبر: آرامش ناشی
