    (سه‌شنبه 22:40Z): میانجی‌گری قطر با «پیشرفت اندک»، مصالحه دوصفحه‌ای (رفع محاصره
    در برابر موضوع هسته‌ای)، الثوادی با عراقچی (نیویورک) و سپس کوشنر/ونس (واشنگتن
    دی‌سی) دیدار کرد، ترامپ «هیچ‌چیز پیشنهاد نکرد»، ایران: امتیازدهی تنها پس از بازگشت
    آمریکا به تفاهم‌نامه ژوئن، مقامات آمریکایی: نبرد عمده ممکن است پس از انتخابات
    میان‌دوره‌ای (3 نوامبر) از سر گرفته شود، قطر سرخورده، هیچ دور جدیدی در کار نیست.
    برنت بر اثر عرضه در 102.59 (-2.55%) تسویه شد - عرضه تا 40M بشکه از ذخایر راهبردی
    نفت (عرضه ژوئن ~500K تقاضا جذب کرد)، بارگیری‌های ینبع از سر گرفته شد، کپلر: صادرات
    خاورمیانه ~16 mb/d (بالاترین سطح دوران جنگ)، گلدمن: صادرات خلیج فارس در سطح میانگین
    2025، عربستان بالاتر، صادرات دریایی ایران صفر؛ برنت همچنان +10% ماه‌به‌ماه؛ OPEC+
    یکشنبه ثابت نگه می‌دارد؛ سررسید نوامبر چهارشنبه منقضی می‌شود (دسامبر سررسید نزدیک
    است). احیای عرضه فیزیکی دست تهران و همراه با آن شاخه توافق را تضعیف می‌کند. فعال:
    603c3c19 (تا یکشنبه)، 483bea33، d9142975؛ a0c82077 چهارشنبه 23:59Z بسته می‌شود
    و در مسیر مورد انتظار است (Al Funtas = دسته شناورها)؛ جانشین 440d34a8 (هیچ اقدام
    از دسته‌ای جدید در پنج‌شنبه 1 - چهارشنبه 7 اکتبر، 0.7). گزارش کوتاه 1 اکتبر: روبیو
    دوشنبه‌شب پس از به بن‌بست رسیدن مذاکرات، به هیئت ایران در مجمع عمومی سازمان ملل
    (عراقچی) دستور داد نیویورک را ترک کند (آکسیوس به نقل از investinglive، 00:19Z؛
    سه‌شنبه به دوحه پرواز کرد)؛ میانجی‌های قطری با «پیشرفت اندک» اما همچنان در حال
    انتقال متن مصالحه میان طرفین؛ ترامپ چهارشنبه: «ممکن است به ایران حمله کنیم»، تصمیمی
    «باید گرفته شود»، «به‌زودی به یک شکل یا شکل دیگر پایان می‌یابد»؛ موضع مقامات آمریکایی
    (آکسیوس/CNN، 29-30 سپتامبر) همچنان نبرد عمده را پس از انتخابات میان‌دوره‌ای قرار
    می‌دهد. هرمز: UKMTO 144/145/146-26 (سه‌شنبه 29، سه نفتکش شامل VLCC شرکت ADNOC
    به نام Mersin Prosperity و Sinbad، با پرچم لیبریا، عبورهای بدون AIS، بدون انتساب؛
    فارس «شلیک‌های هشدار»؛ سخنگوی سپاه «به مین برخورد خواهد کرد» = تهدید)؛ ویندوارد:
    17 عبور در سه‌شنبه؛ کپلر: سپتامبر >=16.5 mb/d بدون احتساب ایران، با خروج ~40%
    از طریق خط لوله (17% پیش از جنگ)؛ بارگیری 6.2M بشکه در ینبع در 28 سپتامبر - «چنگ
    ایران شل می‌شود» (ماریتایم اگزکیوتیو). پایگاه نیروی هوایی سلطنتی فرفورد (یکشنبه
    27): برنهام: «نشانه‌های قوی» از ایران؛ بدون مواد منفجره (بنزین)، پنج بریتانیایی
    با وثیقه آزاد شدند، یک مظنون به پلیس اطلاع داد؛ ایران تکذیب می‌کند - دسته توطئه
    خنثی‌شده در خاک ناتو، در ارزیابی محسوب نمی‌شود. «امارات کشته شدن خدمه نفتکش را
    محکوم می‌کند» = MT Honour 25، دزدان دریایی سومالی، عملیات پونتلند در 29 سپتامبر
    - نه ایران. قرارداد نوامبر برنت در 103.53 منقضی شد؛ سررسید نزدیک دسامبر ~98-100،
    زیر 100 با وجود اظهارات علنی درباره حمله. a0c82077 HIT (خانواده این دسته 6/6).
    مورد جدید 8aacb1e6 (هیچ حمله علناً ثبت‌شده آمریکا به خاک ایران در پنج‌شنبه 1 -
    یکشنبه 4 اکتبر، 0.65؛ MISS -> نظامی 35). فعال: 440d34a8 (چهارشنبه 7)، 603c3c19
    / 483bea33 / d9142975 (یکشنبه 4). OPEC+ در یکشنبه: نمایندگان می‌گویند بدون تغییر.'
