  why_fa: 'جنگ از مسیر افزایش نرخ بهره فدرال رزرو و اخطار تأمین وجه تضمین به طلا می‌رسد،
    نه از مسیر تقاضا برای دارایی امن. چهارده جلسه شواهد در 2-21 سپتامبر، با شدیدترین
    مورد در 21 سپتامبر (اصابت به دو نفتکش، نفت -3.7%، طلا -1.0%، BTC +7.1%). خلاف
    آن: یک مورد (9 سپتامبر). 22 سپتامبر - مرحله تنش‌زدایی: یک دور مذاکرات آمریکا و
    ایران با تأیید هر دو طرف، برنت در 99.25 تسویه شد (-1.1%، پنج جلسه نزولی)، طلای
    نقدی +0.5% / ردیف بدون تغییر، منحنی بازده 1.5-2.3 واحد پایه صعودی، دلار اواخر
    روز تضعیف شد و سپس طی شب تقویت شد و طلا رشدش را پس داد. بند معاملات ثبت‌شده درباره
    محرک (قاعده 23): حدود 18:30Z ثبت شد، GC در پایان معاملات Globex از 4390 به 4396
    رفت - هدف در هر دو جهت محقق نشد، وزن‌ها حفظ شدند. دریچه: صعود نفت باعث فروش طلا
    می‌شود (از مسیر بازده 2 ساله)؛ نزول نفت بر اثر دیپلماسی، طلا را بدون تغییر تا
    نزولی نگه می‌دارد (صرف ریسک خود طلا تخلیه می‌شود، بازده 2 ساله همراهی نمی‌کند)
    - تنها مسیر صعود طلا، نزول بازده 2 ساله است که به یک عضو هیئت‌مدیره فدرال رزرو
    یا یک تغییر تعیین‌کننده در داده‌های آمریکا نیاز دارد، نه یک تیتر خبری. ادعاها:
    64c7ba41 در 23 سپتامبر نامشخص (هیچ تسویه صعودی نفتی در دوشنبه/ سه‌شنبه وجود نداشت)؛
    جانشین آن 8e425cab (0.5) با نخستین تسویه صعودی برنت از چهارشنبه تا جمعه فعال می‌شود
    (ردیف <+1% = تحقق؛ نبود چنین موردی = نامشخص)؛ f7a0c23d (0.55): هیچ تسویه برنت
    >=103 از چهارشنبه تا جمعه رخ نمی‌دهد - ادعای تخلیه صرف ریسک. تأییدکننده‌ها: یک
    تسویه صعودی نفت همراه با طلای بدون تغییر/نزولی؛ حمله آمریکا به ایران که بازار
    آن را با نزول طلا قیمت‌گذاری کند؛ متنی با تأیید هر دو طرف که بازار آن را با نفت
    -5% و طلای نزولی قیمت‌گذاری کند. ابطال‌کننده‌ها: عدم تحقق 8e425cab -> نظامی 35؛
    دو ردیف متوالی با طلای صعودی / بازده 2 ساله صعودی؛ طلا +1% در یک جلسه نزولی نفت
    با بازده 2 ساله بدون تغییر؛ یک رویداد عرضه که بازار آن را به‌صورت رکود تورمی معامله
    کند (انتهای بلندمدت منحنی صعودی، دلار نزولی، طلا صعودی)؛ متنی که بازار آن را با
    برنت -5% همراه با طلای صعودی و بازده 2 ساله بدون تغییر قیمت‌گذاری کند -> نظامی
    25. 24 سپتامبر: 8e425cab محقق شد - نخستین تسویه صعودی نفت (103.08، +3.9%) ردیف
    طلا را در -1.74% ثبت کرد؛ چهارده جلسه صعودی نفت از 2 سپتامبر که طلا در پایان آن‌ها
    بدون تغییر/نزولی بسته شد، یک مورد خلاف آن. تعدیل طبق قاعده 9: بازقیمت‌گذاری ناشی
    از PMI/بار نیز در همان روز رخ داد. f7a0c23d محقق نشد (سقف ناشی از تخلیه صرف ریسک
    در یک جلسه شکسته شد؛ درس: سطوح نفت مشمول آزمون فاصله قاعده 20 می‌شوند). مرحله
    تخلیه طی شب: برنت با گزارش نقشه راه -1%، طلا بدون تغییر در 4324، بازده 2 ساله
    بدون تغییر - دیپلماسی تقاضای خرید ایجاد نمی‌کند. نظامی 25. ابطال‌کننده‌ها بدون
    تغییر: ثبت وضعیت رکود تورمی (بازده 30 ساله >=5.45، DXY نزولی، طلا صعودی)؛ دو ردیف
    با صعود هر دو؛ طلا +1% هنگام نزول نفت با بازده 2 ساله بدون تغییر. 25 سپتامبر:
    پانزدهمین جلسه صعودی نفت که طلا در پایان آن بدون تغییر/نزولی بسته شد (برنت بر
    اثر حملات موشکی به ینبع +3.4% تا 106.60؛ ردیف -0.37%). شکاف: در 16:18Z گزارش توافق
    مرحله‌ای، برنت را -3 و GC را +20 جابه‌جا کرد (4292.7 -> 4312.1)، با بازده 2 ساله
    بدون تغییر - نخستین تقاضای خرید هنگام نزول نفت در این رژیم - که تا 18:00Z فروکش
    کرد؛ سپس طی شب برنت -1% تقاضای خرید طلا را برانگیخت و آن را +24 تا 4328.5 بالا
    برد. کوچک است، اما زنجیره اکنون در معاملات روزانه هر دو جهت را نشان می‌دهد. ادعای
    جدید a270f3f1 (0.55): نخستین تسویه -3% برنت از جمعه تا سه‌شنبه، ردیف +1% برای
    GC ثبت نمی‌کند؛ عدم تحقق با بازده 2 ساله بدون تغییر -> نظامی 20، پایه 25 (مرحله
    تخلیه برای طلا تقاضای خرید ایجاد می‌کند = رژیم در حال سست‌شدن است). سایر ابطال‌کننده‌ها
    بدون تغییر.'
