    پایان آن‌ها بدون تغییر/نزولی بسته شد، در برابر یک مورد مخالف. تعدیل طبق قاعده
    9: بازقیمت‌گذاری ناشی از PMI/بار نیز در همان روز رخ داد. f7a0c23d محقق نشد (سقف
    تخلیه صرف در یک جلسه شکست؛ درس: سطوح نفت باید آزمون فاصله قاعده 20 را بگذرانند).
    طی شب، مرحله تخلیه: برنت با گزارش نقشه راه -1%، طلا بدون تغییر در 4324، بازده
    2ساله بدون تغییر - دیپلماسی به معنای تقاضای خرید نیست. سناریوی درگیری نظامی 25.
    ابطال‌کننده‌ها بدون تغییر: ثبت رکود تورمی (بازده 30ساله >=5.45، DXY نزولی، طلا
    صعودی)؛ دو ردیف با صعود هر دو؛ طلا +1% همراه با نفت نزولی و بازده 2ساله بدون تغییر.
    25 سپتامبر: پانزدهمین جلسه صعودی نفت که طلا در پایان آن بدون تغییر/نزولی بسته
    شد (برنت با حملات موشکی به ینبع +3.4% تا 106.60؛ ردیف -0.37%). شکاف: در 16:18Z
    گزارش توافق مرحله‌ای، برنت را -3 و GC را +20 حرکت داد (4292.7 -> 4312.1)، با بازده
    2ساله بدون تغییر - نخستین تقاضای خرید در شرایط نزول نفت در این رژیم - که تا 18:00Z
    فروکش کرد؛ سپس طی شب، برنت -1% تقاضای خرید طلا را +24 تا 4328.5 بالا برد. کوچک
    است، اما زنجیره اکنون هر دو جهت را درون روز نشان می‌دهد. ادعای جدید a270f3f1 (0.55):
    نخستین تسویه -3% برنت از جمعه تا سه‌شنبه، ردیف +1% برای GC ثبت نمی‌کند؛ عدم تحقق
    با بازده 2ساله بدون تغییر -> سناریوی درگیری نظامی 20، پایه 25 (مرحله تخلیه برای
    طلا تقاضای خرید ایجاد می‌کند = رژیم در حال سست‌شدن است). سایر ابطال‌کننده‌ها بدون
    تغییر. 26 سپتامبر - دریچه در بخش کوتاه‌مدت منحنی دوطرفه است: جمعه، برنت با طرح
    هفت‌روزه در 104.32 تسویه شد (-2.1%)، بازده 2ساله با -3.5 واحد پایه در 4.86 بسته
    شد، DXY -0.22%، ردیف GC +0.27% (4321.2)، طلای نقدی +$8 - نخستین جلسه این رژیم
    که در آن نزول نفت، بخش کوتاه‌مدت منحنی را پایین کشید و برای طلا تقاضای خرید ایجاد
    کرد، بدون هیچ واسطه انتقال یا سخنرانی در میان. همان زنجیره (قاعده 22)، با علامت
    معکوس؛ تقاضا برای دارایی امن نیست (طلا بالا رفت چون بازده 2ساله پایین آمد). شمارش:
    در 15 مورد از 16 جلسه صعودی نفت، طلا بدون تغییر/نزولی بسته شد؛ جلسات نزولی نفت
    اکنون 3 مورد بدون تغییر تا نزولی (21، 22، 24 سپتامبر) در برابر 1 مورد صعودی (25
    سپتامبر، از مسیر بازده 2ساله) هستند. بازنگری: شاخه توافق اکنون طلای اندکی صعودی
    است (+0.5-1% با برنت -5-8%)، با سقفی که تخلیه صرف ایجاد می‌کند - «بدون تغییر تا
    نزولی» پنج‌شنبه کنار گذاشته شد (درس ثبت شد). a270f3f1 (0.55) آزمون این موضوع است:
    نخستین تسویه -3% برنت تا سه‌شنبه نباید ردیف +1% ثبت کند (جمعه -2.1%، ردیف +0.27%
    ثبت کرد؛ با مقیاس‌کردن، -3% ~ +0.4%). ادعای جدید 95c71900 (هیچ ردیفی >=4402.2
    در دوشنبه تا سه‌شنبه، 0.5) سقف هر دو شاخه است. سناریوی درگیری نظامی 25. ابطال‌کننده‌ها
    بدون تغییر: عدم تحقق a270f3f1 با بازده 2ساله بدون تغییر -> 20 / پایه 25؛ دو ردیف
    با صعود هر دو؛ ثبت رکود تورمی. 27 سپتامبر: رد طرح پس از تسویه رخ داد. مرحله تخلیه
    جمعه (برنت -2.1%، بازده 2ساله -3.5 واحد پایه، DXY -0.22%، ردیف GC +0.27%) بر مبنای
    طرحی معامله شد که ترامپ شنبه به‌طور علنی رد کرد (~18:00Z)؛ گشایش یکشنبه در 22:00Z
    ورودی را بازقیمت‌گذاری می‌کند - انتظار برنت 106-108، بازده 2ساله دوباره به سمت
    4.90، و طلا در حال پس‌دادن $12 رشد جمعه از مسیر بخش کوتاه‌مدت منحنی (تقاضا برای
    دارایی امن نیست). ادعای جدید 9e1829f8 (0.6): نخستین تسویه برنت >=+2% در دوشنبه
    تا سه‌شنبه، ردیفی برای GC ثبت می‌کند که >=0.1% پایین‌تر از ردیف قبلی است (اگر
    هیچ موردی ثبت نشود، نامشخص) - آزمون علامت معکوسِ سابقه 15/16 در جلسات صعودی نفت؛
    عدم تحقق همراه با بازده 30ساله >=5.50 و DXY نزولی، نشانه رکود تورمی است (پایه
    25)، عدم تحقق همراه با بازده 2ساله صعودی و طلای صعودی، یک ردیف با صعود هر دو است
    (پایه). a270f3f1 (0.55) به سمت نتیجه نامشخص می‌رود (تسویه -3% تا سه‌شنبه به پیشنهاد
    متقابل رسمی آمریکا نیاز دارد). سناریوی درگیری نظامی 25: شاخه توافق طبق اظهارات
    علنی از دستور کار خارج است، شاخه شکست مذاکرات (برنت >=110 -> طلای نزولی از مسیر
    بازده 2ساله) شاخه فعال است. ابطال‌کننده‌ها بدون تغییر: عدم تحقق a270f3f1 با بازده
    2ساله بدون تغییر -> 20 / پایه 25؛ دو ردیف با صعود هر دو؛ ثبت رکود تورمی. گزارش
    کوتاه 28 سپتامبر: رابطه معکوس در ششمین آخرهفته درگیری نظامی برقرار ماند - برنت
    +1.7% (اوج +2.6%)، بازده 2ساله +3.7 واحد پایه، طلا -2.1% تا 4230.6 با عبور از
    ناحیه حمایتی 4244-4253؛ عبور بازده 30ساله از 5.50 همراه با طلای نزولی، نشانه مخالف
    است (18 مورد مخالف / 2 مورد موافق). واگرایی اندازه حرکت علامت‌گذاری شد: حرکت طلا
    ~3x حرکتی است که ورودی‌های نفت/بازده 2ساله در 23 سپتامبر ایجاد کردند - شکست ناحیه
    حمایتی، پایان فصل، تقاضای خرید چین خاموش؛ در هیچ‌یک از دو جهت، تقاضا برای دارایی
    امن نیست. 9e1829f8 امشب فعال است (تسویه برنت >=106.41 -> ردیف >=0.1% نزولی؛ ردیف
    هم‌اکنون 70 واحد پایین‌تر از 4299.7 یکشنبه است). علامت شاخه توافق بدون تغییر:
    تأیید دریافت یک متن قطری = تخلیه = 4253/4300، یک شکست نزولی ناموفق، نه یک حرکت
    صعودی.'
