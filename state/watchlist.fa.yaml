  why_fa: 'بازده‌های واقعی محرک غالب طلا هستند، و این فدرال رزرو همین حالا نرخ بهره
    را افزایش داد: 16 سپتامبر، +25 واحد پایه به 3.75-4.00%، با رأی 12-0، بدون جمله‌ای
    برای ارائه راهنمایی؛ نمودار نقطه‌ای حاکی از یک افزایش دیگر در 2026 است (میانه
    4.1؛ 16 نفر از 18 نفر انتظار >=1 افزایش دیگر دارند). وارش: «محدودکننده نیست»،
    برآورد PCE اوت ~3.6%. اردوگاه رؤسای منطقه‌ای همچنان خواستار افزایش بیشتر است:
    موسالم، کالینز، گولزبی (21 سپتامبر)؛ کالینز دوباره در 22 سپتامبر («می‌توان بر
    ثبات قیمت‌ها تمرکز کرد»)؛ بارکین، 22 سپتامبر ساعت 17:00Z (CFA بالتیمور): «ریسک‌های
    تورم بر ریسک‌های اشتغال حداکثری می‌چربند»، >60% از دسته‌های PCE بالای >3% هستند،
    بنگاه‌ها هزینه‌ها را منتقل می‌کنند، یک بار «گوشزد کردن» شاید کافی نباشد - اما
    این چرخه «می‌تواند شبیه تعدیل میان‌چرخه‌ای گرینسپن باشد» (همان ~75 واحد پایه در
    میانه دهه 1990): انقباضی با یک سقف، و سهام شرکت‌های خانه‌سازی در واکنش به آن جهش
    کرد. دو نوبت سخنرانی اعضای هیئت‌مدیره/نیویورک (جفرسون، ویلیامز، 22 سپتامبر) درباره
    سازوکارهای عملیاتی بود - بدون راهنمایی. تابلوی بازار: حراج اوراق 2ساله ($69 میلیارد،
    22 سپتامبر) با بازده 4.787 نهایی شد، 0.2 واحد پایه بالاتر از بازده پیش از حراج،
    با نمره C - بالاترین بازده اوراق 2ساله از 2024، عرضه را بدون تنش جذب کرد؛ منحنی
    بازده در پایان جلسه 1.5-2.3 واحد پایه بالاتر بسته شد (CNBC: اوراق 5ساله 4.842،
    10ساله 4.967، 30ساله 5.303)، در جلسه‌ای با برنت -1.1% و تأیید هم‌زمان یک دور مذاکرات
    آمریکا و ایران - بخش کوتاه‌مدت منحنی، نفت را در مسیر نزولی دنبال نمی‌کند (بر اساس
    اظهارات ثبت‌شده، رویکرد نادیده گرفتن اثر موقت شوک منتفی شده است: اشمید، کشکاری،
    آن سه نفر، بارکین). بازده پایانی اوراق 2ساله در 22 سپتامبر قابل بازیابی نیست (US2Y
    در CNBC خالی است). قیمت‌گذاری: اکتبر «کمی بیش از 50%» (investinglive، ساعت 13:38Z
    در 22 سپتامبر، بدون بازنشر بعدی)؛ BofA همچنان اکتبر + دسامبر را پیش‌بینی می‌کند؛
    دویچه بانک: بازارها چرخه جهانی افزایش نرخ بهره را کمتر از حد واقعی قیمت‌گذاری
    می‌کنند. نقاط بررسی: اوراق 2ساله 4.791-4.800 (شکست = هدف برآوردی 5.055؛ پس‌زده‌شدن
    و سپس <4.600 = برگشت روند)؛ DXY برابر 100.02 / 100.58 / 101.80. خط تغییر سناریو
    (تأیید اکتبر از سوی یک عضو هیئت‌مدیره -> سناریوی نزولی ناشی از نرخ بهره 60؛ درخواست
    توقف -> سناریوی پایه 30) فعال نشده است. سخنرانان (ff_calendar، کم، todo-188):
    بار، چهارشنبه 23 ساعت 14:05Z (یادآوری #59، ابتدا محل برگزاری بررسی شود - فهرست
    هیئت‌مدیره فقط وام‌دهی با فرصت دوباره و هوش مصنوعی را نشان می‌دهد)؛ پنجشنبه ویلیامز
    08:10Z، بارکین 12:30Z، هامک 12:50Z، پاولسون 14:10Z؛ جمعه ویلیامز 09:15Z، هامک
    18:00Z. گزاره‌ها: fc5c5a29 (تا 25 سپتامبر هیچ بازده پایانی اوراق 2ساله‌ای <4.60
    نباشد، 0.55)؛ 4872cd75 (بازنشر احتمال اکتبر تا جمعه >=45% باشد، 0.55)؛ 1a513d72
    (تا چهارشنبه ساعت 23:59Z هیچ بازنشری با مقدار >=60% نباشد، 0.55 - ریسک بار)؛ d8e247ef
    (تا دوشنبه 28 هیچ جفت متوالی با صعود هر دو نباشد، 0.7 - سه‌شنبه ردیف بدون تغییر
    بود، نه صعود هر دو). ایستگاه‌های بعدی: بار در چهارشنبه؛ مؤلفه قیمت‌های پرداختی
    PMI مقدماتی آمریکا، چهارشنبه 13:45Z؛ شاخص قیمت مصرف‌کننده (CPI) سپتامبر در میانه
    اکتبر؛ FOMC در 28 اکتبر. گزارش کوتاه 24 سپتامبر: تغییر سناریو چهارشنبه فعال شد
    (وزن‌ها 15/60/25). PMI ترکیبی مقدماتی 58.4 (هزینه نهاده‌ها در بالاترین سطح از
    اکتبر 2022) + بار («در سناریوی پایه من، احتمالاً تعدیل‌های بیشتری در سیاست لازم
    خواهد بود») -> احتمال اکتبر در جمع‌بندی پایانی 65% (در طول روز 74%، «94 واحد پایه
    دیگر از اینجا»)؛ اوراق 2ساله در 4.895 بسته شد (+12 واحد پایه، CNBC)، 10ساله 5.114
    (بالاترین سطح از 2007)، 30ساله 5.402 (نخستین بسته‌شدن در >=5.40)، DXY برابر 101.12؛
    ردیف طلا -1.74%. گزاره 1a513d72 محقق نشد (بازنشر >=60% از پست PMI در ساعت 13:51Z
    آمد). فعال: 6e168240 (اوراق 2ساله چهارشنبه >=4.80 محقق شد، بخش پنجشنبه باقی است)،
    1e91793f (پنجشنبه تا جمعه هیچ بازنشری <55% نباشد، 0.55)، 4872cd75 (>=45%)، fc5c5a29
    (هیچ بازده پایانی <4.60 نباشد). پنجشنبه: SNB ساعت 07:30Z، ویلیامز 08:10Z (محل
    برگزاری در فهرست فدرال رزرو نیویورک نیست)، درخواست‌های بیمه بیکاری 12:30Z با اجماع
    200K، بارکین 12:30Z، هامک 12:50Z، پاولسون 14:10Z؛ جمعه ویلیامز 09:15Z، اشمید 13:20Z،
    هامک 18:00Z - همگی رؤسای منطقه‌ای، بدون عضو هیئت‌مدیره، صرفاً نشانه‌هایی برای
    پایش. بازگشت سناریو: یک بازنشر <55% یا درخواست‌های بیمه بیکاری >230K همراه با
    درخواست توقف از سوی ویلیامز -> سناریوی نزولی ناشی از نرخ بهره 50. گزارش کوتاه
    25 سپتامبر: وزن‌ها در 15/60/25 حفظ شدند. پنجشنبه جمع هم‌صدایان گسترده‌تر شد و
    بازار از آن جلو زد: اکتبر 77.5% (بازنشر actionforex از قراردادهای آتی وجوه فدرال
    در 09:16Z؛ جمع‌بندی بازارهای قاره آمریکا هیچ جمله‌ای درباره احتمال نداشت). ویلیامز
    (مجمع سیاست‌گذاری کلان لندن): یک افزایش نرخ بهره دیگر در 2026 «معقول» است، به
    اکتبر متعهد نشد، راهنمایی آینده‌نگر «تمام شده»، اقتصاد «در برابر افزایش قیمت انرژی
    تاب‌آور» است؛ هامک: ریسک‌ها «به سمت صعود متمایل‌اند»، خطر شکل‌گیری یک «ذهنیت تورمی»
    بر اثر شوک‌های مکرر؛ پاولسون (دارای حق رأی): «ممکن است اندکی انقباض بیشتر موجه
    باشد». درخواست‌های بیمه بیکاری 197K، فروش خانه‌های نوساز 684K. اوراق 2ساله در
    4.895 (CNBC) / 4.916 (جمع‌بندی پایانی) بسته شد، 10ساله 5.163 (بالاترین سطح از
    2007)، 30ساله 5.460 (بالاترین سطح از 2004). گزاره 6e168240 محقق شد (هر دو بخش).
    فعال: 1e91793f (>=55%) و 4872cd75 (>=45%) جمعه در مسیر تحقق به پایان می‌رسند؛
    fc5c5a29 جمعه به پایان می‌رسد؛ گزاره جدید 86f87a36 (از جمعه تا سه‌شنبه هیچ بازده
    پایانی اوراق 2ساله‌ای <4.80 نباشد، 0.55). سخنرانان جمعه: ویلیامز 09:15Z (دوباره)،
    اشمید 13:20Z، هامک 18:00Z - بدون عضو هیئت‌مدیره؛ برنامه فدرال رزرو برای 28-29
    سپتامبر هنوز در خوراک داده نیست. بازگشت سناریو بدون تغییر: یک بازنشر <55% یا درخواست
    توقف از سوی یک عضو هیئت‌مدیره -> سناریوی نزولی ناشی از نرخ بهره 50. NFP در 2 اکتبر:
    یادآوری #61.'
