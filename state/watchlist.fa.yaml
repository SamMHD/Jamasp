    هر دو طرف، تا سه‌شنبه)؛ مورد جدید a0c82077 (نبود اقدام ایران از دسته‌ای جدید از
    شنبه تا چهارشنبه 30 سپتامبر ساعت 23:59Z، 0.65: اقدام علیه قلمرو/زیرساخت شورای
    همکاری خلیج فارس با تأیید انتساب به ایران، مین‌گذاری هرمز، یک شناور با پرچم آمریکا/تحت
    اسکورت؛ آتش حوثی‌ها، شناورهای غیرآمریکایی بدون اسکورت، جریمه‌های PGSA و توقیف‌های
    آمریکا در ارزیابی محسوب نمی‌شوند). نشانه‌ها: پاسخ علنی و قابل استناد آمریکا؛ «گام
    بعدی» شورای عالی امنیت ملی؛ اعلام میزبان با محل+تاریخ (-> بررسی عمیق +60)؛ گزارش
    خسارت SPA در ینبع. 27 سپتامبر: علنی و قابل استناد. ترامپ (شنبه، هنگام خروج از
    کاخ سفید؛ CNN / بلومبرگ به نقل از gcaptain): «من پیشنهادشان را رد می‌کنم» / «آن‌ها
    پیشنهادی دادند اما من ردش کردم - آن‌ها می‌خواهند توافقی کنند که در آن تنگه را
    فوراً باز کنند چون به‌شدت در حال باختن هستند ... من هم دوست دارم توافق کنم»، عجله‌ای
    ندارد؛ منبع بلومبرگ: پیمان در حال بررسی، شکلی مشابه تفاهم‌نامه ژوئن داشت (بازگشایی
    هرمز <-> رفع محاصره). WSJ: ترامپ انتظار دارد کارزار بمباران را پس از انتخابات
    میان‌دوره‌ای از سر بگیرد (او از تأیید این موضوع خودداری کرد). عراقچی (وبلاگ زنده
    گلف نیوز): تهران رد پیشنهاد را «مورد توجه قرار داد»، منتظر پاسخی رسمی از طریق
    میانجی‌هاست و پس از آن تصمیم می‌گیرد - تنها روزنه باقی‌مانده برای شاخه توافق.
    محمدی، معاون نیروی دریایی سپاه پاسداران (فارس): کشتی‌های جنگی آمریکا «از جمله
    در اقیانوس هند» در جنگی جدید هدف هستند - یک اظهارنظر، نه یک اقدام (در ارزیابی
    a0c82077 محسوب نمی‌شود). ردیابی پروازها (غیررسمی): 5 فروند KC-135، 2 فروند KC-46،
    1 فروند MQ-4C بر فراز مسیرهای نزدیک‌شونده. مجمع عمومی سازمان ملل، شنبه: فیصل بن
    فرحان، وزیر امور خارجه عربستان - جهان «در حفاظت از کشتیرانی خلیج فارس ناکام است»؛
    البوسعیدی، وزیر امور خارجه عمان - خویشتن‌داری، مسقط آماده میانجی‌گری درباره دریانوردی
    است. حوثی‌ها، شنبه: دو پهپاد به‌سوی ریاض + یک موشک بالستیک به‌سوی خمیس مشیط رهگیری
    شدند، هشدارها در ابها/جازان (دسته نیروهای نیابتی). بسنت، «عملیات طرد اقتصادی»
    (X، شنبه): امارات همه شرکت‌های هواپیمایی ایرانی را زمین‌گیر کرد، بانک مرکزی امارات
    تراکنش‌های شعبه بانک ملی را مسدود کرد (چهارشنبه)، بانک‌های بزرگ اماراتی و ترکیه‌ای
    روابط خود با ایران را قطع کردند، ترکیه/عمان فعالیت ماهان ایر را متوقف کردند، 50+
    کشور مشارکت دارند («روز دی اقتصادی»، WSJ). ارزیابی‌شده: d96debd5 محقق شد (نبود
    حمله به زیرساخت خارگ/لارک در 20-26 سپتامبر؛ آمریکا در دسته شناورها باقی ماند)،
    2df323fa محقق شد (هیچ امضایی از کشورهای خلیج فارس پای رژیم موردنظر ایران نبود؛
    بحرین و ریاض در جهت مخالف حرکت کردند) - پیش‌بینی‌های ساختاریِ عدم وقوع 23/23.
    مواردی که یکشنبه بسته می‌شوند، 33defb45 / d4f5ffd6 / 0d52e7da / ed8c08b5، همگی
    در مسیر تحقق هستند (دوشنبه ارزیابی می‌شوند و جانشین‌هایشان نوشته می‌شود). 9083e952
    (نبود ترتیبات مورد تأیید هر دو طرف، تا سه‌شنبه) سمت آسوده‌تر است؛ a0c82077 (نبود
    اقدام از دسته‌ای جدید، تا چهارشنبه) ریسک فعال است - تعریف «گام بعدی» شورای عالی
    امنیت ملی در اختیار تندروهاست. نشانه‌های دوشنبه-سه‌شنبه: پاسخ رسمی آمریکا از طریق
    قطر؛ «گام بعدی» شورای عالی امنیت ملی؛ دستور حمله؛ گزارش خسارت SPA در ینبع؛ اعلام
    میزبان با محل+تاریخ (-> بررسی عمیق +60). در بازه 19:00Z-03:30Z هیچ نوبت اجرایی
    وجود ندارد: گزارش کوتاه دوشنبه نخستین بررسی گشایش یکشنبه است.'
