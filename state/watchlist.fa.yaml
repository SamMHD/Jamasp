  why_fa: 'دو رژیم: کنترل سپاه پاسداران بر عبورومرور هرمز در برابر محاصره آمریکا،
    همراه با تبادل آشکار آتش از 30-31 اوت، و جبهه دوم دریای سرخ که در 19 سپتامبر به
    ریاض رسید (موشک حوثی‌ها، رهگیری‌شده). 22 سپتامبر - مسیر گفت‌وگوها باز شد: هیئت
    عراقچی و ویتکاف/ کوشنر یک دور مذاکره با میانجی‌گری را در سازمان ملل به پایان رساندند
    (قطر و پاکستان در رفت‌وآمد دیپلماتیک)؛ ترامپ: حدود 3 ساعت، «سازنده»، دور دیگری
    «به‌زودی»، اما توافق «درست پس از انتخابات» و «نابود کردن» به‌عنوان گزینه جایگزین؛
    ویتکاف (X): غیرمستقیم، یک دور تکمیل شد، میانجی‌گری ادامه دارد؛ تلویزیون دولتی
    ایران: تهران درخواست ویتکاف را پذیرفت، «شروط سخت‌گیرانه» منتقل شد؛ NYT (2 مقام
    ایرانی): عراقچی با ویتکاف+کوشنر دیدار کرد؛ کانال 12 اسرائیل: بر سر بیشتر اختلافات
    توافقی حاصل نشده؛ منبع العربیه: «بن‌بست شکسته شد». شروط ایران (تسنیم): پایان جنگ
    در همه جبهه‌ها، جدول زمانی خروج از جنوب لبنان، وجوه مسدودشده، رفع محاصره و تحریم‌های
    جدید، معافیت نفتی - همان تفاهم‌نامه قدیمی. فارس: آمریکا «خط قرمزی باقی نگذاشته
    است»، آمادگی برای همه سناریوها. اوایل سه‌شنبه، گزارش کیودو درباره «بازگشایی هرمز
    ظرف 7 روز» توسط فارس تکذیب شد. 645cc78a ناموفق (نخستین شکست این خانواده؛ درس مربوط
    به قید قالب ثبت شد). هرمز: آخرین اصابت‌ها دوشنبه 21 سپتامبر (LR Stephanie، جزیره
    من؛ یک کشتی حمل LPG) - هیچ‌کدام مرتبط با عربستان نبودند؛ هیچ شناور جدیدی در 22-23
    سپتامبر هدف قرار نگرفت (استعلام‌شده)؛ شمار عبورهای هرمز در AIS «دو» (Investing.com،
    22 سپتامبر) در برابر بارگیری حدود 12m بشکه عربستان در یک روز و راه‌اندازی مجدد
    خط لوله شرق-غرب (به‌صورت جزئی) - جریان‌ها به خارج از پوشش AIS و مسیرهای دورزننده
    تنگه منتقل شدند. پادشاه عربستان در مجمع عمومی سازمان ملل «هدف قرار دادن مکه» توسط
    حوثی‌ها را محکوم کرد (پهپاد قبلی، رویداد جدیدی نیست)؛ فرانسه قطعنامه‌ای درباره
    هرمز در شورای امنیت را بررسی می‌کند؛ اتحادیه اروپا خواهان تجهیزات و نیرو برای
    دریای سرخ است؛ بریتانیا به عربستان پیشنهاد سوخت‌رسانی می‌دهد. تا 23 سپتامبر 03:30Z
    هیچ گزارش رسمی از ترامپ-شورای همکاری خلیج فارس در پایگاه داده وجود ندارد (استعلام‌شده،
    موجود نیست). نردبان: زیرساخت خارگ/لارک d96debd5 (تا 26 سپتامبر)؛ رژیم سمت خلیج
    فارس 2df323fa (تا 26 سپتامبر)؛ خویشتن‌داری عربستان 33defb45 (تا 27 سپتامبر)؛ اسکورت‌ها
    d4f5ffd6 (تا 27 سپتامبر)؛ شناور سعودی 9e629d6e (چهارشنبه 23:59Z بسته می‌شود، در
    مسیر تحقق)؛ 0d52e7da (نبود دیدار ترامپ-پزشکیان با تأیید هر دو طرف یا دور دوم مستقیم
    از چهارشنبه تا یکشنبه، 0.65) - به‌محض اذعان هر دو طرف به دور دوم، در مسیر عدم
    تحقق قرار می‌گیرد. نشانه‌ها: اعلام میزبانی قطر/پاکستان همراه با مکان+تاریخ (->
    فعال‌سازی بررسی عمیق)؛ دیدار ترامپ-پزشکیان با تأیید هر دو طرف؛ هرگونه دستور حمله
    آمریکا؛ گزارش‌های SPA درباره خسارت؛ متوقف شدن یک شناور تحت اسکورت همراه با تلفات
    (پله بعدی نردبان). 24 سپتامبر: چهارشنبه - دور دومی برگزار نشد؛ مقام ارشد (رویترز):
    اگر آمریکا فشار را کاهش دهد و محاصره بنادر را بردارد، هرمز می‌تواند ظرف یک هفته
    بازگشایی شود، «اختلافات بسیار»؛ رضایی: تا تحقق شروط بسته می‌ماند؛ برنت در 103.08
    (+3.9%) تسویه شد. طی شب: نقشه راه ایران (گلف نیوز، منابع منطقه‌ای، تأییدنشده از
    سوی هر دو دولت) - آتش‌بس تا 60 روز در سراسر منطقه، بازگشایی مرحله‌ای هرمز، توقف
    حملات به همسایگان عرب، جدول زمانی برای مذاکرات گسترده‌تر؛ روبیو «پذیرا»، گزینه‌های
    نظامی حفظ می‌شوند. تسنیم (مرتبط با سپاه): تماس عراقچی-ویتکاف از سوی نهادهای سیاست‌گذار
    «مجاز نشده بود»؛ وزارت خارجه: با میانجی‌گری قطر، شروط منتقل شد - اکنون اختیار
    طرف ایرانی شرط عبور است. Cape Dao (23 سپتامبر): کشتی فله‌بر بدون اسکورت تحت مدیریت
    امارات، یک دریانورد هندی کشته شد، انتسابی به آمریکا صورت نگرفت (dd31b40f تا جمعه
    فعال). 9e629d6e محقق شد (خانواده 10/10؛ جانشینی برای شناور سعودی نوشته نشد - بارگیری
    ینبع بدون پاسخ دریایی از سر گرفته شد، این رده بر اساس سوابق پابرجاست). مورد جدید
