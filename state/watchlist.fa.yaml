  why_fa: 'ین یکی از ستون‌های تقاضای ناشی از کاهش ارزش پول بود: USDJPY پس از مداخله
    ناموفق اوت در 159-160 ثابت مانده بود؛ این وضعیت در 3-8 سپتامبر شکست (160.4 ->
    153.3). 18 سپتامبر: بانک ژاپن نرخ بهره را به 1.25% افزایش داد (بالاترین سطح از
    1995)، با رأی 7-2، بدون زمان‌بندی؛ اوئدا: «مرحله سیاست‌گذاری تغییر کرده است»؛
    انتظار بازار: یک افزایش نرخ بهره در هر فصل، نرخ نهایی 1.75-2%. جریان معاملات:
    استعلام نرخ بانک ژاپن در 158.05 - خط مورد دفاع 158 است، نه 160. 23 سپتامبر: USDJPY
    برابر با 157.62 (سقف بازه 157.94)، توکیو سه‌شنبه/چهارشنبه تعطیل بود (معاملات کم‌عمق
    در هفته تعطیلات؛ طبق CFTC، صندوق‌های پوشش ریسک برای نخستین بار از ژوئیه 2025 در
    ین خالص موقعیت خرید داشتند). طلا مستقیماً هیچ اثری از ین نمی‌گیرد (بررسی عمیق
    #56: اثر ین فقط از طریق DXY به طلا می‌رسد؛ DXY در 100.65، با رشد +0.26% در 22-23
    سپتامبر، تمام حرکت شبانه طلا را توضیح می‌داد). در کنار FOMC بخوانید: یک شکاف رو
    به گسترش، با هر دو سوی آن به نفع دلار - معامله بر مبنای نرخ‌های بهره نسبی، نه
    کاهش ارزش پول؛ هیچ بانک مرکزی دیگری در این شرایط سیاست انبساطی در پیش نمی‌گیرد
    (ناگل/لین از ECB در 22 سپتامبر، اجماع برای SNB در پنج‌شنبه: حفظ نرخ). باز: be4d6b22
    (هیچ ثبت قیمتی برای USDJPY در >=160 تا پنج‌شنبه 24 سپتامبر ساعت 23:59Z نباشد،
    0.55؛ 1.5% حاشیه فاصله). نشست بعدی بانک ژاپن 30 اکتبر، دو روز پس از FOMC در 28
    اکتبر است. شرط تغییر: >=160 با عبور از سد وزارت دارایی = بازگشت ستون، مبنا 30؛
    <152 همراه با افت Nikkei+BTC = رژیم نقدینگی. 24 سپتامبر: USDJPY برابر با 157.93
    (سقف چهارشنبه 158.36 - عبور درون‌روزی از خط استعلام نرخ 158، هیچ اقدامی از سوی
    وزارت دارایی گزارش نشد)؛ برآورد اولیه PMI ژاپن در پایین‌ترین سطح چهار ماهه، همراه
    با فشار قیمتی «شدید»؛ actionforex: رشد افت می‌کند، در حالی که ین ضعیف تورم را
    بالا نگه می‌دارد. be4d6b22 پنج‌شنبه ساعت 23:59Z با ~2 ین حاشیه فاصله بسته می‌شود.
