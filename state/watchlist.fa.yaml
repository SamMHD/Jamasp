  why_fa: 'دو وضعیت: کنترل سپاه پاسداران بر عبورومرور هرمز در برابر محاصره آمریکا،
    همراه با تبادل آشکار حملات نظامی از 30-31 اوت، و جبهه دوم دریای سرخ که در 19 سپتامبر
    به ریاض رسید (موشک حوثی‌ها، رهگیری‌شده). 22 سپتامبر - مسیر گفت‌وگوها گشوده شد:
    هیئت عراقچی و ویتکاف/ کوشنر یک دور مذاکره با میانجی‌گری را در سازمان ملل به پایان
    رساندند (رفت‌وآمد میانجی‌گرانه قطر و پاکستان)؛ ترامپ: حدود 3 ساعت، «سازنده»، دور
    دیگری «به‌زودی»، اما توافق «درست بعد از انتخابات» و «نابود کردن» به‌عنوان گزینه
    جایگزین؛ ویتکاف (X): غیرمستقیم، یک دور تکمیل شد، میانجی‌گری ادامه دارد؛ تلویزیون
    دولتی ایران: تهران درخواست ویتکاف را پذیرفت، «شروط سخت‌گیرانه» منتقل شد؛ NYT (2
    مقام ایرانی): عراقچی با ویتکاف+کوشنر دیدار کرد؛ کانال 12 اسرائیل: بر سر بیشتر
    اختلاف‌ها توافقی حاصل نشد؛ منبع العربیه: «بن‌بست شکسته شد». شروط ایران (تسنیم):
    پایان جنگ در تمام جبهه‌ها، جدول زمانی خروج از جنوب لبنان، وجوه مسدودشده، رفع محاصره
    و تحریم‌های جدید، معافیت نفتی - همان تفاهم‌نامه قدیمی. فارس: آمریکا «هیچ خط قرمزی
    باقی نگذاشته است»، آمادگی برای همه سناریوها. پیش‌تر در سه‌شنبه، فارس گزارش کیودو
    درباره «بازگشایی هرمز ظرف 7 روز» را تکذیب کرد. 645cc78a ناموفق (نخستین شکست این
    خانواده؛ درس مربوط به قید قالب ثبت شد). هرمز: آخرین اصابت‌ها دوشنبه 21 سپتامبر
    (LR Stephanie، جزیره من؛ یک حامل LPG) - هیچ‌کدام مرتبط با عربستان نبودند؛ در 22-23
    سپتامبر هیچ شناور تازه‌ای هدف قرار نگرفت (بررسی شد)؛ شمار عبورهای هرمز بر اساس
    AIS «دو» بود (Investing.com، 22 سپتامبر)، در برابر بارگیری حدود 12m بشکه توسط
    عربستان در یک روز و راه‌اندازی مجدد خط لوله شرق-غرب (به‌صورت جزئی) - جریان‌ها
    به خارج از پوشش AIS و مسیرهای دورزننده تنگه منتقل شدند. پادشاه عربستان در مجمع
    عمومی سازمان ملل «هدف‌گیری مکه» توسط حوثی‌ها را محکوم کرد (همان پهپاد قبلی، رویداد
    تازه‌ای نیست)؛ فرانسه قطعنامه شورای امنیت سازمان ملل درباره هرمز را بررسی می‌کند؛
    اتحادیه اروپا به‌دنبال تجهیزات و نیرو برای دریای سرخ است؛ بریتانیا پیشنهاد سوخت‌رسانی
    به عربستان را می‌دهد. تا 23 سپتامبر ساعت 03:30Z هیچ گزارش رسمی از گفت‌وگوی ترامپ
    و شورای همکاری خلیج فارس در پایگاه داده نبود (بررسی شد، موجود نیست). نردبان: زیرساخت
    خارگ/لارک d96debd5 (تا 26 سپتامبر)؛ رژیم موردنظر در سمت کشورهای خلیج فارس 2df323fa
    (تا 26 سپتامبر)؛ خویشتن‌داری عربستان 33defb45 (تا 27 سپتامبر)؛ اسکورت‌ها d4f5ffd6
    (تا 27 سپتامبر)؛ شناور سعودی 9e629d6e (چهارشنبه ساعت 23:59Z بسته می‌شود، در مسیر
    تحقق)؛ 0d52e7da (نبود دیدار ترامپ-پزشکیان یا دور دوم مستقیم با تأیید هر دو طرف
    از چهارشنبه تا یکشنبه، 0.65) - به‌محض تأیید دور دوم از سوی هر دو طرف، در مسیر
    عدم تحقق قرار می‌گیرد. نشانه‌ها: اعلامی از میزبان قطری/پاکستانی با محل+تاریخ (->
    فعال‌سازی بررسی عمیق)؛ دیدار ترامپ-پزشکیان با تأیید هر دو طرف؛ هرگونه دستور حمله
    آمریکا؛ گزارش‌های SPA درباره خسارت؛ متوقف شدن یک شناور تحت اسکورت همراه با تلفات
    (پله بعدی نردبان). 24 سپتامبر: چهارشنبه - دور دومی برگزار نشد؛ مقام ارشد (رویترز):
    اگر آمریکا فشار را کاهش دهد و محاصره بنادر را بردارد، هرمز می‌تواند ظرف یک هفته
    بازگشایی شود، «اختلاف‌های زیاد»؛ رضایی: تا تحقق شروط بسته می‌ماند؛ برنت در 103.08
    (+3.9%) تسویه شد. در طول شب: نقشه راه ایران (گلف نیوز، منابع منطقه‌ای، تأییدنشده
    از سوی هر دو دولت) - آتش‌بس تا 60 روز در سراسر منطقه، بازگشایی مرحله‌ای هرمز،
    توقف حملات به همسایگان عرب، جدول زمانی برای گفت‌وگوهای گسترده‌تر؛ روبیو «پذیرا»،
    گزینه‌های نظامی محفوظ. تسنیم (مرتبط با سپاه پاسداران): تماس عراقچی-ویتکاف از سوی
    نهادهای سیاست‌گذار «مجاز نشده بود»؛ وزارت امور خارجه: با میانجی‌گری قطر، شروط
    منتقل شد - اکنون حدود اختیار طرف ایرانی تعیین‌کننده است. Cape Dao (23 سپتامبر):
    فله‌بر بدون اسکورت با مدیریت اماراتی، یک دریانورد هندی کشته شد، حمله به آمریکا
    نسبت داده نشده است (dd31b40f تا جمعه فعال است). 9e629d6e محقق شد (خانواده 10/10؛
    جانشینی برای شناور سعودی نوشته نشد - بارگیری ینبع بدون پاسخ دریایی از سر گرفته
    شد، این دسته بر اساس سوابق موجود پابرجاست). مورد جدید ed8c08b5 (نبود اعلام آتش‌بس
    علنی و قابل استناد از سوی آمریکا از پنج‌شنبه تا یکشنبه، 0.7). محاصره: مسیر 115
    کشتی مرتبط با ایران تغییر داده شد (گلف نیوز). فرمانده ارشد سپاه پاسداران در درگیری‌های
    جنوب‌شرق ایران کشته شد (داخلی، نه به‌دست آمریکا). 25 سپتامبر: شمارش معکوس. رضایی
    (دبیر شورای عالی امنیت ملی، به نقل از گاردین/پرس تی‌وی، گلف نیوز 00:36Z): واشنگتن
    «چهار یا پنج روز» فرصت دارد شروط ایران را «به‌طور کامل و یک‌جا» اجرا کند - تا
    زمانی که آمریکا اقدام نکند، نه هرمز بازگشایی می‌شود و نه مذاکره‌ای انجام می‌گیرد؛
    «حرف کافی است. اکنون باید عمل کنیم»؛ «گام بعدی» پس از مهلت تعیین می‌شود (حدود
    دوشنبه 28-سه‌شنبه 29 به پایان می‌رسد). مجلس طرح استیضاح عراقچی را به‌دلیل تماس‌های
    نیویورک ثبت کرد (خضریان، ثابتی) - تندروها می‌گویند اختیار هیئت، انتقال شروط از
    طریق میانجی‌ها بود، نه گفت‌وگوی مستقیم؛ یک مقام ارشد به رویترز گفته بود هیئت «اختیار
    کامل» دارد. رویترز (منابع، پنج‌شنبه 16:18Z): مذاکره‌کنندگان در حال بررسی توافقی
    مرحله‌ای هستند (هرمز بازگشایی شود، محاصره برداشته شود، دارایی‌های مسدودشده)؛ یک
    مقام ایرانی: احتمال «بسیار کم»؛ یک مقام اروپایی: فهرست ایران «بسیار طولانی» است.
    پزشکیان (NBC): خواهان احیای تفاهم‌نامه ژوئن پیش از انتخابات میان‌دوره‌ای است،
    پذیرای بازرسی‌های هسته‌ای است، توطئه علیه ترامپ را تکذیب می‌کند. روبیو: پیشرفت
    عمده‌ای نیست. ترامپ: ایران تا انتخابات میان‌دوره‌ای وقت‌کشی می‌کند. جبهه حوثی‌ها:
    شش موشک بالستیک به‌سوی طائف و ینبع رهگیری شدند (ائتلاف/المالکی)؛ حوثی‌ها مدعی
    اصابت به آرامکو-ینبع و ریاض هستند - هیچ گزارش خسارتی از SPA وجود ندارد (صرفاً
    ادعای طرف متخاصم، قاعده 12)؛ مکرون نیرو، رادار و پدافند هوایی به ینبع می‌فرستد؛
    بریتانیا با ایران مقابله می‌کند؛ 150+ کشته در نبردهای یمن بر سر ارتفاعات باب‌المندب؛
    صفوی: ممکن است جبهه‌ای در دریای سرخ/باب‌المندب گشوده شود. بحرین رهبری درخواست
    بازگشایی کامل هرمز بدون عوارض را بر عهده دارد (در جهت مخالف 2df323fa). عبورهای
    هرمز در چهارشنبه 10 مورد بود (میانگین 10 روزه حدود 17، موارد با AIS خاموش مستثنا
    هستند). حمله به Cape Dao همچنان به هیچ طرفی نسبت داده نشده است (dd31b40f جمعه
