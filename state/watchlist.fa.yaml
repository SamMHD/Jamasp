  why_fa: 'تنها مسیر صعود طلا در رژیم 15/60/25: یک رویداد نقدینگی که بخش کوتاه‌مدت
    منحنی بازده را پایین بکشد (سهام -2% همراه با افت هم‌زمان Nikkei و BTC، اوراق 2ساله
    -15bp، USDJPY <156) - طلا از مسیر اوراق 2ساله بالا می‌رود، نه از مسیر تقاضا برای
    دارایی امن. از 22 سپتامبر به‌عنوان کانال سوم نام‌گذاری شده؛ در 24 سپتامبر سطرهای
    مستقلی به آن اختصاص یافت، چون چهارشنبه نخستین ترک‌ها ظاهر شدند: S&P -0.75%، Russell
    -1.8%، افت Nasdaq با بازده 5.11% اوراق 10ساله؛ MarketWatch: محدودترین گستره مشارکت
    بازار از زمان اوج دات‌کام؛ جمع‌بندی investinglive: ادبیات «شکستن سد» درباره اوراق؛
    BTC در 84.3K (-2.6% پس از +14% در طول هفته، ورود سرمایه به ETF حدود ~$1bn/day
    - همان جریان سرمایه‌ای که در 21-22 سپتامبر از طلا پیشی گرفت)؛ USDJPY در 157.93
    در برابر خط بررسی نرخ 158 بانک ژاپن و خط 160 وزارت دارایی؛ برآورد اولیه PMI ژاپن
    در پایین‌ترین سطح چهارماهه؛ بیکاری استرالیا 4.6% (بالاترین میزان از 2021). تأیید
    می‌کند (نرخ‌های نزولی 50، پایه 20): ثبت هم‌زمان مجموعه محرک‌های بالا در یک جلسه
    معاملاتی همراه با صعود طلا. باطل می‌کند (سناریو کنار گذاشته می‌شود): دو هفته رکوردزنی
    سهام با بازده اوراق 2ساله >=4.85 و طلای بدون تغییر؛ یا ترک ظاهر شود و طلا همراه
    با همه‌چیز سقوط کند (رژیم مارجین‌کال - برداشت kinetic-transmission-inverted برنده
    می‌شود). 25 سپتامبر: نخستین داده در این مسیر - investinglive/Reuters: بازده اوراق
    10ساله در 5.2 «در حال آزمودن میزان تحمل بازار سهام است» و با نزدیک بودن Nasdaq
    به رکوردها، بر ارزش‌گذاری‌های هوش مصنوعی فشار می‌آورد. پنجشنبه: S&P -0.02% با
    Meta +4.5% که «بازندگان را پنهان می‌کند» (Arm -7.9%)، Dow -0.31%، Russell -0.11%،
    افت اروپا به میزان 0.2-0.9%؛ Nikkei در جمعه به لطف سهام تراشه‌سازان +1.2%؛ BTC
    بدون تغییر در 84.3K (بازگشت دیرهنگام سهام را دنبال نکرد). سیگنال رکود Oxford Economics
    در حال هشدار دادن است، درحالی‌که مخارج همچنان پابرجاست. مجموعه محرک‌ها ثبت نشد
    (نیازمند سهام -2% همراه با افت Nikkei و BTC، اوراق 2ساله -15bp، USDJPY <156 است).
    چهارشنبه 30 سپتامبر، پایان فصل، نقطه تنش خود تقویم است. 26 سپتامبر: ترکی رخ نداد
    - S&P +0.5% و Nasdaq در رکوردی تازه، به پشتوانه امیدها درباره ایران و «عقب‌نشینی
    از اوج‌های +5.20% بازده اوراق 10ساله»؛ کاهش اندازه ناخالص موقعیت‌ها (Meta و Intel
    فروخته شدند؛ عقب‌مانده‌ها خریده شدند)، نه تغییر دیدگاه؛ BTC در 84.0K برای سومین
    روز بدون تغییر (صعود سهام را دنبال نکرد - جریان سرمایه‌ای که در 21-22 سپتامبر
    BTC را از طلا جلو انداخت، متوقف شده است)؛ USDJPY در 157.19 تحت تأثیر مداخله کلامی؛
    UMich در 48.1. مجموعه محرک‌ها ثبت نشد. چهارشنبه 30 سپتامبر، پایان فصل، با PCE
    + بازنگری‌ها در 12:30Z، پنجره زمانی موردنظر است؛ بازده اوراق 30ساله در 5.49-5.53
    منشأ فشار است. شمارش معکوس ابطال: دو هفته رکوردزنی سهام با بازده اوراق 2ساله >=4.85
    و طلای بدون تغییر = کنار گذاشتن سناریو (هفته اول از دو هفته تمام شده، اما بازده
    اوراق 2ساله همین حالا در 4.86 بسته شد). 29 سپتامبر: نزدیک‌ترین ثبت تاکنون به مجموعه
    محرک‌ها، و همچنان نه خود آن - دوشنبه 28 سپتامبر بازده اوراق 10ساله در 5.242 بسته
    شد (بالاترین سطح از ژوئن 2007، و 5.27 در طول روز) و اوراق 30ساله در 5.562 (بالاترین
    سطح از 2004)، در پی ضعیف‌ترین نسبت تقاضا به عرضه در حراج اوراق 7ساله طی یک سال،
    با نقش‌آفرینی بازده‌های واقعی، نه نرخ‌های تورم سربه‌سر (Aberdeen)؛ GVZ با +10.7%
    به 24.8 رسید، نقره الگوی پرچم نزولی خود را شکست و به 61.4 رسید، طلا در پی این
    آشفتگی -3.3% تا 4156 افت کرد (-$164 در بازار نقدی)، S&P -0.8%، Nikkei روز سه‌شنبه
    تحت تأثیر نفت و بازده‌ها افت کرد - اما BTC فقط -0.75%، بازده اوراق 2ساله 6.4bp
    افزایش یافت (4.924) و USDJPY در 157.3 بود: نیمه مربوط به ریزش اوراق، بدون نیمه
    مربوط به سهام/BTC/بخش کوتاه‌مدت منحنی بازده. برداشت: بخش بلندمدت منحنی بازده اکنون
    تعیین‌کننده قیمت طلاست (عرضه + بازده‌های واقعی)، و اوراق 2ساله یک مسافر است. شمارش
    معکوس ابطال از نو آغاز شد: سناریو تا چهارشنبه پایان فصل فعال می‌ماند (PCE + بازنگری‌ها
    در 12:30Z، سررسید قرارداد نوامبر Brent، تعطیلی بازارهای چین از پنجشنبه). مجموعه
    محرک‌ها بدون تغییر: سهام -2% همراه با افت هم‌زمان Nikkei و BTC، اوراق 2ساله -15bp،
    USDJPY <156 -> نرخ‌های نزولی 50، پایه 20. 30 سپتامبر: ترکی رخ نداد - S&P -0.17%،
    BTC +0.5%، اوراق 2ساله -3.5bp، USDJPY در 156.5 (جریان‌های پایان نیم‌سال؛ نشانگر
    <156 به اندازه 50 پیپ فاصله دارد، اما به‌تنهایی)؛ بازده اوراق 30ساله در 5.594
    بسته شد (بالاترین سطح از 2002) و در آسیا 3bp کاهش یافت؛ GVZ در 24.4 (-1.9%). جلسه
    معاملاتی پایان فصل امروز با PCE + بازنگری‌ها در 12:30Z: همان پنجره زمانی. شمارش
    معکوس ابطال: هفته اول از دو هفته (رکوردزنی سهام با بازده اوراق 2ساله >=4.85 و
    طلای بدون تغییر) همچنان باز است؛ بازده اوراق 2ساله 4.89 است و طلا بدون تغییر نیست.'
