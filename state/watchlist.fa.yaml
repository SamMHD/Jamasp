  why_fa: 'بازده‌های واقعی محرک غالب طلا هستند، و این فدرال رزرو همین حالا نرخ بهره
    را افزایش داد: 16 سپتامبر +25bp به 3.75-4.00%، با رأی 12-0، بدون جمله‌ای درباره
    مسیر آتی؛ نمودار نقطه‌ای یک افزایش دیگر در 2026 را نشان می‌دهد (میانه 4.1؛ 16
    نفر از 18 نفر >=1 افزایش دیگر را پیش‌بینی می‌کنند)، 2027 برابر با 4.1، بلندمدت
    3.2؛ PCE برابر با 3.7 / هسته 3.4، بیکاری 4.1. وارش: «محدودکننده نیست»، عبارت «مقداری
    تسهیل» را حذف کرد، «تورم بیش از حد بالاست». قیمت‌گذاری (گزارش هفتگی actionforex
    مورخ 19 سپتامبر، CME): احتمال افزایش نرخ بهره در 28 اکتبر از 44.0% پیش از FOMC
    -> به 57.6% پس از آن؛ مقصد نهایی تقریباً تغییری نکرد - بازه دارای بیشترین احتمال
    برای دسامبر 2027 برابر با 4.50-4.75 (30.4 -> 31.0%)، میانگین نرخ سیاستی مورد انتظار
    طی ~24 ماه، پیش و پس از نشست ~4.50% (نقطه میانی دسامبر 27 با وزن‌دهی احتمالاتی
    ~4.64). منحنی بازده در هفته FOMC: 2ساله +12.6bp به 4.756، 10ساله +3.1، 30ساله
    -2.9 - «بازقیمت‌گذاری سیاست پولی متمرکز بر کوتاه‌مدت»؛ بازده 2ساله با RSI روزانه
    >75، حدود ~26bp بالاتر از میانگین مسیر مورد انتظار قرار دارد: بخش کوتاه‌مدت منحنی
    از قراردادهای آتی که لنگر آن هستند جلو افتاده است. نقاط بررسی: بازده 2ساله 4.791-4.800
    (پس‌زده‌شدن از این محدوده و سپس <4.600 = بازگشت به‌سوی مسیر؛ شکست به بالا = هدف
    برآوردی 5.055، و برای تأیید، قراردادهای آتی باید مقصد نهایی را بالاتر ببرند)؛
    سوگیری DXY بالای 100.02 صعودی است، سطح 61.8% در 100.58 جلوی رشد را گرفت، شکست
    -> 101.80. نخستین سخنران پس از دوره سکوت در 18 سپتامبر: اشمید (KC، فاقد حق رأی)
    از افزایش نرخ بهره حمایت کرد، تورم «در روندی بالاتر از 3%» است، «فقط به انرژی
    مربوط نیست» - هیچ موضعی درباره اکتبر اعلام نکرد، عضو هیئت‌مدیره هم نیست، بنابراین
    شرط تغییر سناریو (تأیید افزایش نرخ بهره در اکتبر توسط یک عضو هیئت‌مدیره -> سناریوی
    نزولی ناشی از نرخ بهره 60) فعال نشده است. معاملات 18 سپتامبر: طلا +0.96% هم‌زمان
    با افزایش +6.6bp بازده 2ساله، DXY بدون تغییر - اکنون برداشت سومی هم مطرح است:
    طلا بر مبنای مقصد نهایی (بدون تغییر) معامله می‌شود، نه سرعت حرکت، بنابراین جهش
    بیش از حد بازده 2ساله لزوماً نباید به فروش طلا منجر شود. 1889819a (0.7، تا 22
    سپتامبر) در جلسه 1 رشد هم‌زمان هر دو قرار دارد - تکرار در دوشنبه = عدم تحقق ->
    سناریوی پایه 30 / سناریوی نزولی ناشی از نرخ بهره 40 (سناریوی پایه فقط در صورتی
    که بازده 30ساله هم افزایش یابد). سخنرانان فدرال رزرو در خوراک ff_calendar زیر
    رده اثرگذاری کم قرار دارند و در `jamasp calendar` پنهان هستند (todo-188): گولزبی
    دوشنبه 21 سپتامبر 10:30Z؛ ویلیامز، هامک، پالسن پنج‌شنبه 24 سپتامبر — ناقضان rule-19.
    نقاط تصمیم بعدی: رشد هم‌زمان هر دو در دوشنبه؛ بازده 2ساله در 4.80 (با تأیید قراردادهای
    آتی یا پس‌زده‌شدن)؛ نخستین حضور یک عضو هیئت‌مدیره؛ شاخص قیمت مصرف‌کننده (CPI)
    سپتامبر در اواسط اکتبر؛ FOMC در 28 اکتبر.'
