- theme: central-bank-gold-buying
  why_fa: 'کف ساختاری تقاضا: ~289t تقاضای بخش رسمی در این چرخه، همراه با ازسرگیری
    ورود سرمایه به ETF در کنار آن، و تنوع‌بخشی به ذخایر با خروج از اوراق خزانه به‌عنوان
    همتای آن در سمت جریان‌ها (دارایی‌های UST چین در پایین‌ترین سطح از 2008؛ ذخایر
    چین در اوت دوباره افزایش یافت؛ UBS در 9 سپتامبر پیش‌بینی بلندمدت خود را حفظ می‌کند؛
    گلدمن در 18 سپتامبر هدف $5,400 را با وجود افزایش نرخ بهره حفظ می‌کند). واکنش انتقال
    محل نگهداری در حال گسترش است (انتقال 86t از سوی DNB به لندن، و پیش‌تر فرانسه؛
    18 سپتامبر، ونزوئلا در حال بررسی انتقال $4bn از لندن -> آمریکا است - نگهداری،
    نه تقاضا). 21 سپتامبر: PBOC نرخ مرجع یوان را در قوی‌ترین سطح از فوریه 2023 تعیین
    کرد - در حاشیه، قیمت طلا برحسب CNY ارزان‌تر می‌شود (SGE برابر با 927.61/g، در
    16 سپتامبر). عامل مخالف: روسیه فروشنده‌ای مستمر است. کف: 4300 GC (~4255 نقدی)
    - آزمون‌ها در 14 سپتامبر 4305.9، در 15 سپتامبر 4304.0، در 16 سپتامبر تیک 22:19Z
    برابر با 4296.7، سپس بازگشت به 4424.9 در جمعه 18 سپتامبر. حفظ کف‌ها در این رژیم
    8/8 بوده است، اما هر جهش با عقب‌نشینی نفت از اوج‌هایش یا جلسه‌ای با کاهش بازده‌ها
    همراه بوده؛ هنوز افت قیمت دقیقاً روی این خط در روز صعود نفت با خرید مواجه نشده
    است. آزمون نهم در جریان است: d571e0f0 (عدم ثبت GC_CLOSE <=4326.5 در دوشنبه/سه‌شنبه،
    0.55) - کف بازگشایی 4397.8، میانگین متحرک 50روزه اکنون 4332.4 است. تأییدکننده‌ها:
    گزارش‌های ماهانه WGC حاکی از خرید خالص در طول افت؛ خرید در افت قیمت در محدوده
    4300-4332 در روز صعود نفت. ابطال‌کننده‌ها: دو ماه متوالی فروش خالص بخش رسمی.'
