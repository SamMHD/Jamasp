  why_fa: 'کانال سوم (قاعده 6) برای «انتشار داده داغ -> افت طلا»: ریسک‌گریزی در سهام/اعتبار
    که تقاضا برای اوراق خزانه را بالا می‌برد و بازده‌ها را در روز انتشار داده تورم
    پایین می‌کشد. 14 اکتبر: نزدک -1.9% (بدترین عملکرد از 23 ژوئیه) به‌دلیل تأمین مالی
    هوش مصنوعی - اوراق CoreWeave در سطوح بحران‌زده (~15%)، افزایش فاصله CDS اوراکل،
    مارکت‌واچ: «با لرزاندن سهام فناوریِ بیش‌ازحد داغ‌شده توسط ترس از تورم، معاملات
    هوش مصنوعی در حال ازهم‌گسیختن است» - و بازده‌های 10y/30y در روز انتشار شاخص قیمت
    مصرف‌کننده (CPI) داغ، پایین‌تر بسته شدند (10y برابر 5.19 با -2.7، 30y برابر 5.524
    با -3.9 نسبت به اوج چرخه‌ای 5.62). 15 اکتبر، آسیا: نیکی -3.5%، کوسپی ~-8% (معاملات
    کوسداک 20 دقیقه متوقف شد)، BTC زیر 81K؛ بازده 10y به‌اندازه 21bp پایین‌تر از اوج
    پس از شاخص قیمت مصرف‌کننده (CPI)، بازده 2y برابر -8.5bp، طلا +1.5% نسبت به قیمت
    تسویه. دو جلسه؛ این موضع آن را ورودیِ هر جلسه برای 2y تلقی می‌کند، نه یک عامل
    پایدار (قاعده 11: سه جلسه با محرک >=1 ATR). نشانه تبدیل‌شدن به عامل پایدار: بازده‌ها
    پایین و طلا بالا در روزی بدون هیچ ورودی از درگیری نظامی یا فدرال رزرو، به‌صورت
    تکرارشونده؛ عوامل نقض: داده داغی که باعث فروش اوراق انتهای بلندمدت منحنی شود (الگوی
    11 سپتامبر)، یا روز ریسک‌گریزی که در آن طلا برای تأمین وجه تضمین فروخته شود (الگوی
    28 سپتامبر). همچنین حاوی داده‌ای درباره تقاضای اوراق خزانه است: بلومبرگ «چین دارایی‌های
    اوراق خزانه آمریکا را از مسیر کانادا هدایت می‌کند» (دارایی‌های کانادایی ~$600bn،
    تأییدنشده) - تقاضا برای اوراق، نه تقاضای طلا برای تنوع‌بخشی به ذخایر. 16 اکتبر
    (گزارش کوتاه جمعه): جلسه سوم - در جلسه آمریکا، با وجود داغ‌ترین شاخص قیمت تولیدکننده
    (PPI) ثبت‌شده، اوراق خزانه خریداری شد؛ جمع‌بندی، کانال را نام می‌برد («ترس از
    فروپاشی اعتباری در شرکت‌های هوش مصنوعی مانند CoreWeave، با توجه به مشکلات بدهی
    آن»؛ شایعه فروپاشی یک صندوق هوش مصنوعی ~$40bn - Nebius/Bloom/Lumentum/CoreWeave
    - سپس خرید در افت شتاب گرفت، S&P برابر +0.4%؛ بازتاب سقوط کره ادامه یافت؛ Dell
    در دو روز -17%). بازده 2y برابر 4.751 (-5.1)، بازده 10y برابر 5.087 (-10)، DXY
    برابر -0.5%، قیمت تسویه طلا +1.5%. به‌عنوان عامل پایدار در پایه ثبت شد (پایه 30
    -> 35)، با دو ملاحظه: شاخص برگشت، درحالی‌که بازده‌ها پایین ماندند (کانال، اعتبار
    است، نه روند معاملات سهام)، و بخش آسیایی پنجشنبه ورودی‌هایی از فدرال رزرو (دالی)
    و درگیری نظامی (گزارش‌های سپاه پاسداران) داشت - جلسه سومِ خالص نبود. ابطال: روز
    ریسک‌گریزی که در آن طلا فروخته شود (الگوی 28 سپتامبر) یا هراس اعتباری همراه با
    افزایش بازده‌ها -> پایه 30. نفت -> 2y در آن روز مغلوب این کانال شد (برنت بدون
    تغییر، WTI برابر +2.50 در پی کاهش 8.6M موجودی، 2y برابر -5). 17 اکتبر (گزارش کوتاه
    شنبه): از نظر ماهوی، جلسه چهارم - جمعه نزدک -2.3% / S&P برابر -1.1% (شایعه «فروپاشی
    صندوق هوش مصنوعی» ادامه یافت و گسترش پیدا کرد؛ CoreWeave درگیر صحبت‌های مبادله
    سهام با بدهی؛ SOX به‌مدت -8 روز؛ بدترین هفته نزدک 100 از آوریل 2025)، بازده 2y
    با وجود قیمت‌های داغ واردات -3.6bp، DXY برابر -0.27% («همبستگی میان سرمایه‌گذاری
    هوش مصنوعی و دلار» - NZD در روز افت -2% نزدک پیشتاز بود)، GC در محدوده تسویه +16.6.
    اما ردیف +4.7 بود (0.3 داخل محدوده نویز 5 امتیازی) و طلای نقدی بدون تغییر بسته
    شد، زیرا نفت در آن جلسه +4% داشت - جلسه چهارم طبق معیار لفظی تأیید نشد و ورودی
    درگیری نظامی نیز داشت. پایه 35 حفظ شود، عامل برقرار است، تقویت نشده است. بازده
    30y با موج خرید همراه نشد (بدون تغییر) - تقاضای ناشی از اعتبار، تقاضا در ابتدای
    منحنی است؛ آزمون انتهای بلندمدت منحنی، حراج 20y در چهارشنبه 21 اکتبر است. شرط
    ابطال بدون تغییر: روز ریسک‌گریزی که در آن طلا فروخته شود، یا افزایش بازده‌ها در
    پی هراس اعتباری -> پایه 30. نفت -> 2y برای دومین روز مغلوب این کانال شد (برنت
    110، بازده 2y برابر -3.6). گزارش کوتاه دوشنبه 19 اکتبر: روایت بازگشایی - fxempire
    تقاضای طلا در آسیا را به «نیازهای تأمین مالی هوش مصنوعی و ریسک کشتیرانی که سرمایه‌گذاران
    را به‌سوی اوراق می‌راند» نسبت می‌دهد؛ investinglive: فقط ~1/3 از پروژه‌های مراکز
    داده در دست اجرای آمریکا قابل‌اتکا هستند؛ مایکروسافت از Nscale خارج می‌شود. معاملات:
    خرید اوراق، بازده 10y برابر -1.9 / بازده 30y برابر -2.6، بازده 2y بدون تغییر (+0.4
    در 4.719)، طلا در ردیف +13.4 - جلسه‌ای قابل‌شمارش نیست (2y <2bp، قاعده 11)؛ عامل
    در چهار جلسه باقی می‌ماند. جلسه پنجم مستلزم افزایش ردیف دوشنبه به‌اندازه >=5 نسبت
    به 4181.1 همراه با کاهش بازده 2y به‌اندازه >=2 نسبت به 4.715 است (گزارش کوتاه
    سه‌شنبه آن را بررسی می‌کند). گزارش کوتاه سه‌شنبه 20 اکتبر: دوشنبه تصویر معکوس
    این عامل بود - معاملات هوش مصنوعی احیا شد (نزدک پیشتاز، آمازون +5%، حافظه/تراشه‌ها
    صعودی؛ CoreWeave به‌دلیل نگرانی‌های بدهی پایین‌تر؛ UBS: فروش گسترده نئوکلاد رونق
    را از مسیر خارج نمی‌کند)، اوراق خزانه فروخته شد (2y برابر +4.6، 10y برابر +5.5)،
    طلا -21/-38. با سازوکار سازگار است، اما جلسه پنجم نیست (نیازمند کاهش 2y به‌اندازه
    >=2 + افزایش ردیف به‌اندازه >=5 است). شرط ابطال محقق نشد: روز ریسک‌گریزی که در
    آن طلا فروخته شده باشد نبود؛ مطلب مارکت‌واچ درباره واگرایی اوراق بنجل یک ستون
    تحلیلی است، نه هراس. اوراق 30y همراه با همه‌چیز فروخته شد - آزمون انتهای بلندمدت
    منحنی همچنان حراج 20y چهارشنبه است. گزارش کوتاه چهارشنبه 21 اکتبر: سه‌شنبه بی‌تحرک
    بود - جلسه‌ای برای این عامل نبود (بازده 2y به‌اندازه 2.6 بالا رفت؛ نزدک بدون تغییر
    در برابر راسل +1.8%، داو +1.0%)؛ شرط ابطال محقق نشده است (نه روز ریسک‌گریزی همراه
    با فروش طلا، نه هراس اعتباری همراه با افزایش بازده‌ها). ورودی‌ها پررنگ‌تر: گریفین
    «تقریباً به‌طور قطع» حباب است؛ NEXTDC برابر -44% (تأخیرهای شبکه برق، توقف توسعه)؛
    شکست عرضه اولیه Firmus، با حضور انویدیا در مذاکرات برای پشتیبانی؛ عملکرد SpaceX
    فراتر از انتظار با مخارج سرمایه‌ای 19.6bn در برابر 6.9bn؛ نتفلیکس -6% به‌دلیل
    پیش‌بینی عملکرد. متا چهارشنبه پس از بسته‌شدن بازار آمریکا گزارش می‌دهد (UBS: سلامت،
    درآمدزایی، بازده مخارج سرمایه‌ای) - ورودی بعدی پس از حراج 20y. عامل در چهار جلسه
    باقی می‌ماند؛ جلسه پنجم مستلزم کاهش 2y به‌اندازه >=2 + افزایش قیمت تسویه به‌اندازه
    >=5 نسبت به 4142.6 است (گزارش کوتاه پنجشنبه آن را بررسی می‌کند). گزارش کوتاه پنجشنبه
    22 اکتبر: چهارشنبه طبق معیار لفظی نه جلسه این عامل بود و نه تصویر معکوس آن - ریسک‌پذیری
    (نزدک +1.05%، SMCI به‌دلیل ارتقای چشم‌انداز +9.6%، Dell/Vertiv/GE Vernova برابر
    +4-5%، Datadog/CrowdStrike/Palantir صعودی؛ راسل +0.16%) همراه با افزایش 2y به‌اندازه
    3.6 و افزایش طلا به‌اندازه 7.4 در قیمت تسویه. متا: فراتر از انتظار با حذف هزینه
    حقوقی 9.9bn (EPS برابر 7.40 در برابر 6.67؛ درآمد 64.6bn در برابر 63.3bn)، دامنه
    مخارج سرمایه‌ای به 135-145bn محدود شد، پیش‌بینی Q4 برابر 73-76bn، +4% پس از ساعات
    معاملات -> +2%؛ IBM/LRCX/TXN/SAP فراتر از انتظار؛ نتفلیکس -5.3%. ریدر: «فرصتی
    تاریخی در اوراق با کیفیت اعتباری بالا، از جمله شرکت‌های ارائه‌دهنده خدمات ابری
    بسیار بزرگ» - بازار اعتبار با تقاضای خرید روبه‌روست، تحت فشار نیست. سه جلسه پیاپی
    خارج از این عامل (دوشنبه معکوس، سه‌شنبه بی‌تحرک، چهارشنبه افزایش هر دو) -> عامل
    غیرفعال است (قاعده 11: دو جلسه با محرک بدون تغییر در پنج جلسه، جایگاه را تنزل
    می‌دهد)، باطل نشده است (نه روز ریسک‌گریزی همراه با فروش طلا؛ نه هراس اعتباری همراه
    با افزایش بازده‌ها). در جلسه پنجم دوباره فعال می‌شود: کاهش 2y به‌اندازه >=2 +
    افزایش قیمت تسویه به‌اندازه >=5 نسبت به 4150.0 با ورودی اعتباری. گزارش کوتاه جمعه
    23 اکتبر: پنجشنبه ابطال رخ داد - روز ریسک‌گریزی که در آن طلا فروخته شد (الگوی
    28 سپتامبر). محرک‌ها (استخراج‌شده): پرونده ثبت طبقه جدید سهام متا («صدها میلیارد»
    سرمایه سهامی، احتمالاً همین پاییز؛ -7.5%)، پیش‌بینی ضعیف Lam (-11.8%)، کاهش رتبه
    CoreWeave (-10%، بدهی بدون وثیقه ~15%)، سه عرضه سهام متوقف‌شده در حوزه هوش مصنوعی
    (Firmus به ارزش ~5bn لغو شد، Airtrunk به H1 2027 موکول شد، SK hynix/Solidigm کنار
    گذاشته شد)؛ SOX برابر -6.7%، نزدک -2.6% (بدترین عملکرد از 5 ژوئن)، NDX برابر -2.9%،
    هر دو زیر 100DMA؛ داو بدون تغییر، راسل +0.1% - چرخش سرمایه. برداشت بازار درآمد
    ثابت: ظرفیت اوراق هوش مصنوعی تمام شده، جذب سرمایه به سهام منتقل می‌شود، عرضه بدهی
    کمتر، رشد بازنگری شده است - بازده 2y برابر -18.8، بازده 5y برابر -19.2، بازده
    10y برابر -19.3، بازده 30y برابر -15.0؛ ین دارایی امن، DXY برابر -0.17. طلا -2.2%
    / -2.5% (تسویه / ردیف)، نقره -5.9%، BTC برابر -3.3%: تقاضای خرید این عامل به‌سوی
    اوراق خزانه و ین رفت و میز معاملات طلا برای تأمین نقدینگی فروخت. عامل در بررسی
    19:00Z باطل شد (پایه 30 -> 25، نرخ‌ها 35 -> 40)؛ در پنجمین جلسه خالص دوباره فعال
    می‌شود (کاهش 2y به‌اندازه >=2 + افزایش قیمت تسویه به‌اندازه >=5 نسبت به 4060.4
    با ورودی اعتباری). نشانه روز جمعه، بازگشایی بازار سهام است.'
