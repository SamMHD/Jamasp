    -> مؤلفه غیرفعال است (قاعده 11: دو جلسه با محرک بدون تغییر در پنج جلسه موجب تنزل
    می‌شود)، نه باطل‌شده (نه روز ریسک‌گریزی همراه با فروش طلا؛ نه نگرانی اعتباری همراه
    با افزایش بازده‌ها). در جلسه پنجم دوباره فعال می‌شود: کاهش 2y به میزان >=2 + افزایش
    قیمت تسویه به میزان >=5 نسبت به 4150.0 بر اثر یک ورودی اعتباری. گزارش کوتاه جمعه
    23 اکتبر: پنجشنبه ابطال رخ داد - روز ریسک‌گریزی که در آن طلا فروخته شد (الگوی
    28 سپتامبر). محرک‌ها (استخراج‌شده): ثبت درخواست Meta برای طبقه جدید سهام («صدها
    میلیارد» سرمایه سهامی، احتمالاً همین پاییز؛ -7.5%)، پیش‌بینی ضعیف Lam (-11.8%)،
    تنزل رتبه CoreWeave (-10%، بدهی بدون وثیقه ~15%)، سه عرضه سهام متوقف‌شده هوش مصنوعی
    (عرضه Firmus به ارزش ~5bn لغو شد، Airtrunk به H1 2027 موکول شد، SK hynix/Solidigm
    کنار گذاشته شد)؛ SOX با -6.7%، Nasdaq با -2.6% (بدترین عملکرد از 5 ژوئن)، NDX
    با -2.9%، هر دو زیر میانگین متحرک 100 روزه؛ Dow بدون تغییر، Russell با +0.1% -
    چرخش سرمایه. برداشت بازار درآمد ثابت: ظرفیت جذب اوراق هوش مصنوعی تمام شده، تأمین
    سرمایه به سمت سهام می‌رود، عرضه بدهی کمتر، رشد بازنگری می‌شود - 2y با -18.8، 5y
    با -19.2، 10y با -19.3، 30y با -15.0؛ ین دارایی امن بود، DXY با -0.17. طلا -2.2%
    / -2.5% (قیمت تسویه / ردیف داده)، نقره -5.9%، BTC با -3.3%: تقاضای خرید این مؤلفه
    به اوراق خزانه و ین رفت و میز معاملات طلا برای تأمین نقدینگی فروخت. مؤلفه در بررسی
    19:00Z باطل شد (پایه 30 -> 25، نرخ‌ها 35 -> 40)؛ در پنجمین جلسه خالص دوباره فعال
    می‌شود (کاهش 2y به میزان >=2 + افزایش قیمت تسویه به میزان >=5 نسبت به 4060.4 بر
    اثر یک ورودی اعتباری). نشانه جمعه، بازگشایی بازار سهام است. گزارش کوتاه شنبه 24
    اکتبر: جمعه جلسه‌ای برای این مؤلفه نبود - معاملات سهام در مجموع بدون تغییر ماند
    (Nasdaq با -0.21%، NDX بدون تغییر، S&P با -0.52%، Dow با -1.24% تحت تأثیر بخش‌های
    مصرفی/مالی؛ Russell در هفته +2%؛ تقاضای خرید سهام امنیت سایبری، Nvidia با -0.6%،
    Meta با -1% پیش از راه‌اندازی طبقه سهام)، درحالی‌که بازده‌ها تحت تأثیر نفت افزایش
    یافتند - زنجیره انتقال، نه اعتبار. مؤلفه همچنان باطل است؛ با کاهش 2y به میزان
    >=2 + افزایش قیمت تسویه به میزان >=5 نسبت به 4010.0 بر اثر یک ورودی اعتباری دوباره
    فعال می‌شود. ورودی‌های بعدی: MSFT/GOOGL چهارشنبه پس از بسته‌شدن بازار، AMZN پنجشنبه؛
    حلقه بعدی انتقال: «پول از کجا خواهد آمد» (سهام، نه بدهی).'
