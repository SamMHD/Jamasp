- theme: middle-east-risk-premium
  why_fa: 'دو وضعیت: کنترل سپاه پاسداران بر عبور و مرور از هرمز در برابر محاصره آمریکا،
    همراه با تبادل آشکار آتش از 30-31 اوت، و جبهه دوم دریای سرخ که در 19 سپتامبر به
    ریاض رسید - طبق اظهارات ثبت‌شده (ائتلاف به رهبری عربستان، آسوشیتدپرس به نقل از
    گلف نیوز): یک موشک بالستیک حوثی‌ها به سوی پایتخت، رهگیری‌شده؛ حملات به ینبع/طائف/بیش/فرسان
    «خنثی شدند»؛ بدون تلفات یا خسارت؛ انتساب به حوثی‌ها، نه ایران؛ ادعای حوثی‌ها درباره
    «آتش‌سوزی‌های آرامکو در ینبع» تأیید نشده است (قاعده 12). واشنگتن 20-21 سپتامبر
    (نیویورک تایمز به نقل از investinglive): ترامپ پس از تماس با محمد بن سلمان به
    پنتاگون گفت برای حمله به حوثی‌ها آماده شود، سپس تا ظهر یکشنبه عقب نشست - «فعلاً
    هیچ حمله هوایی آمریکا انجام نمی‌شود»؛ دستور همچنان معطوف به ایران/هرمز است؛ ~200
    نیروی آمریکایی در عربستان، غیررزمی؛ مقام‌ها تردید دارند که یک کارزار محدود مؤثر
    باشد و انتظار دارند حوثی‌ها در صورت آغاز آن به کشتی‌های آمریکایی شلیک کنند. درباره
    ایران: «در مرحله تصمیم‌گیری» (حملات / فشار / توافق)، «ممکن است به‌زودی اتفاقات
    بسیار بزرگی رخ دهد»، «احتمالاً مایل» به دیدار با پزشکیان در مجمع عمومی سازمان
    ملل؛ سفارت مجازی: آمریکایی‌ها ایران را ترک کنند؛ سنتکام در حال تشدید محاصره (>100
    شناور تغییر مسیر داده‌اند)، محموله‌های عبوری از هرمز در پی پاک‌سازی مین‌ها در
    بالاترین سطح شش‌ماهه. دیپلماسی طبق اظهارات ثبت‌شده: الانصاریِ قطر (20 سپتامبر)
    - قطر هفته‌هاست با هر دو طرف تبادل نظر می‌کند، «ایالات متحده خواهان توافق است»،
    اهداف «بازگشایی تنگه، توقف جنگ»؛ عراقچی دوحه -> نیویورک؛ پزشکیان در مجمع عمومی
    سازمان ملل شرکت می‌کند (مهر)؛ ترکیه در حال تدوین پیشنهادها؛ هفت شرط ایران از طریق
    قطر (رضایی 19 سپتامبر) همچنان یک‌طرفه است؛ تولید ناخالص داخلی ایران در Q1 برابر
    با -10.1% نسبت به سال قبل. طرف عربستانی: 760 حمله هوایی به یمن (سخنگوی ائتلاف
    به نقل از مهر)؛ صادرات >4 میلیون بشکه در روز در سپتامبر در برابر 2.4 در اوت (رویترز).
    نردبان: زیرساخت‌های خارک/لارک d96debd5 (تا 26 سپتامبر، بدون موردی از 20 سپتامبر)؛
    وضعیت سمت خلیج فارس 2df323fa (تا 26 سپتامبر، بدون تأیید)؛ خویشتن‌داری عربستان
    e0e5cd9c محقق شد -> 33defb45 (تا 27 سپتامبر)؛ اسکورت‌ها a0429ae4 محقق شد -> d4f5ffd6
    (تا 27 سپتامبر)؛ بدنه کشتی عربستانی 9e629d6e (23 سپتامبر)؛ 645cc78a (بدون مذاکراتی
    که هر دو طرف تأیید کرده باشند، تا 22 سپتامبر 23:59Z) در معرض خطر در صورت تأیید
    دیدار ترامپ-پزشکیان از سوی هر دو طرف. نشانه‌ها: ترامپ-شورای همکاری خلیج فارس سه‌شنبه
    (بدون زمان تعیین‌شده)؛ دیداری با پزشکیان که هر دو طرف تأیید کنند؛ هرگونه دستور
    حمله آمریکا؛ گزارش‌های خبرگزاری عربستان درباره خسارت؛ انتساب حملات از سوی عربستان
    به عاملی فراتر از حوثی‌ها؛ اعزام نیروهای ترکیه/پاکستان؛ نام‌های UKMTO؛ تاریخی
    برای صلاله عمان.'
