- theme: energy-pce-passthrough
  why_fa: 'پل میان جنگ و فدرال رزرو: انتقال نفت به شاخص قیمت مصرف‌کننده (CPI)، کانال
    فعالِ احتمال افزایش نرخ بهره است، و نفت در روزهای بدون رویداد فدرال رزرو تعیین‌کننده
    قیمت طلاست — اکنون در هر دو جهت. قیمت تسویه 15 سپتامبر: WTI برابر با 105.83 /
    Brent برابر با 108.75 (سقف 109.97)؛ از آن زمان پنج جلسه نزولی: در 21 سپتامبر Brent
    نوامبر در 100.34 تسویه شد (-3.4%؛ در هر دو سوی 100 معامله شد، نمای لحظه‌ای جمع‌بندی
    100.05)، WTI اکتبر 95.78 (-4.9%؛ سررسید آن سه‌شنبه 22 سپتامبر است — نوامبر به
    قرارداد سررسید نزدیک تبدیل می‌شود)، در پی اظهارنظر ترامپ مبنی بر اینکه «ممکن است
    با پزشکیان دیدار کند»، توقف اقدامات حوثی‌ها، صادرات عربستان >4 میلیون بشکه در
    روز، جریان‌های حمل‌ونقل با اسکورت/با AIS خاموش و شمارش نفتکش‌های Kpler — با وجود
    اصابت به دو نفتکش در هرمز در همان روز؛ در 22 سپتامبر ساعت 03:30Z، Brent برابر
    با 101.35 (+1.0%) و WTI برابر با 96.65 بود. سطوح fxempire: حمایت Brent در 97-97.5
    و سپس میانگین متحرک 50 دوره‌ای در 92.44، مقاومت در 102/105؛ حمایت WTI در 92.5-93،
    برای تغییر جهت به >98 نیاز دارد. آزمون این موضع — تسویه Brent در <100 همراه با
    بازده اوراق خزانه 2 ساله >=4.70 = تأیید عدم تقارن، وزن در 50 باقی می‌ماند — با
    تسویه اندکی بالاتر از 100 (100.34) و بازده 2 ساله 4.7505 ثبت شد: از نظر ماهوی
    تأیید شد (نفت -3.7% -> بازده 2 ساله +0.75 واحد پایه)؛ Brent <100 و هم‌زمان بازده
    2 ساله <4.70 = از دست رفتن عامل ورودی (سناریوی نزولی ناشی از نرخ‌های بهره 45)
    ثبت نشده است. انتقال اثر، طبق اظهارات ثبت‌شده، یک‌طرفه است (اشمید، کشکاری، موسالم
    «به فراتر از نفت گسترش می‌یابد»، وارش PCE حدود 3.6)؛ در خارج، موضع مشروط است —
    مکلم «تا زمانی که تورم گسترش نیافته، می‌توان از نفت چشم‌پوشی کرد»، هانتر از RBA
    و برمن از RBNZ متمایل به افزایش نرخ بهره هستند، لین از ECB رشد را به مهار شوک
    انرژی گره می‌زند. زنجیره تأمین: خط لوله شرق-غرب به مدت 5-6 هفته بسته، بارگیری‌های
    ینبع متوقف، ایران صفر (CENTCOM)؛ روسیه در حال تمدید ممنوعیت صادرات گازوئیل خود؛
    درخواست‌ها برای ممنوعیت صادرات گازوئیل آمریکا رو به افزایش (Maritime Executive)؛
    تحریم‌های شرکت‌های هواپیمایی از سوی بسنت اثری بر عرضه ندارند. ادعاها: 4dfbd1d8
    (تورم کل سپتامبر >=0.4، 0.65)؛ 62c34dbd (تورم هسته <=0.3، 0.7)؛ بررسی نقطه میانی
    rule-11 در 30 سپتامبر؛ 64c7ba41 روز سه‌شنبه فقط در صورتی اجرا می‌شود که Brent
    بالاتر از 100.34 تسویه شود. هیچ سقفی نوشته نشده است.'
