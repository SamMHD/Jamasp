  why_fa: 'بازخریدهای گسترش‌یافتهٔ اوراق بلندمدت خزانه‌داری (19 اوت) عملاً کنترل منحنی
    بازده هستند و بازار آن‌ها را به‌منزلهٔ کاهش ارزش پول تفسیر کرد - رژیم روند طلا
    زمانی آغاز شد که بدهی آمریکا از $40tn گذشت. این ابزار در 9-10 سپتامبر آشکارا شکست
    خورد (حراج اوراق 30 ساله در 5.308 «ضعیف» بود). 18 سپتامبر: «اوراق قرضه دوباره
    سقوط می‌کنند» - بازده اوراق 10 ساله 5.00 و 30 ساله 5.328 - و طلا با وجود ثبات
    دلار صعود کرد: یک جلسهٔ معاملاتی. 21 سپتامبر: اوراق سررسید بلند صعود کردند (بازده
    اوراق 30 ساله 5.280)، در واکنش به افت -3.7% نفت، و طلا افت کرد. 22 سپتامبر: حراج
    اوراق 2 ساله ($69bn) با بازده 4.787 و با فاصلهٔ 0.2bp بالاتر از بازده مورد انتظار
    نهایی شد، با درجهٔ C - فشاری در بخش کوتاه‌مدت نبود؛ منحنی با افزایش 1.5-2.3bp
    بسته شد (اوراق 5 ساله 4.842، 10 ساله 4.967، 30 ساله 5.303؛ جمع‌بندی investinglive
    تغییر بازده اوراق 10 ساله را -6bp اعلام کرده بود - اختلاف در مبنا، مبنا رقم پایانی
    CNBC است)، در حالی که طلای نقدی $22 افزایش یافت و ردیف بدون تغییر بود - بخش بلندمدت
    در هیچ‌یک از دو جهت هدایت‌کنندهٔ طلا نیست. aec5cc8b در 23 سپتامبر محقق شد (از
    جمعه تا سه‌شنبه هیچ بازده پایانی اوراق 30 ساله‌ای >=5.40 نبود؛ بیشترین مقدار 5.311
    بود). پرلی (فدرال رزرو نیویورک): خرید اسناد خزانه «متوقف شده، تمام نشده است».
    زیر نظر داشته باشید: حراج‌های اوراق 5 ساله/7 ساله در چهارشنبه/پنج‌شنبه (تأییدنشده،
    todo-185 - هیچ گزارش بازنشرشده‌ای در پایگاه داده نیست)، هرگونه اظهارنظر بسنت دربارهٔ
    انتشار اوراق (حضورهای او در 21-22 سپتامبر فقط دربارهٔ ایران/چین/گازوئیل بود)،
    اینکه آیا بازده اوراق 30 ساله در هر جلسه‌ای هم‌جهت با طلا حرکت می‌کند یا خیر.
    24 سپتامبر: بازده اوراق 30 ساله در 5.402 بسته شد (CNBC) - نخستین بسته‌شدن بالاتر
    از 5.40 - همراه با بازده 5.114 اوراق 10 ساله (بالاترین سطح از 2007) و 4.895 اوراق
    2 ساله: حرکتی در واکنش به PMI که ابتدا با افزایش بازده‌ها و مسطح‌شدن منحنی و سپس
    با جابه‌جایی موازی آن همراه بود، در حالی که طلا نزولی و دلار صعودی بود. بخش بلندمدت
    از آستانه عبور کرد و طلا آن را به‌منزلهٔ کاهش ارزش پول تفسیر نکرد (aec5cc8b پیش‌تر
    با بسته‌شدن سه‌شنبه محقق شده بود). حراج‌های اوراق 5 ساله/7 ساله همچنان تأییدنشده‌اند
    (هیچ گزارش بازنشرشده‌ای در پایگاه داده نیست، todo-185). زیر نظر داشته باشید: بسته‌شدن
    بازده اوراق 30 ساله در >=5.45 همراه با افت DXY و صعود طلا تنها ثبت قیمتی است که
    سناریوی پایه را تغییر می‌دهد. 25 سپتامبر: این ابزار دوباره شکست خورد - خزانه‌داری
    دومین بازخرید خود را طی دو هفته اجرا کرد و حراج اوراق 7 ساله ($44bn) با فاصلهٔ
    0.7bp بالاتر از بازده مورد انتظار در 5.085% نهایی شد؛ بازده اوراق 30 ساله در 5.460
    بسته شد (+5.9bp، بالاترین سطح در 22 سال؛ رقم لحظه‌ای در جمع‌بندی 5.478)، بازده
    اوراق 10 ساله 5.163 (بالاترین سطح از ژوئیهٔ 2007)، نرخ وام‌های مسکن 7%. رویترز
    به نقل از investinglive: «بازخریدها و مداخله در بازار ین نتوانسته‌اند بازده‌ها
    را مهار کنند»؛ استراتژیست‌ها عمدهٔ افزایش از ماه مارس را به انتظارات افزایش نرخ
    بهرهٔ فدرال رزرو و باقی را به رشد و نفت نسبت دادند؛ «بازده 6% اوراق 10 ساله در
    حال تبدیل‌شدن به آستانهٔ درد بعدی است». در سطح جهانی: استقراض بی‌سابقهٔ آلمان
    به میزان ~EUR525bn، بازده اوراق دولتی آلمان در بالاترین سطح 17 ساله، بازده JGB
    با سررسید 10 ساله در بالاترین سطح از 1996. طلا نزولی همراه با DXY صعودی - به‌منزلهٔ
    کاهش ارزش پول تفسیر نشد. تنها عامل تغییردهندهٔ سناریوی پایه: بازده اوراق 30 ساله
    >=5.50 همراه با افت DXY و صعود طلا.'
