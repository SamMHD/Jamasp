  why_fa: 'ین یکی از ستون‌های تقاضای ناشی از کاهش ارزش پول بود: USDJPY پس از مداخله
    ناموفق اوت در 159-160 میخکوب شده بود؛ این وضعیت در 3-8 سپتامبر شکست (160.4 ->
    153.3). 18 سپتامبر: بانک مرکزی ژاپن نرخ بهره را به 1.25% افزایش داد (بالاترین
    سطح از 1995)، با رأی 7-2، بدون تعیین زمان‌بندی؛ اوئدا: «مرحله سیاست‌گذاری تغییر
    کرده است»؛ انتظار بازار: یک افزایش نرخ بهره در هر فصل، نرخ نهایی 1.75-2%. جریان
    معاملات: استعلام نرخ بانک مرکزی ژاپن در 158.05 - خط مورد دفاع 158 است، نه 160.
    23 سپتامبر: USDJPY در 157.62 (بالاترین سطح در بازه 157.94)، توکیو سه‌شنبه/چهارشنبه
    تعطیل بود (معاملات کم‌حجم در هفته تعطیلات؛ طبق داده‌های CFTC، صندوق‌های پوشش ریسک
    برای نخستین بار از ژوئیه 2025 در ین موقعیت خالص خرید داشتند). طلا مستقیماً هیچ
    اثری از ین نمی‌گیرد (بررسی عمیق #56: ین فقط از طریق DXY بر طلا اثر می‌گذارد؛ DXY
    در 100.65، با رشد +0.26% در 22-23 سپتامبر، تمام حرکت شبانه طلا را توضیح می‌داد).
    در کنار FOMC بخوانید: یک اختلاف نرخ بهره در حال گسترش، هر دو سوی آن به نفع دلار
    - معامله بر مبنای نرخ‌های بهره نسبی، نه کاهش ارزش پول؛ هیچ بانک مرکزی دیگری در
    این شرایط به سمت تسهیل سیاست پولی نمی‌رود (ناگل/لین از ECB در 22 سپتامبر، اجماع
    برای SNB در پنج‌شنبه حفظ نرخ است). باز: be4d6b22 (هیچ ثبت قیمتی برای USDJPY در
    >=160 تا پنج‌شنبه 24 سپتامبر 23:59Z، 0.55؛ 1.5% حاشیه). نشست بعدی بانک مرکزی ژاپن
    30 اکتبر، دو روز پس از FOMC در 28 اکتبر است. شرط تغییر: >=160 با عبور از سد وزارت
    دارایی = بازگشت ستون، مبنا 30؛ <152 همراه با افت Nikkei+BTC = رژیم نقدینگی. 24
    سپتامبر: USDJPY در 157.93 (بالاترین سطح چهارشنبه 158.36 - عبور درون‌روزی از خط
    استعلام نرخ 158، هیچ اقدامی از سوی وزارت دارایی گزارش نشد)؛ PMI مقدماتی ژاپن در
    پایین‌ترین سطح چهارماهه با فشار قیمتی «شدید»؛ actionforex: رشد افت می‌کند، در
    حالی که ین ضعیف تورم را بالا نگه می‌دارد. be4d6b22 پنج‌شنبه 23:59Z با ~2 ین حاشیه
    بسته می‌شود. DXY در 101.08 - ین محرک حرکت دلار نیست؛ ستون همچنان فروریخته است.
    25 سپتامبر: be4d6b22 محقق شد - بیشینه بازه 158.949 (پنج‌شنبه 15:16Z)، هیچ قیمتی
    در 160 ثبت نشد. کاتایاما: ترامپ نگرانی درباره ین ضعیف را با تاکایچی مطرح کرد،
    USD/JPY به زیر 158.50 کاهش یافت (158.43 در 03:16Z). گلدمن با توجه به انقباض پولی
    بانک مرکزی ژاپن، مسیر پیش‌بینی‌شده USD/JPY را به 150 در یک سال آینده کاهش می‌دهد؛
    دایوا: افزایش نرخ بهره بعدی بانک مرکزی ژاپن در دسامبر؛ اوراق 10ساله JGB در بالاترین
    بازده از 1996. ستون همچنان فروریخته است: معامله دلار بر مبنای بازده اوراق آمریکا
    است و مؤلفه ین فقط از طریق DXY (101.26) بر طلا اثر می‌گذارد. ادعای جایگزینی مطرح
    نیست - آزمون 158/160 تا زمانی که DXY به‌دلیل بازده‌ها بالا می‌رود، اطلاعاتی درباره
    طلا ندارد. 26 سپتامبر: مداخله کلامی - USDJPY در پی اظهارات مداخله‌جویانه مقامات،
    یک روز پس از آنکه ترامپ موضوع ین ضعیف را با تاکایچی مطرح کرد، -150 پیپ به 157.19
    رسید (جمعه)؛ هیچ اقدامی صورت نگرفت؛ جمع‌بندی: «بازی جوجه» با تهدید یک دور مداخله
    در بازگشایی یکشنبه؛ JPY پیشتاز روز بود. DXY برابر با -0.22% - تمام اثر بر طلا.
    یک دور مداخله واقعی وزارت دارایی اثری در حدود ~0.3-0.5 بر DXY و $15-25 بر طلا
    دارد (نگاشت بررسی عمیق #56)؛ تغییر رژیم نیست. همه بانک‌های مرکزی دیگر در برابر
    دلار سیاست انقباضی در پیش می‌گیرند (RBA سه‌شنبه به 4.60 - ولز آن را نرخ نهایی
    می‌خواند؛ ECB با شاخص قیمت مصرف‌کننده (CPI) منطقه یورو در 3.7% در جمعه؛ صورت‌جلسه
    بانک مرکزی ژاپن دوشنبه 23:50Z). ستون همچنان فروریخته است. ادعایی مطرح نیست.'
