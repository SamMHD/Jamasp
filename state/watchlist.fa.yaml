  why_fa: 'فرانسه به‌عنوان یک دولتِ ناشر بدهیِ خارج از هسته بازقیمت‌گذاری شد: فاصله
    بازده 10ساله OAT-Bund از ~110bp (24 سپتامبر) -> ~130 (1 اکتبر) -> >140bp (Reuters،
    بیشترین فاصله‌ها از 2012)، بالاتر از ایتالیا؛ Vanguard: «افت کیفیت اعتباری» (FT)؛
    CAC 40 حمایت صعودی چندساله خود را شکست، بدون هیچ واکنشی از سوی خریداران (investinglive،
    4 اکتبر)؛ EUR/USD از 1.1380 -> کف 1.1165 (actionforex: سطوح 1.1150 / 1.1080 در
    پایین، 1.1275 / 1.1320 در بالا)؛ MUFG در موقعیت فروش EUR/JPY. همین امر DXY را
    به سقف 52هفته‌ای رساند (102.53، جلسه یکشنبه 4 اکتبر)، درحالی‌که بازده اوراق خزانه
    2ساله آمریکا کاهش یافت — تقاضایی برای دلار با منشأ خارج از آمریکا. برای طلا: (a)
    حلقه DXY در زنجیره (نفت -> بازده 2ساله -> DXY -> طلا، قاعده 22) وقتی حرکت ناشی
    از یورو باشد، اطلاعات کمتری در خود دارد — طلا هم‌زمان با ثبت سقف جدید DXY در بازگشایی
    یکشنبه +0.2% افزایش یافت؛ (b) طلا برحسب EUR نزدیک سقف‌های خود قرار دارد — تقاضای
    اروپایی برای دارایی امن که جریان معاملات کاغذی تا بازگشت میزهای معاملاتی SGE/لندن
    نشانش نخواهد داد (پنجشنبه 8 اکتبر، هفته کنفرانس LBMA)؛ (c) حرکت بی‌نظم OAT، کانال
    «بانک مرکزی دیگر» (قاعده 6) برای ECB است — گزارش مذاکرات پنجشنبه 11:30Z. نشانه‌ها:
    OAT-Bund در 150 / 160bp؛ EUR/USD در 1.1150 / 1.1080؛ DXY در 103؛ تداوم حرکت CAC.
    خط موضع‌گیری: فاصله بازده >=160bp همراه با DXY >=103 و کاهش طلا -> حلقه دلار به
    زنجیره بازگشته است؛ افزایش طلا با وجود آن -> برداشت مبتنی بر منشأ خارج از آمریکا
    همچنان معتبر است. به‌تنهایی ورودیِ وزن‌دهی نیست؛ از طریق آزمون علامت DXY/بازده
    2ساله وارد می‌شود. اگر فاصله بازده به‌مدت یک هفته در <120bp بسته شود، این فرضیه
    را کنار بگذارید. 7 اکتبر: دوشنبه CAC به‌تنهایی در اروپا -0.8% افت کرد، EUR/USD
    در 1.1217 (-0.3%)، DXY در 102.1-102.5؛ سه‌شنبه دولت فرانسه اقداماتی برای کسری
    بودجه انجام داد، فاصله بازده OAT-Bund کاهش یافت و EUR بازگشت (investinglive، 11:19Z)،
    DXY در 101.83 بسته شد و طلا افزایش یافت — برداشت مبتنی بر تقاضای دلار با منشأ
    خارج از آمریکا در هر دو جهت معتبر ماند. سطح فاصله بازده به‌صورت عددی گزارش نشد؛
    ماندن در <120bp به‌مدت یک هفته این فرضیه را باطل می‌کند. 8 اکتبر: آسودگی خاطر
    درباره فرانسه یک روز دوام آورد — یورو چهارشنبه دوباره افت کرد (actionforex)، بازده‌های
    اروپایی پیشتاز موج فروش صبحگاهی بودند که طلا را به 4094.7 رساند؛ گزارشی مبنی بر
    اینکه فرانسه در حال بررسی انتشار بیشتر اوراق کوتاه‌مدت است، در بعدازظهر آمریکا
    مسیر بازده‌های جهانی را معکوس کرد؛ DXY در 102.24 بسته شد (+0.41؛ Reuters: سقف
    18ماهه)، «قدری فاصله گرفتن از یورو به‌دلیل نگرانی‌های بدهی» (جمع‌بندی). این بار
    طلا در واکنش به دلارِ متأثر از فرانسه کاهش یافت (-43.7 همراه با افت بازده 2ساله)
    — نشانه 6 اکتبر («طلا دلارِ متأثر از فرانسه را نادیده می‌گیرد، از دلارِ متأثر
    از بازده 2ساله پیروی می‌کند») یک بار نقض شده است؛ دومین ثبت، حلقه دلار را دوباره
    به ورودی زنجیره تبدیل می‌کند.'
