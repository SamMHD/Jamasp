    25 سپتامبر: آزمون دهم کف - ردیف پنجشنبه 4309.5 (دوام آورد)، اما کف تیک 4282.9
    در 15:35Z در جلسه‌ای با افزایش نفت و بازده 2ساله بدون تغییر بود (در مبنای تیک
    زیر 4300، نه در مبنای ردیف؛ به همین صورت ثبت شد). جهش از کف در پی گزارش توافق
    مرحله‌ای در 16:18Z (برنت -3) و طی شب با برنت -1% رخ داد - تقاضای خرید با کاهش
