    «تقریباً به‌طور قطع» حباب است؛ NEXTDC با -44% (تأخیرهای شبکه برق، توسعه متوقف‌شده)؛
    شکست عرضه اولیه Firmus و مذاکره Nvidia برای پشتیبانی؛ عملکرد SpaceX فراتر از انتظار
