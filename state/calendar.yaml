events:
  - date: 2026-08-03
    time_dubai: "~22:00-02:00 (Mon afternoon US time; unscheduled)"
    title: US-Iran denuclearisation talks convene — the checkable marker
    why: >
      Trump claimed (21:53Z 2 Aug, pre-reopen) the Hormuz deal is "done" and
      direct talks start Monday afternoon. The deal claim is unverifiable
      (no Iranian confirmation, no terms); talks convening IS verifiable.
      Convened with substance = bearish-tail evidence; no talks / Iranian
      denial = the claim deflates and the reopen's crude −6% whips back.
    action: wakeup added 2026-08-03 20:00Z (Tue 00:00 Dubai deepdive);
      2-hourly scans cover an earlier Iranian denial
    outcome: >
      RESOLVED 3 Aug 20:00Z — denial branch: talks did not convene; FM
      spox Baghaei on record ("not currently holding any talks with the
      US"). Trump called off a planned strike, oil −6%, gold rebuilt
      late (4110.8). Weights → 60/15/25. Follow-through: wakeup #10
      (Arbaeen, Tue 06:00Z) + prediction 90ee5bdd (Tue 20:00Z).

