      Trump claimed (21:53Z 2 Aug, pre-reopen) the Hormuz deal is "done" and
      direct talks start Monday afternoon. The deal claim is unverifiable
      (no Iranian confirmation, no terms); talks convening IS verifiable.
      Convened with substance = bearish-tail evidence; no talks / Iranian
      denial = the claim deflates and the reopen's crude −6% whips back.
    action: wakeup added 2026-08-03 20:00Z (Tue 00:00 Dubai deepdive);
      2-hourly scans cover an earlier Iranian denial
