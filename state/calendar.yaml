      RESOLVED 3 Aug 20:00Z — denial branch: talks did not convene; FM
      spox Baghaei on record ("not currently holding any talks with the
      US"). Trump called off a planned strike, oil −6%, gold rebuilt
      late (4110.8). Weights → 60/15/25. Follow-through: wakeup #10
      (Arbaeen, Tue 06:00Z) + prediction 90ee5bdd (Tue 20:00Z).

