watchlist:
  - theme: fed-rate-path
    why: >
      dominant driver of real yields and hence gold. Logan wants a HIKE
      (explicit, 31 Jul); Kashkari/Hammack dissent same direction; Barkin calls
      the next decision a "close call." Payrolls 7 Aug is the next test.
    since: 2026-07-31

  - theme: central-bank-gold-buying
    why: structural demand floor; watch monthly reserve reports
    since: 2026-07-31

  - theme: warsh-credibility
    why: >
      debasement channel; best explanation for gold holding $4,000+ against a
      2.41% real yield. Jackson Hole late August is the set piece.
    since: 2026-07-31

  - theme: middle-east-risk-premium
    why: >
      REWRITTEN 4 Aug (history in reports/2026/08/2026-08-03-brief.md and
      2026-08-04-brief.md). The kinetic floor is now a PATTERN: Aug 1 Limah
      (tanker engine room disabled), Aug 2 Khasab near-miss (UKMTO-
      corroborated, crew safe — IRNA aflame photo unverified/likely
      misattributed), Aug 3 22:00Z cargo vessel STRUCK 20nm NE Khasab —
      UKMTO Warning 104-26, classified an ATTACK, unattributed. Arbaeen
      focal window Tue–Wed. Rezaei (adviser to Supreme Leader Mojtaba
      Khamenei): US warships forcing an "unauthorised route" will be
      struck; "Hormuz will not be reopened on Washington's terms" — the
      escort-convoy miscalculation is the sharpest edge. Trump set a
      TUESDAY deadline for complete reopening ("last chance before
      decapitation"; talks "underway" — Tehran denies). Both regimes in
      force and tightening: IRGC transit authorisation + US blockade (44
      vessels redirected per CENTCOM, tankers disabled, Lincoln on
      station); flows ~half pre-war; IMO: ~6,000 seafarers stranded. Real
      motion remains the Iran–Oman compromise route (Araghchi "final
      stages") — Tehran-authorized, so Rezaei's threat does NOT cover it;
      corridor signed + spun as reopening is still the bearish tail, but
      narrowed. Base rate: five prior halt announcements, all broken.
      Premium fully unwinds only on a SIGNED text. UPDATED 5 Aug: deadline
      lapsed 03:00Z unmet (50db7544 HIT) — no strike; instead US-Iran-Oman
      interim deal near (60-day managed corridor, inbound Iranian waters /
      outbound Omani, mine clearance in 30d), Wednesday announcement
      targeted, Iranian leadership approved Tuesday. Iran FM spox: not a
      full reopening. Hormuz kinetics quiet 30h+; Red Sea escalating
      separately (first sinking 4 Aug, HRA widened). Watch: Trump speech
      20:30Z Wed (wakeup #17), announcement shape + Iranian co-
      confirmation, mine-clearance milestone once signed, further UKMTO
      advisories, Mojtaba–Pezeshkian power struggle over Hormuz policy.
      UPDATED 6 Aug: kinetic floor re-confirmed — UKMTO incident ~00:30Z
      (two explosions, vessel/crew safe) inside the deal endgame. Deal
      thread: Iran-Oman route COORDINATES agreed, joint statement "final
      stages" (Baghaei/IRNA), but Iran says Oman-only deal guarantees
      nothing and a US official publicly contradicts the Iranian account
      (no permission, no tolls) — fees (5-7% / ~3% / 0) still the core
      unresolved term. Trump "tomorrow or the next day"; Rubio: no final
      agreement. Friday window closes Sat 03:59 Dubai, colliding with
      payrolls. UPDATED 7 Aug: deal shape firmed — Al Hadath/Al Arabiya
      (high-ranking sources): 60-day outline, inbound-Iran/outbound-Oman
      routes, ZERO transit fees, regional demining, then US-Iran return
      to MoU Paragraph 5; gate is SNSC approval, timing "within days"
      (Friday slip-risk up). Hostile-vessel bar (in force since 28 Feb)
      proposed as a term of the reopened corridor — reroutes more tonnage
      than any fee layer. New unverified kinetic: Iranian forces
      "confrontation with hostile enemy targets" at the strait mouth
      ~18:10Z 6 Aug, two explosions heard on Qeshm, officials deny a
      strike, Tasnim promises "achievements" — no UKMTO/gcaptain
      corroboration yet. Saudi warns of imminent IRGC-coordinated
      Iraqi-militia/Houthi strike on its energy infrastructure, possibly
      timed to derail talks; Houthis killed 58 Yemeni govt forces +
      injured 11 civilians in Saudi (spoiler thesis materializing on the
      Yemen axis). Prediction 3d8416e4 tests the zero-fee shape.
    since: 2026-07-31

  - theme: energy-pce-passthrough
    why: >
      June core PCE 3.3% was flattered by energy -5.9% / gasoline -9.2%, which
      the BEA attributes to a temporary Middle East easing that has since
      reversed (crude +~20% on the month). July UMich 1y inflation expectations
      eased, but that survey predates the crude move — same flattery. July/August
      prints should be worse. Central event for the Fed path. AMENDED 2 Aug:
      two new drags — OPEC+ set for a September quota increase, and the US-Iran
      pause (if it holds) softens crude. Passthrough stays live only until a
      Hormuz deal LANDS. ISM prices-paid printed 71.1 on 3 Aug (from 73.0 —
      first easing; prediction 951d8286: Aug < 71.1). Next reads: July CPI/PCE,
      then Aug ISM ~1 Sep. Crude's new lower base (~$80 WTI) accelerates the
      rollover while it holds. CONFIRMED LIVE 6 Aug: deal hopes → crude
      slide (WTI ~$75) → hike bets cooled → gold 7-week high. The theme's
      mechanism is now the marginal gold driver, running in reverse
      (disinflationary leg). Deal landing accelerates it; payrolls can
      override it. UPDATED 7 Aug: disinflationary leg reversed again —
      Brent 82.49 (+3.8%) / WTI ~77.3 on the hostile-vessel-bar proposal
      + Saudi strike warning; passthrough direction now whipsaws with
      the deal tape. Resolution needs a LANDED deal, not headlines.
    since: 2026-07-31

  - theme: india-gold-formalisation
    why: >
      RENAMED from india-duty-grey-market, 1 Aug. Duty hike diverts flow to the
      grey market (6-8% smuggling margins) and pulls physical through Dubai at a
      provenance premium. First counter-move logged: NSE launched Electronic
      Gold Receipts (31 Jul) to formalise the domestic market. Ambiguous for the
      desk — less smuggled volume, but a larger documented market, and
      documentation is Dubai's edge. Watch EGR volumes.
    since: 2026-07-31

  - theme: metals-financialization
    why: >
      Binance gold/silver options after $7bn+ daily metals perps. Thesis was
      that leveraged marginal money would amplify moves. First stress test
      (31 Jul, record momentum crash + forced $45bn liquidation) says that money
      is NOT yet in gold. Constructive counterweight added 1 Aug: Tether bought
      14t in Q2 — a price-insensitive, non-CB, non-ETF holder. Downgraded on
      leverage, upgraded on structural bid.
    since: 2026-07-31
