      17-18 Aug adds: Iran STATE-CLAIMS the UAE-tanker seizure (state TV
      via Fars — "violating Iranian maritime laws", route + payment +
      permit conditions, taken toward Qeshm; NO name/operator/UAE
      confirmation ~30h — d2ea5d99 rides, first state-claimed seizure of
