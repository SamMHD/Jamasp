watchlist:
  - theme: fed-rate-path
    why: >
      Real yields are gold's dominant driver, and this Fed is debating a HIKE,
      not a cut. Sept-hike odds ran from ~35% mid-August to 58% at the 4 Sep
      close and ~60% on the 7 Sep Asia read; NO CME number has been ingested
      since (Investing.com 403, the wraps omit it) — investinglive 9 Sep says
      only "markets are leaning toward a rate hike at next week's meeting,
      though the outcome is not seen as settled". August payrolls (+162k)
      removed the labour alibi; Brent's 101.21 settle (9 Sep) loads the
      oil->CPI leg into the two prints. 9 Sep cash close: 2y 4.4316 (+3.4bp,
      cycle highs), 10y 4.8427 (highest since Nov 2023), 30y 5.2899; the
      $39bn 10y auction stopped 1.5bp through. FOMC blackout 5 Sep to the
      15-16 Sep meeting — only data, oil and Treasury reprice it. Gates: PPI
      10 Sep (cons +0.4), CPI 11 Sep (core cons 0.2 per the wrap, 0.3 per
      WF/calendar — a 0.3 is hawkish against one and in-line against the
      other). Kills the hike: core <=0.2 with oil easing. Seals it: core
      >=0.4, or passthrough the Fed reads as broadening beyond energy. Tape
      note: gold closed +1.15% on 9 Sep WITH yields at highs — one session
      in which the rates desk's impulse did not set gold's price.
    since: 2026-07-31

  - theme: central-bank-gold-buying
    why: >
      Structural demand floor: ~289t of official demand this cycle with ETF
      inflows resuming beside it, and reserve diversification out of
      Treasuries as the flow-side twin (China's UST holdings lowest since
      2008). China's reserves rose again in August (investinglive, 7 Sep);
      UBS (9 Sep) keeps its long-game bullish call on that buying. The
      custody reflex is spreading — the Dutch central bank moved 86t from
      US/Canadian custody to London citing geopolitical unrest; France moved
      earlier; Norway's $2.4tn fund is weighing cutting government bonds
      from 70% to 50% (7 Sep). Counter-signal: Russia, once the top buyer,
      is now a steady seller. The floor showed again 8-9 Sep: the 4388 low
      was bought within hours and 4300 is untested since 2 Sep. Confirms:
      WGC monthlies showing net buying through this drawdown. Kills it: two
      consecutive months of net official selling.
    since: 2026-07-31

  - theme: warsh-credibility
    why: >
      The debasement channel - the best explanation for gold holding above
      $4,000 against a positive real yield. Warsh chairs a Fed whose
      independence is openly contested while the long end prices distrust:
      10y 4.84 (highest since Nov 2023), 30y 5.29 near its mid-2007 high,
      TLT at 2004 lows, foreign UST liquidation, and on 9 Sep a tripled
      Treasury buyback that FAILED to bring yields down — investinglive's
      read: investors "demanding compensation for fiscal and supply concerns
      that a liquidity operation cannot fix". Political pressure explicit
      and broad (President, VP, Bessent, Navarro all against a hike; Trump
      tied tariffs to Fed policy); three July dissents for a hike and
      Warsh's Jackson Hole line (54% of PCE components >3%) are the
      counterweight. A hike delivered through this pressure is
      credibility-positive and bearish gold via real yields; a hold that
      looks coerced is the debasement case. Breadth is the tell: weak PBOC
      fixes, BTC 78k, a tightening periphery (RBA, BoE, ECB, and now a BoJ
      with JGB 10y >3%) circling an immovable core. Confirms: gold rallying
      WITH yields — printed 9 Sep (+1.15% against a 10y at 4.84). Kills it:
      a delivered hike that pulls the long end down, or a visible
      re-anchoring of independence. Blackout means no Fed reply until 16 Sep.
    since: 2026-07-31

  - theme: middle-east-risk-premium
    why: >
      Two regimes: IRGC control of Hormuz transit against a US blockade
      (Operation Economic Outcast), with open kinetic exchange since 30-31
      Aug. 9 Sep crossed the enforcement line: the IRGC said it attacked two
      US vessels, eight tankers and ten "non-compliant" vessels; UKMTO said
      "several" vessels in the Gulf of Oman and the Gulf were "subject to
      disabling fire" (AFP via Gulf News) — the primary feed confirming FIRE
      on transiting non-Iranian hulls, hits/names/positions unconfirmed and
      the maritime press silent so far. The Guards added parts of the GULF
      OF OMAN AND THE ARABIAN SEA to the prohibited zone for the first time
      (coordinates "later", entrants sanctioned) — the Fujairah approaches
      are now inside a declared zone. Three Iranian salvos at US warships
      (6, 8, 8-9 Sep; new Qasem Basir anti-ship missile per WANA) all
      repulsed; US counters stayed on hulls (eight since 5 Sep; Derya at the
      Kharg anchorage); Rubio: more tankers "again today". Same day the IAEA
      Board referred Iran to the UNSC 23-3 (June 2025 precedent: strikes one
      day after the noncompliance finding), CNN/CSIS published a Pickaxe
      construction surge, Trump said "activity seen... don't get cute", and
      CNN reported a next-generation penetrator in development because the
      current MOP is not thought to reach the site. Trump 9 Sep: "not
      looking for a deal", the war "will end immediately after the
      election"; WSJ: aides warn it could last his full term. IRGC's price
      for ending it: Israel out of Lebanon, Yemen blockade lifted, $24bn
      released, no interference in nuclear/missile programmes. Houthi-Saudi
      front: 73 injured 7-8 Sep, Riyadh's response still unexecuted, Yanbu
      untouched. Ladder steps, each a named trigger: Kharg/Larak
      INFRASTRUCTURE (2fbc22dd, 12 Sep), a Kuwaiti/Bahraini port or a
      Fujairah-approach hull hit, a warship actually struck, Yanbu
      (f04926f1), Pickaxe (1f83782a, 11 Sep), a GCC strike on Iran
      (110d5daa, 13 Sep), a US strike on Iranian territory (e1e9ba8f, 13
      Sep). The premium is insurance-priced and it re-rated 4% on Wednesday's
      enforcement change alone — barrels did not move. Markers: zone
      coordinates, named hulls/damage from the 9 Sep fire, CENTCOM
      statements, UNSC follow-through, escorts (a0429ae4).
    since: 2026-07-31

  - theme: kinetic-transmission-inverted
    why: >
      The war reaches gold as a Fed hike and a margin call, not as a haven
      bid. Four sessions of evidence (2, 6, 7, 8 Sep): escalation lifts
      Brent, Brent lifts the 2y and hike odds inside a blackout with CPI
      ahead, and a 222k spec long gets sold with equities on the same
      headlines; 8 Sep GC 4487 -> 4396 with the sharp leg as oil GAVE BACK
      gains and the Dow fell 1.2%. COUNTER-SESSION 9 Sep: Brent settled
      101.21 (+3.8%), yields rose to 2023 highs, stocks fell a third day —
      and GC settled +1.15%, spot +1%, back above the 100DMA, with fxempire
      titling the day "gold rebounds as traders focus on bond buybacks". The
      escalation was priced through oil into rates AND gold rose: the
      debasement channel, not deleveraging, set Wednesday's close. One
      session against four; the theme stands but its "kills it" clause has
      a first data point. The kinetic re-weight carries a tape clause
      (named trigger AND GC daily close >=+1% in the session it prints) —
      9 Sep printed the tape half only (warships missed, hulls fired on
      not confirmed hit). Confirms: another escalation session closing red;
      gold down on oil-up AND oil-down days. Kills it: a second consecutive
      gold-up/yields-up session, the tape clause printing, a supply event
      the market trades as stagflation, or hike odds falling on soft CPI.
    since: 2026-09-09

  - theme: boj-yen-pillar
    why: >
      The yen was a pillar of the debasement bid: USDJPY pinned at 159-160
      after August's failed intervention (Japan's FX reserves fell a record
      $80bn in August) meant carry and fiscal absorption outweighed BoJ
      normalisation, and gold's floor leaned on it. That broke 3 Sep (160.4
      to 155.34) and 7-8 Sep (153.3), on July cash earnings +4.7% y/y, Q2 GDP
      +1.4%, Aida expecting a September hike. 9-10 Sep: JGB 10y ABOVE 3% for
      the first time since September 1996; the yen was the strongest major
      on 9 Sep; BoJ's Masu (10 Sep): "further hikes are needed to avoid
      being forced into rapid tightening later"; USDJPY 153.5 ORDERLY, no
      MoF/BoJ rate-check talk, BTC 78k, Tankan five-year high. The
      disorderly tell (USDJPY <150 with Nikkei and BTC down together) has
      not printed. Two-sided for gold: orderly yen-up is dollar-down and
      gold-up near term (the foreign-CB dollar leg is the base case's only
      leg that has bought gold this week — 09cb81a7), a BoJ that can
      genuinely tighten erodes the pillar structurally, and the tail is a
      disorderly unwind of the ~$103bn yen short. Gates: US PPI 10 Sep, CPI
      11 Sep, the BoJ 17-18 Sep (slot to re-verify Saturday, rule 16).
      Claims: 5c6b2df3 (no print <150 through 10 Sep, 0.55) and successor
      6ddbe426 (through 16 Sep, 0.55).
    since: 2026-09-03

  - theme: energy-pce-passthrough
    why: >
      The bridge from the war to the Fed: oil into CPI is the live hike-odds
      channel. Brent SETTLED 101.21 on 9 Sep (AFP; investinglive 101.60,
      +3.76%), WTI 96.70, diesel nearing $6/gal — 65cd057e (no settle >=100)
      scored MISS with ~1% of room. The move was enforcement-driven, not
      barrel-driven: UKMTO-confirmed fire on transiting vessels, the zone
      widened into the Gulf of Oman/Arabian Sea, Trump "oil won't come down
      until after the midterms" (no policy put before November), HSBC
      "tighter for longer" and a raised Brent forecast; the private inventory
      survey showed a smaller-than-expected draw (demand side softening).
      The barrels are still blockade barrels (Iranian exports ~250 kb/d,
      Hormuz transits ~10/day) — the premium is insurance-priced, which is
      why it re-rates 4% on an enforcement change. China's August PPI is
      surging on energy with CPI 0.8% in line. August US CPI on 11 Sep is
      the test: consensus headline +0.4% m/m and 3.4% y/y, core 0.2 (wrap)
      to 0.3 (WF 0.23); PPI 10 Sep cons +0.4 after 0.0. Energy is the whole
      headline story; CORE decides the hike; the ECB's read (energy is 90%
      of the 2026 episode, no core spillover yet) is the benign case;
      Bessent's line (no hike in a supply shock until second-order effects)
      is the administration's version. Fragile to de-escalation talk; a
      Russia-Ukraine text takes the Black Sea floor off it. Brent 100 is now
      support, not resistance; no successor cap written (lesson filed).
    since: 2026-07-31

  - theme: us-fiscal-dominance
    why: >
      Treasury's expanded long-dated buybacks (19 Aug) are de facto
      yield-curve control, and the market read them as debasement — gold
      flipped into a trend regime as US debt passed $40tn. The tool has now
      been tried and FAILED IN PUBLIC: the first operation printed "up to
      $6bn" on 9 Sep (tripled from $2bn, under the $10-12bn whisper), and
      yields rose anyway across the curve — 10y 4.84 (highest since Nov
      2023), 30y 5.29 (day high 5.309, the 17 Aug trigger); investinglive:
      "a reaction some observers see as a sign the intervention is
      backfiring", deficit >$2tn, AI issuance competing for the same
      buyers; MarketWatch: "the bull market's biggest enemy could be
      Bessent's interventions". Counter-tell: the $39bn 10y auction stopped
      1.5bp through the WI — demand exists at 4.83%. Operation RESULTS
      (accepted vs cap, tail) still unreachable (todo-185; #53 reads
      relays). The regime signature is gold rallying WITH yields and it
      printed 9 Sep (+1.15%, fxempire "gold rebounds as traders focus on
      bond buybacks"). Trump 9 Sep tied $5,000 payments to a Republican
      sweep (fiscal, pre-midterm). Counter-tells earlier this week: price
      targets crowded (Citi 4,800 to UBS 5,400), Goldman's buy zone moved
      DOWN to $4,000, 2 and 8 Sep deleveraging days. Claims: 52db03df (no
      cap raise/emergency op through 18 Sep, 0.7), 09cb81a7 (no DXY close
      >=100 through 16 Sep, 0.6). Watch the 30y vs 5.31, TLT, the 20y
      auction, any Bessent line on the operation.
    since: 2026-08-20

  - theme: us-canada-trade-war
    why: >
      A tripwire theme, low conviction on magnitude: talks collapsed 23 Aug,
      US 50% tariffs took effect, Canada retaliated in kind. It matters as a
      second protectionism front beside the Iran siege economy, feeding the
      de-globalisation and debasement mix that already sets gold's price.
      Passthrough versus growth is resolving toward the growth hit on the
      Canadian side — August employment -41.7k against +15k consensus —
      which hands the BoC a cut argument. 8 Sep: Trump BANNED Canadian
      autos, dairy and alcohol and ordered GSA to purge Canadian goods; 9-10
      Sep: a further US response to Canada's counter-tariffs (actionforex),
      Crown Royal carved out; USD/CAD did not blink (CAD gained Tuesday, USD
      +0.17% vs CAD Wednesday). Still no haven flow into gold from it. Watch
      retaliation scope (energy and USMCA carve-outs), US inflation-
      passthrough chatter, and whether haven flow shows in gold rather than
      only the dollar. Promote it out of tripwire status only if US CPI or a
      Fed speaker names tariffs as a driver.
    since: 2026-08-24
