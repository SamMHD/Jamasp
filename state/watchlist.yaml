watchlist:
  - theme: fed-rate-path
    why: >
      dominant driver of real yields and hence gold. Logan wants a HIKE
      (explicit, 31 Jul); Kashkari/Hammack dissent same direction; Barkin calls
      the next decision a "close call." Payrolls 7 Aug is the next test.
    since: 2026-07-31

  - theme: central-bank-gold-buying
    why: structural demand floor; watch monthly reserve reports
    since: 2026-07-31

  - theme: warsh-credibility
    why: >
      debasement channel; best explanation for gold holding $4,000+ against a
      2.41% real yield. Jackson Hole late August is the set piece.
    since: 2026-07-31

  - theme: middle-east-risk-premium
    why: >
      UPDATED 3 Aug 02:30. Trump claimed the Hormuz deal "done" 7 min before
      the Globex reopen (21:53Z 2 Aug), denuclearisation talks "Monday
      afternoon" — NO Iranian or third-party confirmation, no terms, plus
      "ready to go anytime." Market bought it (crude −6%, stocks up). Same
      sourcing tier as the "Iran asked for the pause" claim Mehr called "a
      new lie"; hours earlier the capitals were negotiating different
      documents (Trump's new deal vs Tehran's June Islamabad memorandum).
      Hormuz facts (primary-sourced, 2 Aug): BOTH restriction regimes
      institutionalized — IRGC transit authorisation enforced with force
      (three tankers struck 29 Jul; PGSA/HormuzSafe/PGMIC,
      Treasury-designated) and US Navy blockade of Iranian ports + escorts
      (~5.6 mb/d, ~half pre-war, recovering at margin). Premium only fully
      unwinds on a SIGNED text, not a claim. Watch: talks actually convening
      Monday (wakeup Tue 00:00 Dubai); official Iranian response
      (confirmation = bearish unwind; second "new lie" = sharp reversal of
      the reopen move); Arbaeen Tue–Wed escalation focal.
    since: 2026-07-31

  - theme: energy-pce-passthrough
    why: >
      June core PCE 3.3% was flattered by energy -5.9% / gasoline -9.2%, which
      the BEA attributes to a temporary Middle East easing that has since
      reversed (crude +~20% on the month). July UMich 1y inflation expectations
      eased, but that survey predates the crude move — same flattery. July/August
      prints should be worse. Central event for the Fed path. AMENDED 2 Aug:
      two new drags — OPEC+ set for a September quota increase, and the US-Iran
      pause (if it holds) softens crude. Passthrough stays live only until a
      Hormuz deal LANDS; ISM prices-paid 3 Aug is the next read.
    since: 2026-07-31

  - theme: india-gold-formalisation
    why: >
      RENAMED from india-duty-grey-market, 1 Aug. Duty hike diverts flow to the
      grey market (6-8% smuggling margins) and pulls physical through Dubai at a
      provenance premium. First counter-move logged: NSE launched Electronic
      Gold Receipts (31 Jul) to formalise the domestic market. Ambiguous for the
      desk — less smuggled volume, but a larger documented market, and
      documentation is Dubai's edge. Watch EGR volumes.
    since: 2026-07-31

  - theme: metals-financialization
    why: >
      Binance gold/silver options after $7bn+ daily metals perps. Thesis was
      that leveraged marginal money would amplify moves. First stress test
      (31 Jul, record momentum crash + forced $45bn liquidation) says that money
      is NOT yet in gold. Constructive counterweight added 1 Aug: Tether bought
      14t in Q2 — a price-insensitive, non-CB, non-ETF holder. Downgraded on
      leverage, upgraded on structural bid.
    since: 2026-07-31

  - theme: gold-basis-lbma-comex
    why: >
      31 Jul printed ~$75 between the LBMA PM fix (4026.6) and GC=F at the same
      clock minute (4101.9), against ~$32 of fair carry at 4.7% and ~2m to
      expiry. UNVERIFIED — one overlapping datapoint, no baseline history in the
      DB. A persistent wide basis is a London/COMEX physical dislocation and is
      directly actionable for this desk; a collapse on Monday means it was a
      data artifact. Track the spread daily until it resolves.
    since: 2026-08-01
