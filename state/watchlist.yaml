watchlist:
  - theme: fed-rate-path
    why: >
      dominant driver of real yields and hence gold. Logan wants a HIKE
      (explicit, 31 Jul); Kashkari/Hammack dissent same direction; Hammack
      13 Aug "acting now really critical". Jul payrolls (-23K, -103K
      revisions) gutted the 57%-priced Sept hike; CPI 12 Aug printed BENIGN
      (core +0.2% m/m, pre-war 2.5% y/y) and PPI 13 Aug FLAT 0.0% m/m —
      passthrough thesis failed both prints, Sept hike odds ~35%. Dovish
      voice joined 13 Aug: Goolsbee "golden path" back to 2%; Barkin "rate
      path unclear". Hike case now gated on core PCE ~28 Aug (wakeup set,
      13:15Z), then Aug payrolls 4 Sep / CPI 11 Sep carrying the second
      oil shock. Prediction ec71ce01: no Sept hike, 0.8. Next read: FOMC
      July minutes Wed 20 Aug 18:00Z (wakeup #30 18:45Z; 540428e8 Sept
      odds stay <50%, 0.7) — June minutes carried "low bar to hiking";
      watch whether July's keeps it against the soft data since. 15 Aug
      tell: Friday soft data (retail −0.6%, UMich 51.0, 1y exp 4.3%)
      sent yields UP with the dollar DOWN — soft data no longer rallies
      bonds; watch into Jackson Hole. 17 Aug: minutes date CORRECTED to
      Wed 19 Aug 18:00Z (repaired feed; wakeup #30→#32); Goldman frames
      the debate inflation-dominant, labour "not that interesting" — a
      ~35%-priced market is exposed if July's minutes keep June's
      "low bar to hiking". 20 Aug: minutes wash — actionforex "more hawks
      than the 9–3 suggested, but July already stale"; no odds repricing
      overnight (540428e8 definitive Thu 20:00Z). NEW risk channel: the
      Bessent buyback eases financial conditions — DB floats a Fed hike;
      hawk-ammunition watch into Jackson Hole (Warsh Fri). 21 Aug: the
      ammunition materialized — buyback calm broke in ONE day, rout
      restarted; Daly/Musalem jointly flag credibility concerns while
      splitting on policy. 22 Aug CALENDAR FIX: core PCE is WEDNESDAY
      26 Aug 12:30Z (cons core +0.2%/3.3% — benign would seal ec71ce01),
      NOT Friday; Warsh keynote Fri 28 Aug (wakeup #39) now pairs with
      the BLS payroll benchmark revision (~-100K expected, upside risk)
      instead of PCE. WF preview: framework speech, no reaction function
      (1a08ec53). Minutes cohort closed: 540428e8 HIT, odds never neared
      50%.
      26 Aug: hawk bench deeper than the 9-3 vote — FOUR regional Fed
      banks sought a discount-rate HIKE ahead of the July hold
      (minutes-adjacent disclosure). PCE gate is TODAY 12:30Z (cons
      core +0.2%/3.3%; #38 reads). Second-order: the overnight oil
      slide (de-escalation tape) drains passthrough ammunition for the
      Sept prints if it holds.
      28 Aug (keynote day): agenda published, slot confirmed 14:00Z +
      BLS benchmark revision + revised UoM same slot (#39 reads all).
      Previews unanimous Warsh skips Sept/Dec signals (1a08ec53 base);
      split on display into the slot — "officials flag inflation risks"
      recap vs Collins "gradual disinflation" pushback. Sleeper: a
      small/upward benchmark revision restores a hawk labour alibi
      into 4 Sep payrolls.
      1 Sep: odds ~57% (from ~40% a week ago) — Warsh hardened at G20
      ("secular stagnation is a thing of the past"), 10y 4.75% three
      straight up days; Bessent SAME DAY on CNBC: Fed traditionally
      doesn't hike into a supply shock — Treasury-vs-Fed now explicit on
      the hike itself. 021357a6: odds stay <65% pre-NFP (0.6); its miss
      fires the stance flip. Gates: ISM prices-paid today (#44,
      951d8286), NFP Fri (#42, feed-verified 12:30Z).
      2 Sep: odds ~70% (021357a6 MISSED, flip fired 1 Sep 19:00Z scan);
      10y tagged 4.80% — war risk failing to stop the gold selloff, rates
      desk driving THROUGH the war desk. UBS rate-cut thesis "tougher
      test" (investinglive). No USD high-impact data before NFP
      (ADP/claims/ISM services all medium). New: 16085af9 (odds >=60% at
      the print, 0.6).
      3 Sep: odds ~66% (CME FedWatch via investinglive), off ~70%;
      Williams: yield surge = strong economy, not distress; 10y 4.80%
      flat while gold +3% on yen/war — the rates desk was outbid
      overnight without yields moving. 16085af9 on track; 031e3470 (no
      settle >4457 thru 3 Sep) printing 4472 intraday, settle is the
      test. WSJ war-over thread is the odds-DOWN risk (oil premium off).
    since: 2026-07-31

  - theme: central-bank-gold-buying
    why: >
      structural demand floor; watch monthly reserve reports. 18 Aug: Saxo
      counts 289t of CB demand and gold ETF inflows resumed — the two
      buyer classes converging. Flow-side twin: China's Treasury holdings
      fell to $633.4bn in June, lowest since Sep 2008, −13% y/y (TIC via
      ING) — reserve diversification out of USTs is the same trade as CB
      gold accumulation. Watch next TIC (mid-Sep) + WGC monthly. 21 Aug
      COUNTER-SIGNAL: Russia's CB — once the top buyer — is now a steady
      SELLER (investinglive); first named crack in the floor narrative.
      Net effect check at next WGC monthly before trimming theme weight.
      2 Sep: Schroders turns MORE bullish on gold citing CB buying —
      first named institutional dip-buyer of the ~8.6% drawdown from
      4750; watch whether the CB-demand floor shows in the tape around
      4300 into NFP.
      3 Sep: Dutch central bank moved 86t from US/Canada custody to
      London citing 'geopolitical unrest' (Gulf News, forexlive) — a
      custody vote, not new demand, but a G10 CB re-domiciling away from
      the US is the reserve-diversification reflex in physical form.
      Watch for other Europeans following; WGC monthly still the demand
      check.
    since: 2026-07-31

  - theme: warsh-credibility
    why: >
      debasement channel; best explanation for gold holding $4,000+ against a
      2.4% real yield. Jackson Hole late August is the set piece. Adjacent
      feeds: yen 158 despite BoJ debating faster hikes; PBOC weak yuan fix +
      SGE gold +5.8% w/w in CNY (10 Aug) — local-currency debasement bids
      are broadening. Cook-firing push renewed 7 Aug keeps Fed-independence
      risk armed. 17 Aug: PBOC fix 6.7873 vs 6.7382 est (deliberately weak)
      + July data release DELAYED (weakness tell) + Securities Daily warns
      retail off chasing gold at highs — debasement broadening while
      officialdom leans against the domestic gold bid; watch SGE premium.
      Japan Q2 GDP missed but BoJ Sept alive (split reads); Japan CPI Fri
      21 Aug the next leg (0deccd97: no USDJPY close <157 thru Fri, 0.6).
      18 Aug: the debasement confirmation printed — 30y 5.32% (highest
      since mid-2007), TLT lowest since 2004, $72bn June foreign UST
      liquidation (ING), USDJPY 159.5 monthly high with intervention grip
      gone — and gold HELD. ING: the administration's Iran-soothing
      rhetoric that capped prior 10y moves >4.65% is absent post-truce.
      PBOC fix 6.7905 vs 6.7452 est (second straight weak fix); LPR
      surprise-cut watch Thu 20 Aug (31c34147, hold 0.65); SGE premium
      compressing (−2.6% w/w CNY) while state media leans on retail.
      Jackson Hole 21–23 Aug: hype outrunning Warsh's say-little playbook
      (investinglive) — a nothing-speech is itself a repricing risk.
      19 Aug: PBOC THIRD consecutive deliberately weak fix (6.7854 vs
      6.7421 est) into Thu LPR (31c34147); Japan machine orders +16.9%
      y/y beat feeds the BoJ-normalization side into Fri Japan CPI
      (0deccd97 safe, USDJPY 159.4). Kospi −5% sidecar halt on Wall St
      spillover — if equity stress spreads while TLT keeps failing as
      refuge, gold is the residual haven (flow channel, GVZ 24 unpriced).
      20 Aug: LPR HELD (31c34147 HIT) but FOURTH straight weak fix at the
      WIDEST gap (6.7808 vs 6.7196 est) — debasement without a cut;
      breadth confirmed: BTC ~$70k +8%, ETH +20%, US debt $40tn headline;
      senators question Warsh's calendar gaps (independence thread) into
      his Jackson Hole slot; CNBC flags China bonds defying the global
      yield surge — a competing diversification sink. 21 Aug: Japan CPI
      core 1.8% in line / core-core 1.9% BROADENING + flash PMI strongest
      since Feb → BoJ seen at 1.25% in Sept — yet USDJPY ROSE to 158.96
      (0deccd97 safe); yen pillar holds, BoJ 17–18 Sep the erosion risk.
      PBOC FIFTH straight weak fix (6.7817 vs 6.7262 est). Jackson Hole
      OPEN — Warsh keynote provisional 14:00Z today, wakeup #36 reads it;
      stance event-pending on it.
      24 Aug: PBOC SIXTH straight deliberately weak fix (6.7841 vs 6.7248
      est, ~590 pips); Goldman flags China stimulus risk as growth slips
      further below target — debasement periphery broadening while Warsh
      (keynote Fri 28, wakeup #39) inherits the undercut-chair frame.
      25 Aug: PBOC SEVENTH straight weak fix at the widest gap yet
      (6.7852 vs 6.7219 est, ~633 pips; "leans hardest against yuan
      gains in six months"). Yen pillar stress-tested in advance: BoJ
      Sept-hike odds ~80% (ex-board member sees Sept + Jan) yet MUFG
      sees yen risk skewed WEAKER and USDJPY sits 159.3 — a near-fully-
      priced hike that cannot lift the yen (new claim: no close <157
      thru 4 Sep, 0.65, successor to 0deccd97). Japan floating retail-
      JGB tax incentives (Katayama) — domestic-absorption tell.
      26 Aug: HAWKISH TAMURA replaces Ueda at Jackson Hole (messaging
      venue upgrade for the normalization side); BoJ seen at 1.25% in
      Sept with yen weakness itself accelerating the timeline; July
      services PPI +3.6% beat (3.2% exp). USDJPY 159.0 regardless —
      b6450c7a intact; Tamura at JH Thu-Sat is the named near-term
      pillar risk, Tokyo core CPI Fri 03:30 Dubai the data leg.
      27 Aug: Himino (hawk) pre-JH — rates "should keep rising," weak yen
      itself feeding inflation, upside risk growing; USDJPY 159.3 REGARDLESS
      (pillar holds, b6450c7a intact; Tokyo core CPI tonight 23:30Z). PBOC
      EIGHTH straight weak fix (6.7840 vs 6.7261 est, ~580 pips). BoK second
      straight hike to 3.00% — tightening periphery vs immovable yen is the
      debasement signature. Cook publicly denies fraud/removal grounds
      (independence thread live into Warsh Fri); KC hawk Schmid booked on
      Fox Business during the KC Fed's own symposium.
      28 Aug: Tokyo CPI headline 1.9% in line, core-core UP to 2.0% —
      Sept BoJ case strengthens again, USDJPY 159.45 REGARDLESS
      (b6450c7a intact; signature unbroken). Ueda + Katayama to G20
      (Asheville) with "yen weakness back in focus" — weekend headline
      risk. Periphery keeps tightening around the immovable yen: RBNZ
      hike ~unanimous for 2 Sep, RBA hike chatter rising (not odds-on).
      1 Sep: USDJPY briefly >160; Tokyo's ~$96bn FAILED intervention
      effort disclosed late last week; Bessent at G20 pushed Ueda/
      Katayama for BOJ HIKES (NHK) + "orderly yen moves" language — US
      now actively leaning on BoJ normalization; b6450c7a intact, BoJ
      17-18 Sep still the erosion risk. PBOC NINTH straight weak fix at
      the widest gap yet (6.7809 vs 6.7170 est, ~639 pips). RBNZ
      decision tomorrow 06:00 Dubai (Westpac: hike to 2.75%) —
      periphery-tightening-vs-immovable-yen signature test.
      2 Sep: signature test PASSED in textbook form — RBNZ hiked a second
      straight time to 2.75% and NZD FELL (gradual guidance; chief:
      settings "still accommodative"); Australia Q2 GDP beat 0.4% keeps
      an RBA hike in play; Ueda backs further hikes (no comment on Sept
      pricing), hawk Takata wants "nimble" hikes, Bessent publicly
      presses BoJ — USDJPY >160 REGARDLESS (b6450c7a intact). PBOC TENTH
      straight weak fix (6.7829 vs 6.7238 est, ~591 pips). Debasement
      underbid survives even as the rates desk sells gold down.
      3 Sep: PBOC fix 6.7807 vs 6.7167 est — a 640-pip weak fix, widest
      gap of the run; RatingDog services PMI beat on domestic demand.
      Debasement limb supported on the CNY side while the JPY side
      turned (see boj-yen-pillar).
