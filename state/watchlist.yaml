watchlist:
  - theme: fed-rate-path
    why: >
      dominant driver of real yields and hence gold. Logan wants a HIKE
      (explicit, 31 Jul); Kashkari/Hammack dissent same direction; Barkin calls
      the next decision a "close call." Jul payrolls (-23K, -103K revisions,
      AHE +0.1%) gutted the 57%-priced Sept hike; CPI 12 Aug is the hawks'
      comeback shot (decision tree in stance.md). Prediction ec71ce01: no
      Sept hike, 0.8.
    since: 2026-07-31

  - theme: central-bank-gold-buying
    why: structural demand floor; watch monthly reserve reports
    since: 2026-07-31

  - theme: warsh-credibility
    why: >
      debasement channel; best explanation for gold holding $4,000+ against a
      2.4% real yield. Jackson Hole late August is the set piece. Adjacent
      feeds: yen 158 despite BoJ debating faster hikes; PBOC weak yuan fix +
      SGE gold +5.8% w/w in CNY (10 Aug) — local-currency debasement bids
      are broadening. Cook-firing push renewed 7 Aug keeps Fed-independence
      risk armed.
    since: 2026-07-31

  - theme: middle-east-risk-premium
    why: >
      COMPRESSED 10 Aug to current state — the 1–9 Aug event log lives in
      reports/2026/08/ briefs. Two regimes in force since late Feb/Mar:
      IRGC transit authorisation (Tehran-designated northern route, radio
      hails, drone overflights) vs US blockade enforcing the southern
      corridor (CENTCOM 9 Aug: 53 vessels redirected, 2 disabled, 2
      boarded). Kinetic BASELINE is a priced pattern: repeated
      vessel strikes near Limah/Khasab/Kumzar, usually no casualties —
      JMIC counts 84 confirmed incidents since 1 Mar, threat SEVERE,
      attack "highly likely" (9 Aug); UKMTO 108-26 logged the 8 Aug ADNOC
      hit (1 crew killed + 20 injured earlier in the ADNOC fleet's week).
      Gold shrugs the baseline in both directions; only beyond-baseline
      arms the tail (mass casualties, US-asset loss, Saudi/UAE
      energy-infra hit — Jazan 9 Aug was contained/Houthi). OPEN: unverified
      10 Aug X-sourced claim of cruise-missile tanker-ablaze on the
      southern corridor + MQ-9 downed — first scan checks verification.
      Physical: traffic ~7% of pre-war (8 cargo + 2 tankers on 8 Aug vs
      ~138/day 2025); mines + GNSS interference; ~6,000 seafarers
      stranded; hostile-vessel bar (since 28 Feb) reroutes more tonnage
      than any fee layer. Diplomacy: Iran-Oman corridor talks (60-day
      outline, inbound-Iran/outbound-Oman, zero-fee shape) BUT Iran
      attached seven maximalist conditions (9 Aug, SNSC chief Zolghadr;
      IRGC: conditions, not talks, decide) — an Iran-Oman text is
      officially NOT a reopening, so the bearish-tail payload keeps
      shrinking. Trump "low keying it" (9 Aug). Base rate: five halt
      announcements, all broken; announcement-timing predictions 0/3
      last week. Premium unwinds only on a signed, co-confirmed,
      normalization-verified text. Structural default: 3353195f (no
      co-confirmed text by Thu 13 Aug). Red Sea is a separate axis:
      Houthis widening the blockade, Bab el-Mandeb ~27/day vs 61
      historical.
    since: 2026-07-31

  - theme: energy-pce-passthrough
    why: >
      June core PCE 3.3% was flattered by energy -5.9% / gasoline -9.2%, which
      the BEA attributes to a temporary Middle East easing that has since
      reversed. Direction now whipsaws with the Hormuz deal tape (crude -8%
      w/w on corridor hopes into 8 Aug, then +2% at the 10 Aug reopen as
      hopes drifted); resolution needs a LANDED deal, not headlines.
      Sell-side split marks the range: Citi Q3 Brent $80 ("war drags on")
      vs Goldman sub-$70 (10 Aug). ISM prices-paid 71.1 on 3 Aug (from
      73.0, first easing; prediction 951d8286: Aug < 71.1). CPI 12 Aug is
      the first hard read of the July passthrough; then Aug ISM ~1 Sep.
    since: 2026-07-31

  - theme: india-gold-formalisation
    why: >
      RENAMED from india-duty-grey-market, 1 Aug. Duty hike diverts flow to the
      grey market (6-8% smuggling margins) and pulls physical through Dubai at a
      provenance premium. First counter-move logged: NSE launched Electronic
      Gold Receipts (31 Jul) to formalise the domestic market. Ambiguous for the
      desk — less smuggled volume, but a larger documented market, and
      documentation is Dubai's edge. Watch EGR volumes.
    since: 2026-07-31

  - theme: metals-financialization
    why: >
      Binance gold/silver options after $7bn+ daily metals perps. Thesis was
      that leveraged marginal money would amplify moves. First stress test
      (31 Jul, record momentum crash + forced $45bn liquidation) says that money
      is NOT yet in gold. Constructive counterweight added 1 Aug: Tether bought
      14t in Q2 — a price-insensitive, non-CB, non-ETF holder. Downgraded on
      leverage, upgraded on structural bid. Adjacent: net spec +9.5% w/w and
      UBS $5,000 target (near-term risk flagged 9 Aug) — the crowding is in
      futures, not perps, for now.
    since: 2026-07-31
