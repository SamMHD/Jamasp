      trigger. Iran enforcement formalizing: the UAE-linked seizure is
      NAMED — Amara, 47,931 dwt, Liberia flag, ballast for Jebel Ali,
      held near Larak Island; Iran explicitly cites unpaid "service
      fees" (first time this cycle); Windward: first confirmed seizure
