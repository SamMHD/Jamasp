watchlist:
  - theme: fed-rate-path
    why: dominant driver of real yields and hence gold
    since: 2026-07-31
  - theme: central-bank-gold-buying
    why: structural demand floor; watch monthly reserve reports
    since: 2026-07-31
  - theme: warsh-credibility
    why: >
      debasement channel; best explanation for gold holding $4,000+ against a
      2.41% real yield. Jackson Hole late August is the set piece.
    since: 2026-07-31
  - theme: middle-east-risk-premium
    why: >
      re-escalating as of 31 Jul — Iran says it is stopping ships in Hormuz,
      reversing the improving-traffic read. The haven bid stops draining while
      the inflationary drag on the Fed stays. Watch how many ships and for how
      long: Iran issued a similar warning 25 Jun without a durable stoppage.
    since: 2026-07-31

  - theme: energy-pce-passthrough
    why: >
      June core PCE 3.3% was flattered by energy -5.9% / gasoline -9.2%, which
      the BEA attributes to a temporary Middle East easing that has since
      reversed (crude +~20% on the month). July/August prints should be worse.
      This is now the central event for the Fed path, ahead of the FOMC itself.
    since: 2026-07-31
  - theme: india-duty-grey-market
    why: >
      duty hike diverting flow to grey market (6-8% smuggling margins); pulls
      physical through Dubai and prices documented, traceable supply at a
      premium. Directly desk-relevant.
    since: 2026-07-31
  - theme: metals-financialization
    why: >
      Binance gold/silver options after $7bn+ daily metals perps. Thesis was
      that leveraged marginal money would amplify moves. First stress test
      (31 Jul, record momentum crash + forced $45bn liquidation) says that money
      is NOT yet in gold — it held while everything levered was sold.
      Downgraded, not dropped; re-test if the unwind resumes.
    since: 2026-07-31
