      Saudi ships targeted/blocked in Bab al-Mandab (Houthi tally,
      unverified — a64b23c1 scoring is #31's).
      20-21 Aug adds: PRE-MIDTERM OIL CAMPAIGN disclosed (senior Iranian
      official, extracted) — declared targets: Yanbu + Fujairah bypass
      terminals (~5.5 mb/d) + shadow-fleet support network (~5 mb/d -> 0);
      stated chain crude -> pump (2-4wk lag) -> CPI -> midterm votes;
      Ghalibaf adviser Shakeri ON RECORD ("raise the tension level,
