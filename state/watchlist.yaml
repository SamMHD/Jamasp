watchlist:
  - theme: fed-rate-path
    why: >
      Real yields are gold's dominant driver, and this Fed just HIKED: 16 Sep
      +25bp to 3.75-4.00%, 12-0, statement with no guidance sentence
      ('timelier return to 2 percent'); dots one more in 2026 (median 4.1; 16
      of 18 see >=1 more, 4 see two, 2 stop), 2027 4.1, LR 3.2; PCE 3.7 / core
      3.4, U 4.1. Warsh: conditions 'not restrictive', 'inflation is too
      high', 'commodity prices bear watching' (oil = upside inflation risk),
      'won't prejudge', hike = 'removing accommodation'. Pricing: Oct hike
      38 -> 55-58%, 33bp for the year. 17 Sep: the STREET moved to the
      hawkish side of the dots, not the dovish - Goldman dropped 'one and
      done' and now sees OCTOBER (neutral 3.25 from 3.06), TD Oct + Jan,
      GSAM/JPM/MS December; the market's four hikes vs the Fed's two is
      resolving toward the market, which weakens the 'convergence to the
      dots = yields down = gold up' path. Tape: GC 4386 -> 4301 (-1.9%)
      through the presser, 2y 4.60 -> 4.73, DXY 99.7 -> 100.34 (first close
      above 100 this cycle), 30y BID 5.35 - front end and dollar, not term
      premium. Overnight 17 Sep: GC 4296.7 tick -> 4354.9 -> 4322 with the
      2y FLAT 4.71-4.73 and oil -1.2%: the oil leg alone. Trump 'rates
      should be 1% or less... FAST' hours after the hike - did NOT name
      Warsh, priced as nothing. Claims: 8af1d9b9 HIT / ec71ce01 MISS (16
      Sep); 78317918 (2y no close <4.60 Thu/Fri, 0.55); 1889819a (no two
      consecutive gold-up/2y-up closes through 22 Sep, 0.7); f8b7b030 (no
      settle >4387.3 Thu/Fri, 0.5); a06ae5c5 (DXY close >=100 Thu, 0.55).
      Next gates: Thursday's GC settle vs 4387.3 / 4300 (bearish-rates 65
      or back to 50), first post-blackout Fed speakers (none in the feed
      Thu/Fri), BoJ 18 Sep, Sept CPI mid-Oct.
    since: 2026-07-31

  - theme: central-bank-gold-buying
    why: >
      Structural demand floor: ~289t of official demand this cycle with ETF
      inflows resuming beside it, and reserve diversification out of
      Treasuries as the flow-side twin (China's UST holdings lowest since
      2008; China's reserves rose again in August; UBS 9 Sep keeps its
      long-game call). Custody reflex spreading (DNB 86t to London, France
      earlier; Norway's fund weighing 70% -> 50% government bonds). Counter:
      Russia now a steady seller. The floor: 4300 GC (~4255 spot) - tests 14
      Sep low 4305.9, 15 Sep low 4304.0, and 16 Sep 22:19Z tick 4296.7 (the
      first sub-4300 print since 2 Sep; Yahoo daily close 4301.2, above it).
      Every bounce so far tracked oil coming off its highs, not a buyer at
      the line: the 17 Sep Asia bounce (+58 pts off the tick) came with oil
      -1.2% and the 2y flat, and half retraced within two hours on thin
      liquidity. Floors 7/7 this regime, none has shown the buyer on an
      oil-UP day. Confirms: WGC monthlies net buying through the drawdown;
      a bought dip at 4300 on an oil-UP day. Kills: two consecutive months
      of net official selling. Thursday's settle is the first close-basis
      test since 2 Sep, on a dollar that closed above 100.
    since: 2026-07-31

  - theme: warsh-credibility
    why: >
      The debasement channel - the best explanation for gold above $4,000
      against a positive real yield (DFII10 2.62). 16 Sep: the hike was
      delivered THROUGH the political pressure, 12-0, with Warsh saying
      conditions are 'not restrictive' - credibility-positive; the theme's
      own kill line (a delivered hike that pulls the long end down) printed:
      30y -1.3bp to 5.35 with the 2y +12bp, curve flatter, gold -1.9%,
      dollar through 100. Eleventh inverted session; the tell (gold
      rallying WITH yields) is 1 for / 11 against. 16-17 Sep: Trump's
      tantrum came ('1% or less... LOWER THE INTEREST RATES... FAST!') and
      did NOT name Warsh; gold fell and the dollar rose through it - the
      fiscal-dominance channel needs the tantrum to price as gold UP with
      the 2y UP, and it priced as nothing. Goldman reads Warsh's 'removing
      accommodation' framing as building the case for MORE tightening.
      What keeps the theme at base 15 rather than dead: a Trump move ON
      Warsh that prices as gold UP with the 2y UP (rule 7 caps any timing
      claim). Kills it fully: two consecutive gold-up/2y-up closes NOT
      printing through 22 Sep (1889819a HIT) with the 30y holding below
      5.40. Revives it: a governor publicly calling for a pause, or the long
      end rising on a dollar-DOWN day.
    since: 2026-07-31

  - theme: middle-east-risk-premium
    why: >
      Two regimes: IRGC control of Hormuz transit against a US blockade,
      with open kinetic exchange since 30-31 Aug, and a Red Sea second
      front. The East-West pipeline (Hormuz bypass) is SHUT since 10 Sep
      with two pumping stations damaged and NO repair timeline (three
      oil/security sources, Reuters 17 Sep); Yanbu crude loadings
      suspended 15 Sep; a reported 'half-capacity restart within days' (16
      Sep) is still not on record (dea6f346, to 18 Sep, HIT traj.). Saudi
      workaround: Fujairah STS plus, from 17 Sep, extra cargoes to Asian
      refiners via STS off Oman's SOHAR port - loading capacity
      substituted, barrels gap not closed. Kpler: single-digit Hormuz
      transits; TankerTrackers: bi-directional VLCC traffic; Iran exports
      zero 60 days. DIPLOMACY: Trump 16 Sep - war 'hopefully toward the
      end', 'spoken directly' with Iranian officials; Tehran does NOT
      confirm (Gulf News: 'quite apart from what Tehran has publicly
      confirmed'); Araghchi in Beijing, Wang Yi urges reviving the June
      interim agreement; Axios: Trump to meet GCC leaders/FMs at UNGA Tue
      22 Sep on a 'postwar strategy', day-after plan only after the
      midterms (calendar entry, scan marker, no wakeup). Reuters 16 Sep:
      the US held secret talks with the Houthis, who pledged not to hit
      US/Israeli ships. Salalah postponed 13 Sep, no date; ffd190c0 (Gulf
      does not sign, to 19 Sep, 0.7). 24f8b482 (no co-confirmed track)
      scored HIT 17 Sep; successor 645cc78a (to 22 Sep, 0.7). KINETIC:
      Fox/Yingst via Maritime Executive 16 Sep - four Iranian drones + a
      missile hit a 'US-contracted' vessel near Hormuz, minor injuries
      including US personnel, treated in a GCC state; CENTCOM silent;
      Pentagon database >800 US injured / 18 killed YTD; two Iranian small
      craft destroyed trying to capture a US drone vessel; two-thirds of
      the interceptor stockpile spent. Moved nothing. Houthis hit Saudi
      cities Wed, Saudi jets struck Yemen; Mecca drone (coalition claim,
      Houthis deny); 'Red Line' vow; MBS-Egypt Red Sea talks. Ladder,
      each a named claim: Yanbu HIT (47d2085d, 18 Sep), Kharg/Larak
      INFRASTRUCTURE (010cb839, 19 Sep), Saudi restraint (e0e5cd9c, 20
      Sep), US territory (87e409a7, 18 Sep - the US-casualty named risk
      has now printed), Saudi-linked Red Sea hull (81e84f0c HIT 17 Sep,
      class-scoped; successor 9e629d6e to 23 Sep, 0.6), Pickaxe
      (e87144df, 18 Sep), escorts (a0429ae4, 20 Sep). Markers: an
      Aramco/SPA line on the bypass or Sohar, CENTCOM on the US-contracted
      hull and any territory-class answer, a White House/GCC UNGA readout,
      an Omani/GCC Salalah date, UKMTO names, a Saudi strike beyond Yemen.
    since: 2026-07-31

  - theme: kinetic-transmission-inverted
    why: >
      The war reaches gold as a Fed hike and a margin call, not as a haven
      bid. ELEVEN sessions of evidence (2, 6, 7, 8, 10, 11 Sep, the 11 Sep
      NY close, the 14 Sep reopen, 14, 15, 16 Sep) against one (9 Sep). 16
      Sep added the Fed variant: oil -3% AND gold -1.9% in one session,
      because the presser overrode the chain at 18:00Z; a Fox-reported hit
      on a US-contracted hull with US casualties moved nothing. 17 Sep
      overnight: GC +58 pts off the 4296.7 tick with oil -1.2% (Sohar
      reroute, Trump 'toward the end') and the 2y FLAT - the oil leg
      alone, a bigger gold response than the chain has paid for a
      comparable oil move all month, half retraced in two hours: read as
      short covering under the 50DMA, not demand. The stance's two-session
      test (gold up WITH the 2y up on a close) still unprinted. 10 Sep
      remains the reference escalation session: crude +7%, gold -2%.
      Confirms: another escalation session closing red; a territory-class
      US answer to the US-personnel injury with oil up and gold DOWN. Kills
      it: two consecutive gold-up/2y-up closes, gold UP from a trigger's
      print to the close on an oil-UP session, a supply event traded as
      stagflation (long end up, dollar DOWN, gold up), or hike odds
      falling on a hold leak with gold rising.
    since: 2026-09-09

  - theme: boj-yen-pillar
    why: >
      The yen was a pillar of the debasement bid: USDJPY pinned at 159-160
      after August's failed intervention. That broke 3 Sep (160.4 ->
      155.34) and 7-8 Sep (153.3) on cash earnings +4.7%, Q2 GDP +1.4%,
      Aida expecting a September hike; JGB 10y above 3%; Masu 'further
      hikes needed'; August PPI +7.6%. Westpac: a SLOW descent to 146 by
      end-2028. Bessent 15 Sep: 'for a nominal amount' the Treasury
      signalled support - a $5-10bn show, not a campaign. Post-FOMC the US
      leg is re-armed: 2y 4.72, DXY 100.34, USDJPY 156.06 at 17 Sep 03:30Z
      (window 10-16 Sep low 153.42, high 156.29; 6ddbe426 scored HIT 17
      Sep). Japan's Y1.1tn trade deficit and a fall in machinery orders
      land two days before the BoJ. Slot: feed row 18 Sep 02:30Z decision /
      05:30Z presser vs actionforex 05:30Z/06:30Z; wakeup #56 at 07:30Z
      sits after both. Cons 1.25% from 1.00%; WF: 'markets pricing too
      rapid a cycle'. The common-US-factor regime overrides the bilateral
      leg (10 Sep lesson): a hawkish hike only lifts gold if the US 2y is
      quiet that session. Disorderly tell (USDJPY <150 with Nikkei and BTC
      down together) not printed; Nikkei/Kospi UP 17 Sep on 'expected Fed
      hike and lower oil'. Two-sided for gold: orderly yen-up is
      dollar-down and gold-up near term; a BoJ that can genuinely tighten
      erodes the pillar structurally; a dovish hike snaps the yen back.
    since: 2026-09-03

  - theme: energy-pce-passthrough
    why: >
      The bridge from the war to the Fed: oil into CPI is the live hike-odds
      channel, and in this regime oil is gold's price-setter on non-Fed
      days. 15 Sep settles WTI 105.83 / Brent 108.75 (highest since 19 May)
      on Yanbu + Libya. 16 Sep: -3% on the reported Saudi half-restart. 17
      Sep 00:49Z: Brent 104.59 (-1.2%), WTI 101.29 on the Sohar STS
      reroute (Reuters); CNBC Nov Brent 105.79 / Oct WTI 102.32 at 03:22Z
      (delayed). Nissan Securities: 'easing tensions ahead of next week's
      US-China summit' also capping. Warsh 16 Sep: 'commodity prices bear
      watching' - oil is an upside inflation risk, NOT looked through;
      Goldman's move to October leans on it. Barrels missing: East-West two
      stations damaged, no repair timeline; Yanbu paused; Iran exports zero
      60 days - offset by Fujairah + Sohar STS and escorted exports ~10
      mb/d. Demand side: CICC $100 demand destruction, China data soft,
      copper bear flag, diesel >$6/gal, 30y mortgage >7%, UMich 1y 4.6%.
      Claims: b3adcf1e HIT 16 Sep; 4dfbd1d8 (Sept headline >=0.4, 0.65);
      62c34dbd (core <=0.3, 0.7); dea6f346 (pipeline full flow not
      restored on record, to 18 Sep, 0.65, HIT traj.). Brent 100 is
      support; no cap written (65cd057e lesson); 110 puts 4300 in play
      with a 30y >=5.40.
    since: 2026-07-31

  - theme: us-fiscal-dominance
    why: >
      Treasury's expanded long-dated buybacks (19 Aug) are de facto
      yield-curve control and the market read them as debasement - gold's
      trend regime began as US debt passed $40tn. The tool FAILED IN PUBLIC
      9-10 Sep (30y auction 'poor' at 5.308). Since then bear-flatteners,
      then the FOMC: 2y +12bp, 30y -1.3bp to 5.35 (BID through a delivered
      hike), curve flatter, dollar UP - still not the debasement signature
      (gold up WITH yields printed once, 9 Sep; eleven against). Warsh's
      three reasons for high yields omit deficits; Hogan (B. Riley): the
      10y back above 5% is the market's real focus. Trump's post-hike '1%
      or less' demand + 'we are the Best Credit in the World' is the
      fiscal-dominance rhetoric, priced as nothing on the day. CBO: the
      war has cost $38bn; Pentagon IG: $22bn on munitions; two-thirds of
      the interceptor stockpile spent. No upsizing relayed (52db03df, 0.7,
      to 18 Sep). DXY: closed 100.32-100.34 on 16 Sep, the first close
      above 100 this cycle - 09cb81a7 (no close >=100, 0.6) scored MISS
      17 Sep, right on mechanism (yen/euro-led low), wrong on the
      unmodelled Fed-tone repricer (lesson filed); successor a06ae5c5 (DXY
      close >=100 Thu, 0.55) reads the other side. Watch the 30y vs 5.40,
      TLT, any Bessent line, and whether a long-end sell-off ever again
      comes with gold UP.
    since: 2026-08-20

  - theme: us-canada-trade-war
    why: >
      A tripwire theme, low conviction on magnitude: talks collapsed 23 Aug,
      US 50% tariffs and Canadian retaliation in force; 8 Sep Trump banned
      Canadian autos, dairy and alcohol. 13 Sep: Carney exploring EU
      'associate membership'; 16 Sep: Trump threatens the EU over the
      'hostile' plan (Gulf News) - a realignment headline, no gold
      channel. Canada August CPI 3.0% in line; BoC on hold; 15 Sep Carney
      immediate expensing; 16 Sep Canada Investment Summit C$500bn (mining
      scale gap). Still no haven flow into gold from it. Promote out of
      tripwire status only if US CPI or a Fed speaker names tariffs as a
      driver; prune candidate Monday 21 Sep if nothing reaches gold.
    since: 2026-08-24
