      Iran is being defeated" — de-escalation incentive still absent;
      ING flags the missing soothing rhetoric as a live Treasuries
      mechanism (rates leg of this theme now explicit).
      18-19 Aug adds: MoU dead on BOTH records — Ghalibaf (Speaker + lead
      negotiator) restates the full gate to Parliament (blockade lifted,
      oil sanctions removed, frozen assets released, threats ended) and
      rejects any TEMPORARY ceasefire: permanent settlement or nothing
      (Araghchi: MoU was "end of the war, not a ceasefire"); Trump: "no
      talks or conversations going on, or scheduled", claims strait open.
      Diplomacy vacuum = premium persistent, not event-driven; Brent $91,
      4th day up. Demand-side self-sanctioning broadens: China's largest
      oil shippers abandon BOTH Hormuz and Bab al-Mandab; Iraq backs
