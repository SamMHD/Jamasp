      read by the market as debasement (forexlive: gold's "oversized
      reaction"; BTC/ETH confirm breadth). US debt passed $40tn the same
      week. The channel cuts both ways: DB counts four dollar-negative
      reasons and floats a Fed hike — buybacks ease financial conditions
      and hand hawks ammunition; MarketWatch names the September
      corporate-issuance wall as where the Treasury calm breaks (20y
      already tailed at 5.204%). Predictions: b0c2bfeb (no DXY close
      >=100 thru 28 Aug, 0.6), 3f03ae58 (GC holds 4510 thru Fri, 0.6).
      Watch: buyback schedule/results, long-end auctions, 30y (5.32% =
      mid-2007 high), TLT. 21 Aug: the rout RESTARTED one day after the
      beefed-up buyback (MarketWatch: "short-circuited"; $40tn debt +
      oil); Daly/Musalem credibility concerns; USD slammed in Asia while
      gold/BTC/FX surged — gold rallying WITH yields confirms the
      fiscal-credibility-hedge regime (Currie debasement read; Citi
