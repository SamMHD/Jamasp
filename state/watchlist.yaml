watchlist:
  - theme: fed-rate-path
    why: >
      Real yields are gold's dominant driver, and this Fed is debating a HIKE,
      not a cut. Sept-hike odds ran from ~35% mid-August to 58% at the 4 Sep
      close: August payrolls (+162k, AHE +0.3% in line) removed the labour
      alibi for a hold without arming wages, so the case now rides oil into
      CPI. FOMC blackout from 5 Sep to the 15–16 Sep meeting — only data, oil
      and Treasury reprice it. Gates: PPI 10 Sep, CPI 11 Sep (consensus core
      +0.3%, so a 0.2 print is the downside surprise — a lower benign bar than
      the stance's ≤0.2 gate implies). Kills the hike: core ≤0.2 with oil
      easing. Seals it: core ≥0.4, or passthrough the Fed reads as broadening
      beyond energy.
    since: 2026-07-31

  - theme: central-bank-gold-buying
    why: >
      Structural demand floor: ~289t of official demand this cycle with ETF
      inflows resuming beside it, and reserve diversification out of
      Treasuries as the flow-side twin (China's UST holdings lowest since
      2008). The custody reflex is spreading — the Dutch central bank moved
      86t from US/Canadian custody to London citing geopolitical unrest, a
      vote on where reserves sit rather than new demand. Counter-signal:
      Russia, once the top buyer, is now a steady seller. Confirms: WGC
      monthlies showing net buying through this drawdown, and the floor
      showing in the tape near 4300. Kills it: two consecutive months of net
      official selling.
    since: 2026-07-31

  - theme: warsh-credibility
    why: >
      The debasement channel - the best explanation for gold holding above
      $4,000 against a positive real yield. Warsh chairs a Fed whose
      independence is openly contested while the long end prices distrust: 30y
      near its mid-2007 high, TLT at 2004 lows, foreign UST liquidation. The
      pressure went explicit and broad in the week to 5 Sep (CNBC): the
      President, VP, Bessent and Navarro all publicly opposed a hike; Trump for
      the first time tied tariffs to Fed policy (halt trade with surplus
      countries unless the Fed cuts); Navarro called the FOMC 'clowns'; Warsh
      says none of it touches decisions. Three July dissents for a hike
      (Hammack, Kashkari, Logan) and Warsh's own Jackson Hole line (54% of PCE
      components >3%) are the counterweight. A hike delivered through this
      pressure is credibility-positive and bearish gold via real yields; a hold
      that looks coerced is the debasement case. Breadth is the tell - weak
      PBOC fixes, BTC/ETH rallying on the same tape, a tightening periphery
      circling an immovable core. Confirms: gold rallying WITH yields. Kills
      it: a delivered hike that pulls the long end down, or a visible
      re-anchoring of independence. Blackout means no Fed reply until 16 Sep.
      The yen limb tracks separately under boj-yen-pillar.
    since: 2026-07-31

  - theme: middle-east-risk-premium
    why: >
      Two regimes: IRGC control of Hormuz transit against a US blockade
      (Operation Economic Outcast), with open kinetic exchange since 30-31 Aug.
      The kinetic BASELINE is priced and gold shrugs it both ways. 5 Sep
      crossed two lines at once: Iran fired ballistic missiles at a US carrier
      and destroyer (evaded), and CENTCOM answered on the tanker fleet - Kylo
      destroyed in ballast, Downy disabled off Kharg, Stark 1 off Jask - with
      Cooper/Hegseth on record to 'destroy (and sink)' the fleet if fired on
      again. The IRGC's reply (6 Sep) was a nameless claim on six commercial
      hulls using 'unauthorised' routes plus a 'more severe' warning, no
      independent confirmation. The regime is now ship-for-ship on both sides,
      with US ordnance a hull's length from Kharg's terminals (50+ Iranian
      tankers in the Gulf/Gulf of Oman, ~20 laden and stuck near Kharg; crews
      warned 10 min ahead - casualty discipline held). Beyond-baseline arms
      the tail: a US warship hit with casualties, ordnance on Kharg/Larak
      loading infrastructure, a hit on Yanbu/Fujairah, or a Pickaxe strike.
      Two corrections keep it mispriced: throughput ~two-thirds of pre-war
      (Gulf News) to 8-9 mb/d (DoE) with most traffic AIS-dark under escort, so
      the oil premium is tail-priced, not disruption-priced; inventories drawn
      to no cushion, so a real hit transmits convexly. Diplomacy is a vacuum:
      Iran's gate is unchanged and Trump is drafting a post-war 'much bigger'
      regional plan (Axios, weeks away) while escalating - he wants the war
      ended, not expanded, which is the minimisation script's structural form,
      not a war-over declaration; the premium unwinds only on a signed,
      co-confirmed text. Gold has repeatedly ignored this tape: the war is the
      floor, not the driver. Live markers: the IAEA Board referral vote in
      Vienna this week, escort suspension, Houthi movement toward Bab al-Mandab
      (second chokepoint, a warning not an event), Trump's wording.
    since: 2026-07-31

  - theme: boj-yen-pillar
    why: >
      The yen was a pillar of the debasement bid: USDJPY pinned at 159–160
      after August's failed intervention meant carry and fiscal absorption
      outweighed BoJ normalisation, and gold's floor leaned on it. That broke
      3 Sep — 160.4 to 155.34 in a session on hawkish BoJ officials, GPIF
      speculation and Waller, then 156.3 on 4 Sep, with no MoF or BoJ
      intervention ever confirmed. Two-sided: yen-up is dollar-down and
      gold-up near term, but a BoJ that can genuinely tighten erodes the
      pillar structurally. The tail is a disorderly unwind of the ~$103bn yen
      short (JPMorgan; USDJPY 142 in scope) — an Aug-2024-shaped liquidity
      event that would sell the crowded gold long with everything else. Gates:
      155.34 holding, labour cash earnings and the Q2 GDP revision 8 Sep, PPI
      10 Sep, the BoJ 17–18 Sep.
    since: 2026-09-03

  - theme: energy-pce-passthrough
    why: >
      The bridge from the war to the Fed: oil into CPI is the live hike-odds
      channel. Crude ended the week at three-month highs (WTI 91.3, Brent ~96)
      with US diesel at a record - driven by blockade barrels (Iranian exports
      1.7 mb/d to ~260 kb/d) and war-risk insurance, not by strikes. The 5 Sep
      US strikes on Iranian tankers (one off Kharg) add a proximity premium,
      but those barrels were already blockaded, so the direct supply effect is
      small; transmission is insurance and escalation risk to Kharg terminals.
      August CPI on 11 Sep is the test: consensus headline +0.4% m/m and 3.4%
      y/y, core +0.3% and 2.5% (Wells Fargo 0.40 headline, 0.23 core). Energy
      is the whole headline story; CORE decides the hike, and the ECB's read -
      energy is 90% of the 2026 episode with no core spillover yet - is the
      benign case; Bessent's line (no hike in a supply shock until second-order
      effects) is the administration's version of it. Supply resilience caps
      spike risk, but with no inventory cushion a real supply hit is convex.
      The premium is fragile to de-escalation talk (dipped to $89 on one Trump
      line); a Russia-Ukraine text (Witkoff/Kushner Moscow 5 Sep, Kyiv 6 Sep,
      three-day capital truce) takes the Black Sea/Ust-Luga floor off it.
    since: 2026-07-31

  - theme: india-gold-formalisation
    why: >
      The duty hike diverts flow to the grey market (6–8% smuggling margins)
      and pulls physical through Dubai at a provenance premium; NSE's
      Electronic Gold Receipts are the formalising counter-move. Ambiguous for
      the desk: less smuggled volume, but a larger documented market, and
      documentation is Dubai's edge. July imports doubled on the WGC's read —
      the physical leg firmed at record prices, formalisation not yet visible
      in the flow data. Watch EGR volumes and grey-market share; that share
      sets the provenance premium.
    since: 2026-07-31

  - theme: metals-financialization
    why: >
      Thesis: leveraged crypto-adjacent money — metals perps, then Binance
      gold and silver options — would amplify gold's moves. Not yet: the July
      momentum crash and forced liquidation showed that money is not in gold,
      and the crowding sits in futures, with net spec positioning stale. The
      structural leg is real — Tether holds ~146t / $18.8bn, the largest
      private holder outside central banks and sovereigns, and has taken 14%
      of Metalla: a price-insensitive standing bid, neither official nor ETF,
      now extending up the supply chain. Confirms the thesis: perps money
      visibly rotating into gold rather than BTC on the same debasement tape.
      Until then it explains part of the floor, not the volatility.
    since: 2026-07-31

  - theme: us-fiscal-dominance
    why: >
      Treasury's expanded long-dated buybacks (19 Aug) are de facto
      yield-curve control, and the market read them as debasement — gold
      flipped into a trend regime as US debt passed $40tn. The tool then
      failed: the rout restarted within a day and the 30y returned to its
      mid-2007 high. That failure STRENGTHENS the theme — conventional tools
      visibly struggling is the point — and it undercuts Warsh's authority
      over rate policy, so the Treasury-versus-Fed conflict deepens whichever
      side wins. The regime signature is gold rallying WITH yields, and it has
      printed repeatedly; Druckenmiller (Treasury 'is suppressing the bond
      market's warning signal') and Barkin ('a reckoning') are on record.
      Counter-tell: price targets have converged (Citi 4,800, Goldman ~4,900,
      JPM 5k, UBS 5,400) — crowding, not information — and on 2 Sep gold was
      sold in a systematic deleveraging rather than bid as a haven. Next
      mechanism test: the first buyback operation 9 Sep, slot still unverified
      in any ingested source. Watch 10y through 4.80, DXY at 100, the 30y and
      TLT.
    since: 2026-08-20

  - theme: us-canada-trade-war
    why: >
      A tripwire theme, low conviction on magnitude: talks collapsed 23 Aug,
      US 50% tariffs took effect, Canada retaliated in kind. It matters as a
      second protectionism front beside the Iran siege economy, feeding the
      de-globalisation and debasement mix that already sets gold's price.
      Passthrough versus growth is resolving toward the growth hit on the
      Canadian side — August employment −41.7k against +15k consensus in the
      same minute the US printed +162k, USD/CAD to 1.3871 — which hands the
      BoC a cut argument. Watch retaliation scope (energy and USMCA
      carve-outs), US inflation-passthrough chatter, and whether haven flow
      shows in gold rather than only the dollar. Promote it out of tripwire
      status only if US CPI or a Fed speaker names tariffs as a driver.
    since: 2026-08-24
