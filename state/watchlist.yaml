watchlist:
  - theme: fed-rate-path
    why: >
      Real yields are gold's dominant driver, and this Fed just HIKED: 16
      Sep +25bp to 3.75-4.00%, 12-0, no guidance sentence; dots one more in
      2026 (median 4.1; 16 of 18 see >=1 more). Warsh: 'not restrictive',
      August PCE estimate ~3.6%. THE REGIONAL CAMP KEEPS ASKING FOR MORE:
      Musalem, Collins, Goolsbee (21 Sep); Collins again 22 Sep ('can focus
      on price stability'); BARKIN 22 Sep 17:00Z (CFA Baltimore): 'the
      risks to inflation outweigh the risks to maximum employment', >60% of
      PCE categories >3%, firms passing costs through, one 'talking-to'
      might not be enough - BUT the cycle 'could be like the Greenspan
      mid-cycle adjustment' (the ~75bp of the mid-1990s): hawkish with a
      ceiling, and homebuilders rallied on it. The two governor/NY slots
      (Jefferson, Williams 22 Sep) were plumbing - no guidance. TAPE: the
      2y auction ($69bn, 22 Sep) cleared at 4.787, 0.2bp tail, grade C -
      the highest 2y since 2024 absorbed supply without stress; the curve
      closed UP 1.5-2.3bp (CNBC: 5y 4.842, 10y 4.967, 30y 5.303) on a
      session with Brent -1.1% and a co-confirmed US-Iran round - THE FRONT
      END DOES NOT FOLLOW OIL DOWN (look-through closed on the record:
      Schmid, Kashkari, the trio, Barkin). 2y close 22 Sep not retrievable
      (CNBC US2Y blank). PRICING: Oct 'just over 50%' (investinglive
      13:38Z 22 Sep, no later relay); BofA keeps Oct + Dec; Deutsche Bank:
      markets underprice the global hiking cycle. Checkpoints: 2y
      4.791-4.800 (break = 5.055 projection; rejection then <4.600 =
      reversal); DXY 100.02 / 100.58 / 101.80. Flip line (governor endorses
      Oct -> bearish-rates 60; pause call -> base 30) untriggered. SPEAKERS
      (ff_calendar, Low, todo-188): BARR Wed 23 14:05Z (wakeup #59, venue
      check first - Board index shows only second-chance lending and AI);
      Williams 08:10Z, Barkin 12:30Z, Hammack 12:50Z, Paulson 14:10Z Thu;
      Williams 09:15Z, Hammack 18:00Z Fri. Claims: fc5c5a29 (no 2y close
      <4.60 through 25 Sep, 0.55); 4872cd75 (Oct odds relay >=45% through
      Fri, 0.55); 1a513d72 (no relay >=60% through Wed 23:59Z, 0.55 - the
      Barr risk); d8e247ef (no consecutive both-up pair through Mon 28,
      0.7 - Tue was row-flat, not both-up). Next gates: Barr Wed; US flash
      PMI prices-paid Wed 13:45Z; Sept CPI mid-Oct; 28 Oct FOMC.
      24 SEP BRIEF: THE FLIP FIRED WED (weights 15/60/25). Flash PMI
      composite 58.4 (input costs highest since Oct 2022) + Barr ('in my
      base case, further policy adjustments are likely to be needed') ->
      October 65% at the wrap (74% intraday, '94bp more from here'); 2y
      CLOSED 4.895 (+12bp, CNBC), 10y 5.114 (2007 high), 30y 5.402 (first
      close >=5.40), DXY 101.12; gold row -1.74%. 1a513d72 MISS (the >=60%
      relay came from the PMI post at 13:51Z). Live: 6e168240 (2y >=4.80 Wed
      HIT, Thu leg), 1e91793f (no relay <55% Thu-Fri, 0.55), 4872cd75
      (>=45%), fc5c5a29 (no close <4.60). Thu: SNB 07:30Z, Williams 08:10Z
      (venue not on the NY Fed index), claims 12:30Z cons 200K, Barkin
      12:30Z, Hammack 12:50Z, Paulson 14:10Z; Fri Williams 09:15Z, Schmid
      13:20Z, Hammack 18:00Z - all regional presidents, no governor, scan
      markers only. Flip-back: a relay <55% or claims >230K with a Williams
      pause call -> bearish-rates 50.
      25 SEP BRIEF: WEIGHTS HELD 15/60/25. Thursday broadened the chorus and
      the market ran ahead of it: OCTOBER 77.5% (actionforex relay of fed funds
      futures 09:16Z; the Americas wrap carried NO odds sentence). Williams
      (London Macro Policy Forum): another 2026 hike 'reasonable', would not
      commit to October, forward guidance 'over', economy 'resilient to the
      rise in energy prices'; Hammack: risks 'tilted to the upside', an
      'inflationary mindset' risk from repeated shocks; Paulson (voter):
      'some modest further tightening may be warranted'. Claims 197K, new-home
      sales 684K. 2y closed 4.895 (CNBC) / 4.916 (wrap), 10y 5.163 (2007 high),
      30y 5.460 (2004 high). 6e168240 HIT (both legs). Live: 1e91793f (>=55%)
      and 4872cd75 (>=45%) close Fri on HIT trajectories; fc5c5a29 closes Fri;
      new 86f87a36 (no 2y close <4.80 Fri-Tue, 0.55). Fri speakers: Williams
      09:15Z (again), Schmid 13:20Z, Hammack 18:00Z - no governor; the 28-29
      Sep Fed schedule is not yet in the feed. Flip-back unchanged: a relay
      <55% or a governor pause call -> bearish-rates 50. NFP 2 Oct: wakeup #61.
    since: 2026-07-31

  - theme: central-bank-gold-buying
    why: >
      Structural demand floor: ~289t of official demand this cycle with ETF
      inflows resuming beside it, and reserve diversification out of
      Treasuries as the flow-side twin (China's UST holdings lowest since
      2008; UBS 9 Sep keeps its long-game call; Goldman 18 Sep keeps $5,400
      through the hike). Custody reflex spreading (DNB 86t to London,
      France; Venezuela weighing $4bn London -> US). SGE 942/g (20 Sep).
      Counter: Russia a steady seller; a research house (investinglive 23
      Sep) expects further Q4 declines on dollar + hawkish Fed but a 'firm
      floor around $3,800' from geopolitics and official buying. The floor
      in practice: 4300 GC (~4265 spot) - tests 14 Sep 4305.9, 15 Sep
      4304.0, 16 Sep 22:19Z tick 4296.7, then the retrace to 4424.9 Fri 18
      Sep; 22 Sep low 4335.0 held on Trump's 'annihilate or deal' + Brent
      back to 100, then row 4402.2. d571e0f0 HIT 23 Sep - FLOORS 9/9 this
      regime, all written 0.55 (calibration gap, rule 20 distance logic),
      and EVERY bounce tracked oil off its highs or a yields-down session;
      still no bought dip AT the line on an oil-UP day. Tenth test live:
      717f560c (no GC_CLOSE row <=4300.0 Wed 23 - Fri 25 Sep, 0.55; 73 pts
      under spot, 0.43x the three-session range). Confirms: WGC monthlies
      net buying through the drawdown (wgc feed still 503); a bought dip
      at 4300-4340 on an oil-UP day. Kills: two consecutive months of net
      official selling.
      24 SEP: Goldman trims end-2026 to $4,650, keeps $5,400 for 2027
      (investinglive ICYMI) - the sell side accepts the near-term rates
      regime. Floor test ten live: 717f560c survived Wed (row 4325.5);
      overnight low 4309.0 at 02:06Z, nine points off the line, on a session
      with the 2y flat - no bought dip visible, the bounce to 4324 came with
      Brent -1% on the roadmap report. SGE 936.61 (21 Sep); China shut Fri +
      Golden Week next week, so the physical read goes dark.
      25 SEP: floor test ten - Thu row 4309.5 (survived), but the TICK low
      was 4282.9 at 15:35Z on an oil-UP session with the 2y flat (below 4300 on
      the tick, not the row basis; noted as such). The bounce off the low came
      on the 16:18Z phased-deal report (Brent -3) and overnight on Brent -1% -
      oil-DOWN bids, still no bought dip AT the line on an oil-UP day. XAU PM
      fix 4266.4, AM 4255.55. 717f560c's last session is Fri. China shut Fri
      (Mid-Autumn) and 1-8 Oct (Golden Week): SGE dark, physical read gone for a
      week - a thin bid under any test of 4300.
    since: 2026-07-31

  - theme: warsh-credibility
    why: >
      The debasement channel - the best explanation for gold above $4,000
      against a positive real yield (DFII10 2.62, 21 Sep). 16 Sep: the
      hike was delivered THROUGH the political pressure, 12-0 - the
      theme's own kill line printed (30y -1.3bp with the 2y +12bp, gold
      -1.9%, dollar through 100). 18 Sep: the tell printed ONCE (gold
      +0.96% with the 2y +6.6bp, 10y 5.00, BTC +6%). 21 SEP - THE ANTI-
      TELL: gold -1.0% (Globex) with the 2y +0.75bp, 10y -4.5bp, 30y
      -4.7bp, DXY +0.1, BTC +7.1% and a Nasdaq record - the flow went to
      BTC and AI equities, NOT gold. 22 SEP: the SHAPE of the tell on spot
      (+22 to 4364 with the curve +1.5-2.3bp, 30y 5.303) but a FLAT row
      (4402.2 vs 4401.3), the dollar softening late and BTC 86.5K (+14%
      on the week) beside a Nasdaq record; overnight gold gave the $22
      back tick for tick with DXY 100.54 -> 100.69. Read: a dollar move,
      not a debasement bid. Tell 2 for / 15 against. 1889819a HIT
      (successor d8e247ef, 0.7, through Mon 28 - Tue not both-up on the
      row basis). Base stays 20 as the residual weight; 15 if d8e247ef
      also runs clean. Confirms (base 30): two consecutive both-up rows
      WITH the 30y up; a 30y close >=5.40 with gold UP (aec5cc8b HIT - it
      did not print); gold +1% on an oil-DOWN session with the 2y flat.
      A Trump move ON Warsh priced gold-up/2y-up is the other confirm
      (rule 7 caps timing).
      24 SEP - THE ANTI-TELL AGAIN, ON THE LONG END: the 30y CLOSED 5.402
      (first >=5.40) with gold -1.7%, DXY +0.5 and BTC -2.6% - the long-end
      break the theme needed, traded as Fed not debasement; the flow went to
      the dollar. Tell 2 for / 16 against. Base 15. d8e247ef live (Wed row-
      DOWN, no pair before Thu-Fri).
      25 SEP - ANTI-TELL 17 AGAINST / 2 FOR: the 30y CLOSED 5.460 (2004 high),
      the 10y 5.163 (2007 high), after Treasury's SECOND buyback in two weeks
      and a 7y tail - and gold fell 0.3% with DXY +0.2 and BTC flat. The
      long-end break is global (Bund 17-year high, JGB 10y highest since 1996)
      and priced in the dollar's favour. CNBC: 'surging yields pose a brand
      new problem for Warsh'. Base 15. d8e247ef live (Thu row-DOWN; a pair
      needs Fri+Mon). Confirm unchanged: 30y >=5.50 with gold UP and DXY DOWN.
    since: 2026-07-31

  - theme: middle-east-risk-premium
    why: >
      Two regimes: IRGC control of Hormuz transit against a US blockade
      with open kinetic exchange since 30-31 Aug, and a Red Sea second
      front that reached RIYADH 19 Sep (Houthi missile, intercepted). 22
      SEP - THE TALKS TRACK OPENED: Araghchi's delegation and Witkoff/
      Kushner completed a mediated round at the UN (Qatar, Pakistan
      shuttling); Trump: ~3 hours, 'productive', another 'soon', but a
      deal 'right after the election' and 'annihilate' as the alternative;
      Witkoff (X): indirect, a round completed, mediation continues; Iran
      state TV: Tehran accepted Witkoff's request, 'strict conditions'
      conveyed; NYT (2 Iranian officials): Araghchi met Witkoff+Kushner;
      Israel Ch.12: no agreement on most disputes; Al Arabiya source:
      'deadlock broken'. Iran's conditions (Tasnim): end of the war on all
      fronts, a south-Lebanon withdrawal timeline, frozen funds, blockade
      and new sanctions lifted, an oil waiver - the old MOU. Fars: the US
      'has not left a red line', ready for all scenarios. Earlier Tue the
      Kyodo 'reopen Hormuz in 7 days' report was denied by Fars. 645cc78a
      MISS (first loss for the family; lesson filed on the format
      qualifier). HORMUZ: last hits Mon 21 Sep (LR Stephanie, Isle of
      Man; an LPG carrier) - neither Saudi-linked; no new hull 22-23 Sep
      (queried); Hormuz AIS transit count 'two' (Investing.com 22 Sep) vs
      Saudi loading ~12m bbl in a day and East-West restarted (partial) -
      the flows moved off-AIS and around the strait. Saudi king at UNGA
      condemned Houthi 'targeting of Mecca' (the earlier drone, no new
      event); France mulls a UNSC Hormuz resolution; EU seeks Red Sea
      assets; UK offers Saudi refuelling. No Trump-GCC readout in the DB
      by 23 Sep 03:30Z (queried, missing). Ladder: Kharg/Larak infra
      d96debd5 (to 26 Sep); Gulf-side regime 2df323fa (to 26 Sep); Saudi
      restraint 33defb45 (to 27 Sep); escorts d4f5ffd6 (to 27 Sep); Saudi
      hull 9e629d6e (closes Wed 23:59Z, HIT trajectory); 0d52e7da (no
      co-confirmed Trump-Pezeshkian meeting or second direct round Wed-
      Sun, 0.65) - MISS trajectory the moment a second round is
      acknowledged by both sides. Markers: a Qatari/Pakistani host line
      with venue+date (-> deepdive wakeup); a Trump-Pezeshkian meeting
      co-confirmed; any US strike order; SPA damage lines; an escorted
      hull stopped with casualties (the ladder's next rung).
      24 SEP: Wed - no second round; senior official (Reuters): Hormuz could
      reopen within a week if the US eases pressure and lifts the port
      blockade, 'many differences'; Rezaei: shut until conditions met; Brent
      settled 103.08 (+3.9%). Overnight: Iran's ROADMAP (Gulf News, regional
      sources, unconfirmed by either government) - ceasefire up to 60 days
      region-wide, PHASED Hormuz reopening, halt to attacks on Arab
      neighbours, timetable for broader talks; Rubio 'open', military
      options retained. TASNIM (IRGC-linked): the Araghchi-Witkoff contact
      was 'not authorised' by policymaking bodies; MFA: Qatari-mediated,
      conditions conveyed - the Iranian mandate is now the gate. Cape Dao
      (23 Sep): unescorted UAE-managed bulker, one Indian seafarer killed,
      no US attribution (dd31b40f live to Fri). 9e629d6e HIT (family 10/10;
      no Saudi-hull successor written - Yanbu loading resumed without a
      maritime answer, the class is holding on the record). New ed8c08b5 (no
      on-record US ceasefire announcement Thu-Sun, 0.7). Blockade: 115 Iran-
      linked ships redirected (Gulf News). Senior IRGC commander killed in
      southeast Iran clashes (internal, not US).
      25 SEP: THE CLOCK. Rezaei (SNSC secretary, via Guardian/Press TV,
      Gulf News 00:36Z): Washington has 'four or five days' to implement
      Iran's conditions 'completely and all at once' - no Hormuz reopening, no
      negotiations until the US acts; 'Talk is enough. Now we must act';
      'next step' decided after the deadline (lands ~Mon 28-Tue 29).
      Parliament REGISTERED AN IMPEACHMENT MOTION against Araghchi (Khezrian,
      Sabeti) over the New York contacts - hardliners say the mandate was
      conditions-through-mediators, not direct talks; a senior official had
      told Reuters the delegation had 'full authority'. Reuters (sources,
      16:18Z Thu): negotiators exploring a PHASED deal (Hormuz reopens,
      blockade lifts, frozen assets); an Iranian official: odds 'extremely
      low'; a European official: Iran's list 'very long'. Pezeshkian (NBC):
      wants the June MOU revived BEFORE the midterms, open to nuclear
      inspections, denies plotting against Trump. Rubio: not a major
      breakthrough. Trump: Iran stalls till the midterms. HOUTHI FRONT: six
      ballistic missiles at Taif and YANBU intercepted (coalition/al-Maliki);
      Houthis claim Aramco-Yanbu and Riyadh hits - no SPA damage line
      (adversary-only, rule 12); Macron sends troops, radars, air defence to
      Yanbu; UK confronts Iran; 150+ killed in Yemen fighting over Bab
      al-Mandab heights; Safavi: a Red Sea/Bab al-Mandab front could open.
      Bahrain leads a call for full Hormuz reopening without tolls (2df323fa
      the other way). Hormuz transits 10 Wed (10-day avg ~17, AIS-dark
      excluded). Cape Dao still unattributed (dd31b40f closes Fri). Ladder
      unchanged; new 9083e952 (no co-confirmed arrangement Fri-Tue, 0.7).
      Markers: an on-record US response to the deadline; an SNSC 'next
      step'; an SPA damage line at Yanbu; a host line with venue+date.
    since: 2026-07-31

  - theme: kinetic-transmission-inverted
    why: >
      The war reaches gold as a Fed hike and a margin call, not as a haven
      bid. FOURTEEN sessions of evidence 2-21 Sep, sharpest 21 Sep (two
      tankers hit, oil -3.7%, gold -1.0%, BTC +7.1%). Against: one (9
      Sep). 22 SEP - THE DE-ESCALATION LEG: a co-confirmed US-Iran round,
      Brent settled 99.25 (-1.1%, five down sessions), gold spot +0.5% /
      row FLAT, curve UP 1.5-2.3bp, dollar softened late then firmed
      overnight and gold gave it back. Tape clause on the trigger (rule
      23): printed ~18:30Z, GC 4390 -> 4396 at the Globex close - target
      failed both ways, weights held. THE VALVE: oil UP sells gold (via
      the 2y); oil DOWN on diplomacy leaves gold flat-to-down (its own
      premium drains, the 2y does not follow) - gold's only up-route is
      the 2y DOWN, which needs a governor or a US data break, not a
      headline. Claims: 64c7ba41 UNCLEAR 23 Sep (no oil-UP settle Mon/
      Tue); successor 8e425cab (0.5) runs on the first oil-UP Brent settle
      Wed-Fri (row <+1% = HIT; none = UNCLEAR); f7a0c23d (0.55): no Brent
      settle >=103 Wed-Fri - the premium-drain claim. Confirms: an oil-UP
      settle with gold flat/DOWN; a US strike on Iran priced gold DOWN; a
      co-confirmed text priced oil -5% with gold DOWN. Kills: 8e425cab
      MISS -> kinetic 35; two consecutive gold-up / 2y-up rows; gold +1%
      on an oil-DOWN session with the 2y flat; a supply event traded as
      stagflation (long end up, dollar DOWN, gold up); a text priced
      Brent -5% with gold UP and the 2y flat -> kinetic 25.
      24 SEP: 8e425cab HIT - the first oil-UP settle (103.08, +3.9%) printed
      the gold row -1.74%; FOURTEEN oil-UP sessions closing gold flat/down
      since 2 Sep, one against. Rule-9 discount: the PMI/Barr repricing
      shared the day. f7a0c23d MISS (the premium-drain cap broke in one
      session; lesson: oil levels get the rule-20 distance test). Overnight
      the drain leg: Brent -1% on the roadmap report, gold flat at 4324, 2y
      flat - diplomacy is not a bid. Kinetic 25. Kills unchanged: a
      stagflation print (30y >=5.45, DXY DOWN, gold UP); two both-up rows;
      gold +1% on oil-DOWN with the 2y flat.
      25 SEP: FIFTEENTH oil-UP session closing gold flat/down (Brent +3.4%
      to 106.60 on missiles at Yanbu; row -0.37%). THE CRACK: 16:18Z the
      phased-deal report took Brent -3 and GC +20 (4292.7 -> 4312.1) with the
      2y flat - the first oil-DOWN bid of the regime - faded by 18:00Z; then
      overnight Brent -1% bid gold +24 to 4328.5. Small, but the chain now
      shows both directions intraday. New a270f3f1 (0.55): the first Brent
      -3% settle Fri-Tue does not print a +1% GC row; a MISS with the 2y flat
      -> kinetic 20, base 25 (the drain leg bids gold = the regime is
      loosening). Kills otherwise unchanged.
    since: 2026-09-09

  - theme: boj-yen-pillar
    why: >
      The yen was a pillar of the debasement bid: USDJPY pinned at 159-160
      after August's failed intervention; that broke 3-8 Sep (160.4 ->
      153.3). 18 Sep: BoJ HIKED to 1.25% (highest since 1995), 7-2, no
      timing; Ueda: 'policy phase has changed'; street: one hike per
      quarter, terminal 1.75-2%. Tape: BoJ RATE CHECK at 158.05 - the
      defended line is 158, not 160. 23 Sep: USDJPY 157.62 (window high
      157.94), Tokyo shut Tue/Wed (holiday-week thin tape; CFTC hedge
      funds net LONG yen for the first time since July 2025). Gold takes
      nothing from the yen directly (deepdive #56: the yen reaches gold
      only through DXY; DXY 100.65, +0.26% on 22-23 Sep, was the whole
      overnight gold move). Read with the FOMC: one widening differential,
      both legs dollar-favourable - relative-rate trade, not debasement;
      no other central bank is easing into this (ECB Nagel/Lane 22 Sep,
      SNB Thu cons hold). Open: be4d6b22 (USDJPY no print >=160 through
      Thu 24 Sep 23:59Z, 0.55; 1.5% of room). Next BoJ 30 Oct, two days
      after the 28 Oct FOMC. Flip: >=160 through the MoF = pillar back,
      base 30; <152 with Nikkei+BTC down = liquidity regime.
      24 SEP: USDJPY 157.93 (Wed high 158.36 - through the 158 rate-check
      line intraday, no MoF action reported); Japan flash PMI at a four-
      month low with 'intense' price pressure; actionforex: growth slips
      while the weak yen keeps inflation elevated. be4d6b22 closes Thu
      23:59Z with ~2 yen of room. DXY 101.08 - the yen is not moving the
      dollar; the pillar stays down.
      25 SEP: be4d6b22 HIT - window max 158.949 (Thu 15:16Z), no 160 print.
      Katayama: Trump raised weak-yen concerns with Takaichi, USD/JPY eased
      below 158.50 (158.43 at 03:16Z). Goldman cuts its USD/JPY path to 150
      in a year on BoJ tightening; Daiwa: next BoJ hike December; JGB 10y at
      a 1996 high. The pillar stays down: the dollar is a US-yields trade and
      the yen leg reaches gold only through DXY (101.26). No successor claim
      - the 158/160 test has no gold information while DXY rises on yields.
    since: 2026-09-03

  - theme: energy-pce-passthrough
    why: >
      The bridge from the war to the Fed: oil into CPI is the live hike-
      odds channel, and oil is gold's price-setter on non-Fed days - in
      BOTH directions. 15 Sep settles WTI 105.83 / Brent 108.75 (109.97
      high); FIVE lower settles since: 21 Sep Brent 100.34, 22 SEP BRENT
      99.25 (first sub-100 settle in two weeks; 98.78 at 03:30Z Wed), WTI
      Nov ~89-90.5 (Oct expired 22 Sep) - on Saudi East-West restarted
      (partial, up to 4 mb/d rerouted), Yanbu exports resuming, ~12m bbl
      loaded in one day (Gulf News), Hormuz shuttles/AIS-dark flows, the
      co-confirmed US-Iran round, and an API headline build vs a draw
      expected. PRODUCTS ARE THE TIGHT PART: diesel at records, jet fuel
      following (MarketWatch), Trump endorses a diesel export ban with a
      decision 'fast' (analysts: would hurt, not help). fxempire levels:
      Brent support 97-97.5 then the 50MA 92.44, resistance 102/105; WTI
      support 90.47 then 87.7. THE STANCE'S TEST: Brent <100 with the 2y
      >=4.70 = asymmetry confirmed, bearish-rates holds 50 - PRINTED 22
      Sep (Brent 99.25, 2y auction 4.787, curve UP); Brent <100 AND 2y
      <4.70 = input lost (bearish-rates 45) has not printed. Passthrough
      one-way on the record (Schmid, Kashkari, Musalem, Barkin 'persistent
      shocks embedded in pricing', Warsh PCE ~3.6); abroad the same: ECB
      Nagel 'oil now a key inflation gauge, mildly restrictive not ruled
      out', Lane 'energy shock lasts longer, inflation elevated to mid-
      2027'; Australia flash PMI 50.8 with input costs at a 3-month high.
      Supply chain: East-West partial, Yanbu resuming, Iran zero (CENTCOM);
      Russia diesel export ban extended; BofA raised its H2 Brent forecast
      (Investing.com, unread). Claims: 4dfbd1d8 (Sept headline >=0.4,
      0.65); 62c34dbd (core <=0.3, 0.7); rule-11 midpoint check 30 Sep;
      f7a0c23d (no Brent settle >=103 Wed-Fri, 0.55); 8e425cab runs on
      the first oil-UP settle.
      24 SEP: Brent settled 103.08 (+3.9%) through a 3m bbl crude build
      (gasoline and distillates drew), the East-West restart and Iraqi
      exports >3 mb/d - the premium reprices on Hormuz statements, not
      barrels; 102.10 at 03:30Z. Products: White House 'edging closer' to a
      90-day diesel export ban despite cabinet pushback (earlier WH denial;
      diesel settled marginally lower after the whipsaw); bipartisan
      senators ask for emergency heating-oil releases; record diesel heading
      into grocery prices (MarketWatch). A ban softens the US CPI energy
      line at the margin while tightening the world - the September claims
      (4dfbd1d8 / 62c34dbd) carry it, midpoint check 30 Sep. Asia oil
      imports still 13% below pre-war (Gulf News). The asymmetry test still
      stands: Brent <100 with the 2y >=4.70 confirmed 22 Sep; the 2y did not
      follow oil UP either - it led (PMI).
      25 SEP: Brent SETTLED 106.60 (+3.4%, highest close since 15 Sep; +5%
      at the highs), WTI 94.61 (six-session slide snapped) on Houthi missiles
      at Yanbu/Taif; then -1% overnight on the phased-deal report (105.55 at
      03:31Z). Yanbu is the East-West workaround: investinglive says tanker
      loadings there 'have yet to resume' vs Gulf News 24 Sep '12m bbl in a
      day' - CONFLICT, resolve via gcaptain Sat. Products: Wright sounding
      out refiners on VOLUNTARY diesel export limits (disputes the 90-day-ban
      report); EU warns a ban hurts both sides. Aramco studying a 4th and 5th
      export route. Midpoint check 30 Sep (4dfbd1d8 / 62c34dbd). Aug PCE date
      not in the feed through 26 Sep (Warsh's estimate ~3.6% y/y) - verify
      Sat.
    since: 2026-07-31

  - theme: us-fiscal-dominance
    why: >
      Treasury's expanded long-dated buybacks (19 Aug) are de facto
      yield-curve control and the market read them as debasement - gold's
      trend regime began as US debt passed $40tn. The tool FAILED IN
      PUBLIC 9-10 Sep (30y auction 'poor' at 5.308). 18 Sep: 'bonds slump
      again' - 10y 5.00, 30y 5.328 - and gold ROSE with the dollar flat:
      one session. 21 Sep: the long end RALLIED (30y 5.280) on oil -3.7%
