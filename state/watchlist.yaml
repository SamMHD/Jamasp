  - theme: middle-east-risk-premium
    why: >
      COMPRESSED 10 Aug to current state — the 1–9 Aug event log lives in
      reports/2026/08/ briefs. Two regimes in force since late Feb/Mar:
      IRGC transit authorisation (Tehran-designated northern route, radio
      hails, drone overflights) vs US blockade enforcing the southern
      corridor (CENTCOM 9 Aug: 53 vessels redirected, 2 disabled, 2
      boarded). Kinetic BASELINE is a priced pattern: repeated
      vessel strikes near Limah/Khasab/Kumzar, usually no casualties —
      JMIC counts 84 confirmed incidents since 1 Mar, threat SEVERE,
      attack "highly likely" (9 Aug); UKMTO 108-26 logged the 8 Aug ADNOC
      hit (1 crew killed + 20 injured earlier in the ADNOC fleet's week).
      Gold shrugs the baseline in both directions; only beyond-baseline
      arms the tail (mass casualties, US-asset loss, Saudi/UAE
      energy-infra hit — Jazan 9 Aug was contained/Houthi). Physical: traffic ~7% of pre-war (8 cargo + 2 tankers on 8 Aug vs
      ~138/day 2025); mines + GNSS interference; ~6,000 seafarers
      stranded; hostile-vessel bar (since 28 Feb) reroutes more tonnage
      than any fee layer. Diplomacy: Iran-Oman corridor talks (60-day
      outline, inbound-Iran/outbound-Oman, zero-fee shape) BUT Iran
      attached seven maximalist conditions (9 Aug, SNSC chief Zolghadr;
      IRGC: conditions, not talks, decide) — an Iran-Oman text is
      officially NOT a reopening, so the bearish-tail payload keeps
      shrinking. 10 Aug: talks hit a REPARATIONS WALL — Iran conditions
      reopening on US compensation for 5 months of strikes; Trump
      counter-demands (Lebanon/Syria/Yemen/Gaza), inserted into all future
      talks; IRGC restates full gate (sanctions + blockade + threats +
      compensation); Brent +4.25% intraday, $100-risk talk; 985e77d0 HIT
      (structural family ~7-for-7). Mojtaba's first military reshuffle
      10 Aug: Vahidi IRGC C-in-C, Azmaei IRGC NAVY (the Hormuz operator),
      Taeb Basij, Rezaee to SNSC — hardline consolidation, leader unseen
      (health speculation); doctrine-change watch on the corridor. Sirik
      claims (tanker ablaze / MQ-9 / further launches) still UNVERIFIED
      ~56h on; claim 1d282df6: no confirmation by Thu 23:59Z (0.6) —
      verification arms the kinetic tail. 11-12 Aug adds: US live-fire on
      a Panama-flagged blockade-runner (WSJ; inside baseline, no
      casualties); Rezaei's first SNSC act formalizes Oman-track ≠
      reopening ("shut until US changes behaviour", conditions stand)
      while Qatar/Pakistan talk up progress — oil chops, closes ~$89;
      Hormuz transits ~6/day (~5% of pre-war, half of last week's ~11).
      12-13 Aug: CENTCOM tally 59 redirected (+4 d/d) / 3 disabled / 2
      boarded; WSJ live-fire runner NAMED — Vela Nova, Panama-flagged,
      MH-60 Hellfires to engine room, Gulf of Oman (does NOT score
      0aaec9a2, different event); Trump claims "total control", CENTCOM's
      narrower line = open to neutral traffic only, Iran says still
      blocked; talks deadlocked at the reparations wall. Ladder
      warn->redirect->disable->board operating inside baseline. IEA Aug
      OMR: stocks <7.9bn bbl, thinnest since Apr 2025 — tail payload now
      convex, no inventory cushion.
      13-14 Aug: IRGC attacked TWO ADNOC vessels in Hormuz Thu evening
      (ADNOC/WAM confirmed, no injuries, NO NAMES ~30h on — 71096269,
      window Sat 23:59Z); UAE called it IRGC "piracy", invoked UNSCR 2817.
      US response ECONOMIC-first: Bessent isolation package "like the
      world has never seen" due NEXT WEEK, ports-sealing blockade language;
      no strike talk. CORRECTION: USS George Washington is a planned
      RELIEF of the Lincoln (~200 days no port call, crew-welfare crisis)
      — not a second carrier; net presence ~1. Structural: Saudi-led MMDC
      39-country Jeddah meeting, 13 fully joined, moving to operational
      command; CENTCOM stands up Task Force Falcon Strike (multinational
      one-way attack drones); MBS met Adm. Cooper on de-escalation. Iraq
      axis cooling: Islamic Resistance postponed retaliation for 29-Jul
      US-Saudi strikes (20 killed incl 5 Iranians); first Iraqi security
      visit to Riyadh, KSA "cherished neighbour".
      14-15 Aug: THIRD ADNOC vessel hit in ~48h (Fri evening drone,
      ADNOC-confirmed overnight, no injuries, NO transit halt — freedom
      of navigation reaffirmed, da6f26d5 intact); none of the three
      named ~54h on (71096269, closes Sat 23:59Z); regional condemnation
      chorus (KSA/Kuwait/Qatar/Jordan/Egypt + Arab League) under the
      piracy/UNSCR-2817 framing. Trump rally rhetoric: "declare Hormuz
      US territory pretty soon" (chuckled; Gharibabadi: "cannot be
      seized by tweet... opened and closed only at Iran's command") —
      rhetoric, not doctrine; the REAL signal is Trump urging Americans
      to ACCEPT higher gas prices = de-escalation incentive removed,
      premium persistent; fits the Bessent economic-siege track.
      Lincoln relief confirmed by Trump ("very shortly"), net presence
      ~1. UKMTO weekly: traffic REBOUNDED to 17% of pre-war (151
      vessels/7d, from 4%); 56 damage reports since 28 Feb (excl. the
      ADNOC pair); southern Omani route carries 16/18 projectile
      strikes since 6 Jul; CENTCOM 62/3/2. Premium behaving like a
      toll, not a stoppage — deflates tail payload slightly; the
      ADNOC-targeting streak is the counter-trend (599d9586: weekly
      traffic ≥10% of pre-war at next read, 0.6).
      15-16 Aug: both verification windows closed QUIET — Jizan claim
      HOLLOW (zero Saudi/Aramco confirmation, 8f491cb0 HIT, trigger
      re-cocked); all three ADNOC vessels NAMELESS ~60h (71096269 MISS —
      naming rule degraded on operator-confirmed hits → retro). UAE
      formally attributes all three hits to IRAN (Gargash: dialogue
      prioritized); GCC SecGen Albudaiwi condemns "repeated hostile
      Iranian attacks" (UNCLOS/UNSCR 2817) — attribution now bloc-level
      into the Bessent isolation-package week (cd49c313). Houthi-Saudi
      reframed as collapsed 2022 truce: Yemen govt retaliating after
      Marib camps / Mokha port strikes (a64b23c1, b6794dbb). Israel
      struck Lebanon 16 Aug (headline-only, unverified — watch
      Hezbollah/Iran linkage). Normalization margin: Bandar Abbas
      commercial flights resumed; Cooper closed 10-day 6-country tour
      (coalition maintenance, economic-first posture). UKMTO Friday
      bulk-carrier strike still unresolved — possibly a 4th incident.
      Base rate: five halt announcements, all broken;
      announcement-timing predictions 0/3 that week. Premium unwinds
      only on a signed, co-confirmed, normalization-verified text.
      16-17 Aug adds: the Islamabad-brokered US-Iran 60-DAY MEMORANDUM
      surfaced and EXPIRES 17 Aug — Tehran denies extension talks,
      Pakistani sources claim one agreed 12 Aug (one-sided, unverified;
      4cf94ab6: no co-confirmed extension text by Wed 20 Aug 23:59Z, 0.7);
      IRGC deputy Javani (IRIB): action takes "offensive form" with
      "strategic surprises" under Mojtaba's decrees — doctrine-change
      watch now has on-record language; NB corridor coercion never paused
      under the ceasefire, so lapse ≠ behavior change. Mecca Joint Defence
      Agreement (signed 7 Aug; Trump endorsement 16 Aug): Article-5-style
      Saudi-Turkey-Pakistan bloc atop the Sept-2025 Saudi-Pakistan pact —
      with MMDC + TF Falcon Strike, deterrence architecture consolidating;
      compresses the Saudi-infra tail limb slowly. Bessent package
      (extract): teapot refiners + UAE exchange houses the implementable
      levers; major-Chinese-bank sanctions gated by planned Trump-Xi
      meeting; secondary tariffs lost legal basis (Supreme Court);
      slow-burn read — less likely to provoke sharp response; escalation
      variant = naming major Chinese banks. Hormuz shipping SLOWING
      post-ADNOC-streak (investing.com data); dark-fleet shuttles cap the
      oil spike (Bloomberg) — 599d9586 at risk at Friday's UKMTO read.
      Structural default: 3353195f (no co-confirmed text by Thu 13 Aug).
      Red Sea is a separate axis and turned nastier: Houthi
      Saudi-blockade, *Tihamah* toll 6 incl. a second strike on the
      rescue op (double-tap, 11 Aug), Bab el-Mandeb ~25/day vs 61
