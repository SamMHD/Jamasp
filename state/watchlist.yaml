watchlist:
  - theme: fed-rate-path
    why: >
      Real yields are gold's dominant driver, and this Fed is debating a HIKE,
      not a cut. Sept-hike odds ran from ~35% mid-August to 58% at the 4 Sep
      close: August payrolls (+162k, AHE +0.3% in line) removed the labour
      alibi for a hold without arming wages, so the case now rides oil into
      CPI. FOMC blackout from 5 Sep to the 15–16 Sep meeting — only data, oil
      and Treasury reprice it. 7 Sep: CME ~60% on the Asia read (not a NY
      close); Goldman says inflation data, not jobs, decides; UBS now calls
      two hikes. Monday 7 Sep had no NY close (Labor Day); gold traded the
      yield leg (Bunds +5bp on oil) rather than the dollar leg, so the rates
      desk is confirmed as price-setter for a fifth session. Gates: the 8 Sep
      NY close (first with Treasuries open), PPI 10 Sep, CPI 11 Sep (consensus
      core +0.3%, so a 0.2 print is the downside surprise). Kills the hike:
      core ≤0.2 with oil easing. Seals it: core ≥0.4, or passthrough the Fed
      reads as broadening beyond energy.
    since: 2026-07-31

  - theme: central-bank-gold-buying
    why: >
      Structural demand floor: ~289t of official demand this cycle with ETF
      inflows resuming beside it, and reserve diversification out of
      Treasuries as the flow-side twin (China's UST holdings lowest since
      2008). China's reserves rose again in August (investinglive, 7 Sep) —
      the official bid persists through the drawdown. The custody reflex is
      spreading — the Dutch central bank moved 86t from US/Canadian custody
      to London citing geopolitical unrest, a vote on where reserves sit
      rather than new demand; France moved earlier, Norway's $2.4tn fund is
      weighing cutting government bonds from 70% to 50% of the portfolio
      (7 Sep), and Germany (a third of its reserves in NY) has not moved.
      Counter-signal: Russia, once the top buyer, is now a steady seller.
      Confirms: WGC monthlies showing net buying through this drawdown, and
      the floor showing in the tape near 4300. Kills it: two consecutive
      months of net official selling.
    since: 2026-07-31

  - theme: warsh-credibility
    why: >
      The debasement channel - the best explanation for gold holding above
      $4,000 against a positive real yield. Warsh chairs a Fed whose
      independence is openly contested while the long end prices distrust: 30y
      near its mid-2007 high, TLT at 2004 lows, foreign UST liquidation. The
      pressure went explicit and broad in the week to 5 Sep (CNBC): the
      President, VP, Bessent and Navarro all publicly opposed a hike; Trump for
      the first time tied tariffs to Fed policy (halt trade with surplus
      countries unless the Fed cuts); Navarro called the FOMC 'clowns'; Warsh
      says none of it touches decisions. Three July dissents for a hike
      (Hammack, Kashkari, Logan) and Warsh's own Jackson Hole line (54% of PCE
      components >3%) are the counterweight. A hike delivered through this
      pressure is credibility-positive and bearish gold via real yields; a hold
      that looks coerced is the debasement case. Breadth is the tell - weak
      PBOC fixes, BTC/ETH rallying on the same tape, a tightening periphery
      circling an immovable core. Confirms: gold rallying WITH yields. Kills
      it: a delivered hike that pulls the long end down, or a visible
      re-anchoring of independence. Blackout means no Fed reply until 16 Sep.
      The yen limb tracks separately under boj-yen-pillar.
    since: 2026-07-31

  - theme: middle-east-risk-premium
    why: >
      Two regimes: IRGC control of Hormuz transit against a US blockade
      (Operation Economic Outcast), with open kinetic exchange since 30-31 Aug.
      The kinetic BASELINE is priced and gold shrugs it both ways. 5 Sep
      crossed two lines at once: Iran fired ballistic missiles at a US carrier
      and destroyer (evaded), and CENTCOM answered on the tanker fleet - Kylo
      destroyed in ballast, Downy disabled off Kharg, Stark 1 off Jask - with
      Cooper/Hegseth on record to 'destroy (and sink)' the fleet if fired on
      again. The IRGC's reply (6 Sep) resolved into TURN-BACKS of three named
      hulls (Velos Amber, Bravo, Al Sheehaniya), a Gulf-side 'prohibited
      zone' enforced by sanctions-listing (Rezaei, 'coming days', still no
      boundary on 8 Sep) and Qalibaf's 'proportionate era over'; Rezaei also
      says Iran 'has not decided to sink' US-linked hulls and wants 'diplomacy
      with guarantees' - a live channel under the rhetoric. Gold SOLD the
      7 Sep reopen and sold Monday's oil-up tape: the war is a floor, not a
      bid. 7-8 Sep the theatre WIDENED: Houthi hits reported on Aramco Jizan
      (Gulf News: second in a month; no Aramco/SPA confirmation) and Fars-
      reported missiles/drones on Khamis Mushait and Abha - Houthi-on-Saudi,
      not an Iranian act on a GCC host, so no named trigger fired (rule 2),
      but a Houthi hit on Yanbu (Red Sea bypass terminal) is now a named
      kinetic-45 path; Qalibaf vows 'in kind' strikes on Gulf energy
      infrastructure if US hits Iranian assets again. Transits at a Kpler
      10-day average of 10/day (lowest since May), Iranian loadings 220-255
      kb/d vs 2 mb/d in March (Reuters). The regime is ship-for-ship on both
      sides, with US ordnance a hull's length from Kharg's terminals. Beyond-
      baseline arms the tail: a US warship hit with casualties, ordnance on
      Kharg/Larak loading infrastructure, a hit on Yanbu/Fujairah, a Pickaxe
      strike, or a GCC strike on Iran. Two corrections keep it mispriced:
      throughput ~two-thirds of pre-war with most traffic AIS-dark under
      escort, so the oil premium is tail-priced, not disruption-priced;
      inventories drawn to no cushion, so a real hit transmits convexly.
      Diplomacy is a vacuum; the premium unwinds only on a signed, co-
      confirmed text. Live markers: the IAEA Board referral vote in Vienna
      this week (slot unpublished), escort suspension, Aramco/SPA confirmation
      of the Jizan/Asir strikes, the zone boundary, Trump's wording.
    since: 2026-07-31

  - theme: boj-yen-pillar
    why: >
      The yen was a pillar of the debasement bid: USDJPY pinned at 159–160
      after August's failed intervention (Japan's FX reserves fell a record
      $80bn in August, CNBC 7 Sep) meant carry and fiscal absorption
      outweighed BoJ normalisation, and gold's floor leaned on it. That broke
      3 Sep — 160.4 to 155.34 in a session — and broke again 7-8 Sep: 154.33
      at the NY close (154.07 low, six-month), 153.31 in Asia, −4% on the
      week, on July cash earnings +4.7% y/y (consensus 3.9%, strongest since
      1997), Q2 GDP revised up to +1.4%, and Takaichi adviser Aida — read as
      a dove — now expecting a September hike; ~25bp to 1.25% is close to
      fully priced. Saxo's COT calls the yen short 'a major misstep'. Two-
      sided for gold: orderly yen-up is dollar-down and gold-up near term
      (Asia 8 Sep bought gold +0.5% on it), but a BoJ that can genuinely
      tighten erodes the pillar structurally, and the tail is a disorderly
      unwind of the ~$103bn yen short (JPMorgan; USDJPY 142 in scope) — an
      Aug-2024-shaped liquidity event that sells the crowded gold long with
      everything else. The tell for disorderly: USDJPY <150 within days with
      Nikkei and BTC down together. Gates: MoF/BoJ rate-check or verbal
      defence, PPI 10 Sep (US leg), the BoJ 17–18 Sep (slot to re-verify
      Saturday, rule 16). Recorded 8 Sep: no USDJPY print below 150 through
      10 Sep (0.55).
    since: 2026-09-03

  - theme: energy-pce-passthrough
    why: >
      The bridge from the war to the Fed: oil into CPI is the live hike-odds
      channel. Brent settled 97.31 on 7 Sep (high 98.06, highest since 24 Jul,
      +9% w/w, +19% m/m), WTI 92.70, Murban 106.8, and the 8 Sep reopen added
      $1 on the Houthi-Saudi reports; US gasoline $4.15 (AAA) and diesel at a
      record - driven by blockade barrels (Iranian exports 1.7 mb/d to ~250
      kb/d), Hormuz transits at a May low, and war-risk insurance, not by
      strikes. Goldman and Rystad put $120 in scope if attacks on shipping
      intensify; Goldman lifted its forecasts. The 5 Sep US strikes on Iranian
      tankers add a proximity premium to Kharg but those barrels were already
      blockaded. August CPI on 11 Sep is the test: consensus headline +0.4%
      m/m and 3.4% y/y, core +0.3% and 2.5% (Wells Fargo 0.40 headline, 0.23
      core). Energy is the whole headline story; CORE decides the hike, and
      the ECB's read - energy is 90% of the 2026 episode with no core
      spillover yet - is the benign case; Bessent's line (no hike in a supply
      shock until second-order effects) is the administration's version.
      Monday showed the transmission working through Europe with US markets
      shut: Bunds +5bp on oil, gold down. The premium is fragile to de-
      escalation talk; a Russia-Ukraine text (Witkoff/Kushner, Kyiv 6 Sep, no
      readout yet) takes the Black Sea/Ust-Luga floor off it. Falsifiable:
      65cd057e, no Brent settle >=100 through 10 Sep (0.55), 2.7% of room.
    since: 2026-07-31

  - theme: us-fiscal-dominance
    why: >
      Treasury's expanded long-dated buybacks (19 Aug) are de facto
      yield-curve control, and the market read them as debasement — gold
      flipped into a trend regime as US debt passed $40tn. The tool then
      failed: the rout restarted within a day and the 30y returned to its
      mid-2007 high. That failure STRENGTHENS the theme — conventional tools
      visibly struggling is the point — and it undercuts Warsh's authority
      over rate policy, so the Treasury-versus-Fed conflict deepens whichever
      side wins. The regime signature is gold rallying WITH yields, and it has
      printed repeatedly; Druckenmiller (Treasury 'is suppressing the bond
      market's warning signal') and Barkin ('a reckoning') are on record.
      Counter-tell: price targets have converged (Citi 4,800, Goldman ~4,900,
      JPM 5k, UBS 5,400) — crowding, not information — and Goldman's 'buy
      zone' has moved DOWN to $4,000 (7 Sep), ten percent below spot; on
      2 Sep gold was sold in a systematic deleveraging rather than bid as a
      haven. Next mechanism test: the first buyback operation 9 Sep, slot
      still unverified in any ingested source (8 Sep re-check). Watch 10y
      through 4.80 (claim recorded 8 Sep), DXY at 100, the 30y and TLT.
    since: 2026-08-20

  - theme: us-canada-trade-war
    why: >
      A tripwire theme, low conviction on magnitude: talks collapsed 23 Aug,
      US 50% tariffs took effect, Canada retaliated in kind. It matters as a
      second protectionism front beside the Iran siege economy, feeding the
      de-globalisation and debasement mix that already sets gold's price.
      Passthrough versus growth is resolving toward the growth hit on the
      Canadian side — August employment −41.7k against +15k consensus in the
      same minute the US printed +162k, USD/CAD to 1.3871 — which hands the
      BoC a cut argument. 7 Sep: Trump threatened US sales of Bombardier
      aircraft — escalation by sector, still no haven flow into gold from it.
      Watch retaliation scope (energy and USMCA carve-outs), US inflation-
      passthrough chatter, and whether haven flow shows in gold rather than
      only the dollar. Promote it out of tripwire status only if US CPI or a
      Fed speaker names tariffs as a driver.
    since: 2026-08-24
