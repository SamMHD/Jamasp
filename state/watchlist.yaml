watchlist:
  - theme: fed-rate-path
    why: >
      Real yields are gold's dominant driver, and this Fed is debating a HIKE.
      Sept-hike pricing ran ~35% mid-August -> 58% (4 Sep) -> 64% (PPI) ->
      70% (10 Sep close) -> 82-90% on the 11 Sep CPI -> ~90% at the 11 Sep NY
      close; actionforex week-ahead (14 Sep) still "around 90%". No speaker
      moved it - the blackout (5-16 Sep) holds - data and oil did. August CPI:
      headline 0.4/3.4, core 0.318 with wireless +5.9% m/m a record (~0.1pp;
      ex-that on consensus), shelter 0.1 -> 0.3, supercore 0.51. Overnight
      14 Sep (CNBC 03:32Z): 2y 4.628 (= Fri cycle high), 10y 4.977, 30y 5.369
      - the front end did not budge on the Muscat postponement or the oil gap.
      Sell-side: JPM Sept AND Dec; WF Sept + a 4.125 median dot. Slot
      VERIFIED 12 Sep: decision Wed 16 Sep 18:00Z, presser 18:30Z (wakeup #54,
      19:45Z). The decision is priced; the gold variable is the forward
      language and the dots - "further firming" with gold -1% is the
      bearish-rates 65 line, one-and-done with gold up is base 25. Kills the
      hike now: only a Fed-sourced hold leak or an oil crash. Claims: 8af1d9b9
      (hike, 0.55, HIT traj.) vs ec71ce01 (no hike, 0.8, MISS traj.);
      e694f252 (>=70% at every close through 15 Sep, 0.6).
    since: 2026-07-31

  - theme: central-bank-gold-buying
    why: >
      Structural demand floor: ~289t of official demand this cycle with ETF
      inflows resuming beside it, and reserve diversification out of
      Treasuries as the flow-side twin (China's UST holdings lowest since
      2008; China's reserves rose again in August; UBS 9 Sep keeps its
      long-game call). Custody reflex spreading (DNB 86t to London, France
      earlier; Norway's fund weighing 70% -> 50% government bonds). Counter:
      Russia now a steady seller. The floor: 4300 GC (~4260 spot) untested
      since 2 Sep; the 11 Sep hot-CPI dip was bought at 4372-4383 but through
      the oil leg, not a buyer at the line; the 14 Sep reopen low 4368
      (01:20Z) bounced 23 pts. Floors 6/6 this regime; 66db8e8e (no close
      <4300 Mon-Tue, 0.55) is the live test. Confirms: WGC monthlies net
      buying through the drawdown; a bought dip at 4300 on an oil-UP day.
      Kills: two consecutive months of net official selling.
    since: 2026-07-31

  - theme: warsh-credibility
    why: >
      The debasement channel - the best explanation for gold above $4,000
      against a positive real yield. Warsh chairs a Fed whose independence is
      openly contested while the long end prices distrust: 10y 4.98, 30y 5.37
      (above the 5.31 that produced the 19 Aug buyback move), TLT at 2004
      lows, buybacks that FAILED in public 9-10 Sep. Political pressure
      explicit (President, VP, Bessent, Navarro against a hike); three July
      dissents for a hike and Warsh's Jackson Hole line are the counterweight.
      A hike delivered through this pressure is credibility-positive and
      bearish gold via real yields; a hold that looks coerced is the
      debasement case. The tell is gold rallying WITH yields: printed once
      (9 Sep), reversed 10 Sep, absent 11 Sep and again on the 14 Sep reopen
      (gold -0.7% with the 2y flat at the high). One session for, eight
      against. Kills it: a delivered hike that pulls the long end down, or a
      visible re-anchoring of independence. No Fed reply until 16 Sep.
    since: 2026-07-31

  - theme: middle-east-risk-premium
    why: >
      Two regimes: IRGC control of Hormuz transit against a US blockade, with
      open kinetic exchange since 30-31 Aug, and a Red Sea second front. The
      East-West pipeline (Hormuz bypass, 7 mb/d nominal) is SHUT after
      Iraq-launched drones hit two pumping stations 10 Sep; Riyadh has not
      disclosed damage extent or duration (investinglive 13 Sep). Attribution
      on record: Iraq (Saudi FM; Iraqi PM confirmed a Maysan launch); Trump
      calls Iran 'probably responsible'. Step-backs on record: Riyadh 'not to
      respond at this stage'; Trump declined MBS's strike requests. DIPLOMACY
      13 Sep: Oman's FM Al Busaidi postponed Monday's Salalah GCC-Iran meeting
      on record 'until a later date to ensure appropriate conditions for
      constructive dialogue'; Iran calls it a joint decision at regional
      request; investinglive ties it to the pipeline strike; a senior Iranian
      official said no signed agreement had been expected. Wakeup #55
      cancelled. CNN (3 sources, 13 Sep): the administration wants future Iran
      talks on the NUCLEAR file, not Hormuz; the US was never on the Oman
      track; Trump: the strait is 'acceptable for now' given escorts; Wright:
      bypass routes carry ~10 mb/d. Hormuz kinetic: UKMTO-confirmed projectile
      hit and fire on a Panama-flagged tanker (Vanguard Tech; Omani Navy
      evacuating; report received Sun 13 Sep); Iranian media claim an Iranian
      cargo vessel hit near Qeshm, 1 dead (unverified). Maritime Executive 13
      Sep: 'U.S. shows more restraint after latest Iranian tanker strike'.
      Bab el-Mandeb: Perim/Mayun wire-grade; Houthi claim on a Saudi base
      (Mehr 13 Sep) and '58 Saudi attacks in one day' - claims cadence only.
      Ladder, each a named claim: Yanbu terminal (47d2085d, 18 Sep),
      Kharg/Larak INFRASTRUCTURE (010cb839, 19 Sep), Saudi restraint
      (e0e5cd9c, 20 Sep; 110d5daa HIT 14 Sep), US territory (87e409a7, 18 Sep;
      e1e9ba8f HIT 14 Sep), Saudi-linked Red Sea hull (81e84f0c, 16
      Sep), Pickaxe (e87144df, 18 Sep), escorts (a0429ae4, 20 Sep), Gulf does
      not sign Iran's regime (a8cf8123, 15 Sep, HIT traj.), meeting
      materializes (6c6ed87f, 15 Sep, MISS traj.). Markers: a rescheduled
      Salalah date from Oman/GCC (not Tehran), Aramco/SPA restart timeline,
      UKMTO incident names, CENTCOM statements, any US answer to Riyadh.
    since: 2026-07-31

  - theme: kinetic-transmission-inverted
    why: >
      The war reaches gold as a Fed hike and a margin call, not as a haven
      bid. EIGHT sessions of evidence (2, 6, 7, 8, 10, 11 Sep, the 11 Sep NY
      close, and the 14 Sep reopen) against one (9 Sep). The reopen: Muscat
      postponed on record, a UKMTO-confirmed tanker fire, oil gapping >3% at
      22:00Z and Nasdaq futures down - GC printed 4408.9 at 22:06Z and 4373 by
      22:21Z, low 4368 at 01:20Z, 4377 at 03:30Z (-0.7%), with the 2y flat at
      its cycle high and DXY +0.2; oil then gave back most of its gap (WTI
      ~100, Brent ~104.6 by 22:30Z per Gulf News) and gold did not rally on
      that either - no haven bid, and the dollar/front end took the wheel. The
      stance's second-session test (gold up WITH the 2y up -> base 25) did
      NOT print; base stays 20. 10 Sep remains the reference escalation
      session: crude +7%, gold -2% with copper, silver and AUD. Confirms:
      another escalation session closing red; gold down on oil-up days and up
      on oil-down/peace days regardless of the Fed leg. Kills it: two
      consecutive gold-up/2y-up sessions, gold UP from a trigger's print to
      the close on an oil-UP session, a supply event traded as stagflation
      (long end up, dollar DOWN, gold up), or hike odds falling on a hold leak
      with gold rising.
    since: 2026-09-09

  - theme: boj-yen-pillar
    why: >
      The yen was a pillar of the debasement bid: USDJPY pinned at 159-160
      after August's failed intervention. That broke 3 Sep (160.4 -> 155.34)
      and 7-8 Sep (153.3) on cash earnings +4.7%, Q2 GDP +1.4%, Aida expecting
      a September hike; JGB 10y above 3%; Masu 'further hikes needed'; August
      PPI +7.6%. Westpac (actionforex 14 Sep): the move rests on reports that
      Japanese authorities asked domestic institutions to favour the yen plus
      BoJ pricing through mid-2027; it forecasts a SLOW descent to 146 by
      end-2028 - i.e. structural, not a tail. 14 Sep reopen: USDJPY 154.05
      (+0.3%), the yen the wrong way for the disorderly tail; window low 153.42
      (10 Sep). Slot VERIFIED 12 Sep: decision Fri 18 Sep 05:30Z (cons 1.25%
      from 1.00%), presser 06:30Z; wakeup #56 07:30Z. The common-US-factor
      regime overrides the bilateral leg (10 Sep lesson). 6ddbe426 (no print
      <150 through 16 Sep, 0.55) has ~2.6% of room. Disorderly tell (USDJPY
      <150 with Nikkei and BTC down together) not printed; BTC 77.7k. Two-sided
      for gold: orderly yen-up is dollar-down and gold-up near term; a BoJ
      that can genuinely tighten erodes the pillar structurally.
    since: 2026-09-03

  - theme: energy-pce-passthrough
    why: >
      The bridge from the war to the Fed: oil into CPI is the live hike-odds
      channel, and in this regime oil is gold's price-setter. Week to 11 Sep:
      WTI +9.35% to 100.05, Brent 104.61 (109.68 blow-off 10 Sep), Murban
      ~120. Barrels missing: East-West pipeline shut (4-5 mb/d recently
      carried), Saudi supply ~6 mb/d (IEA), Hormuz transits single digits,
      Houthis hold the Bab el-Mandeb approaches - offset by escorted Hormuz
      exports >10 mb/d (Wright: bypass routes ~10 mb/d). 14 Sep reopen: the
      peace premium the 11 Sep meeting report had priced came back out at
      22:00Z (gap >3%, investinglive/investing.com) and was largely faded
      within the hour (Gulf News 22:30Z: WTI 100.00, Brent 104.60, Murban
      119.50); no reliable Asia-session level in any feed at 03:30Z - the
      07:00Z scan reads Brent first. CICC (14 Sep): $100 oil brings demand
      destruction into view - the growth-scare read that on 11 Sep meant oil
      down = gold UP. Passthrough: diesel >$6/gal ($9.99 at a California
      pump), 30y mortgage >7%, UMich 1y expectations 4.6%; Lagarde: shock
      'longer-lasting'. Claims: b3adcf1e (no WTI settle <92 Mon/Tue, 0.6);
      4dfbd1d8 (Sept headline >=0.4, 0.65); 62c34dbd (core <=0.3, 0.7). Brent
      100 is support; no cap written (65cd057e lesson).
    since: 2026-07-31

  - theme: us-fiscal-dominance
    why: >
      Treasury's expanded long-dated buybacks (19 Aug) are de facto
      yield-curve control and the market read them as debasement - gold's
      trend regime began as US debt passed $40tn. The tool FAILED IN PUBLIC
      9-10 Sep (30y auction 'poor' at 5.308, yields +8-14bp). 11 Sep: 2y
      +7.8bp, 30y 5.3576 - a bear-flattener; overnight 14 Sep 30y 5.369, 10y
      4.977 (CNBC 03:32Z) - the long end drifted up on the reopen while gold
      fell; still not the debasement signature (gold up WITH yields printed
      once, 9 Sep). Lagarde (12 Sep) named US public finances and AI funding
      as the global term-premium driver. No upsizing relayed (52db03df, 0.7,
      to 18 Sep; the 5.40 gate touched 5.42 intraday 11 Sep and rejected).
      Counter-tells: the 9 Sep 10y auction stopped through; August deficit
      $167bn vs $404bn expected (one month). Claims: 09cb81a7 (no DXY close
      >=100 through 16 Sep, 0.6; 99.30 overnight). Watch the 30y vs 5.40 into
      the FOMC, TLT, any Bessent line, and whether a long-end sell-off ever
      again comes with gold UP.
    since: 2026-08-20

  - theme: us-canada-trade-war
    why: >
      A tripwire theme, low conviction on magnitude: talks collapsed 23 Aug,
      US 50% tariffs and Canadian retaliation in force; 8 Sep Trump banned
      Canadian autos, dairy and alcohol. Growth hit resolving on the Canadian
      side (August employment -41.7k). New 13 Sep: Carney exploring EU
      'associate membership' (WSJ via investinglive/gcaptain) - a realignment
      signal, no gold channel yet. Canada CPI Mon 14 Sep 12:30Z (cons 3.0%
      y/y; WF: BoC on hold). Still no haven flow into gold from it. Promote
      out of tripwire status only if US CPI or a Fed speaker names tariffs as
      a driver; prune candidate next Monday if nothing reaches gold.
    since: 2026-08-24
