      STRENGTHENS the theme; the bearish variant is Warsh reading
      buybacks as easing -> hike ammunition (keynote Fri 28 Aug, #39).
      22 Aug: the conflict went MAINSTREAM — MarketWatch (extracted):
      Bessent's twist "undercuts the credibility of Warsh to make
