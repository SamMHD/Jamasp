watchlist:
  - theme: fed-rate-path
    why: >
      Real yields are gold's dominant driver, and this Fed just HIKED: 16
      Sep +25bp to 3.75-4.00%, 12-0, no guidance sentence; dots one more in
      2026 (median 4.1; 16 of 18 see >=1 more), 2027 4.1, LR 3.2. Warsh:
      'not restrictive', 'inflation is too high', August PCE estimate ~3.6%
      (official print later this month). PRICING: CME Oct 57.6% post-FOMC
      (actionforex 19 Sep); futures two-in-three for 4.00-4.25% at end-2026
      and at least another quarter by mid-2027 (investinglive 21 Sep); BofA
      keeps Oct + Dec. Destination barely moved (Dec-27 modal 4.50-4.75);
      the 2y sits ~26bp above the average expected path - front end
      running ahead of the futures. Checkpoints: 2y 4.791-4.800 (rejection
      then <4.600 = reversal toward the path; break = 5.055 projection);
      DXY 100.02 / 100.58 / 101.80. THE LOOK-THROUGH IS CLOSED ON THE
      RECORD: Schmid 18 Sep ('not just about energy'), Kashkari 20 Sep
      (Fox: 'too high across the economy, not just energy'; the Fed cannot
      open Hormuz with rates but has tools for the rest) - so oil DOWN no
      longer pulls the 2y down (21 Sep: Brent -2.1%, 2y flat, gold -0.5%).
      Neither is a governor; the flip line (governor endorses Oct ->
      bearish-rates 60; pause call -> base 30) is untriggered. SPEAKERS
      VERIFIED from the ff_calendar feed (Low impact, hidden by `jamasp
      calendar`, todo-188): Goolsbee Mon 21 Sep 10:30Z; Williams 14:05Z,
      JEFFERSON (Vice Chair) 14:20Z, Barkin 17:00Z Tue 22; BARR Wed 23
      14:05Z; Williams 08:10Z, Hammack 12:50Z, Paulson 14:10Z Thu 24;
      Williams 09:15Z, Hammack 18:00Z Fri 25. Wakeups #57 (Jefferson) and
      #58 (Barr + US flash PMI). Claims: 1889819a (0.7, to 22 Sep) - Monday
      at 03:30Z is gold DOWN / 2y flat, HIT trajectory; fc5c5a29 (no 2y
      close <4.60 through 25 Sep, 0.55). Next gates: Monday close (gate);
      Jefferson Tue; Barr Wed; Sept CPI mid-Oct; 28 Oct FOMC.
    since: 2026-07-31

  - theme: central-bank-gold-buying
    why: >
      Structural demand floor: ~289t of official demand this cycle with ETF
      inflows resuming beside it, and reserve diversification out of
      Treasuries as the flow-side twin (China's UST holdings lowest since
      2008; China's reserves rose again in August; UBS 9 Sep keeps its
      long-game call; Goldman 18 Sep keeps $5,400 through the hike).
      Custody reflex spreading (DNB 86t to London, France earlier; 18 Sep
      Venezuela weighing $4bn London -> US - custody, not demand). 21 Sep:
      PBOC fixed the yuan at its strongest since Feb 2023 - a cheaper CNY
      gold price at the margin (SGE 927.61/g, 16 Sep). Counter: Russia a
      steady seller. The floor: 4300 GC (~4255 spot) - tests 14 Sep 4305.9,
      15 Sep 4304.0, 16 Sep 22:19Z tick 4296.7, then the retrace to 4424.9
      Fri 18 Sep. Floors 8/8 this regime, but every bounce tracked oil off
      its highs or a yields-down session; not yet a bought dip AT the line
      on an oil-UP day. Ninth test live: d571e0f0 (no GC_CLOSE <=4326.5
      Mon/Tue, 0.55) - reopen low 4397.8, 50DMA now 4332.4. Confirms: WGC
      monthlies net buying through the drawdown; a bought dip at 4300-4332
      on an oil-UP day. Kills: two consecutive months of net official
      selling.
    since: 2026-07-31

  - theme: warsh-credibility
    why: >
      The debasement channel - the best explanation for gold above $4,000
      against a positive real yield (DFII10 2.61). 16 Sep: the hike was
      delivered THROUGH the political pressure, 12-0 - credibility-positive;
      the theme's own kill line printed (30y -1.3bp with the 2y +12bp, gold
      -1.9%, dollar through 100). 18 Sep: the tell printed ONCE - gold
      +0.96% with the 2y +6.6bp, 10y 5.00, 30y +3bp, DXY flat, BTC +6%. 19
      Sep corrective: at the WEEK level the curve does not carry the
      signature (actionforex: 2y +12.6, 10y +3.1, 30y -2.9 - 'not the
      pattern of a fiscal-credibility shock'); MarketWatch: 'Wall Street
      now believes it'. 21 SEP: the tell did NOT repeat at the reopen -
      gold -0.5% with the 2y flat and the 30y flat (5.328); Friday's
      rates-desk explanation (gold trades the unchanged destination) holds.
      Tell 2 for / 13 against. Base stays 20 by the gate. Confirms (base
      30): Monday both-up (1889819a MISS) WITH the 30y up; a 30y close
      >=5.40 with gold UP (aec5cc8b MISS); gold +1% on an oil-DOWN session
      with the 2y flat (the chain broken from the gold end). Kills: Monday
      gold DOWN on a 2y up (on trajectory); 1889819a HIT with the 30y under
      5.40. A Trump move ON Warsh priced gold-up/2y-up is the other confirm
      (rule 7 caps timing).
    since: 2026-07-31

  - theme: middle-east-risk-premium
    why: >
      Two regimes: IRGC control of Hormuz transit against a US blockade with
      open kinetic exchange since 30-31 Aug, and a Red Sea second front that
      reached RIYADH 19 Sep - on record (Saudi-led coalition, AP via Gulf
      News): one Houthi ballistic missile at the capital, INTERCEPTED;
      Yanbu/Taif/Baysh/Farasan 'thwarted'; no casualties or damage;
      attribution HOUTHI, not Iran; the Houthi 'Aramco Yanbu fires' claim
      unverified (rule 12). WASHINGTON 20-21 Sep (NYT via investinglive):
      Trump told the Pentagon to prepare Houthi strikes after the MBS call,
      then STOOD DOWN by Sunday midday - 'no US airstrikes for the time
      being'; directive stays Iran/Hormuz; ~200 US personnel in Saudi,
      non-combat; officials doubt a limited campaign works and expect the
      Houthis to fire on US ships if it starts. On Iran: 'deciding mode'
      (strikes / pressure / deal), 'very big things could happen soon',
      'probably open' to meeting PEZESHKIAN at UNGA; Virtual Embassy:
      Americans leave Iran; CENTCOM tightening the blockade (>100 vessels
      redirected), Hormuz shipments a six-month high on mine clearance.
      DIPLOMACY on record: Qatar's Al Ansari (20 Sep) - Qatar exchanging
      ideas with both sides for weeks, 'the United States wants a deal',
      objectives 'open the strait, stop the war'; Araghchi Doha -> New
      York; Pezeshkian attending UNGA (Mehr); Turkey drafting proposals;
      Iran's seven conditions via Qatar (Rezaei 19 Sep) still one-sided;
      Iran Q1 GDP -10.1% y/y. Saudi side: 760 airstrikes on Yemen
      (coalition spox via Mehr); exports >4 mb/d in Sep vs 2.4 Aug
      (Reuters). Ladder: Kharg/Larak infra d96debd5 (to 26 Sep, no items
      since 20 Sep); Gulf-side regime 2df323fa (to 26 Sep, no endorsement);
      Saudi restraint e0e5cd9c HIT -> 33defb45 (to 27 Sep); escorts
      a0429ae4 HIT -> d4f5ffd6 (to 27 Sep); Saudi hull 9e629d6e (23 Sep);
      645cc78a (no co-confirmed talks, to 22 Sep 23:59Z) AT RISK on a
      Trump-Pezeshkian meeting confirmed by both. Markers: Trump-GCC Tue
      (no slot); a Pezeshkian meeting co-confirmed; any US strike order;
      SPA damage lines; Saudi attribution beyond the Houthis;
      Turkey/Pakistan deployments; UKMTO names; an Omani Salalah date.
    since: 2026-07-31

  - theme: kinetic-transmission-inverted
    why: >
      The war reaches gold as a Fed hike and a margin call, not as a haven
      bid. THIRTEEN sessions of evidence now: 2, 6, 7, 8, 10, 11 Sep, the 11
      Sep NY close, the 14 Sep reopen, 14, 15, 16 Sep, 17-18 Sep overnight,
      and the 20 Sep 22:00Z REOPEN - Riyadh (one intercepted missile)
      opened Brent +0.8% and gold exactly flat (first print 4424.9 =
      Friday's close; ac946837 HIT, fifth kinetic weekend with no gap, band
      family 4/4). Against: one (9 Sep). THE NEW OBSERVATION IS THE
      ASYMMETRY: when oil then REVERSED -2.1% on Saudi exports >4 mb/d and
      Qatar's 'the US wants a deal', gold fell -0.5% with it while the 2y
      sat at 4.757 - the oil-DOWN -> 2y-DOWN -> gold-UP route is blocked
      at the 2y because the Fed closed the look-through (Schmid, Kashkari).
      One-way valve: oil up sells gold, oil down buys nothing. Claims:
      64c7ba41 (0.5) - on the first oil-UP Brent settle Mon/Tue, no
      GC_CLOSE >= +1% (Monday is not oil-UP at 03:30Z; Tuesday if it
      settles up; UNCLEAR if neither). Confirms: an oil-UP settle with gold
      flat/DOWN; a US strike on Iran priced gold DOWN; a co-confirmed deal
      priced oil -5% with gold flat. Kills: 64c7ba41 MISS -> kinetic 35;
      two consecutive gold-up / 2y-up closes (1889819a MISS); gold +1% on
      an oil-DOWN session with the 2y flat; a supply event traded as
      stagflation (long end up, dollar DOWN, gold up).
    since: 2026-09-09

  - theme: boj-yen-pillar
    why: >
      The yen was a pillar of the debasement bid: USDJPY pinned at 159-160
      after August's failed intervention; that broke 3-8 Sep (160.4 ->
      153.3). 18 Sep: BoJ HIKED to 1.25% (highest since 1995), 7-2, no
      timing; Ueda: 'policy phase has changed', will keep raising; street:
      one hike per quarter, next Dec/turn-of-year, terminal 1.75-2%. Tape:
      BoJ RATE CHECK at 158.05 - the defended line is 158, not 160. 21 Sep:
      USDJPY 156.80 flat; CFTC - hedge funds net LONG yen for the first
      time since July 2025; Tokyo closed Mon 21 and Wed 23 (holiday-week
      intervention chatter, investinglive). Gold took nothing from the yen
      either way (deepdive #56: the yen reaches gold only through DXY, and
      DXY is +0.07). Read with the FOMC: one widening differential, both
      legs dollar-favourable - relative-rate trade, not debasement. Open:
      be4d6b22 (USDJPY no print >=160 through 24 Sep, 0.55). Next BoJ 30
      Oct, two days after the 28 Oct FOMC - second convergence window.
      Flip: >=160 through the MoF = pillar back, base 30; <152 with
      Nikkei+BTC down = liquidity regime.
    since: 2026-09-03

  - theme: energy-pce-passthrough
    why: >
      The bridge from the war to the Fed: oil into CPI is the live hike-odds
      channel, and oil is gold's price-setter on non-Fed days. 15 Sep
      settles WTI 105.83 / Brent 108.75 (109.97 high); then four down
      sessions on 'diplomacy' to Brent 103.87 Fri; 21 Sep reopen: gapped
      to 104.71/104.90 on Riyadh, reversed to 101.68 (-2.1%) on Reuters'
      Saudi exports >4 mb/d in September (2.4 Aug), CENTCOM's six-month-high
      Hormuz shipments, JPMorgan 'flows holding up', and Qatar's 'the US
      wants a deal'; WTI Oct 98.11 (expires 22 Sep); Murban 117.90 (-2.9%).
      actionforex 19 Sep names Brent 100 / 100.26 (38.2% of 84.56 ->
      109.97) as THE upstream variable of the 2y/DXY chain: 1.4% away. But
      the passthrough is now ONE-WAY on the record: Schmid and Kashkari
      ('not just energy'; Warsh PCE ~3.6) mean oil down does not lower the
      2y - a Brent settle <100 with the 2y >=4.70 confirms that (weight
      holds), <100 with the 2y <4.70 is the input lost (bearish-rates 45).
      Supply chain: East-West shut 5-6 weeks, Yanbu loadings paused, Iran
      zero (CENTCOM); offset by escorted Hormuz loadings (~60m bbl Sep-Oct)
      + Sohar STS and the Saudi export recovery. Demand side: diesel >$6,
      30y mortgage >7%, US diesel export-ban debate (The National), Trump
      pressing Zelensky to stop refinery strikes over diesel (Axios),
      Goldman TTF/JKM warning on Gulf LNG. Claims: 4dfbd1d8 (Sept headline
      >=0.4, 0.65); 62c34dbd (core <=0.3, 0.7); 64c7ba41 runs on the first
      oil-UP settle. No cap written.
    since: 2026-07-31

  - theme: us-fiscal-dominance
    why: >
      Treasury's expanded long-dated buybacks (19 Aug) are de facto
      yield-curve control and the market read them as debasement - gold's
      trend regime began as US debt passed $40tn. The tool FAILED IN PUBLIC
      9-10 Sep (30y auction 'poor' at 5.308). FOMC week: curve flatter,
      dollar UP - not the signature (actionforex: 2y +12.6, 10y +3.1, 30y
      -2.9, 'not a fiscal-credibility or duration-risk shock'). 18 Sep:
      'bonds slump again' - 10y 5.00, 30y 5.328 - and gold ROSE with the
      dollar flat: a one-session observation inside a flattening week. 21
      Sep reopen: 30y 5.328 flat, gold down - no long-end lead. 52db03df
      HIT (no upsizing through 18 Sep). Open: aec5cc8b (no 30y close >=5.40
      Fri-Tue, 0.55 - 7bp of room). Watch: 2y/5y/7y auctions this week
      (UNVERIFIED, todo-185 - no relay in the DB as of 21 Sep), any Bessent
      line (he called US-China talks 'very successful', Board of Trade
      operational), whether the 30y moves WITH gold on any session.
    since: 2026-08-20
