watchlist:
  - theme: fed-rate-path
    why: >
      Real yields are gold's dominant driver, and this Fed is debating a HIKE.
      Sept-hike pricing ran ~35% mid-August -> 58% (4 Sep) -> 64% (PPI) ->
      70% (10 Sep close) -> 82-90% on the 11 Sep CPI -> ~90% at the 11 Sep NY
      close -> 100% at the 14 Sep NY close (investinglive wrap). No speaker
      moved it - the blackout (5-16 Sep) holds - data and oil did. August
      CPI: headline 0.4/3.4, core 0.318 with wireless +5.9% m/m a record
      (~0.1pp; ex-that on consensus), shelter 0.1 -> 0.3, supercore 0.51.
      14 Sep NY close: 2y 4.662 (+1.8bp, new cycle high), 10y 4.994 (5.01
      intraday, first 5% since Oct 2023), 30y 5.354 flat - a bear-flattener;
      15 Sep 03:30Z (CNBC): 2y 4.671, 10y 5.01, 30y 5.369. Sell-side: JPM
      Sept AND Dec; WF Sept + a 4.125 median dot; the wrap names Oct/Dec as
      the wild card. Slot RE-VERIFIED 15 Sep against the feed row: decision
      Wed 16 Sep 18:00Z, projections same slot, presser 18:30Z (wakeup #54,
      19:45Z). The decision is fully priced; the gold variable is the forward
      language and the dots - "further firming" with gold -1% is the
      bearish-rates 65 line, one-and-done with gold up is base 25. Kills the
      hike now: only a Fed-sourced hold leak (the oil-crash route needs a
      Gulf-signed Hormuz text, which Saudi and Bahraini objections just
      blocked). Claims: 8af1d9b9 (hike, 0.55, HIT traj.) vs ec71ce01 (no
      hike, 0.8, MISS traj.); e694f252 (>=70% at every close through 15
      Sep, 0.6 - 100% at the Mon close, HIT traj., scores Wed).
    since: 2026-07-31

  - theme: central-bank-gold-buying
    why: >
      Structural demand floor: ~289t of official demand this cycle with ETF
      inflows resuming beside it, and reserve diversification out of
      Treasuries as the flow-side twin (China's UST holdings lowest since
      2008; China's reserves rose again in August; UBS 9 Sep keeps its
      long-game call). Custody reflex spreading (DNB 86t to London, France
      earlier; Norway's fund weighing 70% -> 50% government bonds). Counter:
      Russia now a steady seller. The floor: 4300 GC (~4260 spot) still
      unclosed-below since 2 Sep. 14 Sep tested it hardest yet: GC low 4305.9
      at 14:06Z on the 50DMA (4310), 6 pts from the line, then +49 to 4354.7
      by 16:51Z - but the bounce tracked Brent's retreat from 109.80 to the
      105.68 settle, so it reads as the oil-rates chain, not an observed
      buyer at the line; spot retested the 4250-4270 mid-August breakout
      zone (low 4253.58, close 4298.8; investinglive: a break puts 4000 in
      play). 66db8e8e (no close <4300 Mon-Tue, 0.55): Monday half held
      (4335.1), Tuesday close pending. Floors 6/6 this regime on distance;
      none has yet shown the buyer on an oil-UP day. Confirms: WGC monthlies
      net buying through the drawdown; a bought dip at 4300 on an oil-UP
      day. Kills: two consecutive months of net official selling.
    since: 2026-07-31

  - theme: warsh-credibility
    why: >
      The debasement channel - the best explanation for gold above $4,000
      against a positive real yield. Warsh chairs a Fed whose independence is
      openly contested while the long end prices distrust: 10y through 5%
      on 14 Sep (first since Oct 2023), 30y 5.35-5.39 (above the 5.31 that
      produced the 19 Aug buyback move), TLT at 2004 lows, buybacks that
      FAILED in public 9-10 Sep. Political pressure explicit (President, VP,
      Bessent, Navarro against a hike); three July dissents for a hike and
      Warsh's Jackson Hole line are the counterweight. A hike delivered
      through this pressure is credibility-positive and bearish gold via
      real yields; a hold that looks coerced is the debasement case. The
      tell is gold rallying WITH yields: printed once (9 Sep), absent since -
      14 Sep was the cleanest counter-example yet (10y to 5% on a
      bear-FLATTENER, 2y +1.8bp / 30y flat, dollar up vs every major, gold
      -1.2%): the front end led, not the long end. One session for, nine
      against. Kills it: a delivered hike that pulls the long end down, or a
      visible re-anchoring of independence. No Fed reply until 16 Sep.
    since: 2026-07-31

  - theme: middle-east-risk-premium
    why: >
      Two regimes: IRGC control of Hormuz transit against a US blockade, with
      open kinetic exchange since 30-31 Aug, and a Red Sea second front. The
      East-West pipeline (Hormuz bypass, 7 mb/d nominal) is SHUT after
      Iraq-launched drones hit two pumping stations 10 Sep; officials
      familiar with the damage assessment now put FULL restoration at 3-5
      weeks - one large pumping station destroyed, a bypass line under
      construction, Aramco shifting barrels to escorted Hormuz loadings
      (Maritime Executive 14 Sep; investinglive relay); Wright says it
      restarts "very soon" (fxempire 14 Sep). Attribution on record: Iraq
      (Saudi FM; Iraqi PM confirmed a Maysan launch); Trump calls Iran
      'probably responsible'. DIPLOMACY: Oman's FM postponed the 14 Sep
      Salalah meeting "in the interests of consensus" (Gulf News 15 Sep);
      Maritime Executive 14 Sep on why: Oman's draft rested on freedom of
      navigation/innocent passage, Iran demanded passage fees and the right
      to vet traffic; Saudi Arabia objected to the technical arrangements,
      Bahrain refused to attend over the Iranian attacks, the UAE was
      expected to share the concerns; Oman had told the GCC it believed the
      US approved; Araghchi (Fars) said the purpose was a joint presentation
      of a corridor agreement; seven Iranian pre-conditions tied to the 17
      June MoU; NO rescheduled date. Iran says an Oman arrangement would not
      reopen Hormuz anyway (Gulf News). US-Iran: investinglive 14 Sep - the
      US seeks a "step-by-step" agreement (Pakistani sources), Trump: the
      conflict "will not be long" and hinted talks could restart (fxempire);
      none of it co-confirmed (24f8b482 HIT traj., closes 16 Sep). Hormuz
      kinetic: CENTCOM disputes the IRGC mine claim on the Panama-flagged El
      Gaia - Iranian missile last month, Iranian drone at the weekend off
      Oman, now under tow (gcaptain 14 Sep); JMIC: three vessels attacked in
      the last 72h, threat SEVERE, mines still possible outside the cleared
      TSS lanes; a fully loaded tanker with a severe fire after a projectile
      late 12 Sep (the Sunday UKMTO report). Iran's PGSA published a list of
      77 vessels accused of violating its protocols - fines, detention or
      confiscation (Gulf News 15 Sep): an enforcement escalation. Traffic
      ~90% below pre-war (UKMTO 11 Sep), facilitated ~20/day vs 6 AIS;
      TankerTrackers weekend: 4 out, 10 in. Red Sea/Saudi: Houthi missiles
      and drones hit Khamis Mushait, Abha and Taif - 13 civilians injured,
      residential damage; coalition spokesman Al Maliki: the response will
      be "responsible and firm"; Saudi strikes on Houthi targets in Yemen
      (Gulf News) - Yemen, not Iran, so e0e5cd9c stands; no Yanbu, port or
      hull hit (47d2085d, 81e84f0c stand). Ladder, each a named claim: Yanbu
      terminal (47d2085d, 18 Sep), Kharg/Larak INFRASTRUCTURE (010cb839, 19
      Sep), Saudi restraint (e0e5cd9c, 20 Sep), US territory (87e409a7, 18
      Sep), Saudi-linked Red Sea hull (81e84f0c, 16 Sep), Pickaxe (e87144df,
      18 Sep), escorts (a0429ae4, 20 Sep), Gulf does not sign Iran's regime
      (a8cf8123, 15 Sep, HIT traj.; successor ffd190c0 to 19 Sep, 0.7),
      meeting materializes (6c6ed87f, 15 Sep, MISS traj.), pipeline not
      restored to full flow (dea6f346, to 18 Sep, 0.65). Markers: a
      rescheduled Salalah date from Oman/GCC (not Tehran), Aramco/SPA on
      the pipeline, UKMTO incident names, CENTCOM statements, any US answer
      to Riyadh, a co-confirmed US-Iran track.
    since: 2026-07-31

  - theme: kinetic-transmission-inverted
    why: >
      The war reaches gold as a Fed hike and a margin call, not as a haven
      bid. NINE sessions of evidence (2, 6, 7, 8, 10, 11 Sep, the 11 Sep NY
      close, the 14 Sep reopen and the full 14 Sep session) against one (9
      Sep). 14 Sep: a Houthi salvo on three Saudi cities, Saudi retaliation
      in Yemen, two hull hits in Hormuz, the pipeline out 3-5 weeks, Brent
      to 109.80 and Murban +7% - and GC closed -1.7% at 4335.1 (low
      4305.9), silver -2%, copper -2.3%, the dollar up vs every major, the
      2y at a new high, the 10y through 5%; the 49-pt bounce off the low
      tracked Brent's retreat from its high, i.e. oil DOWN = gold UP again.
      Tue Asia: GC +0.4% from the settle (4352 at 03:06Z) with the 2y at
      4.671 and Brent +1.2% - 17 pts, inside noise (ATR 106); the stance's
      second-session test (gold up WITH the 2y up -> base 25) needs a CLOSE.
      10 Sep remains the reference escalation session: crude +7%, gold -2%
      with copper, silver and AUD. Confirms: another escalation session
      closing red; gold down on oil-up days and up on oil-down/peace days
      regardless of the Fed leg. Kills it: two consecutive gold-up/2y-up
      sessions, gold UP from a trigger's print to the close on an oil-UP
      session, a supply event traded as stagflation (long end up, dollar
      DOWN, gold up), or hike odds falling on a hold leak with gold rising.
    since: 2026-09-09

  - theme: boj-yen-pillar
    why: >
      The yen was a pillar of the debasement bid: USDJPY pinned at 159-160
      after August's failed intervention. That broke 3 Sep (160.4 -> 155.34)
      and 7-8 Sep (153.3) on cash earnings +4.7%, Q2 GDP +1.4%, Aida expecting
      a September hike; JGB 10y above 3%; Masu 'further hikes needed'; August
      PPI +7.6%. Westpac (actionforex 14 Sep): the move rests on reports that
      Japanese authorities asked domestic institutions to favour the yen plus
      BoJ pricing through mid-2027; it forecasts a SLOW descent to 146 by
      end-2028 - i.e. structural, not a tail. Goldman preview (investinglive
      14 Sep): yen and Nikkei risk building on a faster BoJ path. 14 Sep:
      USDJPY above 155 intraday, 154.86 at 15 Sep 03:30Z (+0.6%) - the yen
      the wrong way for the disorderly tail; window low 153.42 (10 Sep).
      Slot: actionforex 12 Sep said decision Fri 18 Sep 05:30Z / presser
      06:30Z; the feed row (15 Sep) says 02:30Z / 05:30Z - the BoJ has no
      fixed slot; wakeup #56 at 07:30Z sits after both. Cons 1.25% from
      1.00%. The common-US-factor regime overrides the bilateral leg (10 Sep
      lesson). 6ddbe426 (no print <150 through 16 Sep, 0.55) has ~3% of
      room. Disorderly tell (USDJPY <150 with Nikkei and BTC down together)
      not printed; BTC 77.9k after +3.4% on 14 Sep AGAINST a risk-off tape.
      Two-sided for gold: orderly yen-up is dollar-down and gold-up near
      term; a BoJ that can genuinely tighten erodes the pillar structurally.
    since: 2026-09-03

  - theme: energy-pce-passthrough
    why: >
      The bridge from the war to the Fed: oil into CPI is the live hike-odds
      channel, and in this regime oil is gold's price-setter. 14 Sep: Brent
      high 109.80 (15:02Z scan) / 108.41 (Gulf News), ICE Nov settle 105.68
      (CNBC); WTI settle 101.86 (+1.8%), high 104.95; Murban +7% to 127.8
      (+$8.30) - the Gulf physical benchmark is where the stress shows. 15
      Sep 03:30Z: Brent 106.96 (+1.2%), WTI above 102. Barrels missing:
      East-West pipeline out 3-5 weeks for full flow (officials, Maritime
      Executive 14 Sep), Saudi supply ~6 mb/d (IEA), Hormuz transits
      single digits (TankerTrackers weekend: 4 out/10 in vs ~14/day), Iran's
      77-vessel violation list, Houthis hold the Bab el-Mandeb approaches -
      offset by escorted Hormuz exports ~10 mb/d (Wright) and Aramco
      shifting to Hormuz loadings. Oil pared gains late 14 Sep on the
      Pakistani-sourced "step-by-step" line and Trump's talks hint - the
      diplomacy channel still moves oil even unconfirmed. CICC (14 Sep):
      $100 oil brings demand destruction into view (the growth-scare read
      that on 11 Sep meant oil down = gold UP); China August retail sales
      +0.4% vs 0.6%, home prices falling, copper -2.3% through its 200-MA.
      Passthrough: diesel >$6/gal, 30y mortgage >7%, UMich 1y expectations
      4.6%; Lagarde: shock 'longer-lasting'. Claims: b3adcf1e (no WTI settle
      <92 Mon/Tue, 0.6 - Monday 101.86 held, Tuesday pending); 4dfbd1d8
      (Sept headline >=0.4, 0.65); 62c34dbd (core <=0.3, 0.7); dea6f346 (pipeline
      full flow not restored, to 18 Sep, 0.65). Brent 100 is support; no cap written
      (65cd057e lesson).
    since: 2026-07-31

  - theme: us-fiscal-dominance
    why: >
      Treasury's expanded long-dated buybacks (19 Aug) are de facto
      yield-curve control and the market read them as debasement - gold's
      trend regime began as US debt passed $40tn. The tool FAILED IN PUBLIC
      9-10 Sep (30y auction 'poor' at 5.308, yields +8-14bp). 11 Sep: 2y
      +7.8bp, 30y 5.3576 - a bear-flattener; 14 Sep the same shape: 2y
      +1.8bp to 4.662, 10y +1.9bp to 4.994 (5.01 intraday, first since Oct
      2023), 30y 5.354 LITTLE CHANGED (intraday 5.386, rejected 5.40 a
      second time); gold fell with the dollar up - still not the debasement
      signature (gold up WITH yields printed once, 9 Sep). 15 Sep 03:30Z:
      30y 5.369, 10y 5.01, 2y 4.671. Lagarde (12 Sep) named US public
      finances and AI funding as the global term-premium driver. No upsizing
      relayed (52db03df, 0.7, to 18 Sep). Counter-tells: the 9 Sep 10y
      auction stopped through; August deficit $167bn vs $404bn expected (one
      month). DXY closed 99.62 (+0.33%) 14 Sep, 99.58 overnight - 09cb81a7
      (no DXY close >=100 through 16 Sep, 0.6) has 38 pts of room. Watch the
      30y vs 5.40 into the FOMC, TLT, any Bessent line, and whether a
      long-end sell-off ever again comes with gold UP.
    since: 2026-08-20

  - theme: us-canada-trade-war
    why: >
      A tripwire theme, low conviction on magnitude: talks collapsed 23 Aug,
      US 50% tariffs and Canadian retaliation in force; 8 Sep Trump banned
      Canadian autos, dairy and alcohol. Growth hit resolving on the Canadian
      side (August employment -41.7k). 13 Sep: Carney exploring EU
      'associate membership' (WSJ via investinglive/gcaptain) - a realignment
      signal, no gold channel yet. Canada August CPI 3.0% y/y, in line (14
      Sep); WF: BoC on hold. Still no haven flow into gold from it. Promote
      out of tripwire status only if US CPI or a Fed speaker names tariffs
      as a driver; prune candidate Monday 21 Sep if nothing reaches gold.
    since: 2026-08-24
