watchlist:
  - theme: fed-rate-path
    why: >
      Real yields are gold's dominant driver, and this Fed is debating a HIKE,
      not a cut. Sept-hike pricing ran ~35% mid-August -> 58% at the 4 Sep
      close -> 64% after the 10 Sep PPI -> 70% at the 10 Sep close -> 68% pre
      -> 82-90% on the 11 Sep CPI -> ~90% at the 11 Sep NY close
      (investinglive Americas wrap: "the Warsh Fed era will start with a
      hike"). No speaker moved it - the FOMC blackout (5-16 Sep) holds - data
      and oil did. August CPI: headline 0.4/3.4 in line, core 0.3 (0.318) vs
      0.2 with wireless +5.9% m/m a record (~0.1pp; ex-that core on
      consensus), shelter 0.1 -> 0.3, supercore 0.51. 11 Sep close: 2y 4.6275
      (+7.8bp, cycle high, +25bp w/w), 10y 4.971, 30y 5.3576 (-0.3bp) - a
      bear-flattener; UMich 47.8 with 1y inflation expectations 4.6% (from
      4.0), 5y 3.4%. Sell-side: JPMorgan Sept AND Dec; Wells Fargo Sept + a
      2026 median dot at 4.125 (two hikes), "one and done cannot be ruled
      out". Slot VERIFIED 12 Sep: decision Wed 16 Sep 18:00Z, presser 18:30Z
      (wakeup #54, 19:45Z). The decision is priced; the gold variable is the
      forward language and the dots - "further firming" with gold -1% is the
      bearish-rates 65 line, one-and-done with gold up is base 25. Kills the
      hike now: only a Fed-sourced hold leak or an oil crash (on-record
      Hormuz text). Claims: 8af1d9b9 (hike, 0.55, HIT trajectory) vs ec71ce01
      (no hike, 0.8, MISS trajectory); e694f252 (>=70% at every close through
      15 Sep, 0.6; 90% at close one).
    since: 2026-07-31

  - theme: central-bank-gold-buying
    why: >
      Structural demand floor: ~289t of official demand this cycle with ETF
      inflows resuming beside it, and reserve diversification out of
      Treasuries as the flow-side twin (China's UST holdings lowest since
      2008). China's reserves rose again in August (investinglive, 7 Sep);
      UBS (9 Sep) keeps its long-game bullish call on that buying. The
      custody reflex is spreading - the Dutch central bank moved 86t from
      US/Canadian custody to London citing geopolitical unrest; France moved
      earlier; Norway's $2.4tn fund is weighing cutting government bonds
      from 70% to 50% (7 Sep). Counter-signal: Russia, once the top buyer,
      is now a steady seller. The floor was tested from above this week:
      spot closed 4322 on 10 Sep (-$78, no intraday bounce), then the 11 Sep
      hot-CPI print was bought within 35 minutes at 4372-4383 GC and GC
      settled 4408.9 (+1.14%) - cdb1709a (no close <4300) HIT with its own
      breaker fired; floors are 6/6 this regime. Caveat: the 11 Sep bounce
      came through the oil leg (Hormuz-meeting report), not a buyer at the
      line; 4300 GC (~4260 spot) remains untested since 2 Sep and 66db8e8e
      rides on it Mon-Tue. Confirms: WGC monthlies showing net buying
      through this drawdown; a bought dip at 4300 on an oil-UP day. Kills
      it: two consecutive months of net official selling.
    since: 2026-07-31

  - theme: warsh-credibility
    why: >
      The debasement channel - the best explanation for gold holding above
      $4,000 against a positive real yield. Warsh chairs a Fed whose
      independence is openly contested while the long end prices distrust:
      10y 4.97, 30y 5.36 (above the 5.31 level that produced the 19 Aug
      buyback move), TLT at 2004 lows, foreign UST liquidation, and on 9-10
      Sep Treasury buybacks that FAILED to bring yields down (MarketWatch:
      "yields surge after Bessent's beefed-up buyback operation fails to
      calm market"). Political pressure explicit and broad (President, VP,
      Bessent, Navarro all against a hike); three July dissents for a hike
      and Warsh's Jackson Hole line are the counterweight. A hike delivered
      through this pressure is credibility-positive and bearish gold via
      real yields; a hold that looks coerced is the debasement case. The
      tell is gold rallying WITH yields: printed once (9 Sep), reversed 10
      Sep, and did NOT print 11 Sep - gold rose 1.1% with the 2y +8bp but
      the 30y FLAT and the dollar flat, which is the growth-scare/oil-down
      signature, not debasement. The market prices a 90% hike and trades
      gold as a real-yield asset: one session for, six against. Kills it: a
      delivered hike that pulls the long end down, or a visible re-anchoring
      of independence. Blackout means no Fed reply until 16 Sep.
    since: 2026-07-31

  - theme: middle-east-risk-premium
    why: >
      Two regimes: IRGC control of Hormuz transit against a US blockade
      (Operation Economic Outcast), with open kinetic exchange since 30-31
      Aug, and a Red Sea second front that widened decisively last week.
      CONFIRMED 11 Sep: Saudi Aramco's East-West pipeline - the Hormuz
      bypass, 7 mb/d nominal, 4-5 mb/d recently carried per Reuters - is
      SHUT after drone attacks on Thu 10 Sep in the Riyadh and Madinah
      regions (Saudi energy ministry; Reuters-verified satellite; two
      pumping stations hit). Attribution settled on record 12 Sep: drones
      launched from Iraq (Saudi FM; Iraqi PM confirmed a Maysan launch and
      dismissed the provincial commander); Trump separately called Iran
      'probably responsible' (investing.com headline, unread). The
      weekend's two step-backs: Riyadh chose 'not to respond at this
      stage' at Iraq's request while 'reserving the right' (AFP via Gulf
      News), and Trump declined MBS's two requests for US strikes on the
      Houthis - White House: 'enabling regional partners to take the
      lead'; Trump: the Houthis 'called us... letting most ships go
      through... one country they're not too happy with' (CNN via Gulf
      News; AJ). GCC: 'a dangerous escalation'. Bab el-Mandeb: Perim/Mayun
      capture confirmed by a senior Yemeni-government officer and a Houthi
      official (AP, Fri); Hanish and the whole Yemeni Red Sea coast held
      (AJ correspondent); Saree: 'siege for siege' against Saudi vessels
      only; Houthi claim on the Sharurah base, a projectile in Jazan Sat
      (2 injured, Civil Defence), 129 Saudi strikes in 48h per Saree.
      1,400 refugees to Djibouti in 24h; Somali piracy 15 attacks YTD (MT
      Glamour boarding aborted). Diplomacy: Tasnim (via Xinhua/Gulf News,
      13 Sep) describes the Iran-Oman text for Monday's Muscat meeting as
      an entry route 'entirely within Iran's territorial waters', closure
      of the US-escorted southern route once operational, 'in no way means
      the Strait will be opened', seven conditions to the US; Baghaei: 'a
      key step'; Araghchi-Busaidi call Sat (Iranian readout). NO Gulf-side
      on-record confirmation after 48h; wakeup #55. BRICS New Delhi
      Declaration: UAE and Iran co-signed 'maximum restraint' - the Gulf
      hedge signal. Ladder, each a named claim: Yanbu terminal (47d2085d,
      18 Sep), Kharg/Larak INFRASTRUCTURE (010cb839, 19 Sep), a Saudi
      strike on Iran (110d5daa closes 13 Sep; successor e0e5cd9c, 20 Sep),
      a US strike on Iranian territory (e1e9ba8f, 13 Sep; successor
      Monday), a Saudi-linked Red Sea hull (81e84f0c, 16 Sep), Pickaxe
      (e87144df, 18 Sep), escorts (a0429ae4, 20 Sep), Gulf does not sign
      Iran's regime (a8cf8123, 15 Sep). Markers: Gulf-side Muscat readout
      wording (agreed/endorsed vs welcomed/discussed), Aramco/SPA restart
      timeline, the unconfirmed 13 Sep 'new attack on Hormuz shipping'
      report, CENTCOM statements, any US answer to Riyadh.
    since: 2026-07-31

  - theme: kinetic-transmission-inverted
    why: >
      The war reaches gold as a Fed hike and a margin call, not as a haven
      bid. SEVEN sessions of evidence (2, 6, 7, 8, 10, 11 Sep and the 11
      Sep NY close) against one (9 Sep). 11 Sep, both halves: a hot CPI
      core took hike odds 68 -> 90% and gold ROSE 1.1% (GC settle 4408.9)
      because the FT-reported Gulf-Iran Hormuz meeting took $2-3 off crude
      and the 30y from 5.42 to 5.36 - peace = oil down = gold UP through
      the same chain; then the East-West pipeline damage was CONFIRMED in
      the NY afternoon and GC lost ~20 pts in that hour while WTI settled
      -2.4%. The stance's tape clause fired on the letter and failed on
      the sequence - kinetic +5 to 30 only (12 Sep lesson: read the clause
      from the trigger's print time). The weekend (12-13 Sep) printed no
      tape: Tasnim's closure text for Muscat, the US and Saudi step-backs,
      Perim wire-grade - all unpriced. The Sunday-night reopen (22:00Z) is
      the eighth test and the stance's second-session test: gold up WITH
      the 2y up -> base 25 (kills this theme's premise); gold down on an
      oil-up open -> the inversion prints again. No kinetic gap-up claim
      written (7 Sep lesson, 4/4 no-gap weekends). 10 Sep remains the
      reference escalation session: crude +7%, gold -2% with copper,
      silver and AUD. Confirms: another escalation session closing red;
      gold down on oil-up days and up on oil-down/peace days regardless of
      the Fed leg. Kills it: a second consecutive gold-up/2y-up session,
      gold UP from a trigger's print to the close on an oil-UP session, a
      supply event traded as stagflation (long end up, dollar DOWN, gold
      up), or hike odds falling on a hold leak with gold rising.
    since: 2026-09-09

  - theme: boj-yen-pillar
    why: >
      The yen was a pillar of the debasement bid: USDJPY pinned at 159-160
      after August's failed intervention meant carry and fiscal absorption
      outweighed BoJ normalisation, and gold's floor leaned on it. That
      broke 3 Sep (160.4 to 155.34) and 7-8 Sep (153.3) on July cash
      earnings +4.7% y/y, Q2 GDP +1.4%, Aida expecting a September hike;
      JGB 10y above 3% for the first time since 1996; Masu (10 Sep) "further
      hikes needed"; August PPI +7.6% y/y (11 Sep). The yen was the
      strongest major on CPI day (+0.48%; +1.7% w/w), USDJPY 153.55, window
      low 153.42 (10 Sep) - orderly. Slot VERIFIED 12 Sep (actionforex
      calendar): decision Fri 18 Sep 05:30Z, consensus 1.25% from 1.00%,
      presser 06:30Z; wakeup #56 at 07:30Z. Wells Fargo expects +25bp and
      1.75% by April but calls market pricing "too rapid" - the hawkish-hike
      vs dovish-hike split is the event. The common-US-factor regime
      overrides the bilateral leg (10 Sep lesson): the yen strengthened
      into a US hike week only because the 30y/dollar stalled. 6ddbe426 (no
      print <150 through 16 Sep, 0.55) has ~2.3% of room. The disorderly
      tell (USDJPY <150 with Nikkei and BTC down together) has not printed;
      BTC 77.3k (-2.9% w/w). Two-sided for gold: orderly yen-up is
      dollar-down and gold-up near term; a BoJ that can genuinely tighten
      erodes the pillar structurally; the tail is a disorderly unwind of the
      ~$103bn yen short two days after the FOMC.
    since: 2026-09-03

  - theme: energy-pce-passthrough
    why: >
      The bridge from the war to the Fed: oil into CPI is the live
      hike-odds channel, and in this regime oil is gold's price-setter.
      Week to 11 Sep: WTI +9.35% to a 100.05 settle (-2.4% on the day from
      a 104.44 rejection), Brent ~104 after a 109.68 blow-off (10 Sep);
      Murban 122 at the peak. Barrels, not just premium, are missing: the
      East-West pipeline (4-5 mb/d recently carried, Reuters) is shut with
      no restart timeline, IEA puts Saudi supply at 6 mb/d, Hormuz
      transits are single digits and the Houthis hold the Bab el-Mandeb
      approaches with a Saudi-only ban - offset only by escorted Hormuz
      exports >10 mb/d (TankerTrackers) and Fujairah STS. Oil FELL 2-3% on
      the confirmation day because the market priced the FT-reported
      Gulf-Iran meeting as more barrels. The weekend inverted that
      premise: Tasnim's version of the Muscat text CLOSES the US-escorted
      southern route once an Iranian-administered system is operational -
      the >10 mb/d leg, not a reopening - so Monday's base case is the
      peace premium coming back out (Brent 105-110) unless a Gulf-side
      readout signs the Iranian route (transits up, oil down). VLCC rates
      at record highs (gcaptain); Gulf of Oman spill ~400 km2 (AP).
      Passthrough downstream: diesel >$6/gal, 30y mortgage >7%, UMich 1y
      expectations 4.6%; Lagarde (12 Sep): the shock 'will probably last
      longer than we had expected', ECB 'obliged to react'. August CPI
      carried the ~$90 Brent leg (gasoline +3.9%, 0.14pp); September
      carries $100+ (4dfbd1d8: headline >=0.4, 0.65; 62c34dbd: core <=0.3,
      0.7). Demand counter-tells: UMich 47.8, copper -5% from highs, EIA
      soft draws. Claims: b3adcf1e (no WTI settle <92 Mon/Tue, 0.6 - first
      breaker is an on-record corridor arrangement with Iranian assent AND
      a transit surge; a8cf8123 is its diplomatic twin). Brent 100 is
      support; no cap written (65cd057e lesson).
    since: 2026-07-31

  - theme: us-fiscal-dominance
    why: >
      Treasury's expanded long-dated buybacks (19 Aug) are de facto
      yield-curve control, and the market read them as debasement - gold
      flipped into a trend regime as US debt passed $40tn. The tool has
      been tried twice and FAILED IN PUBLIC (9 Sep 'up to $6bn'; 10 Sep
      $5.187bn of 10-20y bought while the $22bn 30y auction stopped 'poor'
      at 5.308 and yields rose 8-14bp). 11 Sep: the front end led again
      (2y +7.8bp) while the 30y closed 5.3576 (-0.3bp; +10.9bp w/w) - a
      bear-flattener that reads as the market pricing a Fed hiking into a
      supply shock as growth-negative, not as debasement; the regime
      signature (gold up WITH yields) has printed once (9 Sep) and
      reversed. External confirmation 12 Sep: Lagarde attributes the rise
      in long rates to 'the state of public finances in general, and in
      the United States in particular' and to AI funding needs 'competing
      with sovereign debt', and calls an AI-valuation correction 'entirely
      possible' - the ECB naming US fiscal as the global term-premium
      driver. August budget deficit $167bn vs $404bn expected - one month,
      tariff receipts likely; not a trend yet. No upsizing relayed
      (52db03df, 0.7, holds to 18 Sep; the 30y gate it named - 5.40 - was
      touched 5.42 intraday 11 Sep and rejected). Counter-tells: the 9 Sep
      $39bn 10y auction stopped through; targets crowded (Citi 4,800 to
      UBS 5,400); Goldman's buy zone at $4,000. Claims: 09cb81a7 (no DXY
      close >=100 through 16 Sep, 0.6; 99.095). Watch the 30y vs 5.40 into
      the FOMC, TLT, the 20y auction, any Bessent line, and whether a
      long-end sell-off ever again comes with gold UP.
    since: 2026-08-20

  - theme: us-canada-trade-war
    why: >
      A tripwire theme, low conviction on magnitude: talks collapsed 23 Aug,
      US 50% tariffs took effect, Canada retaliated in kind. It matters as a
      second protectionism front beside the Iran siege economy, feeding the
      de-globalisation and debasement mix that already sets gold's price.
      Passthrough versus growth is resolving toward the growth hit on the
      Canadian side - August employment -41.7k against +15k consensus -
      which hands the BoC a cut argument. 8 Sep: Trump BANNED Canadian
      autos, dairy and alcohol and ordered GSA to purge Canadian goods; 9-10
      Sep: a further US response to Canada's counter-tariffs, Crown Royal
      carved out; USD/CAD did not blink (CAD -0.26% on CPI day). Canada CPI
      Mon 14 Sep 12:30Z (cons 3.0% y/y, core ~2%; WF: BoC on hold). Still
      no haven flow into gold from it; nothing new 11-12 Sep. Watch
      retaliation scope (energy and USMCA carve-outs), US
      inflation-passthrough chatter, and whether haven flow shows in gold
      rather than only the dollar. Promote it out of tripwire status only
      if US CPI or a Fed speaker names tariffs as a driver.
    since: 2026-08-24
