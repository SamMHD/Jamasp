      closed at 31 Aug).
      19-20 Aug adds: AXIOS DISCLOSURE — US has run a stealth
      southern-channel corridor for WEEKS: nightly convoys of 15-20
      tankers, ~10 mb/d (~half pre-war; 15-20M bbl some nights), Fort
      Bragg task force scheduling, Iran radar/surveillance degraded by a
      prior 2-week CENTCOM campaign (fires drones blind), USAF
      intercepting (8 drones + 2 cruise missiles in one incident) — the
      AIS-based traffic counts massively undercounted actual flow; the
      oil premium is TAIL-priced, not disruption-priced; corridor
