sources:
  # --- news wires (rss) ---
  # fxstreet: removed 2026-07-31 — entire site is behind a Cloudflare
  # bot-challenge (cf-mitigated: challenge on every path, including /),
  # no plain HTTP client can retrieve it, and no alternate feed exists.
  - name: investing_commodities
    type: rss
    url: https://www.investing.com/rss/news_11.rss
    interval_minutes: 15
    topic: gold
  - name: marketwatch_top
    type: rss
    url: https://feeds.content.dowjones.io/public/rss/mw_topstories
    interval_minutes: 15
    topic: markets
  # cnbc_finance / cnbc_economy / mining_com: added 2026-07-31 as
  # DEEP-READABLE sources. investing_commodities (Cloudflare 403) and
  # gnews_gold (Google News consent-wall wrapper URLs) give headline+lede
  # breadth but their article pages can't be fetched by `jamasp extract`;
  # these three fetch AND extract cleanly (verified), so the brief has real
  # article text to deep-read.
  - name: cnbc_finance
    type: rss
    url: "https://search.cnbc.com/rs/search/combinedcms/view.xml?partnerId=wrss01&id=10000664"
    interval_minutes: 15
    topic: markets
  - name: cnbc_economy
    type: rss
    url: "https://search.cnbc.com/rs/search/combinedcms/view.xml?partnerId=wrss01&id=20910258"
    interval_minutes: 30
    topic: macro
  - name: mining_com
    type: rss
    url: https://www.mining.com/feed/
    interval_minutes: 30
    topic: gold
  # kitco: removed 2026-07-31 — every rss path (/rss/, /news/*/rss,
  # /rss/KitcoNews.xml) returns 403 Forbidden; site is bot-protected
  # and no alternate feed exists.
  # gnews_gold: added 2026-07-31 to replace lost gold-topic coverage
  # from fxstreet+kitco — Google News RSS search, no key required.
  - name: gnews_gold
    type: rss
    url: "https://news.google.com/rss/search?q=gold+OR+bullion+market&hl=en-US&gl=US&ceid=US:en"
    interval_minutes: 15
    topic: gold
  - name: fed_press
    type: rss
    url: https://www.federalreserve.gov/feeds/press_all.xml
    interval_minutes: 60
    topic: fed
  - name: treasury_press
    type: rss
    # 2026-07-31: /rss/press.xml (Task 2 URL) now 404s — Treasury retired
    # the press-release-specific feed. /rss.xml is the sitewide feed and
    # is the only working RSS endpoint left on home.treasury.gov; it mixes
    # in non-press content (FAQs, program pages) alongside press releases.
    url: https://home.treasury.gov/rss.xml
    interval_minutes: 60
    topic: fiscal
  # --- prices (price_api) ---
  - name: gold_spot
    type: price_api
    # 2026-07-31: stooq's CSV/quote endpoints now sit behind a client-side
    # JS proof-of-work challenge (see commit 5b3b150); switched to Yahoo
    # Finance's no-key chart API for COMEX gold futures (GC=F), the
    # standard free proxy for spot gold pricing.
    url: "https://query1.finance.yahoo.com/v8/finance/chart/GC=F?range=1d&interval=1h"
    interval_minutes: 15
    topic: prices
    parser: yahoo_chart_json
  - name: dollar_index
    type: price_api
    url: "https://fred.stlouisfed.org/graph/fredgraph.csv?id=DTWEXBGS"
    interval_minutes: 60
    topic: prices
    parser: fred_csv
  - name: real_yield_10y
    type: price_api
    url: "https://fred.stlouisfed.org/graph/fredgraph.csv?id=DFII10"
    interval_minutes: 60
    topic: prices
    parser: fred_csv
  # --- calendars ---
  # ff_calendar: ForexFactory weekly economic calendar mirror (faireconomy
  # media CDN), free JSON, no key. Gives CPI/NFP/FOMC-class events with
  # impact ratings. Refreshed 4x/day; whole-week payload, dedupe by
  # (source, title, starts_at) hash.
  - name: ff_calendar
    type: calendar
    url: "https://nfs.faireconomy.media/ff_calendar_thisweek.json"
    interval_minutes: 360
    topic: macro
    parser: ff_json
