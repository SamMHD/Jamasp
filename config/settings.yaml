timezone: Asia/Dubai
inbox_cap: 120
extract_max_chars: 16000
# Agent-facing `jamasp extract` re-fetches a cached page older than this.
# Index and section pages are rewritten continuously, so a replayed snapshot
# reads a days-old tape as live (16 Aug: a 13 Aug AJ index served as fresh).
# flash's article-body extracts are unaffected — bodies don't change.
extract_max_age_hours: 6
digest:
  claude_cmd: ["claude", "-p", "--model", "haiku"]
  batch_max_items: 60
cluster:
  similarity_threshold: 80
  window_hours: 48
telegram:
  bot_token_env: JAMASP_TG_TOKEN
  chat_id_env: JAMASP_TG_CHAT
  news_chat_id_env: JAMASP_TG_NEWS_CHAT
predictions:
  price_symbol: GC
runs:
  claude_cmd: ["claude", "-p", "--dangerously-skip-permissions", "--model", "fable", "--effort", "xhigh"]
  max_agent_runs_per_day: 20
  timeouts_seconds:
    brief: 900
    deepdive: 900
    scan: 300
    retro: 1200
flash:
  enabled: true
  max_age_hours: 6
  max_posts_per_tick: 10
  classify_batch_max: 30
  extract_chars: 4000
  decide_cmd: ["claude", "-p", "--model", "sonnet"]
  write_cmd: ["claude", "-p", "--model", "sonnet"]
  # Tiering (docs/superpowers/specs/2026-08-17-flash-tiering-design.md).
  # At or above post_tier_min goes straight to the channel; at or above
  # rollup_tier_min waits for a rollup; below that never reaches the channel
  # but stays in the DB for inbox/brief/scan. Thresholds live here because the
  # tier definitions are a judgement to tune once a week of tier data exists.
  post_tier_min: 4
  rollup_tier_min: 3
  # Fewer than this many held stories in a window: skip the send and let them
  # roll into the next one. A near-empty rollup costs more attention than it
  # returns. The times themselves are the timer's business, not the code's —
  # see ops/systemd/jamasp-flash-rollup.timer.
  rollup_min_items: 3
  # Ceiling per rollup. Telegram hard-rejects past 4096 chars and a rejected
  # send leaves every item held, so an uncapped backlog wedges the rollup for
  # good. Anything over the cap is carried, named in the message, and goes out
  # at the head of the next window.
  rollup_max_items: 20
  rollup_cmd: ["claude", "-p", "--model", "sonnet"]
translate:
  # Panel i18n. Deterministic pipeline stage on its own 10-minute timer:
  # consumes no agent-run budget, and never wrapped by `jamasp run`.
  #
  # codex rather than claude because translation is the highest-volume model
  # consumer in the system and must not compete with the agent-run cap or the
  # flash pass for Claude quota. `protocol` picks how the answer is read:
  # 'codex' uses --output-schema/-o files, 'stdout' parses stdout (claude -p).
  cmd: ["codex", "exec", "--ephemeral", "--skip-git-repo-check",
        "--ignore-user-config", "-s", "read-only"]
  protocol: codex
  timeout_seconds: 180
  # Cost knobs. window_days matches the map's widest window; everything older
  # renders English-with-marker in the panel. max_batches_per_run bounds one
  # tick — a larger backlog drains over subsequent ticks, newest first.
  # Hard floor under the rolling window: nothing published before this date is
  # ever translated. Set to the day the desk turned the timer on, because the
  # rolling window is also a BACKFILL instruction -- pointed at months of
  # history it works through every item in the last window_days, which on this
  # host was ~2,800 rows and exhausted the codex quota on the first day. Clear
  # this key to restore the plain rolling window for a deliberate, supervised
  # backfill.
  translate_from: "2026-09-21"
  window_days: 7
  batch_size: 20
  max_batches_per_run: 6
  # The same kind of ceiling for the document pass, counted across the whole
  # of it (stance sections, playbook, watchlist entries, prediction lines and
  # reports together). Without one, a document the translator always refuses
  # costs a call every tick forever, and the first run after a deploy makes
  # one serial call per historical prediction line. 10 covers a brief that
  # rewrote every stance section plus its report in a single tick; anything
  # left over is picked up ten minutes later. Keep this consistent with
  # TimeoutStartSec in ops/systemd/jamasp-translate.service.
  max_doc_calls_per_run: 10
  # Spec decision 18: new reports only. Set to the date this shipped.
  reports_since: "2026-09-13"
