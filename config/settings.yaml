timezone: Asia/Dubai
inbox_cap: 120
extract_max_chars: 16000
# Agent-facing `jamasp extract` re-fetches a cached page older than this.
# Index and section pages are rewritten continuously, so a replayed snapshot
# reads a days-old tape as live (16 Aug: a 13 Aug AJ index served as fresh).
# flash's article-body extracts are unaffected — bodies don't change.
extract_max_age_hours: 6
digest:
  claude_cmd: ["claude", "-p", "--model", "haiku"]
  batch_max_items: 60
cluster:
  similarity_threshold: 80
  window_hours: 48
telegram:
  bot_token_env: JAMASP_TG_TOKEN
  chat_id_env: JAMASP_TG_CHAT
  news_chat_id_env: JAMASP_TG_NEWS_CHAT
predictions:
  price_symbol: GC
runs:
  claude_cmd: ["claude", "-p", "--dangerously-skip-permissions", "--model", "fable", "--effort", "xhigh"]
  max_agent_runs_per_day: 20
  timeouts_seconds:
    brief: 900
    deepdive: 900
    scan: 300
    retro: 1200
flash:
  enabled: true
  max_age_hours: 6
  max_posts_per_tick: 10
  classify_batch_max: 30
  extract_chars: 4000
  decide_cmd: ["claude", "-p", "--model", "sonnet"]
  write_cmd: ["claude", "-p", "--model", "sonnet"]
  # Tiering (docs/superpowers/specs/2026-08-17-flash-tiering-design.md).
  # At or above post_tier_min goes straight to the channel; at or above
  # rollup_tier_min waits for a rollup; below that never reaches the channel
  # but stays in the DB for inbox/brief/scan. Thresholds live here because the
  # tier definitions are a judgement to tune once a week of tier data exists.
  post_tier_min: 4
  rollup_tier_min: 3
  # Fewer than this many held stories in a window: skip the send and let them
  # roll into the next one. A near-empty rollup costs more attention than it
  # returns. The times themselves are the timer's business, not the code's —
  # see ops/systemd/jamasp-flash-rollup.timer.
  rollup_min_items: 3
  # Ceiling per rollup. Telegram hard-rejects past 4096 chars and a rejected
  # send leaves every item held, so an uncapped backlog wedges the rollup for
  # good. Anything over the cap is carried, named in the message, and goes out
  # at the head of the next window.
  rollup_max_items: 20
  rollup_cmd: ["claude", "-p", "--model", "sonnet"]
translate:
  # Panel i18n. Deterministic pipeline stage on its own 10-minute timer:
  # consumes no agent-run budget, and never wrapped by `jamasp run`.
  #
  # codex rather than claude because translation is the highest-volume model
  # consumer in the system and must not compete with the agent-run cap or the
  # flash pass for Claude quota. `protocol` picks how the answer is read:
  # 'codex' uses --output-schema/-o files, 'stdout' parses stdout (claude -p).
  cmd: ["codex", "exec", "--ephemeral", "--skip-git-repo-check",
        "--ignore-user-config", "-s", "read-only"]
  protocol: codex
  timeout_seconds: 180
  # Cost knobs. scored_only (below) is the actual backlog bound now;
  # window_days is kept equal to the map's own widest range (MapRange: 24h or
  # week) so the two agree by construction rather than by coincidence, not
  # because window_days does the bounding itself — everything outside it
  # still renders English-with-marker in the panel. max_batches_per_run
  # bounds one tick — a larger backlog drains over subsequent ticks, newest
  # first.
  #
  # The map is the only surface we are PAYING to translate for — a
  # deliberate desk choice, not a technical limit. It joins item_scores onto
  # items (getScoredItems, panel/lib/db.ts), and this key mirrors that join
  # so translation spend tracks it. It is NOT the only panel surface that
  # reads headline_fa/lede_fa: the inbox and the dashboard's cluster/top-
  # story views (getItems, getClusterHeads, topStory — panel/lib/db.ts) read
  # them too, over plain `SELECT * FROM items` with no item_scores join. A
  # Persian viewer will keep seeing the English-with-EN-marker fallback on
  # the inbox and dashboard for any unscored item, however recent it is —
  # this key does not close that gap, it only decides what we pay for. Ties
  # spend to VISIBILITY rather than recency for the map itself — measured on
  # the live host, the 7-day pending backlog was 1,971 items under the plain
  # rolling window; only 814 of the window's 1,332 scored items were
  # untranslated, a 59% cut. Leaves the events pass untouched: calendar
  # events are not map news, and there are only ~194 of them. Absent means
  # the old "everything in the window" behaviour.
  scored_only: true
  # Hard floor under the rolling window, SUPERSEDED by scored_only above and
  # deliberately left empty. This bounded the backlog by RECENCY — added to
  # stop a runaway ~2,800-item backfill exhausting the codex quota on the
  # first day — but scored_only bounds it by VISIBILITY instead, which is the
  # rule the desk actually wants: the map's full history is meant to
  # backfill, not stay walled off behind a date. floor_for() stays wired and
  # tested; it is still the right tool if a date bound is ever wanted again —
  # set a value here (or restore one) to use it.
  translate_from:
  window_days: 7
  batch_size: 20
  max_batches_per_run: 6
  # The same kind of ceiling for the document pass, counted across the whole
  # of it (stance sections, playbook, watchlist entries, prediction lines and
  # reports together), in CHUNKS — a document over doc_chunk_bytes below
  # costs one call per chunk, not one call. Without a ceiling, the first run
  # after a deploy makes one serial call per historical prediction line.
  #
  # 10 no longer covers a brief that rewrote every stance section plus its
  # report in a single tick: a 21KB report is now ~8 calls rather than 1, so
  # a heavy day converges over two ticks (20 minutes) instead of one. That is
  # the deliberate trade — before chunking that report took ONE call and then
  # timed out, every tick, forever. Left at 10 rather than raised because
  # TimeoutStartSec in ops/systemd/jamasp-translate.service is sized from
  # this number times timeout_seconds (10 x 180 = 30 minutes, inside the
  # 40-minute limit); raise both together or neither.
  #
  # A single document needing MORE chunks than this whole ceiling is let
  # through anyway (see DocBudget.take): it could never fit, and refusing it
  # every tick would be permanent starvation reported as a deferral.
  max_doc_calls_per_run: 10
  # Above this many bytes of UTF-8 source, a document is translated section
  # by section instead of in one call. MEASURED on the live host on
  # 2026-09-14..16 at timeout_seconds 180:
  #
  #   2026-09-14-brief.md  11,362 bytes  -> succeeded
  #   2026-09-15-brief.md  11,455 bytes  -> succeeded
  #   2026-09-16-brief.md  21,728 bytes  -> FAILED, translator timed out
  #
  # Everything above roughly 12,000 bytes timed out the same way, and the
  # pending reports ran 19,767 to 26,968 bytes — so not one of them could
  # ever have succeeded, and a two-hour --force run produced zero new report
  # sidecars while burning a call per attempt. This is why the timer was
  # disabled.
  #
  # 8,000 rather than 12,000 because 12,000 is where it BROKE, not where it
  # is safe: the two that succeeded were within 5% of the break, and a
  # 180-second wall clock moves with model load. Two-thirds of the break
  # point leaves the largest section anyone has actually written (the
  # 8,434-byte FOMC deep dive of 2026-09-16) a two-chunk split rather than a
  # twenty-chunk one. Absent means the same 8,000 — NOT "never chunk", which
  # is the bug this key exists to fix.
  doc_chunk_bytes: 8000
  # Spec decision 18: new reports only. Set to the date this shipped.
  reports_since: "2026-09-13"
