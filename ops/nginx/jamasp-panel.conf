# Jamasp panel — public vhost.
# Install to /etc/nginx/sites-available/jamasp-panel.conf, symlink into
# sites-enabled. Real client IPs are restored by the generated snippet
# /etc/nginx/conf.d/cloudflare-real-ip.conf (see refresh-cf-ranges.sh),
# which nginx picks up from conf.d automatically.
#
# The panel lives at jamasp.mkagent.co. jamasp.mahdanian.xyz was the original
# hostname and now 301s there, so bookmarks and the links in published reports
# keep working.
#
# TLS is a **Cloudflare Origin CA** certificate (one cert, both hostnames in
# its SAN, expires 2041-09-21), not Let's Encrypt. That is deliberate: the
# nftables lockdown accepts 80/443 only from Cloudflare's ranges, so the edge
# proxy is the only thing that ever completes a handshake here, and Cloudflare
# trusts its own Origin CA. A publicly-trusted cert bought nothing and cost a
# renewal path that broke silently — the DNS-01 token was pinned to the host's
# IPv4 while the host had begun egressing over IPv6, so `certbot renew` had
# been failing and the cert would have expired 2026-11-06. Origin CA has no
# renewal, no timer and no API token to go stale.
#
# Consequence worth knowing: a direct-to-origin check needs `curl -k`, because
# this chain is trusted by Cloudflare rather than by a public root store.

# Anything that arrives without a hostname we recognise gets nothing at all.
server {
    listen      80  default_server;
    listen      [::]:80 default_server;
    server_name _;
    return 444;
}

server {
    listen      443 ssl default_server;
    listen      [::]:443 ssl default_server;
    server_name _;

    ssl_certificate     /etc/ssl/certs/jamasp-origin.pem;
    ssl_certificate_key /etc/ssl/private/jamasp-origin.key;

    return 444;
}

# Plaintext on either hostname goes straight to the canonical HTTPS host.
server {
    listen      80;
    listen      [::]:80;
    server_name jamasp.mkagent.co jamasp.mahdanian.xyz;
    return 301 https://jamasp.mkagent.co$request_uri;
}

# The original hostname. No auth here on purpose: a redirect discloses nothing
# but the new hostname, and Cloudflare Access still gates this hostname at the
# edge. Keeping the vhost is what stops old bookmarks dying.
server {
    listen      443 ssl;
    listen      [::]:443 ssl;
    http2       on;
    server_name jamasp.mahdanian.xyz;

    ssl_certificate     /etc/ssl/certs/jamasp-origin.pem;
    ssl_certificate_key /etc/ssl/private/jamasp-origin.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    return 301 https://jamasp.mkagent.co$request_uri;
}

server {
    listen      443 ssl;
    listen      [::]:443 ssl;
    http2       on;
    server_name jamasp.mkagent.co;

    ssl_certificate     /etc/ssl/certs/jamasp-origin.pem;
    ssl_certificate_key /etc/ssl/private/jamasp-origin.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "DENY"    always;

    # Either a valid Cloudflare Access JWT or the basic auth password gets
    # you in. In normal browser use the JWT satisfies this and no password is
    # ever requested; basic auth is the fallback for when Access is
    # unavailable, misconfigured, or the sidecar is down.
    satisfy any;
    auth_request         /_access-check;
    auth_basic           "Jamasp";
    auth_basic_user_file /etc/nginx/jamasp.htpasswd;

    client_max_body_size 2m;

    access_log /var/log/nginx/jamasp-panel.access.log;
    error_log  /var/log/nginx/jamasp-panel.error.log;

    # Access JWT validation, via the localhost sidecar (jamasp-authd).
    location = /_access-check {
        internal;
        proxy_pass              http://127.0.0.1:3301/auth;
        proxy_pass_request_body off;
        proxy_set_header        Content-Length "";
        proxy_connect_timeout   1s;
        proxy_read_timeout      2s;

        # Load-bearing. Under `satisfy any` nginx only treats 401 and 403 as
        # "denied, try the next handler". A 5xx — which is what a refused,
        # hung or dead sidecar produces — finalises the request instead,
        # bypassing basic auth and turning "authd is down" into a hard 500
        # for everyone, including someone typing the correct password. Map it
        # to a denial so the fallback still runs.
        error_page 500 502 503 504 = @access_denied;
    }

    location @access_denied {
        internal;
        return 403;
    }

    location / {
        proxy_pass http://127.0.0.1:3300;
        proxy_http_version 1.1;

        # Next.js Server Actions compare Origin against the forwarded host.
        # Get these wrong and every page renders while every button fails.
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;

        proxy_read_timeout 120s;
    }
}
