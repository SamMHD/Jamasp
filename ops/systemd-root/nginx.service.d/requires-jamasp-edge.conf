# M2 fix: `Before=jamasp-edge.service` on the nginx side (or, as originally
# written, only `Before=nginx.service` on the jamasp-edge side) is pure
# ordering, not a dependency — if `nft -f` fails, nginx starts anyway and
# the origin listens on 80/443 with no lockdown at all. Requires= makes
# nginx refuse to start unless jamasp-edge started successfully.
#
# Install to /etc/systemd/system/nginx.service.d/requires-jamasp-edge.conf
# and `systemctl daemon-reload`.
#
# Recovery if jamasp-edge fails: nginx will (by design) refuse to start.
# Fix the Cloudflare range fetch (see refresh-cf-ranges.sh / its cache at
# /var/lib/jamasp/cf-ranges.v4|v6), then:
#   systemctl start jamasp-edge nginx
[Unit]
Requires=jamasp-edge.service
After=jamasp-edge.service
