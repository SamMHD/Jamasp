# Alert when a certificate renewal fails.
#
# Install to /etc/systemd/system/certbot.service.d/onfailure.conf — certbot
# ships its own unit, so this is a drop-in rather than a replacement. Sits
# alongside ipv4-only.conf in the same directory.
#
# This is the slowest-burning failure on the host: a renewal that stops
# working is invisible until the certificate actually expires, and by then
# the panel is down. certbot.service has still never run for real (renewal
# starts ~30 days before expiry), so this alert is the only thing standing
# between a broken renewal and an outage.
[Unit]
OnFailure=jamasp-alert@%n.service
